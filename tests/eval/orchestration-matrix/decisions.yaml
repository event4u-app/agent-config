# Orchestration dispatch-decision matrix (road-to-tested-routing Phase 6).
#
# Data-driven rows over the three deterministic routing functions —
# classifyTask (delegable? which mode?), inferSliceTier (lite/medium/inherit),
# resolveSubagentRouting (tier/model/quota) — plus the lookup-class layer
# (classifyLookup). Same discipline as tests/eval/routing-matrix/: positives
# AND pinned near-misses (decisions that must NOT fire). Executed by
# tests/scripts/orchestration_routing_matrix.test.ts against the real libs.

classify:
  - name: activation gate — emergency halt short-circuits in-session
    signals: { size_estimate: 10, ordered_plan: true }
    activation: { halted: true, subagent_spawn: true }
    expect: { delegable: false, action: in-session, mode: null }
  - name: activation gate — host without subagent_spawn stays in-session
    signals: { size_estimate: 10, independent_slices: 4 }
    activation: { halted: false, subagent_spawn: false }
    expect: { delegable: false, action: in-session, mode: null }
  - name: near-miss — trivial task below the size floor never delegates
    signals: { size_estimate: 1, independent_slices: 4 }
    activation: { halted: false, subagent_spawn: true }
    expect: { delegable: false, action: in-session, mode: null }
  - name: ordered plan dispatches do-in-steps (always-on, no mode setting)
    signals: { size_estimate: 8, ordered_plan: true }
    activation: { halted: false, subagent_spawn: true }
    expect: { delegable: true, action: dispatch, mode: do-in-steps }
  - name: declared parallelizable files dispatches do-in-parallel
    signals: { size_estimate: 8, parallelizable: files }
    activation: { halted: false, subagent_spawn: true }
    expect: { delegable: true, action: dispatch, mode: do-in-parallel }
  - name: independent slices >= 2 dispatch do-in-parallel
    signals: { size_estimate: 6, independent_slices: 5 }
    activation: { halted: false, subagent_spawn: true }
    expect: { delegable: true, action: dispatch, mode: do-in-parallel }
  - name: near-miss — a single slice is not a parallel signal
    signals: { size_estimate: 6, independent_slices: 1 }
    activation: { halted: false, subagent_spawn: true }
    expect: { delegable: false, action: ask, mode: null }
  - name: near-miss — ambiguity is always an ask verdict, never a speculative spawn
    signals: { size_estimate: 9 }
    activation: { halted: false, subagent_spawn: true }
    expect: { delegable: false, action: ask, mode: null }

tier:
  - name: read-only fan-out infers lite
    signals: { slice_type: read-only-fanout }
    expect: { tier: lite, tier_source: inferred }
  - name: mechanical slice with coverage infers lite
    signals: { slice_type: mechanical-covered }
    expect: { tier: lite, tier_source: inferred }
  - name: guard — mechanical slice beyond the envelope revokes lite
    signals: { slice_type: mechanical-covered, exceeds_mechanical_envelope: true }
    expect: { tier: medium, tier_source: inferred }
  - name: guard — read-only fan-out beyond the envelope revokes lite
    signals: { slice_type: read-only-fanout, exceeds_mechanical_envelope: true }
    expect: { tier: medium, tier_source: inferred }
  - name: mutating slice without coverage infers medium
    signals: { slice_type: mutating-uncovered }
    expect: { tier: medium, tier_source: inferred }
  - name: synthesis slice infers medium
    signals: { slice_type: synthesis }
    expect: { tier: medium, tier_source: inferred }
  - name: near-miss — unknown slice type inherits, never guesses down
    signals: { slice_type: something-new }
    expect: { tier: inherit, tier_source: inherit }

routing:
  - name: downshift routes an inferred lite task below the session tier
    inputs:
      task_tier: lite
      session_tier: high
      downshift: true
      quota_arbitrage: false
      model_map: { lite: cheap-alias, medium: mid-alias, high: strong-alias }
      separate_quota_pool: false
      task_tier_origin: inferred
    expect: { tier: lite, model: cheap-alias, quota_pool: shared, tier_source: inferred }
  - name: near-miss — downshift off runs on the session tier
    inputs:
      task_tier: lite
      session_tier: high
      downshift: false
      quota_arbitrage: false
      model_map: { lite: cheap-alias, medium: mid-alias, high: strong-alias }
      separate_quota_pool: false
    expect: { tier: high, model: strong-alias, quota_pool: shared, tier_source: inherit }
  - name: near-miss — an inherit task never downshifts
    inputs:
      task_tier: inherit
      session_tier: medium
      downshift: true
      quota_arbitrage: false
      model_map: { lite: cheap-alias, medium: mid-alias, high: strong-alias }
      separate_quota_pool: false
    expect: { tier: medium, model: mid-alias, quota_pool: shared, tier_source: inherit }
  - name: quota arbitrage needs BOTH the setting and the host pool
    inputs:
      task_tier: lite
      session_tier: high
      downshift: true
      quota_arbitrage: true
      model_map: { lite: cheap-alias, medium: mid-alias, high: strong-alias }
      separate_quota_pool: true
      task_tier_origin: static
    expect: { tier: lite, model: cheap-alias, quota_pool: separate, tier_source: static }
  - name: near-miss — quota arbitrage without a host pool stays shared
    inputs:
      task_tier: lite
      session_tier: high
      downshift: true
      quota_arbitrage: true
      model_map: { lite: cheap-alias, medium: mid-alias, high: strong-alias }
      separate_quota_pool: false
      task_tier_origin: static
    expect: { tier: lite, model: cheap-alias, quota_pool: shared, tier_source: static }

lookup:
  # The code-graph primitive is an OPPORTUNISTIC ACCELERANT gated on
  # `hooks.code_graph.enabled`, which is what the contract has always said and
  # what `classifyLookup` did not do until
  # road-to-inbox-harvest-2026-08-f-code-graph-evidence-refresh 2.1. With the
  # flag off — the default, and the state of this repository — a
  # definition/reference lookup routes to capped grep, which is the arm the only
  # measurement that exists says wins (recall 0.797 vs the graph's 0.365).
  #
  # Both directions are pinned below: the class is still recognised, and the
  # primitive follows the flag rather than being hardcoded either way.
  - name: definition lookup is recognised and routes to grep while the graph is gated off
    task: "Where is resolveSubagentRouting defined?"
    expect: { route: primitive, primitive: fts-or-capped-grep }
  - name: references lookup is recognised and routes to grep while the graph is gated off
    task: "Who calls resolve_canary_name across the repo?"
    expect: { route: primitive, primitive: fts-or-capped-grep }
  - name: string-existence lookup routes to FTS/capped grep
    task: "Does the string 'budget_routing' exist anywhere in src?"
    expect: { route: primitive, primitive: fts-or-capped-grep }
  - name: report-run lookup routes to script-run with rtk wrap
    task: "Run the coverage report for the hooks package."
    expect: { route: primitive, primitive: script-run-rtk }
  - name: near-miss — a refactor task escalates to normal classification
    task: "Refactor the settings loader to support per-tier budgets."
    expect: { route: escalate, primitive: null }
