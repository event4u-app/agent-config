rule: missing-tool-handling
positives:
  - prompt: "zsh says command not found when I run terragrunt - what now?"
  - prompt: "The linter is not installed in this environment, how should we proceed?"
  - prompt: "Beim Ausführen kommt command not found für jq - was tun?"
