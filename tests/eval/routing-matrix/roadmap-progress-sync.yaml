rule: roadmap-progress-sync
positives:
  - prompt: "Flip the checkbox for the step we just finished."
    open_files: ["agents/roadmaps/archive/road-to-tested-routing.md"]
  - prompt: "Continue with the next open step of the plan."
    command: "/roadmap:process-step"
  - prompt: "Bitte hake den erledigten Schritt in der Roadmap ab."
    open_files: ["agents/roadmaps/road-to-renewal-foundation.md"]
near_misses:
  - prompt: "Update the project plan document with the new milestones."
  - prompt: "Regenerate the docs index after the restructuring."
    open_files: ["docs/roadmap-overview.md"]
