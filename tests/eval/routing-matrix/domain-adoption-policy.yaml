rule: domain-adoption-policy
positives:
  - prompt: "Should we open a mobile track with React Native skills?"
    expected_skills: []
  - prompt: "Someone requested an ML track - do we have the demand signal for it?"
    expected_skills: []
  - prompt: "Sollen wir einen Blockchain Track im Paket aufmachen?"
    expected_skills: []
  - prompt: "Draft the first skill for the new domain."
    expected_skills: [skill-writing]
    open_files: ["src/skills/flutter-setup/SKILL.md"]
near_misses:
  - prompt: "Add another Laravel skill to the existing PHP set."
    expected_skills: [skill-writing]
  - prompt: "Which domains does the suite already cover today?"
    expected_skills: []
