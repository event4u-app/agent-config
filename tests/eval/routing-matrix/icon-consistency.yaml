rule: icon-consistency
positives:
  - prompt: "Which icon set should the settings screen use?"
    expected_skills: [iconography]
  - prompt: "We're mixing Lucide and Heroicons - consolidate, please."
    expected_skills: [iconography]
  - prompt: "Welche Icons nehmen wir für die neue Navigation?"
    expected_skills: [iconography]
near_misses:
  - prompt: "Pick a consistent illustration style for the empty states."
    expected_skills: [design-intelligence]
  - prompt: "The button glyphs look blurry on retina displays - can you fix the SVG export?"
    expected_skills: []
