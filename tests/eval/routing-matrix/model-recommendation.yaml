rule: model-recommendation
positives:
  - prompt: "Which model should I use for this large refactoring session?"
    expected_skills: []
  - prompt: "Starting a new task: port the billing exporter to TypeScript."
    expected_skills: [code-refactoring]
  - prompt: "Setz bitte model_tier auf reasoning für diesen Command."
    expected_skills: [command-writing]
near_misses:
  - prompt: "Update the data schema of the reporting module before the release."
    expected_skills: [migration-architect, schema-review]
  - prompt: "Schedule the nightly batch run for the recommendation engine."
    expected_skills: [laravel-scheduling]
