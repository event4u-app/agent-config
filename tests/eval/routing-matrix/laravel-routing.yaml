rule: laravel-routing
positives:
  - prompt: "Add an Eloquent scope for active users on the User model."
    expected_skills: [eloquent]
  - prompt: "Create a FormRequest for the checkout endpoint validation."
    expected_skills: [laravel-validation]
  - prompt: "Wie definiere ich in Laravel einen Job, der stündlich läuft?"
    expected_skills: [laravel-scheduling, jobs-events]
near_misses:
  - prompt: "Add request validation to the checkout endpoint of our PHP backend."
    expected_skills: [laravel-validation]
  - prompt: "How do I schedule an hourly cron job on the staging server?"
    expected_skills: []
  - prompt: "Take a pass over our Express API in services/api and map how the middleware stack is ordered before I move the auth check."
    expected_skills: [project-analysis-node-express]
  - prompt: "I inherited a 40k-line Node backend with no docs. Walk me through the boot sequence and where incoming requests actually get handled."
    expected_skills: [project-analysis-node-express]
  - prompt: "Kannst Du unser Node-Backend durchgehen und mir die Struktur erklaeren: Routing, Datenzugriff und wo ueberall die Auth haengt?"
    expected_skills: [project-analysis-node-express]
  - prompt: "Before a second team joins this repo I want a full read of the Express app — routes, error handling and the data layer."
    expected_skills: [project-analysis-node-express]
