rule: skill-quality
positives:
  - prompt: "Tighten the validation section of this skill."
    open_files: ["src/skills/laravel/SKILL.md"]
  - prompt: "Is the frontmatter on this skill schema-complete?"
    open_files: ["src/skills/docker/SKILL.md"]
  - prompt: "Kürze die Beschreibung dieses Skills auf unter 200 Zeichen."
    open_files: ["src/skills/php-coder/SKILL.md"]
near_misses:
  - prompt: "What makes a good skill description in general?"
  - prompt: "Update the checklist in this guideline."
    open_files: ["docs/guidelines/agent-infra/skill-quality-checklist.md"]
