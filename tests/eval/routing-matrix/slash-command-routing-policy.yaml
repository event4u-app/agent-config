  - prompt: "What does /commit do differently from committing manually?"
  - prompt: "Bitte führe /commit:in-chunks für die offenen Änderungen aus."
near_misses:
  - prompt: "Commit the changes in logical chunks when you are ready."
  - prompt: "Create a pull request with a proper description for this branch."
