rule: slash-command-routing-policy
positives:
  - prompt: "Run /create-pr for the current branch once the checks are green."
    expected_skills: [command-routing, requesting-code-review]
  - prompt: "What does /commit do differently from committing manually?"
    expected_skills: [command-routing]
  - prompt: "Bitte führe /commit:in-chunks für die offenen Änderungen aus."
    expected_skills: [command-routing]
near_misses:
  - prompt: "Commit the changes in logical chunks when you are ready."
    expected_skills: [conventional-commits-writing, git-workflow]
  - prompt: "Create a pull request with a proper description for this branch."
    expected_skills: [requesting-code-review, review-routing, git-workflow]
