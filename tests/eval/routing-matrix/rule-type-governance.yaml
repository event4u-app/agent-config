rule: rule-type-governance
positives:
  - prompt: "Should this rule be always-on or trigger-based?"
    open_files: ["src/rules/token-efficiency.md"]
  - prompt: "Draft the trigger set for this new guard."
    open_files: ["src/rules/new-guard.md"]
  - prompt: "Passt der Typ dieser Regel noch, oder sollte sie auf auto wechseln?"
    open_files: ["src/rules/commit-policy.md"]
near_misses:
  - prompt: "Should this guideline become an always-active constraint?"
    open_files: ["docs/guidelines/agent-infra/size-and-scope.md"]
  - prompt: "Tighten the wording of the linter error message."
    open_files: ["src/scripts/lint_rules.ts"]
