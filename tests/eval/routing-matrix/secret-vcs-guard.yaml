rule: secret-vcs-guard
positives:
  - prompt: "I need to commit the .env changes - is that safe?"
  - prompt: "Is it OK to git add the config with the API key inside?"
  - prompt: "Darf ich den API Key einfach in die Config schreiben und dann git add ausführen?"
near_misses:
  - prompt: "Encrypt the backup archives before uploading them to S3."
  - prompt: "Rotate the signing material for the release artifacts."
