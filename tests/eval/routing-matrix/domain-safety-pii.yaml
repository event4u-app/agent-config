    expected_skills: []
  - prompt: "Log the user id and email when checkout fails."
    expected_skills: [privacy-review]
  - prompt: "Schreib eine Rejection Email für den Kandidaten aus der zweiten Runde."
    expected_skills: []
near_misses:
