rule: lethal-trifecta-guard
positives:
  - prompt: "This skill should fetch and send the summary to our webhook automatically."
    expected_skills: [skill-writing, agent-security-review]
  - prompt: "Could untrusted content from the scraped page end up in the outbound request?"
    expected_skills: [data-flow-mapper, threat-modeling]
  - prompt: "Prüfe den neuen Command auf Exfiltration-Risiken, bevor wir ihn freigeben."
    expected_skills: [agent-security-review, threat-modeling]
  - prompt: "Review the new skill draft for safety."
    expected_skills: [agent-security-review, skill-reviewer]
    open_files: ["src/skills/web-digest/SKILL.md"]
near_misses:
  - prompt: "Cache the parsed config so we do not re-read it every turn."
    expected_skills: []
  - prompt: "Add retry logic to the flaky integration test."
    expected_skills: [testing-anti-patterns]
