rule: provider-lifecycle-discipline
positives:
  - prompt: "Which provider should /image:create default to for banner renders?"
    expected_skills: [image-provider-routing, brand-asset-generation]
  - prompt: "Update the retry handling in this rendering script."
    expected_skills: [error-handling-patterns]
    open_files: ["scripts/ai-video/adapters/kling.sh"]
  - prompt: "Welcher Provider ist stabil genug für den Renderjob heute Nacht?"
    expected_skills: [image-provider-routing]
near_misses:
  - prompt: "Render the storyboard frames with the configured backend service."
    expected_skills: [image-generation]
  - prompt: "Rotate the API keys for the external rendering service account."
    expected_skills: [secrets-management]
