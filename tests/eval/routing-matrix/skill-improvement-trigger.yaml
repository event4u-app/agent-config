rule: skill-improvement-trigger
positives:
  - prompt: "Run the improvement capture after completing this task."
    expected_skills: [skill-improvement-pipeline, learning-to-rule-or-skill]
  - prompt: "Is the skill improvement pipeline enabled in this repo?"
    expected_skills: [skill-improvement-pipeline]
  - prompt: "Soll die improvement Pipeline nach großen Tasks automatisch laufen?"
    expected_skills: [skill-improvement-pipeline]
near_misses:
  - prompt: "Capture what we learned from this task in the memory system."
    expected_skills: [memory-consolidation, learning-to-rule-or-skill]
  - prompt: "Tune the CI workflow so the lint stage runs first."
    expected_skills: [github-ci]
