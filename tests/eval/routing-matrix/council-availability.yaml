rule: council-availability
positives:
  - prompt: "Is the council configured here, or do I need to set it up first?"
    expected_skills: [ai-council]
  - prompt: "Get me a second opinion on this roadmap before I commit to it."
    expected_skills: [ai-council]
  - prompt: "Can you cross-check with another model whether this design holds?"
    expected_skills: [ai-council]
near_misses:
  - prompt: "Summarise what the three reviewers said in the pull request thread."
    expected_skills: []
  - prompt: "Ask the team lead whether this belongs in the next release."
    expected_skills: []
