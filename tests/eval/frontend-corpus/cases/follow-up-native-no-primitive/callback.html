<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Request a callback</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <form class="stack" action="/callback" method="post">
        <label class="label">Name
            <input class="field" name="name" autocomplete="name">
        </label>
        <label class="label">Phone
            <input class="field" name="phone" type="tel" autocomplete="tel">
        </label>
        <button class="button" type="submit">Request callback</button>
    </form>
</body>
</html>
