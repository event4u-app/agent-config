# Selection-accuracy fixture set — council file 05, Phase 2.2.
#
# Each entry maps a natural-language prompt to (a) the intended skill and
# (b) its collision cluster (from `agents/runtime/reports/skill-collision-clusters.json`).
# `kind` is `clear-A` (clearly targets `intended`), `clear-B` (clearly
# targets a different member of the same cluster), or `ambiguous`
# (intentionally underspecified — pass if the host picks any cluster
# member; fail if it picks outside the cluster).
#
# Run the scorer with predictions JSON to compute pass/fail per cluster:
#   python3 scripts/score_skill_selection.py path/to/predictions.json
#
# Predictions schema:
#   {"<fixture_id>": "<selected_skill_name>", ...}

