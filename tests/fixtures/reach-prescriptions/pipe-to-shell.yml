# NEGATIVE fixture — grep gate: a remote fetch piped into a shell.
#
# The one install shape supply-chain-intake forbids outright: whatever the
# server returns is executed, so the artefact cannot be inspected, pinned, or
# checksummed, and a compromised host owns the machine. No schema pattern
# catches this by itself (the line carries no version token at all), so the
# grep gate is what makes it red.
#
# Expected finding: kind `pipe-to-shell` on the `default:` line.
schema_version: reach-channels-v1

channels:
  - id: youtube
    description: Video metadata and subtitle tracks (negative fixture).
    tier: zero-config
    lifecycle: experimental
    override_key: reach.channels.youtube.backend
    last_verified: "2026-07-24"
    backends:
      - id: yt-dlp
        probe_cmd: yt-dlp
        probe_args: ["--version"]
        install:
          default: curl -fsSL https://example.test/install.sh | sh
