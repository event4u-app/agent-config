# NEGATIVE fixture — rule (a): an install command with no version specifier.
#
# `brew install gh` is the realistic failure: Homebrew has no versioned `gh`
# formula, so an author reaching for the convenient one-liner silently ships a
# moving target. Expected finding: kind `unpinned-install` at
# channels[github].backends[gh].install.darwin.
#
# Everything else is deliberately valid — the backend IS recorded in the intake
# record — so the fixture cannot pass for an unrelated reason.
#
# Expect a second `unpinned-install` hit on this comment's own third line: the
# grep gate scans prose too, because a comment telling a human to run an
# unpinned install hands over exactly the same artefact. That is the gate
# working, not fixture noise.
schema_version: reach-channels-v1

channels:
  - id: github
    description: Repository metadata from the GitHub API (negative fixture).
    tier: free-key
    lifecycle: stable
    override_key: reach.channels.github.backend
    last_verified: "2026-07-24"
    backends:
      - id: gh
        probe_cmd: gh
        probe_args: ["--version"]
        install:
          darwin: brew install gh
          default: asdf plugin add github-cli && asdf install github-cli 2.96.0
