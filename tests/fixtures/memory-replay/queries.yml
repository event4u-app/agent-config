# Replay queries for the memory-retrieval economy gate
# (road-to-request-scoped-rule-load sibling: road-to-memory-retrieval-economy
# Phase 0).
#
# PROVENANCE (council 2026-07-08, claude-sonnet-4-5 + gpt-4o, 2 rounds —
# Option A verdict): the roadmap asked for queries "harvested from recent
# maintainer sessions", but no such data exists — MCP telemetry records tool
# names only (PII-excluded by construction; 7 stub calls total) and session
# transcripts contain memory:lookup almost exclusively as documentation text.
# These queries are therefore CORPUS-DERIVED: each is phrased the way a
# session would ask for a real repo fact, against fixture entries seeded from
# real repo content (realistic sizes). `needed` labels are deterministic BY
# CONSTRUCTION (the entry the query targets), never LLM-labelled — satisfying
# the roadmap's guard intent (no self-generated ground truth from the
# evaluated model). Every claim from this rig is scoped to "corpus-derived
# replay queries"; the token-economy arm is arithmetic over real payload
# sizes and transfers; the query-DISTRIBUTION realism does not.
version: 1
queries:
  - id: q-01-owner-router
    types: [ownership]
    keys: [compile_router]
    limit: 5
    needed: [own-router-compiler]
  - id: q-02-owner-install
    types: [ownership]
    keys: ["src/install"]
    limit: 5
    needed: [own-install-pipeline]
