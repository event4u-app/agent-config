<!doctype html>
<html lang="de">
<head><meta charset="utf-8" /><title>Kontakt</title></head>
<body>
  <h1>Kontakt</h1>
  <div class="click-to-load" data-src="https://www.google.com/maps/embed?pb=!1m18!1m12">
    <p>Wir nutzen Google Maps. Darf die Karte geladen werden?</p>
    <button type="button" onclick="this.parentElement.innerHTML='&lt;iframe src=&quot;'+this.parentElement.dataset.src+'&quot;&gt;&lt;/iframe&gt;'">Karte laden</button>
  </div>
</body>
</html>
