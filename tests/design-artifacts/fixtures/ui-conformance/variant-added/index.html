<!doctype html>
<meta charset="utf-8">
<title>UI conformance fixture — added element</title>
<link rel="stylesheet" href="styles.css">
<main class="card" data-probe-id="card">
  <header class="toolbar" data-probe-id="toolbar">
    <h1 class="title" data-probe-id="title">Conformance reference</h1>
    <span class="badge" data-probe-id="status-badge">ready</span>
    <!-- D7 (added element, Phase 1.2 of
         `road-to-a-probe-that-cannot-report-a-false-green`): one handle the
         reference does not carry. Everything else in this directory — the rest
         of this file, `styles.css` and `app.js` — is identical to the
         reference, so the only difference the probe can see is the presence of
         this node.

         Before Phase 3 the evaluation loop iterated `reference.nodes` only, so
         this variant produced ZERO findings: the omit half of
         `src/rules/design-fidelity.md`'s "never omit or add an element" was
         observable and the add half was not.

         EXPECTED READING AFTER PHASE 3: exactly one `structure` finding,
         `probe_id: "extra-badge"`, `expected: "absent"`,
         `observed: "present"`, with every other dimension's count unchanged at
         zero, and `structure_gate: "stopped"` — because there is nothing in the
         reference to compare this node's style against either.

         A wrapper or portal node a framework port legitimately inserts carries
         no `data-probe-id`, so it produces nothing here. The finding keys on
         the handle, never on the DOM node. -->
    <span class="badge" data-probe-id="extra-badge">new</span>
  </header>
  <p class="body" data-probe-id="body">
    The reference implementation. Every planted defect in a sibling variant is a
    deliberate removal from this file or its stylesheet.
  </p>
  <button class="action" data-probe-id="toggle" aria-expanded="false">Toggle details</button>
  <section class="panel" data-probe-id="panel" hidden>Details panel content.</section>
</main>
<script src="app.js"></script>
