<!-- D6 (handle-less reference, Phase 1.1 of
     `road-to-a-probe-that-cannot-report-a-false-green`): identical to
     `reference/index.html` except that every `data-probe-id` attribute is
     removed. This is what a design handover carrying no probe handles looks
     like, and it is the state every real handover in this tree is in — none
     carries a `data-probe-id` at all.

     The capture therefore collects ZERO nodes, which is the input the probe had
     never been given. Before Phase 2 `evaluate()` stamped all five dimensions
     `status: "exercised"` with `findings: 0` and returned
     `structure_gate: "passed"` for it — a run that entered no dimension
     reporting as a clean comparison. The fixture exists so that reading is a
     test failure rather than an argument.

     EXPECTED READING AFTER PHASE 2: five rows of
     `status: "not_applicable"`, `findings: null`, each carrying a reason that
     names the handover rather than the host, and `structure_gate: "stopped"`.
     `reference_nodes: 0` and `target_nodes: 0` on the artefact. -->
