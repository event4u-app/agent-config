<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Two inline graphics</title></head>
<body>
  <h1>Dashboard</h1>
  <!-- planted (R7): both inline graphics use the generic id "title", so the accessible name of
       the second resolves to the first element with that id and both read "Revenue chart" -->
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 40" role="img" aria-labelledby="title" width="60" height="40"><title id="title">Revenue chart</title><rect x="4" y="20" width="12" height="16" fill="#2563eb"/><rect x="24" y="10" width="12" height="26" fill="#3b82f6"/><rect x="44" y="4" width="12" height="32" fill="#60a5fa"/></svg>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 40" role="img" aria-labelledby="title" width="60" height="40"><title id="title">Cost chart</title><rect x="4" y="6" width="12" height="30" fill="#b91c1c"/><rect x="24" y="16" width="12" height="20" fill="#dc2626"/><rect x="44" y="26" width="12" height="10" fill="#f87171"/></svg>
</body>
</html>
