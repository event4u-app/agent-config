<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" role="img">
  <title>Easing marker</title>
  <style>
    /* A route that actually reaches SMIL: the animated element is removed and
       a static end-state takes its place. A CSS `animation: none` would not. */
    #resting { display: none; }
    @media (prefers-reduced-motion: reduce) {
      #moving { display: none; }
      #resting { display: inline; }
    }
  </style>
  <circle id="resting" cx="180" cy="24" r="8" fill="#2563eb"/>
  <circle id="moving" cx="20" cy="24" r="8" fill="#2563eb">
    <!-- planted: 1.56 lies outside [0,1]; SMIL rejects the whole animation rather than clamping it -->
    <animate attributeName="cx" values="20;180" dur="1.5s" calcMode="spline" keyTimes="0;1" keySplines="0.34 1.56 0.64 1" fill="freeze"/>
  </circle>
</svg>
