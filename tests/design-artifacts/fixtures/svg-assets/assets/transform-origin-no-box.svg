<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" role="img">
  <title>Two scaling tiles</title>
  <rect id="correct" x="20" y="20" width="60" height="60" fill="#2563eb" style="transform-box: fill-box; transform-origin: center; transform: scale(0.5)"/>
  <!-- planted (R2, R9): the twin element beside it carries transform-box, so a FILE-scoped rule hides this one -->
  <rect id="planted" x="120" y="20" width="60" height="60" fill="#60a5fa" style="transform-origin: center; transform: scale(0.5)"/>
</svg>
