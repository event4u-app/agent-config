<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" role="img">
  <title>Illustration with external paint</title>
  <defs>
    <linearGradient id="local-g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="120" height="40" fill="url(#local-g)"/>
  <!-- planted: an external image href and an external url() paint reference -->
  <image href="https://example.com/x.png" x="0" y="50" width="40" height="40"/>
  <rect x="50" y="50" width="60" height="40" fill="url(https://example.com/g.svg#g)"/>
</svg>
