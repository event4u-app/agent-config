<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img">
  <title>Planted — two shapes abutting on a shared interior edge</title>
  <!-- Step 4.1 of road-to-svg-from-a-live-session (S25). An outer ring and an
       inner disc that ABUT at r = 20: each is composited against the ground on
       its own, so the shared curve bleeds a hairline of background through the
       middle of the graphic — invisible on white and obvious on black, which is
       why the reading is taken against each capture's own ground.

       The seam is INTERIOR on purpose. A seam that runs edge to edge of the
       silhouette splits it in two, and no definition of "inside the graphic"
       calls such a gap interior — measured, that fixture read 0. The real case
       (a hat brim against a crown) is this one.

       Both fills clear 3:1 against #ffffff AND #111111, so this pair exercises
       the seam reading alone and never the contrast one. -->
  <path fill-rule="evenodd" fill="#767676" d="M 32 4 A 28 28 0 1 0 32 60 A 28 28 0 1 0 32 4 Z M 32 12 A 20 20 0 1 1 32 52 A 20 20 0 1 1 32 12 Z"/>
  <circle cx="32" cy="32" r="20" fill="#8a8a8a"/>
</svg>
