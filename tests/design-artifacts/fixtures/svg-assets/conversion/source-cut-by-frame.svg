<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img">
  <title>Source raster — the crop starts below the top of the mark</title>
  <!-- The crown-cut case (S17). The subject runs off the top edge of the crop,
       so a trace of this crop and this crop agree exactly and the silhouette
       reading cannot see what is missing. The only signal is the contact with
       the frame itself. -->
  <rect width="100" height="100" fill="#f1f5f9"/>
  <rect x="30" y="-12" width="40" height="52" rx="6" fill="#2563eb"/>
  <path d="M 38 50 L 46 58 L 62 42" fill="none" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
