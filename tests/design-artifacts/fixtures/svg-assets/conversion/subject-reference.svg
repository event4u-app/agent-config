<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img">
  <title>Subject reference — the subject, alone</title>
  <!-- Step 2.1 of `road-to-svg-from-a-live-session`. The vector a conversion is
       judged against, with nothing around it: the two source rasters beside this
       file render the SAME subject with other things inside the registration
       frame, and the comparison has to pass anyway. Two named top-level groups,
       which is also what step 2.2 reads its regions from.

       Its own file rather than a reuse of `reference.svg`, which is the
       conversion scenario's ground truth and carries a wordmark and a slogan
       this comparison is not about. -->
  <g id="badge">
    <rect x="30" y="30" width="40" height="40" rx="6" fill="#2563eb"/>
  </g>
  <g id="tick">
    <path d="M 38 50 L 46 58 L 62 42" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
