<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 120" role="img" aria-labelledby="dispatch-diagram-title">
  <title id="dispatch-diagram-title">A hook event reaching a concern through the dispatcher</title>
  <defs>
    <marker id="dispatch-diagram-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="8" y="36" width="96" height="48" rx="6" fill="none" stroke="#64748b" stroke-width="2"/>
  <text x="56" y="65" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">event</text>
  <rect x="132" y="36" width="96" height="48" rx="6" fill="none" stroke="#64748b" stroke-width="2"/>
  <text x="180" y="65" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">dispatch</text>
  <rect x="256" y="36" width="96" height="48" rx="6" fill="none" stroke="#64748b" stroke-width="2"/>
  <text x="304" y="65" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">concern</text>
  <line x1="108" y1="60" x2="128" y2="60" stroke="#64748b" stroke-width="2" marker-end="url(#dispatch-diagram-arrow)"/>
  <line x1="232" y1="60" x2="252" y2="60" stroke="#64748b" stroke-width="2" marker-end="url(#dispatch-diagram-arrow)"/>
</svg>
