    personas:
      - reviewer
      - security
    skills_hint:
      - incident-commander
      - dashboard-design
      - logging-monitoring
      - threat-modeling
      - launch-readiness
  surface:
    commands_hint:
      - work
      - threat-model
      - review-changes
      - fix
    docs_first_pointer: "docs/getting-started-by-role.md#ops"
