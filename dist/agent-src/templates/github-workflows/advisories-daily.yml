# Advisories, daily — template shipped by agent-config
#
# Copy this file to `.github/workflows/advisories-daily.yml` in the consumer
# project. It is the opt-in out-of-band runner of
# road-to-advisories-heard-the-same-day (5.3): on days nobody opens a session,
# a critical advisory for something this project runs still becomes an issue.
#
# What it does: `agent-config audit:deps refresh` (public package names and
# versions to api.osv.dev, runtime lifecycle from endoflife.date, the PHP and
# Node release feeds, the whole CISA known-exploited catalog from www.cisa.gov
# matched locally; private package names are never sent), then opens or
# updates ONE issue for T0 findings — malware, a critical runtime
# pre-announcement, a critical fix for a direct dependency, a high finding that
# is known-exploited (KEV raises one tier).
#
# What it never does: merge, push, open a PR, change a dependency, or run a
# package manager's install. Carrying a finding to a fix is `/audit deps fix
# <id>` in a session, where a person decides.
#
# Permissions: `issues: write` to open the issue; nothing else is written.
#
# Private repositories only. On a public repository the issue, and this job's
# log, would advertise which unpatched components the project runs before they
# are fixed; the first step checks visibility and every later step is skipped
# unless the repository is private.
#
# Pin the package to the major you run (`@16` below) and keep the actions pinned
# the way the rest of your workflows are; a security job that installs `latest`
# with a write token is a supply-chain path of its own.

name: Advisories (daily)

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  advisories:
    name: audit:deps refresh → T0 issue
    runs-on: ubuntu-latest
    steps:
      - name: Run on a private repository only
        id: visibility
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          private="$(gh api "repos/$REPO" -q .private)"
          echo "private=$private" >> "$GITHUB_OUTPUT"
          [ "$private" = "true" ] || echo "not a private repository: nothing is refreshed or published here"
      - if: steps.visibility.outputs.private == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - if: steps.visibility.outputs.private == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh advisories
        if: steps.visibility.outputs.private == 'true'
        run: npx --yes @event4u/agent-config@16 audit:deps refresh --force
      - name: Open or update the T0 issue (only when the list changed)
        if: steps.visibility.outputs.private == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(npx --yes @event4u/agent-config@16 audit:deps issue-body)"
          [ -z "$body" ] && { echo "no T0 finding today"; exit 0; }
          # The `Checked <time>` line changes on every run; the list is what counts.
          digest="$(printf '%s' "$body" | grep -v '^Checked ' | sha256sum | cut -c1-16)"
          marker="<!-- advisories-digest: $digest -->"
          title="Security advisories needing action today"
          existing="$(gh issue list --state open --search "in:title \"$title\"" --json number -q '.[0].number')"
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body "$body"$'\n\n'"$marker"
          elif ! gh issue view "$existing" --json body,comments -q '.body, .comments[].body' | grep -qF "$marker"; then
            gh issue comment "$existing" --body "$body"$'\n\n'"$marker"
          else
            echo "the T0 list is unchanged since the last report"
          fi
