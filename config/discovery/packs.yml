# Discovery packs — closed vocabulary
#
# Source of truth: docs/decisions/ADR-013-discovery-frontmatter-contract.md §packs
# Amendments require an ADR-013 amendment in the same PR.
# `requires_hint` is advisory metadata only; runtime does NOT act on it.
# Lint: scripts/lint_discovery_vocabulary.py

- id: engineering-base
  label: Engineering Base
  description: Framework-neutral engineering hygiene — git, tests, reviews.
  workspaces: [engineering]
  trust_level_default: core

- id: php
  label: PHP
  description: PHP-language patterns (framework-free).
  workspaces: [engineering]
  requires_hint: [engineering-base]
  trust_level_default: professional

- id: laravel
  label: Laravel
  description: Laravel framework patterns; depends on PHP at the artefact level.
  workspaces: [engineering]
  requires_hint: [php, engineering-base]
  trust_level_default: professional

- id: symfony
  label: Symfony
  description: Symfony framework patterns; depends on PHP at the artefact level.
  workspaces: [engineering]
  requires_hint: [php, engineering-base]
  trust_level_default: professional

- id: javascript
  label: JavaScript
  description: JavaScript-language patterns.
  workspaces: [engineering]
  requires_hint: [engineering-base]
  trust_level_default: professional

- id: typescript
  label: TypeScript
  description: TypeScript-language patterns.
  workspaces: [engineering]
  requires_hint: [javascript, engineering-base]
  trust_level_default: professional

- id: react
  label: React
  description: React framework patterns.
  workspaces: [engineering]
  requires_hint: [javascript, engineering-base]
  trust_level_default: professional

- id: nextjs
  label: Next.js
  description: Next.js framework patterns.
  workspaces: [engineering]
  requires_hint: [react, typescript, engineering-base]
  trust_level_default: professional

- id: python
  label: Python
  description: Python-language patterns.
  workspaces: [engineering]
  requires_hint: [engineering-base]
  trust_level_default: professional

- id: product-basic
  label: Product Basic
  description: Core PO/PM artefacts (ticket refinement, AC, estimation).
  workspaces: [product]
  trust_level_default: professional

- id: product-discovery
  label: Product Discovery
  description: JTBD, interviews, VoC, hypothesis testing.
