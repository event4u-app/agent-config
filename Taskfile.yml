version: '3'

# Root Taskfile — orchestration only.
# Task groups live under taskfiles/ and are flattened into the root namespace
# so existing invocations (`task ci`, `task sync`, `task lint-skills`, …) keep
# working unchanged.

# Phase 10.7 — verbosity-aware --quiet injection.
# `--quiet` is passed to scripts that support it unless
# AGENT_SCRIPT_VERBOSITY=verbose. Scripts that ignore the flag are unaffected.
vars:
  QUIET_FLAG:
    sh: '[ "$AGENT_SCRIPT_VERBOSITY" = "verbose" ] && echo "" || echo "--quiet"'

includes:
  content:
    taskfile: ./taskfiles/content.yml
    flatten: true
  ci-fast:
    taskfile: ./taskfiles/ci-fast.yml
    flatten: true
  engine:
    taskfile: ./taskfiles/engine.yml
    flatten: true
  release:
    taskfile: ./taskfiles/release.yml
    flatten: true
  mcp:
    taskfile: ./taskfiles/mcp.yml
    flatten: true
  dev:
    taskfile: ./taskfiles/dev.yml
    flatten: true
  bench-ab:
    taskfile: ./taskfiles/bench-ab.yml
    flatten: true
  bench-ui:
    taskfile: ./taskfiles/bench-ui.yml
    flatten: true
  value:
    taskfile: ./taskfiles/value.yml
    flatten: true

tasks:
  _ci-start:
    desc: "Internal — record CI start time for duration reporting (P2.4)"
    internal: true
    cmd: date +%s > /tmp/agent-config-ci-start.txt

  _ci-end:
    desc: "Internal — print CI duration line (P2.4)"
    internal: true
    cmds:
      - |
        if [ -f /tmp/agent-config-ci-start.txt ]; then
          start=$(cat /tmp/agent-config-ci-start.txt)
          end=$(date +%s)
          dur=$((end - start))
          mins=$((dur / 60))
          secs=$((dur % 60))
          printf "\n⏱  task ci duration: %dm %ds (%ds total)\n" "$mins" "$secs" "$dur"
          rm -f /tmp/agent-config-ci-start.txt
        fi

  # CI tiers — Phase 1.4 of step-1-v2-feedback-followup roadmap (council U2).
  #
  #   ci        — full local CI, WARN-permissive (lint-skills + lint-readme)
  #   ci-strict — `ci` PLUS the WARN-fatal twins and reuse-lint. Superset by
  #               construction (it delegates to `ci`); guarded by
  #               check-ci-strict-superset. Intended release-tag gate;
  #               surfaces the WARN backlog and is not yet wired into the
  #               release workflow.
  #
  # NOTE (2026-08-02): there is no `ci-fast` TASK. `taskfiles/ci-fast.yml` is
  # included with `flatten: true`, which creates no namespace and no aggregate —
  # it is a file of individual gate tasks, not a tier. This comment used to list
  # `ci-fast` as a third tier, and `src/scripts/check_enforcement_coverage.ts`
  # still names it as an aggregate; `task ci-fast` fails with "task not found".
  # Left as a named finding rather than silently inventing the tier — creating
  # one is a scoped decision, not a comment fix.
  ci:
    desc: Run ALL CI checks locally (must pass before push) — emits duration line (P2.4)
    cmds:
      - task: _ci-start
      - defer: { task: _ci-end }
      - task: consistency
      - task: preflight
      - task: check-ci-local-parity
      # Defined in taskfiles/ci-fast.yml since it was written and referenced by
      # NOTHING — not this chain, not a workflow — so the gate that reads every
      # other gate's coverage floor could only be seen by running it by hand.
      # Wiring it into consistency.yml without this line would have made it
      # CI-only, i.e. a failure a contributor meets only after pushing, which is
      # the mirror image of the defect road-to-local-only-gate-reds was about.
      - task: check-gate-coverage
      - task: check-ci-strict-superset
      - task: counts-check
      - task: check-index
      # src/scripts/build_archive_index — the dedup index over the roadmap
