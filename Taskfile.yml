  ci-strict:
    desc: Run ALL CI checks with WARN promoted to ERROR (release-tag gate — Phase 1.4 / U2)
    # SUPERSET BY CONSTRUCTION (road-to-renewal-foundation Phase 1; council
    # 2026-08-02 decision A1, 2/2).
    #
    # `ci-strict` used to be an independently maintained 197-entry copy of
    # `ci`'s 202-entry list. The two drifted, and nothing detected it: SIX
    # gates ran in `ci` with no counterpart here at all — `preflight` (which
    # alone fans out to 11 scripts, among them check_no_new_legacy_path and
    # check_kernel_rule_bundle), check-ci-local-parity,
    # check-gitignore-freshness, check-generator-output-coverage,
    # check-tracked-but-ignored, check-generated-artefact-headers. The
    # "release-tag gate" was therefore strictly WEAKER than the everyday gate
    # on ~16 concrete script runs.
    #
    # Delegating to `ci` makes the superset property tautological — it cannot
    # drift, because there is only one list. Entries below are additive only.
    # Three are WARN-fatal twins whose permissive versions also run via `ci`
    # (lint-skills / lint-readme / lint-agents-layout); that duplication is
    # deliberate and cheap, and it is the price of by-construction
    # correctness. `reuse-lint` is genuinely strict-only — it needs the
    # external `reuse` tool and self-skips when absent.
    #
    # `_ci-start` / `_ci-end` are NOT repeated here: `ci` already brackets the
    # run, so the duration line still prints once.
    #
    # Guarded by `check-ci-strict-superset` (src/scripts/check_ci_strict_superset.ts),
    # which asserts the single invariant that makes this work: the first gate
    # entry below is `- task: ci`.
    cmds:
      - task: ci
      - task: reuse-lint
      - task: lint-skills-strict
      - task: lint-agents-layout-strict
      - task: lint-readme-strict
