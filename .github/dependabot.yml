# Dependency update automation.
#
# WHY (road-to-renewal-foundation, Phase 1 — dependency-audit gap):
# `npm audit --omit=dev --audit-level=high` already runs on every PR (a step
# in the `Static Checks` job of tests.yml) and again as a standalone job on
# release PRs. That covers "is the runtime tree clean *at the moment someone
# opens a PR*". It does NOT cover the quiet week: a high-severity advisory
# published against an already-installed version is invisible until the next
# PR happens to run. Dependabot closes exactly that gap — it re-evaluates the
# lockfile on a schedule and raises security updates out of band.
#
# Scope choices:
#   * `npm` at the repo root — the only lockfile that ships runtime deps.
#     `site/` and `deploy/telemetry-worker/` carry their own package.json but
#     are not part of the published package (`files[]` excludes them); they
#     are listed below at a lower cadence so their toolchains do not rot
#     silently either.
#   * `github-actions` — pinned action SHAs/tags rot and are a real supply-
#     chain surface; the repo pins every action to a full 40-hex commit SHA
#     with a `# vX.Y.Z` comment beside it, so updates need a PR to land.
#     Corrected 2026-08-22: this line previously read "the repo pins
#     actions" while the repo pinned mutable TAGS — 112 references, 0 SHAs —
#     so this entry's own justification rested on something untrue. It is
#     true as of road-to-ci-supply-chain-integrity Phase 1.
#
# Grouping is deliberate: one PR per ecosystem per week, not one per package.
# An ungrouped dependabot on ~30 direct deps produces more review load than
# the maintainer has, which is how dependabot ends up disabled everywhere.
# Security updates are intentionally NOT grouped — they should arrive alone
# and be mergeable without reading an unrelated bump.

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      # Conventional Commits — `lint commit subjects` (commit-subjects.yml)
      # rejects anything else, including on dependabot's own PRs.
      prefix: fix
      prefix-development: chore
      include: scope
    # Caret floors in package.json are SETTLED minors (^X.Y.0) by contract —
    # check_dependency_floors blocks freshest-patch shapes, and the
    # install-friction baseline pins dependencies exactly. Default range
    # widening re-broke that on every in-range patch (preact ^10.29.7 in
    # PR #1110, @preact/signals ^2.10.1 in PR #1139). increase-if-necessary
    # keeps in-range updates lockfile-only; majors still widen the range and
    # land in the npm-majors group.
    versioning-strategy: increase-if-necessary
    ignore:
      # web-tree-sitter is ABI-pinned to the tree-sitter-wasms grammars
      # (0.24.7 ↔ 0.1.13, ABI 14). 0.25+ changes the load API and 0.26.x
      # fails Language.load on the 0.1.13 grammars (tree-sitter #5171) —
      # the code-graph ABI smoke test (tests/scripts/code_graph.test.ts)
      # is the gate that catches it. Bump both packages together,
      # deliberately, never via a scheduled group PR.
      - dependency-name: web-tree-sitter
      # execa 10 raises the dependency's Node floor to >=22 while this
      # package supports and CI-tests Node 20 (engines >=20.11.0). Taking
      # it is a Node-baseline decision, not a dependency bump — lift this
      # ignore when the package raises its Node floor (PR #1115).
      - dependency-name: execa
        update-types: ["version-update:semver-major"]
      # zod 4 is a real migration: zod-to-json-schema call sites and the
      # server route/wizard schemas break (26 typecheck errors), and the
      # committed install bundle embeds zod. Migrate deliberately to zod 4's
      # native z.toJSONSchema in its own PR, then lift this (PR #1131).
      - dependency-name: zod
        update-types: ["version-update:semver-major"]
      # Toolchain majors are migration projects, not dependency bumps —
      # each below broke the 2026-08-03 npm-majors group PR (#1141, 35 red
      # checks) and needs its own planned upgrade with config/API work.
      # Lift an entry when that migration is scheduled.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
    # Majors are grouped too (npm-majors below): one collected weekly PR
    # instead of one PR per major — the 2026-08-03 flood (execa, zod,
    # @types/node, @inquirer/prompts, typescript, …) arrived as singles
    # because the original groups only covered minor+patch.
    groups:
      npm-production:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch
      npm-development:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch
      npm-majors:
        applies-to: version-updates
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: chore
      include: scope
    groups:
      # One collected PR for ALL action updates, majors included — action
      # majors are runner-config changes, reviewable together; singles like
      # setup-node 4→7 and sticky-pull-request-comment 2→3 each re-lint
      # every touched workflow for no added review value.
      github-actions:
        applies-to: version-updates
        update-types:
          - major
          - minor
          - patch

  # Non-shipped auxiliary manifests. Monthly: they carry no runtime risk for
  # consumers, but a rotted toolchain still breaks the docs site / worker
  # deploy at the worst possible moment.
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      site:
        applies-to: version-updates
        update-types:
          - major
          - minor
          - patch

  - package-ecosystem: npm
    directory: /deploy/telemetry-worker
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      telemetry-worker:
        applies-to: version-updates
        update-types:
          - major
          - minor
          - patch
