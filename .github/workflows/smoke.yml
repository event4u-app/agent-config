name: Smoke Contracts

# Per-tier smoke contracts from step-11 Phase 3. Each smoke runs ≤ 30 s,
# asserts measured baselines (not aspirational), and locks regression
# without forcing aspirational fixes on unrelated PRs.
#
# Path filters dispatch only the smokes whose tier the PR actually
# touched (kernel / router / schema / skills). Pushes to main run all
# four so the baseline numbers stay tracked.
#
# Contract: docs/contracts/smoke-contracts.md

on:
  pull_request:
    branches: [main, master]
    paths:
      - ".agent-src.uncondensed/rules/**"
      - "dist/agent-src/rules/**"
      - ".agent-src.uncondensed/skills/**"
      - "router.json"
      - "src/scripts/smoke/**"
      - "src/scripts/measure_rule_budget.ts"
      - "src/scripts/skill_linter.ts"
      - "src/scripts/validate_frontmatter.ts"
      - "src/scripts/schemas/**"
      - "docs/contracts/**"
      - "docs/guidelines/**"
      - "docs/contracts/smoke-contracts.md"
      - ".github/workflows/smoke.yml"
      # docs-only PR shape (per docs/contracts/branch-protection-policy.md):
      # Smoke Contracts is a REQUIRED check for docs-only PRs, so it must
      # trigger on the docs-only paths or such PRs deadlock (required check
      # never runs). docs/contracts/** + docs/guidelines/** are already above.
      - "CHANGELOG.md"
      - "README.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - "llms.txt"
      - "docs/**"
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-kernel:
    name: Smoke — kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Node deps
        run: |
          npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000 \
            || (sleep 10 && npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000)
      - name: Run kernel smoke
        run: src/scripts/smoke/kernel.sh

  smoke-router:
    name: Smoke — router
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Node deps
        run: |
          npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000 \
            || (sleep 10 && npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000)
      - name: Run router smoke
        run: src/scripts/smoke/router.sh

  smoke-schema:
    name: Smoke — schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Node deps
        run: |
          npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000 \
            || (sleep 10 && npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000)
      - name: Run schema smoke
        run: src/scripts/smoke/schema.sh

  smoke-skills:
    name: Smoke — skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Node deps
        run: |
          npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000 \
            || (sleep 10 && npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000)
      - name: Run skills smoke
        run: src/scripts/smoke/skills.sh
