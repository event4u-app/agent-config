name: Consistency

on:
  pull_request:
    # `labeled`/`unlabeled` are here for the kernel-rule bundle override.
    # `check_kernel_rule_bundle` reads the override label from the event
    # payload, and the default trigger set (opened/synchronize/reopened) never
    # re-fires when a label is added — so the documented override could only
    # take effect via an unrelated push, which is not an override, it is a
    # workaround. Observed on PR #1063.
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - ".agent-src.uncondensed/**"
      # `src/` is the source of truth and `dist/agent-src/` its projection; a PR
      # touching only these (e.g. a src/agent-src/scripts edit + its dist twin)
      # must still trigger the REQUIRED Consistency check or it deadlocks on
      # "Expected — Waiting for status to be reported".
      - "src/**"
      - "dist/agent-src/**"
      - ".augment/**"
      - "agents/**"
      - ".claude-plugin/marketplace.json"
      - "src/scripts/condense.ts"
      - "src/scripts/condense.sh"
      - "src/scripts/check_references.ts"
      - "src/scripts/check_no_new_legacy_path.ts"
      - "src/scripts/build_cloud_bundle.ts"
      - "src/scripts/build_linear_digest.ts"
      - "src/scripts/lint_marketplace.ts"
      - "src/scripts/lint_agents_md.ts"
      - "AGENTS.md"
      - "tests/**"
      - "Taskfile.yml"
      - "taskfiles/**"
      # Any workflow-file change must trigger the REQUIRED Consistency check
      # too, or a workflow-only PR deadlocks on "Expected — Waiting for status".
      - ".github/workflows/**"
      # docs-only PR shape (per docs/contracts/branch-protection-policy.md):
      # Consistency is a REQUIRED check for docs-only PRs, so it must trigger
      # on the docs-only paths or such PRs deadlock (required check never runs).
      - "CHANGELOG.md"
      - "README.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - "llms.txt"
      - "docs/**"
  push:
    branches:
      - main
      - master
    paths:
      - ".agent-src.uncondensed/**"
      # `src/` is the source of truth and `dist/agent-src/` its projection; a PR
      # touching only these (e.g. a src/agent-src/scripts edit + its dist twin)
      # must still trigger the REQUIRED Consistency check or it deadlocks on
      # "Expected — Waiting for status to be reported".
      - "src/**"
      - "dist/agent-src/**"
      - ".augment/**"
      - "agents/**"
      - ".claude-plugin/marketplace.json"
      - "src/scripts/condense.ts"
      - "src/scripts/condense.sh"
      - "src/scripts/check_references.ts"
      - "src/scripts/check_no_new_legacy_path.ts"
      - "src/scripts/build_cloud_bundle.ts"
      - "src/scripts/build_linear_digest.ts"
      - "src/scripts/lint_marketplace.ts"
      - "src/scripts/lint_agents_md.ts"
      - "AGENTS.md"
      - "tests/**"
      - "Taskfile.yml"
      - "taskfiles/**"
      # Any workflow-file change must trigger the REQUIRED Consistency check
      # too, or a workflow-only PR deadlocks on "Expected — Waiting for status".
      - ".github/workflows/**"
      # docs-only PR shape (per docs/contracts/branch-protection-policy.md):
      # Consistency is a REQUIRED check for docs-only PRs, so it must trigger
      # on the docs-only paths or such PRs deadlock (required check never runs).
      - "CHANGELOG.md"
      - "README.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - "llms.txt"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  consistency:
    name: Sync + Generate Tools Consistency
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node deps
        run: |
          # Retry once — the per-pack matrix fans out ~14 concurrent npm ci
          # calls; transient registry ECONNRESET would otherwise flake a job.
          npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000 \
            || (sleep 10 && npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000)

      - name: Set up Task
        uses: ./.github/actions/setup-task
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show tool versions
        run: |
          node --version
          task --version

      - name: Verify current sync state
        run: task sync-check

      # agents/index.md + docs/catalog.md embed every artefact description
      # verbatim, so any description edit makes them stale. `task ci` has caught
      # this locally for a long time; CI never did — which is how 16 stale rows
      # reached main after a description-shortening pass. A gate that only exists
      # on one side drifts silently on the other.
      - name: Verify the artefact index + catalog are regenerated
        run: task check-index

      - name: Verify dist == rewrite(src) byte-for-byte
        run: task check-condensation

      - name: Regenerate .augment from source
        run: task sync

      - name: Regenerate tool-specific outputs
        run: task generate-tools

      - name: Bridge derivation — generated trees are a fixpoint of src/
        # skill-quality-gates Phase 4: symlink targets stay inside the
        # derivation sources; a second regeneration changes nothing.
        run: ./scripts-run src/scripts/check_bridge_derivation

      - name: Supported-tools matrix ↔ adapter registry
        run: ./scripts-run src/scripts/lint_supported_tools_matrix

      - name: Host loadability — generated trees actually load
        run: ./scripts-run src/scripts/check_host_loadability --root .

      - name: Host loadability smoke (optional — self-skips without the claude CLI)
        # Real-host leg: claude plugin validate + temp-home install +
        # metadata cross-consistency. Required before releases via
        # `task smoke-host-loadability REQUIRE=1` (release flow).
        run: bash src/scripts/smoke_host_loadability.sh

      - name: Check cross-references
        run: ./scripts-run src/scripts/check_references

      - name: No leftover conflict markers / unmerged paths
        run: ./scripts-run src/scripts/check_no_conflict_markers

      - name: Guard — no new legacy path under src/ (ADR-051)
        # PR-scoped: pull the diff via the GitHub API (gh) instead of
        # `git fetch <base>` — the shallow PR-merge checkout races with the
        # auth extraheader (same failure the kernel-rule-bundle step sidesteps).
        # NOTE: no --patch — that emits a per-commit format-patch series, so a
        # line added by one commit and fixed by a later commit in the same PR
        # would fail forever. The guard's contract is the NET diff of the PR.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr diff "${{ github.event.pull_request.number }}" \
            | ./scripts-run src/scripts/check_no_new_legacy_path --stdin

      - name: Design-token drift — generated CSS matches the canonical source
        # road-to-shared-design-tokens Phase 2: src/ui/tokens.css and the
        # emitted agent-switch block are generator outputs of
        # tokens/event4u-agent-tokens.json — hand-edits must fail here.
        run: |
          node tokens/build-ac.mjs --check
          node tokens/build-as.mjs --check
          node tokens/check-contrast.mjs

      - name: Check package portability
        run: ./scripts-run src/scripts/check_portability

      - name: Check condensation quality
        run: ./scripts-run src/scripts/check_condensation

      - name: Check Iron Law prominence
        run: ./scripts-run src/scripts/check_iron_law_prominence

      - name: Gate R1 — plan Risk Registers (plan-review-gates §1)
        # Exit-code contract §6: 2 = internal error → degraded advisory
        # (warn-and-allow — a broken gate never blocks its own fix).
        run: |
          ./scripts-run src/scripts/lint_plan_risk_register || {
            rc=$?
            if [ "$rc" = "2" ]; then
              echo "::warning::lint_plan_risk_register internal error — degraded advisory mode, allowing"
            else
              exit "$rc"
            fi
          }

      - name: Gate R2 — completion review (Stage-A advisory window, plan-review-gates §2)
        # --advisory until the Stage-B threshold is committed to CLAIMS.md:
        # violations report as warnings, exit 0. CI is the authoritative
        # layer once enforced; exit 2 stays degraded-advisory either way.
        #
        # NO `git fetch origin main` HERE. actions/checkout uses a shallow
        # PR-merge fetch, and this workflow already documents that the fetch
        # races with the configured auth extraheader on some runners (see the
        # kernel-rule-bundle step). Swallowing that failure with `|| true`
        # would leave `--base` unresolvable → exit 2 → "degraded advisory,
        # allowing", i.e. the layer the contract calls authoritative would
        # silently never run. The PR's base sha is already present in the
        # merge checkout (it is a parent of the merge commit), so pass it
        # directly and fetch nothing.
        if: github.event_name == 'pull_request'
        run: |
          ./scripts-run src/scripts/check_completion_review \
            --advisory --base "${{ github.event.pull_request.base.sha }}" || {
            rc=$?
            if [ "$rc" = "2" ]; then
              echo "::warning::check_completion_review internal error — degraded advisory mode, allowing"
            else
              exit "$rc"
            fi
          }

      - name: Gate R2 — context-manifest re-derivation (plan-review-gates §5)
        # The reviewer-input manifest is verification, not self-attestation:
        # re-derive the input hashes and block on mismatch.
        #
        # Selection lives INSIDE the script (`--verify-current`), not in this
        # bash. Both obvious shell selectors are wrong and the R2 review of
        # this gate caught each in turn: grepping the header for the current
        # HEAD sha can never match (contract § 2.0), while looping over EVERY
        # artefact reds by construction the moment the tracked reviews
        # directory holds another branch's artefact — the directory-wide
        # poisoning § 2.6 forbids. `--verify-current` computes the scope
        # itself and verifies only the artefacts claiming it.
        #
        # Base sha passed directly for the same no-fetch reason as the step
        # above.
        if: github.event_name == 'pull_request'
        run: |
          ./scripts-run src/scripts/dispatch_r2_reviewer \
            --verify-current --base "${{ github.event.pull_request.base.sha }}" || {
            rc=$?
            if [ "$rc" = "2" ]; then
              echo "::warning::dispatch_r2_reviewer --verify-current internal error — degraded advisory mode, allowing"
            else
              exit "$rc"
            fi
          }

      - name: Check always-rule budget (warn 80% / fail 90%)
        run: task check-always-budget

      - name: Runtime dependency floors are settled minors (ETARGET unreachable)
        # npm resolves `dependencies` on the CONSUMER's machine, before our bin
        # is executed — a floor pinned to a just-published patch cannot be
        # retried or explained at runtime, only prevented here.
        run: task check-dependency-floors

      - name: Payload budget — compressed tarball + per-skill share
        # Buildless (`npm pack --ignore-scripts`), so it runs on EVERY PR in
        # seconds and catches content accretion where it happens. The built
        # artifact's unpacked size stays owned by the release-time
        # evaluator-umbrella budget; this is not a second gate on that number.
        run: task check-pack-size

      - name: Token-surface regression (>5% over the recorded baseline)
        # `internal/bench/reports/projection-cost.json` is gitignored, so it never
        # exists on a fresh checkout. The task target carries `deps: [audit-tokens]`
        # and regenerates it in-job — invoking the script directly would read a
        # stale (or absent) report. Until 2026-07-30 this gate ran only in local
        # `task ci`, which is why a +10.3% eager-rule drift went unseen for 23 days.
        run: task check-token-regression

      - name: Lint workflow files (actionlint)
        # PR #1059 shipped a step with two `run:` keys. GitHub rejects duplicate
        # keys, so the whole REQUIRED Consistency check died on main — while the
        # local `yaml.safe_load` validation reported OK, because safe_load keeps
        # the last duplicate silently. actionlint catches that class before merge.
        #
        # PR-SCOPED ON PURPOSE. Run repo-wide, actionlint reports pre-existing
        # findings in workflows this PR never touched (shellcheck style nits, and
        # one real one: an unknown `administration` permission scope in
        # sync-visibility.yml). Cleaning those is its own change with its own
        # review; gating on them here would either block unrelated work or invite
        # a blanket ignore-list. Linting what the PR changed is what catches the
        # #1059 class, which is the reason this step exists.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t WF < <(gh pr diff "${{ github.event.pull_request.number }}" \
            --name-only | grep -E '^\.github/workflows/.*\.ya?ml$' || true)
          if [ "${#WF[@]}" -eq 0 ]; then
            echo "No workflow files changed in this PR — nothing to lint."
            exit 0
          fi
          printf 'linting %s changed workflow file(s):\n' "${#WF[@]}"
          printf '  %s\n' "${WF[@]}"
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color "${WF[@]}"

      - name: Kernel-rule budget (bucket + per-rule caps)
        # Wired here as the condition ADR-203 attaches to narrowing the
        # safety-floor lock: the gate that DECIDES whether kernel rules must be
        # edited may not stay local-only while the gate that BLOCKS those edits
        # runs on every PR. Both council members required this, from opposite
        # verdicts. It merges with the narrowing, never before it.
        run: task lint-rule-budget

      - name: Check kernel-rule bundle (one rule per PR; label override)
        # Phase 4.2 of road-to-always-budget-relief — slow-rollout guarantee.
        # Override: PR label `bundled-always-rules-acknowledged`.
        # actions/checkout@v7 uses a shallow PR-merge fetch, so `git fetch
        # origin <base>` can race with the configured auth extraheader on
        # some runners (observed: "could not read Username for github.com").
        # Sidestep the fetch entirely by pulling the PR's changed-file list
        # from the GitHub API via `gh pr view` and feeding it to the script
        # through its `--files` override.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t CHANGED < <(gh pr view "${{ github.event.pull_request.number }}" \
            --json files --jq '.files[].path')
          if [ "${#CHANGED[@]}" -eq 0 ]; then
            echo "No changed files reported by gh pr view; nothing to gate."
            exit 0
          fi
          ./scripts-run src/scripts/check_kernel_rule_bundle --files "${CHANGED[@]}"

      - name: Lint marketplace.json
        run: task lint-marketplace

      - name: Lint AGENTS.md (Thin-Root contract)
        run: task lint-agents-md

      - name: Cloud bundle dry-run (source invariants)
        run: task ci-cloud-bundle

      - name: Linear digest dry-run (no per-rule drift, under budget)
        run: task ci-linear-digest

      - name: Build discovery manifest (R3 Phase 2.1)
        run: ./scripts-run src/scripts/build_discovery_manifest --write --quiet

      - name: Lint discovery manifest — schema + checksum + vocab (R3 Phase 2.2)
        run: ./scripts-run src/scripts/lint_discovery_manifest --quiet

      - name: Discovery scanner determinism (R3 Phase 2.3)
        run: ./scripts-run src/scripts/check_discovery_determinism

      - name: Lint README
        run: ./scripts-run src/scripts/readme_linter README.md --root .

      - name: Check for unexpected changes
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated files are out of sync with source-of-truth."
            echo
            echo "Please run:"
            echo "  task sync"
            echo "  task generate-tools"
            echo
            echo "Changed files:"
            git status --short
            echo
            echo "Diff:"
            git diff --stat
            exit 1
          fi

      - name: Upload diff artifact on failure
        if: failure()
        run: |
          mkdir -p artifacts
          git status --short > artifacts/status.txt || true
          git diff > artifacts/consistency.diff || true

      - name: Upload consistency artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: consistency-artifacts
          path: artifacts/
