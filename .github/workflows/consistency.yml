name: Consistency

on:
  pull_request:
    # `labeled`/`unlabeled` are here for the kernel-rule bundle override.
    # `check_kernel_rule_bundle` reads the override label from the event
    # payload, and the default trigger set (opened/synchronize/reopened) never
    # re-fires when a label is added — so the documented override could only
    # take effect via an unrelated push, which is not an override, it is a
    # workaround. Observed on PR #1063.
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      # `src/` is the source of truth and `dist/agent-src/` its projection; a PR
      # touching only these (e.g. a src/agent-src/scripts edit + its dist twin)
      # must still trigger the REQUIRED Consistency check or it deadlocks on
      # "Expected — Waiting for status to be reported".
      - "src/**"
      - "dist/agent-src/**"
      - "agents/**"
      - ".claude-plugin/marketplace.json"
      - "src/scripts/condense.ts"
      - "src/scripts/condense.sh"
      - "src/scripts/check_references.ts"
      - "src/scripts/check_evaluator_schema.ts"
      - "src/scripts/check_review_schema.ts"
      - "src/scripts/check_no_new_legacy_path.ts"
      - "src/scripts/build_cloud_bundle.ts"
      - "src/scripts/build_linear_digest.ts"
      - "src/scripts/lint_marketplace.ts"
      - "src/scripts/lint_agents_md.ts"
      - "AGENTS.md"
      - "tests/**"
      - "Taskfile.yml"
      - "taskfiles/**"
      # Any workflow-file change must trigger the REQUIRED Consistency check
      # too, or a workflow-only PR deadlocks on "Expected — Waiting for status".
      - ".github/workflows/**"
      # docs-only PR shape (per docs/contracts/branch-protection-policy.md):
      # Consistency is a REQUIRED check for docs-only PRs, so it must trigger
      # on the docs-only paths or such PRs deadlock (required check never runs).
      - "CHANGELOG.md"
      - "README.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - "llms.txt"
      - "docs/**"
  push:
    branches:
      - main
      - master
    paths:
      # `src/` is the source of truth and `dist/agent-src/` its projection; a PR
      # touching only these (e.g. a src/agent-src/scripts edit + its dist twin)
      # must still trigger the REQUIRED Consistency check or it deadlocks on
      # "Expected — Waiting for status to be reported".
      - "src/**"
      - "dist/agent-src/**"
      - "agents/**"
      - ".claude-plugin/marketplace.json"
      - "src/scripts/condense.ts"
      - "src/scripts/condense.sh"
      - "src/scripts/check_references.ts"
      - "src/scripts/check_evaluator_schema.ts"
      - "src/scripts/check_review_schema.ts"
      - "src/scripts/check_no_new_legacy_path.ts"
      - "src/scripts/build_cloud_bundle.ts"
      - "src/scripts/build_linear_digest.ts"
      - "src/scripts/lint_marketplace.ts"
      - "src/scripts/lint_agents_md.ts"
      - "AGENTS.md"
      - "tests/**"
      - "Taskfile.yml"
      - "taskfiles/**"
      # Any workflow-file change must trigger the REQUIRED Consistency check
      # too, or a workflow-only PR deadlocks on "Expected — Waiting for status".
      - ".github/workflows/**"
      # docs-only PR shape (per docs/contracts/branch-protection-policy.md):
      # Consistency is a REQUIRED check for docs-only PRs, so it must trigger
      # on the docs-only paths or such PRs deadlock (required check never runs).
      - "CHANGELOG.md"
      - "README.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - "llms.txt"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  consistency:
    name: Sync + Generate Tools Consistency
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # Full history — REQUIRED by the three plan-governance gates below,
          # and by nothing else in this job. The default depth-1 PR-merge fetch
          # gives you the merge commit and NOT its parents, which silently
          # breaks all three in different ways (found by the R2 review of this
          # gate, round 3, on exactly this file):
          #   · Gate R1's grandfather clause resolves "was there a commit
          #     before the activation date" via `git log` — unanswerable on a
          #     grafted depth-1 history, so all 14 grandfathered roadmaps fail
          #     `missing_register` and the step reds EVERY PR;
          #   · both R2 steps take `--base <pull_request.base.sha>`, which is
          #     not fetched at depth 1 → exit 2 → warn-and-allow, i.e. the
          #     layer the contract calls authoritative self-disables;
          #   · the findings-before-fixes ancestry check needs the fix commits
          #     as real objects, or every `fixed` row reads unresolvable.
          # The GitHub-API workaround the other PR-scoped steps use returns
          # changed FILES; it cannot answer a question about history. Deepening
          # inside the steps would re-introduce the auth-extraheader fetch race
          # this workflow documents, so the depth is set once, here.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node deps
        run: |
          # Retry once — the per-pack matrix fans out ~14 concurrent npm ci
          # calls; transient registry ECONNRESET would otherwise flake a job.
          npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000 \
            || (sleep 10 && npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000)

      - name: Set up Task
        uses: ./.github/actions/setup-task
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show tool versions
        run: |
          node --version
          task --version

      - name: Verify current sync state
        run: task sync-check

      # agents/index.md + docs/catalog.md embed every artefact description
      # verbatim, so any description edit makes them stale. `task ci` has caught
      # this locally for a long time; CI never did — which is how 16 stale rows
      # reached main after a description-shortening pass. A gate that only exists
      # on one side drifts silently on the other.
      - name: Verify the artefact index + catalog are regenerated
        run: task check-index

      # The archive index is generated from 500 archived roadmaps, so it goes
      # stale the moment a roadmap is archived — which happens inside the PR
      # that closes it. Registered here and not only in `task ci`, because no
      # workflow invokes `task ci`.
      - name: Verify the archive index is regenerated
        run: task check-archive-index

      # Registered in the job that `main protection` requires, deliberately.
      # A guard that only exists in a workflow file the candidate branch
      # supplies is bypassable by a branch that predates it; a required check
      # runs from the merge ref, so a stale branch cannot re-add the dashboard
      # and judge itself green. Same reason the archive-index step above sits
      # here rather than only in `task ci`.
      #
      # The NARROW task, not `roadmap-progress-check`: the full gate also
      # asserts estate-wide conditions over roadmaps an unrelated PR never
      # touched, and behind a required check that makes any pre-existing estate
      # defect a merge block on every PR. It did, the first time this step was
      # wired. Those conditions keep running in `task ci`.
      - name: Verify the roadmap dashboard is not committed
        run: task roadmap-dashboard-untracked-check

      # The source-confidentiality gate ran in `task ci` and NOWHERE ELSE, and
      # no workflow invokes `task ci` — so the check that exists to keep harvest
      # sources out of the tracked tree could not fail a pull request. Same
      # reason the archive-index and condensed-paths steps above sit here.
      #
      # The report is uploaded rather than only printed because the resolved
      # `how-loud-the-slug-heuristic-is` decision requires it: the heuristic
      # blocks inside agents/** and WARNS elsewhere, and both seats named the
      # same residual risk — attribution moved out of agents/** leaves only a
      # warning. Their condition for accepting that risk was that warnings be
      # "visible and RETAINED in CI artifacts", so a warn-tier hit is auditable
      # after the run instead of scrolling away in a log.
      - name: Block readable external inspiration/harvest source names
        run: task check-no-external-sources

      - name: Retain the attribution-shape report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: source-shape-report
          path: agents/runtime/reports/source-shape.json
          if-no-files-found: warn
          retention-days: 30

      - name: Verify dist == rewrite(src) byte-for-byte
        run: task check-condensation

      # A body link in a projected rule is what a consumer actually clicks, and
      # nothing remote checked that it resolves: this gate was reachable only
      # from `task ci`, which no workflow invokes. It stayed red on `main` with
      # two unfollowable cross-references while remote CI was green. Registered
      # next to check-condensation because both read the COMMITTED projection,
      # before the regeneration steps below overwrite it.
      - name: Verify projected rule links resolve
        run: task check-condensed-paths

      - name: Regenerate .augment from source
        run: task sync

      - name: Regenerate tool-specific outputs
        run: task generate-tools

      - name: Rule projection integrity — every rule reaches every host rule tree
        # conformance-round5 Phase 1.1/1.2. On a fresh checkout the host rule
        # trees are gitignored and absent, so HERE this is a generator-regression
        # leg: it proves generate-tools emitted every rule in its own emit plan.
        # The stale-tree half is caught on a working checkout by `task preflight`,
        # which runs it before anything regenerates.
        run: ./scripts-run src/scripts/check_rule_projection_integrity

      - name: Rule layer partition — no rule is delivered from both layers
        # road-to-single-rule-layer Phase 4. Companion to the step above, asking the
        # opposite question: that gate audits the trees against the generator's own
        # emit plan (completeness), so a plan that means to write a duplicate passes
        # it by construction. This one asks whether what the plan writes is already
        # delivered from the host's global layer.
        #
        # On this runner it compares nothing — the project trees are gitignored and
        # no CI leg installs at user scope — and it says so rather than printing a
        # success line. It has teeth in `task preflight` on a working checkout, and
        # it runs here so a syntax or import regression in it is caught by CI rather
        # than by the next maintainer's push.
        run: ./scripts-run src/scripts/check_rule_layer_partition

      - name: Evidence artifacts — a newly added one declares its type
        # road-to-release-review-p0 Phase 2. Diff-scoped: it checks only files
        # ADDED under agents/evidence/ relative to the resolved base ref, so a
        # branch that adds none scans nothing and says so rather than exiting
        # silently green. The pre-existing untyped corpus is a deliberate scope
        # exclusion — see docs/contracts/evidence-artifact-types.md.
        run: ./scripts-run src/scripts/lint_evidence_artifacts

      - name: Bridge derivation — generated trees are a fixpoint of src/
        # skill-quality-gates Phase 4: symlink targets stay inside the
        # derivation sources; a second regeneration changes nothing.
        run: ./scripts-run src/scripts/check_bridge_derivation

      - name: Never-silent — no shipped artefact directs a concealed miss
        # road-to-rule-delivery-integrity P4.4. Description passes, direction
        # fails: the discriminator is whether the negation stands BEFORE the
        # phrase, which is what keeps the self-repair-loop Iron Law green.
        run: ./scripts-run src/scripts/lint_never_silent

      - name: Detector corpus — three fixture classes per self-repair detector
        # road-to-rule-delivery-integrity P4.3. Precision and recall are separate
        # obligations: a detector carrying only `fire` cases looks perfect while
        # opening records on praise, which is what detectUserReport did until the
        # hardening landed. A missing class fails.
        run: ./scripts-run src/scripts/check_detector_corpus

      - name: Eval specifications — a gate on the measurement inputs
        # road-to-skill-ecosystem-eval-integrity Phase 1 Step 7. Promoted to a
        # PR-blocking gate on day one rather than landing advisory: the
        # classification that step asks for was run first and the corpus is
        # CLEAN across all 175 specifications, so there is no inherited debt an
        # advisory period could classify. Discrimination rests on --self-test
        # (7 cases, 5 rejecting), which is what a preventive gate over a clean
        # corpus has to rest on.
        run: ./scripts-run src/scripts/lint_eval_specs

      - name: Beta review deadlines — a lapsed contract is visible on the PR
        # road-to-contract-review-deadlines 2.1. The gate lived only in `task ci`,
        # which no workflow invokes, so its findings were red on main and invisible
        # — the failure class two comments in this same file already record twice.
        # The frozen 2026-08-25 baseline of 85 inherited lapses warns and does not
        # fail; a FRESH lapse fails, which is what a pull request needs to see.
        run: ./scripts-run src/scripts/check_beta_review_markers
      - name: Cross-skill links resolve in the DELIVERED tree
        # road-to-inbox-harvest-2026-08-f-skill-selection-evidence 2.2.
        # `check_references` already reports a broken path; what it cannot answer
        # is whether a link resolves in the SUBSET a consumer received. Corpus is
        # dist/agent-src/skills — what the installer deploys — and the pattern
        # deliberately does not close on `\)`, because two of the 976 links carry
        # an anchor and a link checker with a two-link blind spot reports clean
        # while missing the shape most likely to rot.
        run: ./scripts-run src/scripts/lint_skill_link_reach

      - name: Canonical terms — the house dialect, held by a ratchet
        # road-to-canonical-terms Phase 2. The corpus is NOT clean on day one:
        # `sweep_authorised: false` in src/config/canonical-terms.yml is a live
        # council constraint, so the gate reds only when the count RISES above
        # its recorded baseline. Report-only for existing debt, blocking for new.
        run: ./scripts-run src/scripts/lint_canonical_terms
      - name: Memory-twin parity — the two shipped copies may not drift apart
        # road-to-memory-twin-reconciliation Phase 3. package.json files[] ships
        # BOTH src/scripts/ and src/agent-src/templates/scripts/, and until this
        # gate nothing compared them — the divergence was found by a redundancy
        # audit rather than by CI. Non-comment lines only, so the deliberately
        # different headers do not fire it.
        run: ./scripts-run src/scripts/lint_memory_twin_parity

      - name: Host portability — grants and subagent types that resolve to nothing
        # road-to-skill-ecosystem-runtime-enforcement Phase 3 Steps 4-5. Both
        # defects are SILENT: a loader ignores an unrecognised grant key, so the
        # artefact reads restricted and inherits everything; a dispatch to an
        # undefined subagent type fails on the turn that needed it.
        run: ./scripts-run src/scripts/lint_host_portability

      - name: Supported-tools matrix ↔ adapter registry
        run: ./scripts-run src/scripts/lint_supported_tools_matrix

      - name: Host loadability — generated trees actually load
        run: ./scripts-run src/scripts/check_host_loadability --root .

      - name: Host loadability smoke (optional — self-skips without the claude CLI)
        # Real-host leg: claude plugin validate + temp-home install +
        # metadata cross-consistency. Required before releases via
        # `task smoke-host-loadability REQUIRE=1` (release flow).
        run: bash src/scripts/smoke_host_loadability.sh

      - name: Check cross-references
        run: ./scripts-run src/scripts/check_references

      - name: Evaluator-output contract conformance
        # Wired into this job rather than rule-backstops.yml for the reason the
        # comment below already records: this is the only required status check,
        # so a red here actually blocks a merge. Cost is negligible — the gate
        # reads recorded fixtures and runs no verifier.
        run: ./scripts-run src/scripts/check_evaluator_schema

      - name: Review-artifact independence declaration
        run: ./scripts-run src/scripts/check_review_schema

      # Both gates below were registered `enforced` and ran in NO workflow, so
      # each was its own finding: check_ci_local_parity exists to report gates
      # with no remote reach and had none itself, and check_gate_coverage — the
      # gate that reads every other gate's floor — was referenced by nothing at
      # all, not even `task ci`. Its reds were visible only to someone running
      # the script by hand. Wired here rather than into rule-backstops.yml
      # because this job is the only required status check
      # (docs/contracts/branch-protection-policy.md), which is what makes a red
      # actually block a merge. Cost, both steps measured rather than the
      # cheaper one: check_ci_local_parity 0.53 s, check_gate_coverage 18.6 s —
      # together ~19 s, about 26% on top of this job's recorded 75 s average,
      # against a 300 s per-job ceiling (docs/contracts/ci-cost-budget.md).
      # Comfortable, but not the "negligible" this comment first claimed: the
      # coverage gate spawns every registered gate to read its scanned: line.
      - name: CI ↔ local gate parity
        run: ./scripts-run src/scripts/check_ci_local_parity --quiet

      - name: Gate coverage floors
        run: ./scripts-run src/scripts/check_gate_coverage

      - name: No leftover conflict markers / unmerged paths
        run: ./scripts-run src/scripts/check_no_conflict_markers

      - name: Guard — no new legacy path under src/ (ADR-051)
        # PR-scoped: pull the diff via the GitHub API (gh) instead of
        # `git fetch <base>` — the shallow PR-merge checkout races with the
        # auth extraheader (same failure the kernel-rule-bundle step sidesteps).
        # NOTE: no --patch — that emits a per-commit format-patch series, so a
        # line added by one commit and fixed by a later commit in the same PR
        # would fail forever. The guard's contract is the NET diff of the PR.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr diff "${{ github.event.pull_request.number }}" \
            | ./scripts-run src/scripts/check_no_new_legacy_path --stdin

      - name: Design-token drift — generated CSS matches the canonical source
        # road-to-shared-design-tokens Phase 2: src/ui/tokens.css and the
        # emitted agent-switch block are generator outputs of
        # tokens/event4u-agent-tokens.json — hand-edits must fail here.
        run: |
          node tokens/build-ac.mjs --check
          node tokens/build-as.mjs --check
          node tokens/check-contrast.mjs

      - name: Check package portability
        run: ./scripts-run src/scripts/check_portability

      - name: Check condensation quality
        run: ./scripts-run src/scripts/check_condensation

      - name: Check Iron Law prominence
        run: ./scripts-run src/scripts/check_iron_law_prominence

      - name: Roadmap-estate ratchet + one-in-one-out (estate-drawdown T2/T3)
        # No exit-2 warn-and-allow wrapper, unlike the R1/R2 steps below: exit 2
        # here means the estate could not be counted, and a ratchet that passes
        # when it could not read its corpus is the false green this repo's
        # gate-coverage manifest exists to prevent.
        run: ./scripts-run src/scripts/check_estate_count

      - name: Gate R1 — plan Risk Registers (plan-review-gates §1)
        # Exit-code contract §6: 2 = internal error → degraded advisory
        # (warn-and-allow — a broken gate never blocks its own fix).
        run: |
          ./scripts-run src/scripts/lint_plan_risk_register || {
            rc=$?
            if [ "$rc" = "2" ]; then
              echo "::warning::lint_plan_risk_register internal error — degraded advisory mode, allowing"
            else
              exit "$rc"
            fi
          }

      - name: Gate R2 — completion review (Stage-A advisory window, plan-review-gates §2)
        # --advisory until the Stage-B threshold is committed to CLAIMS.md:
        # violations report as warnings, exit 0. CI is the authoritative
        # layer once enforced; exit 2 stays degraded-advisory either way.
        #
        # NO `git fetch origin main` HERE — that fetch races with the
        # configured auth extraheader on some runners (this workflow documents
        # it at the kernel-rule-bundle step), and swallowing the failure with
        # `|| true` leaves `--base` unresolvable → exit 2 → "degraded
        # advisory, allowing", i.e. the layer the contract calls authoritative
        # silently never runs. The base sha is a parent of the merge commit and
        # is present because this job checks out with `fetch-depth: 0` (see the
        # checkout step — at the default depth 1 the parents are NOT fetched,
        # which is precisely how this step self-disabled before).
        if: github.event_name == 'pull_request'
        run: |
          ./scripts-run src/scripts/check_completion_review \
            --advisory --base "${{ github.event.pull_request.base.sha }}" || {
            rc=$?
            if [ "$rc" = "2" ]; then
              echo "::warning::check_completion_review internal error — degraded advisory mode, allowing"
            else
              exit "$rc"
            fi
          }

      - name: Gate R2 — context-manifest re-derivation (plan-review-gates §5)
        # The reviewer-input manifest is verification, not self-attestation:
        # re-derive the input hashes and block on mismatch.
        #
        # Selection lives INSIDE the script (`--verify-current`), not in this
        # bash. Both obvious shell selectors are wrong and the R2 review of
        # this gate caught each in turn: grepping the header for the current
        # HEAD sha can never match (contract § 2.0), while looping over EVERY
        # artefact reds by construction the moment the tracked reviews
        # directory holds another branch's artefact — the directory-wide
        # poisoning § 2.6 forbids. `--verify-current` computes the scope
        # itself and verifies only the artefacts claiming it.
        #
        # Base sha passed directly for the same no-fetch reason as the step
        # above.
        if: github.event_name == 'pull_request'
        run: |
          ./scripts-run src/scripts/dispatch_r2_reviewer \
            --verify-current --base "${{ github.event.pull_request.base.sha }}" || {
            rc=$?
            if [ "$rc" = "2" ]; then
              echo "::warning::dispatch_r2_reviewer --verify-current internal error — degraded advisory mode, allowing"
            else
              exit "$rc"
            fi
          }

      - name: No cost surface prints a currency figure
        # road-to-delivered-cost-truth AC-7. Tokens only: the suite does not know
        # the consumer's contract, so a monetary figure would be extrapolated
        # from an invented rate.
        run: |
          ./scripts-run src/scripts/check_no_currency_in_cost_surfaces || {
            rc=$?
            if [ "$rc" = "2" ]; then
              echo "::warning::check_no_currency_in_cost_surfaces internal error — degraded advisory mode, allowing"
            else
              exit "$rc"
            fi
          }

      - name: No mid-session mutation of a prefix-stable surface
        # The runtime half of prefix stability (road-to-runtime-context-floors
        # 1.2). The surface list is LOADED from _lib/prefix_stable_surfaces.ts,
        # the same module check_preamble_payload_budget resolves its census
        # roots from — two lists describing one boundary is the drift shape this
        # repository already pays for. Exit 2 is degraded-advisory, matching
        # every sibling step.
        run: |
          ./scripts-run src/scripts/check_prefix_stable_mutation || {
            rc=$?
            if [ "$rc" = "2" ]; then
              echo "::warning::check_prefix_stable_mutation internal error — degraded advisory mode, allowing"
            else
              exit "$rc"
            fi
          }

      - name: Every model-facing lossy transform declares its loss class
        # road-to-runtime-context-floors 3.2. Scoped to model-facing paths by
        # council verdict: failing every transform in src/ buys a first-run
        # backlog whose usual answer is a broad allowlist, and this repository
        # has measured an allowlist emptying a gate.
        run: |
          ./scripts-run src/scripts/check_loss_class_declared || {
            rc=$?
            if [ "$rc" = "2" ]; then
              echo "::warning::check_loss_class_declared internal error — degraded advisory mode, allowing"
            else
              exit "$rc"
            fi
          }

      - name: Benchmark reports carry the required cache fields
        # road-to-runtime-context-floors 4.1. Uncomputable is a stated reason,
        # never a blank and never a zero.
        run: |
          ./scripts-run src/scripts/check_benchmark_report_fields || {
            rc=$?
            if [ "$rc" = "2" ]; then
              echo "::warning::check_benchmark_report_fields internal error — degraded advisory mode, allowing"
            else
              exit "$rc"
            fi
          }

      - name: The authoring-search record is well-formed where it exists
        # Two halves with different teeth. STRUCTURAL is hard: a present
        # `composition_review` whose candidate resolves to no artefact, or whose
        # `none`/`none_found` pair disagrees, exits 1 — a record naming an
        # incumbent that is not in the tree reads as evidence of a search that
        # cannot have happened, which is worse than carrying no record.
        # PRESENCE is advisory and exits 0: an added artefact without a record
        # is reported by path. Flipping that to a block needs a false-positive
        # rate from at least one release of advisory operation, which
        # road-to-composition-before-creation records as not yet measured and
        # explicitly does not pre-authorise.
        #
        # Exit 2 is degraded-advisory here, matching every sibling step; a dead
        # scan scope is exit 1 inside the gate for the same reason the step
        # below states — otherwise a moved corpus root downgrades the hard half
        # to advisory without anyone noticing.
        run: |
          ./scripts-run src/scripts/lint_composition_review || {
            rc=$?
            if [ "$rc" = "2" ]; then
              echo "::warning::lint_composition_review internal error — degraded advisory mode, allowing"
            else
              exit "$rc"
            fi
          }

      - name: Archived-review dispositions are terminal (plan-review-gates §2.7)
        # NOT gated on `pull_request`, unlike the two R2 steps above: those
        # evaluate the current diff, this reads the FROZEN records, which R2
        # never looks at because § 2.6 scopes it to the current review scope.
        # A superseded round renamed out of the `*.findings.md` glob is read by
        # nothing at all — that gap is how two findings sat recorded as `open`
        # in this repo's own corpus for a day.
        #
        # Same exit-code contract § 6: 2 = internal error → warn-and-allow, so a
        # broken gate never blocks its own fix. Exit 1 blocks, and a dead scan
        # scope is deliberately exit 1 rather than 2 — otherwise a moved reviews
        # root would silently downgrade this gate to advisory.
        run: |
          ./scripts-run src/scripts/check_review_dispositions || {
            rc=$?
            if [ "$rc" = "2" ]; then
              echo "::warning::check_review_dispositions internal error — degraded advisory mode, allowing"
            else
              exit "$rc"
            fi
          }

      - name: Evidence artifacts declare what kind of evidence they are
        # A review this repo RECEIVED and a findings artifact binding a diff
        # right now read identically today, so a reader cannot tell whether a
        # stored artifact still asserts anything. This checks the half that is
        # globally decidable: a declared type must agree with its body.
        #
        # Same exit-code contract § 6: 2 = internal error → warn-and-allow, so a
        # broken gate never blocks its own fix. A dead scan scope is exit 1, not
        # 2 — otherwise a moved evidence root would downgrade this to advisory.
        run: |
          ./scripts-run src/scripts/lint_evidence_artifacts --all || {
            rc=$?
            if [ "$rc" = "2" ]; then
              echo "::warning::lint_evidence_artifacts internal error — degraded advisory mode, allowing"
            else
              exit "$rc"
            fi
          }

      - name: Check always-rule budget (warn 80% / fail 90%)
        run: task check-always-budget

      - name: Runtime dependency floors are settled minors (ETARGET unreachable)
        # npm resolves `dependencies` on the CONSUMER's machine, before our bin
        # is executed — a floor pinned to a just-published patch cannot be
        # retried or explained at runtime, only prevented here.
        run: task check-dependency-floors

      - name: Payload budget — compressed tarball + per-skill share
        # Buildless (`npm pack --ignore-scripts`), so it runs on EVERY PR in
        # seconds and catches content accretion where it happens. The built
        # artifact's unpacked size stays owned by the release-time
        # evaluator-umbrella budget; this is not a second gate on that number.
        run: task check-pack-size

      - name: Payload delta vs base — reported, never gated
        # AC-4 of road-to-npm-payload-reduction: the number must APPEAR on a PR
        # that adds payload and be ABSENT on one that does not, so the step
        # writes to the job summary only when the delta is non-zero. A line that
        # always appears is a line nobody reads.
        #
        # `continue-on-error` is deliberate and is the whole design: this is a
        # report. The absolute cap above owns the refusal, and a reporter that
        # can red the build is a second cap with no derivation behind it.
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          git fetch --quiet --depth=200 origin "${{ github.base_ref }}" || true
          ./scripts-run src/scripts/report_pack_delta \
            --base "origin/${{ github.base_ref }}" --head HEAD --markdown > /tmp/pack-delta.md || exit 0
          if grep -q 'unchanged: +0.0 KB' /tmp/pack-delta.md; then
            echo "packed payload unchanged vs origin/${{ github.base_ref }} — nothing to report"
            exit 0
          fi
          cat /tmp/pack-delta.md >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/pack-delta.md

      - name: Token-surface regression (>5% over the recorded baseline)
        # `internal/bench/reports/projection-cost.json` is gitignored, so it never
        # exists on a fresh checkout. The task target carries `deps: [audit-tokens]`
        # and regenerates it in-job — invoking the script directly would read a
        # stale (or absent) report. Until 2026-07-30 this gate ran only in local
        # `task ci`, which is why a +10.3% eager-rule drift went unseen for 23 days.
        run: task check-token-regression

      - name: Lint workflow files (actionlint)
        # PR #1059 shipped a step with two `run:` keys. GitHub rejects duplicate
        # keys, so the whole REQUIRED Consistency check died on main — while the
        # local `yaml.safe_load` validation reported OK, because safe_load keeps
        # the last duplicate silently. actionlint catches that class before merge.
        #
        # PR-SCOPED ON PURPOSE. Run repo-wide, actionlint reports pre-existing
        # findings in workflows this PR never touched (shellcheck style nits, and
        # one real one: an unknown `administration` permission scope in
        # sync-visibility.yml). Cleaning those is its own change with its own
        # review; gating on them here would either block unrelated work or invite
        # a blanket ignore-list. Linting what the PR changed is what catches the
        # #1059 class, which is the reason this step exists.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t WF < <(gh pr diff "${{ github.event.pull_request.number }}" \
            --name-only | grep -E '^\.github/workflows/.*\.ya?ml$' || true)
          if [ "${#WF[@]}" -eq 0 ]; then
            echo "No workflow files changed in this PR — nothing to lint."
            exit 0
          fi
          printf 'linting %s changed workflow file(s):\n' "${#WF[@]}"
          printf '  %s\n' "${WF[@]}"
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color "${WF[@]}"

      - name: Kernel-rule budget (bucket + per-rule caps)
        # Wired here as the condition ADR-203 attaches to narrowing the
        # safety-floor lock: the gate that DECIDES whether kernel rules must be
        # edited may not stay local-only while the gate that BLOCKS those edits
        # runs on every PR. Both council members required this, from opposite
        # verdicts. It merges with the narrowing, never before it.
        run: task lint-rule-budget

      - name: Check kernel-rule bundle (one rule per PR; label override)
        # Phase 4.2 of road-to-always-budget-relief — slow-rollout guarantee.
        # Override: PR label `bundled-always-rules-acknowledged`.
        # actions/checkout@v7 uses a shallow PR-merge fetch, so `git fetch
        # origin <base>` can race with the configured auth extraheader on
        # some runners (observed: "could not read Username for github.com").
        # Sidestep the fetch entirely by pulling the PR's changed-file list
        # from the GitHub API via `gh pr view` and feeding it to the script
        # through its `--files` override.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t CHANGED < <(gh pr view "${{ github.event.pull_request.number }}" \
            --json files --jq '.files[].path')
          if [ "${#CHANGED[@]}" -eq 0 ]; then
            echo "No changed files reported by gh pr view; nothing to gate."
            exit 0
          fi
          ./scripts-run src/scripts/check_kernel_rule_bundle --files "${CHANGED[@]}"

      - name: Lint marketplace.json
        run: task lint-marketplace

      - name: Lint AGENTS.md (Thin-Root contract)
        run: task lint-agents-md

      # Wired explicitly rather than relying on the `ci:` task list: no workflow
      # invokes `task ci`, so a gate registered only there never runs remotely.
      - name: Lint settings A/B/C classes (every template leaf is classified)
        run: task lint-settings-classes

      # Same reason, and it is why the sibling `check-reach-staleness` has been
      # local-only since it shipped: registering a gate in `taskfiles/*.yml` and
      # in the `ci:` list gives it zero remote reach.
      - name: Corpus staleness + CSV integrity (declared cadence, declared columns)
        run: task check-corpus-staleness

      # Third instance of the same pattern, and the first one a MECHANISM caught
      # rather than a reader: this gate was added to the `ci:` list with no
      # workflow step, and the newly-repaired `ci-parity:local-only` ratchet
      # refused the merge that brought it in. Wired here rather than raising the
      # ratchet, which its own failure message calls a defect. Passes on the
      # tree it lands on.
      - name: Design-antipattern catalog ↔ rule parity
        run: task lint-design-antipattern-parity

      # Fourth instance, wired at birth rather than after the ratchet caught it.
      # Reports on an ordinary branch and exits 0; the refusal lives behind
      # `--release-major`, which the release flow passes at the cut. Remote reach
      # matters here specifically: the row this gate found overdue was missed by
      # a human pre-flight checkbox, so a local-only registration would repeat
      # the failure mode with a different reader.
      - name: Scheduled deprecations are checked by arithmetic, not by memory
        run: task lint-scheduled-deprecations

      - name: Cloud bundle dry-run (source invariants)
        run: task ci-cloud-bundle

      - name: Linear digest dry-run (no per-rule drift, under budget)
        run: task ci-linear-digest

      - name: Build discovery manifest (R3 Phase 2.1)
        run: ./scripts-run src/scripts/build_discovery_manifest --write --quiet

      - name: Lint discovery manifest — schema + checksum + vocab (R3 Phase 2.2)
        run: ./scripts-run src/scripts/lint_discovery_manifest --quiet

      - name: Discovery scanner determinism (R3 Phase 2.3)
        run: ./scripts-run src/scripts/check_discovery_determinism

      - name: Lint README
        run: ./scripts-run src/scripts/readme_linter README.md --root .

      - name: Check for unexpected changes
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated files are out of sync with source-of-truth."
            echo
            echo "Please run:"
            echo "  task sync"
            echo "  task generate-tools"
            echo
            echo "Changed files:"
            git status --short
            echo
            echo "Diff:"
            git diff --stat
            exit 1
          fi

      - name: Upload diff artifact on failure
        if: failure()
        run: |
          mkdir -p artifacts
          git status --short > artifacts/status.txt || true
          git diff > artifacts/consistency.diff || true

      - name: Upload consistency artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: consistency-artifacts
          path: artifacts/
