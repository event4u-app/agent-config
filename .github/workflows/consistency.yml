name: Consistency

on:
  pull_request:
    paths:
      - ".agent-src.uncondensed/**"
      - ".augment/**"
      - "agents/**"
      - ".claude-plugin/marketplace.json"
      - "scripts/condense.py"
      - "scripts/condense.sh"
      - "scripts/check_references.py"
      - "scripts/build_cloud_bundle.py"
      - "scripts/build_linear_digest.py"
      - "scripts/lint_marketplace.py"
      - "scripts/lint_agents_md.py"
      - "AGENTS.md"
      - "tests/**"
      - "Taskfile.yml"
      - "taskfiles/**"
      - ".github/workflows/consistency.yml"
  push:
    branches:
      - main
      - master
    paths:
      - ".agent-src.uncondensed/**"
      - ".augment/**"
      - "agents/**"
      - ".claude-plugin/marketplace.json"
      - "scripts/condense.py"
      - "scripts/condense.sh"
      - "scripts/check_references.py"
      - "scripts/build_cloud_bundle.py"
      - "scripts/build_linear_digest.py"
      - "scripts/lint_marketplace.py"
      - "scripts/lint_agents_md.py"
      - "AGENTS.md"
      - "tests/**"
      - "Taskfile.yml"
      - "taskfiles/**"
      - ".github/workflows/consistency.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  consistency:
    name: Sync + Generate Tools Consistency
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Set up Task
        uses: arduino/setup-task@v2

      - name: Install Python dependencies
        # pyyaml:     required by check_always_budget.py (parses rule frontmatter).
        # jsonschema: required by scripts/lint_discovery_manifest.py (R3 Phase 2).
        run: pip install pytest pyyaml jsonschema

      - name: Show tool versions
        run: |
          python3 --version
          task --version

      - name: Verify current sync state
        run: task sync-check

      - name: Verify condensation hashes
        run: task sync-check-hashes

      - name: Regenerate .augment from source
        run: task sync

      - name: Regenerate tool-specific outputs
        run: task generate-tools

      - name: Check cross-references
        run: python3 scripts/check_references.py

      - name: Check package portability
        run: python3 scripts/check_portability.py

      - name: Check condensation quality
        run: python3 scripts/check_condensation.py

      - name: Check Iron Law prominence
        run: python3 scripts/check_iron_law_prominence.py

      - name: Check always-rule budget (warn 80% / fail 90%)
        run: task check-always-budget

      - name: Check kernel-rule bundle (one rule per PR; label override)
        # Phase 4.2 of road-to-always-budget-relief — slow-rollout guarantee.
        # Override: PR label `bundled-always-rules-acknowledged`.
        # actions/checkout@v4 uses a shallow PR-merge fetch, so `git fetch
        # origin <base>` can race with the configured auth extraheader on
        # some runners (observed: "could not read Username for github.com").
        # Sidestep the fetch entirely by pulling the PR's changed-file list
        # from the GitHub API via `gh pr view` and feeding it to the script
        # through its `--files` override.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t CHANGED < <(gh pr view "${{ github.event.pull_request.number }}" \
            --json files --jq '.files[].path')
          if [ "${#CHANGED[@]}" -eq 0 ]; then
            echo "No changed files reported by gh pr view; nothing to gate."
            exit 0
          fi
          python3 scripts/check_kernel_rule_bundle.py --files "${CHANGED[@]}"

      - name: Lint marketplace.json
        run: task lint-marketplace

      - name: Lint AGENTS.md (Thin-Root contract)
        run: task lint-agents-md

      - name: Cloud bundle dry-run (source invariants)
        run: task ci-cloud-bundle

      - name: Linear digest dry-run (no per-rule drift, under budget)
        run: task ci-linear-digest

      - name: Build discovery manifest (R3 Phase 2.1)
        run: python3 scripts/build_discovery_manifest.py --write --quiet

      - name: Lint discovery manifest — schema + checksum + vocab (R3 Phase 2.2)
        run: python3 scripts/lint_discovery_manifest.py --quiet

      - name: Discovery scanner determinism (R3 Phase 2.3)
        run: python3 scripts/check_discovery_determinism.py

      - name: Lint README
        run: python3 scripts/readme_linter.py README.md --root .

      - name: Run README linter tests
        run: python3 -m pytest tests/test_readme_linter.py -v

      - name: Check for unexpected changes
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated files are out of sync with source-of-truth."
            echo
            echo "Please run:"
            echo "  task sync"
            echo "  task generate-tools"
            echo
            echo "Changed files:"
            git status --short
            echo
            echo "Diff:"
            git diff --stat
            exit 1
          fi

      - name: Upload diff artifact on failure
        if: failure()
        run: |
          mkdir -p artifacts
          git status --short > artifacts/status.txt || true
          git diff > artifacts/consistency.diff || true

      - name: Upload consistency artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: consistency-artifacts
          path: artifacts/
