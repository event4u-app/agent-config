name: Gate canary (monthly + manual)

# Step 4.2 of road-to-gates-a-pull-request-can-hear.
#
# `check_gate_coverage --canary` plants one declared violation per gate that
# carries a recipe in src/config/gate-coverage.yml, runs the gate, records
# red/green, and deletes the plant in a `finally`. Until this workflow it had no
# caller — no task, no workflow, no package.json script — so "when did the
# canary last run" had no answer anyone could look up.
#
# WHY SCHEDULED AND NOT PER-PR. The canary mutates the tree it runs in, which is
# why the gate's own prose keeps it off the per-PR path. Here it mutates a
# throwaway checkout on a runner that is discarded afterwards, and the only
# thing kept is the ledger, uploaded as a run artifact. This is NOT a required
# check and must not become one.
#
# CADENCE. Monthly. `adversarial-review-protocol` § 6 sets biannual as the
# minimum for the gate-surface canary; running more often costs one runner hour
# and shortens the window in which a gate can be dead without anyone knowing.
#
# READ-ONLY on the repository: it never commits and never pushes. The plants
# exist only in the runner's working copy.

on:
  workflow_dispatch:
  schedule:
    # 05:00 UTC on the 1st of each month.
    - cron: "0 5 1 * *"

# One run at a time: a manual dispatch during a scheduled run waits rather than
# overlapping it, so two ledgers for the same day are never written at once.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  canary:
    name: Plant one defect per gate and record which ones went red
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history: several gates resolve `origin/main` or walk history,
          # and a shallow clone would make them exit non-zero for a reason
          # unrelated to the plant — which the canary would record as caught.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node deps
        run: |
          npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000 \
            || (sleep 10 && npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000)

      - name: Run the gate canary
        id: canary
        run: |
          ledger="agents/evidence/reviews/canary/gate-surface-$(date -u +%Y-%m-%d)-ci.md"
          echo "ledger=${ledger}" >> "$GITHUB_OUTPUT"
          ./scripts-run src/scripts/check_gate_coverage --canary --ledger "${ledger}"

      - name: Upload the canary ledger
        # Only when the canary step got far enough to name a ledger; otherwise
        # this step would add a second, misleading failure to the real one.
        if: always() && steps.canary.outputs.ledger != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: gate-canary-ledger
          path: ${{ steps.canary.outputs.ledger }}
          if-no-files-found: error
          retention-days: 90

  # --------------------------------------------------------------------------
  # The local-only gates whose verdict is NOT a property of the diff.
  #
  # Phase 2.3 of road-to-local-gates-wired-while-they-are-green. Thirteen of the
  # 163 undeclared local-only gates either call `checkRatchet` — where a
  # baseline unchanged for `STALE_AFTER_DAYS = 56` fails with no diff at all —
  # or print an `as-of:` verdict line. One more, `audit_command_surface`, is
  # green and takes 43.5 s, which is 48 % of the serial time of all 161
  # measured gates put together.
  #
  # NONE OF THEM MAY BE A STEP OF A REQUIRED JOB, and that is the roadmap's
  # decision D2 rather than a convenience: a gate that turns red because a
  # fortnight passed would block every open pull request for a reason no
  # author caused, which is the "trains people to ignore it" shape
  # src/config/ci-local-parity.yml's own header argues against.
  #
  # A SECOND JOB, NOT STEPS IN THE CANARY JOB. `check_gate_coverage --canary`
  # mutates the tree it runs in — it plants one declared violation per gate and
  # deletes it in a `finally`. A gate running in the same job after it would be
  # reading a tree with a plant in it, or a tree a failed `finally` left dirty.
  # This job gets its own checkout.
  #
  # `check_council_pin_staleness` is here for the third reason the roadmap
  # names: the coverage manifest marks it `enforced` and it appears in NO task
  # and NO workflow, so nothing ran it at all. It reads three dated council
  # pins against a 100-day cadence, which makes a scheduled caller the only
  # correct kind.
  #
  # READ-ONLY, like its sibling job: nothing here commits or pushes, and none
  # of it is a required check.
  local-only-scheduled:
    name: Local-only gates whose verdict reads the calendar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history: the ratchet readers resolve `origin/main` and walk
          # history, and a shallow clone makes them exit non-zero for a reason
          # unrelated to their subject.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node deps
        run: |
          npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000 \
            || (sleep 10 && npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000)

      # `--quiet` IS NOT UNIVERSAL, and four gates here reject it with exit 2
      # (`unrecognized arguments: --quiet`) rather than ignoring it:
      # domain_soundness_status, lint_roadmap_later_disposition,
      # skill_eval_coverage and lint_one_off_age. They are invoked bare. This
      # was found by dispatching the workflow manually on the branch — nothing
      # else would have: this file runs on `schedule` and `workflow_dispatch`
      # only, so a pull request never exercises it and the error would have
      # surfaced first on a nightly run nobody was watching.
      - name: Ratchet-age readers
        run: |
          rc=0
          ./scripts-run src/scripts/check_roadmap_trackable --quiet || rc=1
          ./scripts-run src/scripts/domain_soundness_status || rc=1
          ./scripts-run src/scripts/lint_artefact_frontmatter --quiet || rc=1
          ./scripts-run src/scripts/lint_handoffs --quiet || rc=1
          ./scripts-run src/scripts/lint_provenance_vocabulary --quiet || rc=1
          ./scripts-run src/scripts/lint_roadmap_blockers --quiet || rc=1
          ./scripts-run src/scripts/lint_roadmap_later_disposition || rc=1
          ./scripts-run src/scripts/skill_eval_coverage || rc=1
          exit "$rc"

      - name: As-of verdict lines
        if: always()
        run: |
          rc=0
          ./scripts-run src/scripts/check_knowledge_pages || rc=1
          ./scripts-run src/scripts/check_reach_staleness --quiet || rc=1
          ./scripts-run src/scripts/lint_hook_manifest --quiet || rc=1
          ./scripts-run src/scripts/lint_one_off_age || rc=1
          ./scripts-run src/scripts/lint_symptom_intake --quiet || rc=1
          exit "$rc"

      - name: The council pins, which had no caller at all
        if: always()
        run: ./scripts-run src/scripts/check_council_pin_staleness

      # `--baseline origin/main`, and the task's own argv omits it. The script
      # defaults its baseline to the bare name `main`, which resolves in a
      # developer's checkout where `main` is a real local branch and does NOT
      # resolve on a runner, where `actions/checkout` leaves no local `main`:
      # `git diff main...HEAD` exited 128 with "ambiguous argument". The
      # remote-tracking ref is what exists in both places.
      #
      # What this step does NOT claim: on a scheduled run of the default branch
      # `origin/main` and `HEAD` are the same commit, so `--check-new` has no
      # new commands to find and only the gate's budget half does real work.
      # That is a property of running a diff-shaped gate on a schedule, and it
      # is written down rather than left for the next reader to discover — the
      # gate is here because it is `slow` (43.5 s, 48 % of the serial time of
      # all 161 measured gates), which is a cost argument, not a claim that a
      # scheduled run exercises all of it.
      - name: The one slow gate — 43.5 s locally, too expensive for a pull request
        if: always()
        run: ./scripts-run src/scripts/audit_command_surface --check-new --baseline origin/main --quiet
