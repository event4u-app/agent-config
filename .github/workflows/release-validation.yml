name: Release Validation

# Tight release-shape gate that runs ONLY on release PRs (head branch
# matches `release/X.Y.Z`). Replaces the heavy install / test matrices
# `tests.yml` + `smoke-public-install.yml` skip on the same condition
# per docs/contracts/release-pr-gating.md.
#
# Shape jobs, all targeting fast wall-clock:
#   1. release-shape          — fail-closed shape detector via
#                               scripts/check_release_pr_shape.py
#   2. changelog-entry        — CHANGELOG.md must carry a non-empty section
#                               matching the version on the head branch
#   3. version-consistency    — package.json / marketplace.json agree on the
#                               version (pack manifests carry no version field)
#   4. surface-equality       — PR body equals the CHANGELOG entry
#                               (release-truth Phase 1; whitespace-normalized)
#   5. highlight-plausibility — curated head cannot say `_none_` against a
#                               populated span category (release-truth Phase 2)
#   6. finding-dispositions   — blocking self-review findings carry committed
#                               dispositions (release-truth Phase 3)
#
# Plus the job that closes the 9.8.0 skip-class (a release shipped
# without src/install/ across two minors; caught only after publish
# because nothing between merge and tag installed the actual packed
# tarball as a consumer):
#   7. release-install-e2e — packs the tarball, installs it into an
#                            isolated global npm prefix, upgrades from a
#                            cached 9.7.0 baseline, boots the GUI server
#                            headless, runs reach:doctor, and the repo-side
#                            secret gate.
#
# Trigger:
#   * `pull_request` against main, filtered to the release/install input
#     paths (see `on:`). The three shape jobs stay head-branch-gated to
#     `release/*`; `release-install-e2e` runs on any matching PR. push: main
#     and tag triggers are owned by release-guard.yml — this workflow is
#     PR-only by construction (it gates the PR before merge).

on:
  pull_request:
    branches: [main, master]
    # GitHub doesn't natively filter pull_request triggers by head branch
    # pattern, only by base + paths. The four release-SHAPE jobs below keep
    # their inline `if:` guard (they assert facts that only exist on a
    # `release/X.Y.Z` branch), so non-release PRs see them as "skipped"
    # rather than "failed".
    #
    # The `paths` filter is what lets the one version-agnostic job —
    # `release-install-e2e` — also run on the PR that CAUSES an install
    # regression instead of only at release time (road-to-gates-that-can-fail
    # Phase 4). Release PRs still trigger the whole workflow by construction:
    # `release.ts` bumps `package.json` on every release branch, so the first
    # entry always matches a release diff — including a release PR whose diff
    # leaves the version-bump allowlist, which is exactly when `release-shape`
    # must still run and go red.
    paths:
      - 'package.json'            # `files[]` + the release version bump
      - 'package-lock.json'
      - 'CHANGELOG.md'            # `changelog-entry` reads it
      # `version-consistency` reads it. The manifest has never lived at the
      # repo root — `lint_marketplace.ts` opens `.claude-plugin/marketplace.json`
      # (and its Augment twin ships alongside). The bare root path this entry
      # carried matched nothing, so a version drift in the manifest did not
      # re-trigger the job whose whole purpose is to catch that drift.
      - '.claude-plugin/marketplace.json'
      - '.augment-plugin/marketplace.json'
      - '.augment-plugin/plugin.json'
      - 'src/scripts/install.ts'  # what release-install-e2e exercises
      - 'src/scripts/release.ts'
      - 'agents/evidence/release-findings/**'  # `finding-dispositions` reads it
      - 'tests/test_release_install_e2e.sh'
      - '.github/workflows/release-validation.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-shape:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/') }}
    name: Release-PR shape detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # Need the full PR diff, not just the merge commit.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node deps
        run: |
          npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000 \
            || (sleep 10 && npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000)

      - name: Check release-PR shape
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr_num="${{ github.event.pull_request.number }}"
          if [ -z "${pr_num:-}" ]; then
            echo "::warning::No PR context — skipping shape check (workflow_dispatch)"
            exit 0
          fi
          ./scripts-run src/scripts/check_release_pr_shape --pr "$pr_num"

  changelog-entry:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/') }}
    name: CHANGELOG entry exists for head version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Assert CHANGELOG.md has a non-empty section for the release
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          # Extract X.Y.Z from `release/X.Y.Z`. Fail closed on missing branch.
          if [ -z "${HEAD_REF:-}" ]; then
            echo "::warning::No head_ref — likely workflow_dispatch; skipping."
            exit 0
          fi
          version="${HEAD_REF#release/}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::head_ref '$HEAD_REF' is not a release/X.Y.Z branch."
            exit 1
          fi
          # Look for a CHANGELOG header line containing the exact version.
          # The release.ts-generated entries use `## X.Y.Z (...)` shape; we
          # match the version anywhere in a heading line to stay tolerant
          # of date suffixes, status labels, etc.
          if ! grep -E "^#+ .*\b${version//./\\.}\b" CHANGELOG.md > /tmp/cl-match.txt; then
            echo "::error::CHANGELOG.md has no heading for version $version."
            echo "Run \`task release\` from main; do not hand-edit the changelog."
            exit 1
          fi
          echo "Matched CHANGELOG headings:"
          cat /tmp/cl-match.txt
          # Assert the section under the first matching heading is non-empty.
          # The single quotes below fence a JS program — `$&` and friends are
          # JavaScript, and shell expansion would corrupt them. Directive must
          # stay on the line directly above the command it covers.
          # shellcheck disable=SC2016
          node -e '
          const fs = require("node:fs");
          const version = process.argv[1];
          const text = fs.readFileSync("CHANGELOG.md", "utf8");
          const esc = version.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          // Find the first RELEASE heading containing the version as a whole
          // word. Release entries are `## [X.Y.Z](...)` — level 2 or deeper.
          // Level-1 headings are era banners (`# Era: pre-9.9.0 — archived`,
          // `# Era: 9.9.x — current`), and an era split names the archived era
          // after the INCOMING version, so a `#+` match would anchor on the
          // archive pointer — whose body is a two-line blockquote with no
          // Tests: footer — and fail a perfectly good release section. That is
          // exactly what happened on 9.9.0, the first release whose era split
          // produced a `pre-<this version>` banner.
          const pat = new RegExp(`^(#{2,}) [^\\n]*\\b${esc}\\b[^\\n]*$`, "m");
          const m = pat.exec(text);
          if (!m) {
            console.error(`::error::Could not re-locate ${version} heading in CHANGELOG.md`);
            process.exit(1);
          }
          // Body runs to the next heading at the same level or shallower.
          const level = m[1].length;
          const start = m.index + m[0].length;
          const tail = text.slice(start);
          const next = new RegExp(`^#{1,${level}} `, "m").exec(tail);
          const body = next ? tail.slice(0, next.index) : tail;
          if (!body.trim()) {
            console.error(`::error::CHANGELOG section for ${version} is empty.`);
            process.exit(1);
          }
          // Tests-footer convention (every release since 9.1.0): the section
          // must end with `Tests: N (+M since X.Y.Z)`. release.ts renders it
          // but degrades SILENTLY to null on collection failure — 9.8.0
          // shipped without the line. This check makes the absence red at
          // release-PR time instead of remembered.
          if (!/^Tests: \d+/m.test(body)) {
            console.error(`::error::CHANGELOG section for ${version} is missing the \`Tests: N (+M since PREV)\` footer line.`);
            console.error("release.ts renders it via _render_test_trend_line; a missing line means vitest collection failed during `task release` — fix the collection, do not hand-wave the footer.");
            process.exit(1);
          }
          console.log(`CHANGELOG section for ${version} has ${body.trim().split("\n").length} line(s) of body incl. Tests footer.`);
          ' "$version"

  surface-equality:
    # Release-truth Phase 1: the PR body must EQUAL the CHANGELOG entry
    # (whitespace-normalized) — release.ts derives every surface from the
    # changelog section at the branch head, and this gate proves the
    # derivation held at the head CI actually sees. Re-runs on every push
    # to the release branch, so a late commit that edits the entry without
    # a PR-body refresh goes red instead of shipping the 9.14.0 desync.
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/') }}
    name: PR body equals CHANGELOG entry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node deps
        run: |
          npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000 \
            || (sleep 10 && npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000)

      - name: Compare PR body against the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./scripts-run src/scripts/check_release_surface_equality --pr "${{ github.event.pull_request.number }}"

  highlight-plausibility:
    # Release-truth Phase 2: the curated head cannot silently lie. Generated
    # categories are derived from the release span (security commits,
    # behaviour/default changes, honest-null markers, removed public
    # surface); a populated category meeting a `_none_` curated field is
    # red. A human still writes the prose — the gate only blocks the
    # contradiction (the recorded 9.13.0/9.14.0 false-`_none_` failure).
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/') }}
    name: Curated highlights plausible against the span
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # The span derivation walks prev-tag..HEAD — needs history + tags.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node deps
        run: |
          npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000 \
            || (sleep 10 && npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000)

      - name: Derive span categories and compare against the curated head
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          version="${HEAD_REF#release/}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::head_ref '$HEAD_REF' is not a release/X.Y.Z branch."
            exit 1
          fi
          git fetch --tags --quiet origin
          ./scripts-run src/scripts/check_release_highlights --version "$version"

  version-consistency:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/') }}
    name: package.json / marketplace.json / pack manifests agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node deps (yaml parser)
        run: |
          npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000 \
            || (sleep 10 && npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000)

      - name: Re-run the version-consistency assertion against the PR ref
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          pkg=$(jq -r '.version' package.json)
          mp=$(jq -r '.metadata.version' .claude-plugin/marketplace.json)
          # The Augment twins. Both were in `paths:` above while NO job read
          # them, so a drift there re-triggered this workflow and then nothing
          # looked at the file — a trigger without a reader. Every version field
          # is enumerated because the two manifests nest differently:
          # plugin.json has one, marketplace.json has three.
          ap=$(jq -r '.version' .augment-plugin/plugin.json)
          am_top=$(jq -r '.version' .augment-plugin/marketplace.json)
          am_meta=$(jq -r '.metadata.version' .augment-plugin/marketplace.json)
          am_plugins=$(jq -r '[.plugins[].version] | unique | join(",")' .augment-plugin/marketplace.json)
          target="${HEAD_REF#release/}"
          echo "head_ref:                        $HEAD_REF"
          echo "package.json:                    $pkg"
          echo "claude marketplace.json:         $mp"
          echo "augment plugin.json:             $ap"
          echo "augment marketplace.json:        $am_top"
          echo "augment marketplace metadata:    $am_meta"
          echo "augment marketplace plugins[]:   $am_plugins"
          echo "release target:                  $target"
          fail=0
          if [ -n "$HEAD_REF" ] && [ "$HEAD_REF" != "$target" ] && [ "$pkg" != "$target" ]; then
            echo "::error::package.json version ($pkg) does not match release branch ($target)."
            fail=1
          fi
          if [ -n "$HEAD_REF" ] && [ "$HEAD_REF" != "$target" ] && [ "$mp" != "$target" ]; then
            echo "::error::.claude-plugin/marketplace.json metadata.version ($mp) does not match release branch ($target)."
            fail=1
          fi
          if [ "$pkg" != "$mp" ]; then
            echo "::error::package.json ($pkg) and marketplace.json ($mp) disagree."
            fail=1
          fi
          for pair in \
            ".augment-plugin/plugin.json:version:$ap" \
            ".augment-plugin/marketplace.json:version:$am_top" \
            ".augment-plugin/marketplace.json:metadata.version:$am_meta" \
            ".augment-plugin/marketplace.json:plugins[].version:$am_plugins" ; do
            got="${pair##*:}"
            field="${pair%:*}"
            if [ "$got" != "$pkg" ]; then
              echo "::error::${field} ($got) does not match package.json ($pkg)."
              fail=1
            fi
          done
          # Pack manifests carry no `version:` field — the package version is the
          # single version, so there is no per-pack pin to keep in lockstep. The
          # loop removed here globbed `packages/`, a directory that does not
          # exist, so it scanned zero files and passed vacuously.
          if [ "$fail" = "1" ]; then
            echo "Run \`task release\` from main; do not hand-edit version pins."
            exit 1
          fi
          echo "✅  Every version reference agrees on $pkg (claude + both augment manifests)"

      - name: Check project-template pin matches package.json.version
        run: |
          set -euo pipefail
          # The project-settings example template (src + dist twin) carries an
          # `agent_config_version` pin that must equal package.json.version, or a
          # fresh `init` bootstraps onto a stale pin. release.ts set_template_pin
          # keeps it in lockstep; this gate is the backstop on the release PR.
          ./scripts-run src/scripts/check_template_pin_drift

  finding-dispositions:
    # Release-truth Phase 3: the release is red while any blocking/high
    # self-review finding lacks a machine-readable disposition in the
    # committed ledger (agents/evidence/release-findings/<version>.json).
    # Deterministic — no model call, never fail-open: the gate comment's
    # machine block only TRIGGERS the demand; the committed file is the
    # record (council 2026-08-03: a PR comment is mutable, not a record).
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/') }}
    name: Blocking review findings dispositioned
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node deps
        run: |
          npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000 \
            || (sleep 10 && npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000)

      - name: Check disposition ledger against recorded + reported findings
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          version="${HEAD_REF#release/}"
          ./scripts-run src/scripts/check_finding_dispositions \
            --release "$version" --pr "${{ github.event.pull_request.number }}"

  audit-gate:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/') }}
    name: npm audit (runtime deps, high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'

      # Standing audit gate (road-to-credible-install Phase 0): same floor
      # status as ci-green on every release PR. Lockfile-driven — no npm ci
      # needed; dev-only advisories do not block the release line.
      - name: npm audit --omit=dev --audit-level=high
        run: npm audit --omit=dev --audit-level=high

  release-install-e2e:
    # The one job here that asserts nothing version-specific: it packs the
    # CURRENT tree, installs it, and upgrades from a fixed 9.7.0 baseline.
    # So unlike its three release-shape siblings it is meaningful on any PR,
    # and the `paths` filter above has already narrowed the PR set to diffs
    # that touch the installer / `files[]`. No head-branch guard — with one
    # the path trigger would start the workflow and this job would skip,
    # which is the cosmetic outcome Phase 4 exists to avoid.
    name: Release install E2E (pack → install → upgrade → boot)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      # 9.7.0 is a fixed historical baseline for the upgrade leg — cached
      # so the registry is hit once, not once per workflow run. A cache
      # miss re-fetches; a fetch failure here is a SETUP failure (network
      # / registry), never a release-quality signal.
      - name: Cache 9.7.0 baseline tarball
        id: baseline-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: baseline-9.7.0.tgz
          key: npm-baseline-9.7.0

      - name: Fetch 9.7.0 baseline tarball (cache miss)
        if: steps.baseline-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/baseline-pack
          if ! npm pack '@event4u/agent-config@9.7.0' --pack-destination /tmp/baseline-pack; then
            echo "::error::baseline fetch failed (setup phase, not validation) — could not pack @event4u/agent-config@9.7.0 from the registry."
            exit 1
          fi
          tarballs=(/tmp/baseline-pack/*.tgz)
          if [ ! -f "${tarballs[0]:-}" ] || [ "${#tarballs[@]}" -ne 1 ]; then
            echo "::error::baseline fetch produced ${#tarballs[@]} tarball(s) in /tmp/baseline-pack, expected exactly 1."
            exit 1
          fi
          mv "${tarballs[0]}" baseline-9.7.0.tgz

      - name: Install Node deps
        run: |
          npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000 \
            || (sleep 10 && npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000)

      - name: Run release install E2E gate
        env:
          BASELINE_TARBALL: ${{ github.workspace }}/baseline-9.7.0.tgz
        run: bash tests/test_release_install_e2e.sh
