name: deploy-mcp-worker

# Phase 4 of road-to-cloudflare-mcp-hosting.md.
#
# Triggers:
#   - release: published    — every GitHub release auto-deploys the
#                             corresponding tag to Cloudflare.
#   - workflow_dispatch     — manual run for hotfix-without-release
#                             or re-deploy of a tag.
#
# A0-cloud invariants enforced here (not in the Worker):
#   - Packer rejects empty content (exit 2) and > 5 MB uncondensed (exit 1).
#   - R2 release prefix is treated immutable: pipeline refuses overwrite.
#   - `latest.txt` is repointed only after post-deploy smoke passes.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to deploy (e.g. v1.37.0). Defaults to current ref."
        required: false
        default: ""

permissions:
  contents: write  # needed by "Comment on release" step to PATCH the release body

concurrency:
  group: deploy-mcp-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: agent-config-mcp
    steps:
      - name: Resolve target ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "ref=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.tag }}" ]; then
            echo "ref=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: internal/workers/mcp/package-lock.json

      - name: Install Worker deps
        run: npm ci
        working-directory: internal/workers/mcp

      - name: Pack content blob
        id: pack
        run: |
          ./scripts-run src/scripts/pack_mcp_content
          sig=$(python3 -c "import json; print(json.load(open('internal/workers/mcp/manifest.json'))['signature'])")
          release_key=$(python3 -c "import json; print(json.load(open('internal/workers/mcp/manifest.json'))['release_key'])")
          pkg=$(python3 -c "import json; print(json.load(open('internal/workers/mcp/manifest.json'))['package_version'])")
          echo "signature=$sig" >> "$GITHUB_OUTPUT"
          echo "release_key=$release_key" >> "$GITHUB_OUTPUT"
          echo "package_version=$pkg" >> "$GITHUB_OUTPUT"

      - name: Refuse overwrite of existing release prefix
        run: |
          key="releases/${{ steps.pack.outputs.release_key }}/manifest.json"
          if npx wrangler r2 object get "$R2_BUCKET/$key" --pipe > /dev/null 2>&1; then
            echo "::error::R2 prefix releases/${{ steps.pack.outputs.release_key }}/ already exists; refusing to overwrite."
            exit 1
          fi
        working-directory: internal/workers/mcp

      - name: Upload archival copy to R2
        run: |
          base="releases/${{ steps.pack.outputs.release_key }}"
          npx wrangler r2 object put "$R2_BUCKET/$base/content.json.gz" \
            --file content.json.gz --content-type application/gzip
          npx wrangler r2 object put "$R2_BUCKET/$base/manifest.json" \
            --file manifest.json --content-type application/json
        working-directory: internal/workers/mcp

      - name: Deploy Worker
        run: |
          npx wrangler deploy \
            --var PACKAGE_VERSION:"${{ steps.pack.outputs.package_version }}" \
            --var RELEASE_KEY:"${{ steps.pack.outputs.release_key }}"
        working-directory: internal/workers/mcp

      - name: Post-deploy smoke
        env:
          MCP_WORKER_URL: https://agent-config-mcp.${{ secrets.CLOUDFLARE_WORKER_SUBDOMAIN }}.workers.dev
          MCP_SMOKE_TOKEN: ${{ secrets.MCP_SMOKE_TOKEN }}
        run: npx tsx test/dev-smoke.ts
        working-directory: internal/workers/mcp

      - name: Repoint latest.txt (only after smoke passes)
        run: |
          echo -n "${{ steps.pack.outputs.release_key }}" | \
            npx wrangler r2 object put "$R2_BUCKET/releases/latest.txt" \
              --pipe --content-type text/plain
        working-directory: internal/workers/mcp

      - name: Comment on release
        if: github.event_name == 'release'
        uses: actions/github-script@v7
        with:
          script: |
            const key = "${{ steps.pack.outputs.release_key }}";
            const sig = "${{ steps.pack.outputs.signature }}";
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: context.payload.release.id,
              body: `${context.payload.release.body || ""}\n\n---\n**MCP Worker deployed:** \`${key}\` · signature \`${sig}\``,
            });
