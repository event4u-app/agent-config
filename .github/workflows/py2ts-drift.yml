name: py2ts Drift Check

# Phase 1 Step 8 of agents/roadmaps/road-to-typescript-only-scripts.md.
# Nightly drift reconciliation for the Python -> TypeScript migration:
# for every open PR targeting `python2ts`, detect whether any `.py`
# file touched by the PR has changed on `python2ts` since the PR's
# merge-base (drift typically arrives via the scheduled main sync).
# On drift, post (or update — deduped via the marker comment string
# "<!-- py2ts-drift-bot -->") a PR comment listing the drifted files
# and instructing a rebase onto latest python2ts before merge, so
# golden replay always runs against the current Python originals
# (roadmap "Drift rule").
#
# Read-only against the repo; the only write is the PR comment.

on:
  schedule:
    # Nightly, off-peak (03:53 UTC) — after the freeze-guard replay.
    - cron: "53 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: py2ts-drift
  cancel-in-progress: true

jobs:
  drift:
    name: Detect .py drift under open migration PRs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether python2ts exists
        id: branch
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin python2ts >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Branch 'python2ts' does not exist yet — nothing to reconcile."
          fi

      - name: Scan open PRs against python2ts for drifted .py files
        if: steps.branch.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MARKER: "<!-- py2ts-drift-bot -->"
        run: |
          set -euo pipefail
          git fetch origin python2ts

          prs=$(gh pr list --base python2ts --state open --json number,headRefName,baseRefName --jq '.[] | "\(.number) \(.headRefName)"')
          if [ -z "$prs" ]; then
            echo "No open PRs against python2ts."
            exit 0
          fi

          while read -r number head_ref; do
            [ -z "$number" ] && continue
            echo "::group::PR #${number} (${head_ref})"

            if ! git fetch origin "refs/pull/${number}/head"; then
              echo "Could not fetch PR head — skipping."
              echo "::endgroup::"
              continue
            fi
            head_sha=$(git rev-parse FETCH_HEAD)
            mergebase=$(git merge-base "$head_sha" origin/python2ts)
            echo "merge-base: ${mergebase}"

            # .py files changed on python2ts since the PR's merge-base.
            base_changed=$(git diff --name-only "$mergebase" origin/python2ts -- '*.py' | sort -u)
            if [ -z "$base_changed" ]; then
              echo "No .py changes on python2ts since merge-base — not drifted."
              echo "::endgroup::"
              continue
            fi

            # .py files touched by the PR itself.
            pr_changed=$(gh pr diff "$number" --name-only | grep -E '\.py$' | sort -u || true)

            drifted=$(comm -12 <(printf '%s\n' "$base_changed") <(printf '%s\n' "$pr_changed"))
            if [ -z "$drifted" ]; then
              echo "No overlap between PR-touched and base-changed .py files — not drifted."
              echo "::endgroup::"
              continue
            fi

            echo "Drifted .py files:"
            printf '%s\n' "$drifted"

            {
              echo "$MARKER"
              echo ""
              echo "**Python drift detected.** The following \`.py\` files touched by this PR have changed on \`python2ts\` since this PR's merge-base:"
              echo ""
              echo '```'
              printf '%s\n' "$drifted"
              echo '```'
              echo ""
              echo "Rebase this branch onto the latest \`python2ts\` before merge, so golden replay runs against the current Python originals (roadmap drift rule). This comment is refreshed nightly by the py2ts-drift workflow."
            } > /tmp/drift-comment.md

            existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${number}/comments" --paginate \
              --jq '[.[] | select(.body | contains("<!-- py2ts-drift-bot -->"))][0].id // empty')
            if [ -n "$existing" ]; then
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" \
                -F body=@/tmp/drift-comment.md >/dev/null
              echo "Updated existing drift comment (id ${existing})."
            else
              gh pr comment "$number" --body-file /tmp/drift-comment.md
              echo "Posted new drift comment."
            fi
            echo "::endgroup::"
          done <<< "$prs"
