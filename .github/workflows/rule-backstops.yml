name: Rule Backstops

# The gates a rule's `enforced_by:` points at, actually running in CI.
#
# Why this workflow exists: `check_enforcement_coverage` counted "named in a
# taskfile" as "can fail a build", and NO workflow invokes `task ci`,
# `ci-strict`, or `ci-fast` — only the narrow `ci-cloud-bundle` and
# `ci-linear-digest`. So nine validators a rule declared as its backstop ran
# only when a human typed the command, while the published number said
# otherwise. That is the exact defect the coverage gate was built to catch,
# committed by the coverage gate itself.
#
# Two things had to change together: the resolver now distinguishes `validator`
# (a workflow runs it) from `validator-local` (only a taskfile does), and this
# workflow moves the ones that belong in CI across the line. Fixing only the
# resolver would have been honest and left the gates unrun; fixing only the
# wiring would have left the number unable to tell the difference next time.
#
# `tests/scripts/rule_backstops_ci_wired.test.ts` fails if a rule declares a
# `validator:` this workflow does not run — so a backstop cannot quietly fall
# back out of CI.

on:
  pull_request:
    paths:
      - "src/rules/**"
      - "src/scripts/**"
      - "src/skills/**"
      - "src/agent-src/**"
      - "docs/**"
      - "agents/**"
      - "tests/**"
      # The kernel-prefix gate reads the PROJECTION, so a dist-only or
      # snapshot-only change must trigger this workflow too — otherwise the
      # gate is path-filtered into the same silence it just came out of.
      - "dist/agent-src/rules/**"
      - "dist/router.json"
      - "internal/bench/reports/kernel-prefix.json"
      - ".github/workflows/rule-backstops.yml"
  push:
    branches:
      - main
    paths:
      - "src/rules/**"
      - "src/scripts/**"
      - "src/skills/**"
      - "src/agent-src/**"
      - "docs/**"
      - "agents/**"
      - "tests/**"
      # The kernel-prefix gate reads the PROJECTION, so a dist-only or
      # snapshot-only change must trigger this workflow too — otherwise the
      # gate is path-filtered into the same silence it just came out of.
      - "dist/agent-src/rules/**"
      - "dist/router.json"
      - "internal/bench/reports/kernel-prefix.json"
      - ".github/workflows/rule-backstops.yml"

permissions:
  contents: read

jobs:
  rule-backstops:
    name: Rule backstops
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Full history: two of these gates diff against `origin/main`.
          # `check_safety_floor_untouched` exits 3 without it, and
          # `check_secret_leak` defaults to the changed-set — on a shallow
          # checkout it would find no base and scan nothing, passing green while
          # examining zero files. It offers a `--skip-if-no-baseline` flag; using
          # that here would be the fail-open this workflow exists to remove.
          fetch-depth: 0

      - name: Fetch the baseline branch
        run: git fetch --no-tags origin main:refs/remotes/origin/main || git fetch --no-tags origin main

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node deps
        run: |
          npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000 \
            || (sleep 10 && npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000)

      # --- validators a rule names as its enforced_by backstop, clean today ---
      # Each line below is the reason some rule's `enforced_by:` is not a claim
      # about a command nobody runs.

      - name: media-governance-routing (policy linkage)
        run: ./scripts-run src/scripts/lint_media_policy_linkage

      - name: output-discipline (placeholder prose)
        run: ./scripts-run src/scripts/lint_output_slop

      # An example is the part a reader copies. Every other gate reads the prose
      # an artifact teaches; none read the code it shows. Strict on day one
      # because the classification pass came back zero hits over all 503 files.
      - name: example fences (code examples vs the rules beside them)
        run: ./scripts-run src/scripts/lint_example_fences --strict

      # Rules and skills are capped; the contexts and guidelines they route to
      # were not, which is where the always-loaded budget leaks back in as
      # on-demand bloat. Shrink-only ratchet at 4.
      - name: depth budget (per-file ceiling on contexts + guidelines)
        run: ./scripts-run src/scripts/check_depth_budget

      - name: pre-migration references (retired Python install hints)
        run: ./scripts-run src/scripts/lint_pre_migration_refs

      - name: consumer-internal references (maintainer-only paths/tasks in shipped skills)
        run: ./scripts-run src/scripts/lint_consumer_internal_refs

      - name: budget ownership (owner + review date on every gate budget)
        run: ./scripts-run src/scripts/lint_budget_ownership

      - name: persona-governance
        run: ./scripts-run src/scripts/lint_persona_governance

      - name: trigger collisions (every shared trigger dispositioned)
        run: ./scripts-run src/scripts/lint_trigger_collisions --quiet

      # The kernel bodies are the KV-cache prefix of every request, so a byte
      # change there is a 10× cost event for every consumer. This gate existed
      # since the token-saving work and its own header claimed "CI fails if the
      # live prefix drifts" — but no workflow ran it, so between 2026-07-08 and
      # 2026-07-31 all nine kernel bodies drifted across ten merged commits and
      # nothing said a word. A gate that cannot fail is not a gate.
      # Re-anchor procedure: contexts/authority/kernel-rule-edits.md.
      - name: kernel-prefix byte-stability (KV-cache prefix)
        run: ./scripts-run src/scripts/check_kernel_prefix_stability

      - name: secret-vcs-guard
        run: ./scripts-run src/scripts/check_secret_leak

      - name: language-and-tone (.md English)
        # Argument shape mirrors the taskfile entry — the two catalog files are
        # generated and excluded there for the same reason. `docs/archive/
        # CHANGELOG-pre-*.md` joins them: era-split archives are generated,
        # declared read-only, and quote commit subjects VERBATIM. A subject
        # carrying an umlaut sits harmlessly in the repo-root CHANGELOG.md
        # (outside this gate's `docs` scope) until an era split moves it into
        # `docs/` — which turned this gate red on 9.10.0 for text nobody wrote
        # or could edit. Authored prose under docs/ stays in scope.
        # actionlint shellchecks only CHANGED workflow files, so this line's
        # pre-existing SC2046 first surfaced when the exclusion above touched it.
        # The word-splitting is the mechanism — it turns the find output into the
        # argument list — and every path here is repo-controlled and space-free.
        run: |
          # shellcheck disable=SC2046
          ./scripts-run src/scripts/check_md_language $(find docs -name '*.md' ! -name 'catalog.md' ! -name 'skills-catalog.md' ! -path 'docs/archive/CHANGELOG-pre-*.md' | sort)

      # --- validators that were ALREADY RED when first wired ------------------
      # Five gates a rule names as its backstop were failing, and had been,
      # invisibly — nothing ran them. Baselined at 37 findings, then cleared in a
      # follow-up pass; the baseline now stands at 0 and the ratchet holds that
      # line. Counts may fall freely, a rise fails. Deliberately NOT
      # continue-on-error, which is a WARN wearing a gate's clothes.
      #
      # Two thirds of the 37 were never violations: the gates were flagging
      # allowances their own rules already grant (license-required attribution,
      # multi-stack peer examples). Running a gate proves it runs — not that what
      # it reports is real.

      - name: Rule-backstop debt ratchet (baseline 0, was 37)
        run: ./scripts-run src/scripts/check_backstop_debt

      # --- gates added by the enforcement-proof and number-truth work --------
      # Shipped with a taskfile entry and nothing else; the coverage number they
      # produced counted them as blocking.

      - name: Enforcement-coverage ratchet
        run: ./scripts-run src/scripts/check_enforcement_coverage --check

      - name: Kernel-override audit
        run: ./scripts-run src/scripts/lint_override_kernel_guard --strict

      - name: ADR frontmatter + review_trigger
        run: ./scripts-run src/scripts/check_adr_frontmatter

      - name: Subagent safety-floor freshness
        run: ./scripts-run src/scripts/generate_subagent_floor --check

      # --- the sharpest instance of the class -------------------------------
      # A linter guarding the four safety-floor rules against modification,
      # reachable from no taskfile, no workflow, and no hook manifest — only its
      # own test. The thing standing watch over the floor was itself unwatched.

      - name: Safety-floor rules untouched
        run: ./scripts-run src/scripts/check_safety_floor_untouched

      # --- fail-open closed by road-to-enforcement-peer-disposition ----------
      # The append-only guard over agents/memory/intake/*.jsonl existed in
      # code and NOTHING invoked it with the flag — the check was fail-open
      # since it shipped. On pull_request GITHUB_BASE_REF supplies the base;
      # on push it falls back to origin/main (fetched above).

      - name: Memory intake append-only (was fail-open)
        run: ./scripts-run src/scripts/check_memory --append-only

      # Governed-writes lint — direct fs writes to protected ledger/governance
      # surfaces (claims ledger, append-only intake/audit jsonl) bypassing the
      # atomic-write layer. Allowlist-free; zero findings was the
      # pre-registered null when wired.

      - name: Governed writes (protected surfaces)
        run: ./scripts-run src/scripts/lint_governed_writes
