name: Rule Backstops

# The gates a rule's `enforced_by:` points at, actually running in CI.
#
# Why this workflow exists: `check_enforcement_coverage` counted "named in a
# taskfile" as "can fail a build", and NO workflow invokes `task ci`,
# `ci-strict`, or `ci-fast` — only the narrow `ci-cloud-bundle` and
# `ci-linear-digest`. So nine validators a rule declared as its backstop ran
# only when a human typed the command, while the published number said
# otherwise. That is the exact defect the coverage gate was built to catch,
# committed by the coverage gate itself.
#
# Two things had to change together: the resolver now distinguishes `validator`
# (a workflow runs it) from `validator-local` (only a taskfile does), and this
# workflow moves the ones that belong in CI across the line. Fixing only the
# resolver would have been honest and left the gates unrun; fixing only the
# wiring would have left the number unable to tell the difference next time.
#
# `tests/scripts/rule_backstops_ci_wired.test.ts` fails if a rule declares a
# `validator:` this workflow does not run — so a backstop cannot quietly fall
# back out of CI.

on:
  pull_request:
    paths:
      - "src/rules/**"
      - "src/scripts/**"
      - "src/skills/**"
      - "src/agent-src/**"
      - "docs/**"
      - "agents/**"
      - "tests/**"
      # The kernel-prefix gate reads the PROJECTION, so a dist-only or
      # snapshot-only change must trigger this workflow too — otherwise the
      # gate is path-filtered into the same silence it just came out of.
      - "dist/agent-src/rules/**"
      - "dist/router.json"
      - "internal/bench/reports/kernel-prefix.json"
      - ".github/workflows/rule-backstops.yml"
  push:
    branches:
      - main
    paths:
      - "src/rules/**"
      - "src/scripts/**"
      - "src/skills/**"
      - "src/agent-src/**"
      - "docs/**"
      - "agents/**"
      - "tests/**"
      # The kernel-prefix gate reads the PROJECTION, so a dist-only or
      # snapshot-only change must trigger this workflow too — otherwise the
      # gate is path-filtered into the same silence it just came out of.
      - "dist/agent-src/rules/**"
      - "dist/router.json"
      - "internal/bench/reports/kernel-prefix.json"
      - ".github/workflows/rule-backstops.yml"

# Superseded PR pushes cancel; `push: main` runs never do. On main this
# workflow is the ONLY run for that commit, so cancelling it would leave the
# commit with no backstop signal at all.
#
# The guarantee lives in the GROUP KEY, not in `cancel-in-progress`. GitHub
# drops a *pending* run as soon as another run joins its group, whatever
# `cancel-in-progress` says — that flag only governs runs already in
# progress. So non-PR runs are keyed by `github.run_id`, making each its own
# single-member group that nothing can ever join, and PR runs keep the shared
# per-ref key so a newer push does supersede an older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rule-backstops:
    name: Rule backstops
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # Full history: two of these gates diff against `origin/main`.
          # `check_safety_floor_untouched` exits 3 without it, and
          # `check_secret_leak` defaults to the changed-set — on a shallow
          # checkout it would find no base and scan nothing, passing green while
          # examining zero files. It offers a `--skip-if-no-baseline` flag; using
          # that here would be the fail-open this workflow exists to remove.
          fetch-depth: 0

      - name: Fetch the baseline branch
        run: git fetch --no-tags origin main:refs/remotes/origin/main || git fetch --no-tags origin main

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node deps
        run: |
          npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000 \
            || (sleep 10 && npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000)

      # --- validators a rule names as its enforced_by backstop, clean today ---
      # Each line below is the reason some rule's `enforced_by:` is not a claim
      # about a command nobody runs.

      - name: media-governance-routing (policy linkage)
        run: ./scripts-run src/scripts/lint_media_policy_linkage

      - name: output-discipline (placeholder prose)
        run: ./scripts-run src/scripts/lint_output_slop

      # The hidden attempt→critic→re-attempt loop is falsified (TERMINAL null);
      # correction is always visible. Shipped guidance directing a silent
      # re-run or the concealment of a detected miss is a defect, not a style.
      - name: never-silent (no directed silent re-run / concealment)
        run: ./scripts-run src/scripts/lint_never_silent

      # `already-complied-with` is the class that permits deleting a rule, so
      # it is the one that carries an evidence bar.
      - name: decision-impact (evidence bar on the removal-permitting class)
        run: ./scripts-run src/scripts/lint_decision_impact --quiet

      # A lossy transform with no record: 44 rules had their body migrated out,
      # and for 24 of them `git log --follow` cannot even find the commit.
      - name: rule-migration ledger (what the migration kept, folded, and lost)
        run: ./scripts-run src/scripts/lint_rule_migration_ledger --quiet

      # An example is the part a reader copies. Every other gate reads the prose
      # an artifact teaches; none read the code it shows. Strict on day one
      # because the classification pass came back zero hits over all 503 files.
      - name: example fences (code examples vs the rules beside them)
        run: ./scripts-run src/scripts/lint_example_fences --strict

      # A `paths:` filter naming a tree that no longer exists does not
      # over-trigger — it never triggers, silently, while the job keeps showing
      # its last real green. actionlint validates the schema (a string is a
      # valid string) and no reference checker resolves a glob against the
      # tree, so nothing saw the 20 dead entries this gate's census found.
      - name: workflow path filters (do they still match anything?)
        run: ./scripts-run src/scripts/lint_workflow_paths

      # Rules and skills are capped; the contexts and guidelines they route to
      # were not, which is where the always-loaded budget leaks back in as
      # on-demand bloat. Shrink-only ratchet at 4.
      - name: depth budget (per-file ceiling on contexts + guidelines)
        run: ./scripts-run src/scripts/check_depth_budget

      # The prose layers were capped; the TypeScript the package ships was not,
      # which is where the largest artefacts in the tree sit (install.ts at
      # 5,461 lines). Shrink-only ratchet on the TOTAL excess above 1,500 lines
      # — a file count would not move when an already-listed god-file grows.
      - name: source size budget (growth ratchet over src/**/*.ts)
        run: ./scripts-run src/scripts/check_source_size_budget

      # Ratchet on which rules the Claude host loads on a path match versus in
      # every session. Two axes: the scoped and mixed ID SETS pinned by identity
      # — a count alone is satisfiable by one rule in and one rule out — plus an
      # exact-BPE weight axis that may only walk down. Commit 33c7c20 moved
      # nineteen rules across that line in one emitter change with nothing
      # watching, and the only witnesses were a commit body and, months later, an
      # external analysis.
      - name: rule activation census (ratchet over the scoped/mixed split)
        run: ./scripts-run src/scripts/check_rule_activation_census

      # Sits next to the census on purpose: the census pins the CORPUS total with
      # a drift allowance, so per-rule re-growth under an aggregate cap is a green
      # run there. This gate is that gap, one level finer.
      - name: rule stub ceilings (per-rule, migrated rules only)
        run: ./scripts-run src/scripts/check_rule_stub_ceiling

      - name: pre-migration references (retired Python install hints)
        run: ./scripts-run src/scripts/lint_pre_migration_refs

      - name: consumer-internal references (maintainer-only paths/tasks in shipped skills)
        run: ./scripts-run src/scripts/lint_consumer_internal_refs

      - name: budget ownership (owner + review date on every gate budget)
        run: ./scripts-run src/scripts/lint_budget_ownership

      - name: persona-governance
        run: ./scripts-run src/scripts/lint_persona_governance

      - name: trigger collisions (every shared trigger dispositioned)
        run: ./scripts-run src/scripts/lint_trigger_collisions --quiet

      # The kernel bodies are the KV-cache prefix of every request, so a byte
      # change there is a 10× cost event for every consumer. This gate existed
      # since the token-saving work and its own header claimed "CI fails if the
      # live prefix drifts" — but no workflow ran it, so between 2026-07-08 and
      # 2026-07-31 all nine kernel bodies drifted across ten merged commits and
      # nothing said a word. A gate that cannot fail is not a gate.
      # Re-anchor procedure: contexts/authority/kernel-rule-edits.md.
      - name: kernel-prefix byte-stability (KV-cache prefix)
        run: ./scripts-run src/scripts/check_kernel_prefix_stability

      - name: secret-vcs-guard
        run: ./scripts-run src/scripts/check_secret_leak

      # ADR-239:185-188 leaves merge authority to the owner. A settings key named
      # autoMerge / auto_merge / mergePolicy would grant it by configuration
      # rather than by decision, so the key space is ratcheted shut. Reversible
      # by construction — the owner deletes the gate to grant it that way.
      # No canary recipe (both corpus files always exist, so a create-only plant
      # lands outside the corpus); the red is proven by the committed fixture
      # tests/fixtures/automerge-key/ instead. Reason recorded in
      # src/config/gate-coverage.yml under `no_canary_reason:`.
      - name: no auto-merge settings key (ADR-239 namespace ratchet)
        run: ./scripts-run src/scripts/check_no_automerge_key --quiet

      # Third-party pack conformance. PARTIAL by design and it says so: only 3 of
      # the 6 pack-fitness gates can be driven from a fixture tree, and the other
      # three are blocked by contracts (a pinned argv grammar, a name-resolved
      # pack lookup) rather than by effort. docs/contracts/pack-conformance.md is
      # generated from this harness so the page cannot claim a level it does not
      # run; the harness fails if the committed page has drifted.
      - name: pack-conformance fixture (partial, 3 of 6 gates)
        run: ./scripts-run src/scripts/check_pack_conformance_fixture --quiet

      - name: language-and-tone (.md English)
        # Argument shape mirrors the taskfile entry — the two catalog files are
        # generated and excluded there for the same reason. `docs/archive/
        # CHANGELOG-pre-*.md` joins them: era-split archives are generated,
        # declared read-only, and quote commit subjects VERBATIM. A subject
        # carrying an umlaut sits harmlessly in the repo-root CHANGELOG.md
        # (outside this gate's `docs` scope) until an era split moves it into
        # `docs/` — which turned this gate red on 9.10.0 for text nobody wrote
        # or could edit. Authored prose under docs/ stays in scope.
        # actionlint shellchecks only CHANGED workflow files, so this line's
        # pre-existing SC2046 first surfaced when the exclusion above touched it.
        # The word-splitting is the mechanism — it turns the find output into the
        # argument list — and every path here is repo-controlled and space-free.
        run: |
          # shellcheck disable=SC2046
          ./scripts-run src/scripts/check_md_language $(find docs -name '*.md' ! -name 'catalog.md' ! -name 'skills-catalog.md' ! -path 'docs/archive/CHANGELOG-pre-*.md' | sort)

      # --- validators that were ALREADY RED when first wired ------------------
      # Five gates a rule names as its backstop were failing, and had been,
      # invisibly — nothing ran them. Baselined at 37 findings, then cleared in a
      # follow-up pass; the baseline now stands at 0 and the ratchet holds that
      # line. Counts may fall freely, a rise fails. Deliberately NOT
      # continue-on-error, which is a WARN wearing a gate's clothes.
      #
      # Two thirds of the 37 were never violations: the gates were flagging
      # allowances their own rules already grant (license-required attribution,
      # multi-stack peer examples). Running a gate proves it runs — not that what
      # it reports is real.

      - name: Rule-backstop debt ratchet (baseline 0, was 37)
        run: ./scripts-run src/scripts/check_backstop_debt

      # --- gates added by the enforcement-proof and number-truth work --------
      # Shipped with a taskfile entry and nothing else; the coverage number they
      # produced counted them as blocking.

      - name: Enforcement-coverage ratchet
        run: ./scripts-run src/scripts/check_enforcement_coverage --check

      - name: Kernel-override audit
        run: ./scripts-run src/scripts/lint_override_kernel_guard --strict

      - name: ADR frontmatter + review_trigger
        run: ./scripts-run src/scripts/check_adr_frontmatter

      # Both of these were reachable only from `task ci`, which no workflow
      # invokes — so `adr-layout.md` claimed the coverage gate "fails under
      # task ci" while nothing ran it, and the index could go stale with no
      # signal. Wired here rather than corrected in prose: both exit 0 on the
      # current tree, so this costs nothing today and catches the next drift.
      - name: ADR coverage gate
        run: ./scripts-run src/scripts/audit_adr_coverage --check

      - name: ADR index freshness
        run: ./scripts-run src/scripts/adr/regenerate_index --dir docs/decisions --check

      # Same class again, and the roadmap that added the provenance/evidence axes
      # said so before this step existed: `adr_cite_check` had no CI gate at all
      # — no workflow invoked it, only a test imported it — so every
      # "enforced at cite time" claim about ADR citations was model-carried.
      # `--cited` resolves every ADR reference in src/rules, src/skills,
      # src/domains and docs against the decision corpus and reds when one points
      # nowhere. NOT registered in gate-coverage.yml: the manifest keys on the
      # gate-population name prefix (lint|check|audit|skill|verify_) and this
      # script carries `check` as a suffix, so registering it reddened
      # gate_population.test.ts. The row and the reasoning are in
      # gate-coverage.yml where it would have sat. Consequence: this step
      # runs with no minimum-scan floor.
      - name: ADR citations resolve
        run: ./scripts-run src/scripts/adr_cite_check --cited

      # Third instance of the same class, found in completion review: the ADR
      # evidence census was wired into NOTHING — no workflow step, no task
      # target, no gate-coverage.yml row, and no stated exemption — while
      # `adr_cite_check` above got all three in the same change. AC-2 and AC-3
      # of road-to-evidence-based-adr-governance rest on the 186 rows of
      # `agents/evidence/analysis/adr-evidence-census-2026-08.md`, so the
      # artifact could drift from the generator with no signal at all.
      #
      # This step gates the ARTIFACT's freshness, not the grades: the census is
      # proposal-only and never exits non-zero on a grade (a low grade is a
      # finding, not a violation). It regenerates to a temp path and diffs.
      #
      # NOT registered in src/config/gate-coverage.yml, for the reason recorded
      # one step above: `gate_population.matchesGatePattern` classifies on a NAME
      # PREFIX (`lint|check|audit|skill|verify_`) and `evidence_census.ts`
      # carries none of them, so a manifest row would red
      # `gate_population.test.ts` exactly as it did for `adr_cite_check`. The
      # comment that would have sat beside that row sits here and in the
      # `check-adr-evidence-census` task desc instead, because gate-coverage.yml
      # is owned by a sibling change. Consequence: no minimum-scan floor from
      # the manifest, though the census asserts its own scan scope internally.
      #
      # Inlined rather than `run: task check-adr-evidence-census`: no step in
      # this workflow installs the `task` binary — every other one calls
      # `./scripts-run` directly — so a task invocation here would fail on
      # "command not found" and read as a census defect.
      - name: ADR evidence census up to date
        run: |
          set -eu
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          ./scripts-run src/scripts/adr/evidence_census --out "$tmp" >/dev/null
          if ! diff -u agents/evidence/analysis/adr-evidence-census-2026-08.md "$tmp"; then
            echo "❌  adr-evidence-census: the committed artifact is stale. Run ./scripts-run src/scripts/adr/evidence_census and commit the result." >&2
            exit 1
          fi
          echo "✅  adr-evidence-census: committed artifact matches a fresh run"

      # AC-5's first clause, which had no mechanism until this step existed.
      # `check_adr_frontmatter.check_descriptive_axes` validates the SHAPE of an
      # axis that is PRESENT — its own docstring says a fresh record with no
      # `provenance`, no `evidence` and no `## Evidence` section passes every gate
      # in this tree — and the named blocker was structural: requiring the axes
      # needs a notion of NEW, and a single-file linter sees only a `date:` the
      # author typed. This is the two-ref diff that docstring called "buildable
      # and not built".
      #
      # Diff-scoped, so it exits 0 on any branch that adds no decision record:
      # the 147 pre-existing accepted records predate the axes and retrofitting
      # them is a migration event, not a gate (the scope decision
      # `lint_evidence_artifacts` already took, adopted rather than re-argued).
      #
      # Registered in `src/config/gate-coverage.yml`, unlike the two ADR tools
      # above — its `check_` prefix is in the gate population, so no
      # two-gates-disagree problem arises. Its floor is an inert `min_scanned: 0`
      # (a diff cannot carry an honest floor) and the discrimination proof is the
      # gate's own `--self-test` instead, which is the stronger instrument here:
      # this gate's usual reading is ZERO added records, the one state where a
      # working gate and a broken one print the same thing.
      - name: New accepted ADRs disclose their evidence
        run: ./scripts-run src/scripts/check_new_adr_evidence

      - name: Subagent safety-floor freshness
        run: ./scripts-run src/scripts/generate_subagent_floor --check

      # --- the sharpest instance of the class -------------------------------
      # A linter guarding the four safety-floor rules against modification,
      # reachable from no taskfile, no workflow, and no hook manifest — only its
      # own test. The thing standing watch over the floor was itself unwatched.

      - name: Safety-floor rules untouched
        run: ./scripts-run src/scripts/check_safety_floor_untouched

      # --- fail-open closed by road-to-enforcement-peer-disposition ----------
      # The append-only guard over agents/memory/intake/*.jsonl existed in
      # code and NOTHING invoked it with the flag — the check was fail-open
      # since it shipped. On pull_request GITHUB_BASE_REF supplies the base;
      # on push it falls back to origin/main (fetched above).

      - name: Memory intake append-only (was fail-open)
        run: ./scripts-run src/scripts/check_memory --append-only

      # Governed-writes lint — direct fs writes to protected ledger/governance
      # surfaces (claims ledger, append-only intake/audit jsonl) bypassing the
      # atomic-write layer. Allowlist-free; zero findings was the
      # pre-registered null when wired.

      - name: Governed writes (protected surfaces)
        run: ./scripts-run src/scripts/lint_governed_writes

      # --- a gate standing in for a paragraph that lost ----------------------
      # agents/roadmaps/stubs/README.md carried a hand-maintained index of its
      # own directory: the largest AUTHORED merge-conflict path in the tree,
      # every row duplicating its stub. Deleted 2026-08-21 (3793855b3, AI
      # council both seats) with a note written in the same change telling
      # future runs not to restore a row. A merge restored one anyway on
      # 2026-08-22 (28ba2f592, PR #1505) — both parents lacked the table, so it
      # was a deliberate restore against that note, not a mis-resolved
      # modify/delete. Prose cannot refuse; this can. Wired here rather than
      # left local-only on purpose: a gate `task ci` runs and no workflow does
      # is its own violation under ci-parity:local-only (165, shrink-only).

      - name: Stub inventory table stays deleted
        run: ./scripts-run src/scripts/check_no_stub_inventory_table
