name: Deploy site

# B4 — publish the Starlight docs site to GitHub Pages
# (https://event4u-app.github.io/agent-config). Operator-authorised 2026-07-05.
# The site is a no-drift projection of the canonical docs (site/sync-docs.mjs
# runs at prebuild), so every deploy reflects the source of truth. Astro 7 needs
# Node >=22.12.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/proof.md"
      - "docs/benchmark.md"
      - "docs/CLAIMS.md"
      - "docs/catalog.md"
      - "docs/media/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One live deploy at a time; never cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      # Enables Pages on first run (build_type: workflow) — the "Pages an" step.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
        with:
          enablement: true
      - name: Build the Starlight site
        run: |
          cd site
          npm ci --no-audit --no-fund --prefer-offline
          npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
