name: Deploy site

# B4 — publish the Starlight docs site to GitHub Pages
# (https://event4u-app.github.io/agent-config). Operator-authorised 2026-07-05.
# The site is a no-drift projection of the canonical docs (site/sync-docs.mjs
# runs at prebuild), so every deploy reflects the source of truth. Astro 7 needs
# Node >=22.12.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      # Everything site/sync-docs.mjs reads (manifest pages, docs/media/**). A
      # per-page list missed docs/guides/works-with-agent-switch.md; the glob
      # cannot trail the manifest (road-to-docs-that-sell 1.1).
      - "docs/**"
      # The site prebuild also runs site/build-demo-map.mjs, which draws the
      # demo map with the root code-graph CLI over its fixtures.
      - "site/docs-manifest.json"
      - "src/scripts/code_graph/**"
      - "src/cli/help.ts"
      - "src/cli/registry.ts"
      - "tests/fixtures/code-graph/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One live deploy at a time; never cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # The deploy publishes exactly this job's artifact, so the link check that
    # `site.yml` runs gates it here too — a docs-only change this workflow
    # deploys never reaches `site.yml`'s path filter.
    name: Build and link-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          # astro's engines floor; see site.yml for why this is a range.
          node-version: '>=22.23.4 <23'
          # Actions cache left off: this job is privileged (lint rule privileged-job-cache).
      # Enables Pages on first run (build_type: workflow) — the "Pages an" step.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
        with:
          enablement: true
      # Root deps provide node_modules/.bin/tsx for ./scripts-run and for
      # the site prebuild, which runs root scripts — so it precedes the build,
      # as in site.yml.
      - name: Install root dependencies (tsx for scripts-run)
        run: npm ci --no-audit --no-fund --prefer-offline
      - name: Build the Starlight site
        run: |
          cd site
          npm ci --no-audit --no-fund --prefer-offline
          npm run build
      - name: Internal-link check (no dangling links in the built site)
        run: ./scripts-run src/scripts/check_site_links
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
