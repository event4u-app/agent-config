name: py2ts Main Sync

# Phase 1 Step 3 of agents/roadmaps/road-to-typescript-only-scripts.md.
# Scheduled main -> python2ts sync so the migration integration branch
# continuously absorbs mainline changes instead of diverging toward a
# big-bang conflict.
#
# Behaviour:
#   - clean merge   -> push python2ts directly (this workflow is the
#                      single sanctioned direct-push writer per the
#                      branch-protection-policy addendum).
#   - merge conflict -> abort, then open (or refresh) the PR
#                      sync/main-into-python2ts -> python2ts for a human
#                      to resolve.
#   - always         -> write the sync lag (commits on main not yet on
#                      python2ts) into the job summary; the migration
#                      dashboard (Phase 1 Step 13) reads the same number.
#
# Fails fast with a clear message while the python2ts branch does not
# exist yet (Phase 1 Step 2 cuts it).

on:
  schedule:
    # Daily, off-peak (04:41 UTC) — clear of the other nightly crons.
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: py2ts-main-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Merge main into python2ts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository (full history, all branches)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail fast if python2ts does not exist
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --heads origin python2ts >/dev/null; then
            echo "::error::Branch 'python2ts' does not exist on origin. Cut it from main first (roadmap Phase 1 Step 2) before enabling this sync."
            exit 1
          fi

      - name: Configure git identity (github-actions bot)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge origin/main into python2ts
        id: merge
        run: |
          set -euo pipefail
          git fetch origin main python2ts
          git checkout python2ts
          LAG_BEFORE=$(git rev-list --count python2ts..origin/main)
          echo "Sync lag before merge: ${LAG_BEFORE} commit(s)."
          if [ "$LAG_BEFORE" -eq 0 ]; then
            echo "result=up-to-date" >> "$GITHUB_OUTPUT"
            echo "python2ts already contains origin/main — nothing to sync."
            exit 0
          fi
          if git merge --no-edit origin/main; then
            git push origin python2ts
            echo "result=merged" >> "$GITHUB_OUTPUT"
            echo "Clean merge — pushed python2ts."
          else
            git merge --abort || true
            echo "result=conflict" >> "$GITHUB_OUTPUT"
            echo "Merge conflict — aborted; a conflict PR will be opened or refreshed."
          fi

      - name: Open or update conflict PR
        if: steps.merge.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The sync branch mirrors origin/main; the PR against
          # python2ts surfaces the conflicts for manual resolution.
          git checkout -B sync/main-into-python2ts origin/main
          git push --force origin sync/main-into-python2ts
          OPEN_COUNT=$(gh pr list --base python2ts --head sync/main-into-python2ts --state open --json number --jq 'length')
          if [ "$OPEN_COUNT" -eq 0 ]; then
            gh pr create \
              --base python2ts \
              --head sync/main-into-python2ts \
              --title "sync: merge main into python2ts (conflicts)" \
              --body "Automated main -> python2ts sync hit merge conflicts. Resolve the conflicts on this branch (or merge locally) and merge into python2ts. Opened by the scheduled py2ts-main-sync workflow."
            echo "Opened conflict PR sync/main-into-python2ts -> python2ts."
          else
            echo "Open conflict PR already exists — branch force-updated to latest origin/main."
          fi

      - name: Write sync lag to job summary
        if: always()
        env:
          RESULT: ${{ steps.merge.outputs.result }}
        run: |
          LAG=$(git rev-list --count python2ts..origin/main 2>/dev/null || echo "n/a")
          {
            echo "## py2ts main-sync"
            echo ""
            echo "- Result: ${RESULT:-failed-before-merge}"
            echo "- Sync lag (commits on main not yet on python2ts): ${LAG}"
          } >> "$GITHUB_STEP_SUMMARY"
