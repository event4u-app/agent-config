name: Standing Payload Delta

# road-to-standing-payload-diet Phase 0 steps 0.3 / 0.5 — the delta REPORT.
# road-to-standing-payload-truth Phase 1 — plus one BLOCKING step, added 2026-08-24.
#
# ## The premise this header used to rest on was false
#
# It said: "`check_preamble_payload_budget` already ratchets this number and
# already fails on growth. A second blocking gate on one measurement double-fails
# every legitimate rule addition." The first sentence was **wrong** and the second
# depended on it. That gate runs in the local `task ci` chain and **no workflow in
# `.github/` invoked it** — so nothing failed a pull request on preamble growth,
# and this workflow declined to fail on the strength of a sibling that was not
# there. The measured cost of that gap: +12,619 tokens in nine days
# (125,593 on 2026-08-15 → 138,212 on 2026-08-24).
#
# So the delta report is unchanged and still never fails, and a SEPARATE step now
# runs the budget gate itself. AI council 2026-08-24, 2/2: option (b) of
# `b-preamble-ci-placement` — fold it in here rather than add a third surface,
# because this workflow already computes the neighbouring number.
#
# THE CEILING IS MEASURED, NOT STORED (ADR-275, roadmap step 4.4 of
# road-to-delivery-for-every-host). It is computed per run as
#
#     max(design_ceiling, payload at the base ref + active grants)
#
# and nothing else. HEAD is 28.4 % over the design number, so blocking at that
# alone would fail every PR from the moment it lands and nobody can shed 30,767
# tokens inside the arming PR. The base-measured term gives ZERO NET GROWTH
# instead: today's tree passes, growth beyond it reds, and every merged reduction
# lowers the ceiling automatically — which the stored number never did, because
# it stayed where it was put until a human lowered it, letting removed payload be
# added back into the space it freed. AI council 2/2 convergent, 2026-09-10,
# under a written owner delegation.
#
# BOTH STAGES HAVE LANDED. Stage 1 shipped the mechanism with the stored ceiling
# retained, because under the base-ref pinning below the gate runs as it exists
# at the BASE ref and could not validate its own introduction — at the base ref
# the measuring code was still the old one. Stage 2 (2026-09-11) removed the
# stored ceiling from a base that carries this code, verified by running the
# base-ref copy of the gate against the head tree first, and made this job a
# REQUIRED status check with the repo admin as a bypass actor. ADR-275, ADR-276.
#
# The stored allowance no longer expires and never did: `grace_end_date` was read
# once, into an echo, and the gate carried no date logic, so the design ceiling
# would not have become operative on 2026-11-10. It was deleted rather than moved
# (AI council 2/2, 2026-09-10; ADR-274) because moving it re-publishes the same
# fiction with a later number, and BUILDING the expiry was forbidden in the same
# verdict — it would arm a repo-wide stop on a date where the budget file still
# records `committed_reduction_mechanism` opening with NONE.
# Full record, including why one CI run is a sufficient sample for a deterministic
# census: `src/config/preamble-payload-budget.json` → `ci_delivery`.
#
# HONEST LIMIT: this makes the check FAIL, not REQUIRED. Whether a failing check
# blocks a merge is branch-protection configuration — a repo-admin action outside
# this change. Verify with `gh api repos/:owner/:repo/rulesets`, never by reading
# this file.
#
# Why the merge-base and not `origin/main`: measured while building this step,
# `origin/main` had moved four commits past the branch point, so a diff against
# the moving ref attributed other people's merges to this PR. The merge-base is
# the only ref that answers "what did THIS branch change".

# NO `paths:` ON THE pull_request TRIGGER, DELIBERATELY, AND IT MAY NOT COME BACK.
# This job IS a required check, as of 2026-09-11 — verified, not asserted:
# `gh api repos/:owner/:repo/rulesets` lists "Standing payload delta + budget
# gate" in required_status_checks on ruleset "main protection". Earlier in the
# same day this line claimed the same thing while the ruleset carried only one
# context, which is why the claim now names the command that refutes it.
# A required check whose trigger carries a path
# filter blocks every pull request that touches no filtered path — permanently,
# with no failing check to fix, because GitHub reads "skipped" as "has not
# reported" rather than as a pass. That is this repository's own documented trap
# (`docs/contracts/branch-protection-policy.md` § The path-filter trap on a
# required check), and it was reproduced before this edit: PR #1996 changed two
# markdown files and this workflow did not report on it at all.
# The filtering moved INSIDE the job, to the `scope` step below, which always
# reports a conclusion. That is the shape the contract prescribes.
on:
  pull_request:
  workflow_dispatch:

# Write scope justified: `pull-requests: write` is needed by the sticky-comment
# step and by nothing else here. Nothing in this workflow writes code, and there
# is no `pull_request_target` anywhere in this tree, so a fork PR receives the
# read-only fork token cap and this block reads wider than the exposure is.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standing-payload-delta:
    # The name is the REPORTED CHECK STRING and is about to be pinned into
    # branch protection, so it says what the job does. It read
    # "(report-only)" from before 2026-08-24, when the blocking budget step
    # was added to it — accurate for the delta script, which never fails, and
    # wrong for the job, which does. Renaming it AFTER pinning would silently
    # detach the required check from the job that satisfies it, so it happens
    # here, one PR before.
    name: Standing payload delta + budget gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The merge-base needs both sides of the history, so a shallow clone
          # will not do. `fetch-depth: 0` is the documented way to get it.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node deps
        run: |
          npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000 \
            || (sleep 10 && npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000)

      - name: Resolve merge-base
        id: base
        run: |
          set -euo pipefail
          # `github.base_ref` is empty on workflow_dispatch, where there is no
          # base to resolve. Emit an empty merge_base rather than failing the
          # step: the scope step below reads empty as "cannot narrow" and runs
          # the full measurement, which is the safe direction. Before this the
          # step died on `set -e` and took the whole job with it.
          base=""
          if [ -n "${{ github.base_ref }}" ]; then
            base="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
          fi
          echo "merge_base=$base" >> "$GITHUB_OUTPUT"
          echo "merge-base: ${base:-<none — not a pull request>}"

      # The path filter that used to sit on the trigger, moved here so the job
      # always reports. `relevant=false` skips the measurement and the job still
      # concludes success, which is what a required check needs.
      #
      # The list is the surface the gate MEASURES plus the files that decide how
      # it measures. Getting it wrong in the narrow direction is a real risk and
      # it is the catalogue-completeness gap named in
      # `road-to-delivery-for-every-host` 4.4: a path that carries payload and is
      # not listed here is a path this job skips. So the fallback is deliberately
      # backwards from the usual one — anything unrecognised sets `relevant=true`
      # and pays for a measurement, rather than being assumed harmless.
      - name: Scope
        id: scope
        run: |
          set -euo pipefail
          base="${{ steps.base.outputs.merge_base }}"
          if [ -z "$base" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "no merge-base (manual dispatch) — measuring, since nothing can be ruled out"
            exit 0
          fi
          changed="$(git diff --name-only "$base"...HEAD)"
          relevant=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              src/rules/*|dist/agent-src/rules/*|dist/agent-src/skills/*) relevant=true ;;
              src/skills/*/SKILL.md) relevant=true ;;
              AGENTS.md|CLAUDE.md) relevant=true ;;
              src/config/preamble-payload-budget.json) relevant=true ;;
              src/config/preamble-payload-exceptions.json) relevant=true ;;
              src/scripts/check_preamble_payload_budget.ts) relevant=true ;;
              src/scripts/check_standing_payload_delta.ts) relevant=true ;;
              src/scripts/_lib/standing_bound_ratchet.ts) relevant=true ;;
              src/scripts/_lib/ratchet_base_ref.ts) relevant=true ;;
              src/scripts/_lib/base_ref_payload.ts) relevant=true ;;
              src/scripts/_lib/measured_payload_ceiling.ts) relevant=true ;;
              src/scripts/_lib/payload_catalogue_completeness.ts) relevant=true ;;
              src/scripts/_lib/prefix_stable_surfaces.ts) relevant=true ;;
              # `src/scripts/preamble_byte_census.ts` belongs in this list by
              # meaning — it computes the buckets — and may NOT be added to it.
              # `check_ci_local_parity` derives the CI-side gate set by regexing
              # workflow text for `src/scripts/<name>`, and cannot tell a path
              # FILTER from an invocation, so listing the census here registers
              # it as a gate CI runs and nothing local reaches. Declaring it
              # `ci_only:` to silence that would assert it cannot run locally,
              # which is false. The residual: a pull request touching ONLY the
              # census skips this measurement. It is bounded — the gate that
              # imports it is listed above, and catalogue completeness is
              # separately enforced by `_lib/payload_catalogue_completeness.ts`
              # — and it is recorded here rather than closed by a declaration
              # that would be untrue.
              .github/workflows/standing-payload-delta.yml) relevant=true ;;
            esac
          done <<< "$changed"
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          if [ "$relevant" = "true" ]; then
            echo "standing payload surface touched — measuring"
          else
            echo "no standing-payload surface in this diff — measurement skipped, check still reports"
          fi

      - name: Measure standing-payload delta
        id: delta
        if: steps.scope.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          ./scripts-run src/scripts/check_standing_payload_delta \
            --base "${{ steps.base.outputs.merge_base }}" --rank > /tmp/spd-comment.md
          cat /tmp/spd-comment.md

      - name: Post / update PR comment
        if: github.event_name == 'pull_request' && steps.scope.outputs.relevant == 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88  # v3.0.5
        with:
          header: standing-payload-delta
          path: /tmp/spd-comment.md

      - name: Job summary
        if: always() && steps.scope.outputs.relevant == 'true'
        run: cat /tmp/spd-comment.md >> "$GITHUB_STEP_SUMMARY"

      # THE BLOCKING STEP (road-to-standing-payload-truth 1.1). Deliberately LAST
      # and `if: always()`, so the delta report and the PR comment land even when
      # this fails — a gate that suppresses the diagnostic explaining it is worse
      # than no gate.
      #
      # `--ceiling` is the GRACE ceiling from ci_delivery, not the design ceiling.
      # It is read out of the budget file rather than written here, so the number
      # has exactly one home and this workflow cannot drift from it.
      #
      # `--require-base` makes the shrink-only bound FAIL rather than skip when
      # it cannot be verified. An AI council (2/2, 2026-09-10) made that blocking
      # before the ceiling may be measured at the base ref instead of stored: an
      # unreadable base costs a comparison today and would grant an unbounded
      # budget then. It is passed HERE and not defaulted in the script, because
      # a shallow clone, a first commit and a detached build legitimately have no
      # base, and a gate that reds on a developer's machine gets switched off.
      # On the `pull_request` trigger the base is always available, so the strict
      # posture costs nothing there. On `workflow_dispatch` there is no
      # GITHUB_BASE_REF and `resolveBaseRef` falls back to origin/main, so a
      # manual run on a branch with no shared history with main now FAILS where
      # it used to skip. That is the intended direction — a dispatch is the one
      # run an operator can re-trigger — and it is named here rather than left
      # to be discovered as a surprising red.
      # Prerequisite 3 of the measured-ceiling verdict (AI council 2/2,
      # 2026-09-10): the gate that measures a pull request is the gate AS IT
      # EXISTS AT THE BASE REF, so the change under review cannot edit the code
      # that judges it. Both seats chose this over code-owner review on the
      # gate, which would put the sole maintainer in the path of every
      # gate-editing pull request and fails the owner's autonomy constraint.
      #
      # Its honest limit, in anthropic's words: "the mechanism does not prevent
      # the exploit; it makes the exploit auditable." A weakening merged first
      # and exploited second is visible in `git log` and is NOT blocked. It is a
      # forensic control, not a preventive one. Its price is also real: a
      # legitimate gate FIX does not protect the pull request that ships it, and
      # the gate must stay executable at recent `main` refs.
      #
      # The base copy lands INSIDE the workspace on purpose — Node resolves
      # `yaml` and the other runtime deps by walking up from the importing file,
      # and a copy under /tmp would find no node_modules.
      - name: Materialise the gate at the base ref
        id: pinned
        if: always() && steps.scope.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          base="${{ steps.base.outputs.merge_base }}"
          out=".payload-gate-at-base"
          rm -rf "$out"
          if [ -z "$base" ]; then
            echo "usable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no merge-base (manual dispatch) — measuring with the gate at HEAD"
            exit 0
          fi
          mkdir -p "$out"
          # `git archive` is NOT used here, and that is deliberate: it honours
          # `export-ignore`, and `.gitattributes` marks paths this gate needs.
          # `git checkout-index` reads the object graph and knows nothing about it.
          GIT_INDEX_FILE="$RUNNER_TEMP/payload-base-index" git read-tree "$base"
          GIT_INDEX_FILE="$RUNNER_TEMP/payload-base-index" \
            git checkout-index -a --prefix="$out/"
          rm -f "$RUNNER_TEMP/payload-base-index"
          # BOOTSTRAP: the base ref predates `--repo-root` until this change has
          # merged once. Fall back rather than fail, and say so loudly — a
          # silent fallback would make an unpinned run indistinguishable from a
          # pinned one, which is the whole property being bought here.
          if grep -q -- '--repo-root' "$out/src/scripts/check_preamble_payload_budget.ts" 2>/dev/null; then
            echo "usable=true" >> "$GITHUB_OUTPUT"
            echo "measuring with the gate as it exists at $base"
          else
            echo "usable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::the gate at $base predates --repo-root, so this run is NOT base-pinned. Expected exactly once, on the pull request that introduces the flag."
          fi

      # Grants are honoured only when their approval event is verified OUTSIDE
      # the diff that requests them — the council's hardest pushback in both
      # seats: `approved_by` written by the pull request asking for the grant is
      # self-asserted data authenticating nothing. The ledger ships EMPTY and is
      # expected to stay empty (96.8 % of merged pull requests move this payload
      # by zero or less), so this step is normally a no-op that prints nothing.
      - name: Verify exception approvals
        id: approvals
        if: always() && steps.scope.outputs.relevant == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          ids="$(python3 - <<'PY'
          import json, os, datetime
          p = 'src/config/preamble-payload-exceptions.json'
          today = datetime.date.today().isoformat()
          try:
              rows = json.load(open(p)).get('exceptions', [])
          except FileNotFoundError:
              rows = []
          live = [r['id'] for r in rows
                  if r.get('repaid_at') is None and str(r.get('expires_at', '')) >= today]
          print(' '.join(live))
          PY
          )"
          if [ -z "$ids" ]; then
            echo "approved=" >> "$GITHUB_OUTPUT"
            echo "no live payload exceptions — nothing to verify"
            exit 0
          fi
          # An approving review from someone other than the author is the
          # trusted platform signal available here. With a single repository
          # admin no such review can exist, which means a grant cannot be
          # authenticated and is therefore refused — recorded honestly rather
          # than worked around, and the reason a second reviewer is the owner
          # decision that would make the exception path usable at all.
          approver_count=0
          if [ -n "${PR:-}" ]; then
            approver_count="$(gh api "repos/${{ github.repository }}/pulls/$PR/reviews" \
              --jq "[.[] | select(.state == \"APPROVED\") | select(.user.login != \"$AUTHOR\")] | length")"
          fi
          if [ "$approver_count" -gt 0 ]; then
            flags=""
            for id in $ids; do flags="$flags --approved $id"; done
            echo "approved=$flags" >> "$GITHUB_OUTPUT"
            echo "verified $approver_count independent approval(s) for: $ids"
          else
            echo "approved=" >> "$GITHUB_OUTPUT"
            echo "::warning::live payload exception(s) [$ids] carry no independent approving review, so they are refused."
          fi

      # THE BLOCKING STEP (road-to-standing-payload-truth 1.1). Deliberately LAST
      # and `if: always()`, so the delta report and the PR comment land even when
      # this fails — a gate that suppresses the diagnostic explaining it is worse
      # than no gate.
      #
      # `--ceiling` is GONE. The ceiling is measured per run as
      # max(design_ceiling, payload at the base ref + active grants) plus, while
      # and nothing else. There is no stored number left anywhere to pass.
      #
      # `--require-base` makes the base reading FAIL rather than skip when it
      # cannot be established. An AI council (2/2, 2026-09-10) made that blocking
      # for the move to a measured ceiling: an unreadable base cost a comparison
      # under the stored one and would grant an unbounded budget under this one.
      # It is passed HERE and not defaulted in the script, because a shallow
      # clone, a first commit and a detached build legitimately have no base, and
      # a gate that reds on a developer's machine gets switched off. On the
      # `pull_request` trigger the base is always available, so the strict
      # posture costs nothing there. On `workflow_dispatch` there is no
      # GITHUB_BASE_REF and `resolveBaseRef` falls back to origin/main, so a
      # manual run on a branch with no shared history with main FAILS where it
      # used to skip — the intended direction, named here rather than left to be
      # discovered as a surprising red.
      - name: Preamble payload budget (blocking, measured ceiling)
        if: always() && steps.scope.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          gate="src/scripts/check_preamble_payload_budget"
          if [ "${{ steps.pinned.outputs.usable }}" = "true" ]; then
            npx --no-install tsx ".payload-gate-at-base/$gate.ts" \
              --repo-root "$PWD" --require-base ${{ steps.approvals.outputs.approved }}
          else
            ./scripts-run "$gate" --require-base ${{ steps.approvals.outputs.approved }}
          fi

      - name: Drop the base-ref gate copy
        if: always()
        run: rm -rf .payload-gate-at-base

      # ----------------------------------------------------------------------
      # The local-only drain — batch 1. Phase 2.1 of
      # road-to-local-gates-wired-while-they-are-green.
      #
      # `check_ci_local_parity` reported 163 gates that `task ci` runs and no
      # workflow does. The direction matters: a gate with no remote reach lets a
      # real defect merge, which is how 16 stale index rows reached the trunk
      # behind a local-only check-index.
      #
      # HERE, AND THE PLACEMENT IS THE POINT. The roadmap's non-goals say "No
      # new required check. The steps join the job that is already required",
      # and this repository has exactly two required contexts — this one and
      # `Sync + Generate Tools Consistency` (read from the `main protection`
      # ruleset, not assumed). The consistency workflow hosts the ratification
      # gate, so any step added to it makes the whole diff ratification-gated.
      # This job is the other one, it is not gated, and — unlike every
      # alternative considered — it carries NO `paths:` filter, so these gates
      # run on every pull request rather than on a path-matched subset.
      #
      # An earlier revision of this change put them in a new job on
      # `rule-backstops.yml`. That job is not a required context, so a red there
      # is visible and does not block a merge, which is a weaker thing than the
      # roadmap asked for; and it inherits that file's `paths:` filter, which
      # three of these gates' inputs did not match. An independent completion
      # review found both. Steps in this job fix them together.
      #
      # TWENTY, and not the 119 the reading classes wirable. An independent
      # two-seat council (2026-10-13, anthropic + openai, 2/2) read the
      # 2026-08-13 standing decision in `docs/contracts/ci-green-floor.md` —
      # which leaves "ten or twenty gates a change" open and declines the sweep
      # — and converged that one pull request carrying all 119 is the sweep.
      # The sample is spread across gate families and the full runtime band
      # rather than taken fastest-first.
      #
      # EVERY GATE IN A STEP GETS A READING, which is why each block collects
      # into `rc` instead of relying on `bash -e`. Under `-e` the first red ends
      # the step and the gates after it never run, so a batch whose purpose is
      # to learn WHICH gates survive remote conditions would report one name and
      # hide three. The step still fails — `exit "$rc"` — it fails after
      # measuring.
      #
      # `audit_command_surface` is deliberately absent although the reading
      # classes it wirable: it writes two tracked files unconditionally,
      # whatever flags it is given, so it is a generator rather than a checker.
      - name: Drain 1a — pack dependencies, originality freshness, context paths, suppression hygiene
        if: always()
        run: |
          rc=0
          ./scripts-run src/scripts/lint_pack_dependencies || rc=1
          ./scripts-run src/scripts/check_originality_freshness --quiet || rc=1
          ./scripts-run src/scripts/check_context_paths || rc=1
          ./scripts-run src/scripts/check_suppression_hygiene --quiet || rc=1
          exit "$rc"

      - name: Drain 1b — dispatcher, hook-injection bench, skill overlap, memory replay
        if: always()
        run: |
          rc=0
          ./scripts-run src/scripts/runtime_dispatcher run --skill check-refs || rc=1
          ./scripts-run src/scripts/bench_hook_injection || rc=1
          ./scripts-run src/scripts/audit_skill_overlap --quiet --print-table --strict || rc=1
          ./scripts-run src/scripts/memory_replay --check || rc=1
          exit "$rc"

      - name: Drain 1c — framework leakage, gate paths, quickstart smoke, router, pack YAML, augment budget
        if: always()
        run: |
          rc=0
          ./scripts-run src/scripts/lint_framework_leakage --quiet || rc=1
          ./scripts-run src/scripts/check_gate_paths || rc=1
          ./scripts-run src/scripts/smoke_quickstart || rc=1
          ./scripts-run src/scripts/compile_router --check || rc=1
          ./scripts-run src/scripts/validate_pack_yaml || rc=1
          ./scripts-run src/scripts/measure_augment_budget --check || rc=1
          exit "$rc"

      # Phase 3.1 — three generated documents whose `--check` gate was red at
      # the base because the document was stale. The documents are regenerated
      # in this same change, which is what makes wiring them legitimate: no gate
      # is wired while red. The `--check` variant, never the writer: the reading
      # that produced this batch ran the writers once by accident and silently
      # modified five tracked files.
      - name: Drain 3.1 — generated documents are not stale
        if: always()
        run: |
          rc=0
          ./scripts-run src/scripts/generate_ownership_matrix --check || rc=1
          ./scripts-run src/scripts/generate_cookbook --check || rc=1
          ./scripts-run src/scripts/generate_role_experiences_catalog --check || rc=1
          exit "$rc"

      # Phase 3.2 — three reds with no live owner, each fixed in this change.
      # `check_trigger_eval_presence` is the correction to the roadmap's
      # decision D5: D5 dropped its step on a reading that the gate exits 0, and
      # at this branch base it exits 1, because two skills gained a trigger
      # corpus without their grandfather entries being removed with it.
      - name: Drain 3.2 — knowledge cards, subagent determinism, trigger-eval presence
        if: always()
        run: |
          rc=0
          ./scripts-run src/scripts/check_knowledge_cards || rc=1
          ./scripts-run src/scripts/lint_subagent_determinism || rc=1
          ./scripts-run src/scripts/check_trigger_eval_presence || rc=1
          exit "$rc"

      # ----------------------------------------------------------------------
      # The local-only drain — batch 2, and the rest of Phase 3.2 of
      # road-to-local-gates-wired-while-they-are-green.
      #
      # Same job and the same reasons as batch 1 above: it is a required
      # context, it carries no `paths:` filter, and each step collects into
      # `rc` so every gate in it gets a reading before the step fails.
      #
      # Phase 3.2 — reds with no live owner, each wired in the change that
      # fixed its findings. Both README lints read only `README.md`, the public
      # claim surface, and neither reads a baseline, so the fix is the prose.
      - name: Drain 3.2b — README jargon density, README serial comma
        if: always()
        run: |
          rc=0
          ./scripts-run src/scripts/lint_readme_jargon --quiet || rc=1
          ./scripts-run src/scripts/lint_readme_serial_comma --quiet || rc=1
          exit "$rc"

      # Phase 3.2 — the Augment description cap. Five auto-rule descriptions
      # were over 150 characters; each was shortened at its source in this
      # change, and the regenerated catalog and pack passports ride with it.
      - name: Drain 3.2c — auto-rule description cap
        if: always()
        run: |
          ./scripts-run src/scripts/check_augment_description_cap

      # Phase 3.2 — the token-quality golden set. Two of its six structural
      # errors were corpus entries (a tag on the merged `brand-consistency`
