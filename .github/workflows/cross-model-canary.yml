name: Cross-model canary

# Roadmap road-to-operator-runtime-harvest, T-005. Cost-bounded gate/periodic split:
#   - gate (every PR touching the eval surface): DRY-RUN only — MockRouter, no
#     spend, no secrets. Catches router/harness CODE regressions for free.
#   - periodic (weekly) + manual dispatch: the LIVE cross-vendor matrix, but only
#     when the API-key secrets are configured. Catches vendor model-update DRIFT
#     that a periodic-only-or-never check would miss silently.
#
# To enable the live tier, add repo secrets ANTHROPIC_API_KEY / OPENAI_API_KEY /
# GEMINI_API_KEY.
#
# Without ANTHROPIC_API_KEY the live job does not RUN at all: `secret-presence`
# reports the secret absent and `periodic-live` is skipped on that output. A
# skipped job is not a failed job, so an unconfigured fork or a fresh clone sees
# a clean weekly run rather than a standing red. With the key the job runs for
# real and is allowed to fail — a live floor breach is the maintainer
# notification this canary exists to produce, and swallowing it would make the
# whole tier decorative.
#
# The gate lives in a preflight JOB rather than in `periodic-live`'s own `if:`
# because the `secrets` context is not available in a job-level condition; only
# a job's outputs are. The steps below therefore no longer re-check the key that
# gates them — the smoke step keeps its own check, because it needs all three
# secrets and the job gate only proves one.

on:
  pull_request:
    paths:
      - "src/scripts/_lib/trigger_routers.ts"
      - "src/scripts/cross_model_smoke.ts"
      - "src/scripts/skill_trigger_eval.ts"
      - ".github/workflows/cross-model-canary.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

# Superseded PR pushes cancel; the weekly canary and manual dispatches do not —
# a cancelled canary run is a lost data point, not a re-runnable check. That is
# the group KEY doing the work: non-PR runs are keyed by `github.run_id`, so
# each is a group of one. `cancel-in-progress: false` alone would not save a
# run still pending in a shared group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Presence-only probe. It prints `true`/`false`, never a secret, and writes no
  # key material to disk — the job that needs the key materializes it itself.
  secret-presence:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      anthropic: ${{ steps.probe.outputs.anthropic }}
    steps:
      - id: probe
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo 'anthropic=true' >> "$GITHUB_OUTPUT"
            echo '::notice::ANTHROPIC_API_KEY present — the live canary will run.'
          else
            echo 'anthropic=false' >> "$GITHUB_OUTPUT"
            echo '::notice::ANTHROPIC_API_KEY absent — the live canary is skipped, not failed. Set the repo secret to enable it.'
          fi

  gate-dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund --prefer-offline
      - name: Cross-model smoke (dry-run — MockRouter, no spend)
        run: ./node_modules/.bin/tsx src/scripts/cross_model_smoke.ts --dry-run --skills image-analyser

  periodic-live:
    needs: secret-presence
    if: needs.secret-presence.outputs.anthropic == 'true'
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund --prefer-offline
      - name: Cross-model live smoke (skips if key secrets absent)
        run: |
          if [ -z "$GEMINI_API_KEY" ] || [ -z "$OPENAI_API_KEY" ] || [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::Cross-model live canary skipped — set ANTHROPIC_API_KEY / OPENAI_API_KEY / GEMINI_API_KEY repo secrets to enable."
            exit 0
          fi
          mkdir -p "$HOME/.event4u/agent-config"
          ( umask 077
            printf '%s' "$ANTHROPIC_API_KEY" > "$HOME/.event4u/agent-config/anthropic.key"
            printf '%s' "$OPENAI_API_KEY" > "$HOME/.event4u/agent-config/openai.key"
            printf '%s' "$GEMINI_API_KEY" > "$HOME/.event4u/agent-config/gemini.key" )
          ./node_modules/.bin/tsx src/scripts/cross_model_smoke.ts --skills image-analyser
      # ADR-118 §4 — the one loop closure: rotating live trigger-eval pass rate
      # (~5 suites/week, deterministic by UTC week index). A floor breach fails
      # THIS scheduled job only — PRs are never blocked by live results. The
      # local interactive skill_trigger_eval gate is untouched; authorization
      # derives exclusively from the repo-secret key file written here.
      - name: Trigger-eval pass-rate rotation
        run: |
          mkdir -p "$HOME/.event4u/agent-config"
          ( umask 077
            printf '%s' "$ANTHROPIC_API_KEY" > "$HOME/.event4u/agent-config/anthropic.key" )
          ./node_modules/.bin/tsx src/scripts/trigger_eval_rotation.ts --out-dir rotation-results
      # road-to-tested-routing Phase 4 — advisory rules-mode leg: "which rules
      # would you consult for this prompt" over the routing-matrix-derived
      # suite (~40 cases, deterministic sampling). Same contract as the skills
      # rotation above: a floor breach fails THIS scheduled job only — PRs are
      # never blocked by live results; the PR gate stays skills-dry-run-only.
      - name: Rule trigger-eval, advisory
        run: |
          mkdir -p "$HOME/.event4u/agent-config"
          ( umask 077
            printf '%s' "$ANTHROPIC_API_KEY" > "$HOME/.event4u/agent-config/anthropic.key" )
          ./node_modules/.bin/tsx src/scripts/rule_trigger_eval.ts --out rotation-results/rules-mode.json
      - name: Upload rotation result JSONs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: trigger-eval-rotation
          path: rotation-results/
          if-no-files-found: ignore
