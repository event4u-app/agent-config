name: Release Drift Check

# READ-ONLY backstop for the "release merged but never tagged/published"
# failure mode. On main + daily schedule + manual dispatch, it asserts:
#   1. main's package.json version has a matching git tag, AND
#   2. npm dist-tags.latest equals that version.
# Fails (red) when npm lags main — the signal that a release crashed
# after merge but before the tag-push that triggers publish-npm.yml.
# NEVER mutates anything. Recovery: `./scripts-run src/scripts/release --resume`
# (now package.json-anchored, ADR-safe) locally, or `workflow_dispatch` on
# `.github/workflows/release.yml` (its --ci path is equally resume-safe).
#
# NOTE: deliberately no path-filtered `push:` trigger (avoids the
# phantom 0-job "failure" runs that path-filtered pushes create).
#
# CORRECTED 2026-07-25 — this note previously read "The `task ci` gate already
# enforces the tag invariant on every main build", and used that as the reason
# the missing trigger was safe. **No workflow invokes `task ci`, `ci-strict`, or
# `ci-fast`** (only the narrow `ci-cloud-bundle` and `ci-linear-digest`) —
# `skill-lint.yml` states this correctly twice in its own comments, so two
# workflow files contradicted each other and one of them justified a design
# decision with the wrong half.
#
# What actually holds the tag invariant today: this workflow's daily schedule
# plus manual dispatch. That is a 24h detection window, not a merge-time gate.
# Stated plainly rather than implied away by citing a gate that does not run.

on:
  schedule:
    # Daily sweep — catches a stuck release within 24h.
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-drift
  cancel-in-progress: true

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main (full history + tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node (npm registry read)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      # `./scripts-run` execs node_modules/.bin/tsx. Without this step the job
      # died at exit 127 ("No such file or directory") on EVERY scheduled run —
      # so the only backstop for "release merged but never tagged/published"
      # reported red for its own missing dependency, and a real drift would have
      # been indistinguishable from the daily noise.
      - name: Install Node deps
        run: |
          npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000 \
            || (sleep 10 && npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000)

      - name: Detect release-published drift (read-only)
        run: ./scripts-run src/scripts/check_release_published --strict --check-npm --require-main
