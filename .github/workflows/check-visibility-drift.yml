name: Visibility Drift Check

# READ-ONLY drift detector. Runs on PRs that touch the visibility
# manifests / sync tooling, on a weekly schedule (catches UI-side
# edits), and on manual dispatch. Fetches remote topics + description,
# diffs against `.github/topics.yml` + `.github/about.yml`, fails when
# drift exists. NEVER mutates the remote.
#
# PR carve-out: a PR whose NET diff changes the manifests themselves
# (`topics.yml` / `about.yml`) is an INTENTIONAL visibility change —
# remote drift is expected there until a maintainer dispatches
# `sync-visibility.yml` (dry_run=false) after merge, so the detector
# runs in advisory mode (prints the pending diff, exits 0) instead of
# failing the PR. Strict mode still guards every other trigger: the
# weekly sweep, manual dispatch, and PRs that only touch the sync
# tooling (those must NOT observe drift — it would mean someone edited
# the GitHub UI directly).
#
# Mutating sync lives in `sync-visibility.yml` (workflow_dispatch only,
# `administration: write`). Split-by-design per the AI-Council security
# review of the strategic-visibility roadmap.
#
# NOTE: no `push:` trigger. Path-filtered push workflows create phantom
# "failure" runs with 0 jobs in the runs list when paths don't match
# (GitHub Actions quirk \u2014 the workflow registers a check-suite entry
# but no job executes, conclusion=failure with empty logs). PR-gating +
# weekly sweep + manual dispatch covers every drift-detection case
# without polluting the main branch status badge.

on:
  pull_request:
    paths:
      - ".github/topics.yml"
      - ".github/about.yml"
      - "src/scripts/sync_github_metadata.ts"
      - "src/scripts/lint_topics_yaml.ts"
      - ".github/workflows/check-visibility-drift.yml"
  schedule:
    # Weekly drift sweep \u2014 catches UI-side edits even when nobody
    # touches the manifest files.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # classify step reads the PR's changed-file list

concurrency:
  group: visibility-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node deps
        run: |
          npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000 \
            || (sleep 10 && npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000)

      - name: Lint topics.yml
        run: ./scripts-run src/scripts/lint_topics_yaml

      - name: Classify PR — intentional manifest change?
        # NET-diff file list via the API (same rationale as the ADR-051
        # guard in consistency.yml: no base-fetch race, and a file added
        # then reverted within the PR does not count).
        if: github.event_name == 'pull_request'
        id: classify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          changed=$(gh pr diff "${{ github.event.pull_request.number }}" --name-only --repo "${{ github.repository }}")
          if grep -qxE '\.github/(topics|about)\.yml' <<<"$changed"; then
            echo "manifests_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "manifests_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect drift (read-only, strict)
        if: github.event_name != 'pull_request' || steps.classify.outputs.manifests_changed != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts-run src/scripts/sync_github_metadata --strict

      - name: Detect drift (read-only, advisory — PR changes the manifests)
        if: github.event_name == 'pull_request' && steps.classify.outputs.manifests_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts-run src/scripts/sync_github_metadata
          echo "::notice::This PR intentionally changes the visibility manifests — the diff above is the PENDING change. After merge, a maintainer applies it via sync-visibility.yml (workflow_dispatch, dry_run=false)."
