name: Visibility Drift Check

# READ-ONLY drift detector. Runs on every push / PR that touches the
# visibility manifests or the sync tooling. Fetches remote topics +
# description, diffs against `.github/topics.yml` + `.github/about.yml`,
# fails when drift exists. NEVER mutates the remote.
#
# Mutating sync lives in `sync-visibility.yml` (workflow_dispatch only,
# `administration: write`). Split-by-design per the AI-Council security
# review of the strategic-visibility roadmap.

on:
  pull_request:
    paths:
      - ".github/topics.yml"
      - ".github/about.yml"
      - "scripts/sync_github_metadata.py"
      - "scripts/lint_topics_yaml.py"
      - ".github/workflows/check-visibility-drift.yml"
  push:
    branches:
      - main
    paths:
      - ".github/topics.yml"
      - ".github/about.yml"
      - "scripts/sync_github_metadata.py"
      - ".github/workflows/check-visibility-drift.yml"
  schedule:
    # Weekly drift sweep \u2014 catches UI-side edits even when nobody
    # touches the manifest files.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  metadata: read

concurrency:
  group: visibility-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime deps
        run: pip install pyyaml

      - name: Lint topics.yml
        run: python3 scripts/lint_topics_yaml.py

      - name: Detect drift (read-only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_github_metadata.py --strict
