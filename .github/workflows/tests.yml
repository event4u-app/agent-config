name: Tests

on:
  pull_request:
    branches: [main, master]
    paths:
      - "src/scripts/**"
      - "tests/**"
      - "src/**"
      - "packages/core/installer/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "eslint.config.js"
      - "Taskfile.yml"
      - "taskfiles/**"
      - "install.sh"
      - "setup.sh"
      - ".agent-src.uncondensed/skills/lint-skills/**"
      - ".agent-src.uncondensed/skills/check-refs/**"
      - ".github/workflows/tests.yml"
  push:
    branches: [main, master]
    paths:
      - "src/scripts/**"
      - "tests/**"
      - "src/**"
      - "packages/core/installer/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "eslint.config.js"
      - "Taskfile.yml"
      - "taskfiles/**"
      - "install.sh"
      - "setup.sh"
      - ".agent-src.uncondensed/skills/lint-skills/**"
      - ".agent-src.uncondensed/skills/check-refs/**"
      - ".github/workflows/tests.yml"
  # Manual re-trigger from the Actions UI / `gh workflow run tests.yml`.
  # Needed because the path filter sometimes skips a synchronize event
  # even when scripts/** or tests/** changed (observed on PR #34).
  workflow_dispatch:

# Cancel superseded runs on the same ref. Saves ~7min per re-push on
# the install-tests matrix and keeps the queue depth low so fresh
# pushes don't sit behind stale ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-tests:
    # test_install.sh runs each of 35 tests in its own mktemp dir,
    # invoking install.sh which symlinks hundreds of skill/rule/command
    # files. Wall-clock dominated by fs ops — sharded across 4 matrix
    # jobs so each shard runs ~9 tests, then --parallel 9 fans those
    # out concurrently within the shard. Default nproc on macOS-arm64
    # runners returns only 3, leaving cycles on the table; with only
    # 9 tests/shard the fs contention that hurt at the un-sharded
    # -P 8 setting is no longer a concern.
    #
    # Release-PR skip: docs/contracts/release-pr-gating.md — release
    # PRs (head branch `release/X.Y.Z`) only touch package.json /
    # CHANGELOG / marketplace / pack manifests and cannot regress the
    # install script paths this job exercises. release-validation.yml
    # is the kept surface for release PRs; push: main + workflow_dispatch
    # stay unconditional.
    if: ${{ !startsWith(github.head_ref, 'release/') }}
    name: Install Script Tests (${{ matrix.os }}, shard ${{ matrix.shard }}/4)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: [1, 2, 3, 4]
    env:
      SHARD: ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@v4

      - name: Run install.sh integration tests (shard ${{ matrix.shard }}/4)
        run: bash tests/test_install.sh --parallel 9

  install-aux-tests:
    # Orchestrator + key-contract + one-liner smoke. Smaller suites
    # (orchestrator ~40 tests, keys <2s each, one-liner ~15s) so a
    # single job per OS hits the 1–2 min target without sharding.
    #
    # Release-PR skip per docs/contracts/release-pr-gating.md — release
    # PRs don't touch the orchestrator, key installers, or setup.sh.
    if: ${{ !startsWith(github.head_ref, 'release/') }}
    name: Install Aux Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Run install orchestrator integration tests
        # Default nproc on macOS-arm64 runners returns 3, bottlenecking
        # the ~40-test orchestrator suite. Explicit -P 8 keeps wall-clock
        # under 90s without the fs contention seen in larger suites.
        run: bash tests/test_install_orchestrator.sh --parallel 8

      - name: Run install_openai_key.sh + install_anthropic_key.sh contract tests
        # Tiny suites (<2s each) — folded into one step so the per-step
        # overhead doesn't dwarf the actual work.
        run: |
          bash tests/test_install_openai_key.sh
          bash tests/test_install_anthropic_key.sh

      - name: One-liner entrypoint smoke tests (setup.sh + npx wrapper)
        # Phase-2 smoke test for road-to-simplicity-and-everywhere.
        # Builds a local tarball, points both setup.sh and the npm wrapper
        # at it via AGENT_CONFIG_TARBALL_URL=file://, and asserts that
        # `.claude/` populates and `.agent-settings.yml` renders.
        run: bash tests/test_one_liner_entrypoints.sh

  python-tests:
    # Release-PR skip per docs/contracts/release-pr-gating.md — release
    # PRs don't touch scripts/** or tests/** (only package.json,
    # CHANGELOG, marketplace, pack manifests, pack READMEs).
    #
    # Baseline leg only: ubuntu + macOS × 3.12. The 3.10 / 3.11 / 3.13
    # version sweep moved to .github/workflows/python-version-sweep.yml
    # in road-to-optimized-ci-and-release-gates Phase C Step 2 — runs
    # only on PRs whose diff touches Python paths. Minimum supported
    # version is 3.10 (per AGENTS.md); the sweep workflow proves the
    # range when relevant code changes.
    if: ${{ !startsWith(github.head_ref, 'release/') }}
    name: Python Tests (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install test deps
        # pytest drives the suite; pytest-xdist parallelises across CPU
        # cores (`-n auto`); pyyaml is a runtime dep of the memory
        # tooling (check_memory / check_proposal / memory_lookup) that
        # the tests invoke via subprocess; jsonschema validates the
        # ExplainTrace v1 payload via scripts/lint_explain_trace.py.
        run: pip install pytest pytest-xdist pyyaml jsonschema

      - name: Bootstrap generated projection (.augment/, .cursor/, …)
        # The Phase-2.4 install_global tests deploy content from
        # `.augment/rules`, `.cursor/rules`, etc. into a fake user-scope
        # home. Those dirs are git-ignored and rebuilt by `task sync`
        # from `.agent-src/` on developer machines. CI checkouts skip
        # that step, so without this bootstrap `_copy_dir_dereferencing
        # _symlinks` returns 0 written files (src missing) and the
        # tests fail with "rules dir does not exist".
        run: python3 src/scripts/condense.py --sync

      - name: Golden Replay — smoke subset (P2.4 PR budget)
        # Replays the smoke-tagged Golden Transcripts (~6 of 25) for
        # sub-second PR feedback. A failure here means the refactor
        # regressed engine behavior — fix the engine, never the
        # baseline. Full coverage runs in two places:
        #   1. The pytest sweep below re-runs ALL goldens (~7s).
        #   2. `freeze-guard.yml` does a full live-capture replay on
        #      every PR that touches `scripts/work_engine/**` and on
        #      a nightly cron schedule.
        # The smoke step exists for reviewer visibility — a single
        # named step that flags drift without scanning 800+ test names.
        run: python3 -m pytest tests/golden/test_replay.py -m smoke -v

      - name: Run Python tests
        # pytest discovers every test module in tests/. Prevents new test
        # files from silently missing CI coverage. `-n auto` fans the
        # suite across available CPU cores via pytest-xdist.
        run: python3 -m pytest tests/ -n auto -q

      - name: Runtime E2E (dispatch pilot skills via CLI)
        # Guards the public dispatcher CLI contract for runnable skills.
        # Pytest exercises the handler in-process; this step proves
        # `python3 src/scripts/runtime_dispatcher.py run --skill <name>`
        # still exits 0 for the two pilots. Kept narrow on purpose — add
        # a pilot to the matrix below only after it has unit coverage.
        # Each run persists its ExecutionResult so the next step can
        # render a job summary even if an individual skill fails.
        run: |
          mkdir -p agents/reports/runs
          python3 src/scripts/runtime_dispatcher.py run --skill lint-skills \
            --output agents/reports/runs/lint-skills.json
          python3 src/scripts/runtime_dispatcher.py run --skill check-refs \
            --output agents/reports/runs/check-refs.json

      - name: CI summary (dispatcher runs)
        # Renders a Markdown table of the runs above as a GitHub Step
        # Summary. Runs on success AND failure so failing pilots still
        # show up in the PR UI with their stderr tail.
        if: always()
        run: python3 src/scripts/ci_summary.py --runs agents/reports/runs

  node-tests:
    # Consolidates TypeScript CLI/UI tests (Phase 5.2 of
    # typescript-cli-and-local-gui-foundation) and the installer-package
    # tests (Phase 3.1/6 of monorepo-phase-3-typescript-installer, ADR-016)
    # into one runner. Both share the same OS matrix, Node version, and
    # root `npm ci` — merging halves checkout + setup-node + npm ci cost
    # per OS without losing diagnostic clarity (step names remain
    # distinct). The installer package shares the root node_modules via
    # npm-hoisting for @inquirer/prompts, commander, js-yaml, vitest,
    # typescript; no separate `npm ci` is required inside the package
    # directory. `build` script = `build:cli && build:ui`, so the
    # previous explicit build:cli + build:ui + build pair was a no-op
    # duplicate; collapsed to a single build invocation.
    name: Node Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Release-PR skip per docs/contracts/release-pr-gating.md — release
    # PRs don't touch src/**, tests/{cli,server,ui}/**, or
    # packages/core/installer/**; ESLint, tsc, vitest, prepack-check
    # have nothing new to prove.
    if: ${{ !startsWith(github.head_ref, 'release/') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build discovery manifest (gitignored; cli-e2e reads it)
        # `agent-config commands ls/explain` and the cli-e2e suite read
        # dist/discovery/discovery-manifest.json — a generated artefact
        # absent from CI checkouts. Built here with a provisioned Python
        # (the macOS system python3 lacks pyyaml).
        run: |
          pip install --quiet pyyaml
          python3 src/scripts/build_discovery_manifest.py --write --quiet

      - name: Install dependencies (hoists installer toolchain)
        run: npm ci

      # ── Root TS CLI + UI ───────────────────────────────────────────
      - name: ESLint (src/**/*.ts)
        run: npm run lint:ts --silent

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck --silent

      - name: Build (dist/cli + UI bundle)
        # `build` = `build:cli && build:ui`; the `build:cli` step also
        # exercises the `chmod +x` hook that prepack-check.mjs asserts
        # on `npm pack`.
        run: npm run build --silent

      - name: Vitest (tests/{cli,server,ui}/**/*.ts)
        run: npm run test:ts --silent

      - name: prepack-check (compiled bin shape gate)
        run: node src/scripts/prepack-check.mjs

      # ── Installer package (packages/core/installer) ────────────────
      - name: Typecheck installer (tsc --noEmit)
        working-directory: packages/core/installer
        run: npx tsc -p tsconfig.json --noEmit

      - name: Build installer (dist/)
        working-directory: packages/core/installer
        run: npx tsc -p tsconfig.json

      - name: Vitest (packages/core/installer/tests/**/*.ts)
        working-directory: packages/core/installer
        run: npx vitest run --reporter=default

  # NOTE: windows-lockfile-export moved to
  # .github/workflows/windows-lockfile-export.yml in
  # road-to-optimized-ci-and-release-gates Phase C Step 1 — own
  # workflow with a tight path-filter on scripts/install_global*.py,
  # scripts/cmd_export.py, and the two test modules. Was previously
  # firing on every PR touching scripts/**, even ones that never
  # went near install_global (measured ~60-90 s wasted wall-clock
  # on the Windows leg per such PR).
