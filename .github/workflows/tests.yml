name: Tests

on:
  pull_request:
    branches: [main, master]
    paths:
      - "src/scripts/**"
      - "tests/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "eslint.config.js"
      - "Taskfile.yml"
      - "taskfiles/**"
      - "setup.sh"
      - ".github/workflows/tests.yml"
  push:
    branches: [main, master]
    paths:
      - "src/scripts/**"
      - "tests/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "eslint.config.js"
      - "Taskfile.yml"
      - "taskfiles/**"
      - "setup.sh"
      - ".github/workflows/tests.yml"
  # Manual re-trigger from the Actions UI / `gh workflow run tests.yml`.
  # Needed because the path filter sometimes skips a synchronize event
  # even when scripts/** or tests/** changed (observed on PR #34).
  workflow_dispatch:

# Cancel superseded runs on the same ref. Saves ~7min per re-push on
# the install-tests matrix and keeps the queue depth low so fresh
# pushes don't sit behind stale ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-tests:
    # test_install.sh runs each of 35 tests in its own mktemp dir,
    # invoking install.sh which symlinks hundreds of skill/rule/command
    # files. Wall-clock dominated by fs ops — sharded across 4 matrix
    # jobs so each shard runs ~9 tests, then --parallel 9 fans those
    # out concurrently within the shard. Default nproc on macOS-arm64
    # runners returns only 3, leaving cycles on the table; with only
    # 9 tests/shard the fs contention that hurt at the un-sharded
    # -P 8 setting is no longer a concern.
    #
    # Release-PR skip: docs/contracts/release-pr-gating.md — release
    # PRs (head branch `release/X.Y.Z`) only touch package.json /
    # CHANGELOG / marketplace / pack manifests and cannot regress the
    # install script paths this job exercises. release-validation.yml
    # is the kept surface for release PRs; push: main + workflow_dispatch
    # stay unconditional.
    if: ${{ !startsWith(github.head_ref, 'release/') }}
    name: Install Script Tests (${{ matrix.os }}, shard ${{ matrix.shard }}/4)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: [1, 2, 3, 4]
    env:
      SHARD: ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      # The installer is now TypeScript (install.ts via tsx); the bridges stage
      # + skill-registration probe resolve node_modules/.bin/tsx. Without a
      # local install, resolve_tsx_bin falls back to `npx tsx`, whose on-the-fly
      # fetch fails offline (esbuild ENOENT). Provide node_modules up front.
      - name: Install dependencies (provides node_modules/.bin/tsx for the installer)
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Run install.sh integration tests (shard ${{ matrix.shard }}/4)
        run: bash tests/test_install.sh --parallel 9

  install-aux-tests:
    # Orchestrator + key-contract + one-liner smoke. Smaller suites
    # (orchestrator ~40 tests, keys <2s each, one-liner ~15s) so a
    # single job per OS hits the 1–2 min target without sharding.
    #
    # Release-PR skip per docs/contracts/release-pr-gating.md — release
    # PRs don't touch the orchestrator, key installers, or setup.sh.
    if: ${{ !startsWith(github.head_ref, 'release/') }}
    name: Install Aux Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      # The installer is now TypeScript (install.ts via tsx); without a local
      # install, resolve_tsx_bin falls back to `npx tsx` whose fetch fails
      # offline (esbuild ENOENT). Provide node_modules up front.
      - name: Install dependencies (provides node_modules/.bin/tsx for the installer)
        run: npm ci --no-audit --no-fund --prefer-offline

      # The committed dist/install/install.mjs is the raw-source consumer
      # bridge runner (node, no tsx) used by setup.sh. Rebuild it and assert
      # no drift — a stale bundle ships old install behavior to consumers.
      # Scope note: esbuild only, so this covers install.mjs and NOT the tsc
      # output in the same directory — that is the static-checks job's
      # "Committed build output is fresh (dist/install/)" gate.
      - name: Install bundle is fresh (dist/install/install.mjs)
        run: |
          npm run build:install-bundle
          git diff --exit-code -- dist/install/

      # road-to-feedback-9.2.0-followups Phase 4: three 9.1 commits each
      # manually rebuilt this bundle to strip a leaked build-machine path
      # (worktree-relative, repo-relative, and full /Users/<name>/... module
      # comments). This makes that class fail the build instead.
      - name: Install bundle has no build-machine path leakage
        run: ./scripts-run src/scripts/check_bundle_path_leakage

      # road-to-consistent-rule-scoping: importing a maintainer CLI into the
      # installer bundles its module-level `process.exit()`, and a CLI entry
      # guard comparing import.meta.url to argv[1] evaluates TRUE inside a
      # bundle — killing a consumer install after the payload is written. The
      # behavioural smoke caught it only post-push, on all four legs.
      - name: Installer imports no module-level process.exit()
        run: ./scripts-run src/scripts/check_installer_import_purity

      - name: Run install orchestrator integration tests
        # Default nproc on macOS-arm64 runners returns 3, bottlenecking
        # the ~40-test orchestrator suite. Explicit -P 8 keeps wall-clock
        # under 90s without the fs contention seen in larger suites.
        run: bash tests/test_install_orchestrator.sh --parallel 8

      - name: Run install_openai_key.sh + install_anthropic_key.sh contract tests
        # Tiny suites (<2s each) — folded into one step so the per-step
        # overhead doesn't dwarf the actual work.
        run: |
          bash tests/test_install_openai_key.sh
          bash tests/test_install_anthropic_key.sh

      - name: One-liner entrypoint smoke tests (setup.sh + npx wrapper)
        # Phase-2 smoke test for road-to-simplicity-and-everywhere.
        # Builds a local tarball, points both setup.sh and the npm wrapper
        # at it via AGENT_CONFIG_TARBALL_URL=file://, and asserts that
        # `.claude/` populates and `.agent-settings.yml` renders.
        run: bash tests/test_one_liner_entrypoints.sh

  node-tests:
    # Consolidates TypeScript CLI/UI tests (Phase 5.2 of
    # typescript-cli-and-local-gui-foundation) and the installer-package
    # tests (Phase 3.1/6 of monorepo-phase-3-typescript-installer, ADR-016)
    # into one runner. Both share the same OS matrix, Node version, and
    # root `npm ci` — merging halves checkout + setup-node + npm ci cost
    # per OS without losing diagnostic clarity (step names remain
    # distinct). The installer package shares the root node_modules via
    # npm-hoisting for @inquirer/prompts, commander, js-yaml, vitest,
    # typescript; no separate `npm ci` is required inside the package
    # directory. `build` chains SIX targets (package.json:78) — cli,
    # install-bundle, hooks, mcp-bundle, cli-delegate, ui — so the previous
    # explicit build:cli + build:ui + build triple was a no-op duplicate;
    # collapsed to a single build invocation.
    name: Node Tests (${{ matrix.os }}, shard ${{ matrix.shard }}/4)
    runs-on: ${{ matrix.os }}
    # Release-PR skip per docs/contracts/release-pr-gating.md — release
    # PRs don't touch src/** or tests/**; ESLint, tsc, vitest,
    # prepack-check have nothing new to prove.
    if: ${{ !startsWith(github.head_ref, 'release/') }}
    strategy:
      fail-fast: false
      matrix:
        # Vitest is core-saturated on a single runner (the subprocess suites
        # spawn ./agent-config / tsx heavily), so the wall clock is
        # total-CPU-work ÷ cores. `--shard=N/4` fans the file set across 4
        # parallel runners per OS. The golden-replay suite — the single
        # heaviest cluster — is pulled into its OWN job (`golden-tests`) and
        # EXCLUDED here, because vitest shards by file COUNT not duration and
        # would otherwise clump the golden files into one > 2 min bucket.
        # ESLint / typecheck / prepack are whole-tree gates → shard 1 only.
        os: [ubuntu-latest, macos-latest]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (hoists installer toolchain)
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Build discovery manifest (gitignored; cli-e2e reads it)
        # `agent-config commands ls/explain` and the cli-e2e suite read
        # dist/discovery/discovery-manifest.json — a generated artefact
        # absent from CI checkouts. Built via the TypeScript builder
        # (scripts-run → tsx); needs node_modules, so it runs after npm ci.
        run: ./scripts-run src/scripts/build_discovery_manifest --write --quiet

      # ── Root TS CLI + UI ───────────────────────────────────────────
      # ESLint / typecheck / prepack are whole-tree gates with nothing to
      # shard — they live in the dedicated `static-checks` job (runs once,
      # not per OS × shard) so no vitest shard carries their ~40s and every
      # shard is build + vitest only.
      - name: Build (dist/cli + UI bundle)
        # `build` chains six targets (package.json:78), not two. Every shard
        # needs dist/ — the subprocess suites spawn `./agent-config` →
        # dist/cli/agent-config.js.
        run: npm run build --silent

      - name: Vitest (shard ${{ matrix.shard }}/4, heavy suites excluded)
        # `--` forwards flags to vitest; each runner executes a deterministic
        # quarter of the file set. The subprocess-heavy clusters (golden +
        # workspace) hash-clump into one over-budget shard regardless of shard
        # count, so they are excluded here and run in the dedicated
        # `golden-tests` / `workspace-tests` jobs below. (There has never been a
        # `heavy-tests` job; the name this comment used to carry named nothing.)
        #
        # The exclusion does NOT make the shards balanced, and this comment used
        # to claim it did. Measured over 50 successful `main` runs on 2026-08-18:
        # shard 3/4 averages 357 s ubuntu / 516 s macOS against 147–164 s for its
        # three siblings, so it is 2.3× the others and over the 5-min per-job
        # ceiling. The driver is `tests/scripts/build_proof.test.ts`, which is
        # NOT excluded here and spawns nothing — its cost is `render()` at ~54 s
        # a call. Folding the two dedicated jobs back in was evaluated against
        # these figures and rejected; the arithmetic and the revisit-if live in
        # docs/contracts/ci-cost-budget.md § Fold-back decision, 2026-08-18.
        run: >-
          npm run test:ts --silent --
          --shard=${{ matrix.shard }}/4
          --exclude 'tests/golden/**'
          --exclude 'tests/server/workspace.test.ts'
          --exclude 'tests/scripts/collector_lifecycle.test.ts'
          --exclude 'tests/scripts/cli/python/**'

  static-checks:
    # Whole-tree gates that have nothing to shard: ESLint, tsc --noEmit, and
    # the prepack compiled-bin shape check. Run once (ubuntu only — all three
    # are OS-independent) instead of on every node-tests shard, so no vitest
    # shard's wall clock carries their ~40s and the check dedups across OSes.
    name: Static Checks (ESLint · typecheck · prepack)
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'release/') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (hoists installer toolchain)
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: ESLint (src/**/*.ts)
        run: npm run lint:ts --silent

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck --silent

      - name: MCP catalog drift (--strict)
        # Phase 3 of road-to-credible-install: consumer_tool_catalog.json is
        # generated FROM the tool registry (ALLOWLIST in mcp_server/tools.ts
        # + STUB_TOOLS in mcp_server/tool_catalog_source.ts) — a hand-edit
        # or an un-regenerated registry change both fail this gate red.
        run: ./scripts-run src/scripts/build_mcp_catalog --strict

      - name: CLI registry ↔ evaluator budget sync
        # A registry entry added without moving cli_help_command_count (budget +
        # committed record) only WARNS on main and BLOCKS the next release —
        # the 9.15.0 failure mode. This fails the registering PR instead.
        run: ./scripts-run src/scripts/check_cli_registry_budget_sync

      - name: Build (dist/cli + UI bundle)
        # prepack-check asserts the chmod +x hook applied by build:cli.
        run: npm run build --silent

      # dist/install/ is a TRACKED, npm-shipped tree (package.json `files`), and
      # the build above emits tsc output straight into it — but nothing asserted
      # the committed output still derives from src/install/. Two drift classes
      # shipped to consumers before PR #1052 caught them by hand: rule_scope.js
      # built without the `roles` scope dimension (so the shipped build ignored
      # `rule_roles` while the source honoured it), and three sources
      # (agentSwitchDetection, agentSwitchProfile, wizardDismissals) with no
      # compiled counterpart at all.
      #
      # Neither was visible: the sibling "Install bundle is fresh" gate in
      # install-aux-tests rebuilds only install.mjs via esbuild, so it never
      # exercises the tsc side, and node-tests runs build:cli without asserting
      # drift. `--porcelain` over `git diff --exit-code` on purpose — diff sees
      # modified files only, and MISSING output is untracked, not modified.
      # Free ride: this reuses the build already run above, no extra compile.
      - name: Committed build output is fresh (dist/install/)
        run: |
          drift="$(git status --porcelain -- dist/install/)"
          if [ -n "$drift" ]; then
            echo "::error::dist/install/ no longer derives from src/install/. Run 'npm run build:cli' and commit the result."
            echo "$drift"
            git --no-pager diff -- dist/install/
            exit 1
          fi

      - name: prepack-check (compiled bin shape + shipped-import completeness)
        # Dry-run of the publish gate on every PR: also asserts every relative
        # import reachable from the shipped src/ trees resolves to a file the
        # package.json `files` whitelist actually ships (the 8.3.0
        # ERR_MODULE_NOT_FOUND class — doctor/conformance crashed in the
        # global install because src/install/ was never packed), and that
        # every consumer-side lifecycle script target exists + ships (the
        # 9.8.0 dead-postinstall class).
        run: node src/scripts/prepack-check.mjs

      - name: hook-latency bench gate (pre-registered budget, real path)
        # Standing published gate (road-to-credible-install Phase 1;
        # real-path flip: road-to-hook-latency-repair Phase 1): 50
        # invocations per hook event via the EXACT command hooks.json
        # installs (bash wrapper + shim probe + CLI), i.e. the path
        # consumers actually pay — not the bare dist/hooks/dispatch.js
        # bundle the old gate measured. p95 must meet
        # src/config/hook-latency-budget.json and must not regress beyond
        # regression_gate vs the recorded docs/hook-latency.json numbers
        # (regression net applies only when the recorded invocation_path
        # matches; absolute budgets always bind).
        # --record-composite: A1.1 of road-to-per-turn-hook-economy-carry. The
        # bench used to print the per-turn composite and discard it, which made
        # per_turn_composite.arming_precondition ("at least 10 CI gate readings
        # from at least 2 distinct runner sessions") impossible to evaluate in
        # either direction. The reading is written BEFORE the ceiling comparison,
        # so a run that fails the gate still contributes its number — a store
        # holding only the passing runs is biased in the direction that makes a
        # ceiling look met.
        run: ./scripts-run src/scripts/bench_hook_latency --gate --via-cli --record-composite "$RUNNER_TEMP/composite-reading.jsonl"

      - name: report the composite arming state (never gates)
        # Reads the reading this job just wrote and says whether the precondition
        # holds. It cannot hold from ONE run — that is the point: the output names
        # the shortfall so the accumulation is visible per run instead of being
        # discovered as a surprise when someone tries to arm the ceiling.
        if: always()
        # continue-on-error, deliberately: this step REPORTS, it does not gate. A
        # bench run that failed before writing leaves no store, and the predicate
        # correctly exits 1 on a store it cannot read (an empty store must not
        # pass as "no readings yet"). That is the right behaviour for the
        # predicate and the wrong reason to red this job.
        continue-on-error: true
        run: ./scripts-run src/scripts/check_composite_arming --store "$RUNNER_TEMP/composite-reading.jsonl"

      - name: upload the composite reading
        # Durability, and the honest boundary of this phase. A workflow cannot
        # append to a tracked file without a push, so each run uploads its own
        # single-record shard and the shards are concatenated into
        # agents/evidence/hook-composite-readings.jsonl by whoever collects them.
        # That collection step is NOT built here and is named in the roadmap
        # rather than implied — a store nothing fills would be the mechanism this
        # phase exists to avoid.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: composite-reading-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/composite-reading.jsonl
          if-no-files-found: warn
          retention-days: 30

      - name: hook-latency path comparison (diagnostic, never gates)
        # Answers ONE question the gate above cannot: when the cli path misses
        # 150 ms, is the path intrinsically that expensive, or did it REGRESS?
        # road-to-hook-latency-repair closed on 2026-08-03 at cli p95 84 ms
        # against this same budget; main now measures 117-152 ms and fails the
        # gate outright on some runs. Those two numbers come from different
        # runners weeks apart, so on their own they cannot separate a real
        # regression from runner variance — and picking the wrong explanation
        # is what a budget relaxation looks like when it is written up as a
        # calibration fix.
        #
        # The discriminator is the BUNDLE path measured beside the cli path:
        # dist/hooks/dispatch.js is recorded at p95 81 ms in
        # docs/hook-latency.json. Bundle still ~81 while cli sits near 150 puts
        # the growth in the wrapper the consumer pays (bash + shim probe + CLI
        # startup); both risen together puts it in the dispatcher itself.
        #
        # Both legs run here, back to back, so they share a cache state and the
        # comparison between THEM is symmetric. The gate above keeps its own
        # position and conditions untouched — perturbing the measurement under
        # dispute would defeat the point — and the delta between its cli number
        # and this step's cli number reports the warm/cold effect for free.
        #
        # `always()` because the gate red is exactly the run whose numbers are
        # worth having. Never gates: it prints, and a human reads it. Wiring a
        # second budget here would re-introduce the moved-bar move this step
        # exists to make unnecessary.
        if: always()
        # `continue-on-error` because "never gates" was a claim this step could not
        # keep. It has no build of its own: `always()` makes it run after an earlier
        # failure has SKIPPED the Build step, the bundle path then exits 2 on a
        # missing `dist/hooks/dispatch.js`, and with the default `bash -e` shell that
        # failed the job. Observed on run 32736574349, where a typecheck error
        # produced TWO red steps — the real one, and this diagnostic reporting that it
        # had nothing to measure. A diagnostic that turns one failure into two is
        # worse than no diagnostic: it adds a line a reader has to rule out before
        # reaching the cause. Now it prints what it can and never contributes a
        # failure, which is what the comment above always said it did.
        continue-on-error: true
        run: |
          echo "::group::bundle path — node dist/hooks/dispatch.js"
          ./scripts-run src/scripts/bench_hook_latency
          echo "::endgroup::"
          echo "::group::cli path — the exact command hooks.json installs"
          ./scripts-run src/scripts/bench_hook_latency --via-cli
          echo "::endgroup::"

      - name: publint (published-package shape)
        # Release-gate addition (road-to-credible-install Phase 0): catches
        # dead script targets / broken exports / files[] mistakes in the
        # packed artifact structurally, on every PR instead of at publish.
        run: npm run lint:publint --silent

      - name: npm audit (runtime deps, high+)
        # Standing audit gate (road-to-credible-install Phase 0): the same
        # floor status as ci-green. Dev-only advisories do not block; the
        # runtime dependency tree must stay free of high/critical findings.
        run: npm audit --omit=dev --audit-level=high

  golden-tests:
    # Golden-transcript replay — 30 scenarios × `./agent-config` (dist/cli)
    # spawn per cycle, split across 6 files (tests/golden/golden_replay*.test.ts)
    # so vitest's fork pool runs them concurrently on a DEDICATED runner
    # (~25 s local). Kept out of the sharded `node-tests` matrix because vitest
    # shards by file COUNT not duration and would clump the golden files into
    # one over-budget bucket (the observed 167 s shard-2 failure mode).
    # Separate from `workspace-tests` on purpose: running both subprocess-heavy
    # clusters in one job oversubscribed the fork pool and produced flaky
    # spawn-timeout failures — each cluster gets its own runner.
    name: Golden Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: ${{ !startsWith(github.head_ref, 'release/') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (hoists installer toolchain)
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Build discovery manifest (gitignored; cli-e2e reads it)
        run: ./scripts-run src/scripts/build_discovery_manifest --write --quiet

      - name: Build (dist/cli + UI bundle)
        # The golden suite spawns `./agent-config` → dist/cli/agent-config.js.
        run: npm run build --silent

      - name: Vitest (tests/golden — fork-parallel)
        run: npm run test:ts --silent -- tests/golden

  collector-lifecycle:
    # The five process-level lifecycle properties of the telemetry collector
    # (road-to-supervised-telemetry-collector step 5.1, AC-8). Spawns real
    # daemons — orphan behaviour, signal handling and file locking are process
    # facts and a mocked suite proves none of them.
    #
    # PLATFORMS, NAMED, because the blocker `lifecycle-ci-runner-provisioning`
    # requires this job to name them rather than leave them to be inferred:
    #
    #   macos-latest  — the declared macOS row (per-user launchd). VERIFIED here.
    #   Linux with a user session bus — the second declared supported row.
    #                   NOT CERTIFIED, and not certifiable on a GitHub-hosted
    #                   runner: ubuntu-latest has no user session bus, so it is
    #                   the static-fallback row of the platform table, not the
    #                   supported one. Running the suite there would produce a
    #                   green tick that says nothing about `systemd --user`.
    #
    # "NOT CERTIFIED" rather than "NOT RUN", corrected on R2 round-2 finding 3:
    # the suite is excluded from `node-tests` now, but the distinction is the
    # honest one either way — whether the file executes somewhere and whether
    # this project claims a platform from it are different questions, and only
    # the second one is what AC-8 turns on.
    #
    # That split IS the AI council's decision of 2026-08-29 (UNANIMOUS, 2/2):
    # option (b) — run on the one platform CI provides, record the other as
    # unverified, and keep it out of release claims EVEN IF its static fallback
    # appears to work. (a), provisioning a runner with a real user session bus,
    # remains the target.
    name: Collector Lifecycle (macos-latest — the macOS row only)
    runs-on: macos-latest
    # Spawns real daemons with 90 s per-case timeouts, and runs the
    # dispatcher-reaching suite twice for the parity comparison; a hang here
    # would otherwise sit at the runner default (R2 round-2 finding 2).
    timeout-minutes: 20
    if: ${{ !startsWith(github.head_ref, 'release/') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Build discovery manifest (gitignored; the suites read it)
        # R2 round-2 finding 2: this job runs vitest twice — once through
        # `run_lifecycle_suite`, once through `check_static_parity`'s
        # double run — and was the only vitest job in this workflow skipping the
        # two preparation steps every other one performs. A test depending on
        # the generated manifest or on `dist/` reds identically in both parity
        # runs, and the gate then exits 1 on "one of the two runs is red".
        run: ./scripts-run src/scripts/build_discovery_manifest --write --quiet

      - name: Build (dist/cli + UI bundle)
        run: npm run build --silent

      - name: Run the lifecycle suite and write its evidence artifact
        # Non-zero on a red suite, on ANY skipped case (AC-8: a skip is a
        # failure on that platform, not an absence), and when not every named
        # property passed.
        run: ./scripts-run src/scripts/run_lifecycle_suite

      - name: Consume the evidence in the SAME job
        # R2 finding 1. The artifact used to be written here and read only by
        # `check_supervision_claim_atomicity` in `rule-backstops.yml` — a
        # different workflow, so a different filesystem, with no
        # upload/download-artifact wiring and a gitignored file. The gate
        # therefore always took its "no lifecycle evidence" branch and the
        # AC-8/AC-9 chain was broken at the workflow boundary.
        #
        # Running the reader in the producing job is what closes it: this is the
        # only place in CI where the artifact and the revision that produced it
        # exist together. The gate in `rule-backstops.yml` stays — there it is
        # correctly vacuous, because a checkout with no artifact and no
        # present-tense supervision claim has nothing to refuse.
        run: |
          # The gate reads the artifact only after a present-tense supervision
          # claim matches on a public surface, and none carries one — so on its
          # own this step passes identically whether the artifact is correct,
          # stale or absent (R2 round-5 finding 6). The assertions below are
          # what actually exercise the producer -> reader link: the artifact
          # exists, names this revision, and records real processes.
          test -f internal/reports/supervision-lifecycle.json
          node -e '
            const fs = require("node:fs");
            const { execFileSync } = require("node:child_process");
            const ev = JSON.parse(fs.readFileSync("internal/reports/supervision-lifecycle.json", "utf8"));
            const head = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim();
            const fail = (m) => { console.error("evidence chain: " + m); process.exit(1); };
            if (ev.revision !== head) fail(`revision ${ev.revision} != HEAD ${head}`);
            if (ev.processes_exercised !== true) fail("processes_exercised is not true");
            if (!(ev.cases_run > 0) || ev.cases_skipped !== 0) fail("cases_run/skipped are not a clean run");
            console.log("evidence chain: artifact matches HEAD and records " + ev.cases_run + " real-process cases");
          '
          ./scripts-run src/scripts/check_supervision_claim_atomicity

      - name: Show the evidence artifact
        # `always()` so a RED run still prints the artifact — which is exactly
        # the run where its contents matter, and the step had no condition at
        # all before.
        if: always()
        run: cat internal/reports/supervision-lifecycle.json || true

      - name: Static-operation parity (AC-7)
        # R2 finding 5: this gate was invoked by nothing — no workflow, no task,
        # no package script. Its AC-7 evidence was a single hand-run that CI
        # could not reproduce or regression-detect, which is the shape step 5.2
        # argues against for the sibling suite.
        #
        # It runs the dispatcher-reaching suite twice (once with the collector
        # present-but-off, once with it aliased away) and compares per-test
        # verdicts. Placed here rather than in `task ci` because the double run
        # is roughly a minute, which is not a per-change local gate; declared
        # `ci_only` in `src/config/ci-local-parity.yml` with that reason and
        # reachable on demand. The test count is deliberately not written here —
        # it moves with the suite and the gate prints the live figure.
        run: ./scripts-run src/scripts/check_static_parity --quiet

  workspace-tests:
    # The workspace cluster: tests/server/workspace.test.ts + the cli/python
    # workspace suite (each spawns `tsx src/cli/python/*.ts` per assertion).
    # These `workspace*`-named files hash-clump into one node-tests shard
    # regardless of shard count, so they run on their own DEDICATED runner
    # (~12 s local, ~40 s CI). Separate from `golden-tests` to avoid
    # over-subscribing the fork pool (see the flaky-spawn note there).
    name: Workspace Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: ${{ !startsWith(github.head_ref, 'release/') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (hoists installer toolchain)
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Build discovery manifest (gitignored; cli-e2e reads it)
        run: ./scripts-run src/scripts/build_discovery_manifest --write --quiet

      - name: Build (dist/cli + UI bundle)
        run: npm run build --silent

      - name: Vitest (workspace suite — fork-parallel)
        run: >-
          npm run test:ts --silent --
          tests/server/workspace.test.ts
          tests/scripts/cli/python

  # NOTE: windows-lockfile-export moved to
  # .github/workflows/windows-lockfile-export.yml in
  # road-to-optimized-ci-and-release-gates Phase C Step 1 — own
  # workflow with a tight path-filter on scripts/install_global*.py,
  # scripts/cmd_export.py, and the two test modules. Was previously
  # firing on every PR touching scripts/**, even ones that never
  # went near install_global (measured ~60-90 s wasted wall-clock
  # on the Windows leg per such PR).
