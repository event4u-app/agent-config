name: Release

# CI-native release path, alongside (never replacing) the local `task
# release` pipeline — both run the exact same src/scripts/release.ts.
#
# Trigger: merging any PR that carries a `release` / `release:major` /
# `release:minor` / `release:patch` label. `release` auto-detects the
# semver bump from Conventional Commits since the last tag (same logic
# `task release` uses); the `release:*` variants force major/minor/patch.
# `workflow_dispatch` is the manual/recovery entry for a release not tied
# to a PR merge, or to re-run a partially failed release.yml run.
#
# Token: uses secrets.RELEASE_PR_TOKEN when configured (a fine-grained PAT
# or GitHub App installation token with contents:write + pull-requests:write
# + actions:write on this repo), falling back to the default GITHUB_TOKEN.
# actions:write ("Actions: read and write" on a fine-grained PAT, or the
# "workflow" scope on a classic PAT) is required for step 9's explicit
# dispatch of the tag-triggered workflows (release-guard / publish-npm /
# cloud-release); WITHOUT it that dispatch returns HTTP 403. It is non-fatal
# (the release is already complete by then, and a PAT-pushed tag fires those
# workflows on the push anyway — see release.ts step 9), but the run's log
# will carry a warning until the scope is granted.
#
#   - With RELEASE_PR_TOKEN (contents + pull-requests + actions): fully
#     unattended end-to-end.
#   - Without it: DO NOT COUNT ON A MANUAL CHECKPOINT. This block used to
#     promise one — that GitHub's bot-created-PR safeguard queues the release
#     PR's checks in an approval-required state, so a maintainer must click
#     "Approve workflows to run" once per release before `gh pr checks --watch`
#     can proceed to merge. Measured on 14.0.0 (2026-08-18) on this repo with
#     no RELEASE_PR_TOKEN configured: the checks started IMMEDIATELY, no
#     approval was requested, and the run would have merged to main, tagged and
#     published without a human touching it. The dispatched run had to be
#     cancelled by hand to stop before the merge.
#
#     Whether the safeguard applies is a repository/organisation Actions
#     setting, not a property of this workflow, so the honest contract is:
#     **treat a dispatched release as unattended end-to-end unless you have
#     verified the approval gate on THIS repo.** If you want a human gate
#     before the merge, the reliable ones are a branch-protection required
#     review (see docs/contracts/branch-protection-policy.md) or cancelling
#     the run — not this comment.
#
# See also:
#   - src/scripts/release.ts — the shared pipeline (--ci mode).
#   - docs/decisions/ADR-113-ci-native-release-label-trigger.md
#   - docs/contracts/release-pr-gating.md, branch-protection-policy.md

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Bump level (auto detects from Conventional Commits since the last tag)'
        required: false
        default: 'auto'
        type: choice
        options: [auto, major, minor, patch]
      version:
        description: 'Exact version to release (e.g. 2.0.0) — overrides `bump` when set'
        required: false
        type: string
      dry_run:
        description: 'Preview only — no git/gh mutations'
        required: false
        default: false
        type: boolean
      resume:
        description: 'Resume a partially failed release (probes existing branch/PR/tag/Release, skips completed steps)'
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

# Write scope justified (road-to-ci-supply-chain-integrity 1.3, 2026-08-22):
#   contents: write      — the release job tags and publishes.
#   pull-requests: write — it closes / comments on the release PR.
#   actions: write       — it dispatches the follow-up workflow.
# The pull_request trigger is gated to `types: [closed]` (see the `on:` block
# above), so this never runs on an open fork PR's head. No
# pull_request_target in this tree, so even that path would be token-capped.
# This is the one block worth narrowing later; narrowing it means splitting
# the job, which is a change of shape rather than a permissions edit, and it
# is recorded here as a decision NOT taken rather than left unstated.
permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # PR path: only a MERGED pull_request carrying one of the exact release
    # labels — `contains(array, item)` against the labels array, never a
    # substring match on the joined names (a label like "prerelease-notes"
    # must NOT fire this). Dispatch path: always runs.
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && (contains(github.event.pull_request.labels.*.name, 'release') || contains(github.event.pull_request.labels.*.name, 'release:major') || contains(github.event.pull_request.labels.*.name, 'release:minor') || contains(github.event.pull_request.labels.*.name, 'release:patch')))
    env:
      GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Resolve release flags from the merged PR's labels
        id: flags
        # actionlint shellchecks only CHANGED workflow files, so this step's
        # pre-existing SC2129 (style: group the >> redirects) first surfaced
        # when the dependabot action bump touched this file. The individual
        # redirects are deliberate — one computed flag per line.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            bump="${{ inputs.bump }}"
            version="${{ inputs.version }}"
            dry_run="${{ inputs.dry_run }}"
            resume="${{ inputs.resume }}"
          else
            labels="${{ join(github.event.pull_request.labels.*.name, ',') }}"
            bump="auto"
            matched=0
            for candidate in major minor patch; do
              case ",$labels," in
                *",release:$candidate,"*)
                  bump="$candidate"
                  matched=$((matched + 1))
                  ;;
              esac
            done
            if [ "$matched" -gt 1 ]; then
              echo "::error::multiple release:* labels on this PR — pick exactly one bump override."
              exit 1
            fi
            version=""
            dry_run="false"
            resume="false"
          fi
          # shellcheck disable=SC2129
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          echo "resume=$resume" >> "$GITHUB_OUTPUT"

      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0
          fetch-tags: true
          token: ${{ env.GH_TOKEN }}

      - name: Configure git identity for the release bump commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node deps
        run: npm ci --no-audit --no-fund --prefer-offline

      # release.ts step [2/10] shells out to `task release-prepare`
      # (sync + build-discovery + generate-tools). Without this the CI-native
      # path dies with `spawnSync task ENOENT` — the local `task release`
      # path never hits this because task is on the maintainer's PATH.
      - name: Set up Task
        uses: ./.github/actions/setup-task
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run release pipeline (--ci)
        # --resume from a fresh `main` checkout inherits the same narrow
        # limitation `task release -- --resume` has when run from main
        # locally: it recovers a crash AFTER the release PR merged (main's
        # package.json already shows the bumped version — tag/Release
        # simply weren't finished) but not a crash BEFORE merge (an open,
        # unmerged release/X.Y.Z PR) — that case's stale branch/PR needs a
        # manual close or a local `task release -- --resume` after checking
        # out that branch. Not a new gap; this is unchanged from today.
        run: |
          args=(--ci --yes)
          if [ -n "${{ steps.flags.outputs.version }}" ]; then
            args+=(--version "${{ steps.flags.outputs.version }}")
          elif [ "${{ steps.flags.outputs.bump }}" != "auto" ]; then
            args+=(--as "${{ steps.flags.outputs.bump }}")
          fi
          if [ "${{ steps.flags.outputs.resume }}" = "true" ]; then
            args+=(--resume)
          fi
          if [ "${{ steps.flags.outputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
          fi
          ./scripts-run src/scripts/release "${args[@]}"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Release"
            echo
            if [ "${{ job.status }}" = "success" ]; then
              echo "✅  Pipeline finished — see the run log for the released version, or nothing-to-release."
            else
              echo "❌  Release pipeline failed — see logs. Re-run this workflow (workflow_dispatch) to resume;"
              echo "    src/scripts/release.ts's --ci steps are idempotent."
              echo
              echo "If the run is stuck waiting on PR checks: check whether the release PR is waiting on a"
              echo "maintainer clicking **Approve workflows to run** (GitHub's bot-created-PR safeguard)."
              echo "That safeguard is a repo/org Actions setting and does NOT apply everywhere — on 14.0.0"
              echo "it did not fire at all. If the checks are simply running, the run is not stuck."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
