name: Bench Drift

# Step-4 Phase 3 Step 3 — warn-only drift signal on PR.
# Runs `task bench` against tests/eval/corpus-dev.yaml, then
# `task bench:drift` against the rolling baseline. Posts a PR comment
# with the verdict. Never fails the job — drift is informational until
# `task bench:baseline-ready` returns 0 (60 days + ≥30 reports). At that
# point this workflow flips to a required check via a separate PR.

on:
  pull_request:
    paths:
      - "src/scripts/bench_run.ts"
      - "src/scripts/bench_drift_check.ts"
      - "src/scripts/bench_baseline_ready.ts"
      - "src/scripts/bench_runner.ts"
      - "src/scripts/_lib/bench_*.ts"
      - "tests/eval/**"
      - "internal/bench/**"
      - ".github/workflows/bench-drift.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench-drift:
    name: Bench drift (warn-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        # bench_drift_check / bench_baseline_ready / bench_run are now
        # TypeScript; the dispatcher runs them via tsx.
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node deps
        run: |
          npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000 \
            || (sleep 10 && npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000)

      - uses: ./.github/actions/setup-task
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run task bench (dev corpus)
        id: bench
        continue-on-error: true
        run: |
          task bench -- --corpus dev --quiet | tee /tmp/bench.out
          echo "headline=$(grep -E '^bench ' /tmp/bench.out | head -1)" >> "$GITHUB_OUTPUT"

      - name: Run drift detector (JSON)
        id: drift
        continue-on-error: true
        run: |
          ./scripts-run src/scripts/bench_drift_check --corpus dev --json \
            | tee /tmp/drift.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Run baseline-ready probe
        id: baseline
        continue-on-error: true
        run: |
          ./scripts-run src/scripts/bench_baseline_ready --json \
            | tee /tmp/baseline.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Render PR comment body
        id: render
        run: |
          node -e '
          const fs = require("node:fs");
          const readJson = (p) => {
            const raw = (fs.existsSync(p) ? fs.readFileSync(p, "utf8") : "").trim();
            try { return JSON.parse(raw || "{\"status\":\"unknown\"}"); }
            catch { return { status: "unknown" }; }
          };
          const drift = readJson("/tmp/drift.json");
          const base = readJson("/tmp/baseline.json");
          const benchLines = (fs.existsSync("/tmp/bench.out")
            ? fs.readFileSync("/tmp/bench.out", "utf8") : "").trim().split("\n").filter(Boolean);
          const headline = benchLines.length ? benchLines[0] : "(no bench output)";

          const statusEmoji = { ok: "✅", drift: "⚠️", warmup: "⏳", ready: "✅", error: "❌" };
          const de = statusEmoji[drift.status] || "❔";
          const be = statusEmoji[base.status] || "❔";

          const findings = drift.findings || [];
          const lines = [
            "## Bench drift — warn-only",
            "",
            `**Headline:** \`${headline}\``,
            "",
            `**Drift:** ${de} \`${drift.status ?? "unknown"}\` · ` +
              `latest=\`${drift.latest_report ?? "—"}\` · ` +
              `window=${drift.baseline_window ?? "—"} · ` +
              `findings=${findings.length}`,
          ];
          for (const f of findings) {
            lines.push(
              `- \`${f.axis}\`: latest=${Number(f.latest).toFixed(4)} ` +
                `baseline_mean=${Number(f.baseline_mean).toFixed(4)}`
            );
          }
          lines.push(
            "",
            `**Baseline:** ${be} \`${base.status ?? "unknown"}\` · ` +
              `days=${base.days_elapsed ?? "?"}/${base.min_days ?? "?"} · ` +
              `reports=${base.report_count ?? "?"}/${base.min_reports ?? "?"}`,
            "",
            "_Informational only — drift does not block this PR until " +
              "`task bench:baseline-ready` returns 0 " +
              "(step-4 Phase 3 Step 4)._"
          );
          fs.writeFileSync("/tmp/comment.md", lines.join("\n") + "\n");
          '

      - name: Post / update PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: bench-drift
          path: /tmp/comment.md

      - name: Job summary
        if: always()
        run: cat /tmp/comment.md >> "$GITHUB_STEP_SUMMARY"
