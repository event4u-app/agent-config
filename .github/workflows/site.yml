name: Site

# B4 — build the Starlight docs site and gate it on the internal-link checker.
# Astro `build` completes even with dangling internal links, so the build alone
# is not a link gate; check_site_links.ts scans the built dist for broken links.
#
# Path filter: this workflow fires on the site workspace, on the checker, and on
# ALL of `docs/**` — every path `site/sync-docs.mjs` reads lives there (the
# manifest pages, `docs/media/**`). It used to name only `site/**`, so a broken
# link in a synced doc was caught at deploy on `main` rather than on the pull
# request, and `docs/guides/works-with-agent-switch.md` was synced into the site
# while no filter named it at all (road-to-docs-that-sell 1.1;
# tests/scripts/site_workflow_paths.test.ts pins the coverage). `docs/**` rather
# than a page list, because the list is the manifest's to grow and a filter that
# trails it is the gap this closes.
on:
  pull_request:
    branches: [main, master]
    paths:
      - "site/**"
      - "docs/**"
      # The site prebuild also runs site/build-demo-map.mjs, which draws the
      # demo map with the root code-graph CLI over its fixtures.
      - "site/docs-manifest.json"
      - "src/scripts/code_graph/**"
      - "src/cli/help.ts"
      - "src/cli/registry.ts"
      - "tests/fixtures/code-graph/**"
      - "src/scripts/check_site_links.ts"
      - "tests/scripts/check_site_links.test.ts"
      - "tests/scripts/site_sync_docs.test.ts"
      - "tests/scripts/site_workflow_paths.test.ts"
      - ".github/workflows/site.yml"
  push:
    branches: [main, master]
    paths:
      - "site/**"
      - "docs/**"
      # The site prebuild also runs site/build-demo-map.mjs, which draws the
      # demo map with the root code-graph CLI over its fixtures.
      - "site/docs-manifest.json"
      - "src/scripts/code_graph/**"
      - "src/cli/help.ts"
      - "src/cli/registry.ts"
      - "tests/fixtures/code-graph/**"
      - "src/scripts/check_site_links.ts"
      - ".github/workflows/site.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          # Astro 7 / Starlight require Node >=22.12 (the site workspace);
          # the root project + tsx run fine on 22 too.
          node-version: '22'
          cache: 'npm'

      # Root deps provide node_modules/.bin/tsx for ./scripts-run.
      - name: Install root dependencies (tsx for scripts-run)
        run: npm ci --no-audit --no-fund --prefer-offline

      # Isolated site workspace (own package.json/lockfile) — astro + starlight.
      - name: Build the Starlight site
        run: |
          cd site
          npm ci --no-audit --no-fund --prefer-offline
          npm run build

      - name: Internal-link check (no dangling links in the built site)
        run: ./scripts-run src/scripts/check_site_links
