name: Site

# B4 — build the Starlight docs site and gate it on the internal-link checker.
# Astro `build` completes even with dangling internal links, so the build alone
# is not a link gate; check_site_links.ts scans the built dist for broken links.
#
# Path filter, and how it differs from its sibling `deploy-site.yml`: this
# workflow fires on the site workspace and on the checker itself. `deploy-site.yml`
# — which has published the site to GitHub Pages on every push to `main` since
# 2026-07-05 — additionally fires on the canonical docs that `site/sync-docs.mjs`
# projects into the site (`docs/proof.md`, `docs/benchmark.md`, `docs/CLAIMS.md`,
# `docs/catalog.md`, `docs/media/**`). That difference no longer lets a broken
# link ship: `deploy-site.yml`'s build job runs the same link check before its
# artifact is published. What it still costs is timing — a broken link in one
# of those docs is caught at deploy on `main`, not on the pull request.
on:
  pull_request:
    branches: [main, master]
    paths:
      - "site/**"
      - "src/scripts/check_site_links.ts"
      - "tests/scripts/check_site_links.test.ts"
      - ".github/workflows/site.yml"
  push:
    branches: [main, master]
    paths:
      - "site/**"
      - "src/scripts/check_site_links.ts"
      - ".github/workflows/site.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          # Astro 7 / Starlight require Node >=22.12 (the site workspace);
          # the root project + tsx run fine on 22 too.
          node-version: '22'
          cache: 'npm'

      # Root deps provide node_modules/.bin/tsx for ./scripts-run.
      - name: Install root dependencies (tsx for scripts-run)
        run: npm ci --no-audit --no-fund --prefer-offline

      # Isolated site workspace (own package.json/lockfile) — astro + starlight.
      - name: Build the Starlight site
        run: |
          cd site
          npm ci --no-audit --no-fund --prefer-offline
          npm run build

      - name: Internal-link check (no dangling links in the built site)
        run: ./scripts-run src/scripts/check_site_links
