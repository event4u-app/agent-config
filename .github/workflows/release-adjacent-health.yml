name: Release-Adjacent Health

# Daily tripwire for the "red for five releases without anyone noticing"
# failure mode (deploy-mcp-worker was red from 8.2.0 through 8.6.0 —
# post-tag workflows are nobody's PR, so nothing surfaced the streak).
#
# src/scripts/check_release_adjacent_health.ts inspects the most recent
# COMPLETED run of every release-adjacent workflow; any workflow whose
# last completed run is non-success and older than 48h with no newer
# success fails this job — a visible red on main with an error
# annotation naming the offender.
#
# Part of road-to-proof-under-real-conditions Phase 1; counterfactual
# mapping in docs/distribution/consumer-matrix.md.

on:
  schedule:
    - cron: '30 6 * * *' # daily 06:30 UTC
  workflow_dispatch:

# No `pull_request` trigger, so nothing here is ever cancelled: the daily health
# run is the only observation for that day, and `github.run_id` puts each run in
# a group of one so neither a queued nor a running observation can be evicted.
# A shared workflow+ref key would let a manual dispatch drop the day's pending
# scheduled run — GitHub evicts a *pending* group member whatever
# `cancel-in-progress` is set to.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read

jobs:
  health:
    name: Watch release-adjacent workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Check last completed run of each watched workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx src/scripts/check_release_adjacent_health.ts --max-red-hours 48
