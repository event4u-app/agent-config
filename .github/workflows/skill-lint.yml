name: Skill Lint

on:
  pull_request:
    paths:
      # Legacy source roots (pre-6.0 layout, packages/*/ trees).
      - ".agent-src.uncondensed/**"
      - ".augment/**"
      # 6.0.x flat-library source of truth + its condensed projection —
      # without these a content-only PR (src/skills, src/rules, …) never
      # triggered the lint gate or the regression report at all.
      - "src/skills/**"
      - "src/rules/**"
      - "src/agent-src/**"
      - "src/domains/**"
      - "dist/agent-src/**"
      - "docs/guidelines/**"
      - "src/scripts/skill_linter.ts"
      - "src/scripts/lint_regression.ts"
      - "tests/**"
      - "Taskfile.yml"
      - "taskfiles/**"
      - ".github/workflows/skill-lint.yml"
  push:
    branches:
      - main
    paths:
      - ".agent-src.uncondensed/**"
      - ".augment/**"
      - "src/skills/**"
      - "src/rules/**"
      - "src/agent-src/**"
      - "src/domains/**"
      - "dist/agent-src/**"
      - "docs/guidelines/**"
      - "src/scripts/skill_linter.ts"
      - "src/scripts/lint_regression.ts"
      - "tests/**"
      - "Taskfile.yml"
      - "taskfiles/**"
      - ".github/workflows/skill-lint.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


permissions:
  contents: read
  pull-requests: write

jobs:
  # Phase 4.4 (ADR-017): per-pack matrix gate. Each pack lints its own
  # `.agent-src.uncondensed/` tree in parallel; merge requires every
  # matrix shard green.
  skill-lint-per-pack:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pack:
          - core
          - pack-ai-video
          - pack-finance-advanced
          - pack-finance-basic
          - pack-founder-strategy
          - pack-gtm-marketing
          - pack-gtm-sales
          - pack-laravel
          - pack-nextjs
          - pack-ops-people
          - pack-php
          - pack-product-basic
          - pack-product-discovery
          - pack-python
          - pack-react
          - pack-symfony
          - pack-typescript
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node deps
        run: |
          # Retry once — the per-pack matrix fans out ~14 concurrent npm ci
          # calls; transient registry ECONNRESET would otherwise flake a job.
          npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000 \
            || (sleep 10 && npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000)

      - name: Set up Task
        uses: ./.github/actions/setup-task
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint pack ${{ matrix.pack }}
        run: task lint-pack PACK=${{ matrix.pack }}

  skill-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node deps
        run: |
          # Retry once — the per-pack matrix fans out ~14 concurrent npm ci
          # calls; transient registry ECONNRESET would otherwise flake a job.
          npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000 \
            || (sleep 10 && npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000)

      - name: Set up Task
        uses: ./.github/actions/setup-task
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run skill linter (changed files only)
        run: ./scripts-run src/scripts/skill_linter --changed

      - name: Validate command + rule tier/visibility frontmatter
        # These two lints are the sole CI enforcers that every command declares
        # a valid tier + visibility (ADR-090: presence, enum, tier/visibility
        # consistency) and every rule declares a valid tier. They are otherwise
        # only reachable via the local `task ci`/`ci-strict` meta-tasks, which
        # no workflow invokes — and validate_frontmatter treats these fields as
        # optional. Without this step a missing/invalid tier or visibility on a
        # newly-created rule or command would slip through CI. The
        # test_tier_visibility_ci_wired guard keeps this step from regressing.
        run: |
          task lint-command-tiers
          task lint-rule-tiers

      - name: Generate lint reports (full repo, informational)
        if: always()
        run: |
          mkdir -p artifacts
          ./scripts-run src/scripts/skill_linter --all --format json > artifacts/skill-lint-report.json || true
          ./scripts-run src/scripts/skill_linter --all --report > artifacts/skill-quality-report.md || true

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-lint-reports
          path: |
            artifacts/skill-lint-report.json
            artifacts/skill-quality-report.md

      - name: Generate PR summary
        if: github.event_name == 'pull_request' && always()
        run: |
          ./scripts-run src/scripts/skill_linter --changed --format json > /tmp/changed-lint.json 2>/dev/null || true
          node -e '
          const fs = require("node:fs");
          let data;
          try {
            data = JSON.parse(fs.readFileSync("/tmp/changed-lint.json", "utf8"));
          } catch {
            process.stdout.write("⚠️ Could not parse lint results.\n");
            process.exit(0);
          }
          const results = data.results || [];
          const summary = data.summary || {};
          const p = summary.pass || 0;
          const w = summary.warn || 0;
          const f = summary.fail || 0;
          const lines = ["## 🔍 Skill Lint Summary", ""];
          lines.push("| Pass | Warn | Fail | Total |");
          lines.push("|---|---|---|---|");
          lines.push(`| ${p} | ${w} | ${f} | ${p + w + f} |`);
          if (f > 0) {
            lines.push("", "<details>", "<summary>❌ Failures</summary>", "");
            for (const r of results) {
              for (const i of r.issues || []) {
                if (i.severity === "error") {
                  lines.push(`- \`${r.file}\`: ${i.message}`);
                }
              }
            }
            lines.push("", "</details>");
          }
          if (w > 0) {
            const warnFiles = results
              .filter((r) => (r.issues || []).some((i) => i.severity === "warning"))
              .map((r) => r.file);
            if (warnFiles.length) {
              lines.push("", "<details>", `<summary>⚠️ Warnings (${warnFiles.length} files)</summary>`, "");
              for (const wf of warnFiles.slice(0, 10)) {
                lines.push(`- \`${wf}\``);
              }
              if (warnFiles.length > 10) {
                lines.push(`- ... and ${warnFiles.length - 10} more`);
              }
              lines.push("", "</details>");
            }
          }
          if (f === 0 && w === 0) {
            lines.push("", "✅ All changed files pass cleanly.");
          }
          lines.push("", "---", "*Full report available as artifact.*");
          process.stdout.write(lines.join("\n") + "\n");
          ' > /tmp/pr-summary.md

      - name: Generate regression report
        if: github.event_name == 'pull_request' && always()
        run: |
          ./scripts-run src/scripts/lint_regression --baseline origin/main --format markdown > /tmp/regression-report.md 2>/dev/null || true
          if [ -f /tmp/pr-summary.md ] && [ -f /tmp/regression-report.md ]; then
            cat /tmp/pr-summary.md > /tmp/pr-comment.md
            echo "" >> /tmp/pr-comment.md
            cat /tmp/regression-report.md >> /tmp/pr-comment.md
          elif [ -f /tmp/pr-summary.md ]; then
            cp /tmp/pr-summary.md /tmp/pr-comment.md
          else
            echo "⚠️ Could not generate PR summary." > /tmp/pr-comment.md
          fi

      - name: Post PR comment
        if: github.event_name == 'pull_request' && always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: skill-lint-report
          path: /tmp/pr-comment.md

  skill-lint-strict:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node deps
        run: |
          # Retry once — the per-pack matrix fans out ~14 concurrent npm ci
          # calls; transient registry ECONNRESET would otherwise flake a job.
          npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000 \
            || (sleep 10 && npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000)

      - name: Set up Task
        uses: ./.github/actions/setup-task
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run skill linter (0 FAIL required)
        run: task lint-skills
