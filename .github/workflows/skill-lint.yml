name: Skill Lint

on:
  pull_request:
    paths:
      # Legacy source roots (pre-6.0 layout, packages/*/ trees).
      - ".agent-src.uncondensed/**"
      - ".augment/**"
      # 6.0.x flat-library source of truth + its condensed projection —
      # without these a content-only PR (src/skills, src/rules, …) never
      # triggered the lint gate or the regression report at all.
      - "src/skills/**"
      - "src/rules/**"
      - "src/agent-src/**"
      - "src/domains/**"
      - "dist/agent-src/**"
      - "docs/guidelines/**"
      - "src/scripts/skill_linter.ts"
      - "src/scripts/lint_regression.ts"
      - "src/scripts/lint_originality.ts"
      - "tests/**"
      - "Taskfile.yml"
      - "taskfiles/**"
      - ".github/workflows/skill-lint.yml"
  push:
    branches:
      - main
    paths:
      - ".agent-src.uncondensed/**"
      - ".augment/**"
      - "src/skills/**"
      - "src/rules/**"
      - "src/agent-src/**"
      - "src/domains/**"
      - "dist/agent-src/**"
      - "docs/guidelines/**"
      - "src/scripts/skill_linter.ts"
      - "src/scripts/lint_regression.ts"
      - "src/scripts/lint_originality.ts"
      - "tests/**"
      - "Taskfile.yml"
      - "taskfiles/**"
      - ".github/workflows/skill-lint.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


permissions:
  contents: read
  pull-requests: write

jobs:
  skill-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Tag span resolution (release PRs) needs the tags, not just the
          # commits — without this the widened scope resolves to nothing and
          # the gate goes blind again through a different door.
          fetch-tags: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node deps
        run: |
          # Retry once — the per-pack matrix fans out ~14 concurrent npm ci
          # calls; transient registry ECONNRESET would otherwise flake a job.
          npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000 \
            || (sleep 10 && npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000)

      - name: Set up Task
        uses: ./.github/actions/setup-task
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run skill linter (changed files only)
        run: ./scripts-run src/scripts/skill_linter --changed

      - name: Validate command + rule tier/visibility frontmatter
        # These two lints are the sole CI enforcers that every command declares
        # a valid tier + visibility (ADR-090: presence, enum, tier/visibility
        # consistency) and every rule declares a valid tier. They are otherwise
        # only reachable via the local `task ci`/`ci-strict` meta-tasks, which
        # no workflow invokes — and validate_frontmatter treats these fields as
        # optional. Without this step a missing/invalid tier or visibility on a
        # newly-created rule or command would slip through CI. The
        # test_tier_visibility_ci_wired guard keeps this step from regressing.
        run: |
          task lint-command-tiers
          task lint-rule-tiers

      - name: Run agent-security linters
        # lint-agent-security aggregates hidden-unicode, mixed-script-confusable,
        # instruction-smuggling, mcp-config-security, and dangerous-frontmatter
        # over src/ AND dist/agent-src/. It is otherwise only reachable via the
        # local `task ci`/`ci-strict` meta-tasks, which no workflow invokes — so a
        # smuggled instruction, hidden-Unicode payload, or over-broad MCP tool
        # grant that landed in a tracked artifact (source or projection) would
        # slip through CI. Blocking findings fail the build; warnings do not.
        run: task lint-agent-security

      - name: Generate lint reports (full repo, informational)
        if: always()
        run: |
          mkdir -p artifacts
          ./scripts-run src/scripts/skill_linter --all --format json > artifacts/skill-lint-report.json || true
          ./scripts-run src/scripts/skill_linter --all --report > artifacts/skill-quality-report.md || true

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: skill-lint-reports
          path: |
            artifacts/skill-lint-report.json
            artifacts/skill-quality-report.md

      - name: Generate PR summary
        if: github.event_name == 'pull_request' && always()
        run: |
          ./scripts-run src/scripts/skill_linter --changed --format json > /tmp/changed-lint.json 2>/dev/null || true
          # The single-quoted body below is JavaScript passed to `node -e`;
          # shell expansion inside it would be a bug, not the fix SC2016
          # suggests. The directive has to sit on the command it covers.
          # shellcheck disable=SC2016
          node -e '
          const fs = require("node:fs");
          let data;
          try {
            data = JSON.parse(fs.readFileSync("/tmp/changed-lint.json", "utf8"));
          } catch {
            process.stdout.write("⚠️ Could not parse lint results.\n");
            process.exit(0);
          }
          const results = data.results || [];
          const summary = data.summary || {};
          const p = summary.pass || 0;
          const w = summary.pass_with_warnings || 0;
          const f = summary.fail || 0;
          const total = summary.total != null ? summary.total : p + w + f;
          const lines = ["## 🔍 Skill Lint Summary", ""];
          lines.push("| Pass | Warn | Fail | Total |");
          lines.push("|---|---|---|---|");
          lines.push(`| ${p} | ${w} | ${f} | ${total} |`);
          if (f > 0) {
            lines.push("", "<details>", "<summary>❌ Failures</summary>", "");
            for (const r of results) {
              for (const i of r.issues || []) {
                if (i.severity === "error") {
                  lines.push(`- \`${r.file}\`: ${i.message}`);
                }
              }
            }
            lines.push("", "</details>");
          }
          if (w > 0) {
            const warnFiles = results
              .filter((r) => (r.issues || []).some((i) => i.severity === "warning"))
              .map((r) => r.file);
            if (warnFiles.length) {
              lines.push("", "<details>", `<summary>⚠️ Warnings (${warnFiles.length} files)</summary>`, "");
              for (const wf of warnFiles.slice(0, 10)) {
                lines.push(`- \`${wf}\``);
              }
              if (warnFiles.length > 10) {
                lines.push(`- ... and ${warnFiles.length - 10} more`);
              }
              lines.push("", "</details>");
            }
          }
          if (total === 0) {
            lines.push("", "⚠️ INCONCLUSIVE — 0 changed skill files were checked; this is not a pass.");
          } else if (f === 0 && w === 0) {
            lines.push("", "✅ All changed files pass cleanly.");
          }
          lines.push("", "---", "*Full report available as artifact.*");
          process.stdout.write(lines.join("\n") + "\n");
          ' > /tmp/pr-summary.md

      - name: Generate regression report
        if: github.event_name == 'pull_request' && always()
        run: |
          ./scripts-run src/scripts/lint_regression --baseline origin/main --format markdown > /tmp/regression-report.md 2>/dev/null || true
          if [ -f /tmp/pr-summary.md ] && [ -f /tmp/regression-report.md ]; then
            cat /tmp/pr-summary.md > /tmp/pr-comment.md
            echo "" >> /tmp/pr-comment.md
            cat /tmp/regression-report.md >> /tmp/pr-comment.md
          elif [ -f /tmp/pr-summary.md ]; then
            cp /tmp/pr-summary.md /tmp/pr-comment.md
          else
            echo "⚠️ Could not generate PR summary." > /tmp/pr-comment.md
          fi

      - name: Post PR comment
        if: github.event_name == 'pull_request' && always()
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: skill-lint-report
          path: /tmp/pr-comment.md

  originality-gate:
    # Anti-reskin PR gate — the adversarial enforcement path. Only the
    # `--changed` mode carries the batch-masking guard: the DF-boilerplate set
    # is computed from the corpus MINUS the change set, so a batch of
    # near-identical re-skins submitted together cannot classify its own shared
    # shingles as scaffold and mutually score 0 (src/scripts/lint_originality.ts
    # § "adversarial batch masking"). The full-audit sweep in `task ci`
    # structurally lacks that guard — this job, not the sweep, is the defense.
    # Regression lock: tests/scripts/lint_originality.test.ts ("adversarial
    # batch masking is closed" — 7 identical copies above the DF floor must
    # exit 1) runs in tests.yml → Node Tests, so unwiring the guard in the
    # script fails CI there before this job could silently go green.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Tag span resolution (release PRs) needs the tags, not just the
          # commits — without this the widened scope resolves to nothing and
          # the gate goes blind again through a different door.
          fetch-tags: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node deps
        run: |
          # Retry once — the per-pack matrix fans out ~14 concurrent npm ci
          # calls; transient registry ECONNRESET would otherwise flake a job.
          npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000 \
            || (sleep 10 && npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000)

      - name: Run originality gate on changed corpus files
        run: |
          # Corpus classes — must mirror CLASSES in src/scripts/lint_originality.ts:
          #   skills    src/skills/*/SKILL.md
          #   personas  src/agent-src/personas/*.md (top-level, non-underscore)
          #   commands  src/domains/**/command.md
          git fetch --no-tags origin "${{ github.base_ref }}"
          # Release-aware: on a release PR the base widens to the previous
          # release tag, because the PR's own diff is the version bump.
          BASE="$(./scripts-run src/scripts/resolve_lint_scope --base-ref "origin/${{ github.base_ref }}")"
          # The diff must run cleanly — a missing tag object or bad ref would
          # otherwise be swallowed into an empty change set and be
          # indistinguishable from a genuinely empty span.
          if ! DIFF_OUT=$(git diff --name-only --diff-filter=ACMR "${BASE}...HEAD" -- \
            'src/skills/*/SKILL.md' \
            'src/agent-src/personas/*.md' \
            'src/domains/**/command.md'); then
            echo "::error::git diff for ${BASE}...HEAD failed — the scope is unresolvable, not empty."
            exit 1
          fi
          CHANGED=$(printf '%s\n' "$DIFF_OUT" | grep -v '^src/agent-src/personas/_' || true)
          if [ -z "$CHANGED" ]; then
            # Same guard shape as the skill-lint PR summary: an empty changed
            # set means the gate checked nothing — report it, never claim a pass.
            echo "⚠️ INCONCLUSIVE — 0 changed corpus files (skills / personas / domain commands); the originality gate checked nothing. This is not a pass."
            # On a release PR the scope resolved to a whole tag span. Matching
            # nothing there is EITHER a blind gate (the shape that shipped a
            # 179-commit release unchecked — dead pathspec, empty span) OR a
            # release that genuinely changes no corpus file (scripts-/docs-only
            # release). Discriminate instead of failing both: the pathspecs
            # must still resolve to tracked files at HEAD (a moved corpus root
            # fails this probe exactly as it would blind the diff), and the
            # span must contain real commits.
            if [ "${BASE}" != "origin/${{ github.base_ref }}" ]; then
              LIVE=$(git ls-files -- \
                'src/skills/*/SKILL.md' \
                'src/agent-src/personas/*.md' \
                'src/domains/**/command.md' \
                | grep -cv '^src/agent-src/personas/_' || true)
              SPAN=$(git rev-list --count "${BASE}..HEAD")
              if [ "${LIVE}" -gt 0 ] && [ "${SPAN}" -gt 0 ]; then
                echo "✅ Verified-empty release scope: ${SPAN} commit(s) in ${BASE}...HEAD touch none of the ${LIVE} tracked corpus files — the pathspecs are alive at HEAD, so the gate is not blind; this release genuinely contains no corpus changes."
                exit 0
              fi
              echo "::error::Release PR resolved scope ${BASE}...HEAD and matched 0 corpus files while the corpus pathspecs resolve to ${LIVE} tracked file(s) and the span holds ${SPAN} commit(s) — the scope is dead, not empty."
              exit 1
            fi
            exit 0
          fi
          echo "Changed corpus files under review:"
          while IFS= read -r f; do
            [ -n "$f" ] && printf '  · %s\n' "$f"
          done <<< "$CHANGED"
          # shellcheck disable=SC2086
          ./scripts-run src/scripts/lint_originality --changed $CHANGED

  skill-lint-strict:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node deps
        run: |
          # Retry once — the per-pack matrix fans out ~14 concurrent npm ci
          # calls; transient registry ECONNRESET would otherwise flake a job.
          npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000 \
            || (sleep 10 && npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000)

      - name: Set up Task
        uses: ./.github/actions/setup-task
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run skill linter (0 FAIL required)
        run: task lint-skills
