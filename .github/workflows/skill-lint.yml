name: Skill Lint

on:
  pull_request:
    paths:
      # Legacy source roots (pre-6.0 layout, packages/*/ trees).
      - ".agent-src.uncondensed/**"
      - ".augment/**"
      # 6.0.x flat-library source of truth + its condensed projection —
      # without these a content-only PR (src/skills, src/rules, …) never
      # triggered the lint gate or the regression report at all.
      - "src/skills/**"
      - "src/rules/**"
      - "src/agent-src/**"
      - "src/domains/**"
      - "dist/agent-src/**"
      - "docs/guidelines/**"
      - "src/scripts/skill_linter.py"
      - "src/scripts/lint_regression.py"
      - "tests/**"
      - "Taskfile.yml"
      - "taskfiles/**"
      - ".github/workflows/skill-lint.yml"
  push:
    branches:
      - main
    paths:
      - ".agent-src.uncondensed/**"
      - ".augment/**"
      - "src/skills/**"
      - "src/rules/**"
      - "src/agent-src/**"
      - "src/domains/**"
      - "dist/agent-src/**"
      - "docs/guidelines/**"
      - "src/scripts/skill_linter.py"
      - "src/scripts/lint_regression.py"
      - "tests/**"
      - "Taskfile.yml"
      - "taskfiles/**"
      - ".github/workflows/skill-lint.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


permissions:
  contents: read
  pull-requests: write

jobs:
  # Phase 4.4 (ADR-017): per-pack matrix gate. Each pack lints its own
  # `.agent-src.uncondensed/` tree in parallel; merge requires every
  # matrix shard green.
  skill-lint-per-pack:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pack:
          - core
          - pack-ai-video
          - pack-finance-advanced
          - pack-finance-basic
          - pack-founder-strategy
          - pack-gtm-marketing
          - pack-gtm-sales
          - pack-laravel
          - pack-nextjs
          - pack-ops-people
          - pack-php
          - pack-product-basic
          - pack-product-discovery
          - pack-python
          - pack-react
          - pack-symfony
          - pack-typescript
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node deps
        run: |
          # Retry once — the per-pack matrix fans out ~14 concurrent npm ci
          # calls; transient registry ECONNRESET would otherwise flake a job.
          npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000 \
            || (sleep 10 && npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000)

      - name: Set up Task
        uses: ./.github/actions/setup-task
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint pack ${{ matrix.pack }}
        run: task lint-pack PACK=${{ matrix.pack }}

  skill-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node deps
        run: |
          # Retry once — the per-pack matrix fans out ~14 concurrent npm ci
          # calls; transient registry ECONNRESET would otherwise flake a job.
          npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000 \
            || (sleep 10 && npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000)

      - name: Set up Task
        uses: ./.github/actions/setup-task
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run skill linter (changed files only)
        run: ./scripts-run src/scripts/skill_linter --changed

      - name: Generate lint reports (full repo, informational)
        if: always()
        run: |
          mkdir -p artifacts
          ./scripts-run src/scripts/skill_linter --all --format json > artifacts/skill-lint-report.json || true
          ./scripts-run src/scripts/skill_linter --all --report > artifacts/skill-quality-report.md || true

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-lint-reports
          path: |
            artifacts/skill-lint-report.json
            artifacts/skill-quality-report.md

      - name: Generate PR summary
        if: github.event_name == 'pull_request' && always()
        run: |
          ./scripts-run src/scripts/skill_linter --changed --format json > /tmp/changed-lint.json 2>/dev/null || true
          python3 -c "
          import json, sys
          try:
              data = json.load(open('/tmp/changed-lint.json'))
          except Exception:
              print('⚠️ Could not parse lint results.'); sys.exit(0)
          results = data.get('results', [])
          summary = data.get('summary', {})
          p = summary.get('pass', 0)
          w = summary.get('warn', 0)
          f = summary.get('fail', 0)
          lines = ['## 🔍 Skill Lint Summary', '']
          lines.append(f'| Pass | Warn | Fail | Total |')
          lines.append(f'|---|---|---|---|')
          lines.append(f'| {p} | {w} | {f} | {p+w+f} |')
          if f > 0:
              lines.extend(['', '<details>', '<summary>❌ Failures</summary>', ''])
              for r in results:
                  for i in r.get('issues', []):
                      if i.get('severity') == 'error':
                          lines.append(f'- \`{r[\"file\"]}\`: {i[\"message\"]}')
              lines.extend(['', '</details>'])
          if w > 0:
              warn_files = [r['file'] for r in results if any(i.get('severity') == 'warning' for i in r.get('issues', []))]
              if warn_files:
                  lines.extend(['', '<details>', '<summary>⚠️ Warnings ({} files)</summary>'.format(len(warn_files)), ''])
                  for wf in warn_files[:10]:
                      lines.append(f'- \`{wf}\`')
                  if len(warn_files) > 10:
                      lines.append(f'- ... and {len(warn_files) - 10} more')
                  lines.extend(['', '</details>'])
          if f == 0 and w == 0:
              lines.extend(['', '✅ All changed files pass cleanly.'])
          lines.extend(['', '---', '*Full report available as artifact.*'])
          print('\n'.join(lines))
          " > /tmp/pr-summary.md

      - name: Generate regression report
        if: github.event_name == 'pull_request' && always()
        run: |
          ./scripts-run src/scripts/lint_regression --baseline origin/main --format markdown > /tmp/regression-report.md 2>/dev/null || true
          if [ -f /tmp/pr-summary.md ] && [ -f /tmp/regression-report.md ]; then
            cat /tmp/pr-summary.md > /tmp/pr-comment.md
            echo "" >> /tmp/pr-comment.md
            cat /tmp/regression-report.md >> /tmp/pr-comment.md
          elif [ -f /tmp/pr-summary.md ]; then
            cp /tmp/pr-summary.md /tmp/pr-comment.md
          else
            echo "⚠️ Could not generate PR summary." > /tmp/pr-comment.md
          fi

      - name: Post PR comment
        if: github.event_name == 'pull_request' && always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: skill-lint-report
          path: /tmp/pr-comment.md

  skill-lint-strict:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node deps
        run: |
          # Retry once — the per-pack matrix fans out ~14 concurrent npm ci
          # calls; transient registry ECONNRESET would otherwise flake a job.
          npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000 \
            || (sleep 10 && npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000)

      - name: Set up Task
        uses: ./.github/actions/setup-task
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run skill linter (0 FAIL required)
        run: task lint-skills
