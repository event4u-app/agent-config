name: Windows Lockfile + Export

# Phase 1.7 of road-to-global-first-install — guards the global-install
# lockfile lifecycle and `agent-config export` on Windows. Extracted from
# tests.yml in road-to-optimized-ci-and-release-gates Phase C Step 1 so
# the Windows leg only fires when the narrow surface it covers actually
# changes (was previously running on every PR touching scripts/**).
#
# Scope: two test modules — tests/test_installed_lock.py and
# tests/test_cmd_export.py. The wider Python suite exercises POSIX-only
# symlink paths that don't apply on Windows (ADR-007 D5).

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'scripts/install_global*.py'
      - 'scripts/cmd_export.py'
      - 'tests/test_installed_lock.py'
      - 'tests/test_cmd_export.py'
      - '.github/workflows/windows-lockfile-export.yml'
  push:
    branches: [main, master]
    paths:
      - 'scripts/install_global*.py'
      - 'scripts/cmd_export.py'
      - 'tests/test_installed_lock.py'
      - 'tests/test_cmd_export.py'
      - '.github/workflows/windows-lockfile-export.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-lockfile-export:
    # Release-PR skip per docs/contracts/release-pr-gating.md — release
    # PRs don't touch the install_global / cmd_export surface.
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release/') }}
    name: Windows lockfile + export tests
    runs-on: windows-latest
    # PYTHONIOENCODING forces stdout/stderr to UTF-8 so the ✅/❌ markers
    # compress.py prints survive Windows' default cp1252 encoding
    # (otherwise the bootstrap step crashes with UnicodeEncodeError on
    # '✅').
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install test deps
        run: pip install pytest pyyaml

      - name: Bootstrap generated projection (.augment/, .cursor/, …)
        # install_global content tests need the projected `.augment/` etc.
        # trees, which are git-ignored and rebuilt from `.agent-src/` by
        # sync.
        run: python scripts/compress.py --sync

      - name: Run lockfile + export tests
        run: python -m pytest tests/test_installed_lock.py tests/test_cmd_export.py -v
