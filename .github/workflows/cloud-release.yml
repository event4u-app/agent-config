name: Cloud Release

# On every pushed version tag, build the cloud-distribution artefacts
# (Claude.ai Web Skill ZIPs + Linear AI digest) and attach them to the
# GitHub Release. Tags are created by `scripts/release.py` (invoked via
# `task release`) — this workflow is purely additive: it does not tag,
# does not bump, does not publish to package registries.
#
# Companion to publish-npm.yml. Both run on the same tag triggers; this
# one targets cloud / hosted-agent surfaces (Claude.ai Web, Linear AI),
# publish-npm.yml targets the npm registry path.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build cloud bundles for (e.g. 1.10.0). Used only when the workflow file was missing at tag-push time.'
        required: true
        type: string

concurrency:
  group: cloud-release-${{ github.ref }}
  cancel-in-progress: false


permissions:
  contents: write  # required to attach artefacts to the GitHub Release

jobs:
  build-cloud-artefacts:
    name: Build & publish cloud artefacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Node
        # build_cloud_bundle is now TypeScript; the dispatcher runs it via tsx.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node deps
        run: |
          npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000 \
            || (sleep 10 && npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=10000)

      - name: Resolve tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Claude.ai Web cloud bundles (dist/cloud/*.zip)
        run: |
          ./scripts-run src/scripts/build_cloud_bundle --all --clean
          echo "=== bundle inventory ==="
          ls -la dist/cloud/
          count=$(find dist/cloud -name '*.zip' | wc -l | tr -d ' ')
          echo "cloud_bundle_count=$count" >> "$GITHUB_ENV"
          if [ "$count" = "0" ]; then
            echo "::error::no cloud bundles produced — build_cloud_bundle emitted zero ZIPs"
            exit 1
          fi

      - name: Build Linear AI digest (dist/linear/*.md)
        run: |
          ./scripts-run src/scripts/build_linear_digest --strict-missing
          echo "=== digest inventory ==="
          ls -la dist/linear/
          for layer in workspace team personal; do
            f="dist/linear/${layer}.md"
            if [ ! -f "$f" ]; then
              echo "::error::missing Linear digest layer: $f"
              exit 1
            fi
          done

      - name: Stage release artefacts
        run: |
          mkdir -p artefacts
          # Cloud bundles: keep one ZIP per skill, plus a combined tarball
          # for users who want everything in one shot.
          cp dist/cloud/*.zip artefacts/
          tar -czf "artefacts/cloud-bundles-${{ steps.tag.outputs.name }}.tar.gz" -C dist/cloud .
          # Linear digest: ship the three layers as-is plus a combined
          # tarball mirror of the cloud layout.
          cp dist/linear/*.md artefacts/
          tar -czf "artefacts/linear-digest-${{ steps.tag.outputs.name }}.tar.gz" -C dist/linear .
          echo "=== final artefact set ==="
          ls -la artefacts/

      - name: Upload as workflow artefact (debugging fallback)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: cloud-release-${{ steps.tag.outputs.name }}
          path: artefacts/
          retention-days: 30

      - name: Attach artefacts to GitHub Release
        # ~306 assets, one content-creating request each, sit near GitHub's
        # secondary rate limit (~80/min): 17.2.0 tripped it, and a re-run was
        # worse, because overwrite-on-upload deletes every asset before
        # re-uploading it. So: skip an asset already attached at the same size
        # (a re-run, or the release.yml --ci dispatch racing the tag push,
        # then costs one listing), pace uploads under the per-minute budget,
        # and back off when the limit fires anyway.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          # The tag push starts this workflow; release.ts creates the Release
          # one step later, so wait for it rather than create a competing one.
          for i in $(seq 1 30); do
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break
            [ "$i" = 30 ] && { echo "::error::release $TAG never appeared"; exit 1; }
            sleep 20
          done
          declare -A have
          while IFS=$'\t' read -r name size; do
            [ -n "$name" ] && have["$name"]="$size"
          done < <(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[] | select(.state == "uploaded") | "\(.name)\t\(.size)"')
          uploaded=0 skipped=0
          for f in artefacts/*; do
            name="$(basename "$f")"
            if [ "${have[$name]:-}" = "$(stat -c %s "$f")" ]; then
              skipped=$((skipped + 1)); continue
            fi
            for attempt in 1 2 3 4 5 6; do
              if out="$(gh release upload "$TAG" "$f" --clobber --repo "$GITHUB_REPOSITORY" 2>&1)"; then
                break
              fi
              if [ "$attempt" = 6 ] || ! grep -qi 'rate limit' <<<"$out"; then
                echo "::error::upload of $name failed: $out"; exit 1
              fi
              echo "rate limited on $name (attempt $attempt) — waiting $((attempt * 60)) s"
              sleep $((attempt * 60))
            done
            uploaded=$((uploaded + 1))
            sleep 1
          done
          echo "attached $uploaded asset(s), $skipped already present at the same size"
