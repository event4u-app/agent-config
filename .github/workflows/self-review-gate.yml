name: Self-review gate

# road-to-maintainer-bus-factor Phase 1 — the package reviews its own PRs with
# the exact machinery it sells (`adversarial-review` + `agent-security-review`).
#
# ADVISORY + INERT-WITHOUT-SECRET (mirrors cross-model-canary.yml):
#   - gate (every PR): DRY-RUN only — no API, no spend, no secret. Validates the
#     harness + prints the review plan. Never blocks.
#   - live-advisory (PR, when ANTHROPIC_API_KEY is set): runs the real dogfooded
#     review and posts findings as a PR comment. ADVISORY — records what WOULD
#     block; never fails the check. No key → logged no-op, never a failure.
#
# To make it REQUIRED (block on security/claim × high+ findings): add the
# ANTHROPIC_API_KEY repo secret, pass `--enforce` in the live job, and require
# this check in branch protection. That flip is the maintainer's act (blocker
# `self-review-gate-cost`); shipped advisory until then.

on:
  pull_request:
  workflow_dispatch: {}

# Two PR jobs stack on every push to a branch; superseded runs cancel. A
# manually dispatched run is never cancelled — someone is waiting on it, and
# that is enforced by the group KEY (`github.run_id` puts each dispatch in a
# group of one), not by `cancel-in-progress`, which does not protect a run
# still sitting in the queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Write scope justified (road-to-ci-supply-chain-integrity 1.3, 2026-08-22):
#   pull-requests: write — the gate posts its verdict onto the PR. No
#   pull_request_target in this tree, so a fork PR is capped read-only.
#
# `contents: read` is the floor and no job raises it. The two jobs that built
# and committed a findings ledger onto release branches were removed on
# 2026-10-22: a release waits for no review ledger, because everything on main
# is already reviewed and merged (owner). The review itself stays advisory.
#
# Every job that reaches this run's artifacts also re-declares `actions: read`,
# because a job-level block REPLACES this map instead of extending it — a read
# scope is not inherited from here.
permissions:
  contents: read
  pull-requests: write

jobs:
  gate-dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund --prefer-offline
      - name: Self-review plan (dry-run — no spend, advisory)
        run: ./node_modules/.bin/tsx src/scripts/self_review_gate.ts --dry-run --base "origin/${{ github.base_ref }}"

  live-advisory:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # THE RELEASE REVIEW RUNS ONCE, AT THE CUT — and this step is what makes
      # that true. A `release/*` branch cannot carry reviewable code:
      # `check_release_pr_shape` admits only the version-bump allowlist plus the
      # ledger below, so a second review there re-reads an unchanged diff. What
      # it returns is not new defects but new OPINIONS, and `ingest` appends
      # them. Dispositions can only be recorded by a commit, and a commit is a
      # push, and a push starts another review — a loop with no exit state.
      #
      # MEASURED on `release/16.0.0`, 2026-09-12. `e0b3cf114` (the cut's own
      # ingest) carried 39 findings; nine blocking ones were adjudicated and
      # pushed as `860fb819d`, which turned the gate green; that push triggered
      # a second review and `51df554ba` landed the same ledger at 74 findings
      # with 13 fresh blockers. One adjudication cycle, +35 findings, no
      # convergence.
      #
      # `workflow_dispatch` deliberately BYPASSES this: a maintainer asking for
      # a re-review by hand is asking on purpose and gets one.
      - name: Has this release already been reviewed?
        id: ledger
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          reviewed=false
          case "$HEAD_REF" in
            release/*)
              ledger="agents/evidence/release-findings/${HEAD_REF#release/}.json"
              if [ -f "$ledger" ] && python3 -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1])).get("findings") else 1)' "$ledger"; then
                reviewed=true
                echo "::notice::$ledger already carries findings — the release review ran at the cut. Not re-reviewing an unchanged diff; use workflow_dispatch to force one."
              fi
              ;;
          esac
          echo "reviewed=$reviewed" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        if: steps.ledger.outputs.reviewed != 'true'
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund --prefer-offline
        if: steps.ledger.outputs.reviewed != 'true'
      # CLI-first, like every other review and coding surface in this suite: the
      # script tries the vendor CLI (subscription, no balance to exhaust) before
      # ANTHROPIC_API_KEY (metered). A hosted runner has no vendor CLI on PATH,
      # so THIS job always takes the API path — the ordering buys local and
      # self-hosted runs a review that cannot be stopped by an empty balance,
      # which is exactly how 16.3.0 stalled. NEUTRAL now needs BOTH absent.
      - name: Dogfooded self-review (advisory; CLI-first, falls back to ANTHROPIC_API_KEY)
        if: steps.ledger.outputs.reviewed != 'true'
        run: ./node_modules/.bin/tsx src/scripts/self_review_gate.ts --base "origin/${{ github.base_ref }}" --findings-out /tmp/self-review-findings.json

      # Findings carry stable ids, and the artifact is the record. Nothing
      # ingests it automatically: a release waits for no review ledger since
      # 2026-10-22 (owner), so this job is advisory on every branch.
      - name: Upload findings artifact (input for a manual `check_finding_dispositions --ingest`)
        # hashFiles() only sees GITHUB_WORKSPACE — gate on the file directly
        # and let a missing file (NEUTRAL run, no findings) be a clean no-op.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: self-review-findings
          path: /tmp/self-review-findings.json
          retention-days: 30
          if-no-files-found: ignore
