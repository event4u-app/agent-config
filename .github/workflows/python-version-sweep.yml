name: Python Version Sweep

# Path-filtered sweep across the non-baseline Python versions
# (3.10 · 3.11 · 3.13). Baseline (3.12) runs in tests.yml on every PR
# touching scripts/** or tests/**; this workflow proves the supported
# range on PRs that actually touch Python paths.
#
# Extracted from tests.yml in road-to-optimized-ci-and-release-gates
# Phase C Step 2. The initial path filter intentionally stays wide
# (scripts/**, tests/**) to match the parent workflow's contract; a
# follow-up will tighten to `scripts/runtime_dispatcher.py` +
# `scripts/check_*.py` once a measured-safe baseline is captured.
#
# Minimum supported version is Python 3.10 (per AGENTS.md). Drop a
# version from the matrix only after it leaves the supported range.

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'src/scripts/**'
      - 'tests/**'
      - 'package-lock.json'
      - 'pyproject.toml'
      - '.github/workflows/python-version-sweep.yml'
  push:
    branches: [main, master]
    paths:
      - 'src/scripts/**'
      - 'tests/**'
      - 'package-lock.json'
      - 'pyproject.toml'
      - '.github/workflows/python-version-sweep.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-version-sweep:
    # Release-PR skip per docs/contracts/release-pr-gating.md.
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release/') }}
    name: Python Tests (ubuntu-latest, ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install test deps
        # Matches the tests.yml python-tests job — same deps so any
        # version-specific regression surfaces here too.
        run: pip install pytest pytest-xdist pyyaml jsonschema

      - name: Bootstrap generated projection (.augment/, .cursor/, …)
        # install_global content tests need the projected `.augment/`
        # etc. trees, which are git-ignored and rebuilt from
        # `dist/agent-src/` by sync.
        run: python3 src/scripts/condense.py --sync

      - name: Run Python tests
        # Same scope as tests.yml; we deliberately do NOT split scope
        # across the version legs — a regression on 3.10 that 3.12
        # doesn't show is exactly the failure mode this sweep exists
        # to catch.
        run: python3 -m pytest tests/ -n auto -q
