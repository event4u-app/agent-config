name: Self-repair report
description: >-
  A defect in the agent's own behaviour, recorded by the agent-config
  self-repair loop. Reports from independent installs cluster by fingerprint —
  search for yours before filing.
title: 'fix(self-repair): <defect class> — <N>x observed'
labels:
  - self-repair
body:
  - type: markdown
    attributes:
      value: >-
        The fields below mirror the body `agent-config self-repair:release`
        sends, so a released report round-trips through this form without
        rewriting. Closed fields only: the evidence span, the suggested surface,
        the mechanism and the falsifier stay on the reporting machine — no
        transcript text, project paths, prompts, or file contents.
  - type: dropdown
    id: defect_class
    attributes:
      label: Defect class
      description: One class = one detector (`DefectClass` in `src/scripts/_lib/self_repair.ts`).
      options:
        - user-reported
        - council-availability-claim
        - language-mirror
        - model-noticed
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Source
      description: How the defect was found (`DefectSource` in `src/scripts/_lib/self_repair.ts`).
      options:
        - user-reported
        - self-detected
        - model-noticed
    validations:
      required: true
  - type: input
    id: fingerprint
    attributes:
      label: Fingerprint
      description: >-
        From `agent-config self-repair:status` — the shape-normalized record id
        that lets independent installs cluster without telemetry.
      placeholder: 3f9a1c2b4d5e6f70
    validations:
      required: true
  - type: input
    id: occurrences
    attributes:
      label: Occurrence count
      description: How often this fingerprint was observed on this install.
      placeholder: '3'
    validations:
      required: true
  - type: input
    id: targets
    attributes:
      label: Targets
      description: >-
        The resolved `<kind>:<id>` targets from the record (rule, skill,
        command, hook), comma-separated — or `none identified`.
      placeholder: rule:verify-before-complete
    validations:
      required: true
  - type: input
    id: principle
    attributes:
      label: Principle
      description: >-
        The canonical claim as a lowercase slug (`drain/baseline-drift`), or
        `not stated` when the record carries none.
      placeholder: not stated
    validations:
      required: true
