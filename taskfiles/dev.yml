version: '3'

# Local dev workflow — run the working tree as if it were a release,
# without going through `task release` + npm publish. See
# docs/development.md → "Local dev install (no release)" for the full
# story (consumer-side `npm link @event4u/agent-config` lives there).

tasks:
  dev:install-global:
    desc: |
      Refresh the user-scope install (~/.claude/, ~/.cursor/, ~/.augment/, …)
      from this working tree. Routes through the v4 TypeScript install
      engine (`agent-config install`) so the local install path matches
      what consumers see. v3 used `python3 src/scripts/install.py`; the
      legacy script was renamed to `bin/install.legacy.py.bak` in v4
      (road-to-unified-setup § D1) and is no longer invoked.
      Usage:
      task dev:install-global
    cmds:
      - npm run build
      - node dist/cli/agent-config.js install --allow-headless

  dev:link:
    desc: |
      Symlink this working tree as the global @event4u/agent-config
      package via `npm link`. After this the `agent-config` bin on PATH
      resolves into this repo. Consumer projects opt in with
      `npm link @event4u/agent-config` (see docs/development.md).
      Usage:
      task dev:link
    cmds:
      - npm link
      - 'echo "→ global bin \"agent-config\" now points at $(pwd)"'
      - 'echo "→ in a consumer project: npm link @event4u/agent-config"'

  dev:unlink:
    desc: |
      Remove the global symlink created by `task dev:link`. After this
      the `agent-config` bin resolves to whatever is published on the
      registry (or is unavailable if no global install exists).
      Usage:
      task dev:unlink
    cmd: npm unlink -g @event4u/agent-config

  dev:setup:
    desc: |
      Run the onboarding wizard (`agent-config setup`) from this working
      tree. Builds CLI + UI first so the local server has a fresh bundle
      under dist/ui/. Lands the browser on `#/wizard`.
      Usage:
      task dev:setup
    cmds:
      - npm run build
      - node dist/cli/agent-config.js setup

  dev:setup:dry-run:
    desc: |
      Run the onboarding wizard with all writes suppressed
      (`agent-config setup --dry-run`). The wizard renders end-to-end
      but no .agent-settings.yml / .agent-user.md / wizard-state.json
      is touched on disk. Useful for smoke-testing the flow inside
      this package without leaving artefacts behind.
      Usage:
      task dev:setup:dry-run
    cmds:
      - npm run build
      - node dist/cli/agent-config.js setup --dry-run

  dev:install:gui:
    desc: |
      Boot the v4 unified install wizard (`agent-config install`)
      against the working tree. Replaces the v3 `packages/core/installer`
      CLI which was removed in road-to-unified-setup § D1.
      Usage:
      task dev:install:gui
    cmds:
      - npm run build
      - node dist/cli/agent-config.js install

  dev:install:gui:dry-run:
    desc: |
      Boot the v4 install wizard in dry-run mode (`agent-config install
      --dry-run`). No filesystem writes occur.
      Usage:
      task dev:install:gui:dry-run
    cmds:
      - npm run build
      - node dist/cli/agent-config.js install --dry-run

  install:use-dev:
    desc: |
      Switch the GLOBAL agent-config to THIS working tree (the dev package).
      Points the `agent-config` bin on PATH at this repo (npm link) and
      refreshes user-scope content (~/.claude, ~/.cursor, ~/.event4u, …) from
      the freshly-built dev tree. Content comes from THIS repo's package root
      (node dist/...). Switch back with `task install:use-release`.
      Usage:
      task install:use-dev
    cmds:
      - task: dev:link
      - task: dev:install-global
      - 'echo "→ GLOBAL agent-config now = DEV working tree ($(pwd))"'
      - 'echo "  switch back to the published release: task install:use-release"'

  install:use-release:
    desc: |
      Switch the GLOBAL agent-config to the latest published npm release.
      Drops the dev symlink (npm unlink -g), installs
      @event4u/agent-config@latest globally, and refreshes user-scope content
      from it. Content comes from the GLOBAL release package (the `agent-config`
      bin resolves to ~/ node_modules, not this repo). Switch back to the
      working tree with `task install:use-dev`.
      Usage:
      task install:use-release
    cmds:
      - npm unlink -g @event4u/agent-config 2>/dev/null || true
      - npm install -g @event4u/agent-config@latest
      # `agent-config` now resolves to the global release bin → installs the
      # RELEASE content (not this repo's). --allow-headless keeps it global.
      - agent-config install --allow-headless
      - 'echo "→ GLOBAL agent-config now = RELEASE @event4u/agent-config@$(npm view @event4u/agent-config version 2>/dev/null)"'
      - 'echo "  switch back to the working tree: task install:use-dev"'


