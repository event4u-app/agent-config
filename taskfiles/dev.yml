version: '3'

# Local dev workflow — run the working tree as if it were a release,
# without going through `task release` + npm publish. See
# docs/development.md → "Local dev install (no release)" for the full
# story (consumer-side `npm link @event4u/agent-config` lives there).

tasks:
  dev:install-global:
    desc: |
      Refresh the user-scope install (~/.claude/, ~/.cursor/, ~/.augment/, …)
      from this working tree. Routes through the v4 TypeScript install
      engine (`agent-config install`) so the local install path matches
      
      Usage:
      task dev:install-global
    cmds:
      - npm run build
      - node dist/cli/agent-config.js install --allow-headless

  dev:link:
    desc: |
      Symlink this working tree as the global @event4u/agent-config
      package via `npm link`. After this the `agent-config` bin on PATH
      resolves into this repo. Consumer projects opt in with
      `npm link @event4u/agent-config` (see docs/development.md).
      Usage:
      task dev:link
    cmds:
      - npm link
      - 'echo "→ global bin \"agent-config\" now points at $(pwd)"'
      - 'echo "→ in a consumer project: npm link @event4u/agent-config"'

  dev:unlink:
    desc: |
      Remove the global symlink created by `task dev:link`. After this
      the `agent-config` bin resolves to whatever is published on the
      registry (or is unavailable if no global install exists).
      Usage:
      task dev:unlink
    cmd: npm unlink -g @event4u/agent-config

  dev:setup:
    desc: |
      Run the onboarding wizard (`agent-config setup`) from this working
      tree. Builds CLI + UI first so the local server has a fresh bundle
      under dist/ui/. Lands the browser on `#/wizard`.
      Usage:
      task dev:setup
    cmds:
      - npm run build
      - node dist/cli/agent-config.js setup

  dev:setup:dry-run:
    desc: |
      Run the onboarding wizard with all writes suppressed
      (`agent-config setup --dry-run`). The wizard renders end-to-end
      but no .agent-settings.yml / .agent-user.md / wizard-state.json
      is touched on disk. Useful for smoke-testing the flow inside
      this package without leaving artefacts behind.
      Usage:
      task dev:setup:dry-run
    cmds:
      - npm run build
      - node dist/cli/agent-config.js setup --dry-run

  dev:install:gui:
    desc: |
      Boot the v4 unified install wizard (`agent-config install`)
      against the working tree. Replaces the v3 `packages/core/installer`
      CLI which was removed in road-to-unified-setup § D1.
      Usage:
      task dev:install:gui
    cmds:
      - npm run build
      - node dist/cli/agent-config.js install

  dev:install:gui:dry-run:
    desc: |
      Boot the v4 install wizard in dry-run mode (`agent-config install
      --dry-run`). No filesystem writes occur.
      Usage:
      task dev:install:gui:dry-run
    cmds:
      - npm run build
      - node dist/cli/agent-config.js install --dry-run

  install:use-dev:
    desc: |
      Switch the GLOBAL agent-config to THIS working tree (the dev package).
      Points the `agent-config` bin on PATH at this repo (npm link) and
      refreshes user-scope content (~/.claude, ~/.cursor, ~/.event4u, …) from
      the freshly-built dev tree. Content comes from THIS repo's package root
      (node dist/...). Switch back with `task install:use-release`.
      Usage:
      task install:use-dev
    cmds:
      - task: dev:link
      - task: dev:install-global
      - 'echo "→ GLOBAL agent-config now = DEV working tree ($(pwd))"'
      - 'echo "  switch back to the published release: task install:use-release"'

  install:use-release:
    desc: |
      Switch the GLOBAL agent-config to the latest published npm release.
      Drops the dev symlink (npm unlink -g), installs
      @event4u/agent-config@latest globally, and refreshes user-scope content
      from it. Content comes from the GLOBAL release package (the `agent-config`
      bin resolves to ~/ node_modules, not this repo). Switch back to the
      working tree with `task install:use-dev`.
      Usage:
      task install:use-release
    cmds:
      - npm unlink -g @event4u/agent-config 2>/dev/null || true
      - npm install -g @event4u/agent-config@latest
      # `agent-config` now resolves to the global release bin → installs the
      # RELEASE content (not this repo's). --allow-headless keeps it global.
      - agent-config install --allow-headless
      - 'echo "→ GLOBAL agent-config now = RELEASE @event4u/agent-config@$(npm view @event4u/agent-config version 2>/dev/null)"'
      - 'echo "  switch back to the working tree: task install:use-dev"'

  dev:standing-rule-delivery:
    desc: |
      How many rule tokens does a session on THIS machine actually receive?
      Sums both layers Claude Code loads (~/.claude/rules/ and
      .claude/rules/), names the overlap, and fails over the cap in
      src/config/budgets.yml.
      Local-only on purpose: `.claude/rules/` is gitignored and no CI leg
      performs a user-scope install, so on a runner BOTH inputs are empty —
      in CI this gate could only be green-by-blindness. The enforced layer is
      the installer gate, which refuses to CREATE the doubled state.
      Over the cap? `agent-config install --layer=global|project` suppresses
      one layer via claudeMdExcludes without deleting a file.
      Usage:
      task dev:standing-rule-delivery
    cmd: ./scripts-run src/scripts/check_standing_rule_delivery

  dev:hooks-effect:
    desc: |
      Does any bound hook concern actually FIRE on THIS host? Dispatches each
      eligible concern against a scratch root and reports one of five
      per-concern states and one of four host verdicts.
      Not `hooks:doctor`: that one reads the manifest (what is declared), this
      one reads what happened (what took effect).
      Local-only on purpose, and the same reason as dev:standing-rule-delivery:
      the verdict is a property of the operator's host, and a CI runner is
      nobody's host — an automatic green there would describe an install no
      consumer has, which is worse than no reading at all.
      Usage:
      task dev:hooks-effect
      task dev:hooks-effect -- --host cursor --format json
    cmd: ./agent-config hooks:effect {{.CLI_ARGS}}

  push-ready:
    desc: |
      The documented pre-push freshness sequence, executed rather than
      described. `src/domains/git/pr/create/command.md` § 1b-ii already
      specifies it correctly and calls it MANDATORY on every later push;
      what did not exist was something that runs it.

      Six steps, each printing its own outcome:
        1 fetch                — origin, pruned
        2 integrate the SET    — the PR target plus, per the
                                 branch-convergence policy read at the
                                 TARGET commit, the default branch. The
                                 DEFAULT is merged first so a conflict
                                 surfaces against the broader base.
        3 regenerate           — `task sync` + `task generate-tools`
        4 verify               — `task consistency`, the exact CI mirror
        5 re-check freshness   — `check_branch_freshness` after the merge
        6 push                 — NOT run here. Pushing is the contributor's
                                 call and stays one deliberate command.

      DRY=1 runs steps 1, 2 and 5 read-only and prints what 3, 4 and 6
      would do, so a stale branch can be inspected without mutating it.

      Usage:
      task push-ready
      task push-ready DRY=1
    vars:
      DRY: '{{.DRY | default ""}}'
    cmds:
      - 'echo "── push-ready ──────────────────────────────────────────"'
      - 'echo "1 fetch"'
      - 'git fetch origin --prune && echo "  → origin fetched" || echo "  → FAILED: origin unreachable"'
      - 'echo "2 integrate the base set (default first, then target)"'
      # DRY reports the step's outcome and carries on, so all six steps are
      # visible in one pass. A real run stops on the first refusal.
      - '{{if .DRY}}./scripts-run src/scripts/sync_pr_branch --dry-run || echo "  → refused (see above); the real run would stop here"{{else}}./scripts-run src/scripts/sync_pr_branch{{end}}'
      - 'echo "3 regenerate derived files"'
      - '{{if .DRY}}echo "  → would run: task sync && task generate-tools"{{else}}task sync && task generate-tools && echo "  → regenerated"{{end}}'
      - 'echo "4 verify (task consistency — the exact CI mirror)"'
      - '{{if .DRY}}echo "  → would run: task consistency"{{else}}task consistency && echo "  → consistent"{{end}}'
      - 'echo "5 re-check freshness after the merge"'
      - '{{if .DRY}}./scripts-run src/scripts/check_branch_freshness || echo "  → not current (see above); the real run would stop here"{{else}}./scripts-run src/scripts/check_branch_freshness{{end}}'
      - 'echo "6 push"'
      - 'echo "  → NOT run here. Review the merge, then push deliberately."'
