version: '3'

# Package-impact A/B benchmark — task entries.
#
# Phase 5 Step 2 of `agents/roadmaps/road-to-package-impact-benchmark.md`.
#
# Surfaces:
#   task bench:ab                  — full run, dry-run mode (cheap, repeatable)
#   task bench:ab:live             — full run, live mode (cost-bearing; per-task
#                                    claude CLI invocation)
#   task bench:ab:refresh-baseline — force-rebuild the `without` arm
#   task bench:ab:track-a          — Track A behavioural eval only (no CLI)
#   task bench:ab:track-b          — Track B task corpus (dry-run by default)
#   task bench:ab:diff             — re-render docs/benchmark.md from latest reports
#   task bench:ab:clones           — materialise the variant clones only

vars:
  QUIET_FLAG:
    sh: '[ "$AGENT_SCRIPT_VERBOSITY" = "verbose" ] && echo "" || echo "--quiet"'

tasks:
  bench:ab:clones:
    silent: true
    desc: |
      Materialise the `with` and `without` clones from the fixture
      under internal/bench/ab/clones/. Idempotent — re-running without
      --refresh leaves existing clones alone.
    cmd: ./scripts-run src/scripts/bench_ab_clone {{.CLI_ARGS}}

  bench:ab:refresh-baseline:
    silent: true
    desc: |
      Force-rebuild the `without` clone and re-run Track A against it.
      Use when the corpus has changed, the claude CLI version has
      changed, or the target-shape hash drifted (per Phase 2 cache key).
    cmds:
      - ./scripts-run src/scripts/bench_ab_clone --variant without --refresh
      - ./scripts-run src/scripts/bench_ab_tracka_run --variant without
      - ./scripts-run src/scripts/bench_ab_task_runner --variant without --mode dry-run

  bench:ab:track-a:
    silent: true
    desc: |
      Track A — behavioural eval. For each prompt in
      internal/bench/corpora/ab-tracka.yaml, verify the expected
      rule/skill surface is present in the target clone. Cheap;
      no Claude API spend. Phase 3.

      Honours the Phase 2 cache: when the cached `without` report is
      fresh against the current (corpus_hash, claude_cli_version,
      target_shape_hash) triple, the `without` arm is skipped and
      only the `with` arm re-runs. Use `bench:ab:refresh-baseline`
      to force a `without` rebuild.
    cmds:
      - ./scripts-run src/scripts/bench_ab_clone --variant both
      - ./scripts-run src/scripts/bench_ab_cache_dispatch tracka

  bench:ab:track-b:
    silent: true
    desc: |
      Track B — task corpus. Dry-run mode by default (stub transcript,
      no CLI invocation — both variants score 0/13 honestly). Pass
      `task bench:ab:track-b -- --mode live` to actually invoke the
      claude CLI per task (cost-bearing). Phase 4.

      Honours the Phase 2 cache for the without-arm (see track-a).
    cmds:
      - ./scripts-run src/scripts/bench_ab_clone --variant both
      - ./scripts-run src/scripts/bench_ab_cache_dispatch trackb {{.CLI_ARGS}}

  bench:ab:diff:
    silent: true
    desc: |
      Re-render docs/benchmark.md from the latest paired reports
      under internal/bench/reports/ab/. Does NOT re-run any benches.
      Useful for tweaking the renderer without burning a fresh run.
    cmd: ./scripts-run src/scripts/render_benchmark_md {{.QUIET_FLAG}}

  bench:ab:
    silent: true
    desc: |
      Full A/B run (Track A + Track B, dry-run). Renders docs/benchmark.md
      from the resulting reports. The `without` baseline reuses the
      Phase 2 cache when fresh — only the `with` arm re-runs on a
      repeat invocation.
    cmds:
      - task: bench:ab:track-a
      - task: bench:ab:track-b
      - task: bench:ab:diff

  bench:ab:live:
    silent: true
    desc: |
      Full A/B run with Track B in live mode (each task invokes
      `claude --print` against the variant clone). Cost-bearing —
      use only when you want a real measurement. Set CLAUDE_CLI env
      var to override the binary path.
    cmds:
      - task: bench:ab:track-a
      - ./scripts-run src/scripts/bench_ab_clone --variant both
      - ./scripts-run src/scripts/bench_ab_task_runner --variant both --mode live
      - task: bench:ab:diff

  bench:ab:value:
    silent: true
    desc: |
      3-condition VALUE benchmark (without | with | with-rdp), live mode —
      the one that fills docs/benchmark.md's two tables (Package value +
      RDP lift) with real numbers. Cost-bearing: ~3 × N `claude --print`
      calls. Measures the LIFT of agent-config on the host model, not
      model-vs-model. See agents/roadmaps/road-to-3-condition-value-benchmark.md.

      Defaults (set in bench_ab_task_runner.py): pins claude-sonnet-4-6 across
      all arms, caps per-task spend (--budget 2.0), error-aware reporting.
      WARNING: the full 13-task corpus × 3 arms (39 live runs) can trip the
      account usage limit. For a quota-safe demonstrator that spans every
      populated 2×2 cell, use `task bench:ab:value:quick` (9 runs).
    cmds:
      # Only the fixture clone is needed: activation is per-arm at invocation time
      # (without = --setting-sources project,local → plugin off; with = real
      # plugin; with-rdp = + injected RDP rules), not via clone files. The runner
      # resets a fixture working dir per task itself.
      - ./scripts-run src/scripts/bench_ab_clone --variant without --refresh
      - ./scripts-run src/scripts/bench_ab_task_runner --variant all --mode live
      - task: bench:ab:diff

  bench:ab:value:quick:
    silent: true
    desc: |
      Bounded 3-condition value benchmark — one task per POPULATED 2×2 cell
      (short/reasoning-heavy + short/mechanical + long/reasoning-heavy) × 3 arms
      = 9 live runs. The cheap, quota-safe demonstrator: pins one model
      (claude-sonnet-4-6, NOT the Opus-1M session default whose cache-creation
      blows the quota), caps per-task spend (--budget), and is error-aware
      (a rate-limit / budget trip is excluded from the hit-rate, never read as a
      content fail). Use this to prove the harness end-to-end without the full
      39-run corpus tripping the usage limit.
    cmds:
      - ./scripts-run src/scripts/bench_ab_clone --variant without --refresh
      - ./scripts-run src/scripts/bench_ab_task_runner --variant all --mode live --tasks trackb-bugfix-01,trackb-bugfix-02,trackb-refactor-01 --budget 4.0 --timeout 300
      - task: bench:ab:diff

  bench:ab:v2:
    silent: true
    desc: |
      Discipline-axis wrapper-lift benchmark (v2) — the rebuild after the v1
      binary-capability frame saturated. 4 arms (vanilla | package | package-rdp
      | placebo) over the trap-archetype corpus (ab-trackb-v2.yaml), dual-axis
      deterministic scoring (capability + discipline), paired McNemar/Wilcoxon.
      Cost-bearing & quota-aware: pins sonnet, caps per-run spend (--budget).
      WARNING the full 15×4×3=180-run pilot is ~60-90M tokens — use --tasks /
      --seeds to bound it. See agents/roadmaps/road-to-discipline-axis-benchmark.md.
      Pass flags through, e.g.:
        task bench:ab:v2 -- --tasks trapA-overeng-01,trapB-regress-01 --seeds 1 --budget 3.5
    cmd: ./scripts-run src/scripts/bench_ab_v2_run {{.CLI_ARGS}}

  bench:ab:v2:stats:
    silent: true
    desc: |
      Print the paired statistics + L4 gate verdict for the latest v2 paired
      report (or pass a report path). Cost-free.
    cmd: ./scripts-run src/scripts/bench_ab_v2_stats {{.CLI_ARGS}}

  bench:ab:v2:diff:
    silent: true
    desc: |
      Re-render docs/benchmark.md from the latest v2 paired report (honest
      two-table + gate + honesty labels). Cost-free.
    cmd: ./scripts-run src/scripts/bench_ab_v2_stats --markdown docs/benchmark.md

  bench:ab:watch:
    silent: true
    desc: |
      Tail the live bench progress (internal/bench/reports/ab/.progress.json) in a
      second terminal while `bench:ab:value` / `bench:ab:live` runs. Ctrl-C stops.
    cmd: |
      node -e '
      const fs = require("node:fs");
      const p = "internal/bench/reports/ab/.progress.json";
      process.stderr.write(`watching ${p} … Ctrl-C to stop\n`);
      process.on("SIGINT", () => { process.stdout.write("\n"); process.exit(0); });
      const tick = () => {
        let s = {};
        try { s = JSON.parse(fs.readFileSync(p, "utf8")); } catch { s = {}; }
        process.stdout.write(
          `\r${s.total_done ?? 0}/${s.total ?? "?"} · ${s.variant ?? ""} · ` +
          `${s.current_id ?? ""} · ${s.last_result || "running"}        `
        );
      };
      tick();
      setInterval(tick, 1000);
      '

  lint-bench-ab:
    silent: true
    desc: |
      Validate internal/bench/corpora/ab-tracka.yaml and ab-trackb.yaml
      against their schemas, and verify docs/benchmark.md (if present)
      carries every required section. Wires into the lint-bench
      aggregate. Phase 5 Step 3.
    cmd: ./scripts-run src/scripts/lint_bench_ab {{.QUIET_FLAG}}
