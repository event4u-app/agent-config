version: '3'

tasks:
  preflight:
    silent: true
    desc: |
      Repo-content gates that CI runs and no local chain reached until 2026-07-30.
      Measured 25.1s total (2026-08-06, including the two gates added that day;
      15s at authoring 2026-07-30 — most of the drift is environment, the added
      gates account for 1.1s of it) — affordable before a push, which is the
      point: each of these turned a PR red for something local would have caught.
      Deliberately EXCLUDES check_enforcement_coverage (30.7s measured): a pre-push
      gate that doubles the hook teaches people to skip it. That one stays in the
      full `task ci` and belongs in the post-CI loop.

      THIS TASK DOES NOT HAVE PARITY WITH CI, AND IS NOT MEANT TO.
      Measured 2026-08-12 (round 7): preflight reaches 22 gates; 209 CI-enforced
      gates run neither here nor anywhere else this push runs locally. A green
      preflight is a cheap pre-push filter, never a prediction that CI will be
      green — three measured
      "green locally, red remotely" cycles came out of reading it as one (the
      Thin-Root char cap, the ratchet in the Node-Tests shard, derived-page
      freshness).
      This line previously read "Parity with CI is enforced by
      `task check-ci-local-parity`". That checker compares CI against `task ci`,
      which INCLUDES preflight — so it never inspected this task, and the sentence
      claimed an authority nothing held. `check_ci_local_parity` now reports the
      gap on every run; run `task ci` when you need the full set.
    cmds:
      # Before anything reads the tree: is the tree even current? Measured
      # 2026-08-08 — a branch cut from a fetch at the start of a ninety-minute
      # run pushed into a `main` that had moved twice, one of the merges
      # shipping the same roadmap phase the branch was implementing. Every other
      # gate here inspects local content and none of them can see that. It asks
      # the SERVER rather than the tracking ref — comparing against the local ref
      # would reproduce the stale reading that caused the incident.
      # Up to THREE round trips, not one: a `gh pr list` to resolve WHICH base
      # this branch's open PR actually targets; when there is no open PR — the
      # common case on the /create-pr path — an `ls-remote --symref` for the
      # server's default branch; then the `ls-remote` against the base itself.
      # The last was always here (~0.3s); the other two were added because a
      # hardcoded `main` reports a true-but-irrelevant green for any branch whose
      # PR targets a release line or a parent PR, and because taking the default
      # branch NAME from the local origin/HEAD reintroduces the stale-local-state
      # failure the gate exists to catch.
      # Budget: ~1-2s typical against the 25s pre_push_budget_seconds ceiling in
      # src/config/ci-local-parity.yml. The WORST case is worth stating rather
      # than averaging away: NETWORK_TIMEOUT_MS in the gate is 8s and bounds
      # `git` as well as `gh`, so three hung calls spend 24s and stay under the
      # ceiling by construction. Bounding `gh` alone was not enough — the two
      # `ls-remote` calls went through an untimed `git`, so an unresponsive SSH
      # remote could hang past any stated worst case.
      # Fast failures (no `gh` -> ENOENT, no auth -> non-zero exit) return
      # immediately; only an unresponsive endpoint reaches a timeout.
      # Either way it degrades rather than fails: the run falls back to the repo
      # default and SAYS SO, so an offline push is never blocked by the step.
      # No-op in CI, where the forge owns mergeability.
      - ./scripts-run src/scripts/check_branch_freshness --quiet
      # Immediately after the freshness probe, and paired with it on purpose: that
      # gate asks "is the branch behind its BASE", this one asks "does the open PR
      # carry what is committed here, and did its green run against THIS head".
      # Measured on PR #1391 — a fix committed locally while the PR still carried
      # the failure, a green that had run against the pre-fix commit, and a branch
      # behind its OWN remote after someone pressed Update branch. None of the
      # three is visible from a green local gate, and all three make a CI fix look
      # delivered when it is not. Degrades to exit 0 with the reason named when
      # the remote cannot be observed; no-op where there is no open PR.
      - ./scripts-run src/scripts/check_pr_ci_current --pre-push --quiet
      # FIRST among the content gates, and the order is the whole point: this
      # gate reads the host rule
      # trees as they stand, and check_bridge_derivation below REGENERATES them.
      # Run after it and the five-week-stale projection it exists to catch
      # (.claude/rules holding 92 of 108 rules, last generated 2026-07-05) has
      # already been repaired in-place and the check is a fixpoint. 0.7s measured.
      - ./scripts-run src/scripts/check_rule_projection_integrity --quiet
      - ./scripts-run src/scripts/check_bridge_derivation
      # Evidence artifacts added on this branch declare what KIND of evidence
      # they are (road-to-release-review-p0 Phase 2). Diff-scoped against the
      # resolved base ref, so it scans 0 and exits 0 on a branch that adds
      # none — which is why it is deliberately absent from gate-coverage.yml
      # (no honest `min_scanned` floor exists for it; same reason and same
      # shape as check_rule_projection_integrity above). Its ledger half IS
      # discharged, so check_gate_completeness counts it as an adopter.
      - ./scripts-run src/scripts/lint_evidence_artifacts --quiet
      # Detector corpus: every self-repair detector carries all three fixture
      # classes AND every fixture behaves as its class says. Cheap (pure
      # functions over a 22-entry YAML corpus, no I/O beyond the one read).
      - ./scripts-run src/scripts/check_detector_corpus
      # One artefact, one layer (ADR-236). Binds HERE and not in CI on a measured
      # fact rather than a preference: .claude/ is gitignored and no CI leg installs
      # at user scope, so a CI run of this check finds ZERO layers and reports on a
      # topology no contributor has. The overlap is a property of the developer
      # machine. AI council 2/2 converged on preflight, and both seats attached the
      # same condition — the binding must be provably live, because two gates in this
      # exact area are weaker than they look: check_standing_rule_delivery sits in
      # taskfiles/dev.yml and nothing runs it automatically, and
      # check_rule_projection_integrity — which DOES run, here and in CI — is inert
      # when .agent-tools.yml selects zero tools, so it passes without auditing.
      # (An earlier version of this comment said both "report to nobody", which
      # overstated the second: it reports, it just has nothing to report on.)
      # That proof is
      # tests/scripts/preflight_single_delivery_binding.test.ts.
      # REPORT MODE, deliberately: the invariant is not true yet — Phase 2 of
      # road-to-single-delivery ships the partition — so --enforce here would red
      # every preflight on a defect nobody can currently fix, which is how a gate
      # teaches people to skip it. The --enforce flip lands WITH Phase 2.
      - ./scripts-run src/scripts/check_single_delivery --quiet
      # One rule, one layer — the RULE half of ADR-236, across all five host
      # directories (road-to-single-rule-layer Phase 4). Binds HERE for the same
      # measured reason as the gate above: the comparison needs a global layer, and
      # CI has none. It runs in CI too, where it prints "nothing compared" rather
      # than a success line.
      #
      # ENFORCE, not report: unlike check_single_delivery above, this invariant IS
      # true as of this change — all five directories measure 0 duplicated rules
      # after one `task generate-tools`. A gate whose defect nobody can fix teaches
      # people to skip it; a gate whose defect is one command away does not.
      #
      # If it reds on your checkout, the tree is stale rather than broken: run
      # `task sync && task generate-tools` (that order) and re-run. It never reds on
      # a host whose global layer it could not read — that case is skipped by name.
      - ./scripts-run src/scripts/check_rule_layer_partition
      # No shipped artefact may DIRECT a silent re-run — the mechanism was
      # benchmarked and falsified (recursive-verification, TERMINAL 2026-07-28).
      - ./scripts-run src/scripts/lint_never_silent
      - ./scripts-run src/scripts/check_host_loadability --root .
      # Per-host projection REACH — does each generated host tree carry anything,
      # and when it does not, is the tool absent or the projection dead? The shape
      # check above reports those two as the same green. LOCAL-only by declaration:
      # a CI runner has no host tool installed, so every row would skip and the gate
      # would scan nothing (road-to-skill-ecosystem-runtime-enforcement Phase 3.2).
      - ./scripts-run src/scripts/check_host_loadability --reach --root .
      - ./scripts-run src/scripts/check_bundle_path_leakage
      - ./scripts-run src/scripts/check_installer_import_purity
      - ./scripts-run src/scripts/check_backstop_debt
      - ./scripts-run src/scripts/lint_topics_yaml
      - ./scripts-run src/scripts/build_mcp_catalog --strict
      - ./scripts-run src/scripts/check_cli_registry_budget_sync
      - ./scripts-run src/scripts/check_safety_floor_untouched
      - ./scripts-run src/scripts/check_no_new_legacy_path
      - ./scripts-run src/scripts/check_kernel_rule_bundle
      # Catches the one failure that is invisible to CI AND to the test suite:
      # a self-hosted hook bundle older than the hook sources it bundles, i.e.
      # the agent running a merged hook fix that was never built. On 2026-08-06
      # four such fixes ran nowhere for a full session. Sub-second (38 stats).
      # In CI it declares a loud no-op — a fresh checkout has no bundle — rather
      # than passing silently on an invariant it never evaluated.
      # The healer runs FIRST: the staleness the gate catches is a routine
      # consequence of any hook-source merge (dist/ is untracked), and on
      # 2026-08-09 it blocked the 9.28.0 release push. The healer rebuilds
      # SAFELY (build to .new → probe the dispatcher → atomic rename), which
      # removes the gate's documented never-build hazard; the gate behind it
      # then verifies the fixpoint and still reds if the heal failed. In CI
      # both are no-ops — a fresh checkout has no bundle.
      - ./scripts-run src/scripts/rebuild_hook_bundle
      - ./scripts-run src/scripts/check_hook_bundle_freshness
      # Byte-equivalence behind the mtime check. The freshness gate compares
      # ORDERING (every source older than the bundle); this compares BYTES
      # (the bundle is what these sources produce). An mtime-preserving edit,
      # a `touch` on the bundle, or a `cp -p` restore passes the first and
      # fails the second — demonstrated 2026-08-21 with an edit that changed
      # the dispatcher's digest while leaving its size and mtime untouched.
      # NOT claimed: that the mtime gate missed the 2026-08-21 incident. It is
      # pre-push and was not run; an ordinary edit would have reddened it.
      # LOCAL-ONLY BY CONSTRUCTION: dist/hooks/ is untracked, so CI has no
      # bundle to compare and declares a no-op. A green CI says nothing about
      # the bundle a maintainer is actually executing — which is precisely the
      # blind spot that cost the 2026-08-21 drain run its first hour.
      # Cost, measured rather than assumed like its neighbours here: 0.27s /
      # 0.27s / 0.26s over three consecutive runs (esbuild bundles this tree in
      # ~22ms; the rest is process start). It runs unconditionally rather than
      # only when the healer reports staleness, because staleness is exactly
      # the mtime inference this gate exists to distrust.
      - ./scripts-run src/scripts/check_hook_bundle_content
      - ./scripts-run src/scripts/lint_regression
      # Same argv the CI `skill-lint` job runs. NOT chosen for speed — both
      # forms are sub-second here (0.44s --changed / 0.52s --all, measured
      # 2026-08-06) — but for argv parity and blast radius: `--all` would let
      # a pre-existing finding anywhere in the tree block an unrelated push,
      # which is how a pre-push gate teaches people to skip it. `--all` still
      # runs in `task ci` via `lint-skills`.
      # Its absence is what let a 226-char command description reach CI on
      # 2026-08-06 — `validate_frontmatter` does not check the description
      # cap, only the linter does, so no other preflight gate could catch it.
      - ./scripts-run src/scripts/skill_linter --changed
      # agents/index.md + docs/catalog.md embed artefact descriptions verbatim,
      # so ANY description edit makes them stale — the consistency workflow says
      # so in its own comment. Same 2026-08-06 PR reddened CI twice on the same
      # one-line change: once for the cap, once for this drift. 0.69s measured.
      - task: check-index
      # The discovery scanner in STRICT mode, and it belongs here for the same
      # reason `check-index` does: a new artefact's `packs:` value is a
      # vocabulary question this change answers, and nothing else in preflight
      # asks it. `validate_frontmatter` checks the SHAPE of the key, not whether
      # the value names a pack that exists.
      #
      # Measured 2026-08-20: a new rule shipped `packs: [core]` — a real
      # directory under src/packs/, so it read as plausible, and not a member of
      # the discovery vocabulary. Every gate in this preflight passed. CI then
      # failed FIFTEEN checks in 18-31s each, because `consumer-matrix.yml` runs
      # this scanner with `--strict` and it aborts the job before the suite even
      # starts. `consistency.yml` runs the same scanner WITHOUT `--strict` and
      # says nothing, which is why the non-strict form here would have been
      # theatre.
      #
      # ~1s, and the value is the failure mode it removes: a vocabulary typo
      # currently costs a full red CI matrix and a fixup push, and it is
      # invisible locally right up to that point.
      - ./scripts-run src/scripts/build_discovery_manifest --write --strict {{.QUIET_FLAG}}
      # Gate R1 + R2 (plan-governance) — pre-push layer; CI is authoritative.
      # Exit 2 = degraded advisory (a broken gate never blocks its own fix).
      - task: lint-plan-risk-register
      - task: check-completion-review
      # The PRESENCE half of the evidence-type contract, and it belongs here
      # rather than in CI: an evidence artifact this change adds or modifies must
      # declare what kind of evidence it is, which is a question about the change
      # set. CI runs the same script with `--all` for the globally decidable half
      # (a declared type must agree with its body). Splitting them is not
      # duplication — the two halves have different scopes on purpose, and the
      # changed-files mode has no trippable `scanned:` floor to register.
      # Exit-2 shim, same as check-completion-review above: an internal error is
      # warn-and-allow per the exit-code contract § 6, so a broken gate never
      # blocks its own fix. Without it this was stricter LOCALLY than in CI —
      # the one direction that teaches a contributor to skip the pre-push run.
      - cmd: |
          ./scripts-run src/scripts/lint_evidence_artifacts --quiet || {
            rc=$?;
            if [ "$rc" = "2" ]; then echo "⚠️  lint_evidence_artifacts: internal error — degraded advisory mode, allowing (exit-code contract §6)"; else exit "$rc"; fi;
          }

  check-ci-local-parity:
    silent: true
    desc: |
      Fail when a gate runs in CI but no local chain reaches it, or runs locally and
      in no workflow — unless declared with a reason in src/config/ci-local-parity.yml.
      Both directions cost real defects; see the manifest header.
    cmd: ./scripts-run src/scripts/check_ci_local_parity {{.QUIET_FLAG}}

  check-ci-strict-superset:
    silent: true
    desc: |
      Assert `ci-strict` still delegates to `ci` (`- task: ci` as its first gate
      entry), which is what makes the strict tier a superset BY CONSTRUCTION.
      The two lists were once maintained independently and drifted to six gates
      that ran in `ci` and nowhere in `ci-strict` — a release gate proving less
      than the everyday gate, invisible because check-ci-local-parity scopes
      itself to the 'ci' and 'consistency' roots only.
    cmd: ./scripts-run src/scripts/check_ci_strict_superset {{.QUIET_FLAG}}

  lint-originality-shingles:
    desc: "Re-skin detector — entity-masked 8-word shingle overlap across skills/personas/subagents. Report-only (calibration); arm with --threshold <pct> once the allowlist is seeded."
    cmd: ./scripts-run src/scripts/lint_originality_shingles --top 10

  lint-skills:
    silent: true
    desc: Lint all skills and rules
    cmd: ./scripts-run src/scripts/skill_linter --all {{.QUIET_FLAG}}

  lint-namespace:
    silent: true
    desc: |
      Namespace contract gate (step-11 Phase 5.1). Enforces
      `<stem>-<intent>` kebab-case + reserved-names list across
      skills / rules / commands / personas. Contract:
      docs/contracts/namespace.md.
    cmd: ./scripts-run src/scripts/lint_namespace {{.QUIET_FLAG}}

  lint-mcp-inventory:
    silent: true
    desc: |
      MCP-tool inventory drift gate (step-11 Phase 5.3). Regenerates
      docs/contracts/mcp-tool-inventory.md from the source-of-truth
      catalog and fails if the on-disk file is stale. Run
      `./scripts-run src/scripts/audit_mcp_tools --write` to refresh.
    cmd: ./scripts-run src/scripts/audit_mcp_tools --check {{.QUIET_FLAG}}

  lint-agent-security:
    silent: true
    desc: |
      Agent-security self-audit (road-to-security-pillar.md P1). Runs the five
      corpus linters — hidden-unicode, mixed-script-confusable,
      instruction-smuggling, mcp-config-security, dangerous-frontmatter — over
      src/ AND dist/agent-src/ (the shipped projection, so the scanned bytes are
      the published bytes) under the false-positive containment convention
      (docs/guidelines/agent-infra/security-lint-containment.md).
      Supply-chain integrity gate for the suite's own shipped artifacts.
    cmd: ./scripts-run src/scripts/lint_agent_security {{.QUIET_FLAG}}

  lint-skills-strict:
    silent: true
    desc: Lint all skills and rules, warnings fail too
    cmd: ./scripts-run src/scripts/skill_linter --all --strict-warnings

  lint-skills-changed:
    silent: true
    desc: Lint changed skills and rules
    cmd: ./scripts-run src/scripts/skill_linter --changed

  lint-skills-json:
    silent: true
    desc: Lint all skills and rules with JSON output
    cmd: ./scripts-run src/scripts/skill_linter --all --format json

  lint-skills-report:
    silent: true
    desc: Generate quality report for all skills and rules
    cmd: ./scripts-run src/scripts/skill_linter --all --report

  lint-skills-pairs:
    silent: true
    desc: Check condensation quality between uncondensed and condensed pairs
    cmd: ./scripts-run src/scripts/skill_linter --all --pairs --condensation-quality

  skill-usage:collect:
    silent: true
    desc: |
      Append exposure/mention records from Claude Code session jsonl into
      agents/runtime/metrics/skill-usage.jsonl. Feeds step-2-skill-inventory-rationalization
      Phase 1. Privacy-safe (SHA-256 prompt-prefix hashes, no bodies).
    cmd: ./scripts-run src/scripts/skill_usage_collect {{.QUIET_FLAG}}

  skill-usage:report:
    silent: true
    desc: |
      Aggregate agents/runtime/metrics/skill-usage.jsonl into
      agents/runtime/metrics/skill-usage-report.md (per-skill 30-day rolling window
      with active / exposed-only / dead status), plus a second section over the
      Class-A sink export at agents/runtime/metrics/telemetry-class-a.jsonl when
      one is present (--sink). Baseline only — Phase 2 does the
      rationalization decisions.
    cmd: ./scripts-run src/scripts/skill_usage_report {{.QUIET_FLAG}}

  skill-overlap:
    silent: true
    desc: |
      Scan .agent-src.uncondensed/skills/*/SKILL.md frontmatter and body
      symbol references; emit agents/runtime/metrics/skill-overlap.md with
      strong (≥ 0.6) and candidate (≥ 0.30 token / ≥ 0.50 symbol) tiers.
      Feeds step-2-skill-inventory-rationalization Phase 2 Step 3.
    cmd: ./scripts-run src/scripts/skill_overlap {{.QUIET_FLAG}}

  lint-skill-originality:
    silent: true
    desc: |
      Anti-duplicate originality gate (road-to-competitive-borrow P1.1).
      Scans src/skills/*/SKILL.md description+trigger Jaccard; same-domain
      (shared packs:) pairs >= 0.6 are the would-fail class, advisory warns
      >= 0.40. WARN-ONLY by default per adr-architectural-consensus-mechanism
      (fail-the-build deferred until thresholds stable one full release cycle).
      Allowlist: src/scripts/lint_skill_originality_allowlist.json (capped 20).
      Promotion path: add --strict once thresholds are confirmed stable.
    cmd: ./scripts-run src/scripts/lint_skill_originality {{.QUIET_FLAG}}

  audit-skill-overlap:
    silent: true
    desc: |
      BLOCKING gate (road-to-overlap-truth-and-skill-cut P6). Canonical
      content cosine over src/skills/*/SKILL.md; prints the same-domain pair
      table and rewrites agents/reports/skill-overlap.{json,md}.
      Exit 1 = a same-pack pair at or above 0.70 with no reviewed
      justification in src/scripts/audit_skill_overlap_allowlist.json
      (capped 20 — crossing the cap means the threshold is wrong, not that the
      corpus needs a 21st exception). Exit 3 = DEAD SCAN SCOPE, the defect this
      task exists to make loud: the tool spent its whole life rooted at the
      pre-ADR-051 source container and reported nothing for 287 skills.
      Cross-pack pairs never block — that merge changes install shape.
      --print-table survives --quiet on purpose; a report nobody sees is the
      same silent green.
    cmd: ./scripts-run src/scripts/audit_skill_overlap {{.QUIET_FLAG}} --print-table --strict

  sweep-dead-scan-roots:
    silent: true
    desc: |
      Full-population dead-scan-root sweep (road-to-gates-that-can-fail P1).
      Scans every lint_*/audit_*/check_*/verify_* script for repo paths that do
      not exist AND carry positive read evidence. Deliberately NOT in `task ci`:
      it exits 1 on the 13 class-A findings currently in the tree, and a gate
      that turns CI red on debt it did not create is the failure mode this track
      exists to avoid. Wiring follows the dead-gate-finding-triage disposition.
      Exit contract: 0 clean · 1 class-A findings · 2 self-test blind ·
      3 ledger hygiene (stale/cap). Findings outrank hygiene.
      Ledger: agents/evidence/sweep-dispositions.json (capped 15).
    cmd: ./scripts-run src/scripts/sweep_dead_scan_roots {{.CLI_ARGS}}

  lint-skill-descriptions:
    silent: true
    desc: |
      Description-quality gate (ecosystem-harvest skill-quality-gates P1).
      Scans src/skills/*/SKILL.md for four routing-breaking description
      defects: desc≡name, verbatim duplicated trigger phrase, triggers all
      substrings of the name, and no routing signal (no condition marker /
      imperative-verb lead / specifics enumeration / example query).
      Plus two POSITIVE checks scoped to clustered skills only — a skill the
      canonical overlap tool pairs with a same-pack sibling at >= threshold
      must name that sibling and must carry a quoted user phrase. Dormant
      while the cluster set is empty; that scoping is what keeps a
      quoted-phrase mandate from becoming corpus-wide noise.
      Allowlist: src/scripts/lint_skill_descriptions_allowlist.json (capped 20).
    cmd: ./scripts-run src/scripts/lint_skill_descriptions {{.QUIET_FLAG}}

  lint-skill-scripts-readonly:
    silent: true
    desc: |
      Read-only-by-default script gate (ecosystem-harvest skill-quality-gates P3).
      A script under src/skills/*/scripts/** that mutates the filesystem must gate
      the mutation behind an explicit flag (--writable/--apply/--write/--output/
      --fix) or be allowlisted with a rationale
      (src/scripts/lint_skill_scripts_readonly_allowlist.json, capped 20).
    cmd: ./scripts-run src/scripts/lint_skill_scripts_readonly {{.QUIET_FLAG}}

  lint-archived-skills:
    silent: true
    desc: |
      Validate agents/evidence/archived-skills/ archive notes against the
      contract in .agent-src.uncondensed/templates/skill-archive-note.md.
      Fails if a note is missing required fields, a replacement slug
      doesn't exist, an archived slug still has a live SKILL.md, or a
      live skill cites an archived slug as replaced_by. Step-2 Phase 3.
    cmd: ./scripts-run src/scripts/lint_archived_skills {{.QUIET_FLAG}}

  ci:required-checks:
    silent: true
    desc: |
      Print the required-check set the current branch will face on the
      PR — per-PR-shape resolution (feature / release / docs-only) per
      docs/contracts/branch-protection-policy.md. Pure preview, no
      network, no spend. Useful before pushing to confirm the diff
      stays within the release-PR allowlist.
    cmd: ./scripts-run src/scripts/print_required_checks {{.CLI_ARGS}}

  ci:status:
    silent: true
    desc: |
      Assert the required-check set is green on the given branch (default
      `main`). Wraps `gh run list`, filters phantom 0-job runs per
      docs/contracts/ci-green-floor.md § Phantom 0-job runs, and exits
      non-zero on any real red. Pass `--strict` to also fail on missing
      checks (gate-mode for the freeze rule). Phase A Step 6 of
      road-to-adoption-proof-and-ci-green.md.
    cmd: ./scripts-run src/scripts/ci_status {{.CLI_ARGS}}

  ci:time-ratio:
    silent: true
    desc: |
      Report the CI-time / local-edit-time ratio per touched-path class
      (doc / skill / test / meta / mixed) by sampling recent commits and
      their GitHub Actions durations. Median > 5x for a frequent class
      means that class needs a cheaper tier; < 3x across all classes
      means the structural overhead is acceptable. Needs `gh` auth and
      hits the network. Writes agents/reports/ci-time-ratio.json.
      Pass --limit N / --branch NAME / --out PATH.
    cmd: ./scripts-run src/scripts/ci_time_ratio {{.CLI_ARGS}}

  adoption:status:
    silent: true
    desc: |
      One-screen adoption dashboard: registry-submission status counts
      from docs/distribution/registry-submissions.md, recruit-session
      report count under agents/recruit-sessions/, latest required-check
      colour on `main`. Phase C Step 6 of
      road-to-adoption-proof-and-ci-green.md. Pass `--json` for the
      machine-readable shape.
    cmd: ./scripts-run src/scripts/adoption_status {{.CLI_ARGS}}

  adoption:snapshot:
    silent: true
    desc: |
      Append one row to agents/runtime/metrics/adoption-snapshots.jsonl
      with the four public adoption signals (npm installs / version
      distribution / GitHub stars / topic-search rank). Phase D Step 2
      of road-to-adoption-proof-and-ci-green.md. Contract:
      docs/contracts/adoption-signal-floor.md (local-only by default;
      no consumer telemetry). Pass `--no-network` for a CI-side dry run.
    cmd: ./scripts-run src/scripts/adoption_snapshot {{.CLI_ARGS}}

  adoption:report:
    silent: true
    desc: |
