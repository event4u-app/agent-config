    cmd: ./scripts-run src/scripts/lint_skill_tools {{.QUIET_FLAG}}

  lint-agents-md:
    silent: true
    desc: Enforce the Thin-Root contract on AGENTS.md + templates/AGENTS.md (size caps, ≥40% pointer ratio, why-clause length, target resolution, emergency-triage block) — see .agent-src.uncondensed/skills/agents-md-thin-root/SKILL.md
    cmd: ./scripts-run src/scripts/lint_agents_md {{.QUIET_FLAG}}

  check-refs:
