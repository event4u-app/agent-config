    desc: "Fail on leftover merge/stash conflict state — unmerged index entries or <<<<<<< / >>>>>>> markers in tracked files (conflict-marker-guard hardening, 2026-06-15)"
    cmd: ./scripts-run src/scripts/check_no_conflict_markers {{.QUIET_FLAG}}

  check-secret-leak:
    silent: true
    desc: "Fail on a high-confidence secret in the changed set (diff vs origin/main + untracked) — the non-bypassable CI net behind the secret-vcs-guard rule (secret_detector)"
    cmd: ./scripts-run src/scripts/check_secret_leak

  check-secret-leak-pack:
    silent: true
    desc: "Fail on a high-confidence secret in what actually SHIPS — the npm pack payload, including shipped-but-gitignored paths (dist/cli/**) that every git-backed mode of the sibling gate cannot reach by construction. An additive mode nothing calls is indistinguishable from no mode at all, which is why this task exists rather than only the flag (road-to-publish-boundary-evidence Phase 2)"
    cmd: ./scripts-run src/scripts/check_secret_leak --pack

  check-publish-surface:
    silent: true
    desc: "Publish-surface drift gate — package.json files[] and .npmignore resolve to a committed artefact, so a change to what ships is a diff a reviewer reads instead of a silent change. files[] is an ALLOWLIST and overrides .npmignore for anything under an included root, which is why the artefact also reports which .npmignore patterns the live payload contradicts (road-to-publish-boundary-evidence Phase 3)"
    cmd: ./scripts-run src/scripts/check_publish_surface

  check-claims:
    silent: true
    desc: "Claims-Ledger gate — every <!-- claim:ID --> marker in README/docs binds to a backed, resolvable entry in docs/CLAIMS.md (road-to-final-state-and-market-readiness B1)"
    cmd: ./scripts-run src/scripts/check_claims {{.QUIET_FLAG}}

  check-adr-frontmatter:
    silent: true
    desc: "ADR frontmatter gate — required fields, valid status, and a named `review_trigger` CONDITION (not a cadence) on every ADR dated 2026-07-25 or later. Earlier ADRs warn; grandfathering is by date, not an allowlist (road-to-enforcement-proof P4.1-P4.4)"
    cmd: ./scripts-run src/scripts/check_adr_frontmatter

  check-adr-citations:
    silent: true
    desc: "ADR citation gate — every `ADR-NNN` named in src/rules, src/skills, src/domains or docs resolves to a real decision record; an unresolvable citation FAILS. NOT registered in gate-coverage.yml — the manifest keys on a name prefix this script does not carry, so registering it reddened gate_population.test.ts; the row and its reasoning sit in gate-coverage.yml where the entry would have been, and the cost is that this gate has no minimum-scan floor (road-to-evidence-based-adr-governance 2.3, which is also where the finding that no workflow ran this tool at all is recorded)"
    cmd: ./scripts-run src/scripts/adr_cite_check --cited

  check-adr-evidence-census:
    silent: true
    desc: "ADR evidence-census freshness — regenerates the proposal artifact to a temp path and FAILS if it differs from the committed agents/evidence/analysis/adr-evidence-census-2026-08.md. The census itself is proposal-only and never a gate; this target gates only the artifact's freshness, because AC-2 and AC-3 of road-to-evidence-based-adr-governance rest on those rows and, until this existed, the census was wired into nothing at all — no workflow step, no task target, no manifest row, no stated exemption (completion-review finding 8). NOT registered in src/config/gate-coverage.yml: gate_population.matchesGatePattern classifies on a name prefix (lint|check|audit|skill|verify_) and evidence_census.ts carries none of them, so a row there would red gate_population.test.ts — the same two-gates-disagree case already documented for adr_cite_check. Consequence: this step runs with no minimum-scan floor of its own, though the census asserts its own scan scope internally"
    cmd: |
      set -eu
      tmp="$(mktemp)"
      trap 'rm -f "$tmp"' EXIT
      ./scripts-run src/scripts/adr/evidence_census --out "$tmp" >/dev/null
      if ! diff -u agents/evidence/analysis/adr-evidence-census-2026-08.md "$tmp"; then
        echo "❌  adr-evidence-census: the committed artifact is stale. Run ./scripts-run src/scripts/adr/evidence_census and commit the result." >&2
        exit 1
      fi
      echo "✅  adr-evidence-census: committed artifact matches a fresh run"

  check-new-adr-evidence:
    silent: true
    desc: "New-ADR evidence gate — a decision record ADDED on this branch with `status: accepted` must carry `provenance.kind`, `evidence.strength` and an `## Evidence` section. Closes the first clause of AC-5 of road-to-evidence-based-adr-governance, which had no mechanism: `check_adr_frontmatter.check_descriptive_axes` validates the SHAPE of an axis that is present and a single-file linter has no notion of NEW, so a fresh record with none of the three passed every gate. Diff-scoped (`--diff-filter=A` vs the resolved base ref), so a branch that adds no record exits 0 — the pre-existing 147 accepted records are deliberately out of scope, same reasoning as lint_evidence_artifacts. `authority_basis: owner_intent` governs authority, never disclosure, and exempts nothing. Registered in src/config/gate-coverage.yml with an inert `min_scanned: 0` floor plus a real `--self-test`, because for a gate whose usual reading is zero added records only a self-test can prove the verdict still moves"
    cmd: ./scripts-run src/scripts/check_new_adr_evidence

  check-subagent-floor:
    silent: true
    desc: "Subagent safety-floor freshness — every dispatch prompt carries the generated floor derived from the kernel rules; drift FAILS (not WARN, unlike the reference implementation we took the idea from) (road-to-enforcement-proof P3.3)"
    cmd: ./scripts-run src/scripts/generate_subagent_floor --check

  lint-override-kernel-guard:
    silent: true
    desc: "Kernel-override audit — a `replace` on a kernel/safety-floor rule is refused, an `extend` on one needs a registered exception. Reports what exists; hard-fails only on this repo's own authoring surface, because the override layer is model-resolved and other relax routes are not visible to a linter (road-to-enforcement-proof P2.6)"
    cmd: ./scripts-run src/scripts/lint_override_kernel_guard --strict

  lint-output-slop:
    silent: true
    desc: "Fail on placeholder prose in the package's own authored artefacts (Lorem ipsum, `// rest of component`, `for brevity`, TODO-implement stubs) — the CI net the output-discipline rule has always claimed and, until now, did not have"
    cmd: ./scripts-run src/scripts/lint_output_slop

  lint-never-silent:
    silent: true
    desc: "No shipped rule, skill, or command may direct a silent re-run or the concealment of a detected miss — the hidden attempt→critic→re-attempt mechanism is falsified (ADR-106 gate, TERMINAL null) and correction is always visible. Prose that describes or forbids the mechanism stays legal (road-to-rule-delivery-integrity P4.4)"
    cmd: ./scripts-run src/scripts/lint_never_silent

  lint-spawn-payload:
    silent: true
    desc: "WARN-ONLY — makes the subagent-spawn-contract.md Iron Law (never bulk-dump context into a subagent) deterministic: per-tier payload size cap, no inline knowledge_refs bodies, no uncut >40-line file dumps, over JSON spawn fixtures + golden-transcript spawn payloads (road-to-lean-agent-init Phase 3). Promotion path: add --strict once caps hold across a clean observation window"
    cmd: ./scripts-run src/scripts/lint_spawn_payload

  lint-judge-prompt-expectation:
    silent: true
    desc: "WARN-ONLY — warns when a CAPTURED judge prompt states an expectation of the outcome, the softer form of pre-judging that evidence_independence's verdict phrase list does not catch (road-to-review-independence step 4.2). Always exits 0: a phrase list that could refuse a review would refuse its false positives too. Cannot see a paraphrase, an omitted prompt package, or a substituted prompt — all three stated in the script header"
    cmd: ./scripts-run src/scripts/lint_judge_prompt_expectation --quiet

  lint-pre-migration-refs:
    silent: true
    desc: "Fail on pre-migration install hints (pip install agent-config, python install.py, retired Python MCP entry) in shipped files — the doc-rot net from road-to-credible-install Phase 0 (ADR-200 retired the Python installer)"
    cmd: ./scripts-run src/scripts/lint_pre_migration_refs

  lint-consumer-internal-refs:
    silent: true
    desc: "Fail on maintainer-internal path/task references (Taskfile verbs, .agent-src.uncondensed/, src/scripts/ without the node_modules prefix, this package's own tests/scripts/, the ./scripts-run dispatcher) in consumer-projected skills — the doc-rot net from road-to-credible-install Phase 4 step 2 (review claimed 84/281, verified 17)"
    cmd: ./scripts-run src/scripts/lint_consumer_internal_refs

  lint-budget-ownership:
    silent: true
    desc: "Every gate-budget config under src/config/*budget*.json carries an owner + review date — anti-ossification lint (road-to-credible-install Phase 6.2); overdue review warns, missing date fails"
    cmd: ./scripts-run src/scripts/lint_budget_ownership

  evaluator-umbrella:
    desc: "The external evaluator's first five minutes as ONE suite over the PACKED artifact — audit, publint, headless tarball install, staleness lints, hook bench, cold-start/size/surface budgets, npx smoke (road-to-credible-install Phase 6.1; CI: evaluator-umbrella.yml on release PRs + nightly)"
    cmd: bash src/scripts/evaluator_umbrella.sh

  lint-governed-writes:
    silent: true
    desc: "Static scan for direct fs writes to protected ledger/governance surfaces (claims ledger, append-only intake/audit jsonl) that bypass the atomic-write layer — allowlist-free; zero findings is the pre-registered null (road-to-enforcement-peer-disposition P1)"
    cmd: ./scripts-run src/scripts/lint_governed_writes

  check-enforcement-coverage:
    silent: true
    desc: "Enforcement-coverage ratchet — each rule's enforced_by is RESOLVED, not trusted: the script must exist AND be reachable from a taskfile/workflow/hook manifest, and a fail_closed:false hook counts as observer, never validator. Blocking coverage may not fall; unwired declarations may not rise (road-to-enforcement-proof P1.4)"
    cmd: ./scripts-run src/scripts/check_enforcement_coverage --check

  check-artefact-counts:
    silent: true
    desc: "Artefact-count messaging gate — every count-shaped prose mention of skills/commands/governed rules/guidelines/personas on a flagship surface matches the source count; internal inconsistency (two different numbers for one kind) fails (road-to-truth-and-reference-hygiene Phase 1)"
    cmd: ./scripts-run src/scripts/check_artefact_count_messaging {{.QUIET_FLAG}}

  check-pack-size:
    silent: true
    desc: "Published-tarball payload budget — compressed size (absolute + >10% creep) and per-skill share of the skills subtree, with named exceptions. The UNPACKED size stays owned by evaluator-budgets; this gate covers the two axes nothing measured before (road-to-zero-ceremony-install Phase 4)"
    cmd: ./scripts-run src/scripts/check_pack_size

  report-pack-delta:
    silent: true
    desc: >-
      Branch-vs-base packed-payload delta — a REPORT, never a gate. The
      2026-08-24 cap trip was a merge artifact: main measured 8.3911 and the
      branch 8.4305 against a cap of 8.4, so neither side was over alone and no
      per-branch absolute check could see it. check-pack-size answers "is the
      total under the cap"; this answers "how much did THIS branch add", which is
      the number that would have made four cap raises visible while they were
      still small. Both refs are measured in unbuilt detached worktrees under
      pack-size-budget.json's own documented conditions — a delta between two
      figures measured differently is noise, and a built tree reads ~2 MB high.
      Exits 0 whatever the number: a threshold here would be a second cap with
      no derivation behind it.
    cmd: ./scripts-run src/scripts/report_pack_delta {{.CLI_ARGS}}

  check-dependency-floors:
    silent: true
    desc: "Runtime dependency-floor gate — every caret floor is a settled minor (^X.Y.0), every exact pin is a named ABI exception, so a consumer on prefer-offline or a lagging registry mirror cannot hit ETARGET. npm resolves dependencies before our bin runs, so this failure cannot be retried at runtime — only made unreachable at publish time (road-to-zero-ceremony-install Phase 2)"
    cmd: ./scripts-run src/scripts/check_dependency_floors

  check-preamble-payload:
    silent: true
    desc: "Per-spawn preamble payload ratchet — the deterministic in-repo payload (project-scope rules + skills catalog + project CLAUDE.md) may not grow past the pinned baseline + headroom. Every token here is re-written on EVERY subagent spawn, so growth is paid per spawn (road-to-cache-economy Phase 3, unblocked by C-3 at 38.0%). CEILING PARITY, added 2026-08-26: this used to invoke the gate bare, so it judged against the DESIGN ceiling (107,646) while standing-payload-delta.yml judges the same tree against the GRACE ceiling from ci_delivery (138,212, expires 2026-11-10). The tree measures 138,212, so `task ci` red on a number remote CI passes — the mirror image of the green-locally/red-remotely class check_ci_local_parity exists for, and just as misleading. The ceiling is read out of the budget file here for the same reason the workflow reads it: one home for the number, no second place to drift."
    cmd: |
      ceiling="$(python3 -c "import json;print(json.load(open('src/config/preamble-payload-budget.json'))['ci_delivery']['grace_ceiling'])")"
      ./scripts-run src/scripts/check_preamble_payload_budget --ceiling "$ceiling"

  check-standing-payload-delta:
    silent: true
    desc: "Per-PR standing-payload delta against the merge-base — the two-sided debit/credit ranking its sibling ratchet cannot show. A REPORT, not a gate: it never fails on the delta in either direction, only when it cannot measure. CORRECTED 2026-08-24 (road-to-standing-payload-truth AC-2): this used to justify itself with '(check-preamble-payload already fails on growth)', and that premise was FALSE -- that gate ran only in the local task chain and no workflow in .github/ invoked it, so nothing failed a pull request on preamble growth. It does now, behind a grace ceiling, as a step of standing-payload-delta.yml. Wired here so the number is reachable locally rather than discoverable only after a push (road-to-standing-payload-diet Phase 0.3-0.5)"
    cmd: ./scripts-run src/scripts/check_standing_payload_delta --base "$(git merge-base origin/main HEAD)" --rank

  check-static-layer-stability:
    silent: true
    desc: "Static-layer hygiene lint — machine-volatile markers (home paths, uuid-shaped ids) in the NON-kernel always-loaded layer; the kernel prefix keeps its own drift guard. Phase-1 null downgraded the cache-ordering phase to exactly this lint (road-to-token-economy-cache 2.2; spike: agents/settings/contexts/cache-injection-anatomy.md)"
    cmd: ./scripts-run src/scripts/check_static_layer_stability

  bench-hook-injection:
    silent: true
    desc: "Hook-injection byte budget gate — every concern's emitted reason/additional_context/context bytes vs src/config/hook-token-budget.json (the latency budget's twin); an emitting concern over its row is a red build (road-to-token-economy-cache 3.2)"
    cmd: ./scripts-run src/scripts/bench_hook_injection

  check-memory-replay:
    silent: true
    desc: "Memory-retrieval replay regression — the corpus-derived replay set's payload must stay within +5% of the pinned baseline (inert until internal/bench/reports/memory-retrieval-baseline.json exists; road-to-memory-retrieval-economy Phase 0)"
    cmd: ./scripts-run src/scripts/memory_replay --check

  check-second-brain-scorer:
    silent: true
    desc: "Second-brain recall scorer dry-run — the deterministic multi-session recall scorer must score the shipped good transcripts PASS and the bad ones FAIL (no model-in-the-loop, no spend; road-to-second-brain-delta-proof Phase 1)"
    cmd: ./scripts-run src/scripts/second_brain_score --dry-run

  check-second-brain-retrieval:
    silent: true
    desc: "Second-brain retrieval-precision dry-run — the REAL memory_lookup retrieval must still recall every needed decision into the top-k against the confuser store, and the stubbed arms must wire (deterministic, no spend; road-to-second-brain-retrieval-precision)"
    cmd: ./scripts-run src/scripts/second_brain_retrieval --dry-run

  check-eval-coverage:
    silent: true
    desc: "Behavioural-eval coverage ratchet — overall + per-tier coverage may not drop below the pinned floor (internal/evals/coverage-floor.json); the floor only rises via --write-floor after authoring evals (road-to-skill-eval-coverage Phase 3)"
    cmd: ./scripts-run src/scripts/skill_eval_coverage --check

  check-domain-soundness:
    silent: true
    desc: "Domain-soundness ratchet — the count of non-coding domain skills with a passing domain-truth fixture may not drop below the pinned floor (internal/evals/domain-soundness-floor.json); enforced honesty for the finance/founder/ops/content provenance claim (road-to-domain-soundness Phase 3)"
    cmd: ./scripts-run src/scripts/domain_soundness_status --check

  lint-behavioural-eval-freshness:
    silent: true
    desc: "Behavioural-eval freshness — a skill whose evals.json pins skill_body_sha must still match its SKILL.md body, or the eval is stale (deterministic, no token spend; unpinned evals out of scope; road-to-skill-eval-coverage Phase 3)"
    cmd: ./scripts-run src/scripts/lint_behavioural_eval_freshness {{.QUIET_FLAG}}

  lint-no-python-twin-rationale:
    silent: true
    desc: "Python-twin rationale guard — comments in src/scripts may not rationalise behaviour by fidelity to the deleted Python originals (twin of / latent quirks replicated / byte-identical to the Python); cite the live consumer instead (road-to-truth-and-reference-hygiene Phase 2)"
    cmd: ./scripts-run src/scripts/lint_no_python_twin_rationale {{.QUIET_FLAG}}

  check-skill-gaps:
    silent: true
    desc: "Skill honest-null gaps lock (B6) — every src/skills/*/SKILL.md gaps[].witness points at a test file that exists; keeps the proof-page 'Known Limits' from citing a phantom witness"
    cmd: ./scripts-run src/scripts/check_skill_gaps {{.QUIET_FLAG}}

  check-comparison:
    silent: true
    desc: "Comparison-honesty lock (B7) — every docs/comparison.yaml row's our_evidence pointer resolves (reuses the check_claims resolver); keeps the proof-page comparison 'checkable ✅' column from ever lying"
    cmd: ./scripts-run src/scripts/check_comparison {{.QUIET_FLAG}}

  check-structural-breaking:
    silent: true
    desc: "Fail when a structural break (artifact deleted/renamed, or a contract schema changed without an x-schemaVersion bump) lacks a breaking annotation — road-to-contract-integrity F3"
    cmd: ./scripts-run src/scripts/check_structural_breaking {{.QUIET_FLAG}}

  check-trigger-evals:
    silent: true
    desc: "Regression-lock skill trigger sets — every src/skills/*/evals/triggers.json carries a fresh (<=90d) last_eval and passes the offline structural smoke (road-to-contract-integrity F4)"
    cmd: ./scripts-run src/scripts/check_trigger_evals {{.QUIET_FLAG}}

  check-trigger-eval-presence:
    silent: true
    desc: "Presence ratchet — every skill outside the shrink-only grandfather allowlist ships evals/triggers.json (road-to-composition-ratchet)"
    cmd: ./scripts-run src/scripts/check_trigger_eval_presence {{.QUIET_FLAG}}

  lint-workflow-security:
    silent: true
    desc: "Warn-only audit of .github/workflows/* for high-risk patterns (pull_request_target untrusted checkout, write-all, install w/o --ignore-scripts, unpinned third-party actions) — road-to-security-hardening P2"
    cmd: ./scripts-run src/scripts/lint_workflow_security {{.QUIET_FLAG}}

  lint-missions:
    silent: true
    desc: "Validate src/missions/*/mission.yaml against mission.schema.json + catalogs against mission-catalog.schema.json (command safe-prefix allowlist) — road-to-mission-mode P2A"
    cmd: ./scripts-run src/scripts/lint_missions {{.QUIET_FLAG}}

  check-no-new-legacy-path:
    silent: true
    desc: "Regression guard — no NEW .agent-src.uncondensed/ references added under src/ (ADR-051)"
    cmd: ./scripts-run src/scripts/check_no_new_legacy_path

  check-refs-json:
    silent: true
    desc: Check for broken cross-references (JSON output)
    cmd: ./scripts-run src/scripts/check_references --format json

  check-portability:
    silent: true
    desc: Check package portability (no project-specific references)
    cmd: ./scripts-run src/scripts/check_portability

  check-no-external-sources:
    silent: true
    desc: Block readable external inspiration/harvest source names from the tracked tree (source-confidentiality rule + 2026-06-13 sweep); --report retains the warn tier, per the how-loud-the-slug-heuristic-is decision
    cmd: ./scripts-run src/scripts/check_no_external_sources --report agents/runtime/reports/source-shape.json

  check-source-pointer-freshness:
    silent: true
    desc: Fail when an authoring file names the retired .agent-src.uncondensed/ tree as source of truth (doc-follows-code — downstream-changes § Doc-Impact)
    cmd: ./scripts-run src/scripts/check_source_pointer_freshness

  check-module-management-neutral:
    silent: true
    desc: Verify module-management SKILL stays framework-neutral (Phase C of road-to-configurable-modules)
    cmd: ./scripts-run src/scripts/check_module_management_neutral

  check-release-trunk-sync:
    silent: true
    desc: Fail if main is more than one tagged release behind a release/X.Y.Z branch (P1.3 of road-to-productization, contract docs/contracts/release-trunk-sync.md)
    cmd: ./scripts-run src/scripts/check_release_trunk_sync

  check-release-published:
    silent: true
    desc: "Fail if main's package.json version has no matching tag (release merged but never tagged/published). No-ops off main; tag invariant only — the npm invariant runs in the scheduled release-drift workflow. See scripts/check_release_published.py"
    cmd: ./scripts-run src/scripts/check_release_published --strict --require-main

  validate-decision-engine:
    silent: true
    desc: Validate decision_engine block schema in agent-settings.template.yml and any local .agent-settings.yml (P2 of road-to-productization, contract docs/contracts/decision-engine-gates.md)
    cmd: ./scripts-run src/scripts/validate_decision_engine

  validate-agent-settings:
    silent: true
    desc: Enum-validate value-bearing settings keys (rule_loading_tier, memory.cadence, model.auto_switch, …) in agent-settings.template.yml + any local .agent-settings.yml against scripts/schemas/agent-settings.schema.json — prevents the value-vocabulary collision the 2026-06-01 rule_loading_tier untangle fixed
    cmd: ./scripts-run src/scripts/validate_agent_settings

  check-token-optimizer-freshness:
    silent: true
    desc: Verify token-optimizer catalog rows still match their cited assets (P1.3 of road-to-token-optimization)
    cmd: ./scripts-run src/scripts/check_token_optimizer_freshness

  check-examples-shape:
    silent: true
    desc: Lint docs/guidelines/agent-infra/*-demos.md for wrong/right/why shape (Phase 3.4 of road-to-context-layer-maturity)
    cmd: ./scripts-run src/scripts/lint_examples {{.QUIET_FLAG}}

  lint-roadmap-complexity:
    silent: true
    desc: Enforce roadmap-complexity-standard contract on agents/roadmaps/*.md (Phase 5.2 of road-to-context-layer-maturity)
    cmd: ./scripts-run src/scripts/lint_roadmap_complexity {{.QUIET_FLAG}}

  lint-roadmap-ci-steps:
    silent: true
    desc: Forbid full-pipeline CI steps (task ci / make test / npm run check) in roadmaps when quality.local_auto_run=false (roadmap-ci-steps-policy rule)
    cmd: ./scripts-run src/scripts/lint_roadmap_ci_steps {{.QUIET_FLAG}}

  report-imperative-density:
    silent: true
    desc: Advisory imperative-density ratio over authored rules and skills — gates on nothing; direction unsettled per the sweep record § R2
    cmd: ./scripts-run src/scripts/report_imperative_density

  report-skill-activation:
    silent: true
    desc: "Advisory skill-activation census (round-6 Phase 3.1) — shipped skills vs machine-matchable triggers vs actual invocations; gates on nothing and prints no rate, because none is available"
    cmd: ./scripts-run src/scripts/report_skill_activation {{.CLI_ARGS}}

  report-skill-obligation-violations:
    silent: true
    desc: "Advisory SK-2 loaded-but-violated (round-6 Phase 3.2) — a skill body was in context and a mechanisable obligation stated in it was violated later in the same session; leads with its coverage ratio (3 of 110 obligation lines are testable without judgement) and gates on nothing"
    cmd: ./scripts-run src/scripts/report_skill_obligation_violations {{.CLI_ARGS}}

  report-carrier-divergence:
    silent: true
    desc: "Advisory cross-carrier rule divergence (round-5 Phase 1.3) — which rules the project projection and the machine-global install deliver differently, by name; gates on nothing, because a checkout ahead of its own global install is the normal development state"
    cmd: ./scripts-run src/scripts/report_carrier_divergence {{.CLI_ARGS}}

  lint-settings-classes:
    silent: true
    desc: Every settings-template leaf carries an A/B/C class in docs/contracts/settings-classes.md (road-to-zero-ceremony-settings Phase 1)
    cmd: ./scripts-run src/scripts/lint_settings_classes {{.QUIET_FLAG}}

  lint-no-activation-gates:
    silent: true
    desc: |
      Always-on orchestration (road-to-always-on-orchestration Phase 1): the
      settings template may never reintroduce a per-layer on/off switch for
      subagents, council, or team — only the one audited incident switch
      (emergency.orchestration_halt) survives.
    cmd: ./scripts-run src/scripts/lint_no_activation_gates {{.QUIET_FLAG}}

  check-rule-evidence-declaration:
    silent: true
    desc: |
      Provenance-declaration gate for the ten security and safety floors
      (road-to-retired-claims-stay-retired Phase 3.2): each carries an
      `evidence:` block naming where its normative content came from, or
      records `source_type: own-analysis`. Scope is an explicit list in the
      gate — there is no frontmatter marker that delimits "safety floor", and
      a proxy would admit and drop rules as unrelated frontmatter moved.
    cmd: ./scripts-run src/scripts/check_rule_evidence_declaration {{.QUIET_FLAG}}

  lint-rule-enforcement-declaration:
    silent: true
    desc: |
      enforced_by-declaration ratchet (road-to-feedback-9-29 Phase 1.4): a NEW
      rule must declare its enforcement (validator/hook/test/observer or an
      honest none + body gap line); the 84 legacy undeclared rules are
      baselined in src/config/rule-enforcement-baseline.json, shrink-only.
    cmd: ./scripts-run src/scripts/lint_rule_enforcement_declaration {{.QUIET_FLAG}}

  lint-empty-roadmaps:
    silent: true
    desc: Reject empty (0-byte / whitespace-only) roadmap files under agents/roadmaps/ — backstop against auto-commit 0-byte stubs
    cmd: ./scripts-run src/scripts/lint_empty_roadmaps {{.QUIET_FLAG}}

  lint-symptom-intake:
    silent: true
    desc: |
      Warn when an operator symptom entry under agents/tickets/symptoms/ is
      unresolved more than 30 days after its reported date — it must carry either
      a `## confirmed:` block (defect + file:line at a pinned commit) or a
      `## null:` block (checked, not reproducible). Warn-only on purpose: intake
      must stay cheaper than the work it triggers, and a gate that reds CI
      because a human has not yet investigated a symptom teaches people to stop
      filing symptoms. Only a dead scan scope exits non-zero.
    cmd: ./scripts-run src/scripts/lint_symptom_intake {{.QUIET_FLAG}}

  lint-roadmap-family-cap:
    silent: true
    desc: |
      Enforce the skill-ecosystem roadmap concurrency cap (ADR-215 § D2 as
      amended by ADR-216 § D3). The cap is a capacity mechanism — one maintainer
      cannot hold N parallel workstreams — and it is the only surviving restraint
      after the adoption-anchored gates were struck, so it must be mechanical
      rather than carried by discipline. Counts top-level roadmaps only;
      archive/ later/ skipped/ stubs/ are not concurrently open.
    cmd: ./scripts-run src/scripts/lint_roadmap_family_cap {{.QUIET_FLAG}}

  check-rule-activation-census:
    silent: true
    desc: >
      Ratchet on the rule-activation split — which rules the Claude host loads on
      a path match and which load in every session. Two axes: the scoped/mixed ID
      SETS are pinned by identity, and the unconditional corpus's exact-BPE token
      total may only walk down. Exists because commit 33c7c20 moved nineteen
      rules from path-scoped to always-on in one emitter change and nothing in
      the repo would have caught it — the only witnesses were a commit body and,
      months later, an external analysis. A count-only check can be satisfied by
      one rule in and one rule out; the id-set axis cannot.
    cmd: ./scripts-run src/scripts/check_rule_activation_census {{.QUIET_FLAG}}

  check-rule-stub-ceiling:
    silent: true
    desc: >
      Hold a migrated rule at the size its pointer claims. 44 rules carry a line
      saying their body moved to a guideline, skill or context; nothing asserted
      they stay small, so migration was executed as an event and never encoded as
      a state. Two axes: every pointer target must resolve, and every migrated
      rule sits under a per-rule exact-BPE ceiling whose raises each carry a
      reason sentence. The aggregate census ratchet next door cannot catch this
      and is not meant to — it pins the CORPUS total with a drift allowance, so
      one rule growing while another shrinks is a green run. Measured at
      adoption, `context-hygiene` was 10,988 B against a 3,491 B migration
      target: the rule was three times the size of the file it migrated into.
    cmd: ./scripts-run src/scripts/check_rule_stub_ceiling {{.QUIET_FLAG}}

  lint-scheduled-deprecations:
    silent: true
    desc: |
      Check the `docs/MIGRATION.md` scheduled-deprecations table by arithmetic
      against the shipped `package.json` major, instead of by somebody
      remembering to read it. The release runbook's pre-flight already sends the
      releaser there with a manual checkbox whose own text says "A row left
      unread is how a removal commitment becomes folklore" — and a row was
      missed anyway, so the defect is the absence of a check.

      Deliberately asymmetric: an ordinary branch gets the report and exits 0,
      because an overdue row can be a considered deferral and a hard refusal
      everywhere would turn a judgement into an outage. `--cutting <X.Y.Z>`
      turns the same finding into a refusal, measured against the TARGET major
      rather than the shipped one — at the cut to N, package.json still reads
      N-1, so comparing against it would let the cut that CREATES a miss pass
      and only ever refuse rows already a major late. A row the grammar cannot
      resolve reds in BOTH modes: an invented due version would move a
      commitment silently, which is worse than a parse failure.

      Known and accepted: while a row is overdue the ⚠️ block prints on every
      run and no contributor can clear it — only the maintainer answering the
      row's blocker can. That is a standing notice, which is the mechanism that
      let the runbook checkbox fail in the first place, so it is bounded rather
      than assumed harmless: the row is refused at the next major cut, which is
      a hard stop no amount of habituation survives.
    cmd: ./scripts-run src/scripts/lint_scheduled_deprecations {{.QUIET_FLAG}}

  check-gate-completeness:
    silent: true
    desc: |
      Ratchet ledger adoption across the CI-registered gate estate. A gate
      either imports `_lib/gate_ledger.ts` (per-target completeness accounting,
      so "found nothing" and "looked at almost nothing" stop printing the same
      green line) or carries a `// ledger-exempt: <reason>` marker. Today's
      un-adopted count is the baseline and may only shrink — deliberately a
      ratchet rather than a 220-gate sweep, which would be an unreviewable diff.
    cmd: ./scripts-run src/scripts/check_gate_completeness {{.QUIET_FLAG}}

  check-suppression-hygiene:
    silent: true
    desc: |
      Shrink-only enforced against the BASE REF, not against a count — a count
      comparison passes swap-one-out-add-one-in, which keeps the number flat
      while the estate moves backwards. Also requires a `reason` on every
      human-authored suppression entry and a `falsifier` (a re-runnable command
      that decides it) on every NEW one, and fails on a suppression-shaped file
      the inventory does not declare.
    cmd: ./scripts-run src/scripts/check_suppression_hygiene {{.QUIET_FLAG}}

  check-review-dispositions:
    silent: true
    desc: |
      Archived review rounds must not leave a finding recorded `open` after it
      was fixed. Runs in the consistency workflow and, until now, nowhere
      locally — a CI-only gate with no reason it could not run here, which is
      the "local-only by neglect" direction inverted. Reachable locally now, so
      a contributor sees it before pushing.
    cmd: ./scripts-run src/scripts/check_review_dispositions {{.QUIET_FLAG}}

  check-no-currency-in-cost-surfaces:
    silent: true
    desc: |
      No cost surface prints a currency figure or a per-token rate. The suite
      does not know a consumer's contract, so a monetary figure would be
      extrapolated from a rate it invented — actionable and wrong, which is worse
      than absent. Scope is a named watchlist of four files, not a pattern:
      `cache_realization_report` legitimately carries a cost_usd block, and a
      pattern gate would be neutered with an allowlist within a release.
    cmd: ./scripts-run src/scripts/check_no_currency_in_cost_surfaces {{.QUIET_FLAG}}

  check-prefix-stable-mutation:
    silent: true
    desc: |
      The RUNTIME half of prefix stability. `check_kernel_prefix_stability`
      guards the kernel prefix at authoring time and `payload_hash_drift`
      measures churn after the fact; neither can see a hook rewriting a
      prefix-stable surface DURING a session, which invalidates the prompt cache
      for the rest of it and makes the next call pay the cache-write rate over
      the whole prefix. Fails a mid-session writer that declares no `re_arm:`
      boundary. Fails CLOSED on a write target it cannot classify when the same
      file carries a literal resolving into a declared surface.
    cmd: ./scripts-run src/scripts/check_prefix_stable_mutation {{.QUIET_FLAG}}

  check-loss-class-declared:
    silent: true
    desc: |
      A module that shortens, summarises, redacts or drops content on a path
      that reaches the model declares its loss class, and a `recoverable-lossy`
      declaration carries the recovery locator that distinguishes it from
      `ephemeral-lossy`. Scoped to model-facing paths per the council that
      resolved the strictness question; unknown reachability counts as
      model-reaching.
    cmd: ./scripts-run src/scripts/check_loss_class_declared {{.QUIET_FLAG}}

  check-benchmark-report-fields:
    silent: true
    desc: |
      Cache read:write ratio and stable-prefix share are REQUIRED fields on a
      benchmark report. A report that cannot compute one emits
      `{ unavailable: "<reason>" }` — never a blank and never a zero standing in
      for "not measured", which is the shape that turns a blind report into a
      believed one.
    cmd: ./scripts-run src/scripts/check_benchmark_report_fields {{.QUIET_FLAG}}

  lint-composition-review:
    silent: true
    desc: |
      The authoring-search record. A `composition_review` block that is present
      must be well-formed: its candidate resolves to a real artefact, and its
      `none`/`none_found` pair agrees — a record naming an incumbent that is not
      in the tree reads as evidence of a search that cannot have happened, which
      is worse than no record. An artefact ADDED without a record is reported
      and never blocks; flipping that needs a false-positive rate from a release
      of advisory operation, which does not exist yet.
    cmd: ./scripts-run src/scripts/lint_composition_review {{.QUIET_FLAG}}

  lint-evidence-artifacts:
    silent: true
    desc: |
      Every evidence artifact that declares a type must agree with the body it
      sits above (docs/contracts/evidence-artifact-types.md § 4), and the
      untyped remainder is published on every run so it shrinks observably.

      `--all` is the CI-identical argv on purpose. The gate's DEFAULT mode is
      changed-files scoped and its ordinary pass is `scanned: 0`, which is
      exactly the shape check_gate_coverage exists to reject — so the mode with
      a real, trippable floor is the one registered. The presence half (a
      newly written artifact must declare its type) runs in the pre-push path,
      where a base ref always resolves.
    cmd: |
      ./scripts-run src/scripts/lint_evidence_artifacts --all {{.QUIET_FLAG}} || {
        rc=$?;
        if [ "$rc" = "2" ]; then echo "⚠️  lint_evidence_artifacts: internal error — degraded advisory mode, allowing (exit-code contract §6)"; else exit "$rc"; fi;
      }

  check-estate-count:
    silent: true
    desc: |
      Roadmap-estate ratchet (road-to-estate-drawdown T2) plus the
      one-in-one-out lint (T3). The committed baseline in
      src/config/estate-count-budget.json walks DOWN only — growth in the
      active count, the later/ count or the open-blocker count is a policy
      failure — and a change that adds an active roadmap archives, parks or
      merges one in the same change unless the added file declares an
      estate_offset_exempt reason. Nothing read the estate as a whole before
      this gate: lint_roadmap_family_cap bounds one road-to-<family>-* family,
      and the total was visible only to whoever read the dashboard header.
      Exit-code contract: 0 pass, 1 policy violation, **2 blocks as well** — and
      that is a deliberate divergence from the R1/R2 steps beside it, which
      degrade exit 2 to warn-and-allow. Exit 2 here means the estate could not be
      counted (roadmap root moved, budget unreadable), and a ratchet that passes
      when it could not read its corpus is the false green the whole
      gate-coverage manifest exists to prevent. The warn-and-allow carve-out is
      for gates whose own fix they would otherwise block; this one has no such
      bootstrap.
    cmd: ./scripts-run src/scripts/check_estate_count

  lint-plan-risk-register:
    silent: true
    desc: |
      Gate R1 — every ready (non-draft) roadmap carries a schema-valid
      ## Risk Register (marker, ranked rows, mitigation + in-document anchor,
      staleness vs last substantial change, exact honest-null grammar).
      Grandfather clause for pre-activation roadmaps; drafts exempt.
      Contract: docs/contracts/plan-review-gates.md § 1. Exit-code contract:
      0 pass, 1 policy violation (block), 2 internal error → degraded
      advisory (warn-and-allow — a broken gate never blocks its own fix).
    cmd: |
      ./scripts-run src/scripts/lint_plan_risk_register {{.QUIET_FLAG}} || {
        rc=$?;
        if [ "$rc" = "2" ]; then echo "⚠️  lint_plan_risk_register: internal error — degraded advisory mode, allowing (exit-code contract §6)"; else exit "$rc"; fi;
      }

  check-completion-review:
    silent: true
    desc: |
      Gate R2 — completion-review artifact (findings-before-fixes, diff-hash
      bound, ancestry-checked) for the current branch diff. ADVISORY during
      the Stage-A baseline window (first 10 gated PRs): violations warn,
      exit 0. The enforced-mode flip removes --advisory (Stage B — see
      docs/contracts/plan-review-gates.md § Advisory window). Exit 2 =
      internal error → degraded advisory (warn-and-allow).
    cmd: |
      ./scripts-run src/scripts/check_completion_review --advisory --base origin/main || {
        rc=$?;
        if [ "$rc" = "2" ]; then echo "⚠️  check_completion_review: internal error — degraded advisory mode, allowing (exit-code contract §6)"; else exit "$rc"; fi;
      }

  check-review-prompt-binding:
    silent: true
    desc: |
      Gate R2 — the prompt→verdict binding. `prompt_hash` was written into every
      findings marker and compared to nothing; this re-derives it from the
      committed `<slug>.review-input/prompt.md` and runs the pre-loaded-verdict
      predicate over the text. Corpus-wide on purpose: a committed prompt and its
      hash are both immutable, so a break is branch-independent. Exit 2 =
      internal error → degraded advisory (warn-and-allow), per the exit-code
      contract § 6: a malformed baseline must not hard-block the PR that
      repairs it.
    cmd: |
      ./scripts-run src/scripts/check_review_prompt_binding || {
        rc=$?;
        if [ "$rc" = "2" ]; then echo "⚠️  check_review_prompt_binding: internal error — degraded advisory mode, allowing (exit-code contract §6)"; else exit "$rc"; fi;
      }

  check-r2-manifest:
    silent: true
    desc: |
      Gate R2 — context-manifest re-derivation (plan-review-gates §5): the
      manifest is verification, not self-attestation, so the input hashes are
      re-derived and a mismatch fails. Selection lives inside the script
      (`--verify-current`): grepping the header for the current HEAD sha can
      never match (§ 2.0), and looping over every artefact reds as soon as the
      tracked reviews dir holds another branch's artefact (§ 2.6 poisoning).
      Local mirror of the consistency-workflow step; exit 2 = degraded advisory.
    cmd: |
      ./scripts-run src/scripts/dispatch_r2_reviewer --verify-current --base origin/main || {
        rc=$?;
        if [ "$rc" = "2" ]; then echo "⚠️  dispatch_r2_reviewer --verify-current: internal error — degraded advisory mode, allowing"; else exit "$rc"; fi;
      }

  lint-roadmap-blockers:
    silent: true
    desc: Enforce the roadmap ## Blockers contract — required fields present, blocked-by references resolve (templates/roadmaps.md rule 20)
    cmd: ./scripts-run src/scripts/lint_roadmap_blockers {{.QUIET_FLAG}}

  lint-adr-sweep-routing:
    silent: true
    desc: Every REVIEW-NOW / SUPERSEDE (candidate) row in an ADR evidence sweep carries a route and a dated follow-up (road-to-evidence-based-adr-governance 3.4)
    cmd: ./scripts-run src/scripts/lint_adr_sweep_routing

  check-requirements-trace:
    silent: true
    desc: "Requirement-to-acceptance-to-evidence inventory over the active roadmap corpus — a LISTING, exits 0 always (road-to-requirements-traceability-minimal Phase 1)"
    cmd: ./scripts-run src/scripts/check_requirements_trace

  lint-roadmap-later-disposition:
    silent: true
    desc: Enforce the later/ disposition — status:later roadmaps live under agents/roadmaps/later/, and every later/ roadmap records a resume condition
    cmd: ./scripts-run src/scripts/lint_roadmap_later_disposition

  lint-tickets:
    silent: true
    desc: Build-readiness gate for ticket bundles — DoR floor, acyclic manifest graph, traceability spine, asset cap, split-severity staleness (ADR-101)
    cmd: ./scripts-run src/scripts/lint_ticket_buildable

  lint-commit-subjects:
    silent: true
    desc: Reject sloppy commit subjects (< 10 chars after Conventional-Commits prefix, or blocklist tokens wip/leftover/temp/tmp/fixup) feeding the auto-generated changelog (ADR-033 + road-to-distribution-identity Phase 3)
    cmd: |
      ./scripts-run src/scripts/lint_commit_subjects \
        --base "${LINT_BASE:-origin/main}" \
        --head "${LINT_HEAD:-HEAD}" {{.QUIET_FLAG}}

  lint-eval-specs:
    silent: true
    desc: Gate this package's own measurement inputs — duplicate keys, untracked fixtures, self-disagreeing derivations, graders that enforce nothing (road-to-skill-ecosystem-eval-integrity Phase 1)
    cmd: ./scripts-run src/scripts/lint_eval_specs {{.QUIET_FLAG}}

  lint-skill-link-reach:
    silent: true
    desc: Every cross-skill body link resolves inside the tree the installer deploys, not merely inside src/ (road-to-inbox-harvest-2026-08-f-skill-selection-evidence 2.2)
    cmd: ./scripts-run src/scripts/lint_skill_link_reach {{.QUIET_FLAG}}

  lint-canonical-terms:
    silent: true
    desc: Hold the house dialect recorded in src/config/canonical-terms.yml — ratchet over authored prose under src/ and docs/ (road-to-canonical-terms Phase 2)
    cmd: ./scripts-run src/scripts/lint_canonical_terms {{.QUIET_FLAG}}
  lint-memory-twin-parity:
    silent: true
    desc: Parity between src/scripts/ and src/agent-src/templates/scripts/ — both ship, and they diverged in both directions until road-to-memory-twin-reconciliation. Non-comment diff only; verdicts in src/config/memory-twin-verdicts.yml
    cmd: ./scripts-run src/scripts/lint_memory_twin_parity {{.QUIET_FLAG}}

  lint-host-portability:
    silent: true
    desc: A tool grant no host is known to honour, and a subagent_type that resolves to nothing — both are IGNORED at load, so the artefact reads restricted and is not (road-to-skill-ecosystem-runtime-enforcement Phase 3)
    cmd: ./scripts-run src/scripts/lint_host_portability {{.QUIET_FLAG}}

  lint-discovery-vocab:
    silent: true
    desc: Validate src/config/discovery/{workspaces,packs}.yml against ADR-013 frozen vocabulary, cross-refs, and ADR-010 non-overlap (R3 Phase 1)
    cmd: ./scripts-run src/scripts/lint_discovery_vocabulary {{.QUIET_FLAG}}

  lint-pack-risk-class:
    silent: true
    desc: Enforce the risk_class invariant — a high-risk pack must be off-by-default + consent + lab (road-to-capability-governance Phase 2)
    cmd: ./scripts-run src/scripts/lint_pack_risk_class {{.QUIET_FLAG}}

  lint-design-antipattern-parity:
    silent: true
    desc: Enforce catalog-to-rule parity — every design-antipattern entry classified, every backed entry matched by a slop rule (road-to-design-detector-evidence Phase 1)
    cmd: ./scripts-run src/scripts/lint_design_antipattern_parity {{.QUIET_FLAG}}

  check-trunk-drift:
    silent: true
    desc: "Advisory pre-PR check — fail if the branch is behind origin/main (road-to-product-clarity Phase 4b). Run in the /create-pr pre-flight; wire into blocking CI per branch-protection policy."
    cmd: ./scripts-run src/scripts/check_trunk_drift {{.QUIET_FLAG}}

  lint-profile-overlay-set-only:
    silent: true
    desc: Freeze the set-only overlay invariant — aliases resolve only to pack-id sets, no scalar audience-hint / precedence key feeds runtime.active_packs (session-profile-observability Phase 3, ADR-010 addendum)
    cmd: ./scripts-run src/scripts/lint_profile_overlay_set_only {{.QUIET_FLAG}}

  build-discovery-manifest:
    silent: true
    desc: Run the release-time discovery scanner — writes dist/discovery/discovery-manifest.{json,summary.md} (R3 Phase 2.1)
    cmd: ./scripts-run src/scripts/build_discovery_manifest --write {{.QUIET_FLAG}}

  build-discovery:
    silent: true
    desc: Alias for build-discovery-manifest — roadmap-stable name (monorepo Phase 2, ADR-015)
    deps: [build-discovery-manifest]

  validate-discovery-manifest:
    silent: true
    desc: Re-build the discovery manifest in memory and diff against the committed dist/discovery/discovery-manifest.json (monorepo Phase 2, ADR-015)
    cmd: ./scripts-run src/scripts/validate_discovery_manifest {{.QUIET_FLAG}}

  discovery-stats:
    silent: true
    desc: Pretty-print the stats block from the committed discovery manifest (monorepo Phase 2, ADR-015)
    cmd: ./scripts-run src/scripts/discovery_stats

  lint-discovery-manifest:
    silent: true
    desc: Validate dist/discovery/discovery-manifest.json against schema, checksum, and vocabulary cross-refs (R3 Phase 2.2)
    deps: [build-discovery-manifest]
    cmd: ./scripts-run src/scripts/lint_discovery_manifest {{.QUIET_FLAG}}

  lint-artefact-frontmatter:
    silent: true
    desc: Validate the five ADR-013 discovery keys on every skill/rule/command/template (R3 Phase 6.1)
    cmd: ./scripts-run src/scripts/lint_artefact_frontmatter {{.QUIET_FLAG}}

  lint-eval-freshness:
    silent: true
    # NOT yet in the ci-fast aggregate: it hard-fails until the SHA-pinned
    # corpus skills (design-intelligence) carry a recorded upstream.last_eval,
    # and that recording requires a LIVE trigger-eval run (token spend). Wire
    # this into the ci-fast `deps` together with the backfill — see
    # road-to-image-brand-typography Phase D + docs/guides/frontend-design-corpus-refresh.md.
    desc: Corpus-backed skills must carry a current upstream.last_eval (ADR-061 §6 refresh DoD; deterministic, no token spend)
    cmd: ./scripts-run src/scripts/lint_eval_freshness {{.QUIET_FLAG}}

  check-skill-requires:
    silent: true
    desc: Validate the skill-composition graph (requires_skills) — every sub-skill ships wherever its parent ships (roadmap 3.4)
    cmd: ./scripts-run src/scripts/check_skill_requires

  check-gate-paths:
    silent: true
    desc: Assert every gate that enforces a fixed packages/core/ target still resolves it (R2 of road-to-test-and-gate-integrity — guards the aab5755 silent-no-op class)
    cmd: ./scripts-run src/scripts/check_gate_paths

  check-test-coverage-diff:
    silent: true
    desc: WARN-only — flag a new scripts/check_*|lint_* gate added with no matching test (R3 of road-to-test-and-gate-integrity — calibrated nudge, exit 0; never blocks)
    cmd: ./scripts-run src/scripts/check_test_coverage_diff

  lint-model-tier-coverage:
    silent: true
    desc: Fail when a skill or command lacks a `recommended_model` value (ADR-034 / road-to-model-capability-tiers.md — explicit lite/medium/high or inherit required (ADR-035))
    cmd: ./scripts-run src/scripts/lint_model_tier_coverage {{.QUIET_FLAG}}

  lint-frontmatter-boilerplate:
    silent: true
    desc: Fail when an artefact carries a frontmatter field equal to its schema default (road-to-abstraction-reduction.md Phase 3 — omit it, the loader injects the default)
    cmd: ./scripts-run src/scripts/lint_frontmatter_boilerplate {{.QUIET_FLAG}}

  lint-trust-coherence:
    silent: true
    desc: Enforce safety-floor / HRR-banner / kernel-trust coherence across the manifest (monorepo Phase 5.4, ADR-018)
    deps: [build-discovery-manifest]
    cmd: ./scripts-run src/scripts/lint_trust_coherence {{.QUIET_FLAG}}

  lint-legal-pack:
    silent: true
    desc: Enforce the legal-safety-floor backstops (attorney-review line, Jurisdiction tag, freshness shape) over every legal-pack skill (road-to-legal-pack Phase 1)
    cmd: ./scripts-run src/scripts/lint_legal_pack {{.QUIET_FLAG}}

  lint-provenance:
    silent: true
    desc: >-
      Provenance ledger gate (road-to-provenance-and-license-governance S1.3) —
      STRICT from day one, no warn-only phase: checks provenance/borrows.jsonl
      against our own closed schema (not fuzzy similarity), fails every
      deny-class or unknown license and every missing/rename-only
      transformation_note, and fails if docs/THIRD-PARTY-NOTICES.md drifts
      from the ledger.
    cmd: ./scripts-run src/scripts/lint_provenance {{.QUIET_FLAG}}

  lint-metric-consumers:
    silent: true
    desc: >-
      Metric-registry gate (road-to-experience-loop-broadening 0.3) — every
      entry in src/config/metric-registry.yml names a consumer, the decision it
      feeds, and what fails without it. A metric with no consumer is telemetry
      decoration and should not land. Checks SHAPE, not truth: it makes the
      omission impossible, not the answer correct.
    cmd: ./scripts-run src/scripts/lint_metric_consumers {{.QUIET_FLAG}}

  lint-harvest-provenance:
    silent: true
    desc: >-
      Harvest ledger gate — the knowledge-side sibling of lint-provenance.
      Checks provenance/harvests.jsonl against its own closed schema, rejects an
      unpinned source_ref and a duplicate harvest_id, fails a row whose artefact
      no longer exists, and fails a `<!-- harvest:id -->` citation with no ledger
      row. Like its sibling it audits our own records, so it cannot see an
      unrecorded harvest — an empty ledger with zero citations is a legitimate
      pass and the green line says so.
    cmd: ./scripts-run src/scripts/lint_harvest_provenance {{.QUIET_FLAG}}

  check-score-contract:
    silent: true
    desc: >-
      Score-contract gate — an unreferenced prose "10" becomes impossible.
      `agents/evidence/ac-capability-scorecard.yaml` records one row per rubric
      category recoverable from the tracked tree; this gate makes `status` a
      DERIVED field, so a row whose status disagrees with its own evidence arrays
      fails and nobody can hand-award a `ten`. It also refuses `rubric.state:
      complete` while the authoritative 32-category rubric is unavailable — nine
      identities are unknown, and incompleteness is enforced rather than
      commented. It deliberately never judges outcome QUALITY: emptiness and
      resolvability only, because a judgement behind a gate is score theatre.
      Six negative-control twins under `tests/fixtures/score-contract/twins/`
      each red on exactly one finding code; `--self-test` drives the real binary
      against all six plus a dead-scan-root case.
    cmd: ./scripts-run src/scripts/check_score_contract {{.QUIET_FLAG}}

  check-supervision-claim-atomicity:
    silent: true
    desc: >-
      Atomicity gate for the runtime reversal (ADR-249). A public surface may
      state the adopted policy — resident processes are permitted only under the
      supervision contract — and may NOT assert, in the present tense, that a
      resident process IS supervised, bounded, isolated or auto-restarted while
      no lifecycle evidence exists for THIS revision. The evidence side refuses
      four separate things rather than checking a file is present: an unnamed
      suite, a result from another revision, a suite that did not exercise real
      processes, and a suite that ran nothing or skipped at least as much as it
      ran. `--self-test` drives the real binary against three seeded negatives
      (no evidence, an emptied suite, a foreign revision) plus a positive
      control, in a throwaway git repo so the revision check is meaningful.
    cmd: ./scripts-run src/scripts/check_supervision_claim_atomicity {{.QUIET_FLAG}}

  lint-skill-router-head:
    silent: true
    desc: >-
      Router-head gate — makes the published K6 cap (400 lines) enforced for NEW
      skills. Over the cap with no tasks/ or references/ directory is a monolith
      and fails; the four skills already over it sit in a SHRINK-ONLY allowlist
      that may lose entries and never gain them. Not a token or activation
      claim: what the host loads on trigger is unobservable from this tree, so
      the gate asserts only that an existing published contract now holds.
    cmd: ./scripts-run src/scripts/lint_skill_router_head {{.QUIET_FLAG}}

  reuse-lint:
    silent: true
    desc: >-
      REUSE 3.3 compliance gate (road-to-provenance-and-license-governance
      S4.2) — ci-strict only, since it needs the `reuse` Python tool present.
      Licensing is declared via path globs in REUSE.toml rather than ~1,700
      per-file SPDX headers: the same compliance outcome with a reviewable
      diff, and every declared path is first-party MIT. Skips cleanly with a
      notice when `reuse` is not installed, so a missing optional tool never
      fails the build.
    cmd: |
      if command -v reuse >/dev/null 2>&1; then
        reuse lint
      else
        echo "reuse-lint: skipped — the 'reuse' tool is not installed (pip install reuse)"
      fi

  lint-provenance-vocabulary:
    silent: true
    desc: >-
      Provenance-vocabulary gate (road-to-provenance-and-license-governance
      S3.2/S3.3) — STRICT from day one: bans "copyright-safe" and its near
      variants across README.md + docs/**, requires every approved-vocabulary
      use ("provenance-governed", etc.) to co-locate a "Scope & limits" box
      naming what is NOT detectable, and cross-checks every measured N/D
      figure in that box against docs/CLAIMS.md.
    cmd: ./scripts-run src/scripts/lint_provenance_vocabulary {{.QUIET_FLAG}}

  lint-explain-trace:
    silent: true
    desc: Validate an ExplainTrace v1 JSON file against docs/contracts/explain-trace.schema.json (explainability v2 Phase 1.2)
    cmd: ./scripts-run src/scripts/lint_explain_trace {{.CLI_ARGS}}

  check-discovery-determinism:
    silent: true
    desc: Run the discovery scanner twice and assert byte-identical output apart from generated_at (R3 Phase 2.3)
    cmd: ./scripts-run src/scripts/check_discovery_determinism

  check-artefact-checksums:
    silent: true
    desc: Re-hash every artefact in dist/discovery/discovery-manifest.json and assert the per-artefact checksum still matches the source bytes (monorepo Phase 2, ADR-015 §Phase 6)
    cmd: ./scripts-run src/scripts/check_artefact_checksums {{.QUIET_FLAG}}

  assert-discovery-in-tarball:
    silent: true
    desc: Assert dist/discovery/discovery-manifest.json ships in the `npm pack` tarball (R3 Phase 5.2)
    deps: [build-discovery-manifest]
    # --ignore-scripts keeps the JSON output clean — without it, the
    # prepack chain (vite build, discovery scanner) writes to stdout
    # and corrupts jq's input.
    cmd: npm pack --dry-run --json --ignore-scripts --silent | jq -e '.[0].files | map(.path) | any(. == "dist/discovery/discovery-manifest.json")'

  check-release-includes-discovery:
    silent: true
    desc: Assert dist/discovery/discovery-manifest.json exists and is non-empty before `npm publish` (R3 Phase 5.3)
    cmd: ./scripts-run src/scripts/check_release_includes_discovery

  lint-topics-yaml:
    silent: true
    desc: Validate `.github/topics.yml` shape (slug regex, length, duplicates, notes key, equivalents map) — R5 Phase 1.3
    cmd: ./scripts-run src/scripts/lint_topics_yaml {{.QUIET_FLAG}}

  sync-github-topics:
    silent: true
    desc: Dry-run diff of `.github/topics.yml` + `.github/about.yml` against the live GitHub repo. Pass `-- --apply` to mutate (requires GITHUB_TOKEN with admin:write) — R5 Phase 1.2
    cmd: ./scripts-run src/scripts/sync_github_metadata {{.CLI_ARGS}}

  build-mcp-registry-manifest:
    silent: true
    desc: Render dist/mcp/registry-manifest.json + the two payloads (awesome-mcp-servers row, Cloudflare catalogue entry) — R5 Phase 2.2
    cmd: ./scripts-run src/scripts/build_mcp_registry_manifest --write --strict {{.QUIET_FLAG}}

  lint-mcp-registry-manifest:
    silent: true
    desc: Validate dist/mcp/registry-manifest.json against the schema; assert payload shapes — R5 Phase 2 exit gate
    cmd: ./scripts-run src/scripts/lint_mcp_registry_manifest {{.QUIET_FLAG}}

  lint-positioning:
    silent: true
    desc: Assert README tagline ↔ package.json.description ↔ .github/about.yml agree and every topic appears in README — R5 Phase 3
    cmd: ./scripts-run src/scripts/lint_positioning {{.QUIET_FLAG}}

  check-gate-reachability:
    silent: true
    desc: >-
      Fail when a gate-shaped task target is reachable from neither `task ci`
      nor any workflow and carries no row in
      src/config/gate-reachability-exemptions.json — and when a row names a
      target that IS reachable, because an exemption nobody withdrew is how a
      registry stops being read.
    cmd: ./scripts-run src/scripts/check_gate_reachability --gate {{.QUIET_FLAG}}

  visibility-check:
    silent: true
    desc: Run every visibility-as-code lint in sequence (topics + MCP registry + positioning) — R5 Phase 3.3
    cmds:

      - task: lint-topics-yaml
      - task: lint-mcp-registry-manifest
      - task: lint-positioning

  lint-framework-leakage:
    silent: true
    desc: "Block PHP/Laravel/etc. leakage in generic skills/rules/commands (framework-neutrality-in-generic-skills rule)"
    cmd: ./scripts-run src/scripts/lint_framework_leakage {{.QUIET_FLAG}}

  lint-abstraction-thresholds:
    silent: true
    desc: "Extraction-threshold drift gate (ADR-213) — a numeric extraction threshold outside the canon must cite docs/guidelines/abstraction-thresholds.md; canon rows + citing sites are pinned bidirectionally"
    cmd: ./scripts-run src/scripts/lint_abstraction_thresholds {{.QUIET_FLAG}}

  lint-profile-personas:
    silent: true
    desc: "Profile → persona join gate — every defaults.personas id in src/agent-src/profiles/*.yml must resolve to a persona file under src/agent-src/personas/ (incl. advisors/)"
    cmd: ./scripts-run src/scripts/lint_profile_personas {{.QUIET_FLAG}}

  lint-token-budget-discipline:
    silent: true
    desc: "Token-budget discipline (token-budget-discipline rule) — rich-tagged skills stay under the 15% cap and carry a '## Why this skill is rich' section; invalid class values fail"
    cmd: ./scripts-run src/scripts/lint_token_budget_discipline {{.QUIET_FLAG}}

  lint-trigger-precision:
    silent: true
    desc: "Ratchet on short (<=3 char) keyword triggers — a keyword matches as an unanchored substring, so a new short one claims part of the language"
    cmd: ./scripts-run src/scripts/lint_trigger_precision {{.QUIET_FLAG}}

  lint-trigger-collisions:
    silent: true
    desc: "Every trigger value shared by >=2 routed rules carries a written collision_ok/precedence disposition in each sharer's frontmatter"
    cmd: ./scripts-run src/scripts/lint_trigger_collisions {{.QUIET_FLAG}}

  lint-context-spine-usage:
    silent: true
    desc: Verify every skill that declares context_spine cites each slot in its body (closes lint gap from 1.34.0)
    cmd: ./scripts-run src/scripts/lint_context_spine_usage {{.QUIET_FLAG}}

  check-surface-tiers:
    silent: true
    desc: "Surface-tier boundary guard — registry exhaustive over src/scripts/*/ and no core module hard-imports a lab module (road-to-install-contract-stability Phase 2)"
    cmd: ./scripts-run src/scripts/check_surface_tiers

  check-public-links:
    silent: true
    desc: Validate README/AGENTS.md/docs/architecture.md links into docs/contracts/ against stability frontmatter
    cmd: ./scripts-run src/scripts/check_public_links

  check-beta-review-markers:
    silent: true
    desc: Verify every stability=beta contract carries promote-to / keep-beta-until / superseded-by (P5.4)
    cmd: ./scripts-run src/scripts/check_beta_review_markers

  check-public-catalog-links:
    silent: true
    desc: Verify docs/catalog.md links resolve to shipped surfaces (no .agent-src.uncondensed/, all paths under package.json#files)
    cmd: ./scripts-run src/scripts/check_public_catalog_links {{.QUIET_FLAG}}

  check-md-language:
    silent: true
    desc: |
      Enforce docs/ are English (language-and-tone § ".md ALWAYS English").
      Scans every docs/**/*.md except the two generated catalogs
      (catalog.md / skills-catalog.md), whose German is sanctioned
      trigger-example data sourced from skill descriptions — see
      agents/reports/6.0.0-e-md-language-audit.md. Legitimately-required
      German (verbatim provenance quotes, quoted trigger/forbidden-pattern
      examples) is preserved via per-line `<!-- md-language-check: ignore -->`.
      Era-split archives (docs/archive/CHANGELOG-pre-*.md) are excluded for
      the same generated-and-verbatim reason: they quote commit subjects
      word-for-word and are declared read-only, so an umlaut in a historical
      subject fails the gate the moment a split moves it under docs/.
    cmd: ./scripts-run src/scripts/check_md_language $(find docs -name '*.md' ! -name 'catalog.md' ! -name 'skills-catalog.md' ! -path 'docs/archive/CHANGELOG-pre-*.md' | sort) {{.QUIET_FLAG}}

  check-command-count:
    silent: true
    desc: Verify README/AGENTS.md/docs/getting-started.md command counts match the cluster registry (active vs. shim split)
    cmd: ./scripts-run src/scripts/check_command_count_messaging {{.QUIET_FLAG}}

  lint-no-new-atomic-commands:
    silent: true
    desc: Fail when a new atomic command lands without a `cluster:` field (P0.8c)
    cmd: ./scripts-run src/scripts/lint_no_new_atomic_commands

  lint-command-budget:
    silent: true
    desc: "Fail when a newly visible command pushes its pack over the size_class budget (6.0.0-C Phase 1; existing commands grandfathered)"
    cmd: ./scripts-run src/scripts/audit_command_surface --check-new {{.QUIET_FLAG}}

  lint-command-verbs:
    silent: true
    desc: "Fail when a new/promoted visible command uses an unapproved verb or a banned create-* prefix (6.0.0-C Phase 2; ADR-041)"
    cmd: ./scripts-run src/scripts/lint_command_verbs {{.QUIET_FLAG}}

  check-skill-admissions:
    silent: true
    desc: >-
      Fail when a skill added since the base ref carries no row in
      agents/decisions/skill-admissions.jsonl, when an admission row's five
      skill-growth answers are missing or boilerplate, or when a `rejected` row
      names a skill that exists. Forward-only: the 299 pre-existing skills are
      grandfathered by the diff scope.
    cmd: ./scripts-run src/scripts/check_skill_admissions {{.QUIET_FLAG}}
  check-concern-admissions:
    silent: true
    desc: >-
      Fail when a hook concern added since the base ref carries no `admitted`
      row in agents/decisions/concern-admissions.jsonl, when a row's five
      answers are missing, or when a `rejected` row names a concern that
      exists. Forward-only: the 55 pre-existing concerns are grandfathered by
      the scope, which is a SET DIFFERENCE over concern ids rather than a file
      diff — a concern is a key inside one manifest, so a file-level diff would
      say only "the manifest changed" and discriminate nothing.
    cmd: ./scripts-run src/scripts/check_concern_admissions {{.QUIET_FLAG}}
  lint-skill-trigger-corpus:
    silent: true
    desc: >-
      Fail when a skill trigger corpus breaks the routing-matrix discipline —
      fewer than 3 positives or fewer than 2 near-misses. A changed or added
      corpus must additionally declare `"language": "de"` on one positive:
      declared, never detected, because a detector would pass German-looking
      English and fail short German.
    cmd: ./scripts-run src/scripts/lint_skill_trigger_corpus {{.QUIET_FLAG}}

  description-route-check:
    silent: true
    desc: >-
      Diff-scoped routing regression check on the DESCRIPTION surface (dry tier
      — no key, no network, no spend). Reachable locally so the CI job is not a
      gate only a workflow can run; the cached-live tier stays inside the key
      boundary and is scheduled, never per-PR.
    cmds:
      - "git diff --name-only origin/main...HEAD > /tmp/description-route-changed.txt || true"
      - "touch /tmp/description-route-changed.txt"
      - "./scripts-run src/scripts/description_route_check --changed-files /tmp/description-route-changed.txt --dry"

  check-routing-coverage:
    silent: true
    desc: >-
      Fail when routing-corpus coverage falls below its seed on either scope —
      rules (routing-matrix fixtures over routed router ids) or skills
      (evals/triggers.json over SKILL.md). A ratio, not a count: adding skills
      without corpus cases lowers coverage while every count rises.
    cmd: ./scripts-run src/scripts/check_routing_coverage {{.QUIET_FLAG}}

  check-command-examples:
    silent: true
    desc: >-
      Fail when a command a user can see (visibility: visible|advanced) carries
      no `## Examples` section, an invocation that does not resolve to its own
      name, an undocumented flag, or a Why line citing no registered
      prompt-pattern id. Forward-only: the 23 in-scope commands as of
      2026-08-24 are grandfathered in a frozen set inside the gate.
    cmd: ./scripts-run src/scripts/check_command_examples {{.QUIET_FLAG}}

  lint-command-routing:
    silent: true
    desc: "Fail when a visible command is missing required intent/routes_to/replaces frontmatter or a routing eval (6.0.0-C Phase 2 Steps 4b+5)"
    cmd: ./scripts-run src/scripts/lint_command_routing {{.QUIET_FLAG}}

  lint-skill-names:
    silent: true
    desc: "Fail when a command/skill name violates the Agent-Skills spec or differs from its path-derived slug (2026-06 Zed fix — colon names break Zed)"
    cmd: ./scripts-run src/scripts/lint_agent_skill_names {{.QUIET_FLAG}}

  lint-new-skill-gate:
    silent: true
    desc: "Fail when a NEW skill lacks a triggers stub or >70%-overlaps an existing same-domain skill (6.0.0-C Phase 4 Step 8b; back catalogue grandfathered)"
    cmd: ./scripts-run src/scripts/lint_new_skill_gate {{.QUIET_FLAG}}

  check-cluster-patterns:
    silent: true
    desc: Verify Phase-2 cluster dispatchers match Phase-1 reference structure (Phase 1 § 1.4.1)
    cmd: ./scripts-run src/scripts/check_cluster_patterns

  lint-orchestrator-auto-detect:
    silent: true
    desc: "Fail when an auto_detect orchestrator lacks the non-interactive-contract link or detection section (6.1.0 Step 1; AC1)"
    cmd: ./scripts-run src/scripts/lint_orchestrator_auto_detect {{.QUIET_FLAG}}

  lint-rule-interactions:
    silent: true
    desc: Validate docs/contracts/rule-interactions.yml schema, slugs, evidence paths, and anchor-pair coverage (P2.2)
    cmd: ./scripts-run src/scripts/lint_rule_interactions {{.QUIET_FLAG}}

  lint-load-context:
    silent: true
    desc: Validate the `load_context:` / `load_context_eager:` frontmatter schema (docs/contracts/load-context-schema.md)
    cmd: ./scripts-run src/scripts/lint_load_context {{.QUIET_FLAG}}

  check-context-paths:
    silent: true
    desc: Validate context-file path tree, basename collisions, and orphans (docs/contracts/context-paths.md)
    cmd: ./scripts-run src/scripts/check_context_paths

  check-no-roadmap-refs:
    silent: true
    desc: Stable artifacts must not cite specific files in agents/roadmaps/ (no-roadmap-references rule)
    cmd: ./scripts-run src/scripts/check_no_roadmap_refs

  check-no-stub-inventory-table:
    silent: true
    desc: agents/roadmaps/stubs/README.md must not carry an inventory table of its own directory
    cmd: ./scripts-run src/scripts/check_no_stub_inventory_table {{.QUIET_FLAG}}

  lint-documented-commands:
    silent: true
    desc: Every documented package command in shipped skill/rule/command docs resolves (reachability bug class; road-to-reachable-code-memory Phase 1)
    cmd: ./scripts-run src/scripts/lint_documented_commands

  lint-store-boundary:
    silent: true
    desc: No global-root literal in memory/knowledge index code outside the sanctioned path modules (ADR-130 invariant 1)
    cmd: ./scripts-run src/scripts/lint_store_boundary

  check-knowledge-cards:
    silent: true
    desc: "Knowledge-card pointer-CI — size ≤ 150, mandatory authoritative pointer, trust tagging, multi-evidence consistency (evidence-first structure discovery / ADR-097)"
    cmd: ./scripts-run src/scripts/check_knowledge_cards

  check-knowledge-pages:
    silent: true
    desc: "Warn-only lint for the lifecycle-typed knowledge pages (sessions/concepts/procedures/decisions) — road-to-knowledge-system Phase 2; never fails the build"
    cmd: ./scripts-run src/scripts/check_knowledge_pages

  lint-knowledge-scale:
    silent: true
    desc: "Warn-only scale + budget tripwires for the memory/knowledge substrate (intake/sessions/type/corpus/hot-context) — road-to-second-brain Phase 0; never fails the build"
    cmd: ./scripts-run src/scripts/lint_knowledge_scale {{.QUIET_FLAG}}

  lint-versioned-cache:
    silent: true
    desc: "Fail-on-violation gate: every derived cache-file path (`-index.json`, `-cache.json`, `.stat-index.json`, `.agent-learning.json` …) carries a version namespace OR an explicit invalidation comment — road-to-retrieval-substrate-hardening B5b"
    cmd: ./scripts-run src/scripts/lint_versioned_cache {{.QUIET_FLAG}}

  check-knowledge-sharing:
    silent: true
    desc: "Team-sharing gate over the STAGED git index — blocks staged agents/memory/intake/ files and visibility: private knowledge pages, warns on 5+ new pages in one commit (road-to-knowledge-system Phase 3). Wired as a pre-commit hook via install-hooks.sh; not part of the full CI chain since it depends on staged state, not repo state."
    cmd: ./scripts-run src/scripts/check_knowledge_sharing

  knowledge-global:
    silent: true
    desc: "Global knowledge-card store surface (ADR-100). Usage: task knowledge-global -- <list|show|trace|forget|promote|validate> [args]. Default: list."
    cmd: ./scripts-run src/scripts/knowledge_global_cli {{.CLI_ARGS | default "list"}}

  knowledge-global-validate:
    silent: true
    desc: "Validate the untracked global knowledge-card store (offline; --check-urls for live pointer check)."
    cmd: ./scripts-run src/scripts/knowledge_global_cli validate {{.CLI_ARGS}}

  check-no-local-settings:
    silent: true
    desc: .agent-settings.local.yml (per-machine override layer) must never be committed
    cmd: ./scripts-run src/scripts/check_no_local_settings_committed

  check-council-references:
    silent: true
    desc: Stable artifacts must not link specific files in agents/runtime/council/{questions,responses,sessions}/ (no-transient-references rule, council clause)
    cmd: ./scripts-run src/scripts/check_council_references {{.QUIET_FLAG}}

  lint-one-off-age:
    silent: true
    desc: Enforce the one-off-script lifecycle (docs/contracts/one-off-script-lifecycle.md)
    cmd: ./scripts-run src/scripts/lint_one_off_age

  check-reply-consistency:
    silent: true
    desc: Scan shipped sources for legacy (recommended) inline tags on numbered options
    cmd: ./scripts-run src/scripts/check_reply_consistency {{.QUIET_FLAG}} --scan-dir .agent-src.uncondensed

  check-iron-law-prominence:
    silent: true
    desc: Verify Iron Laws sit at the top of every rule file (H2, first 2 positions)
    cmd: ./scripts-run src/scripts/check_iron_law_prominence {{.QUIET_FLAG}}

  check-rule-invariants:
    silent: true
    desc: Kernel semantic invariants — load-bearing clauses of the 9 kernel rules must survive in src + dist (tests/golden/invariants.json; guards the #840/#844 lost-merge-content class)
    cmd: ./scripts-run src/scripts/check_rule_invariants

  lint-changelog-rollback:
    silent: true
    desc: New minor/major CHANGELOG sections above the current version must carry a `Rollback:` line (docs/contracts/release-sizing.md)
    cmd: ./scripts-run src/scripts/lint_changelog_rollback

  lint-breaking-changes-index:
    silent: true
    desc: A released `### BREAKING` CHANGELOG entry must be mirrored in BREAKING_CHANGES.md in the same diff (override trailer breaking-index-override)
    cmd: ./scripts-run src/scripts/lint_breaking_changes_index {{.QUIET_FLAG}}

  check-always-budget:
    silent: true
    desc: Always-rule budget gate (warn at 80%, fail at 90% of 49,000 chars)
    cmd: ./scripts-run src/scripts/check_always_budget {{.QUIET_FLAG}} --quiet

  check-kernel-rule-bundle:
    silent: true
    desc: Fail PRs that touch > 1 kernel rule (override label `bundled-always-rules-acknowledged`)
    cmd: ./scripts-run src/scripts/check_kernel_rule_bundle

  check-gate-coverage:
    silent: true
    desc: >-
      Meta-gate — verifies the gates in src/config/gate-coverage.yml actually inspect
      something (baseline floor, CI-identical argv, machine-readable `scanned:` count).
      Catches the class where a gate scans a dead root and exits 0; see ADR-201 context.
    cmd: ./scripts-run src/scripts/check_gate_coverage

  lint-decision-impact:
    silent: true
    desc: >-
      The evidence bar on `decision_impact: already-complied-with` — the one
      classification that permits removing a rule.
    cmd: ./scripts-run src/scripts/lint_decision_impact --quiet

  lint-rule-migration-ledger:
    silent: true
    desc: >-
      Every rule whose body was migrated out has a ledger, every pre-migration
      heading has exactly one disposition, every target anchor resolves.
    cmd: ./scripts-run src/scripts/lint_rule_migration_ledger --quiet

  lint-example-fences:
    silent: true
    desc: >-
      Hold authored fenced examples to the rules they sit beside — render-security
      sinks, credential literals, hook bypass. Strict: the corpus is at zero.
    cmd: ./scripts-run src/scripts/lint_example_fences --strict

  lint-workflow-paths:
    silent: true
    desc: >-
      A workflow `paths:` filter matching no tracked file never fires, and no
      other gate can see that — actionlint validates the schema, not the tree.
      Strict: the corpus is at zero.
    cmd: ./scripts-run src/scripts/lint_workflow_paths

  check-depth-budget:
    silent: true
    desc: >-
      Per-file ceiling on the on-demand depth layer (contexts + guidelines).
      Shrink-only ratchet — a fifth over-ceiling file reds.
    cmd: ./scripts-run src/scripts/check_depth_budget

  check-source-size-budget:
    silent: true
    desc: >-
      Growth ratchet over oversized TypeScript sources (src/**/*.ts, ceiling
      1,500 lines). The metric is TOTAL LINES ABOVE THE CEILING, not a file
      count, so growth inside an already-oversized file reds too.
    cmd: ./scripts-run src/scripts/check_source_size_budget

  check-augment-description-cap:
    silent: true
    desc: Auto-rule description-length gate (≤ 150 chars) — see road-to-augment-limit-fit P1.3
    cmd: ./scripts-run src/scripts/check_augment_description_cap

  check-augment-budget:
    silent: true
    desc: Augment workspace-guidelines budget meter (cap from src/config/budgets.yml; informational, never fails CI yet) — see road-to-augment-limit-fit P1.4
    cmd: ./scripts-run src/scripts/measure_augment_budget

  check-augment-budget-strict:
    silent: true
    desc: Augment workspace-guidelines budget gate (fails ≥95%) — wired into CI after road-to-augment-limit-fit Phase 4
    cmd: ./scripts-run src/scripts/measure_augment_budget --check

  check-one-off-location:
    silent: true
    desc: Fail if any _one_off_*.py script lands outside scripts/ai_council/one_off_archive/<YYYY-MM>/
    cmd: ./scripts-run src/scripts/check_one_off_location {{.QUIET_FLAG}} --quiet

  check-review-schema:
    silent: true
    desc: "Every committed review-findings ledger conforms to its schema and declares its independence consistently — a same-family reviewer set may not claim cross-model acceptance"
    cmd: ./scripts-run src/scripts/check_review_schema {{.QUIET_FLAG}}

  check-evaluator-schema:
    silent: true
    desc: "Every registered evaluator emits output conforming to evaluator-output.schema.json, over recorded verifier fixtures (green, red, and degraded — a green-only corpus cannot tell a working adapter from one that hardcodes success)"
    cmd: ./scripts-run src/scripts/check_evaluator_schema {{.QUIET_FLAG}}

  validate-schema:
    silent: true
    desc: Validate artefact frontmatter against JSON-Schema (scripts/schemas/)
    cmd: ./scripts-run src/scripts/validate_frontmatter

  lint-supported-tools-matrix:
    silent: true
    desc: README Supported-tools matrix ↔ adapter registry ↔ generator roots (fail on drift either direction — skill-quality-gates Phase 4)
    cmd: ./scripts-run src/scripts/lint_supported_tools_matrix

  check-bridge-derivation:
    silent: true
    desc: |
      Generated bridge trees derive from src/ — symlink targets valid,
      regeneration is a fixpoint (skill-quality-gates Phase 4). Regenerates
      .claude/.cursor/.windsurf/.augment as a side effect.
      Scoped to the roots this checkout writes: a root whose tool is off in
      agents/.agent-tools.yml has no regeneration path, so it is skipped and
      named on stderr. .augment is never skipped — its projection carries no
      tool gate.
    cmd: ./scripts-run src/scripts/check_bridge_derivation

  check-rule-projection-integrity:
    silent: true
    desc: |
      Host rule trees (.claude/rules, .cursor/rules, .clinerules) are complete
      against the generator's own emit plan and no entry is older than the
      dist/ rule it points at — conformance-round5 Phase 1.1/1.2. Pure read: it
      does NOT regenerate, which is what lets it see a stale tree at all.
      Run it BEFORE anything that regenerates.
    cmd: ./scripts-run src/scripts/check_rule_projection_integrity {{.CLI_ARGS}}

  check-detector-corpus:
    silent: true
    desc: |
      Every self-repair detector carries all three fixture classes — `fire`,
      `near-miss-fire`, `must-not-fire` — and every fixture behaves as its class
      says (road-to-rule-delivery-integrity P4.3). Precision and recall fail in
      opposite directions, so a corpus with only the easy half hides the other:
      before this gate, `detectUserReport` fired on "das ist fine, du hast
      nichts falsch gemacht" — an absolution scored as a complaint. A detector
      missing any class is a failure, not a warning.
    cmd: ./scripts-run src/scripts/check_detector_corpus {{.CLI_ARGS}}

  smoke-host-loadability:
    silent: true
    desc: Real-host loadability smoke — claude plugin validate + temp-home install + metadata cross-consistency. Self-skips (static checks only) when the claude CLI is absent; pass REQUIRE=1 for the release gate.
    cmd: bash src/scripts/smoke_host_loadability.sh {{if eq .REQUIRE "1"}}--require{{end}}

  quality-report:
    silent: true
    desc: Generate quality score report (per artifact type)
    cmd: ./scripts-run src/scripts/skill_linter --report

  # ---------------------------------------------------------------------------
  # TypeScript CLI shell gates — Phase 5.2 of
  # typescript-cli-and-local-gui-foundation. Narrow per-tool harnesses so each
  # phase's checkbox names exactly what it just produced (per
  # roadmap-ci-steps-policy). Wired into `task ci` below.
  # ---------------------------------------------------------------------------

  lint-role-experiences:
    silent: true
    desc: |
      Lint agents/roles/<slug>/ scaffolds — structural floor pinned in
      docs/contracts/role-experience.md (≥ 5 prompts, ≥ 3 first tasks,
      required frontmatter, every skill `id` resolves). Includes the
      `--plain-language` jargon scan (docs/contracts/plain-language-surface.md).
    cmd: ./scripts-run src/scripts/lint_role_experiences --plain-language

  lint-ts:
    silent: true
    desc: ESLint over src/**/*.ts (TS CLI shell — ADR-012)
    cmd: npm run lint:ts --silent

  typecheck-ts:
    silent: true
    desc: tsc --noEmit over tsconfig.json (TS CLI shell — ADR-012)
    cmd: npm run typecheck --silent

  build-ts:
    silent: true
    desc: Build dist/cli (TS CLI shell + UI bundle) — ADR-012
    cmd: npm run build --silent

  test-ts:
    silent: true
    desc: Vitest run over tests/{cli,server,ui}/**/*.ts (TS CLI shell — ADR-012)
    cmd: npm run test:ts --silent

  # Note: the `installer-typecheck` / `installer-test` gates were removed
  # in v4.0.0 — the TypeScript installer at `packages/core/installer/{src,
  # tests}` was deleted in road-to-unified-setup § D1. The unified setup
  # engine lives under `src/install/` and is covered by the root
  # `test:ts` gate above (Vitest run over `tests/**/*.ts`).
