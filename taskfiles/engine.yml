version: '3'

tasks:
  install:
    desc: Run the installer orchestrator (sync + bridges)
    cmd: bash src/scripts/install {{.CLI_ARGS}}

  install-hooks:
    desc: Install git hooks (pre-commit marketplace lint, pre-push sync check, chat-history bridges)
    cmd: bash src/scripts/install-hooks.sh

  first-run:
    desc: Show the recommended first-run experience for new users
    cmd: bash src/scripts/first-run.sh

  bench:
    silent: true
    desc: |
      Run the unified bench orchestrator (selection + cost + quality).
      Emits versioned JSON + Markdown reports under internal/bench/reports/.
      Usage: task bench -- --corpus dev
             task bench -- --corpus dev --top-k 3 --quiet
             task bench -- --corpus dev --agent-output outputs.json
      Step-4 Phase 2 deliverable; schema in
      docs/contracts/benchmark-report-schema.md.
    cmd: python3 src/scripts/bench_run.py {{.CLI_ARGS}}

  bench:baseline:
    silent: true
    desc: |
      Run the legacy selection-only baseline collector
      (scripts/bench_runner.py). Use when you only need top-K hit
      ratios without cost or quality scoring.
      Usage: task bench:baseline -- --corpus dev --json
    cmd: python3 src/scripts/bench_runner.py {{.CLI_ARGS}}

  bench:drift:
    silent: true
    desc: |
      Compare the latest bench report against the previous N runs for
      the same corpus. Step-4 Phase 3 Step 2. Exit 0 = no drift /
      warmup; exit 2 = drift detected (warn-only in CI per roadmap —
      not a merge gate until baseline closes).
      Usage: task bench:drift
             task bench:drift -- --corpus dev --window 5 --json
    cmd: python3 src/scripts/bench_drift_check.py {{.CLI_ARGS}}

  bench:baseline-ready:
    silent: true
    desc: |
      Single arbiter of "is the 60-day measurement baseline closed".
      Step-4 Phase 3 Step 4. Exit 0 iff days_elapsed ≥ 60 AND
      report_count ≥ 30. Read by P2 enforcement roadmaps (step-99 G1).
      Usage: task bench:baseline-ready
             task bench:baseline-ready -- --json
    cmd: python3 src/scripts/bench_baseline_ready.py {{.CLI_ARGS}}

  bench:projection:
    silent: true
    desc: |
      Per-tool projection-fidelity scorer (Augment / Claude / Cursor /
      Cline / Windsurf). Step-4 Phase 4. Computes
      selection_accuracy(tool) / selection_accuracy(reference=augment).
      Threshold 0.85 = fit-for-purpose; below = generate_tools.py
      mapping needs attention. Cursor / Cline / Windsurf are rules-only
      surfaces — reported as not_applicable. Exit 0 = all OK, exit 1 =
      one or more below threshold.
      Usage: task bench:projection
             task bench:projection -- --corpus dev --write-report
             task bench:projection -- --threshold 0.85 --json
    cmd: python3 src/scripts/bench_per_tool.py {{.CLI_ARGS}}

  test:
    silent: true
    desc: Run all tests (bash + Python, parallel where safe)
    cmds:
      - bash tests/test_install.sh --parallel
      - bash tests/test_install_orchestrator.sh --parallel
      - bash tests/test_install_openai_key.sh
      - bash tests/test_install_anthropic_key.sh
      - python3 -m pytest tests/ -n auto -q
      - task: test-ai-video

  test-ai-video:
    silent: true
    desc: Offline smoke test for the /video:* pipeline against banana-arc (Phase 6 Step 4)
    cmds:
      - bash src/scripts/ai-video/test-pipeline.sh

  test-installer-e2e:
    silent: true
    desc: "Container e2e — builds the installer-e2e image and runs the installer + wizard apply scenarios inside it (needs Docker; multi-minute build)."
    env:
      AGENT_CONFIG_E2E_DOCKER: "1"
    cmds:
      - python3 -m pytest tests/test_e2e_container_install.py -v

  video:smoke-trace:
    silent: true
    desc: "Capture an adapter smoke trace. Dry-run by default (no spend); pass PROVIDER=<id> and LIVE=1 for the real round-trip (needs a key + real spend — maintainer Hard Floor)."
    cmds:
      - bash src/scripts/ai-video/smoke-trace.sh --provider {{.PROVIDER | default "gemini-veo"}} {{if eq .LIVE "1"}}--live{{end}}

  test-install:
    silent: true
    desc: Run install.sh + orchestrator + install.py + key-script tests
    cmds:
      - bash tests/test_install.sh --parallel
      - bash tests/test_install_orchestrator.sh --parallel
      - bash tests/test_install_openai_key.sh
      - bash tests/test_install_anthropic_key.sh
      - python3 -m pytest tests/test_install_py.py -n auto -q

  test-install-local:
    silent: true
    desc: |
      End-to-end smoke test of the local installation flow. Packs the
      current checkout into a tarball, points setup.sh and the npx
      wrapper at it via AGENT_CONFIG_TARBALL_URL=file://..., runs both
      installers into temp dirs, and asserts .claude/ + .agent-settings.yml
      are populated. Offline (no network, no npm publish). Exits non-zero
      if any sub-test fails. Usage:
      task test-install-local
    cmd: bash tests/test_one_liner_entrypoints.sh

  test-python:
    silent: true
    desc: Run all Python unit tests (pytest-discovered)
    cmd: python3 -m pytest tests/ -n auto -q

  test-triggers:
    silent: true
    desc: "Run trigger eval for one skill (MockRouter, no API call). Usage: task test-triggers -- eloquent"
    cmd: python3 src/scripts/skill_trigger_eval.py --skill {{.CLI_ARGS}} --dry-run

  trigger-coverage:
    silent: true
    desc: "Deterministic MUST-LOAD floor — adversarial 'task → rule fires' cases vs dist/router.json (Phase 2.1/2.2). Gate at 100%; run before/after any Phase-3 rule demotion. Also gated in CI via `task test`."
    cmd: python3 src/scripts/trigger_coverage.py

  audit-tokens:
    silent: true
    desc: "Unified initial-context token audit (Phase 1.3): per-tool rule-body footprint + description-catalog cost + longest rules, in tokens (tiktoken when installed, else proxy). Writes internal/bench/reports/projection-cost.{md,json}."
    cmd: python3 src/scripts/audit_initial_context.py --write

  audit-tokens-budget:
    silent: true
    desc: "Token-budget gate (Phase 1.4): fail if a measured initial-context surface exceeds its configured budget. Budgets are advisory (None) until Phase 3 sets them — passes today."
    cmd: python3 src/scripts/audit_initial_context.py --fail-if-over-budget

  lean-projection-measure:
    silent: true
    desc: "Measure the thin-projection token delta (Phase 3.1): eager vs (kernel full + non-kernel pointers). Read-only — never writes the live projections. Set lean_projection.mode=thin + `task generate-tools` to actually thin (validate with bench:ab:live first)."
    cmd: python3 src/scripts/project_thin_rules.py --measure

  setup-evals:
    desc: "Bootstrap .venv/ with the pinned anthropic SDK for live trigger evals (idempotent)."
    cmd: bash src/scripts/setup_eval_venv.sh
    interactive: true

  install-anthropic-key:
    desc: |
      Install the Anthropic API key used by live trigger evals and the
      AI Council `anthropic` member. Interactive: key is read with no
      echo and stored in ~/.event4u/agent-config/anthropic.key (mode
      0600; legacy ~/.config/agent-config/anthropic.key read as
      fallback). Piped stdin is refused. Rerun to rotate.
    cmd: bash src/scripts/install_anthropic_key.sh
    interactive: true

  install-openai-key:
    desc: |
      Install the OpenAI API key used by the AI Council `openai`
      member. Interactive: key is read with no echo and stored in
      ~/.event4u/agent-config/openai.key (mode 0600; legacy
      ~/.config/agent-config/openai.key read as fallback). Piped stdin
      is refused. Rerun to rotate.
    cmd: bash src/scripts/install_openai_key.sh
    interactive: true

  test-triggers-live:
    desc: |
      Run trigger eval against Claude API. The runner enforces:
        1) key file ~/.event4u/agent-config/anthropic.key (mode 0600;
           legacy ~/.config/agent-config/anthropic.key read as fallback)
        2) interactive tty stdin
        3) explicit 'yes' at the pre-run cost preview
      Bootstrap once:        task setup-evals
      Install the key once:  task install-anthropic-key
      Usage: task test-triggers-live -- eloquent
    cmd: .venv/bin/python3 src/scripts/skill_trigger_eval.py --skill {{.CLI_ARGS}}
    preconditions:
      - sh: test -x .venv/bin/python3
        msg: ".venv missing — run 'task setup-evals' first"
    interactive: true

  test-linter:
    silent: true
    desc: Run skill linter tests
    cmd: python3 -m pytest tests/test_skill_linter.py -v

  test-readme-linter:
    silent: true
    desc: Run README linter tests
    cmd: python3 -m pytest tests/test_readme_linter.py -v

  test-marketplace-linter:
    silent: true
    desc: Run marketplace linter tests
    cmd: python3 -m pytest tests/test_lint_marketplace.py -v

  test-runtime:
    silent: true
    desc: Run runtime registry and dispatcher tests
    cmd: python3 -m pytest tests/test_runtime_registry.py tests/test_runtime_dispatcher.py -v

  test-ai-council:
    silent: true
    desc: Run AI Council tests (clients, bundler, orchestrator, prompts)
    cmd: python3 -m pytest tests/ai_council/ -v

  runtime-list:
    silent: true
    desc: List all runtime-capable skills
    cmd: python3 src/scripts/runtime_registry.py

  runtime-list-json:
    silent: true
    desc: List all runtime-capable skills (JSON output)
    cmd: python3 src/scripts/runtime_registry.py --format json

  runtime-validate:
    silent: true
    desc: Validate runtime registry consistency
    cmd: python3 src/scripts/runtime_registry.py --validate

  tool-list:
    silent: true
    desc: List all registered tools
    cmd: python3 src/scripts/tool_registry.py

  tool-validate:
    silent: true
    desc: Validate tool declarations
    cmd: python3 src/scripts/tool_registry.py --validate-tools {{.CLI_ARGS}}

  test-tools:
    silent: true
    desc: Run tool registry and adapter tests
    cmd: python3 -m pytest tests/test_tool_registry.py tests/test_tool_adapters.py -v

  test-runtime-all:
    silent: true
    desc: Run all runtime and tools tests
    cmd: python3 -m pytest tests/test_runtime_registry.py tests/test_runtime_dispatcher.py tests/test_runtime_handler.py tests/test_tool_registry.py tests/test_tool_adapters.py tests/test_ci_summary.py -v

  runtime-e2e:
    desc: End-to-end gate — dispatch each runnable pilot skill and fail on any non-zero exit
    cmds:
      - python3 src/scripts/runtime_dispatcher.py run --skill lint-skills
      - python3 src/scripts/runtime_dispatcher.py run --skill check-refs

  golden-replay:
    silent: true
    desc: Replay all Golden Transcripts against work_engine — fail on any structural drift (R1 P6)
    cmd: python3 -m pytest tests/golden/test_replay.py -v

  golden-replay-smoke:
    silent: true
    desc: Replay only the smoke-tagged Golden Transcripts — sub-second PR feedback (P2.4)
    cmd: python3 -m pytest tests/golden/test_replay.py -m smoke -v

  doctor-smoke:
    silent: true
    desc: |
      Manifest-correctness smoke test (P4.4). Runs the doctor command
      against the current repo's project lockfile and asserts the
      filesystem is in sync. Opt-in: not part of `task ci`. Useful
      after install / sync to verify manifest fidelity.
    cmd: python3 -m pytest tests/test_cmd_doctor.py -q

  smoke-quickstart:
    silent: true
    desc: |
      Structural smoke test for the README Quickstart path
      (road-to-productization P3.1a). Runs the installer into a
      tmpdir, asserts the documented default rule_loading_tier, and
      parses the decision_engine block through the runtime parser.
    cmd: python3 src/scripts/smoke_quickstart.py

  build-cloud-bundle:
    silent: true
    desc: "Build one cloud-skill ZIP (Anthropic Skills format) — usage: task build-cloud-bundle -- SKILL=name"
    cmd: python3 src/scripts/build_cloud_bundle.py --skill {{.SKILL}}

  build-cloud-bundles-all:
    silent: true
    desc: Build every eligible skill into dist/cloud/<name>.zip (T3-H skipped)
    cmd: python3 src/scripts/build_cloud_bundle.py --all --clean

  ci-cloud-bundle:
    silent: true
    desc: Validate cloud-bundle invariants without producing files (CI gate)
    cmd: python3 src/scripts/build_cloud_bundle.py --check

  audit-cloud:
    silent: true
    desc: Tier classification for cloud-distribution readiness
    cmd: python3 src/scripts/audit_cloud_compatibility.py {{.CLI_ARGS}}

  build-linear-digest:
    silent: true
    desc: Build the Linear AI rules digest (workspace + team + personal) into dist/linear/
    cmd: python3 src/scripts/build_linear_digest.py {{.CLI_ARGS}}

  ci-linear-digest:
    silent: true
    desc: Validate the Linear AI digest builds clean (CI gate, no per-rule drift, under budget)
    cmd: python3 src/scripts/build_linear_digest.py --strict-missing

  mcp:render:
    silent: true
    desc: "Render mcp.json → .cursor/mcp.json, .windsurf/mcp.json (add --claude-desktop for user-scope)"
    cmd: python3 src/scripts/mcp_render.py {{.CLI_ARGS}}

  mcp:check:
    silent: true
    desc: "Check MCP targets are in sync with mcp.json (non-zero exit if stale)"
    cmd: python3 src/scripts/mcp_render.py --check {{.CLI_ARGS}}

  memory:status:
    silent: true
    desc: "Engineering-memory observability — backend status, intake counts, curated staleness"
    cmd: python3 src/scripts/memory_report.py {{.CLI_ARGS}}

  check-memory:
    silent: true
    desc: "Validate agents/memory/ schema, statuses, and staleness (short-circuits if empty)"
    cmd: |
      if [ -d "agents/memory" ] && [ "$(find agents/memory -name '*.yml' 2>/dev/null | wc -l)" -gt 0 ]; then
        python3 src/scripts/check_memory.py --path agents/memory
      else
        echo "  ℹ️  no agents/memory/*.yml files — skipping"
      fi

  memory:shadow-report:
    silent: true
    desc: "Per-type shadow counts from the repo-vs-operational conflict rule (weekly cron target)"
    cmd: python3 src/scripts/check_memory.py --shadow-report {{.CLI_ARGS}}

  cost:
    silent: true
    desc: |
      Capture the active Claude Code session into
      agents/cost-tracking/sessions.jsonl, then check the budget.
      Surfaces the 50/75/90/100% alert ladder (sibling of the
      /cost:report skill). Step-4 Phase 2 Step 4.
      Usage: task cost
             BUDGET_PERIOD=week task cost
    cmds:
      - node src/scripts/cost/track.mjs {{.CLI_ARGS}}
      - node src/scripts/cost/budget.mjs check

  cost:budget:
    silent: true
    desc: |
      Get / set / check the project's cost budget. Wraps
      scripts/cost/budget.mjs — local jsonl store, no MCP.
      Usage: task cost:budget -- check
             task cost:budget -- set 50
             task cost:budget -- get
    cmd: node src/scripts/cost/budget.mjs {{.CLI_ARGS}}

  cost:track:
    silent: true
    desc: |
      Capture the active Claude Code session only (no budget check).
      Usage: task cost:track
             TRACK_QUIET=1 task cost:track
    cmd: node src/scripts/cost/track.mjs {{.CLI_ARGS}}

  cost:preflight:
    silent: true
    desc: |
      Hard-stop preflight hook (step-11 Phase 2 Step 3). Wraps
      scripts/cost/budget.mjs check; exits non-zero only when
      cost.enforcement is hard-stop AND level is HARD_STOP.
      Fail-open when no budget is configured.
      Surface: shell / CI wrappers invoke BEFORE composing a turn.
      Contract: docs/contracts/cost-enforcement.md
      ADR: docs/adrs/cost/0001-hard-stop-hook.md
      Usage: task cost:preflight
             PREFLIGHT_QUIET=1 task cost:preflight
    cmd: node src/scripts/cost/preflight.mjs

  test-cost-budget:
    silent: true
    desc: |
      Run the cost-budget fixture suite (step-11 Phase 2 Step 5).
      Exercises scripts/cost/budget.mjs and scripts/cost/preflight.mjs
      against tests/fixtures/cost/budget/{under-50,mid-75,high-90,at-100,over-100}.
      Asserts budget.mjs JSON matches expected.json and preflight exit
      code matches expected_exit. See tests/fixtures/cost/budget/README.md.
    cmd: node tests/cost/budget-fixtures.mjs

  smoke:
    silent: true
    desc: |
      Run all per-tier smoke contracts (step-11 Phase 3). Aggregates
      kernel, router, schema, skills smokes. Each ≤ 30 s wall.
      Contract: docs/contracts/smoke-contracts.md
    cmds:
      - task: smoke:kernel
      - task: smoke:router
      - task: smoke:schema
      - task: smoke:skills

  smoke:kernel:
    silent: true
    desc: |
      Kernel smoke (step-11 Phase 3.2): 9 rules · 8 Iron-Law fences ·
      ≤ 2 budget breaches. Contract: docs/contracts/smoke-contracts.md § 3.1
    cmd: scripts/smoke/kernel.sh

  smoke:router:
    silent: true
    desc: |
      Router smoke (step-11 Phase 3.3): 75 router ids · 0 broken rule
      pointers · ≤ 2 missing contracts.
      Contract: docs/contracts/smoke-contracts.md § 3.2
    cmd: scripts/smoke/router.sh

  smoke:schema:
    silent: true
    desc: |
      Schema smoke (step-11 Phase 3.4): 0 schema FAILs · ≤ 92 warns ·
      ≥ 438 lintable artefacts.
      Contract: docs/contracts/smoke-contracts.md § 3.3
    cmd: scripts/smoke/schema.sh

  smoke:skills:
    silent: true
    desc: |
      Skills smoke (step-11 Phase 3.5): 5 random skills (epoch-day seed)
      resolve, frontmatter validates, name matches directory.
      Contract: docs/contracts/smoke-contracts.md § 3.4
    cmd: scripts/smoke/skills.sh

  lint-adr-coverage:
    silent: true
    desc: |
      Per-area ADR coverage gate (step-11 Phase 4.5). Exits non-zero on
      hard failures (number gaps, missing area README, malformed
      filenames); emits warnings on missing bootstrap ADRs without
      failing. Contract: docs/contracts/adr-layout.md.
    cmd: python3 src/scripts/audit_adr_coverage.py --check

