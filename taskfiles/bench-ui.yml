version: '3'

# Port-fidelity benchmark — task entries.
#
# Phase 4 of `agents/roadmaps/archive/road-to-provided-artifact-honesty.md`.
# Pre-registration, weights, thresholds, and the determinism contract live in
# `internal/bench/ui/README.md`.
#
# Surfaces:
#   task bench:ui                 — score every configured candidate
#   task bench:ui -- --json       — same run, machine-readable
#   task bench:ui:repin           — start a NEW scoring epoch (deliberate)
#
# The runner lives under internal/ rather than src/scripts/ because it imports
# the @playwright/test devDependency and package.json files[] ships
# src/scripts/ to consumers. See the README's "Why it lives in internal/".

tasks:
  bench:ui:
    silent: true
    desc: |
      Score the port candidates against the provided design artifact held as
      ground truth. Four deterministic components (SSIM per breakpoint, DOM
      inventory, token recall, Playwright interaction checklist); no model in
      the scoring path. Refuses to run on a fixture-lock mismatch.
    cmd: npx tsx internal/bench/ui/run.ts {{.CLI_ARGS}}

  bench:ui:repin:
    silent: true
    desc: |
      Re-pin the fixture SHAs and score. This starts a NEW scoring epoch —
      previous numbers are not comparable to the ones it produces. Use when
      the fixture set genuinely changed, never to make a bad run go away.
    cmd: npx tsx internal/bench/ui/run.ts --update-lock {{.CLI_ARGS}}

  bench:design-slop-fp:
    silent: true
    desc: |
      Per-rule false-positive count for the design-slop registry, measured
      against a labelled clean-UI corpus. Every corpus file is clean by
      construction, so a finding is a false positive by definition; counting is
      per file, not per hit. Pre-registration and the declared ceiling live in
      internal/bench/corpora/design-slop-fp-PREREG.md. A different instrument
      from bench:ui, which scores port fidelity, not detector precision.
    cmd: npx tsx internal/bench/design-slop-fp/run.ts {{.CLI_ARGS}}

  bench:design-slop-nearmiss:
    silent: true
    desc: |
      M1 per design-slop rule on the near-miss corpus (tune / holdout), and
      precision on this repository's own UI (dogfood), each reported on its
      own. A rule keeps `backed` only at M1 = 0 on every split; pre-registration
      in internal/bench/corpora/design-slop-nearmiss-PREREG.md.
    cmd: npx tsx internal/bench/design-slop-nearmiss/run.ts {{.CLI_ARGS}}

  bench:design-slop-render:
    silent: true
    desc: |
      Renders the render-engine near-misses and positives in Chromium and checks
      the bar: no render rule fires on a near-miss (at the viewport it was
      written for), every render rule fires on its positive. Browser-gated;
      skips where no Chromium resolves.
    cmd: npx vitest run tests/scripts/design_slop_render_bench.test.ts

  bench:design-consistency-shadow:
    silent: true
    desc: |
      Shadow window for the two consistency findings (raw control beside a
      project primitive, box metrics off the role canonical) over this
      repository's own UI: audits src/ui, then records would_fire at 0/2/4 px
      into agents/runtime/state/design-consistency-shadow.jsonl and prints
      nothing. Report-only; the threshold is read off the recorded curve
      (road-to-a-control-that-matches-its-neighbours 3.3).
    cmds:
      - npx tsx src/cli/agent-config.ts ui:audit src/ui --json > /dev/null
      - npx tsx src/scripts/lint_design_consistency.ts --dir src/ui --shadow
