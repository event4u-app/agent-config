version: '3'

tasks:
  release:
    desc: |
      Release a new version end-to-end with auto-detected bump (the
      interactive/local entry point — for the unattended alternative, label
      a PR `release` and merge it; see .github/workflows/release.yml and
      ADR-113). Auto-detects major/minor/patch from Conventional Commits
      since the last tag (feat!: → major, feat: → minor, fix:/perf: →
      patch). Runs src/scripts/release.ts, which bumps package.json +
      marketplace.json + CHANGELOG, opens a release PR, waits for checks,
      merges, tags main, and creates a GitHub Release. The tag push
      triggers publish-npm.yml. Pass --yes to skip the confirmation prompt,
      --no-wait to merge without waiting for CI, or --dry-run to preview
      without touching git/gh. Usage:
      task release                     # interactive, auto-detect
      task release -- --dry-run        # preview only
      task release -- --yes --no-wait  # non-interactive
    interactive: true
    cmd: ./scripts-run src/scripts/release {{.CLI_ARGS}}

  release:verify:
    desc: |
      Run every release-PR assertion that can run locally, BEFORE anything is
      pushed. Derived from src/config/release-gate-locality.yml, which
      tests/scripts/release_gate_locality.test.ts keeps in step with
      .github/workflows/release-validation.yml — so a new release-validation job
      cannot land without either a local command here or a declared, classified
      reason it has none. Run it before `task release`; a failure here costs one
      local edit, the same failure on the release PR costs a branch, a PR and a
      CI run. Usage:
      task release:verify
      task release:verify -- --version 14.17.0
      task release:verify -- --list
    cmd: ./scripts-run src/scripts/release_verify {{.CLI_ARGS}}

  release:drill:
    desc: |
      Exercise the release step machinery (checkout → push → PR → checks →
      merge → tag → GitHub Release) against a SIMULATED git/gh world — no
      network, no git mutation, no spend. Runs the real execute() through
      every measured failure mode (rejected push, BEHIND head, merge race,
      hard merge failure, failing checks) plus the happy path. Run it after
      touching src/scripts/release.ts, before trusting a live release. The
      same scenarios run in CI via tests/scripts/release_drill.test.ts.
    cmd: ./scripts-run src/scripts/release_drill

  release:major:
    desc: |
      Force a major release (X+1.0.0) overriding auto-detect. Same
      pipeline and flags as `task release`. Usage:
      task release:major
      task release:major -- --dry-run
    interactive: true
    cmd: ./scripts-run src/scripts/release --as major {{.CLI_ARGS}}

  release:minor:
    desc: |
      Force a minor release (X.Y+1.0) overriding auto-detect. Same
      pipeline and flags as `task release`. Usage:
      task release:minor
      task release:minor -- --dry-run
    interactive: true
    cmd: ./scripts-run src/scripts/release --as minor {{.CLI_ARGS}}

  release:patch:
    desc: |
      Force a patch release (X.Y.Z+1) overriding auto-detect. Same
      pipeline and flags as `task release`. Usage:
      task release:patch
      task release:patch -- --dry-run
    interactive: true
    cmd: ./scripts-run src/scripts/release --as patch {{.CLI_ARGS}}

  release:version:
    desc: |
      Release an exact pinned version (e.g. to jump past a yanked
      version). Pass the target X.Y.Z as the first positional arg. Same
      pipeline and flags as `task release`. Usage:
      task release:version -- 2.0.0
      task release:version -- 2.0.0 --dry-run
    interactive: true
    cmd: ./scripts-run src/scripts/release --version {{.CLI_ARGS}}

  npm:login:
    desc: |
      Open the interactive npm login flow scoped to the @event4u org
      against the public registry. Web-auth (browser) + 2FA. Verifies
      with `npm whoami` and prints the org access list afterwards.
      Required for manual npm publishing fallback; routine releases run
      through publish-npm.yml on tag push. Usage:
      task npm:login
    cmds:
      - npm login --scope=@event4u --registry=https://registry.npmjs.org
      - cmd: npm whoami
      - cmd: npm access list packages @event4u


