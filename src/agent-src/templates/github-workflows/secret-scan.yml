# Secret Scan — template shipped by agent-config
#
# Copy this file to `.github/workflows/secret-scan.yml` in the consumer
# project. It is the NON-BYPASSABLE second layer behind the agent-side
# `secret-vcs-guard` rule: a client-side commit hook can be skipped with
# `--no-verify` or a GUI, but a required CI check cannot — a PR does not
# merge while this is red.
#
# Primary net: gitleaks (MIT) — the de-facto OSS standard, regex + entropy,
# zero local install. It scans the PR history/diff for committed secrets.
#
# If a real secret is found: ROTATE / REVOKE it now — a commit does not
# un-leak it (see skill:secrets-management for the remediation ordering and
# the tiered alternatives: .env + .env.example → cloud secret manager /
# Vault / Doppler → SOPS / Sealed Secrets → OIDC federation).
#
# False positives: add a narrow entry to `.gitleaks.toml` (allowlist) or an
# inline `# gitleaks:allow` marker — audited, never a global mute.
#
# Optional: teams that want live-credential VERIFICATION (is the secret still
# active?) can add a TruffleHog step — see the commented block below.

name: Secret Scan

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (committed-secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan the PR's new commits, not just HEAD.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Optional: live-credential verification (uncomment to enable) ──────────
  # trufflehog:
  #   name: trufflehog (verified secrets)
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #       with:
  #         fetch-depth: 0
  #     - name: Run TruffleHog
  #       uses: trufflesecurity/trufflehog@main
  #       with:
  #         extra_args: --results=verified,unknown
  #
  # ── Maintainers of agent-config itself run the built-in TS detector, which
  #    is the same engine the agent-side secret-vcs-guard rule uses:
  #        task check-secret-leak        # diff vs origin/main + untracked
  #        ./scripts-run src/scripts/check_secret_leak --all   # whole tree
