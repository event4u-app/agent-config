# Seed preset — strict
# Schema: docs/contracts/config-presets.md
preset:
  id: strict
  autonomy:
    default: off
    trivial_suppress: false
  confidence:
    min_band: high
    require_evidence: true
  risk:
    block_on:
      - security
      - prod_data
      - bulk_delete
      - schema_change
      - financial_paths
    ask_on:
      - code_paths
      - infra_change
  council:
    auto_consult: true
    cap_per_consult_usd: 1.00
  mcp:
    per_call_max_usd: 0.05
    per_session_max_usd: 1.00
  cost:
    daily_max_usd: 5.00
    weekly_max_usd: 20.00
    monthly_max_usd: 60.00
    enforce: hybrid
  notifications:
    threshold_pct:
      - 25
      - 50
      - 75
      - 90
      - 100
