# Discovery packs — closed vocabulary + capability-pack registry
#
# Source of truth (id vocabulary): docs/decisions/ADR-013-discovery-frontmatter-contract.md §packs
# Amendments to the id set require an ADR-013 amendment in the same PR.
#
# Capability-pack fields (`domain`, `size_class`, `requires`, `suggests`) are
# governed by docs/contracts/capability-packs.md (6.0.0-B Phase 0). They are
# REQUIRED for every in-use pack (≥1 referencing artefact) and ABSENT on
# reserved vocabulary ids that no artefact carries yet.
#
# `requires` is the hard dependency graph (transitive, acyclic) the resolver
#   expands. It supersedes the legacy `requires_hint` name; consumers read
#   `requires` and fall back to `requires_hint`. The manifest emits both during
#   the deprecation window.
# `suggests` is the soft companion graph (one-hop, advisory, never auto-installed).
# `size_class` is the per-pack VISIBLE-command budget input read by the 6.0.0-C
#   budget lint (core ≤8 · small ≤2 · medium ≤5 · large ≤8 · platform ≤10).
# `domain` is the single primary vertical (distinct from the `workspaces` list).
# `cluster: <language-id>` is advisory wizard grouping (road-to-wizard-ux-improvements
#   § Phase 4); the value must be a known pack id. The installer does NOT act on it.
# Lint: scripts/lint_discovery_vocabulary.py (vocab + graph) ·
#       scripts/lint_discovery_manifest.py (size_class ↔ artefact_count determinism)

