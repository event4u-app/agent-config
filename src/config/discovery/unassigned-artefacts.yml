# Discovery — unassigned-artefact quarantine
#
# Catch-all for artefacts that legitimately resist workspace/pack
# assignment. Each entry MUST carry a `reason:` field.
#
# Stays empty through Phases 1–3 of
# `agents/roadmaps/archive/automated-pack-workspace-and-skill-discovery.md`
# (archived, status: completed). Phase 4 populated it with the
# genuinely cross-cutting cases listed below.
#
# Lint: scripts/lint_artefact_frontmatter.py (added in Phase 6)
# Schema entry shape:
#
#   - path: <repo-relative-path-to-artefact>
#     reason: <one-line explanation>

# Scaffold templates — markdown skeletons consumed by `/agents init`,
# /skill-management, /override:create, etc. They carry no runtime
# frontmatter on purpose: the consuming command fills it in. Quarantined
# from the discovery manifest so strict mode stays clean.
- path: src/agent-src/templates/AGENTS.md
  reason: scaffold template for new project AGENTS.md; placeholders filled by /agents init
- path: src/agent-src/templates/agent-settings.md
  reason: scaffold for project .agent-settings.yml
- path: src/agent-src/templates/command.md
  reason: scaffold for new slash-command authoring
- path: src/agent-src/templates/tickets.md
  reason: scaffold template for ticket-bundle tickets (ADR-101); carries no runtime frontmatter — emit-tickets fills it in per ticket
- path: src/agent-src/templates/contexts.md
  reason: scaffold index for project contexts/
- path: src/agent-src/templates/playbook.md
  reason: scaffold for a Playbook context (ADR-244); its frontmatter is the PLAYBOOK'''s (task/scope/grade/invokes) and is shown in a fence, so the file itself carries none
