; Agent Config — Profile: minimal
; Best for: new users, solo developers, first-time adoption
; Token overhead: zero extra surface
;
; Default profile. Ships rules, skills, and commands only — no runtime
; dispatcher, no tool adapters. See docs/customization.md for the full
; profile description. scripts/install.py merges this file with
; config/agent-settings.template.ini to produce the user's .agent-settings.

rule_loading_tier=minimal

; Successor knob (ADR-110) — value preserves this preset's prior behaviour
; via the legacy mapping (minimal->off, balanced->essential, full->full).
discipline_profile=off

; Chat history (crash recovery) — minimal = lightest footprint
chat_history_frequency=per_turn

; ── Intended standing payload (road-to-delivered-cost-truth 1.2) ─────────
;
; The DENOMINATOR of `payload_amplification` — what this profile intends to
; deliver, NOT what it currently measures. A first cut declared the measurement
; and made the ratio 1.00 by construction; a number that cannot move is not a
; measurement. The gap between intended and delivered is the whole point.
;
; The figures are the published milestone in `src/config/preamble-payload-budget.json`
; (`baseline_tokens: 102520`, due 2026-11-10), split by category in the measured
; proportion — rules carry 90.2 % of the standing set and skill catalogue lines
; 9.8 % (asset_delivery_ledger, exact BPE, 2026-08-28).
;
; All three shipped profiles declare the SAME figures, and that is the finding
; rather than an oversight: the tier knob (`rule_loading_tier`) selects which
; rules ACTIVATE, not which are written into the preamble, so no shipped profile
; delivers a smaller standing payload than any other. Inventing three different
; numbers would imply a difference this suite does not have.
;
; `config_cost report` VERIFIES this before using it: a declaration above what
; the measured tree can deliver is refused, because a profile cannot intend to
; deliver more than exists and an inflated denominator makes any delivery look
; disciplined. Both AI council seats (2026-08-28, 2/2) raised that gaming
; direction independently.
declared_rules_tokens=92473
declared_skill_catalogue_tokens=10047
declared_payload_sanity_headroom=0.10
