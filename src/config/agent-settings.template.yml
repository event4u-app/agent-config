# Agent Settings
# This file is generated by scripts/install.py from
# config/agent-settings.template.yml. It holds personal and project-wide
# preferences. Run /onboard for first-run setup; for later edits, change
# values here directly or ask the agent (it follows the merge rules in
# .augment/guidelines/agent-infra/layered-settings.md).

# --- Agent config version pin ---
#
# Exact semver of the @event4u/agent-config release this project is
# pinned to. Used by `npx @event4u/agent-config <cmd>` to re-exec at
# the pinned version when the developer's local resolution differs.
# Empty string = unpinned (resolver picks the latest release; only safe
# for greenfield projects). Ranges (^, ~, >=) are NOT supported — the
# pin replaces lockfile determinism, so it must be exact.
# See docs/customization.md § "Agent config version pin" and
# docs/architecture.md § "npx-only distribution + version-pin governance".
agent_config_version: ""

# --- Profile (experience) ---
#
# Which experience you run. This is the FIRST question the setup wizard
# asks ("which experience?") — it selects your default skill / command
# surface, README entry-path, and persona pre-selection.
#   Valid ids: developer | content_creator | founder | agency | finance | ops
# See docs/contracts/profile-system.md and ADR-010.
#
# In 6.0.0-A this records the choice only — it does NOT yet narrow what
# gets projected into .claude/ .cursor/ .augment/. Pack-scoped surfacing
# (projection-time filtering, ADR-040) ships in 6.0.0-B behind a staged,
# opt-in rollout (legacy-all stays the default until evidence confirms
# the "too many surfaces" hypothesis). Switch experiences later with
# `agent-config use --profile=<id>`.
profile:
  id: developer

# --- Pack-scoped projection (ADR-040, 6.0.0-B) ---
#
# Whether the per-tool projector writes EVERY artefact into the host-tool
# trees (.claude/ .cursor/ .windsurf/) or only the active profile + packs'
# artefacts. See docs/decisions/ADR-040 and docs/contracts/capability-packs.md.
#
# scoped     = (DEFAULT for new installs — road-to-credible-install Phase 2,
#              2026-07-27) project only the active profile's `packs` unioned
#              with the runtime.active_packs overlay, expanded over the
#              `requires` graph. With the default `profile.id: developer`
#              this ships the engineering surface only; the full catalog is
#              one explicit opt-in away (`legacy-all` below, or
#              `agent-config use --profile=<id>` / packs overlay).
# legacy-all = project the full surface, exactly as 5.x did. EXISTING
#              installs keep their recorded setting on upgrade (this file is
#              never rewritten by `npm update`); a missing key also still
#              means legacy-all, so only fresh installs get the scoped
#              default. See MIGRATION.md for the flip note.
#
# Scoping is controlled by THIS key alone — never inferred from profile.id.
# A failed scoped projection restores the full tree. The committed plugin
# marketplace (.claude-plugin/) and the Augment tree (.augment/) always
# project the full set.
projection:
  mode: scoped
  # --- Consumer-scoped RULE projection (road-to-request-scoped-rule-load P1,
  #     opt-in) ---
  # Workspace scope for the RULE layer only (independent of `mode` above,
  # which covers skills/commands). Absent or empty = legacy-all: every rule
  # projects, exactly as today. Non-empty = only rules whose `workspaces:`
  # frontmatter intersects this list project into .claude/rules,
  # .cursor/rules, .windsurf/rules, .clinerules and .windsurfrules. Kernel
  # rules ALWAYS project (unconditional by definition); untagged rules fail
  # safe and ship. Example consumer scope:
  #   rule_workspaces: [engineering]
  # DEFAULT FLIPPED 2026-07-13 (the Phase-1 human gate, maintainer-approved,
  # evidence-gated): the default below lists EVERY consumer workspace, so
  # exactly the exclusively-maintainer specification rules drop from consumer
  # installs (the audited 16-rule lever — see
  # agents/settings/contexts/consumer-scoping-audit-2026-07-07.md) while all
  # domain safety floors and domain rules keep shipping. Narrowing further
  # (e.g. [engineering] only) stays a per-install user choice.
  # An EMPTY list is inactive (= legacy-all); only a non-empty list scopes.
  rule_workspaces: [engineering, product, finance, founder, gtm, ops, small-business, construction, legal-review-prep]
  #
  # Optional second axis, same semantics per pack ids (packs.yml). When set,
  # a non-kernel rule also needs a `packs:` intersection to project — e.g.
  # deselecting `frontend-design` removes ui-audit-gate + design-fidelity.
  # Empty = inactive, same as rule_workspaces.
  #
  # `rule_packs: auto` derives the id list from the ACTIVE-PACK set — the same
  # set the skill/command prune uses — instead of hand-typing ids that would
  # need re-typing whenever a pack is added. It exists because a domain safety
  # floor whose own body says "auto-activates when pack-X is installed" ships
  # today into installs that have no pack-X, where it guards nothing. Measured
  # on this repo (2026-08-02): `auto` drops 8 rules / 8,110 GPT tok — the six
  # domain floors plus provider-lifecycle-discipline and
  # spreadsheet-source-quality. `history-discipline` and `scale-discipline`
  # correctly SURVIVE (their packs are engineering-workspace packs).
  #
  # The DEFAULT stays `[]`. Flipping it to `auto` changes what a consumer
  # install receives and therefore inherits the same human release gate the
  # workspace axis carries (2026-07-13,
  # agents/settings/contexts/consumer-scoping-audit-2026-07-07.md) — that
  # audit's "unsure → ship it" ruling was about the maintainer-vs-consumer
  # WORKSPACE question, not about a pack condition the rule declares itself,
  # but the gate applies to the flip either way. Do not set this from
  # automation.
  rule_packs: []

# --- Discipline profile (successor knob, opt-in until the evidence gates pass) ---
#
# The ONE runtime knob for the discipline-rule tier (council verdicts
# 2026-07-07: weak-host-lift-tiering + token-program-integration). Measured
# on claude-haiku-4-5 (docs/benchmark.md § Cost-factor sweep):
#
# off       = kernel only (9 Iron-Law rules, ~1x tokens). For hosts with a
#             MEASURED null lift (src/config/host-capabilities.yml).
# essential = kernel + the lift-carrying rules (downstream-changes;
#             scope-control is already kernel). ~3.3x tokens, keeps a
#             significant discipline lift (+0.458, p=0.0135) — the full
#             package's residual over it is not significant (p=0.37).
# full      = every rule tier (~11.7x tokens). EXPERIMENTAL opt-in only:
#             residual lift over essential not established.
# auto      = resolve per session against host-capabilities.yml — measured
#             NULL-lift model -> off; unmeasured Claude-family -> essential;
#             unmeasured non-Claude -> off (P2 verdict, vendor-granular).
#
# This key WINS over the legacy `rule_loading_tier` below (mapping when
# absent: minimal->off, balanced->essential, full->full, custom->custom).
# The installer fills the placeholder per preset: minimal->off,
# balanced->auto, full->full. `auto` is evidence-gated per the P2 verdict
# (council 2026-07-07): the P2 non-Claude replication FAILED (gpt-5-mini,
# n=90, docs/benchmark.md), so `auto` enables the lift only where measured
# — unmeasured Claude-family hosts -> essential (the measured-lift class);
# measured-null hosts and unmeasured non-Claude hosts -> off
# (vendor-granular unknown_defaults in src/config/host-capabilities.yml).
discipline_profile: __DISCIPLINE_PROFILE__

# OPT-IN PRESET — the measured-lift configuration, shown but NOT shipped.
#
# The evidence above says `essential` carries the significant discipline lift
# (+0.458, p=0.0135) while `full`'s residual over it is not significant
# (p=0.37). That reads like an argument to flip the shipped default. It is not,
# for two independent reasons, and both are worth stating where the key lives
# rather than in a roadmap nobody reads at install time.
#
#   1. This key family is marked "do not set this from automation". That reads
#      as ABSOLUTE — it forbids an automated CHOICE of default for the family,
#      not merely a script rewriting your file. No measurement, however clean,
#      licenses an agent to flip it on your behalf.
#   2. The flip was pre-registered against a fresh-install census of
#      <= 30k tokens of always-on rule prose. Measured at audit time: ~163k as
#      loaded, i.e. 5.4x the target. The criterion fails on its own terms
#      regardless of point 1.
#
# So the better-evidenced value is carried here as a visible option you may
# uncomment, with its cost stated inline. Uncomment the line below to replace
# the resolved value above:
#
#   discipline_profile: essential      # ~3.3x kernel tokens (vs ~11.7x for full)
#
# Read the two factors as what they are: multiples of the kernel-only baseline
# from the cost-factor sweep, NOT the fresh-install census. They answer "what
# does this tier cost relative to `off`", never "does this tier reach 30k" —
# nothing has measured the latter for `essential`, and this comment does not
# claim it does.
#
# Recorded 2026-08-14 on an outside opinion (1 seat, 2 rounds; the second seat
# failed to start, so a single-model judgement on its checkable merit and NOT a
# convergence). It rejected both the flip and the do-nothing, and proposed this
# third route: you see the option, nothing automated chose for you.

# --- Cost profile (legacy knob — superseded by discipline_profile above) ---
#
# Master switch that controls which rule tiers load each session.
# See docs/customization.md for the authoritative description and
# docs/contracts/rule-router.md for the kernel + router architecture.
#
# minimal  = kernel only (always-loaded Iron-Law floor, ≤ 26k chars).
#            No router, no auto-rules. Lowest token footprint.
# balanced = kernel + tier-1 auto-rules (default — current behaviour superset).
# full     = kernel + tier-1 + tier-2 (everything, highest token cost).
# custom   = ignore profile — every matrix value must be set explicitly.
rule_loading_tier: __RULE_LOADING_TIER__

# --- Lean projection (experimental, opt-in) ---
#
# How the per-tool projector emits the rule layer. See
# docs/contracts/rule-router.md § Kill-switch.
#
# eager-all = every rule body inlined into every projection (DEFAULT,
#             today's behaviour). Safe — bodies are always in context.
# thin      = kernel rules full-bodied + non-kernel rules as
#             router-resolved pointers (the agent loads the body on
#             trigger-match). Measured ~45k GPT-tok lighter per session
#             (77% of the rule layer). EXPERIMENTAL: a thin projection
#             only holds behaviour if the pointer is resolved on match —
#             validate with `task bench:ab:live` before flipping, and
#             keep `task trigger-coverage` at 100%. One-flip revert:
#             set eager-all + `task generate-tools`.
lean_projection:
  mode: eager-all

# --- Telegraph condensation (output-side) ---
#
# `speak: false` is the shipped default per
# docs/adrs/telegraph/0001-default-off-until-bench.md (Status: accepted) and
# docs/contracts/condensation-default-kill-criterion.md.
# Reason it is off: the only output-side bench (telegraph-v1, n=10, 2026-05-16)
# measured median vs_terse -9.27% (API counts) / -5.47% (exact cl100k_base
# re-analysis) — telegraph emits MORE tokens than a plain "be terse" instruction.
# The kill-criterion table therefore lands on "criterion not met — defer" and the
# telemetry multiplier stays suspended (0.9155 < 1.0).
#
# Stated explicitly here because until 2026-07-29 this default existed only in
# prose — and two prose sources disagreed. Do not flip without a passing
# output-side bench.
telegraph:
  # speak: false = DORMANT (the shipped default per docs/adrs/telegraph/0002).
  # The rule is omitted from dist/router.json entirely, so its ~982-token body
  # never ships. This is the only lever that stops the cost: compile_router
  # gates on `speak` and on nothing else.
  # Set true only after an output-side bench clears the kill-criterion bar.
  speak: false

# --- Token-rich skills governance ---
#
# Skills marked `token_budget_class: rich` in their frontmatter are exempt
# from telegraph-speak condensation and thin-projector trimming. They load
# their full content (examples, tables, code blocks) to maximize design-output
# quality. This setting controls whether that extra spend is allowed globally.
#
# Values:
#   on   — rich skills load in full (default; recommended for design-intensive workflows)
#   off  — rich skills fall back to standard condensed behavior
#   ask  — before loading a rich skill, the agent surfaces an estimated token
#          delta (≈ file size in chars / 4, reported in tokens not dollars) and
#          asks the user once; the answer is cached for the session
#
# Configurable in the browser setup wizard (Setup → Skills → Token budget).
tokens:
  rich_skills: "on"

# --- Cost tracking + budget enforcement ---
#
# USD budgets evaluated against `agents/cost-tracking/sessions.jsonl` by
# `scripts/cost/budget.mjs`. Empty / 0 = unbudgeted (no enforcement,
# `cost:check` reports spend only). See docs/contracts/cost-enforcement.md
# for the full contract (tier ladder, hook surface, bypass mechanism).
cost:
  budgets:
    # Daily USD ceiling (rolling 24h). 0 / null = no daily budget.
    daily: 0
    # Weekly USD ceiling (rolling 7d). 0 / null = no weekly budget.
    weekly: 0
    # Monthly USD ceiling (rolling 30d). 0 / null = no monthly budget.
    monthly: 0
    # Per-model-tier USD ceilings for budget-aware cheap-request delegation
    # (docs/contracts/budget-routing.md; council 2026-08-03). null = no
    # separate tier cap — the global ceilings above still apply and the
    # budget-routing relation works purely off them. Set a value to cap one
    # tier (e.g. cheap: 10 keeps haiku-class delegation under $10/day-window
    # of the ledger). Informational since the budget_routing key was removed
    # (always-on orchestration): routing is judgment-ladder-driven.
    per_tier:
      cheap: null
      medium: null
      strong: null
  # Enforcement mode at the HARD_STOP tier (100% utilization):
  #   advisory  = dashboards and `cost:check` show the breach; agent
  #               keeps working. Default. Safe for greenfield projects.
  #   hard-stop = preflight hook (scripts/cost/preflight.mjs) exits
  #               non-zero on HARD_STOP; CI / shell wrappers refuse to
  #               start the turn until the budget is raised or reset.
  enforcement: advisory

# --- Per-skill model auto-switch (ADR-035) ---
# Skills declare a vendor-neutral `model_tier` (lite|medium|high); the generator
# maps it to a native Claude model (high→opus, medium→sonnet, lite→haiku).
#   suggest = (default) never emit a native Claude `model:` key; the
#             model-recommendation rule names the tier as a one-question
#             suggestion on every surface — never silently overrides /model.
#   auto    = render a native Claude `model:` into lite/medium/high-tier skills
#             (Claude switches for that turn, reverts next prompt); suggest
#             on surfaces without a native override.
#   off     = inert — no native key, no suggestion.
model:
  auto_switch: suggest

# --- Personal preferences ---
personal:
  # IDE to use for opening files (code, phpstorm, cursor, …)
  # Empty = agent will not auto-open files; fill in once if you want that.
  ide: ""

  # Automatically open edited files in the IDE (true, false)
  open_edited_files: false

  # rtk (Rust Token Killer) installed for output filtering (true, false)
  # Agent will auto-detect and ask once, then store the result
  rtk_installed: false

  # Minimal output mode (true, false)
  # true  = short bullet points during work, concise summary at the end
  # false = verbose explanations and reasoning
  minimal_output: true

  # Play-by-play mode (true, false)
  # true  = briefly share intermediate findings as you go
  # false = silently investigate, only report the conclusion
  play_by_play: false

  # Session canary — the name the agent addresses you with at the start of
  # every new task (e.g. "Alex"). Like a canary in a coal mine: when the
  # greeting silently disappears, the context window is degrading and it is
  # time for a fresh conversation. Also keeps the reply-close markers alive
  # (ONE end-summary; PR URL as the literal last line).
  # Personal concern, resolved user-globally: empty here falls back to the
  # user-global settings' personal.canary_name and then to identity.name in
  # the wizard's settings/.agent-user.yml — set this key only to OVERRIDE
  # the global name per project. No name on any layer = feature off.
  # See rules/session-canary.md.
  canary_name: ""

  # Prefix PR comment replies with a bot icon 🤖 (true, false)
  # Personal preference — each developer decides for themselves.
  pr_comment_bot_icon: false

  # Allow the agent to post unsolicited progress / status comments on
  # an open PR (e.g. "CI fix iteration #2", "blocked on workflow scope").
  # true  = agent may narrate work on the PR via `gh pr comment` etc.
  # false = default; agent never auto-comments. User-invoked flows
  #         (/fix:pr-comments, /create-pr, /code-review, explicit
  #         "post a comment that …") are NOT gated by this setting.
  # See rules/no-pr-progress-comments.md.
  pr_progress_comments: false

  # Autonomous execution — suppress trivial workflow questions (on, off, auto)
  # on   = act on the obvious next step; never ask "Step 2 or 3?", "should I commit?", etc.
  # off  = ask trivial workflow questions (legacy behavior)
  # auto = behaves like 'off' until the user says "arbeite selbstständig" / "work autonomously"
  #        in the conversation, then switches to 'on' for the rest of the chat.
  # Blocking decisions (security, scope expansion, push/merge/branch/PR) are NEVER suppressed.
  # See rules/autonomous-execution.md for the full definition.
  autonomy: auto

  # Primary user-type for skill filtering (step-9 axis).
  # Empty string ("") = no filter (legacy behavior — every skill surfaces).
  # Set this via `bash scripts/install --user-type=<id>` or hand-edit later.
  # Valid ids: consultant | creator | developer | finance | founder | gtm | ops
  # See user-types/README.md for the per-id contract.
  user_type: "__USER_TYPE__"

# --- Reply verbosity ---
verbosity:
  # Announce intent before tool batches ("Let me check X…") — only honored
  # when personal.play_by_play is ALSO true (the direct-answers narration
  # carve-out requires both). Default false = no intent narration.
  intent_announcements: false

  # Show generated commit messages, PR titles/bodies, branch names before
  # acting. false = use generated content directly (/commit terse path).
  preview_artifacts: false

  # Confirmation prompts for routine workflow steps with one obvious answer.
  # Iron-Law gates (commit-policy, scope-control git-ops, Hard Floor) ALWAYS
  # ask regardless of this setting.
  routine_confirmations: false

  # Offer "run AI Council on this?" inside delivery commands.
  offer_council_in_delivery: false

  # Status blocks after a successful action: off | minimal | full.
  post_action_reports: minimal

# --- Project / team preferences ---
project:
  # Path to the PR template file (relative to project root)
  pr_template: .github/pull_request_template.md

  # Target repository for universal improvement PRs (e.g. org/agent-config)
  upstream_repo: ""

  # Branch prefix for improvement PRs
  improvement_pr_branch_prefix: "improve/agent-"

  # Who this project is built for. Read by the demand gate
  # (docs/guidelines/agent-infra/agent-interaction-and-decision-quality.md
  # § 8-pre), whose L0-L4 ladder measures MARKET demand and is therefore
  # meaningless where no market is intended.
  #   self     -> a tool its maintainer builds for themselves. The demand gate
  #               is inert; work is classified L-self (build), never deferred
  #               for lack of a user population that is not wanted.
  #   internal -> a team / company internal tool. Only "what breaks without
  #               it?" survives; the requester is known.
  #   client   -> built for a named client. The client is the requester, not a
  #               market segment.
  #   public   -> a product with an intended market. Full three-question gate
  #               and the full ladder.
  # Default `public` = the behaviour every install had before this key existed.
  # Absent resolves to `public` too, mechanically: the template-defaults layer
  # supplies this value beneath every file layer (agent_settings.ts:873) and
  # this is not a settingsCarveOut key, so absent == an explicit `public`.
  audience: public

# --- GitHub integration ---
github:
  # API method for replying to PR review comments
  # replies_endpoint      = POST /pulls/comments/{id}/replies (preferred)
  # create_review_comment = POST /pulls/{number}/reviews (fallback)
  # auto                  = detect on first use and update this setting
  pr_reply_method: create_review_comment

# --- Augment Code projection (.augment/) ---
#
# Controls how rule files are written into .augment/rules/ during
# install (scripts/install.sh) and the package's own projection
# (scripts/condense.py --project-augment).
#
# Augment Code historically does not load symlinked rule files, so the
# default is to write each rule as a real copy. Flip the toggle to true
# once Augment Code supports symlinked rules — symlinks keep the files
# in sync without re-running install/sync, and remove a class of stale-
# copy path bugs.
augment:
  # When true, .augment/rules/*.md are symlinked into dist/agent-src/rules/.
  # When false (default) or missing, they are copied as real files.
  rules_use_symlinks: false

# --- Eloquent (Laravel) ---
eloquent:
  # Model property access style
  # getters_setters  = strict typed getters/setters, getAttribute() only inside model
  # get_attribute    = use getAttribute()/setAttribute() everywhere
  # magic_properties = use $model->column_name (Laravel default)
  access_style: getters_setters

# --- Chat history (crash recovery) ---
#
# Persistent JSONL log at agents/runtime/.agent-chat-history (git-ignored).
# Keeps a durable record of the conversation so a crashed or switched
# agent session can be resumed. See scripts/chat_history.py for the API.
chat_history:
  # Log chat events to disk (true, false)
  enabled: true

  # Logging granularity
  #   per_turn  = one entry per user↔agent turn (lightest)
  #   per_phase = one entry per workflow phase
  #   per_tool  = one entry per tool call (most verbose)
  frequency: __CHAT_HISTORY_FREQUENCY__

  # Per-entry-type text-length caps (chars). 0 = verbatim, no slice.
  # N > 0 = collapse whitespace, slice to N chars, append " … [+K chars]"
  # so the log self-reports truncation. Defaults match the hardcoded
  # fallback in scripts/chat_history.py (DEFAULT_TEXT_LIMITS).
  #   user  = your messages — full text by default (most valuable for crash recovery)
  #   agent = agent replies — capped to keep the log compact under load
  #   tool  = tool inputs/outputs — short by default; bump for noisy debugging
  #   phase = workflow phase markers — short by default
  text_limits:
    user: 0
    agent: 5000
    tool: 200
    phase: 200

# --- Optional pipelines ---
pipelines:
  # Skill improvement pipeline (true, false)
  # true  = after meaningful tasks, propose learning capture and improvements (default)
  # false = silent, no post-task analysis
  # Included by every rule_loading_tier except `custom`. Flip to false here if you
  # want a silent agent; `custom` profile ignores this default entirely.
  skill_improvement: true

# --- Reasoning Discipline Protocol (RDP) ---
#
# Transplants the *operating discipline* of a frontier reasoning model
# (ground -> intent -> notes -> gather -> audit -> verify) onto any host model.
# It transfers discipline, never capability. Cost-gated so it only engages where
# it pays. User guide (what it does / when it fires / how to turn it off):
# docs/contracts/reasoning-discipline-protocol.md
# Rationale + sources: docs/guidelines/agent-infra/frontier-reasoning-operating-profile.md
reasoning:
  # Master switch (true, false). false = the whole layer is inert (zero overhead).
  enabled: true

  # Auto benefit-gating (true, false). Engages only where it pays, using
  # table-free signals (ADR-035 forbids any runtime model->band lookup table):
  #   - task signal: trivial / short / fully-specified tasks -> OFF
  #   - host reasoning strength (agent self-assessed, no maintained list): a
  #     strong-reasoning host applies the discipline lightly / as suggestion;
  #     a standard host applies it fully.
  # One constraint-light scaffold ships; standard hosts expand it on request.
  # false = gate on task-signal + toggles only (skip the self-assessment touch).
  auto_gate: true

  # Per-component switches. Each fires only when `enabled` AND the auto_gate test passes.
  components:
    orchestrator: true       # sequences the chain; the single coordination point
    notes_first: true        # reasoning in session notes, never echoed in the response
    grounding: true          # explore environment / close info-gaps before designing
    intent: true             # infer the underlying goal before solving the literal ask
    complexity_first: true   # risk-first: resolve the load-bearing unknown first (RDP derivation, not Fable-documented)
    verifier_default: true   # fresh-context verifier on the structural-complexity gate (branching/constraints/stateful/irreversible + token floor)
    prediction_tracking: true # log prediction + confidence + outcome + lesson (calibration loop)
    decision_ledger: true    # log decision + alternatives + reason + revisit-if; escalates to decision-record/ADR when durable
    uncertainty_budget: true # per-dimension uncertainty score; feeds adaptive effort

# --- Roadmap execution ---
#
# Controls when /roadmap execute runs the project's quality pipeline
# (the `task ci` / `make test` / `npm run check` style command).
# Steps are ALWAYS marked `[x]` and the dashboard is ALWAYS regenerated
# in the same response — that cadence is governed by `roadmap-progress-sync`
# and is non-negotiable. This setting only governs *quality tool runs*.
roadmap:
  # PER-ROADMAP OVERRIDE NOTE — `execution.mode` frontmatter
  # (autonomous | phase-checkpoints | interactive, per
  # templates/roadmaps.md rule 18) changes ONLY the run's interaction
  # pattern: which asks are batched into the run-start execution
  # contract and where checkpoint prompts fire. It overrides NONE of
  # the keys below — `skip_pre_run_gate`, `quality_cadence`, and
  # `dashboard_regen_cadence` keep their global meaning in every mode,
  # and no mode lifts a safety floor. See
  # contexts/execution/roadmap-execution-contract.md.

  # Skip the /roadmap:process-* pre-run confirmation gate (true, false).
  #   true  = default. The command name names the scope; a discoverable
  #           single active roadmap (or a named one) starts the loop
  #           immediately, resolved config surfaced inline so a wrong
  #           pick can still be aborted mid-stream.
  #   false = legacy. Shows the pre-run summary with numbered options
  #           and waits. The gate is still shown regardless when the
  #           roadmap is ambiguous or a scope / cadence conflict has no
  #           sensible default. See rules/autonomous-execution.md.
  skip_pre_run_gate: true

  # When to run quality tools during /roadmap execute.
  #   end_of_roadmap = once, before archiving the completed roadmap (default — fastest, fewest tokens)
  #   per_phase      = once after every completed phase
  #   per_step       = after every completed step (legacy verbose; highest token cost)
  # Trade-off: end_of_roadmap saves tokens and time but lets errors compound
  # across phases. Pick per_phase if the work is risky or unfamiliar.
  # `quality.local_auto_run: false` (the default) suppresses local
  # pipeline runs at EVERY cadence — remote CI is the gate; this knob
  # only matters when `local_auto_run` is `true`.
  quality_cadence: end_of_roadmap

  # Dashboard regen cadence inside autonomous runs (process-step /
  # process-phase / process-full). Controls how often
  # `./agent-config roadmap:progress` runs **between** steps in a
  # single session. The dashboard is always regenerated at the start
  # of the run, at every phase boundary, and at run end — this knob
  # only affects the inter-step beat.
  #
  #   per_step         = regen after every checkbox flip. Safest for
  #                      crash recovery; highest subprocess overhead.
  #                      Use when a session may be killed mid-roadmap
  #                      and a fresh dashboard must always reflect the
  #                      last-saved step.
  #   every_5_steps    = default: batch flips, regen every 5 closed
  #                      steps + at every phase boundary. Balanced
  #                      cost/freshness for runs of 20–100 steps.
  #   phase_boundary   = regen only at phase boundaries + run end.
  #                      Cheapest for long roadmaps (100+ steps).
  #                      The checkbox flip itself is still inline per
  #                      Iron Law 2 — only the subprocess regen batches.
  #
  # `process-step` ignores this knob (single-step runs always regen
  # at the end of the step). The Iron Law 1 mandate to regen on any
  # file-shape touch (rename / phase add / archive) still fires
  # immediately regardless of this setting — so the dashboard is never
  # stale across a rename, a phase add, or an archive, whatever the
  # inter-step beat is.
  dashboard_regen_cadence: every_5_steps


  # Visible-horizon framing in roadmap authoring (integer weeks, default 0).
  # 0  = off (default). Time-boxed plate / horizon framing is forbidden:
  #      no `## Horizon (N-week visible plate)` sections, no
  #      "inside / outside the plate" phrasing, no `out-of-horizon` /
  #      `out-of-plate` suffixes. Phase ordering and dependency gates
  #      carry the deferral semantics. Enforced by
  #      `task lint-roadmap-complexity`.
  # > 0 = opt-in. Roadmaps may include a `## Horizon (N-week visible plate)`
  #      section with that many weeks; the linter relaxes the plate-token
  #      ban for files declaring the section. Pacing is still the user's
  #      call — N is just the authoring window.
  # 6 weeks proved too long for AI-paced work; the default is 0 so plans
  # describe scope and ordering, not calendars. Flip to a positive integer
  # only if your team genuinely commits work on a calendar plate.
  horizon_weeks: 0

  # --- Class-1 gate budget (road-to-gate-autonomy Phase 2) ---
  #
  # The standing spend bound for CLASS-1 roadmap blockers — the gate class
  # that is billable but reversible, where the human ingredient is spend
  # consent rather than judgment (`agent-config gates --execute <id>`).
  # Decided at `b-gate-budget-preauth`, option (a): TWO caps, because a
  # per-run cap alone bounds one mistake and not a week of them. Every
  # authorised run appends a receipt to
  # `agents/runtime/state/gate-budget-ledger.jsonl`, which is the audit
  # surface the rolling cap reads back.
  #
  # These caps bound the SIZE of an authorised spend. They never supply the
  # authorisation: `gates --execute` still requires `--confirm` on every
  # class-1 run, and a class-1 entry over either cap renders its consent
  # line instead of running.
  gate_budget:
    # Per-run ceiling in USD. A class-1 entry whose `Budget:` field states a
    # larger figure renders instead of running.
    max_cost_per_run_usd: 5

    # Rolling-window ceiling in USD over the last 7 days, summed from the
    # receipt ledger. A run whose estimate would cross it renders instead.
    max_cost_per_rolling_7d_usd: 25

# --- Plan governance gates ---
#
# Three governance gates around the plan/delivery workflow (contract:
# docs/contracts/plan-review-gates.md). Scope is every plan artifact —
# roadmaps AND feature plans — which is why these keys do not live under
# `roadmap:`. All three default to true; a missing key behaves as true.
planning:
  # Gate C — plan-confidence gate, BEFORE authoring (true, false).
  # true  = default. A plan-artifact authoring ask (/roadmap:create,
  #         roadmap-writing, /feature:plan, /feature:roadmap) first runs
  #         the four 95%-confidence conditions from /challenge-me vision.
  #         All four hold → the agent creates directly and emits exactly
  #         one marker line ("Confidence ≥ 95% — creating directly").
  #         Any gap → the ask routes into the /challenge-me vision
  #         interview first; hosts without that command run the inline
  #         degrade interview (one question per turn, same stop
  #         conditions — contexts/execution/plan-confidence-gate.md).
  #         An explicit user bypass ("just write it") wins for that turn
  #         and is counted (gate_c_bypass_rate).
  # false = inert; plan asks author directly (today's behavior).
  challenge_on_create: true

  # Gate R1 — plan-risk review at plan creation / substantial change
  # (true, false).
  # true  = default. Every ready (non-draft) plan carries a schema-valid
  #         `## Risk Register` section (ranked risks, mitigation +
  #         in-document anchor per row, freshness marker). Enforced by
  #         lint_plan_risk_register at pre-push + CI; drafts are exempt
  #         until flipped to ready. Honest-null: an empty register is
  #         valid only with the exact marker grammar from the contract.
  # false = escape hatch; the validator skips (governance default is on).
  risk_review: true

  # Gate R2 — completion review at 100% roadmap completion / pre-PR
  # (true, false).
  # true  = default. A findings-BEFORE-fixes review by a fresh reviewer
  #         context: the findings artifact (agents/evidence/reviews/…) must exist
  #         for the current diff hash before the first fix commit; every
  #         finding ends fixed | accepted-risk | deferred. No code
  #         surface → explicit skip declaration, never a silent skip.
  #         Enforced by check_completion_review at pre-push + CI (CI
  #         authoritative); a crashed validator (exit 2) warns and
  #         allows — a broken gate never blocks its own fix.
  # false = escape hatch; the validator skips (governance default is on).
  completion_review: true

# --- Quality / CI execution ---
#
# Controls whether the agent runs the project's quality pipeline
# (`task ci`, `make test`, `npm run check`, PHPStan, ECS, Rector,
# test suites) and whether it waits on remote CI after pushing.
# Iron Law `verify-before-complete` still applies — when these
# toggles suppress automatic runs, the agent MUST surface the gap
# in the completion message ("quality gates delegated to remote CI")
# instead of claiming the tools passed. It never silently claims
# verification it did not run.
quality:
  # Run local quality / CI tasks and tests autonomously (true, false)
  # false = default. The agent NEVER runs quality tools or full test
  #         suites proactively — and does not ask whether to run them.
  #         Toolchains differ per language/project and are often
  #         unknown to the agent; discovery + execution costs time and
  #         tokens. The user runs quality tools manually; remote CI is
  #         the authoritative gate. The agent runs a quality tool ONLY
  #         when one of three triggers fires:
  #           1. the user explicitly asks this turn (e.g. /fix quality),
  #           2. CI / the remote pipeline reports a concrete failure —
  #              then run exactly that failing check to reproduce + fix,
  #           3. the new-gate carve-out below.
  # true  = opt-in legacy behaviour: agent runs the quality pipeline
  #         whenever work is ready for verification, without asking.
  #
  # Carve-out (always runs regardless of this flag): when the change
  # introduces a NEW CI gate, smoke test, or test file, the agent
  # MUST execute it locally to prove the gate works. Without that
  # execution the new gate is unverified evidence.
  #
  # Posture note (feedback-8.11-2): `false` is a DELIBERATE, documented
  # design decision, not an omission — remote CI is the single
  # authoritative gate; local full-pipeline runs duplicate it at
  # wall-clock + token cost. It never suppresses (a) narrow diff-scoped
  # probes (type-check/lint/tests over the agent's OWN changed files
  # before pushing — those always run), (b) the new-gate carve-out
  # above, (c) user-invoked runs. Run-end reports must say "quality
  # gates delegated to remote CI", never claim an unrun pipeline passed.
  local_auto_run: false


# --- Design fidelity ---
#
# Controls how strictly the agent must follow a user-provided, finished
# design — a prototype, mockup, screenshot, or design-system file. Consumed
# by the `design-fidelity` rule. The provided design is the spec, not a
# starting point for the agent's own taste.
design:
  # strict | structural | hard-floor  (default: strict)
  #
  # strict     = build it 1:1. EVERY visible deviation (font, control type,
  #              component, layout, spacing, colour, an omitted/added element)
  #              needs explicit confirmation. A "better" idea is surfaced as a
  #              numbered option, never executed.
  # structural = structure is locked (fonts, control types, component set,
  #              layout, no omissions still need confirmation). Where the spec
  #              is genuinely silent (hover / empty / error states), the agent
  #              may fill the gap in the spec's style and MUST state the
  #              assumption.
  # hard-floor = any deviation is a Hard-Floor action (never autonomous; no
  #              autonomy setting, roadmap, or standing instruction lifts it).
  fidelity_mode: strict

# --- Cross-source consistency ---
#
# When the agent plans, refines, roadmaps, or implements from multiple
# sources — ticket text, an attached image / mockup / screenshot, the spec,
# the codebase — it actively checks them AGAINST each other and STOPS to ask
# before proceeding on a detected discrepancy, instead of silently guessing
# (even a correct guess). Consumed by the `cross-source-consistency` rule.
# Catches: (a) ticket text vs an attached image/mockup, (b) a spec silent on
# a clearly-needed behavior (weekend/holiday shifting, empty/error states),
# (c) spec vs the codebase, (d) intra-ticket contradiction (AC vs description).
#
# The discipline is deliberately subordinate to `ask-when-uncertain` (it folds
# a detected discrepancy into the same turn's single question — never a second
# prompt) and defers to `scope-control` for the permission to expand scope.
consistency:
  # on | auto | off  (default: on)
  #
  # on   = default. Detect discrepancies across sources and surface ONE
  #        numbered-options question before proceeding. A silent guess on a
  #        real contradiction is a rule violation, even when the guess is
  #        correct. An inferred-but-unspecified behavior is a scope expansion:
  #        ask before implementing it.
  # auto = detect + surface only HIGH-confidence contradictions; low-confidence
  #        ones are stated as an assumption and proceed (noise control).
  # off  = no cross-source checking (legacy: the agent may proceed on its own
  #        reading of whichever source it happened to read).
  cross_source: "on"

# --- Documentation screenshots ---
#
# When the agent creates screenshots for documentation (e.g. generating a docs
# site) and embeds them, sensitive data visible on the screenshot MUST be
# anonymized / pixelated before it ships. Consumed by the `doc-screenshot-hygiene`
# rule and the `screenshot-hygiene` skill. Automated detection is a helper that
# flags + pre-redacts — never a clearance; the gate for a data-bearing screenshot
# is human confirmation (routing into `non-destructive-by-default`, since a
# shipped screenshot is an irreversible published egress).
screenshots:
  # Public identity tokens that are SAFE to show unredacted — the maintainer's
  # OWN public handles (e.g. a username shown in an admin panel) plus well-known
  # fake-data tokens. This is NOT a general fake-data dictionary and NOT
  # identity-resolution: everything not on this list is treated as sensitive by
  # default. A public handle co-located with a real name does NOT whitelist the
  # real name. Default: [] (nothing auto-allowed; every identity is human-decided).
  identity_allowlist: []

  # true | false  (default: true)
  # true  = terminal / CLI / IDE screenshots are FORBIDDEN (highest leak vector:
  #         absolute local paths, env tokens). Use text code blocks with text
  #         redaction instead.
  # false = allowed, but still subject to the data-bearing human gate.
  forbid_terminal_capture: true

  # on | off  (default: on)
  # on  = a data-bearing screenshot embed is gated behind this-turn human
  #       confirmation; uncertain/unresolved regions → redact-or-refuse, never
  #       ship-and-hope. Illustrative / no-data screenshots (diagrams, logos,
  #       placeholder-only UI) may embed with a stated justification.
  # off = no data-bearing gate (legacy; the anonymization taxonomy still applies).
  #
  # NOTE: nothing reads this key yet — the gate it names is unconditional prose in
  # `doc-screenshot-hygiene`. Kept rather than deleted so the missing reader is a
  # visible gap instead of a silently unguarded action; see settings-classes.md
  # § The six unread keys for the disagreement about which repair is right.
  data_bearing_gate: "on"

code_style:
  # minimal | full  (default: minimal)
  #
  # Consumed by the code-comment-discipline rule.
  # minimal = comments state a WHY or a constraint the code cannot show;
  #           no signature-mirroring docblocks anywhere; docblocks earn their
  #           place only with machine-relevant precision (generics, array
  #           shapes) or genuine why-context.
  # full    = the exported public surface of a library package MAY carry a
  #           one-line summary docblock per symbol (IDE/consumer ergonomics).
  #           The redundancy ban still holds: no @param/@return lines that
  #           mirror the native signature, ever.
  docblocks: minimal

# --- Subagent orchestration ---
#
# Always-on orchestration (road-to-always-on-orchestration Phase 1): the
# subagent layer carries no per-run on/off setting. `subagents.enabled`,
# `subagents.auto`, and `subagents.host_capabilities` were REMOVED — a fresh
# install with this section untouched still activates auto-dispatch on any
# host whose capability probe reports a subagent primitive. Capability is a
# fact resolved from the host (registry + a live environment probe), never a
# setting; the one surviving incident-only control is `emergency.
# orchestration_halt` below. A leftover `subagents.enabled` / `subagents.auto`
# / `subagents.host_capabilities` key from an older install is ignored (one
# deprecation-warning line on load, per-key, per run).
#
# What remains below tunes HOW a delegated sub-task runs, never WHETHER the
# layer exists. Empty values fall back to the runtime defaults described in
# .augment/contexts/subagent-configuration.md and
# .augment/contexts/execution/auto-orchestration-activation.md.
subagents:
  # Route delegable sub-tasks to the lowest-capable model tier (cost + speed
  # via model downshift). true (default) = downshift per declared model_tier;
  # false = every subagent runs on the session tier.
  downshift: true

  # Prefer a separate-quota-pool model for delegable sub-tasks WHERE the host
  # manifest reports `separate_quota_pool: true` (e.g. a subscription whose
  # Sonnet allowance is distinct from Opus). Optional bonus only — behaviour is
  # identical (minus the quota win) where unsupported. Never load-bearing.
  quota_arbitrage: true

  # Optional per-tier model map for downshift routing. Empty value = use the
  # tier's runtime default (see model-recommendations.md). Keys are the
  # vendor-neutral capability bands.
  model_map:
    lite: ""
    medium: ""
    high: ""

  # Model for implementer subagents (empty = same tier as the session model)
  implementer_model: ""

  # Model for judge subagents
  # (empty = one tier above implementer: opus if sonnet, sonnet if haiku)
  judge_model: ""

  # Session-wide model CEILING for subagents (token-economy-dispatch Phase
  # 5.2). Empty (default) = no ceiling. When set (e.g. "claude-sonnet-4-5"),
  # suite-owned CLI spawn wrappers export CLAUDE_CODE_SUBAGENT_MODEL to the
  # sessions THEY launch — a spend cap on every subagent those sessions
  # spawn. Class C: a human sets it; the agent never writes it and never
  # infers one.
  model_ceiling: ""

  # Maximum number of parallel subagent invocations
  # Integer, default 3. Set to 1 to serialize. Hard cap enforced by runtime.
  max_parallel: 3

  # Opt-in adversarial-verification-council (subagent-orchestration Mode 9,
  # ADR-122):  off | ask | on
  #
  # off (default) = never runs. ask = offer it on an explicit high-risk change.
  # on = auto-run on high-risk changes (security, tenant, migration, public API).
  #
  # A panel of distinct-model skeptics red-teams a real, already-verified change
  # for defect FINDING coverage (not a go/no-go decision) and returns an advisory
  # findings-by-severity verdict. ADVISORY ONLY — it NEVER auto-gates the change
  # (Hard Floor). The registered claim + high-risk tier use cross-vendor skeptics.
  # Stays default-off until the adversarial-council-finding-coverage claim is
  # backed by the two-stage residual-detection benchmark (prove-or-drop).
  adversarial_council: off

# --- Git worktrees ---
#
# There is no setting. Worktree creation is INSTRUCTION-ONLY (ADR-229):
# `using-git-worktrees` and `subagent-orchestration` mode 6 (`do-in-worktrees`)
# create a worktree ONLY when the user asks for one in the chat ("do this in a
# worktree", "use mode 6"). Unprompted, mode 6 is not selectable and the chain
# falls back to mode 3 (`do-in-steps`).
#
# `worktrees.mode` was DELETED. It offered `ask`/`on`/`off` over a decision that
# was never the agent's to make: `ask` spent a round trip on every spawn, `on`
# let the agent start parallel work on its own, and `off` was the behaviour
# everyone actually wanted — so the setting's only real value was hardcoded and
# the other two values removed. A leftover key from an older install is ignored
# with one deprecation line (see `REMOVED_KEYS` in `_lib/agent_settings.ts`).
#
# The Iron-Law gates on creation (ignore-safety check, clean baseline) are
# unchanged and still run on every explicitly-requested worktree.

# --- AI Council (external second-opinion network) ---
#
# The council config is NOT here and is NOT project-local. It lives ONLY
# user-global at `~/.event4u/agent-config/settings/.ai-council.yml` — one
# file, configured once, serving every project / worktree / CWD (ADR-104,
# superseding ADR-093). The project tree is NEVER searched; a
# `.ai-council.yml` under any `agents/` tree is ignored. To opt in, copy
# the shape from `agents/templates/.ai-council.yml.example` to that
# user-global path and flip `enabled: true` per provider — do NOT drop it
# into a project's `agents/` tree.
#
# See `docs/contracts/ai-council-config.md` for the schema.

# --- AI Team (cross-model strong-pair review — /team family) ---
#
# One strong external model (via the codex CLI, subscription-authed)
# reviews inside the repo — the depth complement to the council's breadth.
# Schema + validation contract: `docs/contracts/ai-team-config.md`. The
# loader (`src/scripts/ai_team/config.ts`) rejects unknown keys fail-closed.
#
# Always-on orchestration (road-to-always-on-orchestration Phase 1, Step
# 1.3): `/team` carries no per-run on/off setting — `enabled` was REMOVED.
# A fresh install with this section untouched still surfaces `/team` when
# the codex CLI resolves on $PATH AND some auth for it is detectable
# (subscription login, API key, key file, or env key); otherwise every
# invocation degrades with one clear "codex CLI not available" line
# instead of a silent enabled:false refusal. Verify with `agent-config
# doctor --check team`. The one surviving incident-only control is
# `emergency.orchestration_halt` below. A leftover `enabled` key from an
# older install is accepted and ignored (one deprecation-warning line on
# load, per run).
ai_team:
  # Model handed to the codex CLI. 'auto' (default) = pass NO --model
  # flag, the codex CLI's own default applies — this tracks the
  # subscription's current strongest model instead of pinning a stale
  # ID. Any other value passes through verbatim as `--model <value>`.
  model: auto

  # Second opt-in for the ONLY wrapper that delegates write access
  # (/team:delegate → the plugin's native-Codex worker). false (default)
  # = delegate refuses even when /team itself is available. Availability
  # (codex CLI installed + authenticated) is necessary but not
  # sufficient — this key must ALSO be true before delegation is reachable.
  allow_delegate: false

  # Per-day cap on team calls. Team calls count into the EXISTING
  # cli_call_budget openai bucket (~/.event4u/agent-config/cli-calls.json,
  # daily UTC reset) — the counter tracks MACHINE-WIDE spend across ALL
  # subscriptions/profiles on this machine (an `agent-switch` profile
  # switch does NOT get its own counter; the bucket is deliberately one
  # per machine, never parallel counts). This key is the team-side
  # ceiling read against that shared bucket. 0 = block all team calls;
  # raise if you review heavily.
  max_calls_per_day: 50

  # Suppress the one-line wizard/init recommendation to set up the codex
  # plugin on Claude-Code hosts. Cosmetic only — never changes behavior.
  suppress_setup_hint: false

  # Managed governance of the codex plugin's Stop-hook Review Gate
  # (road-to-team-mode Phase 4). The gate itself stays upstream's; these
  # keys only govern it. Upstream's own warning: "The review gate can
  # create a long-running Claude/Codex loop and may drain usage limits
  # quickly."
  review_gate:
    # false (default) = byte-identical pre-Phase-4 behavior: no counting,
    # no circuit breaker, our Stop path never touches the gate. true =
    # count consecutive BLOCK verdicts per session and trip the circuit
    # breaker at the bound below.
    managed: false

    # Circuit-breaker bound: after this many CONSECUTIVE BLOCK verdicts
    # in one session, a visible notice is injected exactly once and the
    # managed layer stops re-blocking — the user decides, never an
    # infinite Claude↔Codex loop. An ALLOW verdict resets the counter.
    # Positive integer.
    max_consecutive_blocks: 3

# --- Emergency orchestration halt (the one incident-only kill switch) ---
#
# NOT an activation gate — see docs/contracts/settings-classes.md § "The one
# exception". The always-on orchestration stack (subagents, council, team)
# has no per-layer on/off setting; this is the single audited switch that
# survives, for incident response only.
emergency:
  # false (default) = the stack runs normally. Flipping this to true requires
  # no ceremony — incidents are urgent. Flipping it back to false requires
  # `orchestration_halt_justification` below to be a non-empty string; both
  # transitions emit one telemetry line (enum/bool fields only).
  orchestration_halt: false

  # Required non-empty before `orchestration_halt` may return to false.
  # Ignored while the halt is being armed (arming is ceremony-free).
  orchestration_halt_justification: ""

# --- Onboarding ---
#
# Tracks whether the initial setup flow (/onboard) has been completed
# for this developer on this project. When false, the onboarding-gate
# rule prompts the user to run /onboard before starting normal work.
# Missing entirely = legacy project (treated as onboarded).
onboarding:
  # Has the developer completed /onboard? (true, false)
  # Set to true automatically by /onboard at the end. Flip to false if
  # you want to re-run the flow.
  onboarded: false

# --- Command suggestion (numbered-options shortcut finder) ---
#
# When the user's free-form prompt matches an eligible slash command,
# the agent surfaces a numbered-options block with the recommendation
# plus an always-present "run as-is" option. The suggestion layer
# never auto-executes — the user picks. See rules/command-suggestion-policy.md.
commands:
  # --- Orchestrator auto-detection (6.1.0 non-interactive-contract) ---
  #
  # Global kill-switch for the auto-detection layer on cluster
  # orchestrators (/judge, /fix, /analytics, /tests, /override).
  #   enabled  = (default) orchestrators auto-detect the sub-command per
  #              their confidence-tiered detection table.
  #   warn     = detect, but always confirm the detected sub-command
  #              before routing (never silent, even on HIGH confidence).
  #   disabled = never auto-detect; orchestrators always show the menu
  #              (interactive) or require an explicit sub-command (CI).
  # Per-orchestrator override: auto_detect: false in a command's
  # front-matter. Per-invocation override: --no-auto-detect.
  # See src/agent-src/contexts/execution/non-interactive-contract.md.
  auto_detect: enabled

  suggestion:
    # Master switch (true, false). false = the layer is silent; explicit
    # /commands still work as today.
    enabled: true

    # Minimum match score (0.0–1.0) before a suggestion surfaces.
    # 0.6 = default; raise to 0.7 for stricter behaviour, lower to 0.5
    # if too many useful suggestions are being suppressed.
    confidence_floor: 0.6

    # Cooldown in seconds between re-suggestions of the same
    # (command, evidence) pair. Default 600s = 10m.
    cooldown_seconds: 600

    # Max number of command suggestions before the as-is option.
    # The as-is option is always extra (so total = max_options + 1).
    max_options: 4

    # Commands to never suggest. Still work when typed explicitly.
    # Example: ["/refine-ticket", "/work"]
    blocklist: []

  # --- /create-pr behavior ---
  #
  # Pre-creation preview of the generated PR description.
  # false (default): skip the title/body preview + adjust loop in
  # /create-pr; use the generated content directly. Saves agent tokens
  # by avoiding a re-render of the full description in chat.
  # true: show title and body in copyable code blocks and ask for
  # adjustments before creating the PR.
  # /create-pr:description-only always previews — that is its sole purpose.
  create_pr:
    preview_description: false

    # Verbosity tier for the generated PR description body.
    #   min (default) = title + 2-3 sentence what/why/impact + linked ticket.
    #                   Token-frugal. Critical info (breaking changes,
    #                   migrations, security, rollback) is ALWAYS included
    #                   regardless of tier — the tier governs explanatory
    #                   depth, never whether a critical callout appears.
    #   med           = min + grouped logical changes + tests note.
    #   max           = med + how-to-test + edge cases / trade-offs +
    #                   reviewer guidance (the richest, ~legacy output).
    detail_level: min

    # JSON request/response examples for API-endpoint changes.
    #   true (default) = include a fenced example ONLY when it can be
    #                    grounded in a real source (response DTO/resource,
    #                    OpenAPI/schema, test fixture, or an actual probe).
    #                    No grounded source → a one-line pointer, never an
    #                    invented example (a hallucinated contract misleads
    #                    reviewers, so it is worse than none).
    #   false          = never add API examples.
    api_examples: true

    # Screenshots for frontend changes. Default false (off). Capability-gated:
    # requires the host to have browser/preview tooling (Playwright / a
    # dev-server URL). When true + a frontend change + no such tooling, the
    # agent emits a one-line note and leaves the template placeholder — it
    # never fails or blocks PR creation, and never claims an embed that did
    # not happen. Before/after + changed-region highlighting is best-effort.
    #   false (default) = never attempt screenshots.
    #   true            = attempt when capable (see command contract).
    screenshots: false

    # Optional glob lists that make frontend / API-endpoint detection
    # explicit instead of heuristic. Empty (default) = the command uses a
    # light path/extension heuristic and fails open (no false enrichment
    # when the surface is ambiguous). Populate to pin your project's paths,
    # e.g. ui_paths: ["resources/views/**", "src/pages/**"].
    ui_paths: []
    api_paths: []

# --- Memory ---
#
# Engineering memory consolidation behaviour. Memory is entirely
# file-backed (agents/memory/). See docs/guidelines/agent-infra/memory-access.md
# for the retrieval contract and .augment/skills/memory-consolidation/ for
# the four-phase loop.
memory:
  # Cadence for the "🧠 Memory: <hits>/<asks>" visibility line emitted
  # after a memory-consulting step (see docs/contracts/memory-visibility-v1.md).
  #   always = (default) emit whenever at least one memory type was asked.
  #   auto   = emit only when ≥ 3 memory types were consulted (less noise
  #            on shallow-retrieval steps).
  #   never  = suppress the line entirely.
  # The legacy `memory.visibility: off` master switch still wins over this.
  cadence: always

  # Inline-review threshold for /memory load.
  # When the unreviewed intake stream contains more than this many
  # entries, /memory load surfaces a top-3 preview block before the
  # full curated load. Set to 0 to disable the inline review entirely.
  review_threshold: 10

  # Patterns redacted from transcripts before mining.
  # The TranscriptAdapter applies these as a regex blocklist on every
  # yielded turn. Add personal identifiers, project-internal tokens,
  # or paths outside the repo root that must not land in intake JSONL.
  # Example: ["api[_-]?key", "/Users/[a-z]+/Library"]
  redact_patterns: []

  # Opt-in compact memory index at session start
  # (road-to-memory-retrieval-economy Phase 5). When `on`, session_start
  # injects a compact index of curated entries — id + title + ~tokens,
  # hard cap 30 rows — through the hot-context hook surface. Bodies are
  # never injected; the model fetches full entries via memory_get on
  # demand. Default OFF: the ship-criterion (measured hit-rate gain at
  # bounded fixed cost) is unproven — off unless proven.
  #   off = (default) no session-start index.
  #   on  = inject the compact index (spotlighted as DATA).
  session_index: "off"

  # session_end learning-sidecar aggregation (road-to-reachable-code-memory
  # Phase 4). When true, the session_end hook aggregates
  # agents/memory/intake/*.jsonl through the learning sidecar (30-day decay,
  # ≥2-origin corroboration) into the gitignored .agent-learning.json +
  # LESSONS.md and emits the one-line memory-visibility marker. Local-only,
  # budget-capped (2 s), fail-open; promotion into curated memory stays
  # human via /memory:propose. SHIPS OFF (council 2026-07-27): the default
  # flip is proposed only after the 30-day dogfood shows non-trivial signal
  # AND session-end p95 < 2 s.
  learn_on_session_end: false

# --- Knowledge cards: global cross-project sharing (ADR-100) ---
#
# Structure-grounding v2. Promote *expensive* (remote) knowledge cards from
# project-local `agents/knowledge/` to a per-user, file-first global store at
# `~/.event4u/agent-config/knowledge/`, reusable across projects as LEADS only.
# This is a USER-GLOBAL setting — keep it in `~/.event4u/agent-config/agent-settings.yml`.
#
# File-first, NOT a runtime: lazy-read plain card files, no daemon, no DB, no
# vector index, no background decay (preserves the 2026-06-14 Layer-2 sunset's
# core — see ADR-100). The store is UNVERSIONED (not in git) — a cache, never a
# source of truth; the per-card provenance footer is its audit trail.
#
# enabled: false fully no-ops the layer — the global store is never read or
# written, no promotion is suggested, Evidence Reports revert to project-local,
# and any existing global cards go inert. v1 (project-local discipline + cards)
# is byte-for-byte unaffected. `agent-config knowledge:global:purge --confirm`
# removes the store and strips provenance from project cards.
knowledge:
  global_sharing:
    # Default ON since the ADR-103 supersession (2026-07-12, council
    # claude-sonnet-4-5 + gpt-4o 2026-07-11 — flip-with-validation): the
    # measure-then-decide gate was a structural deadlock (reuse can only
    # accrue while the layer is on; on was withheld pending reuse), the same
    # shape ADR-117 broke for subagents. Bounded downside: write-time
    # redaction floor (adversarially spot-checked incl. hidden-unicode
    # smuggling), narrowest tier default ([public]), suggest-then-confirm
    # promotion, and the pre-registered demotion trigger — any cross-project
    # PII/secret sighting in a shared card auto-reverts this default to
    # `false` plus an incident note. Single-key revert: set `enabled: false`
    # and the layer fully no-ops.
    #
    # Turning sharing on does NOT make promotion automatic — promotion is always
    # suggest-then-confirm (auto_promote_threshold gates the *suggestion*, never
    # a silent write). v1 (project-local discipline + cards) is byte-for-byte
    # unaffected by this default; only the cross-project store is gated off.
    enabled: true

    # Origin tiers eligible to cross a project boundary under default-on.
    # `proprietary` (in-house DB / private API / client schemas) is EXCLUDED by
    # design — it is manual-only regardless of `enabled`, so no client-A schema
    # ever leaks into client-B's session. Adding it here does NOT enable
    # auto-share; the tier gate hard-codes proprietary as manual-only.
    # Narrowest default per the 2026-07-11 council verdict: `vendor` is a
    # deliberate opt-in widening, not the shipped default.
    allowed_tiers: [public]

    # Write-time redaction before any card is eligible to go global. Runs the
    # low-impact-corpus-privacy-floor + source-confidentiality pattern set
    # (API keys, internal hostnames, emails, blocklisted field/table names).
    redaction:
      enabled: true
      # halt-and-prompt on a trigger; never silent-share, never auto-rewrite.
      halt_on_trigger: true

    # A `public`/`vendor` card seen in >= this many distinct repos triggers a
    # promotion SUGGESTION (one-tap confirm). It never auto-promotes.
    auto_promote_threshold: 2

    # Freshness flip thresholds (days) for the untracked global store. A global
    # card whose newest observed_at is older than `hypothesis_after_days` is
    # lead-only (positive structure must be re-confirmed); older than
    # `stale_after_days` it is skipped until re-verified. Negative facts +
    # pointers stay usable as leads regardless.
    freshness:
      hypothesis_after_days: 90
      stale_after_days: 180

# --- Hooks ---
#
# Configuration surface for the hook dispatcher (see
# docs/contracts/hook-architecture-v1.md). Each subkey targets one
# concern script under scripts/hooks/ or scripts/. Defaults are safe;
# tune only when CI surfaces a real signal.
hooks:
  # Concern budget gate (P3.3, lint_hook_concern_budget.py). Caps how
  # many concerns may bind to a single (platform, event) cell and
  # restricts fail_closed=true to an explicit Tier-1 allowlist.
  #
  # max_per_event — placeholder until Phase 1 of
  # road-to-proof-not-features.md captures real session evidence.
  # Threshold rule per roadmap: max(observed-in-Phase-1) × 1.5, rounded
  # up. 8 = current-observed-max (5) × 1.5 = 7.5 → 8.
  #
  # tier1_concerns — concerns allowed to block agent execution on
  # failure (fail_closed: true in the manifest). Promotion is explicit
  # opt-in; keep empty until Phase 1 evidence justifies an entry.
  #
  # hard_fail — false = warn-only (default). Flip to true after ≥10
  # captured sessions across host agents per
  # road-to-distribution-and-adoption.md.
  concern_budget:
    max_per_event: 8
    tier1_concerns: []
    hard_fail: false

  # PostToolUse prompt-injection scanner (road-to-security-pillar.md P3.2).
  # Default-OFF. When enabled, scans tool output (file reads, web fetches, MCP
  # responses) for injection signatures and WARNS in context (exit 2) — never
  # blocks. Runtime backstop on top of the always-on untrusted-input-defense
  # rule; detection is probabilistic. Opt in per project once you trust the
  # signal-to-noise on your tool mix.
  injection_scan:
    enabled: false

  # NOTE — `turn_end_gate` has no keys here any more. The stop-slot turn-end
  # gate is ALWAYS ARMED (2026-08-12); `hooks.turn_end_gate.*` was removed and
  # a leftover block warns once on stderr and is ignored. Whether it fires is
  # decided by each detector's own trigger — no promise in the closing
  # paragraph, no language-pin mismatch, no unverified edit ⇒ the turn ends.
  # See `src/scripts/hooks/turn_end_gate_hook.ts` § "Always armed".

  # PreToolUse RTK-wrap nudge (token-saving Phase 3). Default-OFF. When enabled
  # AND `rtk` is on PATH (a live probe — not a self-reported flag), warns (exit
  # 2, never blocks) "re-run wrapped with rtk" before a single verbose CLI
  # command (git/npm/cargo/docker/…), so verbose output is filtered for 60–90%
  # token saving. Skips completeness-critical / piped / compound commands and
  # `git diff`. No-op when rtk is absent. Opt in once you have rtk installed.
  rtk_wrap:
    enabled: false

  # PreToolUse anti-slop nudge (road-to-anti-slop-detector Phase 3). Default-OFF.
  # When enabled, runs the lint_design_slop registry against about-to-be-written
  # UI content (html/css/jsx/…) and WARNS (exit 2, never blocks) on P0/P1
  # aesthetic tells — the side-stripe signature, gradient-text, magic z-index,
  # etc. Flags are rebuttable: declare intent in DESIGN.md, design-slop-disable,
  # or proceed. Anti-loop: a file::rule signature surfaced 3x goes silent so it
  # never traps the agent. The universal gate is the lint_design_slop linter/CI;
  # this hook is a host-limited convenience layer (pre_tool_use fires on ~2-3
  # hosts). Opt in once you trust the signal-to-noise on your UI.
  design_slop:
    enabled: false

  # PostToolUse + stop design pass (road-to-frontend-power E1.1 / E1.2 / E1.3).
  # Default-OFF. One concern on two slots. On post_tool_use, a write to a UI
  # surface delivers the design findings as context and NEVER blocks. On stop,
  # the same pass runs over every UI file touched this session, deduped against
  # what the post pass already surfaced, and a P0 OBJECTIVE FLOOR (contrast,
  # font size, heading skip, focus) blocks with a continuation. P1-P3 never
  # block on either slot.
  #
  # post_tool_use rather than pre_tool_use, and the reason is measured rather
  # than stylistic (internal/bench/frontend-power/BASELINE-2026-08-23.md):
  # pre_tool_use is declared by three hosts and honoured by one while
  # post_tool_use is declared by six, and _lib/ui_surface.ts is a PATH
  # predicate — so a pre-write gate cannot fire on the first write of a NEW
  # surface, which is the write it most wants.
  #
  # A pass that could not fully run reports verification: degraded with a
  # reason (no render artefact => the viewport-dependent floors were not
  # checked) instead of passing silently. Run `agent-config ui:render` to lift
  # it, and `agent-config ui:audit` to satisfy the audit-freshness line.
  #
  # This does NOT replace design_slop above. Two design keys is the honest
  # state until the tiering experiment has a number: retiring the older
  # carrier on the assumption that this one covers it is the build-then-justify
  # pattern the parent roadmap's Risk 2 names.
  design_pass:
    enabled: false

  # PreToolUse UI-route nudge (road-to-frontend-skill-application Phase 4).
  # Default-OFF. When enabled, a Write/Edit to a UI surface with no design
  # consultation latched this session WARNS (exit 2, never blocks) naming the
  # route: run existing-ui-audit, then the fe-design loop. A read or search
  # touching fe-design / existing-ui-audit / design-review / design-intelligence
  # latches consultation and silences it for the rest of the session, so the
  # agent that did the right thing is never nagged. Anti-loop: at most 2 nudges
  # per session. It does NOT read the two UI rules: the UI-surface decision
  # comes from _lib/ui_surface.ts, so this runs parallel to them rather than
  # consuming their triggers. Host-limited (pre_tool_use fires on ~2-3 hosts) —
  # elsewhere the obligation stays model-carried, as the two UI rules declare.
  ui_route_nudge:
    enabled: false

  # PreToolUse code-graph nudge (ADR-124 Phase 4). Default-OFF. When enabled
  # AND a native code-graph engine has built a cache (or the repo ships a
  # graph.json / SCIP index), WARNS once per session (exit 2, never blocks) as
  # the agent is about to Grep/Glob or Read a source file: query the graph
  # first for "who calls / where used / impact" questions (or rebuild if the
  # index is stale, or build one if absent). Source G's strict block-first-read
  # mode is deliberately un-ported. Build the cache with
  # `agent-config code-graph build`.
  #
  # DEPRECATED (honest null, 2026-07-28): the pre-registered 2-arm retrieval
  # benchmark measured the native graph at recall 0.365 vs grep 0.797 on
  # graph-shaped questions across 3 real repos (internal/bench/reports/
  # code-graph-vs-grep.md; claim code-graph-retrieval-null). `enabled: false`
  # is the DEFAULT and is not permanent — the removal commitment this comment
  # used to carry was withdrawn on 2026-08-15 (docs/MIGRATION.md, the code_graph
  # row), and "permanent" was retracted with it. What holds is the default and
  # its reopen condition, which is the same one that was always written here:
  # external evidence — a consumer case the graph answers and disciplined grep
  # cannot — or a re-measurement on a build that postdates the extractor repair
  # of 2026-08-22, which the 2026-07-28 figures predate.
  #
  # The engine's parser pair is NO LONGER a runtime dependency (~51 MB that
  # every consumer installed for a path none of them can reach); it is a
  # devDependency, which npm does not install for consumers. Flipping this to
  # `true` is therefore not sufficient — install the ABI-locked pair too:
  #   npm i web-tree-sitter@0.24.7 tree-sitter-wasms@0.1.13
  # Both versions are exact because the pair is ABI-coupled (grammar ABI 14).
  # The loader raises this same hint if the pair is missing.
  code_graph:
    enabled: false

  # Suggestion-block capture (road-to-suggestion-block-capture). Two slots:
  # `stop` latches that the assistant turn carried a numbered-options block,
  # `user_prompt_submit` consumes the latch and classifies the answering turn.
  # Writes COUNTS ONLY to agents/runtime/state/audit/suggestion-capture.jsonl —
  # the record type has no field able to hold a prompt, an option label or a
  # command name, and a test asserts the written key set against
  # src/config/suggestion-capture.json.
  #
  # `enabled: false` is the shipped default because this is an INSTRUMENT, not a
  # feature: it exists so a capture rate can be measured on a maintainer
  # workspace during a fixed soak window, and there is nothing in it for a
  # consumer to gain. Turning it on costs one string match per turn and one
  # small file write per answered block.
  suggestion_capture:
    enabled: false

# --- Decision engine ---
#
# Controllable gates layered over the observability surface. Absent
# block = current behaviour (observe-only, no gates fire). Enforcement
# is strictly opt-in; the engine never silently rejects work without
# a configured gate. See docs/contracts/decision-engine-gates.md for
# the full schema, gate-conflict matrix, and non-TTY timeout protocol.
#
# Gate-conflict resolution (only the first firing gate per phase
# surfaces a reason; downstream gates are skipped):
#   1. block_on_risk         (Phase=Implement, highest impact)
#   2. require_memory_hits   (Phase=Refine)
#   3. min_confidence        (Phase=Plan, lowest impact)
#
# Unknown keys are rejected hard by scripts/validate_decision_engine.py
# (wired into `task ci`). Removing the entire block restores observe-only.
decision_engine:
  # Opt-in for DecisionTraceHook (default false). Mirrored into
  # hooks.decision_trace.enabled by work_engine.hooks.settings.
  surface_traces: false

  # Confidence-band floor for Phase=Plan.
  #   off    = no floor (default)
  #   low    = refuse to advance when band is below low
  #   medium = refuse when below medium
  #   high   = refuse when below high
  min_confidence: "off"

  # Risk-class ceiling for Phase=Implement.
  #   off    = no ceiling (default)
  #   low    = refuse when risk_class >= low (most aggressive)
  #   medium = refuse when risk_class >= medium
  #   high   = refuse only when risk_class == high
  block_on_risk: off

  # Phase=Refine demands at least one memory hit when true (default false).
  # Gated on road-to-proof-not-features.md P2 (memory-consequence trace);
  # leaving this off avoids opaque rejections until the trace can explain
  # which memory entry was missing.
  require_memory_hits: false

  # What happens when a gate fires.
  #   stop = halt the engine with reason on the trace (default)
  #   ask  = prompt the user; falls back to on_block_fallback in CI
  #   warn = log the reason but advance
  on_block: stop

  # Non-TTY timeout (seconds) when on_block=ask runs without a TTY
  # (CI=true env or stdin not a TTY). After the timeout, the engine
  # applies on_block_fallback and surfaces block_reason=ask_timeout.
  ask_timeout_seconds: 30

  # Resolution after ask_timeout fires.
  #   stop = halt the engine (default — fail-safe)
  #   warn = log and advance
  on_block_fallback: stop

# --- Update check ---
#
# Daily background check against the npm registry for a newer
# @event4u/agent-config release. When enabled the dispatcher writes a
# two-line banner to stderr **after** the subcommand finishes; CI,
# non-TTY stdout, and `AGENT_CONFIG_NO_UPDATE_CHECK=1` always suppress
# it regardless of this flag. State is persisted at
# `~/.event4u/agent-config/update-check.json` (mode 0600; legacy
# `~/.config/agent-config/update-check.json` read as fallback) with a 24 h
# cadence. See docs/customization.md § "Update check" for the suppression
# matrix and the road-to-portable-runtime-and-update-check roadmap (P2).
update_check:
  enabled: true

# ─── explain ──────────────────────────────────────────────────────────────
# `agent-config explain last` renders the read-only execution trace for the
# most recent /work run (state file `.work-state.json`). Trace output is
# PII-scrubbed before emission; the command never makes network calls and
# never writes to state. Set `enable_last: false` to suppress the subcommand
# (the call still exits 0 with a one-line notice — used by air-gapped
# tenants that disable diagnostics surface-wide).
explain:
  enable_last: true

# ─── legal-review-prep consent gate ──────────────────────────────────────────
# The legal-review-prep pack is high-risk (EU/DE legal review-prep, NOT legal
# advice). It stays inactive until you acknowledge it is not legal advice — set
# by the setup wizard's consent checkbox, or here by hand. The legal-safety-floor
# rule refuses every legal-review-prep skill until `acknowledged: true`.
legal_review_prep:
  acknowledged: false
  # Gate legal work-product behind a multi-model council / deep-research pass
  # (defense-in-depth + audit trail; fail-closed). Off lets single-model legal
  # output through — not recommended for this high-risk pack.
  require_council: true

# ─── secrets ────────────────────────────────────────────────────────────────
# Local-only secret material. This whole file is gitignored, so the key never
# enters the tracked tree.
#
# link_encryption_key — symmetric key used to encrypt/decrypt stored
# third-party package links (e.g. the source / author / pin fields in
# agents/settings/contexts/skills-provenance.yml). Source-identifying values
# are committed only as `ENC1:` tokens; this key is what reads them back.
#
# Resolution order (see src/scripts/_lib/link_crypto.py):
#   1. this project file  → secrets.link_encryption_key
#   2. user-global        → ~/.event4u/agent-config/agent-settings.yml
# Decryption tries the project key first and falls back to the user-global
# key. Keep the key in your user-global settings so encrypted provenance stays
# recoverable across fresh clones.
#
# Generate one:  ./scripts-run src/scripts/_lib/link_crypto keygen
# secrets:
#   link_encryption_key: "<paste generated key here>"
