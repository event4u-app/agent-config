# Consumer-tool load-budget caps for this package's projections.
#
# Single source of truth for the budget gates — scripts read these values
# instead of hard-coding them (measure_augment_budget, and any future
# per-tool budget meter).

# ── Ownership ─────────────────────────────────────────────────────────────────
# Added 2026-08-24, road-to-standing-payload-truth `b-budgets-yml-outside-ownership`.
# This file was outside `lint_budget_ownership`'s corpus for its whole life,
# because that gate filtered on `.json`. A budget without an owner is a budget
# nobody has to defend, and this is the one that gates `standing_rule_delivery` —
# the larger of the two red payload numbers. It is now governed by an explicit
# single-file row in that gate's `GOVERNED_NON_JSON`, not by a widened glob.
#
# `review_by` IS DERIVED, AND NO CADENCE RULE IS DOCUMENTED — said plainly rather
# than presented as policy. `lint_budget_ownership` requires the field and defines
# no interval for it. Two conventions are observable in the sibling budgets:
# four files use 2026-11-10 (the preamble milestone) and seven use a ~1-year
# horizon, including this file's subject-nearest sibling
# `preamble-payload-budget.json`. Registered 2026-08-24 on that convention →
# 2027-08-24. If a cadence is ever written down and disagrees, this date is wrong
# and should move to the rule rather than the rule to the date.
owner: maintainer
review_by: '2027-08-24'

augment_workspace_guidelines:
  # Verified platform maximum: 99,024 chars (re-measured 2026-07; the old
  # 49,512 ceiling from the 2026-05-08 baseline is obsolete). We deliberately
  # gate against a LOWER internal cap to keep headroom for consumer-side
  # additions and future rules — raise total_cap_chars only as needed, and
  # NEVER above platform_max_chars.
  platform_max_chars: 99024
  total_cap_chars: 64000
  warn_threshold: 0.85
  fail_threshold: 0.95

standing_rule_delivery:
  # The rule bytes a Claude Code session actually receives, summed across BOTH
  # layers the host loads (`~/.claude/rules/` and `<project>/.claude/rules/`) —
  # gated by `check_standing_rule_delivery.ts`.
  #
  # Derivation, measured 2026-08-08 (exact BPE, cl100k_base, via
  # `src/scripts/_lib/token_count.ts`) and recorded in
  # `agents/evidence/analysis/standing-rule-delivery-topologies.md`:
  #
  #   both layers loaded  176,354 tok   ← the defect this gate catches
  #   global layer alone  101,247 tok
  #   project layer alone  75,107 tok
  #
  # So the useful band is 101,247 … 176,354: below it a complete single layer
  # would fail, above it the doubled corpus would pass. 110,000 sits in that
  # band with ~9% headroom over the larger single layer.
  #
  # This is NOT the coherence-followup's pre-registered ≤ 30k always-on figure.
  # That one measures the always-HONOURED set, which a discipline profile trims;
  # this measures the PROJECTED file set, which no profile trims
  # (compile_router.ts:266-272 vs condense.ts:1092-1099). 101,247 → 30,000 needs
  # `paths:` scoping plus the digest, not dedup.
  total_cap_tokens: 110000
  warn_threshold: 0.85
  # Every raise needs a stated cause naming which rule added the tokens and why.
  # `check_standing_rule_delivery` fails on an empty or placeholder reason, so a
  # silent baseline bump is not available.
  cap_raise_reason: 'initial cap — derived from the 2026-08-08 six-topology measurement (P0.3), never raised'
