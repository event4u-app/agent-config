# CI ↔ local parity manifest — the input to `check_ci_local_parity.ts`.
#
# WHY THIS EXISTS
# ---------------
# The local aggregate (`task ci`) and the CI workflows drifted apart in BOTH
# directions, and each direction cost real defects:
#
#   CI-only  — a gate CI runs that no local chain reaches. The contributor pushes,
#              CI goes red, and the fix costs a round trip. Measured 2026-07-30:
#              check_portability and check_adr_frontmatter turned a PR red that a
#              local run would have caught, twice in one session.
#
#   local-only — a gate `task ci` runs that no workflow does. Nothing enforces it
#              remotely, so a defect merges. Measured: check-index had verified the
#              artefact index for a long time and ran in no workflow, which is how
#              16 stale rows in agents/index.md + docs/catalog.md reached main.
#              check_bridge_derivation is the same shape.
#
# A gate that exists on one side only drifts silently on the other. This manifest
# plus the checker makes each direction a declared, reviewable choice instead of an
# accident.
#
# THE THIRD DIMENSION — `preflight`, added round 7, REPORT-ONLY
# ------------------------------------------------------------
# The two directions above compare CI against the local MIRROR (`task ci` +
# `task consistency` + the pre-push hook). `task ci` INCLUDES `preflight`, so
# neither direction can see the gap that actually costs push cycles: the pass a
# contributor is TOLD to run before pushing is `task preflight`, a deliberate
# subset of `ci`.
#
# Measured 2026-08-12: preflight reaches **22** gates; **209** CI-enforced gates
# are locally reachable and run in NEITHER preflight nor anywhere else the
# pre-push hook reaches — i.e. the set that can only fail after a push. Round 7
# traced three "green locally, red remotely" cycles to it (the Thin-Root char cap,
# the ratchet in the Node-Tests shard, derived-page freshness).
#
# The first reading said 221 and subtracted preflight alone, which counted gates
# the pre-push hook already runs and therefore cannot fail remotely — corrected
# by the round's own completion review (finding 4). Both figures are kept because
# the correction is the point: a number published as "the deliverable" was
# computed over a superset.
#
# It is REPORT-ONLY, and deliberately not a declared list, for two reasons:
#   1. The subset is intentional. preflight's own docstring excludes
#      check_enforcement_coverage at a measured 30.7 s because "a pre-push gate
#      that doubles the hook teaches people to skip it". Failing on the gap would
#      demand preflight grow into ci — the opposite of that decision.
#   2. 209 per-entry declarations would BE the allowlist-growth antipattern the
#      `autonomous-execution` rule caps at 20: past that count, the list is the
#      problem and not the exemption.
#
# What the report removes is the IMPLICATION that a green preflight predicts a
# green CI. It does not, and now it says so on every run.
#
# THE CONTRACT
# ------------
# The checker DERIVES both sides — it never trusts a hand-maintained list of gates:
#
#   CI side     parsed from .github/workflows/*.yml — every `./scripts-run
#               src/scripts/<name>`, `npx tsx src/scripts/<name>`, `node <path>` and
#               `task <name>` invocation.
#   local side  the transitive closure of the `task ci` / `task consistency` chains
#               plus the pre-push hook, resolved through taskfiles/*.yml.
#
# Anything present on one side and absent on the other must appear below with a
# reason, or the checker fails. That is the whole mechanism: drift is allowed, but
# only on the record.
#
# Parity is by gate ID, not by argv. Three gates run locally in a cheap variant and
# in CI in a strict one (check_release_published bare vs --strict --check-npm,
# build_cloud_bundle --check vs --all --clean, build_linear_digest offline vs live).
# They need no declaration: the parity question is "can a contributor run this before
# pushing at all", and the answer is yes. Declaring them anyway produced exactly the
# dead exemption the stale-declaration check exists to catch — it was removed rather
# than kept, because an exemption nothing needs is one the next reader trusts.
#
# WHY NOT JUST "RUN task ci BEFORE EVERY PUSH"
# --------------------------------------------
# Because a pre-push gate that is red for a reason the contributor did not cause
# either blocks every push or trains people to ignore it, and the second is worse
# than no gate. Two measured bounds from the same sweep:
#
#   bucket A (repo-content gates) sum to ~14.5s  → affordable before a push
#   check_enforcement_coverage alone is 30.7s    → belongs in the post-CI loop
#
# So `pre_push_budget_seconds` below is a real budget, not a wish. A gate declared
# `local_only` or `both` that exceeds it is reported, not silently added to the hook.

# Wall-clock ceiling for the pre-push gate set, in seconds. Derived from the
# measured bucket-A sum (14.5s) plus headroom; the existing hook already costs
# `task consistency` + eslint + tsc, so this is a bounded increase, not a new tax.
pre_push_budget_seconds: 25

# Gates CI runs that no local chain reaches — each needs a reason it cannot or
# should not run locally. `reason` is free text; `class` is one of:
#   network        needs a token, a registry, or a live API
#   release        verifies tag / release / published-package state
#   artifact       needs something only CI builds (site, tarball, bundle)
#   benchmark      it is a measurement, timing-sensitive or paid
#   matrix         needs an OS or Node version this machine is not
#   resolver       not a gate at all — a helper a workflow step calls to compute
#                  something (a diff base, a scope); it decides and blocks nothing
ci_only:
  # road-to-target-project-assurance-readiness steps 0.3 and 3.1. Both run in the
  # NIGHTLY risk-class-drift workflow, and neither belongs in a local gate chain:
  # `measure_risk_class_drift` APPENDS to a ledger, so putting it in `task ci` would
  # make every local run write a row and the drift series would measure how often
  # contributors ran the gate rather than what the tree looks like. Its classifier
  # self-test is the half that IS worth running locally, and it is reachable —
  # `classify_change_risk --self-test` — but the workflow invokes it as a step of
  # its own rather than through the aggregate, which is what this checker sees.
  # road-to-npm-payload-reduction Phase 3.1. `report_pack_delta` measures the
  # BRANCH-vs-BASE packed payload, which has no meaning without a pull request:
  # locally `--base origin/main --head HEAD` on main reads +0.0 KB every time, and
  # the step's own contract is to write nothing when the delta is zero. It also
  # checks out BOTH refs into throwaway worktrees and packs each (~1 minute), so
  # putting it in `task ci` would add a minute to every local run for a number
  # that is structurally absent locally. It is a REPORT and cannot red the build
  # (`continue-on-error: true`, and the script exits 0 whatever the number), so
  # there is no failure a contributor could discover only after pushing — which is
  # the exact harm this checker exists to prevent.
  #
  # Reachable on demand: `task report-pack-delta -- --base <ref> --head <ref>`.
  - id: report_pack_delta
    class: artifact
    reason: "a pull-request-only delta report with no local meaning (base==head reads +0.0 KB and the step writes nothing); it packs two refs in throwaway worktrees at ~1 min, cannot red the build, and is reachable on demand via `task report-pack-delta`"
  - id: classify_change_risk
    class: benchmark
    reason: "invoked as the nightly drift workflow's self-test step; the classifier itself gates nothing and its `--self-test` is runnable locally on demand (`./scripts-run src/scripts/classify_change_risk --self-test`)"
  - id: measure_risk_class_drift
    class: benchmark
    reason: "appends one row per run to agents/evidence/risk-classifier-drift.jsonl — in a local chain it would make the drift series a count of local gate runs rather than a measurement of merged changes; the standing metric is nightly by design (step 3.1 forbids a per-change trigger)"
  - id: check_release_surface_equality
    class: release
    reason: "shells out to `gh pr diff <n>` for a live release PR — there is no PR body to compare the CHANGELOG against on a local checkout"
  - id: check_release_highlights
    class: release
    reason: "requires `--version X.Y.Z` and derives evidence from a release span; exits 2 without one, so a local run gates nothing"
  - id: check_finding_dispositions
    class: release
    reason: "adjudicates the release-PR self-review findings ledger, whose input JSON is produced by the self-review workflow job"
  # road-to-source-silence Phase 5.3. Two modes, and the distinction is the whole
  # reason this is a declaration rather than a `task ci` entry.
  #
  # The mode a CI workflow invokes on a schedule is the FIVE-SURFACE CENSUS
  # (source-surface-sweep.yml, weekly). It needs `gh` for the pull-request
  # surface and a full-depth clone for the 9,000-commit trunk surface, it takes
  # minutes, it writes no verdict, and it deliberately CANNOT red the build — a
  # scheduled job that fails `main` for a residual count nobody can lower this
  # week is a job that gets disabled. Putting it in `task ci` would add minutes
  # to every local run for a number that is a standing observation, not a gate.
  #
  # The mode that IS a gate — `--gate-metadata`, which refuses source
  # attribution in a branch name, PR title, PR body or commit message — has a
  # stronger local story than `task ci` membership gives anything else here: it
  # runs on PRE-PUSH via src/scripts/hooks/prepush_metadata_sources.sh, i.e.
  # BEFORE the metadata is public, which is the only moment fixing it is free.
  # A contributor therefore discovers that failure locally by construction,
  # which is exactly the harm this checker exists to prevent.
  - id: sweep_source_surfaces
    class: network
    reason: "the CI invocation is the weekly five-surface census — needs `gh` for the PR surface and a full-depth clone for the ~9,000-commit trunk surface, writes counts not a verdict, and is deliberately non-failing; its GATE mode (`--gate-metadata`) is reachable locally on pre-push via src/scripts/hooks/prepush_metadata_sources.sh and by hand, so no failure is discoverable only after a push"
  - id: rule_trigger_eval
    class: network
    reason: "live cross-model LLM trigger evaluation in the secret-gated canary workflow; advisory, paid, and never gating"
  - id: check_evaluator_budgets
    class: benchmark
    reason: "asserts against a measurements JSON that only the nightly evaluator-umbrella run produces — with no artifact there is nothing local to compare against"
  - id: resolve_lint_scope
    class: resolver
    reason: "not a gate — the diff-base resolver skill-lint.yml shell steps call so they scope from the same source as `skill_linter --changed`; it decides nothing and blocks nothing"
  - id: adoption_snapshot
    class: network
    reason: "live api.npmjs.org + api.github.com calls, reads GITHUB_TOKEN"
  - id: sync_github_metadata
    class: network
    reason: "hard-fails without GITHUB_TOKEN; mutates repo topics/description via the API"
  - id: check_release_pr_shape
    class: release
    reason: "shells out to `gh pr diff <n>` — needs a live PR and a token"
  - id: check_release_adjacent_health
    class: release
    reason: "queries GitHub Actions run history via gh"
  - id: bench_drift_check
    class: benchmark
    reason: "consumes rolling bench reports that only a bench run produces"
  - id: bench_baseline_ready
    class: benchmark
    reason: "same — no local baseline to compare against"
  - id: bench_hook_latency
    class: benchmark
    reason: "a latency measurement; 24.0s measured and timing-sensitive on a loaded machine"
  - id: check_site_links
    class: artifact
    reason: "needs the built Starlight site; exits 2 unbuilt or stale (registered in gate-coverage.yml with unavailable_exit: 2)"
  - id: pack_mcp_content
    class: artifact
    reason: "writes the tracked internal/workers/mcp/content.json deploy artifact — a local run dirties the tree"
  - id: consumer_matrix
    class: matrix
    reason: "consumes the npm pack tarball across a Node version matrix"
  - id: cross_model_smoke
    class: network
    reason: "paid cross-model canary calls, secret-gated"
  - id: trigger_eval_rotation
    class: network
    reason: "paid model calls"
  - id: self_review_gate
    class: network
    reason: "--dry-run in the PR job; the live variant is a paid model call on the PR diff"
  - id: bench_run
    class: benchmark
    reason: "paid model calls against a corpus"
  - id: bench_runner
    class: benchmark
    reason: "the runner behind bench_run — same paid calls"
  - id: skill_trigger_eval
    class: benchmark
    reason: "paid cross-model trigger-activation eval; the offline structural half is check_trigger_evals, which IS local"
  - id: evaluator_umbrella
    class: artifact
    reason: "shell umbrella over CI-only evaluator fixtures"
  - id: smoke_host_loadability
    class: artifact
    reason: "temp-HOME install + `claude plugin validate`; measured >100s, did not finish inside a 2-minute budget"
  - id: install
    class: matrix
    reason: "the installer end-to-end against a scratch HOME on the OS matrix; a local run would rewrite this machine's own agent config"
  - id: release
    class: release
    reason: "tags, bumps, publishes, opens the release PR — the release itself"

# Gates a local chain runs that no workflow does — each needs a reason it is not
# worth remote enforcement, OR it should simply be added to a workflow. Prefer
# adding it: a local-only gate is the direction that let real defects merge.
local_only:
  - id: check_host_loadability_reach
    class: developer-machine-scoped
    reason: >
      `check_host_loadability --reach` asks whether each generated host tree
      carries artefacts, and — when it does not — whether the TOOL is absent or
      the PROJECTION is dead. Those two are opposite findings that every current
      gate reports as the same green, because a checker that returns early on a
      missing tree cannot tell them apart.

      Local-only by declaration rather than by omission, and the reason inverts
      the obvious one: the verdict depends on which host tools are INSTALLED,
      and a CI runner has none. Wired into a workflow, every row would resolve
      `skipped-tool-absent` and the gate would scan nothing — the empty-scope
      false green this repository's gate-coverage manifest exists to refuse.

      This CORRECTS `road-to-skill-ecosystem-runtime-enforcement` Phase 3 Step 2,
      which asked for a continuous-integration-only job. That instruction fits
      the SHAPE half (`check_host_loadability --root .`), which is already
      wired into `consistency.yml` and does not depend on installed tools; it
      does not fit the reach half, and wiring it there would have produced a
      permanently-skipping check that looked like coverage. Measured on a
      developer machine: 6 of 6 host surfaces present and projecting
      (claude-code 13, cursor 228, cline 14, windsurf 215, gemini-cli 1,
      copilot 1).
  - id: check_hook_bundle_content
    class: developer-machine-scoped
    reason: >
      Compares `dist/hooks/dispatch.js` — the bundle that ACTUALLY EXECUTES the
      hooks — against a rebuild from this checkout's sources. `git ls-files
      dist/hooks/` returns ZERO: the bundle is an untracked local build
      artefact, so a fresh CI checkout has none and the gate can only report
      "nothing to compare". Wiring it into a workflow would measure an artefact
      no CI run has, which is the empty-scope false green this repo's
      gate-coverage manifest exists to refuse. Declared rather than wired for
      the same reason `check_single_delivery` below is. The blind spot it
      closes is real and was measured on 2026-08-21: an edit to the git guard's
      authorization window was never rebuilt into the bundle and the guard kept
      enforcing the old value for a full hour. The sibling
      `check_hook_bundle_freshness` did not miss it — that gate is pre-push and
      was never run, and an ordinary edit moves the source mtime, so it would
      have reddened. What it structurally cannot see is the narrower set this
      gate covers: an mtime-preserving write, a `touch` on the bundle, a `cp -p`
      restore. Ordering is not equivalence. That asymmetry is the finding: a green
      CI cannot speak for the bundle a maintainer is running, and only a local
      gate can. Cost measured, like its neighbours in the pre-push set: 0.27s.
  - id: check_single_delivery
    class: developer-machine-scoped
    reason: >
      Compares the two host artefact layers — `~/.claude/**` against
      `<project>/.claude/**` — and the overlap it looks for is a property of the
      DEVELOPER MACHINE, not of the branch. In CI there is nothing to compare:
      `.claude/` is gitignored and no workflow leg installs at user scope, so a
      run finds zero layers on both sides and can only ever report "nothing was
      compared". Measured, not assumed — that is why the gate carries an
      OPTIONAL_SURFACE `allowEmpty` reason rather than treating the absence as a
      dead scope. Declared rather than wired for the same reason
      `check_pr_ci_current` below is: there is no remote equivalent to write, and
      writing one would measure a topology no contributor has. The AI council
      (2/2, 2026-08-19) converged on preflight for exactly this argument. Note the
      gate is registered in REPORT mode while `road-to-single-delivery` Phase 2 is
      halted; the `--enforce` flip lands with the partition and does not change
      this declaration, because enforcing remotely would still have nothing to
      enforce against.
  - id: check_pr_ci_current
    class: pre-push-scoped
    reason: >
      Compares the local branch tip against the open PR head and against the SHA
      the PR's checks actually ran on. In CI that comparison is tautological by
      construction — a workflow runs ON the PR head, so local, PR head and checks
      head are the same commit and the gate can only ever pass. Its whole subject
      is the window BEFORE a push (unpushed work, a green that ran against the
      pre-fix commit, a PR head the checkout cannot reach because Update branch
      was pressed), and that window does not exist inside a run. Declared rather
      than wired: there is no remote equivalent to write, which is the distinction
      this list exists to record. Sibling `check_branch_freshness` is a no-op in
      CI for the same reason — the forge owns mergeability there.
  - id: roadmap_progress_hook
    class: git-hook-scoped
    reason: >
      A git PRE-COMMIT hook script, invoked by the installed hook that
      `install-hooks.sh` writes. CI has no commit to intercept — the commit has
      already happened by the time a workflow runs — so there is no remote
      equivalent to wire it into. Undeclared since main's `fd8c56512`
      ("point the pre-commit roadmap gate at the live script path"), which moved
      the hook onto the real script path and thereby made it visible to this
      checker for the first time; it turned the gate red on the trunk, where
      round 7 found it. Declared rather than wired: the committed-tree equivalent
      is `roadmap:progress-check`, which already runs remotely.
  - id: check_knowledge_sharing
    class: staging-scoped
    reason: >
      Inspects the STAGED set (a gitignored intake file staged anyway via `git add -f`),
      and CI has no staged set — the commit already happened by the time a workflow
      runs. The committed-tree equivalent ("a file that should be gitignored is
      tracked") is a different invariant and would need its own mode, so this is not
      the local-only-by-neglect case the manifest warns about.
