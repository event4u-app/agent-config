# Host-capability facts for `discipline_profile: auto` resolution.
#
# EVIDENCE-GATED NULL-LIFT DISABLE-LIST — not a model taxonomy.
# Council locks (claude-sonnet-4-5 + gpt-4o, 2026-07-07, recorded in
# agents/settings/contexts/weak-host-lift-tiering-verdict.md): entries here
# name ONLY host models with a MEASURED null discipline lift. Speculative
# strong/weak classifications of unmeasured models are FORBIDDEN: they rot
# at model-release cadence and encode certainty no measurement backs.
#
# Entry contract — every entry carries either:
#   - measured: <report date · pinned report · N pairs>   (CLAIMS-grade), or
#   - extrapolated: true + rationale                       (explicit maintainer
#     judgement, labeled as such). Never an unlabeled assumption.
#
# Matching: exact model-id prefix match against the session's model id
# (vendor-neutral — Claude, GPT, Gemini, open-source ids all welcome once
# measured).

lift_disabled_models:
  - id: claude-sonnet-4-6
    measured: "2026-07-05 · internal/bench/reports/ab-v2/2026-07-05T07-00-31Z-ab-v2-paired.json · n=84 pairs, full 30-task corpus, discipline Δ=+0.000 (p=1.0) — ceiling null"
  - id: gpt-5-mini
    measured: "2026-07-07 · internal/bench/reports/ab-v2/2026-07-07T10-33-53Z-ab-v2-paired.json · n=90 pairs, full 30-task corpus via codex prompt-prepend injection — replication FAILED with headroom (corpus Δ=+0.024 p=0.70; trapE family 0.733→0.667). NOT a validated harm claim (capability trend 89%→82% is n.s., p=0.07). Injection-surface confound documented in docs/benchmark.md."

# Resolution for UNMEASURED models, per vendor family — the P2-verdict
# council (2026-07-07, 2-round debate) replaced the earlier blanket
# `lift_enabled` fail-safe: the evidence ledger is now 1 measured lift
# (Claude weak class) vs 2 measured nulls (Claude strong ceiling; GPT weak
# failed replication), so unknown non-Claude hosts default OFF (the lift
# costs 1.2-1.7x and has no measured benefit off-Claude as shipped), while
# unknown Claude-family hosts keep the fail-safe toward the one measured
# lift. This is evidence-structure granularity (WHERE measurements exist),
# not a strength taxonomy; it grows/changes only by measurement.
#
# Family detection: model-id prefix. `claude-` -> anthropic; everything
# else resolves via `default`. Legacy single-value `unknown_default` keys
# are still read by the resolver (mapped onto `default`).
unknown_defaults:
  anthropic: lift_enabled
  default: lift_disabled
