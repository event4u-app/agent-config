# Metric registry — consumer before producer
#
# `road-to-experience-loop-broadening` step 0.3. Every metric this package
# produces declares three things before it lands:
#
#   consumer  — WHO reads it. A person, a gate, a report, a decision record.
#   decision  — WHAT it changes. The decision it feeds, in one falsifiable line.
#   absent    — WHAT FAILS without it. If nothing does, the metric is decoration.
#
# The rule the roadmap states, verbatim: *"A metric with no consumer is telemetry
# decoration and should not land."* The tree's own worked example is the 0.27 %
# dispatch capture figure — a collector whose consumer arrived after the data
# did, so the number existed for months before anyone could say what it changed.
#
# ## What is a metric, for this file
#
# A number this package PRODUCES and keeps: a count in a report, a rate in a
# ledger, a gauge in a gate's output. Not a threshold (that is a decision), not
# a test count (that is a run), and not a number quoted from somewhere else
# (that is a citation, and `docs/CLAIMS.md` governs those).
#
# ## The three fields are prose, and the lint checks shape rather than truth
#
# `lint_metric_consumers` refuses an entry with a missing, empty, or
# boilerplate field. It cannot tell a real consumer from a plausible sentence —
# that is a review judgement — so the honest claim is that the lint makes the
# OMISSION impossible, not that it makes the answer true. Stated here rather
# than discovered by someone who trusted it further than it goes.
#
# ## `unit` and `basis` — how the number was obtained, beside the number
#
# An entry MAY carry `unit:` and MUST carry `basis:` when its unit is `bytes`.
# `basis` is one of:
#
#   measured     — something counted it. A length, a sum, a row count.
#   derived      — arithmetic over a measured quantity. Never a count.
#   proxy        — a different quantity standing in for the one named.
#   unavailable  — not observable from this package. No figure is produced.
#
# The field exists because a derived byte figure and a counted one look
# identical in a cell, and this tree has already been burned by a number quoted
# onward without the conditions that produced it. `git count-objects -v` is the
# standing example of the confusion: it measures a LOCAL object store and is
# never a transfer figure, whatever the unit says.
#
# An `unavailable` entry declares a term that is out of reach, so that a total
# built without it is visibly incomplete rather than quietly wrong. It produces
# no value and must never be estimated into a sum.

metrics:
  - id: attribution-shape-block-count
    producer: src/scripts/check_no_external_sources.ts
    consumer: >-
      the `check_no_external_sources:shape-block` ratchet, and the maintainer
      reading its 56-day expiry.
    decision: >-
      whether a change that adds attribution-shaped text may merge. The ratchet
      fails the build when the count rises above its baseline.
    absent: >-
      new attribution-shaped text lands unnoticed and the debt grows silently;
      the deny-list half would still pass, because it only catches names
      somebody already wrote down.

  - id: skip-paths-estate
    producer: src/scripts/check_suppression_hygiene.ts
    consumer: the shrink-only suppression ratchet, and a reviewer reading its per-entry ledger.
    decision: >-
      whether a new scan exemption may be added. The count may only fall, so an
      addition must be paired with a removal or an argued exception.
    absent: >-
      exemptions accumulate one defensible entry at a time until the gate covers
      nothing, which is the failure mode the per-entry ledger exists to make
      visible.

  - id: gate-scanned-count
    producer: src/scripts/_lib/scan_scope.ts (`reportScanned`, emitted by each gate)
    consumer: src/scripts/check_gate_coverage.ts, against the per-gate `min_scanned` floor.
    decision: >-
      whether a gate's scan scope is still alive. A count below its floor fails
      the build.
    absent: >-
      a gate whose root moved reports success over an empty corpus — "a gate
      that scans nothing exits green", which is the specific way these gates
      fail rather than a general worry.

  - id: unhardened-gate-population
    producer: src/scripts/check_gate_coverage.ts (`list_unhardened_gates`)
    consumer: the `gate-hardening:unhardened-scan-scope` ratchet.
    decision: whether a newly added gate may merge without publishing a scan count.
    absent: >-
      new gates arrive without scope assertions and the hardening effort silently
      stops spreading; the existing gates keep their floors, so nothing else
      would report the regression.

  - id: registered-non-adopters
    producer: src/scripts/check_gate_coverage.ts
    consumer: the `gate-self-test:registered-non-adopters` shrink-only ratchet.
    decision: >-
      whether a newly registered gate may merge without a `--self-test` or an
      explicit exemption marker.
    absent: >-
      a registered gate can prove it READ something (its `scanned:` floor) and
      never that the reading changes its verdict, which is the difference
      between a gate and a log line.

  - id: always-rule-budget-chars
    producer: src/scripts/check_always_budget.ts
    consumer: the always-loaded budget ratchet, and any author adding a kernel rule.
    decision: >-
      whether a rule may be added to, or grown inside, the always-loaded
      prefix. The cap is a ratchet that may only move down.
    absent: >-
      the standing context grows one justified rule at a time and every session
      on every host pays for it, with no single change large enough to argue
      about.

  - id: council-quorum-present
    producer: src/scripts/council_cli.ts
    consumer: the human or agent reading a council verdict, and the release gate that holds on INCONCLUSIVE.
    decision: >-
      whether a council answer counts as convergence or as a degraded single
      seat. A verdict with one of two seats present is recorded as DEGRADED and
      is not convergence.
    absent: >-
      a one-seat answer reads as a council decision, which is exactly the
      over-claim the quorum line exists to prevent.

  - id: repeated-failure-rate
    producer: src/scripts/_lib/repeated_failure.ts
    consumer: >-
      the human or CI reading the per-asset experience report, and the
      pre-registered paired question in
      `agents/evidence/experience-loop-prereg.md` that decides whether the
      broadened loop is kept, narrowed, or dropped.
    decision: >-
      whether widening the learning loop changed anything measurable. A
      reproducible fall in the rate at held quality and non-increased cost keeps
      the loop; a rise, or no movement, is recorded as the pre-registered
      negative and the phases resting on it are not built further.
    absent: >-
      the loop's own effect is unmeasured, so every later phase rests on the
      assumption that widening helped -- which is the assumption the whole
      roadmap exists to test rather than to make. Without it the estate grows
      and nothing can say whether it should have.

  # ── Bytes ───────────────────────────────────────────────────────────────
  #
  # `road-to-a-bytes-row-that-exists`. Before these, a statement of the form
  # "this change moved N bytes" could not be made at all: the tree measured
  # tokens well and bytes not at all, and no row here could have held one.

  - id: tool-raw-bytes
    unit: bytes
    basis: measured
    producer: src/scripts/hooks/tool_result_bytes_hook.ts (`raw_bytes`, per post_tool_use dispatch)
    consumer: >-
      the `tool_result_bytes` stream registered in `src/config/hook-token-budget.json`,
      and the maintainer reading `agents/runtime/state/tool-result-census.jsonl`
      before a tool-result distribution is published.
    decision: >-
      whether a cap on tool-result size is worth introducing, and at what
      value. The distribution has never been observed, so the threshold stays
      uncommitted until this counter has written one.
    absent: >-
      every context-cost claim this package makes is computed against a
      denominator that excludes its own dominant term — the hook-injection
      census measures what this suite puts into context and nothing measures
      what the host's tools do.

  - id: tool-delivered-bytes
    unit: bytes
    basis: measured
    producer: src/scripts/hooks/tool_result_bytes_hook.ts (`delivered_bytes`, same record)
    consumer: >-
      the same census reader, comparing it against `tool-raw-bytes` on the same
      line. Equal by construction today, because nothing in this tree rewrites
      a tool result on its way to the model.
    decision: >-
      whether a result-rewriting mechanism, if one ever lands, reduced anything.
      A non-zero gap between the two columns is the reduction; no gap is no
      reduction.
    absent: >-
      a later release that starts trimming tool results has no before-figure
      and can only assert an improvement. The two columns exist now precisely
      so that claim is a measured delta later rather than a story.

  - id: transcript-bytes-per-token
    unit: bytes_per_token
    basis: measured
    producer: src/scripts/_lib/cc_transcript.ts (`measureBytesPerToken`)
    consumer: >-
      `cache_realization_report` and `session_eol_report`, which multiply a
      token column by it, and any reader checking that division — the two sums
      it was divided from travel with it on every emitted value.
    decision: >-
      whether a byte figure may be derived from this corpus at all. A corpus
      that supplies no ratio produces no byte figure, rather than borrowing one
      measured somewhere else.
    absent: >-
      the only remaining way to turn a token count into bytes is a constant in
      a script, which is correct for the content that produced it and silently
      wrong for everything else — the third conflicting figure this tree has
      already paid to learn about twice.

  - id: provider-bytes-per-call
    unit: bytes
    basis: derived
    producer: >-
      src/scripts/_lib/cc_transcript.ts (`derivedBytes`), surfaced as
      `provider_bytes` by `cache_realization_report` and `session_eol_report`.
    consumer: >-
      the maintainer sizing what a round re-sends, and `check_claims`, which
      refuses a public byte figure whose metric marker resolves to no entry here.
    decision: >-
      whether the volume a stateless chat round re-sends is large enough to act
      on. Every existing reading of that cost is a token count; this is the
      first one in the unit a network is billed in.
    absent: >-
      the re-send cost has no byte figure at all, so any statement about it is
      either a token count wearing the wrong unit or an estimate with nothing
      behind it. That is the state this metric was added to end.

  - id: host-fetch-and-transport-bytes
    unit: bytes
    basis: unavailable
    producer: >-
      none — the host's own fetch tool and the model transport are not
      observable from inside this package, and no producer is planned.
    consumer: >-
      any reader of a byte total, who needs to see which terms the total does
      NOT contain. The entry is the disclosure; there is no value to read.
    decision: >-
      whether a byte total may be published as complete. It may not: these
      terms are out of reach, so every total is a partial one and says so.
    absent: >-
      the two unreachable terms get estimated into a sum to make it look whole,
      and the estimate becomes the figure everybody quotes. Declaring them
      unavailable is what stops a guess from entering a total.
