  - id: check_iron_law_prominence
    argv: ["--quiet"]
    min_scanned: 90
    corpus: "src/rules/*.md (111 at baseline)"
    status: enforced
    no_canary_reason: >-
      a planted rule IS judgeable — this entry is a genuine authoring gap rather than a structural one, and is the first candidate if the mode is ever built.
    note: >
      Emits on stderr, not stdout: `--format json` owns this gate's stdout and a
      count written there would corrupt the payload. The guard reads both streams.
      Corpus boundary, decided 2026-08-20 (council, `leave-unscanned`): `src/skills`
      is deliberately OUT of this gate's corpus. Pointed at it the gate reports 13
      findings (11 `buried_iron_law`, 2 `deep_iron_law`) that nobody currently sees.
      Extending the corpus was declined on three grounds — the gate has no warn
      level, so a staged extension would mean adding a warning mode to an enforced
      blocking gate; the reverted `lint_skill_top_position` attempt showed two gates
      defining one construct incompatibly, and the disputed `deep_iron_law` class is
      still live in those 13; and the premise for scanning skills at all
      (post-compaction truncation keeps the file start) is unverified, the tree's one
