  - id: check_ci_local_parity
    argv: ["--quiet"]
    min_scanned: 340
    corpus: "CI + local gate invocations parsed from .github/workflows + taskfiles (360 measured 2026-08-13: 109 CI + 251 local)"
    status: enforced
    no_canary_reason: >-
      whole-graph: it parses every workflow and taskfile invocation and reports gates present in one set and absent from the other.
    note: >
      Registered 2026-08-02. It already emitted the contract line on every path,
      including the failing one — it was simply never listed, the same omission
      that let check_site_links report green over a stale build. Found by the
      registry-completeness test rather than by another sweep, which is the point
      of adding that test. NO CANARY RECIPE: its corpus is the workflow and
      taskfile set, so the only plantable violation is a new file under
      .github/workflows — a surface the canary must not write to. Reported
      UNPROVEN by --canary, never green.
      FLOOR RE-ANCHORED 380 → 340 on 2026-08-13, and the direction deserves an
      argument rather than a diff.
      The claim is NOT that 443 minus phantoms equals 360 — that arithmetic does
      not close, and pretending otherwise would be the false-precision this
      manifest exists to prevent. 443 was measured on 2026-08-02 against a
      different tree: both a CI-side set inflated by 167 phantoms AND a smaller
      local set than today's. The two totals are not comparable term by term.
      What IS comparable is the repair's own before/after on ONE tree, which is
      the measurement that matters here: CI-side 273 → 106, because gate names
      were being read out of workflow COMMENTS by an extraction bug this gate's
      own repair removed. So the fall is entries that never existed ceasing to be
      counted, not reach being lost — the discriminator false-green.md § 5 asks
      for ("a legitimate ratchet lowers severity while keeping reach"). Reach over
      the real corpus is one unit HIGHER than before this change: the two gates
      wired into consistency.yml were previously reachable from neither side.
      Why 340 and not 360, the measured value: gate-authoring.md § registration
      requires a floor BELOW the live count, because a floor pinned at today's
      number reds on the very change that legitimately retires one unit. 340
      leaves ~20 units (~5.5%) of headroom.
      What this floor can and cannot catch, corrected after the R2 review caught
      the first version arguing from a break that cannot fire it. The extraction
      bug INFLATED the count — phantom gate names entering the CI set — so a
      re-break raises the population to roughly 527 and a min_scanned floor never
      triggers on a rise. The floor guards the opposite direction: an extractor
      that stops finding taskfiles or workflows at all, a parse error zeroing one
      side, a scan root that moves. Those are collapses of 100+ units and 340
      catches every one of them. The realistic PARTIAL break — one taskfile
      failing to parse, say ~14 units — passes 340 and would have failed 380,
      which is the honest cost of the headroom and is accepted here rather than
      hidden: a floor tight enough to catch that is also tight enough to red on
      the next legitimate retirement.

  - id: check_site_links
    argv: []
