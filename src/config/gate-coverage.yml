      prompt cache for the rest of it.

      THE SURFACE LIST IS LOADED, NOT RESTATED. Both this gate and
      `check_preamble_payload_budget` import `PREFIX_STABLE_SURFACES` from
      `_lib/prefix_stable_surfaces.ts`. That refactor is part of the same change:
      the budget gate previously stated its three roots twice inside its own
