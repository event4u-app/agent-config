        {
          "manifest_version": 1,
          "refresh_cadence": "quarterly",
          "upstream": { "last_checked": "2026-07-01" },
          "domains": { "d": { "file": "nope.csv", "search_cols": ["a"], "output_cols": ["b"] } }
        }
    note: >
      `--today` is PINNED in argv on purpose, and it is the whole reason this
      gate is testable at all: the five upstream-vendored corpora share
      `last_checked: 2026-06-07`, so an unpinned reference date makes this row
      flip from green to red on 2026-09-15 with no diff behind it. The pinned
      date keeps the coverage guard measuring COVERAGE; the real calendar check
      is the workflow step, which runs unpinned and is meant to red when the
      cadence is actually missed. Changing the pin is how you re-baseline after a
      re-vendor, and it should be visible in a diff.
      The canary plants a manifest whose declared CSV does not exist — the exact
