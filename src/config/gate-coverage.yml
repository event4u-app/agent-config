      THE DETECTOR TOOK TWO CORRECTIONS, BOTH FROM ITS OWN SELF-TEST, and both
      are pinned as accepting cases so a future widening cannot reintroduce them:
      a bare `$` substring matches TEMPLATE INTERPOLATION (`${value}`), and
      excluding `${` alone still matched a REGEX END ANCHOR (`/\.md$/`). The
      shipped pattern is positive rather than subtractive — a currency `$` is
      followed by a digit or by an interpolated amount — because a gate whose
      first real run produces dozens of false positives gets an allowlist within
      a release and then guards nothing.

      DISCRIMINATION: `--self-test`, 9 cases, 4 rejecting. The canary above
      documents the violating shape for a reader and is honestly NOT the
      discriminator, because a created file lands outside a four-name watchlist.

  - id: lint_promotion_paths
    argv: ["--quiet"]
    min_scanned: 1800
    corpus: "every .ts file under src/ and tests/ (2812 at baseline). The floor is 1800, not 1: this gate's failure shape is a walk that stops at a renamed root or a skip-list that grows, and a partial walk certifies exactly the coverage it did not perform."
    status: enforced
    canary:
      class: contract-violation
      path: src/scripts/__canary_promotion_bypass__.ts
      content: |
        import { parseCandidateRecord } from './_lib/candidate_record.js';
        const promoted = { ...parseCandidateRecord, lifecycle: 'promoted' };
        fs.writeFileSync(path.join(REPO_ROOT, 'src', 'rules', 'x.md'), promoted);
    note: >
      road-to-harness-promotion-bridge — discharge route 1 of the carried
      blocking condition. The condition covers "a verb, a state transition into
      `promoted`, or any write into `src/` derived from a candidate", and the AI
      council of 2026-08-31 ruled it NOT DISCHARGED because only the first two
      were gated. This gate inventories all three limbs across the whole
      authored tree and fails when a promotion-capable write bypasses the single
      guarded capability in `src/scripts/_lib/promotion_capability.ts`.

      THE CAPABILITY IS UNOBTAINABLE WHILE `blocker: merge-authority` IS OPEN,
      and R0 proves that by CALLING it rather than by reading it — a text match
      would pass over a refusal edited into a no-op. Sensitivity of R0 was
      observed: neutralising the refusal makes the gate red with
      "capability obtainable while the blocker is open".

      ANTI-VACUITY IS THE POINT, not a bonus. The condition's own text says a
      check over a population of zero discharges nothing, so three floors are
      asserted separately — 400 files, 4 candidate-derived modules, 10
      filesystem-write sites inside them — each via `assertScanned`, each exiting
      2 rather than green. Live values at baseline: 2812 / 16 / 66.

      THE CANARY IS A GENUINE DISCRIMINATOR here: the corpus is a tree walk, so
      a planted file is in scope and a create-only plant exercises the real red
      path on all three limbs at once. `--self-test` adds 15 cases (9 rejecting)
      covering the forms a single plant cannot reach — the interface-declaration
      accepting pole, a two-argument `assertTransition`, a candidate-derived
      write into a CLONE's `src/` (out of scope: a clone is a candidate's own
      sandbox, already gated by `bench_ab_integrity`'s allowed-delta-path check),
      a candidate-derived READ of `src/`, and prose in a block comment.

      TWO DEFECTS WERE FOUND BY RUNNING IT, both pinned as cases: a substitution
      that rewrote identifiers INSIDE string literals (`cand` in `'ac-cand-'`),
      and an expansion that DESTROYED the `REPO_ROOT` token the rule keys on
      because `REPO_ROOT` is itself a `const`. The first produced a false
      positive on a tmpdir removal; the second silently dropped the R3 half of a
      planted three-limb bypass, which is the failure direction that matters.

  - id: lint_code_comments
    argv: ["--base", "origin/main"]
    min_scanned: 0
    corpus: >
      the source files a change touches, measured against the base ref — a DIFF,
      not a tree walk. The floor is 0 deliberately: a docs-only or config-only
      change legitimately carries no source file, and a floor above 0 would red
      exactly those commits. The scan-scope failure this class exists to catch
      cannot occur here, because there is no committed path list that can go
      stale — the root is `git diff`, and git answers for its own range.
    status: enforced
    canary:
      class: contract-violation
      path: src/scripts/__canary_comment_discipline__.ts
      content: |
        // Hier stehen nur die Werte, die Bedeutung tragen und nicht mehr.
        export const canary = 1;
    note: >
      The carrier `code-comment-discipline` never had, and the one the "Code
      comments English" clause of `language-and-tone` claimed via a `.md`-only
      validator (`check_md_language.ts:175` rejects every other path).

      THE CANARY IS A GENUINE DISCRIMINATOR: the corpus is a diff, a newly
      created file is in it by construction, and the planted content trips the
      `de-comment` class on two function words with no umlaut — the
      transliterated form the real incident was written in, not the easy case.

      DISCRIMINATION IS ALSO PINNED BY FIXTURE, in both directions, because a
      language heuristic is only usable if its near-misses are known:
      `tests/scripts/lint_code_comments.test.ts` asserts silence on an umlauted
      proper name, a non-ASCII sample value inside a code span, a `Ü2` step
      label, and a German user quotation spanning two comment lines — the four
      shapes this repository's own hooks actually contain. Measured over 402
      source files here: zero findings. Measured over the 45 changed files of
      the consumer repository that prompted the gate: 530.

      SENSITIVITY WAS OBSERVED, not assumed: neutralising the German predicate
      turns 4 of the 22 cases red and restoring it turns them green.
