      FAIL-CLOSED on an undecidable target, per the council that resolved
      `which-surfaces-are-prefix-stable` (2026-08-28, 2/2): a write whose target
      is computed at runtime, in a file that ALSO carries a literal resolving
      into a declared surface, fails. Narrow on purpose — a dynamic write in a
      file with no such literal is not reported, because a gate that flagged
      every dynamic write in every hook is one nobody can keep green.

      The floor is 35 against a live 45: room for real concern deletions, far
      above a collapse. `{{.QUIET_FLAG}}` against `argv: []` is safe here —
      `--quiet` suppresses only the success line, and `scanned:` is emitted
      outside that guard.

  - id: check_loss_class_declared
    argv: []
    min_scanned: 45
    corpus: "every hook-manifest concern whose script exists (53 at baseline); of those, the model-facing lossy subset is the gated population"
    status: enforced
    canary:
      class: contract-violation
      path: src/scripts/__canary_loss_class__.ts
      content: |
        // A model-facing lossy transform with no loss_class declaration.
        // As with the sibling gate, the manifest is the corpus, so the
        // discriminator is --self-test rather than this plant.
        const WORD_CAP = 400;
        export function run() {
          return { context: redactLines(body).slice(0, WORD_CAP).join('\n') };
        }
    note: >
      road-to-runtime-context-floors step 3.2. Strictness was decided, not
      assumed: council 2026-08-28 (2/2 convergent) resolved
      `how-strict-the-loss-class-lint-is` as option (b) — FAIL on transforms
      whose output reaches the model, WARN elsewhere. Option (a) (fail
      everywhere in `src/`) buys a first-run backlog whose usual answer is a
      broad allowlist, which this repository has measured emptying a gate;
      option (c) (warn everywhere, ratchet later) is the shape this repository
      has measurably never ratcheted. Both seats added the refinement adopted
      here: unknown reachability is classified as model-reaching.

      MEASURED AT LANDING: **1** module qualifies — `hot_context_hook`, which is
      exactly the `ephemeral-lossy` exemplar `docs/contracts/loss-classes.md`
