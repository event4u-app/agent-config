  - id: lint_framework_leakage
    argv: []
    min_scanned: 350
    corpus: "skills / rules / commands .md actually judged (368 of 438 enumerated; the rest carry a declared exemption the ledger names)"
    status: enforced
    no_canary_reason: >-
      the allowlist is line-keyed against real files, so a planted file has no allowlist anchor and the exemption path goes untested.
    note: >
      Its human summary prints "N hits across M files", where M is files WITH
      HITS — 0 on a clean run. Reading that as coverage is precisely how a
      blind gate looks healthy, so this gate now emits a separate `scanned:`
      count. Its inventory-file exemption was also dead: it compared against
      the retired root AND against 'dist/agent-src' as a single path segment,
      which a '/'-split can never yield.

  - id: lint_plan_risk_register
    argv: []
    min_scanned: 1
    corpus: "ready roadmap files under agents/roadmaps/ top level (6 as of 2026-08-21; 19 at the original baseline: 14 grandfathered + 4 draft-exempt + 1 carrying a live register)"
    status: enforced
    no_canary_reason: >-
      a planted roadmap is judged, but the gate reads the ready-roadmap population to decide scope; an isolated file changes what it scans.
    note: >
      Gate R1 (docs/contracts/plan-review-gates.md § 1). The count is READY
      FILES INSPECTED incl. grandfathered/draft-exempt ones — exemptions are
      reported, never silently skipped.

      Lowered 12 → 5 on 2026-08-21, and the SHAPE of the change matters more
      than the number. The previous note asserted that "a collapse below the
      floor means the roadmaps root moved, not that the corpus went clean."
      That premise is falsified: archiving roadmaps at zero open and zero
      deferred steps dropped the top-level count from 12 to 10 with the root
      untouched — the corpus really did go cleaner, which is what
      road-to-estate-drawdown exists to achieve. A floor pinned to the exact
      corpus size fails on the drawdown succeeding, which is the wrong thing
      to detect.

      So the replacement is deliberately NOT today's count. Re-pinning at 10
      would repeat the defect one archival later and force this note to be
      rewritten every time a roadmap closes. 5 sits structurally below any
      plausible active set while still catching the two failures this floor is
      for: the roadmaps root moving, and the scanner silently reading nothing.
      It is not a target for how many roadmaps ought to exist.

      Count reconciliation, since two numbers move in this change and they
      count different populations: this gate counts READY files at the top
      level of agents/roadmaps/ (12 → 10 here), while
      estate-count-budget.json::active_roadmaps counts NON-DRAFT candidates as
      collect() sees them (11 → 10). The gap is the draft-status file each
      population treats differently; neither number is derivable from the
      other.

      Revisit-if the active set is deliberately grown past ~15, at which point
      5 is uninformatively low, or if a drop is ever traced to a scanner
      defect rather than to archival — either falsifies the number, not the
      obligation.

      Lowered again 10 → 5 on 2026-08-21, during the PR drain that produced the
      paragraph above. 10 was measured against 12 and the drain had already
      taken the corpus to 11 — one file of headroom, so the next archival would
      have reddened CI for the exact reason this entry says is the wrong thing to
      detect. 5 keeps the root-moved / scanner-blind signal (both scan 0) and
      stops the number from needing a commit per archived roadmap.

      Lowered again 5 → 1, and this time the SHAPE changed rather than the
      number. 5 was picked to have headroom and did not: the drain took the
      corpus to 6, so a review provoked the red by archiving one roadmap. The
      lesson is that no absolute floor survives here — this gate's sibling
      `check_estate_count` forbids growth, so the corpus can only shrink and any
      floor above 0 is met eventually. 1 is the smallest value that still
      distinguishes "the scanner read something" from "the root moved or the
      scope is dead", which is the only thing this field was ever asked to
      detect. Revisit-if the gate gains a way to express "non-empty" directly,
      or if a drop to 0 is ever traced to a scanner defect rather than to an
      empty corpus.

  - id: check_estate_count
    argv: []
    min_scanned: 20
    corpus: "active + parked roadmap files (81 at baseline: 38 active, 43 in later/)"
    status: enforced
    canary:
      class: contract-violation
      path: "agents/roadmaps/road-to-canary-estate-count.md"
      content: |
        # Roadmap: canary

        ## Phase 1

        - [ ] **1.1** a step
    note: >
      road-to-estate-drawdown T2. Two halves, one floor: the count half walks the
      committed baseline DOWN only and always has a corpus, so it can carry a
      floor; the one-in-one-out half (T3) is diff-scoped and legitimately weighs
      nothing on a branch that adds no roadmap, which is why the floor counts
      roadmap FILES rather than diff entries.
      The floor is 20 rather than something near today's 81 because THIS gate's
      corpus is the thing it exists to shrink: T1's proposed ceiling is 15 active,
      and a successful campaign would land near 15 + a drained `later/` — a floor
      of 50 would have failed on the day the drawdown worked, which is the exact
      failure this file's own § 3 warns about, pointed the wrong way. 20 still
      cannot survive a collapse: at that point the gate's own `reportScanned`
      fires first. (Set to 50 in the first version, corrected on an R2 finding.)

  - id: check_completion_review
    argv: ["--advisory", "--base", "origin/main"]
    min_scanned: 1
    corpus: "findings artefacts under agents/evidence/reviews/ + the current-diff evaluation (1 at baseline — the evaluation itself; artefact count grows with gated PRs)"
    status: enforced
    no_canary_reason: >-
      git-dependent: it evaluates the current diff against a base ref.
    note: >
      Gate R2 (docs/contracts/plan-review-gates.md § 2). HONEST LIMIT, stated
      because a floor that cannot fail is exactly the false green this file
      exists to prevent: scanned = artefacts inspected + 1 for the diff
      evaluation, so on any run that REACHES the count `min_scanned: 1` cannot
      trip. It is not unreachable in principle — a moved reviews root exits
      before the inventory and reports `scanned: 0`, which the guard does read —
      but that path is the dead-scope violation below, so the floor never adds
      anything the assertion does not already catch.
      NOTHING TRIPS AT ALL DURING THE ADVISORY WINDOW. The argv above
      mirrors the CI invocation, and under `--advisory` every violation kind —
      dead-scan-scope included — is printed as a warning and the exit code is 0.
      So for the duration of the Stage-A window this entry proves only that the
      gate RAN: it has no blocking path and no trippable floor. The blocking
      behaviour is real but dormant — the dead-scan-scope assertion is a policy
      violation, exit 1 (contract § 6 carve-out: a gate that read nothing has not
      passed), which is what makes a moved reviews root fail loudly instead of
      reporting a clean scope. It takes effect when Stage B drops `--advisory`
      from the CI invocation; nothing else changes at that switch. The entry
      stays registered so the guard reports this gate rather than skipping it
      silently.

  - id: check_review_dispositions
    argv: []
    min_scanned: 7
    corpus: "archived round records — `*-review.md` under agents/evidence/reviews/, excluding live `*.findings.md` (9 at baseline)"
    status: enforced
    no_canary_reason: >-
      git-dependent in effect: it reads archived round records whose identity comes from the committed tree, and its own scan-scope guard fails on an empty corpus.
    note: >
      Contract § 2.7. Unlike the R2 entry above, this floor is genuinely
      trippable: the corpus is 9 frozen records and archived records are not
      deleted, so a drop to 7 means the reviews root moved or the naming
      convention drifted — not that the work went clean. That is precisely the
      case rule 3 exists for. The gate reads the FROZEN records because R2
      selects only artefacts in the CURRENT review scope, so a superseded round
      renamed out of the `*.findings.md` glob is read by nothing at all — two
      findings sat recorded as `open` in this repo's own corpus for a day
      through exactly that gap.

  # ---------------------------------------------------------------------------
  # The five below close the gap this header named: they already called
  # `_lib/scan_scope.assertScanned` with a real count and only had to PRINT it.
  # The published number is not agent-derived — it is byte-identical to the value
  # the gate's own dead-scope assertion already gates a red exit on, so there is
  # no fresh judgement about "what a unit is" and no room for a count that drifts
  # from what the gate inspected. That property is what made them convertible
  # without per-gate adjudication; gates whose count would have to be INVENTED
  # are deliberately NOT in this batch — see road-to-gate-hardening-adoption.
  # Floors are ~87 % of the measured baseline: room for legitimate deletions,
  # far above a collapse (rule 3).
  # ---------------------------------------------------------------------------

  - id: lint_handoffs
