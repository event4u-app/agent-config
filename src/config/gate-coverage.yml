  - id: check_no_currency_in_cost_surfaces
    argv: []
    min_scanned: 4
    corpus: "the four cost surfaces road-to-delivered-cost-truth built (4 at baseline) — a named watchlist, not a tree walk"
    status: enforced
    canary:
      class: contract-violation
      path: src/scripts/__canary_currency__.ts
      content: |
        // A planted file is NOT in this gate's corpus by construction — the
        // watchlist is four named files. Discrimination is --self-test's job.
        out.push(`total: $42`);
    note: >
      road-to-delivered-cost-truth AC-7. The suite does not know a consumer's
      contract — subscription, per-token, committed spend, a reseller rate — so
      any monetary figure it printed would be extrapolated from a rate it
      invented. That is worse than no number, because it is actionable and wrong,
      and it is exactly the thing someone reasonably adds back later on the
      grounds that a cost report should show cost.

      SCOPE IS A NAMED LIST, NOT A PATTERN, and that is the load-bearing choice.
      `cache_realization_report` legitimately carries a `cost_usd` block for
