    note: >
      Registered because it emits the `scanned:` contract line, and a test in
      this tree requires every emitter to be registered — it caught this entry
      being absent, which is the coverage register working as intended.

      It exits 0 on a large gap ON PURPOSE. The ±10 % band it was specified with
      assumed packs roughly PARTITION the tree; measured, `dependencies` claims
      4 skills and 0 rules against 291 and 118, so gaps of 84 % and above are a
      property of the tree rather than a defect. A gate red by construction gets
