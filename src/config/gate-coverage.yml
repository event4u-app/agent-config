      untouched original stayed clean. Floor at 450 against a live 503 leaves
      room for skill retirement without redding the change that retires one.

  - id: lint_workflow_paths
    argv: []
    min_scanned: 20
    corpus: "every workflow under .github/workflows (28 at baseline); the unit is the file, and each file's `paths:` / `paths-ignore:` entries are resolved against `git ls-files`"
    status: enforced
    canary:
      class: undetected-antipattern
      path: .github/workflows/zz-canary-workflow-paths.yml
      content: |
        name: Canary
        on:
          pull_request:
            paths:
              - "retired/tree/that/never/existed/**"
        jobs:
          noop:
            runs-on: ubuntu-latest
            steps:
              - run: echo canary
    note: >
      Registered STRICT on day one for the same reason `lint_example_fences`
      was, and on the same evidence standard: the classification pass ran
      BEFORE the gate existed and returned **20 dead entries across 6 workflow
      files**, each classified by hand into one of four causes — a tree retired
      by ADR-051, a gitignored projection that can never appear in a diff, two
      paths moved by the Python-to-TS migration, and bare root paths whose real
      files sit under `src/`. All 20 were repaired in the change that added the
      gate, so the corpus is verified empty rather than unexamined, and an
      advisory gate over it could only ever be ignored. Floor at 20 against a
      live 28 so retiring a workflow does not red the change that retires it.
      Worth recording that the highest-severity hit was invisible to the hand
      census and only the gate found it: `release-validation.yml` filtered on a
      root `marketplace.json` that has never existed, so a version drift in the
      real manifest did not re-trigger the `version-consistency` job whose
      entire purpose is catching that drift.

  - id: check_depth_budget
    argv: []
    min_scanned: 140
    corpus: "on-demand depth files — src/agent-src/contexts/**/*.md + docs/guidelines/**/*.md (161 at baseline)"
    status: enforced
    canary:
