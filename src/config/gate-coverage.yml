    note: >
      Floor 3 against 5 at registration: the template's member list is a shipped
      artifact rather than a draining corpus, but an exact floor would red on a
      legitimate trim of one member. Collapse is covered more strictly from the
      other side — `reportScanned` raises DeadScopeError at 0 members, before
      this floor is consulted at all.

