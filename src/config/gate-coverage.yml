  - id: lint_plan_risk_register
    argv: []
    min_scanned: 1
    corpus: "ready roadmap files under agents/roadmaps/ top level (6 as of 2026-08-21; 19 at the original baseline: 14 grandfathered + 4 draft-exempt + 1 carrying a live register)"
    status: enforced
    no_canary_reason: >-
      a planted roadmap is judged, but the gate reads the ready-roadmap population to decide scope; an isolated file changes what it scans.
    note: >
      Gate R1 (docs/contracts/plan-review-gates.md § 1). The count is READY
      FILES INSPECTED incl. grandfathered/draft-exempt ones — exemptions are
      reported, never silently skipped.

      Lowered 12 → 5 on 2026-08-21, and the SHAPE of the change matters more
      than the number. The previous note asserted that "a collapse below the
      floor means the roadmaps root moved, not that the corpus went clean."
      That premise is falsified: archiving roadmaps at zero open and zero
      deferred steps dropped the top-level count from 12 to 10 with the root
      untouched — the corpus really did go cleaner, which is what
      road-to-estate-drawdown exists to achieve. A floor pinned to the exact
      corpus size fails on the drawdown succeeding, which is the wrong thing
      to detect.

      So the replacement is deliberately NOT today's count. Re-pinning at 10
      would repeat the defect one archival later and force this note to be
      rewritten every time a roadmap closes. 5 sits structurally below any
      plausible active set while still catching the two failures this floor is
      for: the roadmaps root moving, and the scanner silently reading nothing.
      It is not a target for how many roadmaps ought to exist.

      Count reconciliation, since two numbers move in this change and they
      count different populations: this gate counts READY files at the top
      level of agents/roadmaps/ (12 → 10 here), while
      estate-count-budget.json::active_roadmaps counts NON-DRAFT candidates as
      collect() sees them (11 → 10). The gap is the draft-status file each
      population treats differently; neither number is derivable from the
      other.

      Revisit-if the active set is deliberately grown past ~15, at which point
      5 is uninformatively low, or if a drop is ever traced to a scanner
      defect rather than to archival — either falsifies the number, not the
      obligation.

      Lowered again 10 → 5 on 2026-08-21, during the PR drain that produced the
      paragraph above. 10 was measured against 12 and the drain had already
      taken the corpus to 11 — one file of headroom, so the next archival would
      have reddened CI for the exact reason this entry says is the wrong thing to
      detect. 5 keeps the root-moved / scanner-blind signal (both scan 0) and
      stops the number from needing a commit per archived roadmap.

      Lowered again 5 → 1, and this time the SHAPE changed rather than the
      number. 5 was picked to have headroom and did not: the drain took the
      corpus to 6, so a review provoked the red by archiving one roadmap. The
      lesson is that no absolute floor survives here — this gate's sibling
      `check_estate_count` forbids growth, so the corpus can only shrink and any
      floor above 0 is met eventually. 1 is the smallest value that still
      distinguishes "the scanner read something" from "the root moved or the
      scope is dead", which is the only thing this field was ever asked to
      detect. Revisit-if the gate gains a way to express "non-empty" directly,
      or if a drop to 0 is ever traced to a scanner defect rather than to an
      empty corpus.

  - id: check_gate_reachability
    script: src/scripts/check_gate_reachability.ts
    min_scanned: 10
    corpus: "exemption rows in src/config/gate-reachability-exemptions.json PLUS the gate-shaped task targets reachable from neither `task ci`'s transitive closure nor any workflow. Reachability is measured three ways, not two: a workflow may call `task <name>` OR the script directly, and conflating those overstated the hole 39 -> 22 on this tree."
    status: enforced
    no_canary_reason: "The negative control is the gate's own --self-test, run in CI: 4 cases, 2 rejecting, covering BOTH directions — an unreachable target with no row, and a row naming a target that is reachable. It builds throwaway task trees rather than touching this one, which is strictly better than a planted canary here: a canary would mean adding a real unreachable gate target to taskfiles/ and removing it again, and a forgotten one is the exact defect this gate exists to catch."

  # road-to-retired-claims-stay-retired 2.3. The gate was NOT in this manifest
  # before that roadmap widened it: it asserted its scope with plain
  # `assertScanned` and published no machine-readable count, so
  # check_gate_coverage could not see it at all. Widening it to read the
  # publish-surface set is exactly the moment that becomes indefensible — a
  # gate that now decides what may ship on npm should not be the one gate
  # nobody counts.
  - id: check_claims
    argv: []
    min_scanned: 60
    corpus: "ledger entries in docs/CLAIMS.md (97 at registration: 59 backed, 30 unbacked, 8 closed). The gate's SECOND root, the five files in `PUBLISH_SURFACES`, is not summed into this count — ledger entries and files are different units and a sum of the two is a number nobody can re-derive. That root is guarded by `assertWatchlistResolves` inside the gate, which fires when every publish surface has vanished while a retired phrasing is still registered."
    status: enforced
    no_canary_reason: "The gate carries its own `--self-test` (5 cases, 3 rejecting) — so this row is an adopter, not an exemption; the reason field states why a PLANTED canary is additionally unavailable. Beyond the self-test the negative controls are the 30 mechanism tests in tests/scripts/check_claims.test.ts (17) and tests/scripts/check_claims_retired_phrasings.test.ts (13), each building a throwaway tree and running the real script in it. Twenty-one assert a REJECTION, and one publishes the LITERAL historical string (`zero runtime daemon`) that shipped in package.json and .github/about.yml while claim:no-runtime-daemon was already withdrawn. A planted canary here would mean committing a retired phrasing to a real publish surface and removing it again, and a forgotten one is precisely the defect this gate exists to catch."

  - id: check_rule_evidence_declaration
    argv: []
    min_scanned: 10
    corpus: "the ten security / safety-floor rules named in the gate's own SCOPE constant. The floor equals the scope on purpose, unlike every other row here: the corpus is not discovered, it is DECLARED, so a count below it means a row was deleted rather than that the tree shrank. Widening the obligation means adding a row to SCOPE, which raises both numbers together."
    status: enforced
    no_canary_reason: "The gate carries its own `--self-test` (6 cases, 4 rejecting), each building a throwaway src/rules/ tree and running the real gate against it — a missing block, a valueless key, and BOTH directions of the conditional rule: an external-source block missing `normative_level` or `verified_on` must reject, and an `own-analysis` block carrying neither must ACCEPT. That pair is the load-bearing one, because a gate enforcing more than the schema would reject a rule the schema accepts. A planted canary cannot express any of them: the violation is a MODIFICATION of one of ten tracked rule files, and a newly created file lands outside the declared scope by construction. Same class as check_no_automerge_key and check_score_contract."

  - id: check_concern_admissions
    script: src/scripts/check_concern_admissions.ts
    min_scanned: 0
    corpus: "agents/decisions/concern-admissions.jsonl rows PLUS the concerns added since the base ref (a SET DIFFERENCE over ids in src/scripts/hook_manifest.yaml, because a concern is a key inside one file rather than a file of its own). Ships at 0: the 55 pre-existing concerns are grandfathered by that forward-only scope, so the first row arrives with the first new concern, and a MALFORMED ledger is a separate hard error in readLedger() rather than an empty read."
    status: enforced
    no_canary_reason: "The negative control is the gate's own --self-test, which is stronger than a single planted canary and is run in CI: 6 cases, 3 of them rejecting, covering a concern added with no row, a row with a blank answer, and a rejected row naming a live concern — plus two ACCEPT cases that pin the grandfathering, so a gate that started failing everything would not pass either. A planted canary in the real ledger would additionally have to be removed again, and a forgotten one is a false rejection row in a decision record."

  - id: check_estate_count
    argv: []
    min_scanned: 20
    corpus: "active + parked roadmap files (81 at baseline: 38 active, 43 in later/), plus src/scripts/hook_manifest.yaml for the concern axis — a single file read with `git show` at the base ref rather than a third materialised subtree"
    status: enforced
    canary:
      class: contract-violation
      path: "agents/roadmaps/road-to-canary-estate-count.md"
      content: |
        # Roadmap: canary

        ## Phase 1

        - [ ] **1.1** a step
    note: >
      road-to-estate-drawdown T2. Two halves, one floor: the count half walks the
      committed baseline DOWN only and always has a corpus, so it can carry a
      floor; the one-in-one-out half (T3) is diff-scoped and legitimately weighs
      nothing on a branch that adds no roadmap, which is why the floor counts
      roadmap FILES rather than diff entries.
      The floor is 20 rather than something near today's 81 because THIS gate's
      corpus is the thing it exists to shrink: T1's proposed ceiling is 15 active,
      and a successful campaign would land near 15 + a drained `later/` — a floor
      of 50 would have failed on the day the drawdown worked, which is the exact
      failure this file's own § 3 warns about, pointed the wrong way. 20 still
      cannot survive a collapse: at that point the gate's own `reportScanned`
      fires first. (Set to 50 in the first version, corrected on an R2 finding.)

  - id: check_static_parity
    argv: ["--quiet"]
    min_scanned: 20
    corpus: "test files that spell the dispatcher module name, discovered by grep over tests/ and src/. The count is deliberately not written here — it moves with the suite, and four different figures for it appeared across the rounds of this change (R2 round-5 finding 12). The floor is 20, not 1: this gate's silent-failure shape is a discovery COLLAPSE — a grep that stops matching would run two suites of one file each and report them identical, which is the 'gate that scans nothing exits green' case in its most convincing disguise."
    status: enforced
    no_canary_reason: >-
      No plantable violation: the gate's finding is a DIVERGENCE between two
      whole-suite runs, not a pattern in a file. Planting one would mean making
      the collector behave differently under the two runs, i.e. writing the bug
      it exists to detect.
    note: >
      road-to-supervised-telemetry-collector step 4.2 (AC-7). Runs the
      dispatcher-reaching suite twice — collector present-but-off, then aliased
      away entirely — and compares per-test verdicts rather than declaring each
      run green. Two green runs are not the assertion; a test that silently
      turns from `passed` to `skipped` keeps both suites green and only the
      per-test comparison sees it.

      SELF-TEST EXEMPT, with the reason rather than the omission: a
      `--self-test` here would have to spawn two full vitest runs over a fixture
      repository, minutes per invocation, to prove a comparator that is already
      unit-tested with a REJECTING case —
      `tests/scripts/check_static_parity.test.ts` drives `compare()` through the
      `passed → skipped` divergence a length-only check would miss, plus both
      only-in-one-run directions. The discrimination is proven; what is skipped
      is proving it a second time through the slowest possible harness. The
      marker the self-test ratchet reads lives in the gate's own source, beside
      `main` — this note explains it; that line is what is counted.
  - id: check_completion_review
    argv: ["--advisory", "--base", "origin/main"]
    min_scanned: 1
    corpus: "findings artifacts under agents/evidence/reviews/ + the current-diff evaluation (1 at baseline — the evaluation itself; artifact count grows with gated PRs)"
    status: enforced
    no_canary_reason: >-
      git-dependent: it evaluates the current diff against a base ref.
    note: >
      Gate R2 (docs/contracts/plan-review-gates.md § 2). HONEST LIMIT, stated
      because a floor that cannot fail is exactly the false green this file
      exists to prevent: scanned = artifacts inspected + 1 for the diff
      evaluation, so on any run that REACHES the count `min_scanned: 1` cannot
      trip. It is not unreachable in principle — a moved reviews root exits
      before the inventory and reports `scanned: 0`, which the guard does read —
      but that path is the dead-scope violation below, so the floor never adds
      anything the assertion does not already catch.
      NOTHING TRIPS AT ALL DURING THE ADVISORY WINDOW. The argv above
      mirrors the CI invocation, and under `--advisory` every violation kind —
      dead-scan-scope included — is printed as a warning and the exit code is 0.
      So for the duration of the Stage-A window this entry proves only that the
      gate RAN: it has no blocking path and no trippable floor. The blocking
      behaviour is real but dormant — the dead-scan-scope assertion is a policy
      violation, exit 1 (contract § 6 carve-out: a gate that read nothing has not
      passed), which is what makes a moved reviews root fail loudly instead of
      reporting a clean scope. It takes effect when Stage B drops `--advisory`
      from the CI invocation; nothing else changes at that switch. The entry
      stays registered so the guard reports this gate rather than skipping it
      silently.

  - id: check_review_dispositions
    argv: []
    min_scanned: 7
    corpus: "archived round records — `*-review.md` under agents/evidence/reviews/, excluding live `*.findings.md` (9 at baseline)"
    status: enforced
    no_canary_reason: >-
      git-dependent in effect: it reads archived round records whose identity comes from the committed tree, and its own scan-scope guard fails on an empty corpus.
    note: >
      Contract § 2.7. Unlike the R2 entry above, this floor is genuinely
      trippable: the corpus is 9 frozen records and archived records are not
      deleted, so a drop to 7 means the reviews root moved or the naming
      convention drifted — not that the work went clean. That is precisely the
      case rule 3 exists for. The gate reads the FROZEN records because R2
      selects only artifacts in the CURRENT review scope, so a superseded round
      renamed out of the `*.findings.md` glob is read by nothing at all — two
      findings sat recorded as `open` in this repo's own corpus for a day
      through exactly that gap.

  # ---------------------------------------------------------------------------
  # The five below close the gap this header named: they already called
  # `_lib/scan_scope.assertScanned` with a real count and only had to PRINT it.
  # The published number is not agent-derived — it is byte-identical to the value
  # the gate's own dead-scope assertion already gates a red exit on, so there is
  # no fresh judgement about "what a unit is" and no room for a count that drifts
  # from what the gate inspected. That property is what made them convertible
  # without per-gate adjudication; gates whose count would have to be INVENTED
  # are deliberately NOT in this batch — see road-to-gate-hardening-adoption.
  # Floors are ~87 % of the measured baseline: room for legitimate deletions,
