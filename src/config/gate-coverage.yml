# Gate coverage manifest — the input to `check_gate_coverage.ts`.
#
# WHY THIS EXISTS
# ---------------
# On 2026-07-29 a sweep found gates that scanned a tree emptied by the ADR-051
# flat-`src/` migration, reported success, and were wired into CI. One printed
# `TOTAL | 0 | 0 | 0 | 0%`; another printed "All 0 auto-rule descriptions ≤ 150
# chars"; a third "clean (0 declarer(s))". Each exited 0. A gate that inspects
# nothing does not pass — it certifies coverage that does not exist, which is
# worse than having no gate, because the green is believed.
#
# Per-case retargeting does not close this: the next migration recreates it. This
# manifest plus the guard closes it structurally.
#
# THE CONTRACT (three rules, each from a real failure)
# ----------------------------------------------------
# 1. MACHINE-READABLE COUNT. Every listed gate emits exactly one line
#    `scanned: <N>` (stdout or stderr), N = artefacts it actually inspected. The
#    guard never parses a gate's human output — that would make the guard itself
#    fragile, and a fragile guard is the thing being replaced.
#
# 2. CI-IDENTICAL INVOCATION. `argv` MUST match how CI/Taskfile calls the gate.
#    A bare probe produced a false alarm during the sweep: `skill_linter` looked
#    blind when called with no arguments, but CI passes `--all` and it scans 429
#    artefacts. The guard must reproduce the real call or it invents defects.
#
# 3. BASELINE, NOT `> 0`. `min_scanned` is a floor, not a zero-check. A gate that
#    drops from 428 artefacts to 3 is as broken as one that drops to 0, and `> 0`
#    cannot see it. Set the floor below the true corpus (room for legitimate
#    deletions) but far above a collapse.
#
# FIELDS
#   id           script stem under src/scripts/
#   argv         CI-identical arguments (list; empty list = bare call)
#   min_scanned  hard floor; guard fails when the reported count is below it
#   corpus       what the count means — so a future reader can re-derive the floor
#   status       enforced | pending
#                pending = not yet emitting `scanned:`. The guard REPORTS these
#                rather than skipping silently: its own partial coverage must be
#                visible, or it repeats the sin it exists to catch.
#   canary       optional mutation recipe (Phase 7) — see CANARY below
#
# COVERAGE — THE HONEST DENOMINATOR (measured 2026-08-02)
# ------------------------------------------------------
# 211 `lint_*` / `check_*` / `audit_*` scripts live under `src/scripts/`.
# **8 of them emit the machine-readable `scanned: <N>` line under their
# CI-identical argv, and all 8 are listed below.** The manifest is therefore
# complete with respect to its own contract, and covers ~4 % of the gate
# population.
#
# The other ~203 are NOT covered, for one reason: rule 1. They print their count
# in prose ("111 file(s) scanned", "0 declarer(s)") or not at all, and a guard
# that parses prose is the fragile thing being replaced. Padding this list with
# them would manufacture exactly the false green the file exists to prevent.
#
# Closing the gap is one line per gate, not a new mechanism: a gate that already
# computes its count for `_lib/scan_scope.assertScanned` need only also write
# `scanned: <N>`. Seven gates are one line away today — they call `assertScanned`
# / `assertWatchlistResolves` with a real count in hand: `audit_skill_overlap`,
# `check_iron_law_prominence`, `check_safety_floor_untouched`, `lint_handoffs`,
# `lint_namespace`, `lint_artefact_frontmatter`, `skill_linter` (listed).
# `tests/scripts/check_gate_coverage.test.ts` fails the build the moment a gate
# starts emitting the line without being registered here, so the list cannot
# silently fall behind again (that omission is exactly how `check_site_links`
# reported green over a stale build for weeks).
#
# CANARY (road-to-gates-that-can-fail Phase 7)
# --------------------------------------------
# Coverage proves a gate READ something. It cannot prove the gate can still FAIL.
# An optional `canary:` block declares one revertible violation for the gate:
#
#   canary:
#     class:   defect class planted (gate-surface classes, not the review-side
#              five; the shared contract is cadence + sealing + never-ships)
#     path:    repo-relative file to CREATE (must not already exist)
#     content: the planted body
#
# `--canary` plants it, runs the gate with the same CI-identical argv, records
# red/green, and deletes the plant in a `finally`. Create-only is deliberate: an
# in-place edit would need byte-exact restoration of a tracked file, and a canary
# that can corrupt the tree violates the never-ships rule it inherits. The
# consequence is a real gap — a gate whose only possible violation is a
# modification of an existing tracked artefact (`check_condensation`, whose
# contract is `dist == rewrite(src)`; `check_ci_local_parity`, whose corpus is
# workflow files) carries no recipe and is reported UNPROVEN, never green.
gates:
  - id: lint_trigger_collisions
    argv: []
    min_scanned: 90
    corpus: "src/rules/*.md frontmatters (111 at baseline)"
    status: enforced

  - id: check_condensation
    argv: []
    min_scanned: 380
    corpus: "src/ ↔ dist/agent-src/ .md pairs (429 at baseline: 111 rules + 318 skills)"
    status: enforced

  - id: check_augment_description_cap
    argv: []
    min_scanned: 80
    corpus: "auto-type rules carrying a description (98 at baseline)"
    status: enforced
    canary:
      class: oversized-artifact
      path: src/rules/zz-canary-probe.md
      content: |
        ---
        type: auto
        description: "zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz"
        ---

        Planted canary: a 180-char auto-rule description, 30 over the cap.
    note: >
      Retargeted 2026-07-29 from the ADR-051-emptied tree (0 -> 98). It printed
      "All 0 auto-rule descriptions" and exited 0 in CI. Retargeting surfaced 16
      real violations (max 189 chars); all 16 were shortened under explicit
      operator review, with every matching term programmatically verified as
      preserved. The cap was deliberately NOT raised to fit the violations —
      letting a gate adapt to the as-is state is the inversion that produced three
      blind gates in the first place.

  - id: lint_load_context
    argv: []
    min_scanned: 180
    corpus: "md files inspected for a load_context block: src/rules + src/agent-src/contexts + agents/settings/contexts (231 at baseline, 17 declarers)"
    status: enforced
    canary:
      class: dead-target
      path: src/rules/zz-canary-probe.md
      content: |
        ---
        type: auto
        description: "Planted canary rule declaring a load_context target that does not exist."
        load_context:
          - contexts/zz-canary-target-does-not-exist.md
        ---

        Planted canary: a declared context target with nothing behind it.
    note: >
      Retargeted 2026-07-29 from the ADR-051-emptied tree: 0 -> 231 files, and it
      immediately found a real violation the blindness had hidden
      (src/rules/model-recommendation.md declared `../contexts/…`, a disallowed
      relative root; normalised to the canonical `contexts/…` the rule's own prose
      already used). The count is FILES INSPECTED, not declarers — "0 declarers"
      over 400 files is legitimate, "0 files" is blindness, and reporting declarers
      would have hidden exactly this dead root. LEGACY_PREFIX was deliberately NOT
      retargeted: it detects stale pre-relocation entries and must keep
      pointing at the old form.

  - id: skill_linter
    argv: ["--all"]
    min_scanned: 380
    corpus: "skills + rules under artefact_roots() (429 at baseline)"
    status: enforced
    canary:
      class: malformed-frontmatter
      path: src/skills/zz-canary-probe/SKILL.md
      content: |
        Planted canary: a SKILL.md with no frontmatter block at all.
    note: >
      NOT blind — the manifest's regression case for rule 2. The sweep's bare
      probe made it look blind; `--all` scans 429. Enforced precisely so that
      changing `argv` to a bare call fails the guard instead of silently
      reproducing the false alarm.

  - id: check_no_roadmap_refs
    argv: []
    min_scanned: 700
    corpus: "stable artefacts across src/{rules,skills,agent-src/*} + docs/ + agents/settings/contexts (872 at baseline)"
    status: enforced
    canary:
      class: stale-reference
      path: src/rules/zz-canary-probe.md
      content: |
        ---
        type: auto
        description: "Planted canary rule linking a stable artefact into the transient roadmap tree."
        ---

        See [the plan](../../agents/roadmaps/road-to-nowhere.md) — the exact
        stable-to-transient link this gate exists to reject.
    note: >
      Retargeted 2026-07-29 from the ADR-051-emptied tree. It had been enforcing the
      no-roadmap-references rule for docs/ only while the rule + skill layer went
      unscanned — 0 -> 872 artefacts. No violation had slipped through (verified),
      so this closed a latent gap, not a live breach.

  - id: check_context_paths
    argv: []
    min_scanned: 900
    corpus: "reference corpus: src/{rules,skills,agent-src/commands,agent-src/contexts,domains} + agents/roadmaps (1170 at baseline)"
    status: enforced
    canary:
      class: orphan-artifact
      path: src/agent-src/contexts/zz-canary-probe.md
      content: |
        # Planted canary: a context nothing in the reference corpus points at.
    note: >
      Retargeted 2026-07-29. An empty reference corpus makes every "unreferenced
      context" verdict vacuous, which is how the dead root stayed invisible.

  - id: check_ci_local_parity
    argv: ["--quiet"]
    min_scanned: 380
    corpus: "CI + local gate invocations parsed from .github/workflows + taskfiles (443 at baseline)"
    status: enforced
    note: >
      Registered 2026-08-02. It already emitted the contract line on every path,
      including the failing one — it was simply never listed, the same omission
      that let check_site_links report green over a stale build. Found by the
      registry-completeness test rather than by another sweep, which is the point
      of adding that test. NO CANARY RECIPE: its corpus is the workflow and
      taskfile set, so the only plantable violation is a new file under
      .github/workflows — a surface the canary must not write to. Reported
      UNPROVEN by --canary, never green.

  - id: check_site_links
    argv: []
    min_scanned: 20
    unavailable_exit: 2
    corpus: "built HTML pages under site/dist (25 content sources at baseline)"
    status: enforced
    note: >
      Registered 2026-07-30 after it was caught reporting green over a stale build —
      6 pages against 25 content sources, every source newer than the newest page.
      The missing-dist path already exited 2; the stale path did not, so the gate
      could pass while inspecting a build that did not contain the pages under test.
      It now exits 2 on stale, and the floor here catches the partial-build case the
      guard exists for. The lesson of the find is the manifest, not the gate: the
      guard never flagged this because the gate was never listed. A sibling
      silent-green found in the same sweep — the per-pack lint matrix, whose path was
      a double ADR-051 casualty and which exited 0 on an empty match across 17 CI
      shards — is NOT listed here because it was deleted rather than repaired
      (skill_linter --all already covers all 429 artefacts in 0.5s).


  # ── Registered 2026-08-02 (road-to-renewal-foundation Phase 1) ───────────
  # All three were repaired in the same change from scanning a root ADR-051
  # deleted. Each exited 0 the whole time it was blind, which is why the
  # registration matters more than the repair: the repair fixes today, the
  # floor is what makes the next path migration LOUD instead of silent.
  # The roadmap step asked for `assertScanned` to be made mandatory across all
  # corpus gates; this manifest is the stronger form of the same guarantee —
  # `assertScanned` can only distinguish 0 from 1, while a floor also catches
  # the 1566 → 3 collapse that a `> 0` check reports as healthy.

  - id: check_portability
    argv: []
    min_scanned: 1200
    corpus: "all .md under src/ + dist/agent-src/ plus the shipped root files (1,566 at baseline)"
    status: enforced
    note: >
      SCAN_DIRS named the retired authoring root, so the entire src/ tree —
      more than half the corpus — was skipped and an identifier authored there
      was caught only once a condense run projected it into dist/agent-src/.

  - id: check_references
    argv: []
    min_scanned: 800
    corpus: ".md under the scanned roots plus memory YAML (1,043 at baseline)"
    status: enforced
    note: >
      src/ was absent from every reference-resolution candidate list, so a link
      resolvable only under the source of truth was reported BROKEN. The
      failure direction was false-positive rather than false-green, but the
      cause was the same dead root.

  - id: lint_abstraction_thresholds
    argv: []
    min_scanned: 400
    corpus: "src/rules + src/skills + src/agent-src/commands + docs/guidelines .md (533 at baseline)"
    status: enforced
    note: >
      A collapse below the floor would mean the gate stopped reading the tree
      that states extraction thresholds, so a bare or diverging threshold
      (ADR-213 drift) could land while the gate still printed green.

  - id: lint_profile_personas
    argv: []
    min_scanned: 5
    corpus: "src/agent-src/profiles/*.yml (6 seed profiles at baseline)"
    status: enforced
    note: >
      Fewer than 5 profiles scanned would mean the gate stopped reading the
      seed-profile dir, so a defaults.personas id that resolves to no persona
      file could land while the gate still printed green.

  - id: lint_token_budget_discipline
    argv: []
    min_scanned: 200
    corpus: "src/skills/*/SKILL.md (288 at baseline)"
    status: enforced
    note: >
      A collapse below the floor would mean the gate stopped reading the skills
      tree, so a rich-tagged skill without its justification section (or a cap
      breach) could land while the gate still printed green.

  - id: lint_framework_leakage
    argv: []
    min_scanned: 350
    corpus: "skills / rules / commands .md (431 at baseline)"
    status: enforced
    note: >
      Its human summary prints "N hits across M files", where M is files WITH
      HITS — 0 on a clean run. Reading that as coverage is precisely how a
      blind gate looks healthy, so this gate now emits a separate `scanned:`
      count. Its inventory-file exemption was also dead: it compared against
      the retired root AND against 'dist/agent-src' as a single path segment,
      which a '/'-split can never yield.

  - id: lint_plan_risk_register
    argv: []
    min_scanned: 12
    corpus: "ready roadmap files under agents/roadmaps/ top level (19 at baseline: 14 grandfathered + 4 draft-exempt + 1 carrying a live register)"
    status: enforced
    note: >
      Gate R1 (docs/contracts/plan-review-gates.md § 1). The count is READY
      FILES INSPECTED incl. grandfathered/draft-exempt ones — exemptions are
      reported, never silently skipped, so a collapse below the floor means
      the roadmaps root moved, not that the corpus went clean.

  - id: check_completion_review
    argv: ["--advisory", "--base", "origin/main"]
    min_scanned: 1
    corpus: "findings artefacts under agents/evidence/reviews/ + the current-diff evaluation (1 at baseline — the evaluation itself; artefact count grows with gated PRs)"
    status: enforced
    note: >
      Gate R2 (docs/contracts/plan-review-gates.md § 2). HONEST LIMIT, stated
      because a floor that cannot fail is exactly the false green this file
      exists to prevent: scanned = artefacts inspected + 1 for the diff
      evaluation, so on any run that REACHES the count `min_scanned: 1` cannot
      trip. It is not unreachable in principle — a moved reviews root exits
      before the inventory and reports `scanned: 0`, which the guard does read —
      but that path is the dead-scope violation below, so the floor never adds
      anything the assertion does not already catch.
      NOTHING TRIPS AT ALL DURING THE ADVISORY WINDOW. The argv above
      mirrors the CI invocation, and under `--advisory` every violation kind —
      dead-scan-scope included — is printed as a warning and the exit code is 0.
      So for the duration of the Stage-A window this entry proves only that the
      gate RAN: it has no blocking path and no trippable floor. The blocking
      behaviour is real but dormant — the dead-scan-scope assertion is a policy
      violation, exit 1 (contract § 6 carve-out: a gate that read nothing has not
      passed), which is what makes a moved reviews root fail loudly instead of
      reporting a clean scope. It takes effect when Stage B drops `--advisory`
      from the CI invocation; nothing else changes at that switch. The entry
      stays registered so the guard reports this gate rather than skipping it
      silently.
