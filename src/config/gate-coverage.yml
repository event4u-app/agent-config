      DISCRIMINATION is carried by `--self-test` (7 cases, 2 rejecting), NOT by
      the canary. The gate's corpus is the hook manifest, so a planted script
      that no manifest binds is invisible to it by construction — the canary
      above documents the violating SHAPE for a reader and is honestly not the
