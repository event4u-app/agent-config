  - id: lint_framework_leakage
    argv: []
    min_scanned: 350
    corpus: "skills / rules / commands .md actually judged (368 of 438 enumerated; the rest carry a declared exemption the ledger names)"
    status: enforced
    no_canary_reason: >-
      the allowlist is line-keyed against real files, so a planted file has no allowlist anchor and the exemption path goes untested.
    note: >
      Its human summary prints "N hits across M files", where M is files WITH
      HITS — 0 on a clean run. Reading that as coverage is precisely how a
      blind gate looks healthy, so this gate now emits a separate `scanned:`
