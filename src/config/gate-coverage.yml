    argv: ["--quiet"]
    min_scanned: 540
    corpus: "names across src/rules + src/skills + src/agent-src + src/domains/**/command.md (621 at baseline)"
    status: enforced
    no_canary_reason: >-
      collision gate across four roots at once; one planted name collides with nothing.
    note: >
