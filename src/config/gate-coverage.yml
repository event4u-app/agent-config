    note: >
      The argv here is load-bearing, not decoration. Taskfile injects `--quiet`
      (QUIET_FLAG) and this gate read `args[0]` as a positional path, so the CI
      invocation resolved `--quiet` as its skills root, scanned 0 and exited 2 —
      red in `task lint-handoffs`, green when probed bare. Fixed by filtering
      flag-shaped args before the positional read. Registering it under the REAL
      argv is what keeps that regression caught: a bare-probe entry would have
      gone on passing over the broken invocation.

