# Gate coverage manifest — the input to `check_gate_coverage.ts`.
#
# WHY THIS EXISTS
# ---------------
# On 2026-07-29 a sweep found gates that scanned a tree emptied by the ADR-051
# flat-`src/` migration, reported success, and were wired into CI. One printed
# `TOTAL | 0 | 0 | 0 | 0%`; another printed "All 0 auto-rule descriptions ≤ 150
# chars"; a third "clean (0 declarer(s))". Each exited 0. A gate that inspects
# nothing does not pass — it certifies coverage that does not exist, which is
# worse than having no gate, because the green is believed.
#
# Per-case retargeting does not close this: the next migration recreates it. This
# manifest plus the guard closes it structurally.
#
# THE CONTRACT (three rules, each from a real failure)
# ----------------------------------------------------
# 1. MACHINE-READABLE COUNT. Every listed gate emits exactly one line
#    `scanned: <N>` (stdout or stderr), N = artefacts it actually inspected. The
#    guard never parses a gate's human output — that would make the guard itself
#    fragile, and a fragile guard is the thing being replaced.
#
# 2. CI-IDENTICAL INVOCATION. `argv` MUST match how CI/Taskfile calls the gate.
#    A bare probe produced a false alarm during the sweep: `skill_linter` looked
#    blind when called with no arguments, but CI passes `--all` and it scans 429
#    artefacts. The guard must reproduce the real call or it invents defects.
#
# 3. BASELINE, NOT `> 0`. `min_scanned` is a floor, not a zero-check. A gate that
#    drops from 428 artefacts to 3 is as broken as one that drops to 0, and `> 0`
#    cannot see it. Set the floor below the true corpus (room for legitimate
#    deletions) but far above a collapse.
#
# FIELDS
#   id           script stem under src/scripts/
#   argv         CI-identical arguments (list; empty list = bare call)
#   min_scanned  hard floor; guard fails when the reported count is below it
#   corpus       what the count means — so a future reader can re-derive the floor
#   status       enforced | pending
#                pending = not yet emitting `scanned:`. The guard REPORTS these
#                rather than skipping silently: its own partial coverage must be
#                visible, or it repeats the sin it exists to catch.
#   canary       optional mutation recipe (Phase 7) — see CANARY below
#
# COVERAGE — THE HONEST DENOMINATOR (re-measured 2026-08-18)
# ----------------------------------------------------------
# 272 `lint_*` / `check_*` / `audit_*` scripts live under `src/scripts/`
# (the count is computed, not asserted — `check_gate_coverage.count_gate_scripts`,
# re-run 2026-08-22 and it returns 272).
# **47 of them emit the machine-readable `scanned: <N>` line under their
# CI-identical argv, and 44 of those 47 are listed below.** The manifest is
# therefore complete with respect to its own contract for every gate that can
# carry a floor, and covers ~17 % of the population.
#
# RECOUNTED on 2026-08-22, and it was wrong on every figure before the recount —
# which is the fourth time, and the reason this paragraph keeps asking to be
# computed. `check_no_stub_inventory_table` added ONE row and ONE script, but the
# readings moved by more than one in three of the four places: population
# 269 -> 272 (two scripts had landed since 2026-08-21 without touching this
# prose), listed rows 42 -> 44 (the file already held 43 before this change; the
# prose had again been adjusted instead of recounted, and the paragraph below
# says so about its own previous revision), emitters 45 -> 47. Every number here
# is reproducible: `grep -c '^  - id:' src/config/gate-coverage.yml` for the rows
# and `count_gate_scripts()` for the population.
#
# Both halves were RE-DERIVED on 2026-08-21, not incremented, and the previous
# reading was off by one in a way worth recording: it said "42 … and 41 of those
# 42 are listed" while the file carried 42 rows AND named one deliberately
# unlisted emitter (`lint_evidence_artifacts`, below). Those three facts cannot
# all hold — 42 listed rows plus 1 unlisted emitter is 43 emitters, not 42. It
# is the same drift this section documents three times: an entry was added and
# the prose was adjusted by one instead of recounted.
#
# The derivation now, so the next reader can check it rather than trust it:
# `grep -c '^  - id:'` returns 44 (computable, and computed); every listed row
# is an emitter, because a row that did not emit could carry no floor and the
# guard would report it `failing`; THREE emitters are deliberately unlisted —
# `lint_evidence_artifacts` (below), `adr_cite_check` and
# `check_new_adr_evidence` (each in the block where its row would have sat);
# 44 + 3 = 47. The population figure comes from the function, and
# `check_new_adr_evidence` matches the population prefix whether or not it
# carries a row here.
#
# `adr/evidence_census` emits a `scanned:` line too and is NOT in either number:
# it carries no `lint|check|audit` prefix, so `count_gate_scripts()` never sees
# it. Named because the omission looks like a fourth miscount and is not one —
# an emitter outside the population cannot be an unlisted emitter within it.
#
# Corrected in completion review, and it is the third time this paragraph has
# been off by one — which is the argument for computing it rather than
# adjusting it. The previous reading said 43 listed and self-invited a `grep`
# that returns 42, so the check it offered refuted the sentence containing it.
# The cause each time is the same: a row was added or removed and the prose
# was incremented instead of recounted.
#
# A shape-grep over `src/scripts/` (`reportScanned(` or a literal `scanned: ${`)
# returns 63 files. That is a DIFFERENT population — any file carrying an emit
# shape, including gates that emit only in a non-CI mode — so it is not a
# recount of this sentence and must not be substituted for one.
#
# Three emitters are deliberately NOT listed, all for one reason. The first is
# `lint_evidence_artifacts`, for the same reason `check_rule_projection_integrity`
# is not (see the paragraph below): it is diff-scoped, so it legitimately emits
# `scanned: 0` on any
# branch that adds no evidence artifact, and `min_scanned: 0` is the
# false-count shape this file rejects. Its ledger half IS discharged — it
# adopts `_lib/gate_ledger.ts` and `_lib/scan_scope.ts`, so
# `check_gate_completeness` counts it as an adopter.
#
# Counting emitters rather than rows is the point of stating both numbers: the
# 2026-08-05 and 2026-08-10 readings below were miscounts precisely because one
# number was updated and the other was not.
# (The 2026-08-05 reading said "32 … and all 31 are listed" and the 2026-08-10
# reading said "33 … and all 33" while 34 entries were listed — those two are
# the MISCOUNTS this paragraph exists to warn about, and they are listed here
# precisely because they were wrong, not correct-at-the-time. The 2026-08-13
# reading ("257 … 35 of them") and the 2026-08-15 reading ("259 … 36 of them")
# were both correct when written.
# Both halves are RECOUNTED here on 2026-08-16: 260 is what
# `count_gate_scripts()` returns on the tree that carries this change, and 37 is
# `grep -c '^  - id:'` on this file. Neither number was derived by adding one to
# the previous prose, which is the move the note below forbids — and the
# temptation was live, because this change does add exactly one of each.)
#
# A 2026-08-13 revision of this paragraph first wrote 256, derived as "255 before
# this change plus the one it adds" — inside the sentence claiming to have
# recounted. It was wrong twice over: 255 was already the reading WITH the new
# script present, and arithmetic on the previous prose is the exact move this
# paragraph forbids. Recorded rather than quietly corrected, because a
# denominator that goes stale by being adjusted is the failure documented here
# twice before, and the third instance is the one that shows the note is not
# enough on its own.
#
# Two revisions of this header have now gone stale the same way. It claimed
# "8 of 211", then "22 of 223" while 26 entries were listed. Both halves drift
# for the same reason: entries are added without the header following. Numbers
# written in prose beside a mechanism that can compute them is how a denominator
# goes stale — the population figure comes from the function, the
# honest-denominator test bounds the drift on that half, and the emitter half
# stays a manual count until something computes it too. If you add an entry,
# the two numbers in the paragraph above are part of the diff.
#
# The other ~209 are NOT covered, for one reason: rule 1. They print their count
# in prose ("111 file(s) scanned", "0 declarer(s)") or not at all, and a guard
# that parses prose is the fragile thing being replaced. Padding this list with
# them would manufacture exactly the false green the file exists to prevent.
#
# THE "SEVEN GATES ONE LINE AWAY" NOTE IS DISCHARGED (2026-08-04). It named
# `audit_skill_overlap`, `check_iron_law_prominence`, `check_safety_floor_untouched`,
# `lint_handoffs`, `lint_namespace`, `lint_artefact_frontmatter`, `skill_linter`.
# Five are now converted and listed below; `skill_linter` was already listed when
# the note was written. `check_safety_floor_untouched` is deliberately NOT
# converted: it is the one watch-list gate, so its "count" is the size of a fixed
# guard list (4), not a corpus. A floor under a constant can never trip — that is
# the false-count shape Phase 2 of the roadmap repaired, and re-introducing it
# here to raise a coverage number would be the manufactured green this file
# exists to prevent. It stays unlisted, named, with the reason.
#
# What remains is NOT one line per gate. For the ~201 the count would have to be
# INVENTED (what is this gate's unit?) rather than published, and that judgement
# is per-gate. It was tracked as a vulnerability ratchet — `gate-hardening:
# unhardened-scan-scope` in src/config/gate-violation-baselines.json, which
# failed on a RISE and targeted 0 — under the road-to-gate-hardening-adoption
# charter. That charter closed 2026-08-05: the count reached 0 and the baseline
# entry was DELETED rather than zeroed, so `checkRatchet` now returns
# `unbaselined` with `ok = (actual === 0)`. Zero is mandatory, not a floor — any
# new gate written without a scope assertion reds immediately, and
# `tests/scripts/check_gate_coverage.test.ts` pins both the empty population and
# the entry's continued absence.
#
# `tests/scripts/check_gate_coverage.test.ts` fails the build the moment a gate
# starts emitting the line without being registered here, so the list cannot
# silently fall behind again (that omission is exactly how `check_site_links`
# reported green over a stale build for weeks).
#
# THAT BACKSTOP COVERS ONE OF THE TWO EMIT SHAPES — measured 2026-08-08 under
# round-6 Phase 4.1, and corrected here rather than left as a claim the file
# cannot support. The test's detector is a literal-source regex:
# `/(?:process\.(?:stdout|stderr)\.write|lines\.push)\(\s*`scanned: \$\{/`. A gate
# that emits through `_lib/scan_scope.ts` — `assertScanned()` / `reportScanned()`,
# which is the shape this repo tells a gate author to use — writes the line from
# inside the library, so its own source never matches and the test cannot see it.
# Live split: **1 unregistered gate emits the inline shape (`check_gate_coverage`
# itself), and 205 of 251 gate scripts emit through the helper.** So for the
# recommended shape the sentence above is false, and the list CAN fall behind.
#
# Not widened here, deliberately. Widening the regex to include the helper turns
# 175 gates into findings in one diff, and the paragraph below already states why
# that is not a one-line-per-gate job: their unit would have to be INVENTED, which
# is a per-gate judgement. `check_rule_projection_integrity` (conformance-round5
# Phase 1.1/1.2) is a worked example of the blocker — it emits 330 through
# `assertScanned`, but `agents/.agent-tools.yml` is `skip-worktree`-masked to
# `tools: []` on a maintainer checkout, so the same gate legitimately emits 0
# there. A real floor would red locally and a `min_scanned: 0` floor is the
# false-count shape this file rejects, and `unavailable_exit` cannot express it
# because the empty case must keep exiting 0 (it runs first in the pre-push
# `preflight` chain and blocking there is what PR #1211 repaired). It is therefore
# NOT registered, with the reason, rather than registered with a floor that cannot
# hold. Its ledger half is discharged: it adopts `_lib/gate_ledger.ts`, so
# `check_gate_completeness` already counts it as an adopter.
#
# CANARY (road-to-gates-that-can-fail Phase 7)
# --------------------------------------------
# Coverage proves a gate READ something. It cannot prove the gate can still FAIL.
# An optional `canary:` block declares one revertible violation for the gate:
#
#   canary:
#     class:   defect class planted (gate-surface classes, not the review-side
#              five; the shared contract is cadence + sealing + never-ships)
#     path:    repo-relative file to CREATE (must not already exist)
#     content: the planted body
#
# `--canary` plants it, runs the gate with the same CI-identical argv, records
# red/green, and deletes the plant in a `finally`. Create-only is deliberate: an
# in-place edit would need byte-exact restoration of a tracked file, and a canary
# that can corrupt the tree violates the never-ships rule it inherits. The
# consequence is a real gap — a gate whose only possible violation is a
# modification of an existing tracked artefact (`check_condensation`, whose
# contract is `dist == rewrite(src)`; `check_ci_local_parity`, whose corpus is
# workflow files) carries no recipe and is reported UNPROVEN, never green.
gates:
  - id: check_gate_completeness
    argv: []
    min_scanned: 180
    corpus: "gates reachable from the `ci` / `consistency` task roots (220 at baseline)"
    status: enforced
    no_canary_reason: >-
      whole-graph: it parses every gate invocation in the task roots at once, so a planted file has no property to violate — the defect it detects is a MISSING edge, which cannot be planted.
    note: >
      Floor set below the live count on purpose: the registered set legitimately
      shrinks when a gate is retired, and a floor pinned at today's exact number
      would red on the very change that removes one. It is still high enough
      that a broken closure walk — the dead-scan-root shape one level up, where
      the Taskfile parse degrades and the population silently collapses —
      cannot pass.

  - id: check_rule_layer_partition
    argv: []
    min_scanned: 0
    corpus: "the five project rule directories that receive a projected tree (.claude/rules, .cursor/rules, .clinerules, .windsurf/rules, .augment/rules)"
    status: enforced
    no_canary_reason: >-
      cross-tree: the violation is one rule appearing in two projected trees, so it needs both trees, not a file.
    note: >
      `min_scanned: 0` is the honest floor and not the false-count shape this file
      rejects elsewhere. This gate compares a project rule directory against its
      host's GLOBAL layer, and on a fresh CI checkout neither side exists — the
      project trees are gitignored and no CI leg installs at user scope. So the
      population is legitimately zero there, exactly as it is for the diff-scoped
      gates the header paragraph carves out.
      What keeps a zero from reading as a pass is inside the gate rather than in
      this floor: with nothing compared it prints "nothing compared — N skipped.
      This is not a pass" instead of a success line, and every skip names the host
      and the unreadable path. Teeth land on a working checkout, where `task
      preflight` runs it against real global layers.
      It never reports a duplicate for a host whose global layer cannot be read: a
      project copy is the only carrier when the global one is absent, so demanding
      its removal on unread evidence would delete the rule from that host —
      the failure `partitionEligibility`'s fail-safe ordering exists to prevent.

  - id: check_rule_activation_census
    argv: []
    min_scanned: 100
    corpus: "rule files under src/rules/ (117 at baseline)"
    status: enforced
    no_canary_reason: >-
      whole-corpus census: it reports an aggregate over every rule; a single planted rule moves a number rather than producing a red.
    note: >
      Floor set below the live count so a legitimate rule retirement does not red
      the gate that watches activation. It is still far above a collapse: if the
      rule root moved, this gate's own assertScanned fires first and the manifest
      row is the second net. The gate exists because commit 33c7c20 moved nineteen
      rules from path-scoped to always-on with nothing watching, so a version of
      it that silently scanned zero would be the same failure twice.

  - id: check_rule_stub_ceiling
    argv: []
    min_scanned: 100
    corpus: "rule files under src/rules/ (117 at baseline; 44 carry a migration pointer)"
    status: enforced
    note: >
      Scans the whole rule root and reports that count, not the 44 migrated rules
      it ratchets — the denominator is what proves the root still exists, and a
      floor on the migrated subset would fall as rules legitimately finish
      migrating. Floor set below the live 117 so a rule retirement does not red
      the gate. The gate's own assertScanned fires first if the root moves; this
      row is the second net. It exists because the sibling census pins the corpus
      total with a 2,000-token drift allowance, which is green while one rule
      grows and another shrinks — measured at adoption, the corpus sat 411 tokens
      above its pinned baseline with that gate green.
    canary:
      class: contract-violation
      path: src/rules/zz-canary-stub-probe.md
      content: |
        ---
        type: "auto"
        ---

        # ZZ canary probe

        Body migrated to `guideline:zz-canary-target-that-does-not-exist`.
      # A created rule is the create-only shape this gate is built for: it carries
      # a migration pointer whose target resolves nowhere AND has no ceiling in the
      # baseline, so it trips two independent axes. Without a recipe the gate would
      # ship permanently UNPROVEN — a green run over a real corpus is not evidence
      # that the reading changes the verdict, which is the whole point of the
      # canary. The gate also carries a `--self-test` with seven rejecting cases;
      # the two prove different things and neither replaces the other.

  - id: check_review_schema
    argv: []
    min_scanned: 1
    corpus: "committed review-findings ledgers under agents/evidence/release-findings/ (1 at baseline)"
    status: enforced
    canary:
      class: contract-violation
      path: agents/evidence/release-findings/zz-canary-probe.json
      content: |
        {
          "schema_version": 1,
          "release": "0.0.0-canary",
          "review_independence": "same-family",
          "acceptance_status": "accepted",
          "assurance": "independent",
          "reviewers": ["anthropic", "anthropic"],
          "findings": []
        }
    note: >
      Floor is 1 because the corpus genuinely holds one ledger today, and a
      floor of 0 would let the directory empty out silently — the shape this
      manifest exists to refuse. The canary plants the exact defect the gate was
      built for: a same-family reviewer set claiming `accepted`. It must red.

  - id: check_evaluator_schema
    argv: []
    min_scanned: 5
    corpus: "registered evaluator x recorded verifier fixture pairs (6 at baseline)"
    status: enforced
    canary:
      class: contract-violation
      path: tests/fixtures/evaluator-output/lint_output_slop.degraded.stdout
      content: |
        planted canary: output with no clean sentinel and no file:line rows
    note: >
      The corpus is (evaluator x fixture) pairs, not evaluators, because the
      mapping is what can be wrong and each flavour exercises a different branch
      of it. The floor sits below the live count so retiring one fixture flavour
      does not red the change that retires it, but above 3 so a corpus that
      silently collapsed to green-only cannot pass — a green-only corpus cannot
      distinguish a working adapter from one that hardcodes success, which is
      the whole reason red and degraded fixtures are committed alongside.
      The canary plants a `degraded` stdout with no matching `.exit`, so the
      adapter reads exit 0 with an unparseable body: expected `unreadable`,
      asserted `present` by the green expectation table -> the gate must fail.

  - id: check_suppression_hygiene
    argv: []
    min_scanned: 8
    corpus: "declared human-authored suppression surfaces (10 at baseline)"
    status: enforced
    no_canary_reason: >-
      cross-file: a suppression is a violation only against the declared surface that authorises it, so the pair is the unit.
    note: >
      The denominator is the INVENTORY, not the entry count — the gate's job is
      that every suppression surface is accounted for, and a surface list that
      collapsed to nothing must not read as "no suppressions to check".

  - id: lint_adr_sweep_routing
    argv: []
    min_scanned: 20
    corpus: "candidate rows (REVIEW-NOW / SUPERSEDE (candidate)) across docs/decisions/adr-evidence-sweep-*.md (26 at baseline, in one artifact)"
    status: enforced
    canary:
      class: unrouted-candidate
      path: docs/decisions/adr-evidence-sweep-zz-canary-probe.md
      content: |
        # ADR evidence sweep — canary probe

        | Record | Disposition | Why |
        |---|---|---|
        | ADR-9999 | REVIEW-NOW | canary probe row |

        ## Candidate routing

        | Record | Disposition | Route | Dated follow-up |
        |---|---|---|---|
        | ADR-9999 | REVIEW-NOW | council | when we get to it |
    note: >
      The floor is 20 rather than 26 because a candidate LEAVING the population
      is the point of the sweep: every disposition that lands takes its row out
      of the count, so a tight floor would red on the gate working. It is far
      above a collapse — a scan that stopped seeing the artifact reports 0.

  - id: check_requirements_trace
    argv: []
    min_scanned: 15
    corpus: "roadmap files at the top level of agents/roadmaps/ (25 at registration, 2026-08-22)"
    status: enforced
    note: >
      A LISTING gate: it exits 0 always, including on a dangling `[AC:]` ref and
      on an empty corpus. Registered here for its `scanned:` floor rather than
      for a pass/fail verdict — the floor is the only thing about it that can
      break, and a scan that stops seeing agents/roadmaps/ would otherwise
      report an empty inventory as a clean one. Floor 15 against 25 at
      registration: the active estate is being drained deliberately and is
      expected to shrink, so a tight floor would red on the drain working.

  - id: lint_trigger_collisions
    argv: []
    min_scanned: 90
    corpus: "src/rules/*.md frontmatters (111 at baseline)"
    status: enforced
    no_canary_reason: >-
      pairwise: a collision needs two rules, and which two is the finding — a single planted file collides with nothing.

  - id: lint_rule_skill_pack_reach
    argv: ["--quiet"]
    min_scanned: 90
    corpus: "src/rules/*.md frontmatters joined against src/skills packs and the pack registry (116 rules at baseline)"
    status: enforced
    no_canary_reason: >-
      join: rule frontmatter against the skills tree and the pack registry; a planted rule needs a matching planted pack graph to be judged.
    note: >
      Advisory on findings, enforced on COVERAGE: the gate exits 0 while its
      unreachable-route set is non-empty (12 at introduction), so only this
      floor can catch it going blind. A collapse below 90 would mean it stopped
      reading src/rules, which is exactly the shape that would make "0 findings"
      read as clean.

  - id: check_condensation
    argv: []
    min_scanned: 380
    corpus: "src/ ↔ dist/agent-src/ .md pairs (429 at baseline: 111 rules + 318 skills)"
    status: enforced
    no_canary_reason: >-
      byte-equality between src/ and dist/agent-src/ pairs — the property is a relation between two trees, not a file.

  - id: check_augment_description_cap
    argv: []
    min_scanned: 80
    corpus: "auto-type rules carrying a description (98 at baseline)"
    status: enforced
    canary:
      class: oversized-artifact
      path: src/rules/zz-canary-probe.md
      content: |
        ---
        type: auto
        description: "zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz"
        ---

        Planted canary: a 180-char auto-rule description, 30 over the cap.
    note: >
      Retargeted 2026-07-29 from the ADR-051-emptied tree (0 -> 98). It printed
      "All 0 auto-rule descriptions" and exited 0 in CI. Retargeting surfaced 16
      real violations (max 189 chars); all 16 were shortened under explicit
      operator review, with every matching term programmatically verified as
      preserved. The cap was deliberately NOT raised to fit the violations —
      letting a gate adapt to the as-is state is the inversion that produced three
      blind gates in the first place.

  - id: lint_load_context
    argv: []
    min_scanned: 180
    corpus: "md files inspected for a load_context block: src/rules + src/agent-src/contexts + agents/settings/contexts (231 at baseline, 17 declarers)"
    status: enforced
    canary:
      class: dead-target
      path: src/rules/zz-canary-probe.md
      content: |
        ---
        type: auto
        description: "Planted canary rule declaring a load_context target that does not exist."
        load_context:
          - contexts/zz-canary-target-does-not-exist.md
        ---

        Planted canary: a declared context target with nothing behind it.
    note: >
      Retargeted 2026-07-29 from the ADR-051-emptied tree: 0 -> 231 files, and it
      immediately found a real violation the blindness had hidden
      (src/rules/model-recommendation.md declared `../contexts/…`, a disallowed
      relative root; normalised to the canonical `contexts/…` the rule's own prose
      already used). The count is FILES INSPECTED, not declarers — "0 declarers"
      over 400 files is legitimate, "0 files" is blindness, and reporting declarers
      would have hidden exactly this dead root. LEGACY_PREFIX was deliberately NOT
      retargeted: it detects stale pre-relocation entries and must keep
      pointing at the old form.

  - id: skill_linter
    argv: ["--all"]
    min_scanned: 380
    corpus: "skills + rules under artefact_roots() (429 at baseline)"
    status: enforced
    canary:
      class: malformed-frontmatter
      path: src/skills/zz-canary-probe/SKILL.md
      content: |
        Planted canary: a SKILL.md with no frontmatter block at all.
    note: >
      NOT blind — the manifest's regression case for rule 2. The sweep's bare
      probe made it look blind; `--all` scans 429. Enforced precisely so that
      changing `argv` to a bare call fails the guard instead of silently
      reproducing the false alarm.

  - id: check_no_roadmap_refs
    argv: []
    min_scanned: 700
    corpus: "stable artefacts across src/{rules,skills,agent-src/*} + docs/ + agents/settings/contexts (872 at baseline)"
    status: enforced
    canary:
      class: stale-reference
      path: src/rules/zz-canary-probe.md
      content: |
        ---
        type: auto
        description: "Planted canary rule linking a stable artefact into the transient roadmap tree."
        ---

        See [the plan](../../agents/roadmaps/road-to-nowhere.md) — the exact
        stable-to-transient link this gate exists to reject.
    note: >
      Retargeted 2026-07-29 from the ADR-051-emptied tree. It had been enforcing the
      no-roadmap-references rule for docs/ only while the rule + skill layer went
      unscanned — 0 -> 872 artefacts. No violation had slipped through (verified),
      so this closed a latent gap, not a live breach.

  - id: check_context_paths
