      not a broken detector, and it is why the floor below is set on the SCANNED
      corpus (53 hook scripts) rather than on the gated subset.

      THE DETECTOR READS CODE, NOT PROSE. Its first cut matched `truncat` inside
      three docblocks that describe truncation without performing any and
      reported a corpus of four; three of those four were comments. Comments are
      stripped before matching, and one self-test case pins that direction
      ("prose about truncation is not truncation"), because a gate that fires on
      writing about a defect is how a real corpus of one becomes a pro-forma
      corpus of four.

      DISCRIMINATION: `--self-test`, 8 cases, 3 rejecting — including the two
      that matter beyond "missing declaration": a `recoverable-lossy` with no
      `loss_recovery` locator (without it the class is indistinguishable from
      `ephemeral-lossy`) and a misspelled class name.

  - id: check_benchmark_report_fields
