  - id: lint_scheduled_deprecations
    argv: ["--quiet"]
    min_scanned: 1
    corpus: "rows of the `docs/MIGRATION.md` scheduled-deprecations table (3 at baseline)"
    status: enforced
    no_canary_reason: >-
      discrimination is proven by the gate's own `--self-test` (10 cases, 6 rejecting) driving the real binary, which covers the due-at-the-cut case a create-only canary could not express.
    note: >
      `argv` carries `--quiet` because that is what the task passes: the
      Taskfile resolves `{{.QUIET_FLAG}}` to `--quiet` unless
      AGENT_SCRIPT_VERBOSITY=verbose, and the consistency workflow goes through
      the same task. It passed as a bare call only because `reportScanned` is
      not quiet-gated while this gate's success line and ledger report are — a
      coincidence, not the contract rule 2 states.
      The floor is 1, not "a floor comfortably below the corpus", and the reason
      is worth stating rather than hiding: the corpus is three rows, so no floor
      exists that is both below it and far above a collapse. What the floor
      actually buys here is the contract that the count is PUBLISHED; the
      collapse case — a drifted heading or a reformatted table parsing to zero
      rows — is caught one layer up by the gate's own `reportScanned`
      assertion, which reds instead of printing a green line over nothing.
      That case is the gate's own subject, so it is pinned by a test fixture
      too (`a table that parses to zero rows reds rather than exiting green`).
      No `canary:` recipe: this gate's only violation shape is a MODIFICATION of
      a tracked artifact (`docs/MIGRATION.md`), and the canary contract is
      create-only, so it reports UNPROVEN rather than green. Discrimination is
      proven instead by paired fixtures in
      `tests/scripts/lint_scheduled_deprecations.test.ts`, verified by mutation:
      widening the overdue threshold fails the overdue-by-construction case, and
      granting `allowEmpty` fails the zero-row case.

  - id: check_source_size_budget
    argv: []
    min_scanned: 900
    corpus: "TypeScript sources — src/**/*.ts excluding *.d.ts and *.test.ts, the same two kinds _lib/gate_population excludes (1,063 at baseline)"
    status: enforced
    no_canary_reason: >-
      the canary contract is create-only and this gate's violation is a MODIFICATION — a file crossing its line ceiling. Discrimination is proven by the gate's own `--self-test`, including a boundary case and a dead scan root.
    # No `canary:` recipe, and the reason is the canary contract's own shape
    # rather than a gap. The violation this gate detects is a file OVER 1,500
    # lines, so a create-only recipe would have to inline 1,501 lines of content
    # into this manifest — a plant larger than the manifest it lives in. It
    # reports UNPROVEN rather than green, which is the honest state.
    #
    # Discrimination is proven instead by the gate's own `--self-test`, and it is
    # stronger here than a single plant would be: six cases, three rejecting,
    # covering a file one line over the ceiling, one line under, exactly at it
    # (inclusive), a dead scan root, AND — the case a canary could not express —
    # an already-listed file that GREW while the file COUNT stayed at one. That
    # last case is what pins the metric as excess lines rather than a file count;
    # a count-based ratchet passes it, and this gate must not.

  - id: check_no_stub_inventory_table
    argv: ["--quiet"]
    min_scanned: 1
    corpus: "the guarded watch list — agents/roadmaps/stubs/README.md (1 file; the whole scope, not a sample)"
    status: enforced
    no_canary_reason: >-
      the guarded path already EXISTS, so a create-only canary cannot plant the violation. Discrimination is proven by the gate's own `--self-test`.
    # No `canary:` recipe: the guarded path already EXISTS, and the canary
    # contract is create-only. A recipe would have to mutate a tracked file
    # rather than plant one, which the contract does not express. The gate
    # reports UNPROVEN there rather than green, which is the honest state.
    #
    # Discrimination is proven by the gate's own `--self-test` instead, and the
    # five cases are the sabotage probes it was verified with before landing:
    # a restored transfer table, the inventory header alone, a DEAD watch list
    # (the `check_safety_floor_untouched` shape — it must red, never report
    # clean), plus two accepting cases that pin the narrowness review asked for
    # — a glossary table and a table citing parent roadmaps one directory up
    # must both pass. A blanket ban on markdown tables in the file would trade
    # one regression for a permanent block on legitimate documentation.
    #
    # `min_scanned: 1` is the true corpus, not a weak floor: the scope is one
    # known file. The collapse this file's rule 3 guards against is covered by
    # `assertWatchlistResolves`, which refuses to report clean when the path
    # does not resolve — so a rename reds the gate instead of retiring it.

  # check_new_adr_evidence is DELIBERATELY NOT REGISTERED here, following this
  # file's own two precedents rather than breaking them.
  #
  # It is diff-scoped: its corpus is the set of decision records ADDED on the
  # branch (`git diff --diff-filter=A` over `docs/decisions/ADR-*.md` and
  # `docs/adrs/<area>/NNNN-*.md`), so ZERO is the honest reading on almost every
  # run and any floor above 0 reds every branch that adds no ADR. A
  # `min_scanned: 0` row is the false-count shape this file's header rejects in
  # as many words, and `lint_evidence_artifacts` and
  # `check_rule_projection_integrity` both hit this exact wall and resolved it by
  # staying unregistered. A row was written first and then withdrawn: the
  # argument for it was that a registered gate at least runs under CI-identical
  # argv, and that is real but it is not worth being the one instance that
  # introduces the shape two neighbours were excluded to avoid. Three precedents
  # agreeing is a convention; two agreeing and one defecting is drift.
  #
  # It is NOT unwatched. `task check-new-adr-evidence` and the
  # `New accepted ADRs disclose their evidence` step in rule-backstops.yml both
  # run it, so a broken gate fails there.
  #
  # And it is NOT unproven, which is the part a floor could never have supplied.
  # This gate's normal reading is zero added records — precisely the state where
  # a working gate and a completely broken one emit identical output
  # (`scanned: 0`, green), so no floor separates them at any value. `--self-test`
  # does: seven cases, four rejecting, each building a throwaway repo and driving
  # the real CLI with `--base <sha>`, including the case an `authority_basis:
  # owner_intent` escape must NOT buy (that field governs authority, never
  # disclosure). Sabotage-verified — with the `## Evidence` check removed the
  # self-test exits 1 and names the two cases that stopped firing.
  #
  # What is LOST, stated rather than implied: no minimum scan is held against
  # this gate by this manifest, so a change that silently narrowed its path
  # regexes to nothing would pass here. The self-test is what catches that, and
  # it is a test rather than a manifest floor — it runs when someone runs it.

  # adr/evidence_census is DELIBERATELY NOT REGISTERED here either, for the
  # same structural reason and with a different cost.
  #
  # `matchesGatePattern` classifies on a name PREFIX
  # (`lint|check|audit|skill|verify_`) and `evidence_census.ts` carries neither,
  # so a row here would red `gate_population.test.ts` exactly as the
  # `adr_cite_check` row did. The block below weighs the three fixes for that
  # case and they apply unchanged: widening the pattern, renaming the script, or
  # inverting the classification to be manifest-driven.
  #
  # What is DIFFERENT, and better than the adr_cite_check case: the census is not
  # unwatched. `task check-adr-evidence-census` regenerates it to a temp path and
  # diffs against the committed artifact, wired in the `ci` chain and as the
  # `ADR evidence census up to date` step in rule-backstops.yml, so a corpus that
  # drifted from the artifact fails there instead of here. The census emits a
  # `scanned:` line and adopts the ledger, so what is lost is only the MINIMUM
  # SCAN FLOOR — a change that narrowed its corpus to zero AND regenerated the
  # artifact to match would pass both. Stated rather than implied, because the
  # drift check is a byte-comparison and byte-agreement on an empty corpus is
  # still agreement. Closing it properly is the same rename, in the same change
  # that renames adr_cite_check.

  # adr_cite_check is DELIBERATELY NOT REGISTERED here, and the reason is a
  # disagreement between two gates over the same file rather than an oversight.
  #
  # The script is gate-shaped by behaviour: it emits one `scanned:` line, adopts
  # the ledger, asserts its scan scope, and runs in CI as `ADR citations resolve`
  # (rule-backstops.yml) plus `task check-adr-citations`. So it certifies
  # something and can lie about it, which is this manifest's own criterion.
  #
  # But `gate_population.matchesGatePattern` classifies structurally, on a NAME
  # PREFIX (`lint|check|audit|skill|verify_`), and `adr_cite_check.ts` carries
  # `check` as a suffix. Registering it made `gate_population.test.ts` red:
  # "manifest lists adr_cite_check, population does not". The two gates read the
  # same file and disagree.
  #
  # Three fixes were weighed and each was worse than the gap:
  #   - widening the pattern to a `_check$` suffix pulls in four unrelated
  #     scripts (bench_drift_check, worktree_cleanup_check, update_check,
  #     cmd_settings_check), forcing them into the ledger contract and reddening
  #     the completeness ratchet for work nobody asked for;
  #   - renaming the script to `check_adr_citations.ts` is the convention-conform
  #     answer and touches 26 files, including archived review artifacts and a
  #     committed diff.patch that must not be rewritten;
  #   - manifest-driven classification is explicitly rejected by
  #     gate_population.ts's own header (a new gate lands before anyone
  #     registers it, so that inverts the real dependency).
  #
  # So the row is dropped and the floor is unregistered. What is LOST is stated
  # rather than implied: the gate runs, but nothing holds it to a minimum scan,
  # so a future change that silently narrowed its corpus to zero would pass. The
  # honest close is the rename, in its own change, where 26 files of churn are
  # the subject rather than a side effect.

  - id: check_no_automerge_key
    argv: ["--quiet"]
    min_scanned: 200
    corpus: "every declared key in the two settings files — `src/config/agent-settings.template.yml` plus `src/scripts/schemas/agent-settings.schema.json` (304 on 2026-08-23, so the floor sits well below the live count and far above a collapse)"
    status: enforced
    no_canary_reason: >-
      Create-only canary cannot reach this corpus: both settings files are
      tracked and always exist, so a planted file lands outside the corpus and
      the gate correctly stays green. Measured on a previous attempt, where the
      gate was then mis-reported as dead. Same class as `check_condensation` and
      `check_ci_local_parity` — the only possible violation is a modification of
      an existing tracked artifact. The red is proven instead by the committed
      violating fixture `tests/fixtures/automerge-key/` plus two recorded
      sabotage probes in `tests/scripts/check_no_automerge_key.test.ts`.
    note: >
      The no-canary reason above is the create-only contract rather than an
      omission. Both corpus files are tracked and always exist, so a planted file
      lands OUTSIDE the corpus and the gate correctly stays green — measured on a
      previous attempt at this gate, where it was then mis-reported as dead. The
      only violation this gate can have is a modification of an existing tracked
      artifact, which is the same class as `check_condensation` and
      `check_ci_local_parity`, and the CANARY section above already states that
      such a gate carries no recipe and is reported UNPROVEN rather than green.

      The red is proven elsewhere instead, deliberately and committed:
      `tests/fixtures/automerge-key/` is a violating settings pair the gate must
      refuse, and `tests/scripts/check_no_automerge_key.test.ts` asserts exit 1
      against it, exit 2 on a missing corpus, and records the two sabotage probes
      (emptying the forbidden set → 4 of 9 red; widening the matcher from a key
      to a bare word → 6 of 9 red).

      The floor is a KEY count, not a file count. Two files is a constant, and a
      floor under a constant can never trip — the false-count shape this manifest
      rejects. 304 keys collapses to 0 if either root moves, which is what the
      floor is for.
  - id: check_pack_conformance_fixture
    argv: ["--quiet"]
    min_scanned: 12
    corpus: "(fixture, gate) assertions over `tests/fixtures/pack-conformance/` — 3 fixture-provable gates × (1 conformant fixture + 3 seeded twins) = 12 on 2026-08-23"
    status: enforced
    no_canary_reason: >-
      The corpus is a committed fixture and every violation this gate can have IS
      a seeded violation — the three twins under
      `tests/fixtures/pack-conformance/twins/` are the negative control, already
      committed and already asserted. A create-only plant would have to add a
      FOURTH twin, which the harness would not know about and would therefore
      ignore. Discrimination is proven instead by the gate's own `--self-test`
      (5 cases, 2 rejecting, including a missing-fixture probe that must exit 2)
      and by three recorded sabotage probes in
      `tests/scripts/check_pack_conformance_fixture.test.ts` — a conformant-fixture
      break, an orthogonality break (a twin reddening two gates), and a neutered
      twin that reds none. Real exit codes captured directly, never through a
      pipe.
    note: >
      The floor is an ASSERTION count, not a file count. It is exactly
      `provable_gates × (1 + twins)`, so adding a twin without wiring it — or
      losing one of the three injection seams — moves the number and the floor
      catches it. A file count would not: the fixture directory can grow while
      the harness quietly stops driving a gate.

      This gate is deliberately PARTIAL and says so in its own success line
      ("PARTIAL as designed: 3 of 6"). Three of the six pack-fitness gates cannot
      be driven from a fixture — `lint_pack_first_win` pins argv-ignoring as an
      ADR-200 port-fidelity guarantee, `lint_pack_dependencies` derives its pack
      home from `import.meta.url`, and `prove_pack_extractable` resolves a pack
      by name under the real `src/packs/`. Raising this gate's coverage by
      pretending otherwise is the manufactured green this file exists to prevent.

  - id: lint_deterministic_time
    argv: ["--quiet"]
    min_scanned: 200
    corpus: "gate scripts under `src/scripts/` carrying a `check_` or `lint_` prefix, excluding `*.test.ts` (261 at baseline)"
    status: enforced
    canary:
      class: contract-violation
      path: src/scripts/check_zz_canary_wall_clock.ts
      content: |
        // zz canary probe: a gate script reading the wall clock inline, which is
        // exactly the construct `lint_deterministic_time` refuses. The plant is
        // create-only and therefore expressible as a canary, unlike the
        // MODIFICATION shape most ratchets in this file detect.
        const planted = Date.now();
        export { planted };
    note: >
      The floor is 200 against a live corpus of 261, which is the usual
      "comfortably below, far above a collapse" shape — a prefix regex that
      stopped matching, or the flat-`src/` scan root moving again, collapses this
      to single digits long before it reaches 200.

      `argv` carries `--quiet` because that is what the preflight task and the
      workflow step both pass. `reportScanned` is not quiet-gated, so the count
      is published either way; the flag is registered anyway because rule 2 of
      this manifest is argv PARITY, not "an argv that happens to work".

      The canary is a genuine create-only plant rather than a
      `no_canary_reason`, and that is unusual enough here to be worth stating:
      this gate's violation shape is a NEW file carrying the construct, so a
      single planted script expresses it completely. Discrimination is
      additionally proven by the gate's own `--self-test` (7 cases, 4 rejecting)
      — including the two cases the canary cannot express: a mention inside a
      comment or a string literal that must NOT be a finding (the gate's own
      docstring names the construct it bans, so a raw-text matcher would refuse
      itself), and a dead scan root that must exit 2 rather than green.

  - id: check_enforcement_denominator
    argv: ["--quiet"]
    min_scanned: 350
    corpus: "published markdown under `docs/` plus `README.md`, excluding `docs/decisions/` and `docs/archive/` (464 at baseline)"
    status: enforced
    canary:
      class: contract-violation
      path: docs/zz-canary-enforcement-count.md
      content: |
        # ZZ canary probe

        15 of 120 governed rules carry a backstop that fails a CI build.

        A hand-written enforcement denominator in a published doc, which is the
        sixth-number defect this gate exists to prevent. Create-only, so it is
        expressible as a canary.
    note: >
      The floor is 350 against a live corpus of 464. The collapse case is real
      rather than theoretical here: `docs/` was flattened once already
      (ADR-051), and a walk rooted at a moved directory reads zero files and
      prints "no published doc restates it" — a green over nothing.

