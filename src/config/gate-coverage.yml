      that would make the exit code follow the band — pack coverage approaching
      the tree — is recorded in docs/contracts/pack-token-passport.md.

  - id: check_gate_completeness
    argv: []
    min_scanned: 180
    corpus: "gates reachable from the `ci` / `consistency` task roots (220 at baseline)"
    status: enforced
    no_canary_reason: >-
      whole-graph: it parses every gate invocation in the task roots at once, so a planted file has no property to violate — the defect it detects is a MISSING edge, which cannot be planted.
    note: >
      Floor set below the live count on purpose: the registered set legitimately
      shrinks when a gate is retired, and a floor pinned at today's exact number
      would red on the very change that removes one. It is still high enough
      that a broken closure walk — the dead-scan-root shape one level up, where
      the Taskfile parse degrades and the population silently collapses —
