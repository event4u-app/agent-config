        Planted canary: a fenced example teaching the render sink the
        `frontend-render-security` rule forbids three paragraphs away.

        ```js
        el.innerHTML = untrustedUserBio;
        ```
    note: >
      Registered STRICT on day one, which is the opposite of the advisory
      landing its roadmap step planned for — because the classification that
      step demands came back **zero hits over all 503 files**, and an advisory
