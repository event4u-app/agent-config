# Command → flow / platform-surface classification — road-to-6.1.0 Step 9.
#
# THE FLOWS PRIMARY VIEW (machine-readable backbone). This is the authoritative
# flat index mapping EVERY `src/domains/<pack>/**/command.md` to its flow or
# platform surface, so the layered model `Profile → Pack → Flow → Command →
# Skill → Rule` has a real, lintable command→flow edge — commands become flow
# members, not a flat list.
#
# Two layers:
#   * The four USER-WORK flows (discovery / implementation / review / delivery)
#     carry rich definitions (entry_points / default_path / skills) in
#     `src/flows/<flow>.yaml`, validated by `scripts/lint_flows.py`.
#   * THIS file is the COMPLETE classification — it additionally covers the
#     non-user-work platform surfaces (`agent-admin` is the platform/system
#     surface, NOT a flow — feedback-6; plus `product` features, `session`,
#     and the domain flows `media` / `marketing` / `fun`).
#
# Refs are LOGICAL command paths (the command `name:` with `:` → `/`), the same
# shape `src/flows/*.yaml` use. Validated by
# `scripts/lint_command_flow_coverage.py`: every `src/domains` command appears
# in exactly one bucket, every ref backs a real command, every bucket is allowed.
#
# Adding a command → add its ref here (the lint fails the build otherwise).
# Adding a new user-work flow is an ADR-gated governance decision (the closed
# set is fixed in lint_flows.py + flow.schema.json).
version: 1

# Closed user-work flow set (rich definitions in src/flows/<flow>.yaml).
user_work_flows: [discovery, implementation, review, delivery]
# Non-user-work surfaces. `agent-admin` is the platform/system surface, not a
# flow; `product` are deliberately-started features; domain flows cover media /
# marketing / fun; `session` is the meta session surface.
platform_surfaces: [product, agent-admin, session, media, marketing, fun]

