# Flow — scaffolded in 6.0.0-D (Step 15b), activated in 6.1 (Step 8b, ADR-055).
# Validated on load by scripts/lint_flows.py against scripts/schemas/flow.schema.json:
# every entry_points / default_path / commands entry resolves to a real command and
# every skill resolves to a real skills/<slug>/SKILL.md. `commands:` is the descriptive
# seed lifted from the command-classification worksheet `·_flow:review_` tags;
# entry_points / default_path are the validated reference fields. Command refs are
# LOGICAL paths (current command layout); slug-prefix projections land with Step 8.
id: review
title: Review
summary: >-
  Check it. Self-review, judge, quality-fix, and threat-model a change before
  it ships.
entry_points:          # commands that START the flow (daily front doors)
  - review-changes
  - judge
default_path:          # canonical command sequence
  - review-changes
  - judge
  - quality-fix
  - threat-model
skills:                # skills the flow composes end-to-end
  - code-review
  - adversarial-review
  - quality-tools
  - threat-modeling
  - receiving-code-review
commands:              # seed from worksheet ·_flow:review_ tags
  - review-changes
  - judge
  - quality-fix
  - fix/ci
  - threat-model
