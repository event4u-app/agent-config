# Flow — scaffolded in 6.0.0-D (Step 15b), activated in 6.1 (Step 8b, ADR-055).
# Validated on load by scripts/lint_flows.py against scripts/schemas/flow.schema.json:
# every entry_points / default_path / commands entry resolves to a real command and
# every skill resolves to a real skills/<slug>/SKILL.md. `commands:` is the descriptive
# seed lifted from the command-classification worksheet `·_flow:implementation_` tags;
# entry_points / default_path are the validated reference fields. Command refs are
# LOGICAL paths (current command layout); slug-prefix projections like `git-commit`
# land with Step 8, not here.
id: implementation
title: Implementation
summary: >-
  Build it. The core "make the change" front — drive a prompt, ticket, or
  feature end-to-end through plan → implement → verify.
entry_points:          # commands that START the flow (daily front doors)
  - work
  - implement-ticket
  - feature/dev
  - bug-fix
default_path:          # canonical command sequence
  - work
  - review-changes
  - quality-fix
  - commit
skills:                # skills the flow composes end-to-end
  - test-driven-development
  - code-review
  - systematic-debugging
  - git-workflow
commands:              # seed from worksheet ·_flow:implementation_ tags
  - work
  - implement-ticket
  - feature/dev
  - bug-fix
  - e2e-plan
  - e2e-heal
