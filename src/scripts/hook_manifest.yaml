# Hook manifest — single source of truth for which concerns fire on which
# (platform, event) tuples. Consumed by:
#   - scripts/hooks/dispatch_hook.py   (runtime resolver)
#   - scripts/lint_hook_manifest.py    (CI gate; Phase 7.10)
#   - scripts/install.py               (per-platform config writer)
#
# Schema and event vocabulary: docs/contracts/hook-architecture-v1.md.
# Per-platform event-name mapping: agents/settings/contexts/chat-history-platform-hooks.md.
#
# When you add or remove a concern, also update:
#   - scripts/agent-config         (CLI subcommand wiring, if exposed)
#   - the source rule's "Copilot fallback" section (Phase 7.9)
#   - the relevant snapshot tests under tests/hooks/ (Phase 7.11)
schema_version: 1

concerns:
  chat-history:
    script: src/scripts/chat_history.ts
    args: [hook-dispatch]
    fail_closed: false
    severity: advisory
    needs_payload_bodies: [result]
  # Hot-context working-memory cache (road-to-second-brain Phase 1).
  # stop: deterministic, redacted 400-word overwrite of
  # agents/runtime/state/hot-context.md from the chat-history JSONL.
  # session_start: staleness-checked restore; the dispatcher forwards the
  # returned `context` block to its own stdout (Claude Code SessionStart
  # injection; on Claude, source=compact re-injects after compaction).
  # Runs AFTER chat-history in both slots so the stop-write sees the final
  # session entries. Never blocks.
  hot-context:
    script: src/scripts/hot_context_hook.ts
    args: []
    fail_closed: false
    severity: advisory
  # One-shot handoff injection (road-to-agent-handoff-resume Phase 3).
  # session_start only: if `agent-config handoff` wrote
  # agents/runtime/state/handoff-context.md, inject it as spotlighted DATA
  # and DELETE the file (consume-once; a >48h stamp discards instead).
  # Runs directly AFTER hot-context so the handoff lands after the generic
  # cache. Never blocks.
  handoff-context:
    script: src/scripts/handoff_context_hook.ts
    args: []
    fail_closed: false
    severity: advisory
  # Debounced since road-to-per-turn-hook-economy step 3.1 (D-3). It used to
  # re-shell the dashboard regenerator through tsx on EVERY roadmap write — a
  # cold tsx start per write, in exactly the roadmap-heavy workflow this repo
  # runs. It now APPENDS the touched repo roots to a ledger on post_tool_use and
  # regenerates ONCE from `stop` / `session_end`, which is why it is bound on
  # three slots rather than one.
  #
  # The two extra bindings are paid for, not free additions to a capped chain:
  # they REPLACE an unbounded number of per-write spawns with one per turn, and
  # the flush path costs a read of one small JSON file when nothing is dirty.
  # No flush binding on windsurf, deliberately — it has no post_tool_use surface,
  # so nothing there ever marks the ledger.
  #
  # The ledger lives under `--project-dir`, not beside the edited file: a touched
  # root may be a sibling worktree and `stop` carries no roadmap path, so a
  # marker written at the target would be unfindable at flush time. A ledger that
  # cannot be written makes the hook regenerate inline, so a broken state
  # directory costs latency rather than a silently stale dashboard.
  roadmap-progress:
    script: src/scripts/roadmap_progress_hook.ts
    args: []
    fail_closed: false
    severity: advisory
    needs_payload_bodies: [input]
  onboarding-gate:
    script: src/scripts/onboarding_gate_hook.ts
    args: []
    fail_closed: false
    severity: advisory
  context-hygiene:
    script: src/scripts/context_hygiene_hook.ts
    args: []
    fail_closed: false
    severity: advisory
  # Phase 5 — Tier-1 hook for the verify-before-complete rule. Records
  # observable evidence of verification commands (tests, quality tools,
  # builds) into agents/state/verify-before-complete/<digest>.json — ONE FILE
  # PER SESSION since 2026-08-20, addressed through
  # `before_complete_hook.statePathFor`. Two earlier corrections are worth
  # keeping visible, because this comment was wrong about the path twice: it
  # said `agents/runtime/state/` until round 7 (a directory the code never
  # used), and it named the single `STATE_FILE` until the split, which is the
  # constant `prune_legacy_state_file` now DELETES. The rule body cites that
  # state as the source of truth for "verified this turn?". Since round 7 it
  # also carries `ci_last`, the session-scoped CI-settle negative that
  # `turn-end-gate` reads to refuse a premature completion claim — and
  # "session-scoped" is now a property of the layout rather than of a reset
  # that fired when a foreign id showed up in a shared file.
  verify-before-complete:
    script: src/scripts/before_complete_hook.ts
    args: []
    fail_closed: false
    severity: advisory
    needs_payload_bodies: [input, result]
  # Phase 5 — Tier-1 hook for the minimal-safe-diff rule. Counts unique
  # files touched per turn into agents/runtime/state/minimal-safe-diff.json and
  # flips warning=true past hooks.minimal_safe_diff.threshold.
  # road-to-metric-loop-and-review-integrity Phase 4 — shipping-intent gate on
  # diff VOLUME, complementary to `minimal-safe-diff` rather than a duplicate:
  # that concern counts unique files touched PER TURN, this one counts changed
  # lines on the branch AT A SHIP VERB. Threshold 1695 is the corrected p90 of
  # this repository's own last 40 merged PRs, and the exclusion set (review-input
  # snapshots, generated indexes, projection trees) is part of the metric's
  # definition, not a tuning knob — the replay measured the naive metric
  # double-counting the diff it was measuring. Warn-level first; escalation waits
  # for one release of recorded firings. Evidence:
  # agents/evidence/eval-findings/metric-loop-s04.md
  ship-diff-volume:
    script: src/scripts/hooks/ship_diff_volume_hook.ts
    args: []
    fail_closed: false
    severity: advisory
    needs_payload_bodies: [input]
  minimal-safe-diff:
    script: src/scripts/minimal_safe_diff_hook.ts
    args: []
    fail_closed: false
    severity: advisory
    needs_payload_bodies: [input]
  # road-to-security-pillar.md P3.2 — PostToolUse prompt-injection scanner.
  # Warn-in-context (exit 2), never blocks. Default-OFF: no-ops unless
  # hooks.injection_scan.enabled is true in .agent-settings.yml. The runtime
  # backstop layered on the always-on untrusted-input-defense rule.
  injection-scan:
    script: src/scripts/injection_scan_hook.ts
    args: []
    fail_closed: false
    severity: advisory
    needs_payload_bodies: [input, result]
  # road-to-security-hardening Phase 3 — PreToolUse guard turning the
  # git-history-discipline Iron Law into a deterministic gate. Blocks
  # `git … --no-verify` / `-n` and `git -c core.hooksPath=…` (which would
  # bypass the pre-commit/pre-push hooks). MUST be pre_tool_use: --no-verify
  # skips git hooks by definition, so a git hook cannot catch it. fail_closed:
  # a parse failure on a git-containing command blocks (the guard must not be
  # the bypass). No agent-accessible env override (council 2026-06-15).
  block-no-verify:
    script: src/scripts/hooks/block_no_verify.ts
    args: []
    fail_closed: true
    severity: blocking
    needs_payload_bodies: [input]
  # road-to-ai-employee-borrowings Phase 1 — kernel immutability Layer 1.
  # PreToolUse guard: DENIES Write/Edit/NotebookEdit (and cross-platform
  # equivalents) whose target path is a kernel rule file — the source tree
  # (src/rules/<kernel>.md) or any projection (dist/agent-src/rules/,
  # .claude/**/rules/, .augment/rules/, …). ADR-127 permits more than one
  # blocking hook; this is the second (after block-no-verify). fail_closed:
  # a parse/detection failure never crashes into a false block — the
  # guarantee applies to a DETECTED kernel-rule write, which this hook
  # always catches deterministically (no I/O beyond stdin). No
  # agent-accessible override — the only legitimate bypass is the
  # human-owned exception registry named in the deny message.
  block-kernel-rule-writes:
    script: src/scripts/hooks/block_kernel_rule_writes.ts
    args: []
    fail_closed: true
    severity: blocking
    needs_payload_bodies: [input]
  # road-to-renewal-leverage Phase 2 — "fix the code, not the config".
  # PreToolUse guard over the recorded allowlist-growth antipattern
  # (autonomous-execution § Antipattern): warns as an allowlist grows within a
  # session and BLOCKS past the cap that rule already states in words (>20
  # entries in one session = the linter is wrong). Baselines and budget
  # thresholds warn only — whether a rising count is weakening or a legitimate
  # ratchet reset is not decidable from the edit alone. Council 2026-08-02
  # rejected inventing a "fix-loop is active" predicate; the SESSION is the
  # window the recorded rule already names. fail_closed: false — a malformed
  # envelope must never block an unrelated edit.
  block-config-weakening:
    script: src/scripts/hooks/block_config_weakening.ts
    args: []
    fail_closed: false
    severity: blocking
    needs_payload_bodies: [input]
  # token-saving Phase 3 — PreToolUse RTK-wrap nudge. DETERMINISTIC: keys off a
  # live `which rtk` probe (not the self-reported flag). When rtk is installed
  # and the agent is about to run a single verbose CLI command that is NOT
  # completeness-critical, warns "re-run wrapped with rtk" (60–90% fewer output
  # tokens). Warn only — never blocks (the v1 contract has no transparent
  # rewrite); never fires when rtk is absent (silent plain-command fallback).
  # Default-OFF (hooks.rtk_wrap.enabled). fail_closed: false — never break a
  # command for a token optimization.
  rtk-wrap:
    script: src/scripts/hooks/rtk_wrap_hook.ts
    args: []
    fail_closed: false
    severity: advisory
    needs_payload_bodies: [input]
  # road-to-anti-slop-detector Phase 3 — OPTIONAL PreToolUse anti-slop nudge.
  # Runs the lint_design_slop registry against about-to-be-written UI content
  # and WARNS (exit 2) on P0/P1 aesthetic tells. Never blocks (flags, not
  # blocks). Default-OFF (hooks.design_slop.enabled). Anti-loop degradation: a
  # file::rule signature surfaced >=3x goes silent so it never traps the agent.
  # The universal source of truth is the lint_design_slop linter/CI; this hook
  # is a host-limited convenience layer. fail_closed: false.
  design-slop:
    script: src/scripts/hooks/design_slop_hook.ts
    args: []
    fail_closed: false
    severity: advisory
    needs_payload_bodies: [input]
  # road-to-frontend-skill-application Phase 4 — OPTIONAL PreToolUse UI-route
  # nudge. On a Write/Edit to a UI surface with no design consultation latched
  # this session, WARNS (exit 2) naming the route; a read or search touching a
  # design surface latches consultation and silences it. Anti-loop: at most 2
  # nudges per session. It does NOT read the two UI rules — the UI-surface
  # decision comes from _lib/ui_surface.ts — so it runs parallel to them rather
  # than consuming their triggers, and it is a nudge, never a block, so
  # "enforced_by: none" on those rules stays honest.
  # Default-OFF (hooks.ui_route_nudge.enabled).
  # fail_closed: false.
  ui-route-nudge:
    script: src/scripts/hooks/ui_route_nudge_hook.ts
    args: []
    fail_closed: false
    severity: advisory
    needs_payload_bodies: [input]
  # ADR-124 Phase 4 — OPTIONAL PreToolUse code-graph nudge. When a code-graph
  # source is present and the agent is about to search/read source, WARNS
  # (exit 2) once per session to query the graph first (or rebuild if stale,
  # or build if absent). Never blocks — Source G's strict block-first-read
  # mode is deliberately un-ported. Default-OFF (hooks.code_graph.enabled).
  # fail_closed: false.
  code-graph-nudge:
    script: src/scripts/hooks/code_graph_nudge_hook.ts
    args: []
    fail_closed: false
    severity: advisory
    # Per-concern tool filter — the dispatcher skips this concern in-process on
    # any other tool. See `_concern_matches_tool` in hooks/dispatch_hook.ts for
    # the semantics (absent = every event, "*" = the same, non-tool events are
    # never filtered) and for why the filter is NOT a host `matcher`.
    #
    # This set is not a guess: the hook's entire branch surface is
    # `name === 'Grep' || name === 'Glob'` and `name === 'Read'`
    # (code_graph_nudge_hook.ts), and a test pins the manifest list against it.
    #
    # Deliberately NOT declared on the three blocking PreToolUse guards
    # (block-no-verify, block-kernel-rule-writes, block-config-weakening): their
    # tool sets span host-specific naming variants (`Bash` / `BashTool` /
    # `launch-process` / `launch_process`, `str-replace-editor` /
    # `str_replace_editor` / `save-file` / …), so a list that misses one variant
    # silently disables a security guard on that host. The concerns already
    # re-read `tool_name` and return early; paying one dispatch to keep a guard
    # correct is the right trade, and the cheap filter is reserved for advisory
    # concerns whose set is provable from their own source.
    tools: [Grep, Glob, Read]
    needs_payload_bodies: [input]
  # road-to-reachable-code-memory Phase 4 — session_end learning-sidecar
  # aggregation. Joins the EXISTING session_end concern set (no new platform
  # wiring). Aggregates agents/memory/intake/*.jsonl through the learning
  # sidecar into the gitignored .agent-learning.json + LESSONS.md; emits the
  # one-line memory-visibility marker when lessons exist. Default-OFF
  # (memory.learn_on_session_end — council 2026-07-27: ships off; flip is
  # proposed only after the 30-day dogfood shows non-trivial signal AND
  # session-end p95 < 2 s). Budget-capped (2 s), fail-open. Promotion stays
  # human via /memory:propose. fail_closed: false.
  memory-learn:
    script: src/scripts/memory_learn_hook.ts
    args: []
    fail_closed: false
    severity: advisory
  # Phase 2 of road-to-hooks-actually-fire-in-consumers — session_start
  # gate that surfaces the marketplace-install-but-unscaffolded shape.
  # Writes .augment/.first-run-action-needed.md + one stderr line so
  # both file-browser users and lifecycle-log readers see the issue.
  # Council R3 HIGH: stderr alone is invisible to the average user.
  first-run-gate:
    script: src/scripts/first_run_gate_hook.ts
    args: []
    fail_closed: false
    severity: advisory
  # session-profile-activation Phase 1 — emits a one-line staleness notice
  # when a new session starts with a `runtime.active_packs` overlay carried
  # over from a previous session. Never resets (option a, explicit
  # /profile deactivate); never blocks.
  profile-staleness:
    script: src/scripts/profile_staleness_hook.ts
    args: []
    fail_closed: false
    severity: advisory
  # Defense-in-depth twin of the update-command wrapper refresh
  # (cmd_upgrade / cmd_refresh). On session_start, re-stamps a stale
  # project-local ./agent-config wrapper from the canonical template so
  # an outdated, fallback-less copy cannot keep breaking the hooks.
  # Never creates a wrapper, never touches the source repo, fail-open.
  wrapper-freshness:
    script: src/scripts/wrapper_freshness_hook.ts
    args: []
    fail_closed: false
    severity: advisory
  # road-to-install-path-convergence Phase 4 — duplicate-surface probe.
  # Reads src/config/surface-matrix.yml, existence-checks declared duplicate
  # classes, nudges ONCE per day (state: agents/runtime/state/
  # surface-probe.json). Fail-open, never blocking; silent when clean or
  # when install.auto_converge is already set.
  surface-probe:
    script: src/scripts/surface_probe_hook.ts
    args: []
    fail_closed: false
    severity: advisory
  # road-to-team-mode Phase 4 — managed Review-Gate circuit breaker.
  # Runs AFTER the plugin's own Stop gate: reads the persisted gate job
  # record, counts consecutive BLOCK verdicts per session, injects the
  # circuit-breaker notice exactly once at ai_team.review_gate.
  # max_consecutive_blocks. No-op (byte-identical Stop path) while
  # ai_team.review_gate.managed is false — the shipped default.
  # Never blocks, exit 0 always.
  team-review-gate:
    script: src/scripts/team_review_gate_hook.ts
    args: []
    fail_closed: false
    severity: advisory
  # Reply-shape backstop for the direct-answers rule (reply-close): a PR
  # created THIS turn must end the reply as the literal last raw URL. This
  # PostToolUse hook fires right after a PR *create* (gh pr create, or a
  # github create-pull-request tool) that produced a `…/pull/<n>` URL, and
  # WARNS in context (exit 2) so the reminder lands before the reply closes.
  # Never blocks; unconditional (reinforces an always-on rule, fires only on
  # the rare create event, so no settings gate). fail_closed: false.
  pr-url-reminder:
    script: src/scripts/pr_url_reminder_hook.ts
    args: []
    fail_closed: false
    severity: advisory
    needs_payload_bodies: [input, result]
  # Language-mirror pin — carries the ONE fact the transcript cannot express:
  # which language the human actually typed. 47 skill/slash-command bodies were
  # measured arriving in the `user` role across 21 of 30 audited sessions, and
  # in the worst case a 4,196-char English skill body was the last user-role
  # content before 136 consecutive English replies to a German prompt.
  # `user_prompt_submit` is the only event a skill body never reaches.
  # Advisory: it supplies a fact, it never blocks.
  language-mirror:
    script: src/scripts/language_mirror_hook.ts
    args: []
    fail_closed: false
    severity: advisory
  # Git-authorization ledger — records which git ops the user's OWN WORDS
  # authorize this turn. Writes state only; never blocks.
  git-authorization:
    script: src/scripts/git_authorization_hook.ts
    args: []
    fail_closed: false
    severity: advisory
  # The blocking half. BLOCKS only the irreversible subset that
  # non-destructive-by-default already declares never-autonomous (npm publish,
  # tag push, gh release create, gh pr merge); WARNS on commit / push /
  # pr-create / branch. Severity, not reach — see the header of the script.
  block-unauthorized-git:
    script: src/scripts/hooks/block_unauthorized_git.ts
    args: []
    fail_closed: true
    severity: blocking
    needs_payload_bodies: [input]
  # Evaluator independence. Gates EVALUATION dispatches only. Two branches with
  # DIFFERENT severities, per the tier rule in
  # docs/contracts/hook-architecture-v1.md (§ What a concern may block on):
  #   · pre-loaded verdict → BLOCKS. It matches a literal steering formulation
  #     ("NO-FINDINGS is expected and welcome"), which IS the violation rather
  #     than evidence of one.
  #   · second self-scoped dispatch in a turn → WARNS (exit 0 + decision:"warn").
  #     It decides from prose alone — Tier 3 — and a cross-project audit measured
  #     the cost of blocking on that: a 16-way IMPLEMENTATION fan-out lost 15 of
  #     its workers, because the phrase `this branch` (an address every worktree
  #     dispatch prompt carries) read as a self-reference.
  # `severity: blocking` therefore states the HIGHEST severity this concern can
  # reach, not the severity of every path through it.
  # Ordinary parallel fan-out was always meant to be untouched: the council's
  # "second dispatch of any kind" criterion would have blocked 6 of the 7 analysis
  # subagents in the very session that produced this guard. fail_closed: false — a
  # malformed envelope must never block a dispatch.
  evidence-independence:
    script: src/scripts/hooks/evidence_independence.ts
    args: []
    fail_closed: false
    severity: blocking
    needs_payload_bodies: [input]
  # Canary injection — deterministic carrier for the
  # session-canary rule (greet-by-name at task start + reply-close markers
  # as a user-observable context-degradation signal). Gated on
  # `personal.canary_name` in .agent-settings.yml (empty = clean no-op),
  # so unconfigured consumers pay nothing. Emits a `context` block the
  # dispatcher forwards on session_start (hot-context mechanism).
  # Bound in TWO slots on purpose: session_start carries the full contract once,
  # user_prompt_submit carries a one-line beat. The obligation is per TASK and no
  # host has a per-task slot (Cline maps TaskStart/TaskResume onto session_start;
  # Claude Code has no task event), so per-turn — a strict superset — is the
  # reachable covering period. Session scope alone measured a ~13-of-15 miss rate
  # on task starts. Augment has no user_prompt_submit and is a DECLARED gap: its
  # `stop` fires after the reply, so injecting there could not shape the reply the
  # reminder is for, and counting it would be exactly the over-credit this pairing
  # was added to remove.
  # Never blocks. fail_closed: false.
  session-canary:
    script: src/scripts/session_canary_hook.ts
    args: []
    fail_closed: false
    severity: advisory
  # Council-availability fact. Carries whether a council is configured and from
  # where, because the always-loaded layer refers to the council conditionally
  # and never says how to check. Measured 2026-08-08: an agent announced "kein
  # Council konfiguriert (keine .agent-settings.yml)" and substituted a weaker
  # path; the council was configured user-globally the whole time, and the
  # project tree is never searched for it (ADR-104). Advisory: supplies a fact,
  # never blocks.
  council-availability:
    script: src/scripts/council_availability_hook.ts
    args: []
    fail_closed: false
    severity: advisory
  # Org-telemetry disclosure (road-to-org-telemetry Phase 3.2; ADR-233 § D5).
  # `org-pack` is the only consent class in this suite granted by somebody
  # OTHER than the person it binds — an org administrator, once, for every
  # install the pack reaches. Telling that person is what makes the grant
  # legitimate rather than a courtesy on top of it. Emits once per
  # (org_id, endpoint) pair and re-discloses when either changes, because a
  # new sink is a new fact. An inactive install prints nothing and writes
  # nothing. Advisory: it informs, it never blocks a session start.
  telemetry-disclosure:
    script: src/scripts/telemetry_disclosure_hook.ts
    args: []
    fail_closed: false
    severity: advisory
  # road-to-org-telemetry Phase 2 (step 2.1) — session-end Class-A flush.
  # Checks whether the outbound spool has bytes and, if so, spawns a DETACHED
  # sender and returns. It makes no network call in the session's own process,
  # ever, and that shape is measured rather than preferred: Phase 0's second
  # spike pre-registered "at or below one second at p95" for an inline flush
  # and measured 1002 ms against a blackhole sink (a socket that accepts and
  # never answers — the shape a wedged sink takes), against 20.5 ms for the
  # detached spool. The step's own text defers to that result.
  #
  # DEFAULT-OFF and then some, exactly as telemetry-usage: `active` needs
  # `enabled` AND an endpoint AND an org id AND a salt, none of which this
  # public repository ships a value for, so a clone cannot reach the spawn
  # path. `flush: never` short-circuits before the spool is stat-ed. Inactive
  # ⇒ zero telemetry file operations and zero network calls.
  #
  # Bound on the six platforms that carry `session_end`; windsurf has the slot
  # nowhere in this manifest, so an org running it keeps its records local
  # until a flush slot exists there — a readable absence, not a silent one.
  #
  # Silent on every path and exit 0 always, including a failed spawn: a
  # telemetry concern has nothing to say to the model, least of all at session
  # end where the line would arrive after the last thing the user reads.
  # Carries no hook-token-budget row — it emits nothing. fail_closed: false.
  telemetry-flush:
    script: src/scripts/hooks/telemetry_flush_hook.ts
    args: []
    fail_closed: false
    severity: advisory
  # Self-repair intake (road-to-self-repair Phase 1). Two slots, one queue:
  # user_prompt_submit opens a record when the user states the agent worked
  # wrongly and injects the open-queue line; stop runs the deterministic
  # detectors over the finished turn and records silently (a reminder fired
  # after the reply cannot shape it). ADVISORY by construction — it records,
  # it never gates; the outward step is a separate, user-run CLI command.
  self-repair:
    script: src/scripts/self_repair_hook.ts
    args: []
    fail_closed: false
    severity: advisory
  # Shared per-session register (road-to-parallel-session-coordination) — writes
  # this session into <git-common-dir>/agent-sessions/<session_id>.json so every
  # other worktree of the repo can see it, and on session_start injects the live
  # foreign sessions as a `context` block (hot-context mechanism).
  #
  # Bound in FOUR slots, with deliberately asymmetric meanings:
  #   session_start        → register + prune expired + inject foreign sessions
  #   user_prompt_submit   → heartbeat (pre-reply carrier)
  #   stop                 → heartbeat (post-reply carrier), NOT deregistration
  #   session_end          → deregister
  #
  # `stop` is per-turn, not session end: on Claude Code the native Stop fires
  # after every assistant reply (see _lib/obligation_frequency.ts), so
  # deregistering there would kill a live session's own record after its first
  # reply. The ONE exception is Cline, whose stop is TaskCancel and whose
  # session_end is TaskComplete — a cancelled Cline task reaches neither, so it
  # would leak its claim until TTL. That exception is an explicit platform
  # allow-list in _lib/session_register.ts, never a condition computed from the
  # frequency lattice: a future platform must be added by a human, deliberately.
  #
  # Correctness rests on heartbeat + TTL alone; deregistration only frees a claim
  # sooner. So Windsurf's missing session_end costs latency, not correctness.
  # Declared non-carriers: copilot (no hook surface), cursor CLI (per-turn slots
  # are IDE-only), cowork (slots wired, lifecycle events inert) — a session there
  # registers but expires by TTL rather than heartbeating, and the concern says so
  # on stderr rather than letting the coverage join read green.
  # Never blocks. fail_closed: false.
  session-register:
    script: src/scripts/session_register_hook.ts
    args: []
    fail_closed: false
    severity: advisory
  # road-to-orchestrator-discipline-carriers Phase 3 (F6) — deterministic
  # PostToolUse orchestration-telemetry capture. Fires only on an Agent/Task
  # tool-use completion (the two observed subagent-dispatch tool names) and
  # appends one `orchestration_record` line — no model step, replacing the
  # measured 0.27% model-carried capture rate for future dispatches. Silent
  # on every path (never writes to stdout); exit 0 always, including a
  # malformed envelope or a write failure. fail_closed: false.
  orchestration-record:
    script: src/scripts/hooks/orchestration_record_hook.ts
    args: []
    fail_closed: false
    severity: advisory
    tools: [Agent, Task]
    needs_payload_bodies: [input, result]
  # road-to-org-telemetry Phase 1 (step 1.2) — Class-A usage capture. Fires
  # only on a `Skill` tool-use completion, the event Phase 0's first spike
  # confirmed carries the invoked skill name (`tool_input.skill`, present on
  # 164 of 164 real invocations). Exists because the regex collector is blind
  # to consumer installs by construction — spike 3 measured 0 of 89
  # invocations detected on the set it reads.
  #
  # DEFAULT-OFF and then some: `read_remote_settings` activates only when
  # `telemetry.remote.enabled` is true AND the org pack supplied an endpoint,
  # an org id, and a salt. A clone of this repository carries the key names
  # and no values, so it cannot reach the write path. Inactive ⇒ zero
  # telemetry file operations and zero network calls.
  #
  # It appends to a LOCAL JSONL file and stops — no outbound call exists in
  # this concern. Transport is Phase 2 (blocked on `sink-choice`); org-wide
  # enablement is Phase 3 (blocked on `dpo-signoff`).
  #
  # BOUND ON SIX PLATFORMS, INERT ON MOST OF THEM — and that asymmetry is a
  # reading caveat for Phase 4, not a defect to fix by unbinding. A `Skill`
  # tool is a Claude-family surface; on a host that has none, this concern
  # never fires and the org's record set carries no rows for it. A zero from
  # such a host therefore means "no instrument", NOT "no adoption" — which is
  # precisely the blind-zero class this roadmap exists to remove, so it must
  # not be read as a measurement. Every record carries `host`, so the
  # denominator is reconstructable per host; unbinding would convert a
  # readable absence into a guaranteed one.
  #
  # Silent on every path (never writes to stdout); exit 0 always, including a
  # malformed envelope or a write failure. Carries no hook-token-budget row —
  # it emits nothing, same as orchestration-record. fail_closed: false.
  #
  # Concern-budget note: this takes all six `post_tool_use` cells from 10 to
  # 11 against a `max_per_event: 8` that is warn-only (`hard_fail: false`)
  # and was already exceeded by 2 before this change. The threshold is a
  # placeholder awaiting session evidence, per its own comment in the
  # settings template — not a bar this concern is the first to cross.
  telemetry-usage:
    script: src/scripts/hooks/telemetry_usage_hook.ts
    args: []
    fail_closed: false
    severity: advisory
    # Provable from the hook's own source: the only branch surface is
    # `extractToolName(payload) !== SKILL_TOOL_NAME`.
    tools: [Skill]
    # `[input]` only, and provable by reading the hook: it takes the skill
    # name from `tool_input.skill` and the host/session from the envelope.
    # It never touches `tool_response` — a skill invocation's RESULT body is
    # the large one, and this concern records a usage FACT rather than an
    # outcome, so the result class would be paid for and discarded.
    needs_payload_bodies: [input]
  # road-to-orchestrator-discipline-carriers Phase 4 (F3-lite) — conditional
  # delegation nudge. Extracts cheap structural signals from the SUBMITTED
  # prompt (enumerated file lists, "for each"/"alle …" shapes, explicit slice
  # counts, ordered-plan markers, multi-deliverable conjunctions), classifies
  # via `classifyTask`, and — only on a positive do-in-parallel/do-in-steps
  # verdict — reports `{decision:"warn", reason, additional_context}` at exit
  # 2, mirroring `language-mirror`'s shipped delivery pattern so the verdict
  # line actually reaches `hookSpecificOutput.additionalContext` on the
  # verified `claude` platform. Silence is the anti-canary default: no
  # enumerated signal → no injection at all. Never blocks the turn — see the
  # hook's file header for the `host_semantics.emitFor` proof. fail_closed:
  # false.
  # `nudge_rank` (road-to-standing-context-40k Phase 4 step 4.2) — nudge-class
  # exclusivity. At most ONE ranked nudge leaves per slot; the LOWEST rank wins
  # and the dispatcher records every suppression as a `nudge_interference_drop`
  # dispatch issue. A concern without the field is not nudge-class and is never
  # suppressed by this policy.
  #
  # Measured before the policy was written, so the overlap is a fact rather than
  # a hypothesis: the prompt "Use when starting parallel work in isolation from
  # the current branch — spawn a git worktree … for src/a.ts, src/b.ts, src/c.ts
  # and src/d.ts, each independently" fires delegation-nudge AND skill-route
  # together on `user_prompt_submit`. Pinned by tests/eval/nudge-interference/.
  #
  # WHY delegation-nudge OUTRANKS skill-route, stated because the order is a
  # decision and not an accident: the delegation verdict changes the SHAPE of
  # the work (dispatch vs in-session), while a skill pointer is a hint the model
  # may ignore — and the suppressed half has a first-class recovery path that
  # the suppressed delegation verdict would not, because `suggest_skill_for_task`
  # ranks the same catalogue on demand (see the missing-skill-recovery rule).
  # Losing the pointer costs one tool call; losing the delegation verdict costs
  # the plan.
  delegation-nudge:
    script: src/scripts/hooks/delegation_nudge_hook.ts
    args: []
    fail_closed: false
    severity: advisory
    nudge_rank: 1
  # road-to-inbox-harvest-2026-08-d-runtime-skill-routing Phase 2 — binds the
  # deterministic task→skill ranker, which had shipped with ZERO production
  # callers: `score_skill_relevance.rank` and its `suggest_skill_for_task`
  # wrapper were reachable only from their CLIs and from `routing:doctor`.
  # Ranks the SUBMITTED prompt over the installed skill catalogue and injects
  # at most one line naming the top-3 skill ids and their scores — POINTERS,
  # never bodies, never a load instruction. Same delivery as `delegation-nudge`
  # above: `{decision:"warn", reason, additional_context}` at exit 2, reduced
  # to a real exit of 0 by `host_semantics.emitFor`'s warn branch, so it never
  # blocks a turn.
  #
  # Silence is the default and its floor is MEASURED, not chosen: `rank`
  # returns something on nearly every real prompt, so the trigger is a top-1
  # score at or above 30/100 — the p90 of the routing-matrix corpus (496 prompt
  # lines; median 18, p75 28, max 70), firing on 13.9% of them. A median floor
  # would speak on half of all turns, which is the per-turn-reminder shape this
  # estate has already measured failing. fail_closed: false.
  skill-route:
    script: src/scripts/hooks/skill_route_hook.ts
    args: []
    fail_closed: false
    severity: advisory
    nudge_rank: 2
  # road-to-trigger-delivered-rule-bodies Phase 1 — the DELIVERY twin of
  # `skill-route` above: same two slots, opposite payload policy. `skill-route`
  # ships pointers because a skill is invoked; this ships BODIES because a rule
  # is something the agent must already be under, and the only datum on
  # pointer-shaped rule delivery is the 36.2 %-against-48 % run at
  # docs/CLAIMS.md:188-189.
  #
  # DEFAULT OFF, and off means ZERO bytes: the concern returns before reading
  # `dist/router.json` unless `lean_projection.mode: delivery`. Under every
  # shipped default it emits nothing, so its `hook-token-budget.json` row is
  # registered against the derived per-prompt cap rather than a measured
  # emission — there is no measured emission yet, and saying so is the point.
  #
  # DELIBERATELY NOT nudge-class: it carries no `nudge_rank`. A rule body is not
  # a hint the model may ignore, so the one-ranked-nudge-per-slot exclusivity
  # above must not suppress it against `delegation-nudge` / `skill-route`, and it
  # must not suppress them either. It is still advisory and still droppable by
  # the per-turn injection ceiling, which is the budget that should govern it.
  #
  # `pre_compact` re-arms the once-per-session-per-rule seen-set — the same
  # pin-lost shape `language-mirror` uses on that slot. Bound on `claude` only:
  # step 2.4's flip is Claude-only by construction (a thin projection without a
  # body-delivering hook is the pointer arm that already scored 36.2 %), so
  # binding a default-off concern on hosts whose flip can never happen would pay
  # slot cost for nothing. fail_closed: false.
  rule-inject:
    script: src/scripts/hooks/rule_inject_hook.ts
    args: []
    fail_closed: false
    severity: advisory
    needs_payload_bodies: [input]
  # road-to-orchestrator-discipline-carriers Phase 5 (F4-lite) — end-review
  # nudge. Fires ONLY when the session mutated tracked+untracked, non-doc
  # files beyond MUTATION_LINE_THRESHOLD (50 lines; untracked files added
  # post-review, F6) AND no reviewer ran this session (scanned from the
  # Stop payload's `transcript_path`) AND this session has not already
  # fired once (F2 — a once-per-session gate; state under
  # agents/runtime/state/end-review-nudge/, gitignored). On fire, reports
  # `{decision:"warn", reason, additional_context}` at exit 2 (same delivery
  # pattern as `language-mirror`/`delegation-nudge` above) and appends one
  # `review_skipped` telemetry line — hook-carried, not model-carried — so a
  # future blocking decision has a measured distribution to cite. Never
  # blocks the turn — see the hook's file header for the `host_semantics.
  # emitFor` proof. fail_closed: false.
  end-review-nudge:
    script: src/scripts/hooks/end_review_nudge_hook.ts
    args: []
    fail_closed: false
    severity: advisory
    # road-to-stop-gate-honesty step 3.1 — skipped on a refusal RETRY.
    # ARGUMENT, per concern as that step requires: the F2 fire gate is a
    # once-per-session marker, and this concern's own header records that a
    # second run "reads the marker and returns silently, without re-running the
    # transcript scan". The retry therefore cannot change its artefact — the
    # telemetry line was already written, or already suppressed, on the first
    # Stop. Idempotence is the concern's own construction, not our assumption
    # about it. The saving is the module load rather than a large read, which is
    # the smaller of the two flags below it and is stated as such.
    skip_on_refusal_retry: true
  # road-to-conformance-round5 Phase 3 — the FIRST concern that can refuse a
  # turn-END. Round 5 measured the reason: both blocking carriers reached zero
  # violations, neither advisory carrier did, and 19 language violations
  # survived a pin that had fired 26-35 seconds earlier. Refusal-capable
  # intercepts enforce; context injection requests.
  #
  # Two detectors on one guard — promissory closing (20 measured) and language
  # mismatch (19 measured) — because building the unsafe part twice is how a
  # second detector becomes a second outage.
  #
  # ALWAYS ARMED — no settings surface (2026-08-12). It shipped default-OFF on
  # the round-6 council's "soak before it binds", and the maintainer removed the
  # switch on the ground that a concern which is off cannot soak: the flag made
  # the soak it protected unreachable. Whether the gate fires is decided by each
  # detector's own trigger conditions, which is the same shape `delegation-nudge`
  # uses — no signal, no output. `hooks.turn_end_gate.*` is in REMOVED_KEYS.
  #
  # fail_closed: FALSE, deliberately and unlike every other blocking concern
  # here: a crash in a turn-end gate must let the turn END. Failing closed on
  # this slot does not degrade the session, it wedges it. Re-entrancy is two
  # independent layers (`stop_hook_active`; a marker keyed on the last USER
  # message, never the reply) — see the hook's file header.
  turn-end-gate:
    script: src/scripts/hooks/turn_end_gate_hook.ts
    args: []
    fail_closed: false
    severity: blocking
  # road-to-token-economy-cache Phase 5.1/5.2 — edit-shape advisory. Fires
  # when a Write replaced an existing, git-tracked file of >= 50 lines while
  # the effective diff (`git diff HEAD --numstat` added+deleted vs current
  # file lines) was <= 20% — one line naming the cheaper primitive (a
  # targeted Edit pays for the diff, not the file). Thresholds are COMMITTED
  # in the concern header. Once per session (F2-style marker under
  # agents/runtime/state/edit-shape/). Reports `{decision:"warn", reason,
  # additional_context}` at exit 2 (same verified delivery pattern as
  # `delegation-nudge`); never blocks. Exempt: dist/**, */generated/*,
  # *.lock, *.min.*, agents/runtime/**. fail_closed: false.
  edit-shape:
    script: src/scripts/hooks/edit_shape_hook.ts
    args: []
    fail_closed: false
    severity: advisory
    # Provable from the hook's own source: the only branch surface is
    # `toolName !== 'Write'` — same cheap-filter discipline as
    # `orchestration-record`'s [Agent, Task].
    tools: [Write]
    needs_payload_bodies: [input]
  # road-to-token-economy-cache Phase 6.1/6.2 — re-read guard + post-edit
  # scope hint. PreToolUse, ADVISORY ONLY (never exit 1 — a stale-ledger
  # false positive on a block would corrupt work): a full-file Read of a
  # path already fully read this session and unchanged since (mtime+size vs
  # a session-scoped ledger under agents/runtime/state/reread-guard/ — paths
  # and numbers only, never content), or a full-file Read right after this
  # session's own Edit/Write to the same path, gets one advisory line naming
  # the ranged-read alternative. Per-path once-per-session latch. Same
  # exemption list as edit-shape. Delivery mirrors `delegation-nudge`
  # (exit-2 warn never blocks on the verified `claude` platform).
  # fail_closed: false.
  reread-guard:
    script: src/scripts/hooks/reread_guard_hook.ts
    args: []
    fail_closed: false
    severity: advisory
    # Provable from the hook's own source: READ_TOOLS ∪ WRITE_TOOLS.
    tools: [Read, Edit, Write]
    needs_payload_bodies: [input]
  # road-to-token-economy-recycling Phases 1.1 / 3.2 / 4.2 — session
  # end-of-life instrument + recycle advisory. Every Stop, incrementally
  # folds the transcript's newly appended lines (payload `transcript_path`,
  # validated like end-review-nudge) into counts-only per-session state
  # under agents/runtime/state/session-eol/ (final context tokens via
  # cc_transcript's billable-input definition, turn count, observed
  # compaction events) and overwrites the machine-readable fill surface
  # agents/runtime/state/context-fill.json. Past the committed recycle
  # threshold (src/config/recycle-threshold-budget.json), injects ONE
  # advisory line ONCE per session (F2) — `{decision:"warn", reason,
  # additional_context}` at exit 2, the verified delivery pattern of
  # end-review-nudge. Absent config or unreadable transcript is silence,
  # never a block; hooks cannot inject /clear, so the recycle action itself
  # is advisory-carried by design. fail_closed: false.
  session-eol:
    script: src/scripts/hooks/session_eol_hook.ts
    args: []
    fail_closed: false
    severity: advisory
  # road-to-long-horizon-execution Phase 1 (H-1) — the stop slot's first
  # WORK-REMAINING concern. No-op unless this session claimed a roadmap
  # (`sessions:claim`) whose frontmatter says `execution.mode: autonomous`;
  # then compares the claimed roadmap's open checkboxes against the run and
  # BLOCKS the stop with a continuation naming the next step + its `verify:`
  # line, under a termination ladder (max 25 iterations, 4 h wall clock,
  # 3-engagement stall → allow). Registered AFTER turn-end-gate on purpose:
  # concerns run sequentially, so a gate refusal for this turn is on disk
  # first and this concern defers to it — quality gates outrank continuation,
  # always. Events: agents/runtime/state/run-continuation.jsonl. Kill switch:
  # AGENT_CONFIG_NO_RUN_CONTINUATION=1. fail_closed: false — the only block
  # it ever emits is the one carrying its own continuation text.
  run-continuation:
    script: src/scripts/hooks/run_continuation_hook.ts
    args: []
    fail_closed: false
    # `blocking`, and the R2 review is why. The concern shipped `advisory`,
    # which the dispatcher enforces as a CEILING: `_is_advisory` downgrades any
    # EXIT_BLOCK to EXIT_WARN, and `host_semantics.emitFor` maps stop+warn to
    # exit 0 + additionalContext. The concern's `return EXIT_BLOCK`, this
    # comment block's "BLOCKS the stop", and the hook's own docblock therefore
    # all described behaviour the declaration forbade — the whole re-engagement
    # mechanism was inert on the one verified host. `turn-end-gate` above sits
    # on the same slot and declares `blocking` for exactly this reason.
    severity: blocking
  # road-to-user-out-of-the-loop Phase 0 Step 1 — the interruption ledger.
  # Every Stop, classifies whether the turn that just ended put a synchronous
  # contact to the user and appends one `{run_id, turn, kind, class, roadmap}`
  # line to gitignored runtime state (agents/runtime/state/interruptions.jsonl,
  # file shape after gate-metrics.jsonl). Three classes, not two: a hand-back
  # ("das entscheidest Du", "your call") ends the turn and waits for the user
  # exactly as a question does, so counting only `?` would report this
  # package's own preferred shape as zero contacts.
  #
  # CAPTURE ONLY, and that is the point rather than caution: Phase 0's two
  # pre-registered claims are baselines, and a baseline can only be read off a
  # window no mechanism reacted to. It emits nothing, never warns, and always
  # returns 0 — so it carries no src/config/hook-token-budget.json row, the
  # same as subagent-ledger and orchestration-record.
  #
  # Reply-shape detection is IMPORTED from turn-end-gate (readTranscriptTail,
  # finalParagraph, HANDBACK) rather than copied — a second copy would drift
  # from the measured corpus's detector and the drift would land silently in
  # the baseline. Dedupe on the turn ordinal, the same identity that hook
  # derives, because a host may fire Stop twice for one turn. fail_closed: false.
  interruption-ledger:
    script: src/scripts/hooks/interruption_ledger_hook.ts
    args: []
    fail_closed: false
    severity: advisory
    # road-to-stop-gate-honesty step 3.1 — skipped on a refusal RETRY, and this
    # is the flag with the real saving.
    # ARGUMENT, per concern: `alreadyRecorded(ledgerPath, run_id, turn)` dedupes
    # on the TURN ORDINAL, and a refusal retry is the same turn by construction
    # — the gate's layer-2 marker is keyed on that same ordinal. So the ledger
    # already writes nothing on the retry and the artefact is provably identical.
    # What it does NOT already avoid is the cost: `main()` calls
    # `readTranscriptTail` (up to 8 MB, walking the whole file) BEFORE reaching
    # `alreadyRecorded`, so today every refused Stop pays a full transcript walk
    # and then discards the result. That is the "pure duplicate cost" § D-3
    # names, measured in the source rather than assumed.
    skip_on_refusal_retry: true
  # road-to-subagent-lifecycle-integrity Phase 1 (Steps 2+3) — the subagent
  # lifecycle ledger. Binds ONLY the two new events; on every other slot it is
  # not listed at all. Appends `subagent_start` / `subagent_stop` lines to
  # gitignored runtime state and keeps one open-record file per live dispatch
  # so depth and concurrency are derived from the set rather than asserted.
  #
  # CAPTURE ONLY, and that is load-bearing rather than cautious: Phase 1's
  # falsifier (envelope return rate >=95% and no dispatch over 2x its tier
  # budget-equivalent duration) can only be read off a window no mechanism
  # reacted to. `validateResponse` runs in observe mode — the verdict is
  # written down and dropped, never emitted as a decision. Phase 2's
  # return-gate and Phase 3's spawn-guard are the concerns allowed to act, and
  # both are pre-registered as gated on the baseline this one produces.
  #
  # Never blocks, never warns: exit 0 on every path including a malformed
  # payload or an unwritable disk. fail_closed: false.
  subagent-ledger:
    script: src/scripts/hooks/subagent_ledger_hook.ts
    args: []
    fail_closed: false
    severity: advisory
  # road-to-inbox-harvest-2026-08-d-context-ledger Phase 1 Step 1.1 — the
  # tool-result byte counter. `hook-token-budget.json` registers the gap it
  # closes in its own words: bytes-into-context from tool RESULTS are
  # instrumented nowhere, so every context-cost claim in this tree is made
  # against a denominator missing its dominant term.
  #
  # CAPTURE ONLY. It appends `{ts, tool, bytes, measurable}` to a gitignored
  # census file and emits NOTHING to the model — zero injection bytes, which
  # is why it carries a metric registration rather than a per-concern byte
  # cap. The threshold question (when is a result too large) is deliberately
  # unanswered: the distribution has never been observed, and the house rule
  # is baseline before mechanism.
  #
  # The record type has four fields and none can hold free text — a tool
  # NAME, a byte COUNT, a timestamp and a measurable flag. Tool results
  # routinely carry file contents and command output; none of it can reach
  # this output because the output has no field able to carry it.
  #
  # Never blocks, never warns: exit 0 on every path. fail_closed: false.
  tool-result-bytes:
    script: src/scripts/hooks/tool_result_bytes_hook.ts
    args: []
    fail_closed: false
    severity: advisory
  # road-to-subagent-lifecycle-integrity Phase 3 Step 1 — spawn guard, SHADOW
  # ONLY, per docs/contracts/concern-activation-policy.md. On every Agent/Task
  # call it appends one `spawn_guard_shadow` line recording what a guard WOULD
  # have done at three candidate threshold pairs. It emits nothing to the model
  # and has no code path that can deny.
  #
  # It skips the warn rung deliberately: the activation policy rules it out for
  # a concern on its way to blocking, because a verified-firing per-turn
  # injection left its own compliance rate unmoved (session-canary, 24 of 29)
  # while both blocking carriers in conformance round 5 reached zero. A warn
  # would pay this concern's full per-call cost and buy nothing measurable;
  # shadow pays the same cost and buys the distribution the shipped threshold
  # has to be derived from.
  #
  # Never blocks, never warns: exit 0 on every path. fail_closed: false.
  spawn-guard-shadow:
    script: src/scripts/hooks/spawn_guard_shadow_hook.ts
    args: []
    fail_closed: false
    severity: advisory
    tools: [Agent, Task]
  # road-to-source-first-frontend Phase 3 Steps 1-2 — source-first gate, SHADOW
  # ONLY, per docs/contracts/concern-activation-policy.md. On every
  # capture-shaped tool call it appends one `source_first_gate_shadow` line
  # recording what the gate WOULD have warned under four candidate gating
  # rules. It emits nothing to the model and has no code path that can warn or
  # deny.
  #
  # Phase 3 Step 1 was drafted as `exit 2 warn` and Step 2 left the posture an
  # explicit maintainer call; the roadmap's own 2026-08-17 correction records
  # that the activation policy contradicts the drafted default-ON warn. Shadow
  # is the re-argued answer, and it dissolves both of that step's blocking
  # dependencies rather than waiting on them: the verifier-exemption risk is a
  # harm of EMISSION (a concern that emits nothing warns nobody, so the open
  # SLI `agent_id` binding becomes a recorded field instead of a gate), and the
  # unfinished multi-host matcher census becomes the measurement rather than a
  # false-positive generator (`capture_kind` separates page-reaching capture
  # from display capture on every record).
  #
  # No `tools:` filter on purpose: the concern must see ordinary reads to latch
  # whether the handover source was read before the capture. The flip condition
  # to advisory is pre-registered in the hook header.
  #
  # Never blocks, never warns: exit 0 on every path. fail_closed: false.
  source-first-gate:
    script: src/scripts/hooks/source_first_gate_hook.ts
    args: []
    fail_closed: false
    severity: advisory
    needs_payload_bodies: [input]

# Role axis (road-to-token-economy-dispatch Phase 2). The dispatcher reads
# AGENT_CONFIG_SESSION_ROLE (resolved via _lib/session_role.ts — set ONLY by
# suite-owned CLI spawn wrappers, never guessed from host state) and applies
# the role's `drop` list to every slot EXCEPT pre_tool_use: safety guards run
# on every role, structurally — the resolver refuses pre_tool_use drops and
# lint_hook_manifest rejects a drop entry bound to that slot.
# Missing / unknown role → the full orchestrator chain, byte-identical to a
# manifest without this block (fail-open, Phase 2.4).
# Host limitation, pre-registered in the roadmap's worker-chain-host-delivery
# blocker: in-process Agent-tool subagents inherit the host process env and
# cannot be marked per-spawn; the axis binds where the suite launches a CLI
# session itself.
#
# Superseded in part, 2026-08-14 (road-to-subagent-lifecycle-integrity Phase 4
# Step 2). The env half above still stands — nothing marks an in-process spawn
# per-process. What has changed is that env is no longer the only candidate
# channel: `subagent_start` / `subagent_stop` are bound on this host
# (2.1.229, Phase 0 Step 1) and their payload carries `agent_id`, which
# `subagent-ledger` correlates on today. So a payload-bound role axis —
# `agent_id` present ⇒ role `worker` — is a live proposal (Phase 4 Step 1),
# not a closed question.
# It is NOT implemented, and the reason is a missing measurement rather than a
# missing decision: whether `agent_id` reaches a `PreToolUse` / `PostToolUse`
# payload inside a subagent is unverified on this host. That is Phase 0 Step 4,
# blocked on `raw-capture-needs-host-env` (the capture itself is already
# shipped — `dispatch_hook._maybe_capture_payload`). A neighbouring assertion
# from the same spike already came back negative: `agent_type` does NOT arrive
# on `SubagentStop` (18 of 25 stop records null), so the documented-field
# presence is not assumed for `agent_id` either.
# Until that spike lands the env path is the only one wired, and the
# pre_tool_use exemption above is unaffected either way — a payload-resolved
# `worker` still cannot drop a pre_tool_use concern.
roles:
  worker:
    # Orchestrator-only concerns (Phase 2.3): a worker never talks to the
    # user, never dispatches sub-workers, never runs the council, and its
    # complaints route via the orchestrator.
    # `skill-route` joins the drop list for the same reason `delegation-nudge`
    # is on it: a worker was handed a bounded slice by an orchestrator that
    # already chose the approach, so a routing pointer there advises nobody who
    # can act on it and costs the dispatch anyway.
    # `interruption-ledger` joins it on the first clause verbatim — "a worker
    # never talks to the user". Its whole measurement is synchronous user
    # contacts, so a worker turn that ends in a question to its orchestrator
    # would be recorded as a contact that never reached a human, inflating the
    # exact baseline Phase 0 pre-registers.
    drop: [delegation-nudge, skill-route, end-review-nudge, council-availability, team-review-gate, self-repair, session-eol, interruption-ledger]

platforms:
  augment:
    session_start:    [chat-history, hot-context, handoff-context, session-canary, council-availability, telemetry-disclosure, first-run-gate, onboarding-gate, verify-before-complete, minimal-safe-diff, profile-staleness, wrapper-freshness, surface-probe, session-register]
    session_end:      [chat-history, memory-learn, session-register, roadmap-progress, telemetry-flush]
    stop:             [chat-history, hot-context, verify-before-complete, self-repair, session-register, roadmap-progress]
    pre_tool_use:     [block-no-verify, block-unauthorized-git, evidence-independence, block-kernel-rule-writes, block-config-weakening, rtk-wrap, design-slop, ui-route-nudge, code-graph-nudge, ship-diff-volume, reread-guard]
    post_tool_use:    [chat-history, roadmap-progress, context-hygiene, verify-before-complete, minimal-safe-diff, injection-scan, pr-url-reminder, orchestration-record, telemetry-usage, tool-result-bytes, edit-shape]

  claude:
    session_start:    [chat-history, hot-context, handoff-context, session-canary, council-availability, telemetry-disclosure, first-run-gate, onboarding-gate, verify-before-complete, minimal-safe-diff, profile-staleness, wrapper-freshness, surface-probe, session-register]
    session_end:      [chat-history, memory-learn, session-register, roadmap-progress, telemetry-flush]
    stop:             [chat-history, hot-context, verify-before-complete, team-review-gate, end-review-nudge, turn-end-gate, self-repair, session-register, session-eol, interruption-ledger, roadmap-progress, run-continuation]
    user_prompt_submit: [chat-history, verify-before-complete, minimal-safe-diff, language-mirror, delegation-nudge, skill-route, git-authorization, session-canary, self-repair, session-register, rule-inject]
    pre_tool_use:     [block-no-verify, block-unauthorized-git, evidence-independence, block-kernel-rule-writes, block-config-weakening, rtk-wrap, design-slop, ui-route-nudge, code-graph-nudge, ship-diff-volume, reread-guard, spawn-guard-shadow, source-first-gate, rule-inject]
    post_tool_use:    [chat-history, roadmap-progress, context-hygiene, verify-before-complete, minimal-safe-diff, injection-scan, pr-url-reminder, orchestration-record, telemetry-usage, tool-result-bytes, edit-shape, language-mirror]
    # `language-mirror` — round-5 § 6.1. `pre_compact` sets a pin-lost marker;
    # the `post_tool_use` entry above re-emits the pin exactly once while that
    # marker is set, then clears it. One extra injection per compaction EVENT —
    # never one per tool call, which is the shape § 6.2 refuses. claude only: it
    # is the sole verified platform, and the measured compaction defect is a
    # Claude Code transcript fact. (It was the ONLY binding on this slot until
    # the entry below; that sentence is retired rather than left to rot.)
    #
    # `hot-context` — road-to-inbox-harvest-2026-08-d-context-ledger Step 2.1.
    # This is the one slot that fires WHILE state is being destroyed, and it
    # carried no WRITER at all: the cache a post-compaction `session_start`
    # restores was written at the last `stop`, so everything the session did
    # between that stop and the compaction was lost with it. The concern is
    # already bound on `stop` and `session_start`; this adds the write at the
    # moment the loss actually happens. Deterministic rebuild, emits nothing
    # here — the 4,096-byte row it carries is for its session_start restore.
    pre_compact:      [language-mirror, hot-context, rule-inject]
    # road-to-subagent-lifecycle-integrity Phase 1 Step 1. `claude` is the only
    # platform where both native events were measured present on the installed
    # binary (2.1.229 — see the evidence page cited on the alias rows below).
    subagent_start:   [subagent-ledger]
    subagent_stop:    [subagent-ledger]

  # Cowork — the Claude desktop app's local-agent-mode runtime, built
  # on top of the Claude Code CLI. Same lifecycle vocabulary, same
  # event-payload shape (PascalCase native names; Stop carries
  # `transcript_path`). Listed as a separate platform so chat-history
  # entries can attribute events to Cowork vs CLI Claude Code via the
  # `agent` field.
  #
  # Upstream caveat (anthropics/claude-code#40495, #27398): Cowork
  # sessions currently ignore all three Claude Code settings sources
  # (user, project, env), and `--setting-sources user` excludes
  # plugin-scope hooks. Until those land, the dispatcher binding
  # below is structurally ready but lifecycle events do not fire.
  # Decision matrix + upstream blockers tracked in
  # agents/settings/contexts/chat-history-platform-hooks.md § Cowork.
  cowork:
    session_start:    [chat-history, hot-context, handoff-context, session-canary, council-availability, telemetry-disclosure, first-run-gate, onboarding-gate, verify-before-complete, minimal-safe-diff, profile-staleness, wrapper-freshness, surface-probe, session-register]
    session_end:      [chat-history, memory-learn, session-register, roadmap-progress, telemetry-flush]
    # end-review-nudge and delegation-nudge are DELIBERATELY NOT bound on
    # this platform (F10, review) — cowork-dispatcher.sh's own header states
    # it "always exit[s] 0" and its dispatch line discards the dispatcher's
    # exit code AND stdout unconditionally (`>/dev/null 2>&1 || true`). Both
    # concerns' delivery depends entirely on `additional_context` reaching
    # the model via stdout at the verified exit-2 warn path — a delivery this
    # trampoline makes structurally impossible regardless of which platform
    # is later verified to forward it. Binding them here would be dead
    # weight: the concern still runs (git diff, transcript scan, classifier),
    # still costs the dispatch, and its entire output is thrown away.
    stop:             [chat-history, hot-context, verify-before-complete, self-repair, session-register, roadmap-progress]
    user_prompt_submit: [chat-history, verify-before-complete, minimal-safe-diff, language-mirror, git-authorization, session-canary, self-repair, session-register]
    pre_tool_use:     [block-no-verify, block-unauthorized-git, evidence-independence, block-kernel-rule-writes, block-config-weakening, rtk-wrap, design-slop, ui-route-nudge, code-graph-nudge, ship-diff-volume, reread-guard, spawn-guard-shadow, source-first-gate]
    post_tool_use:    [chat-history, roadmap-progress, context-hygiene, verify-before-complete, minimal-safe-diff, injection-scan, pr-url-reminder, orchestration-record, telemetry-usage, tool-result-bytes, edit-shape]
    # subagent-ledger IS bound here, unlike the two nudges above, and the
    # difference is the delivery channel rather than the platform: the nudges
    # depend on stdout reaching the model, which this trampoline discards by
    # construction; the ledger's entire output is a disk append, which survives
    # a discarded stdout and a discarded exit code alike. It stays dead until
    # the upstream settings-source blockers land and the events actually fire —
    # structurally ready, costing nothing in the meantime.
    subagent_start:   [subagent-ledger]
    subagent_stop:    [subagent-ledger]

  # Phase 7.5 — Cursor. `.cursor/hooks.json` (project) is read by the
  # IDE and CLI; `~/.cursor/hooks.json` (user) is opt-in via
  # `install.py --cursor-user-hooks` and uses scripts/hooks/cursor-dispatcher.sh
  # to route into the active workspace. UserPromptSubmit maps to
  # `beforeSubmitPrompt` (Cursor third-party-hooks table). Stop is
  # IDE-only — CLI-only users fall back to /checkpoint per
  # agents/settings/contexts/chat-history-platform-hooks.md.
  cursor:
    session_start:      [chat-history, hot-context, handoff-context, session-canary, council-availability, telemetry-disclosure, first-run-gate, onboarding-gate, verify-before-complete, minimal-safe-diff, profile-staleness, wrapper-freshness, surface-probe, session-register]
    session_end:        [chat-history, memory-learn, session-register, roadmap-progress, telemetry-flush]
    stop:               [chat-history, hot-context, verify-before-complete, self-repair, session-register, roadmap-progress]
    user_prompt_submit: [chat-history, verify-before-complete, minimal-safe-diff, language-mirror, git-authorization, session-canary, self-repair, session-register]
    post_tool_use:      [chat-history, roadmap-progress, context-hygiene, verify-before-complete, minimal-safe-diff, injection-scan, pr-url-reminder, orchestration-record, telemetry-usage, tool-result-bytes, edit-shape]

  # Phase 7.6 — Cline. Hooks live under `.clinerules/hooks/<HookName>`
  # (project, no file extension, must be executable per Cline docs) or
  # `~/Documents/Cline/Hooks/<HookName>` (global). Each script reads a
  # JSON payload from stdin (`taskId`, `hookName`, `workspaceRoots`,
  # `model`, plus a hook-specific field). Cline emits two distinct
  # task-start events — TaskStart (new) and TaskResume (continue) —
  # both map to session_start. TaskCancel maps to stop because the
  # session is interrupted with partial state (mirrors Augment Stop).
  cline:
    session_start:      [chat-history, hot-context, handoff-context, session-canary, council-availability, telemetry-disclosure, first-run-gate, onboarding-gate, verify-before-complete, minimal-safe-diff, profile-staleness, wrapper-freshness, surface-probe, session-register]
    session_end:        [chat-history, memory-learn, session-register, roadmap-progress, telemetry-flush]
    stop:               [chat-history, hot-context, verify-before-complete, self-repair, session-register, roadmap-progress]
    user_prompt_submit: [chat-history, verify-before-complete, minimal-safe-diff, language-mirror, git-authorization, session-canary, self-repair, session-register]
    post_tool_use:      [chat-history, roadmap-progress, context-hygiene, verify-before-complete, minimal-safe-diff, injection-scan, pr-url-reminder, orchestration-record, telemetry-usage, tool-result-bytes, edit-shape]

  # Phase 7.7 — Windsurf (Cascade). Hooks live at `.windsurf/hooks.json`
  # (project) or `~/.codeium/windsurf/hooks.json` (user). Cascade has
  # no generic post-tool-use surface — roadmap-progress and
  # context-hygiene therefore have no Windsurf binding (documented
  # platform limitation). chat-history wires through the per-turn
  # cycle: pre_user_prompt for the turn-check, post_cascade_response
  # for the per-turn append, and post_setup_worktree for first-run
  # init (rare, fires only on worktree creation; advisory not
  # blocking — Windsurf docs).
  # Windsurf — verify-before-complete tracks lifecycle only (no post_tool_use
  # surface to record verification commands; documented limitation).
  # minimal-safe-diff is omitted entirely on Windsurf for the same reason.
  windsurf:
    session_start:      [chat-history, hot-context, handoff-context, session-canary, council-availability, telemetry-disclosure, first-run-gate, onboarding-gate, verify-before-complete, profile-staleness, wrapper-freshness, surface-probe, session-register]
    stop:               [chat-history, hot-context, verify-before-complete, self-repair, session-register]
    # language-mirror IS bound here: unlike minimal-safe-diff it needs only the
    # user_prompt_submit slot, which Windsurf has.
    user_prompt_submit: [chat-history, verify-before-complete, language-mirror, git-authorization, session-canary, self-repair, session-register]

  # Phase 7.8 — Gemini CLI. Hooks live at `.gemini/settings.json`
  # (project) or `~/.gemini/settings.json` (user). Per Gemini docs
  # (geminicli.com/docs/hooks/reference/), each event maps to an
  # array of hook groups; each group has a `matcher` (regex for
  # tool events, exact string for lifecycle) and a `hooks` array of
  # `{type: "command", command: "..."}`. SessionStart/SessionEnd are
  # advisory (cannot block); BeforeAgent fires after the user
  # submits a prompt and before agent planning, so it carries the
  # turn-check semantics. AfterAgent fires when the agent loop ends
  # — this is our `stop` slot.
  gemini:
    session_start:      [chat-history, hot-context, handoff-context, session-canary, council-availability, telemetry-disclosure, first-run-gate, onboarding-gate, verify-before-complete, minimal-safe-diff, profile-staleness, wrapper-freshness, surface-probe, session-register]
    session_end:        [chat-history, memory-learn, session-register, roadmap-progress, telemetry-flush]
    stop:               [chat-history, hot-context, verify-before-complete, self-repair, session-register, roadmap-progress]
    user_prompt_submit: [chat-history, verify-before-complete, minimal-safe-diff, language-mirror, git-authorization, session-canary, self-repair, session-register]
    post_tool_use:      [chat-history, roadmap-progress, context-hygiene, verify-before-complete, minimal-safe-diff, injection-scan, pr-url-reminder, orchestration-record, telemetry-usage, tool-result-bytes, edit-shape]

  # Phase 7.9 — Copilot has no hook surface. Concerns route through
  # rule-only fallback; the dispatcher silently no-ops on --platform copilot.
  copilot:
    fallback_only: true

# Native-event → agent-config-event translation table. Used by per-platform
# trampolines when the platform speaks a different vocabulary. Trampolines
# pass --native-event for traceability; the dispatcher does NOT branch on it.
native_event_aliases:
  augment:
    SessionStart:    session_start
    SessionEnd:      session_end
    Stop:            stop
    PostToolUse:     post_tool_use
    PreToolUse:      pre_tool_use
  claude:
    SessionStart:      session_start
    SessionEnd:        session_end
    Stop:              stop
    UserPromptSubmit:  user_prompt_submit
    PostToolUse:       post_tool_use
    PreToolUse:        pre_tool_use
    PreCompact:        pre_compact
    # road-to-subagent-lifecycle-integrity Phase 1 Step 1. Both tokens were
    # re-extracted from the installed binary at 2.1.229 (exact-token counts 12
    # and 24) rather than carried over from the 2.1.220 spike — see
    # agents/evidence/investigations/subagent-lifecycle-phase0-host-pin.md.
    SubagentStart:     subagent_start
    SubagentStop:      subagent_stop
  # Cowork shares Claude Code's PascalCase event vocabulary verbatim
  # (Cowork is Claude Code under the hood). Native names are duplicated
  # here rather than aliased so dispatcher logs / feedback carry the
  # platform tag the operator expects.
  cowork:
    SessionStart:      session_start
    SessionEnd:        session_end
    Stop:              stop
    UserPromptSubmit:  user_prompt_submit
    PostToolUse:       post_tool_use
    PreToolUse:        pre_tool_use
    PreCompact:        pre_compact
    # Cowork is Claude Code under the hood, so the subagent pair is aliased
    # here for the same reason the rest of the table is duplicated rather than
    # referenced. NOT independently measured on a Cowork build — the alias
    # costs nothing if the host never sends the event, and the ledger records
    # absence as data rather than assuming arrival.
    SubagentStart:     subagent_start
    SubagentStop:      subagent_stop
  cursor:
    sessionStart:        session_start
    sessionEnd:          session_end
    stop:                stop
    beforeSubmitPrompt:  user_prompt_submit
    postToolUse:         post_tool_use
    preToolUse:          pre_tool_use
    preCompact:          pre_compact
  cline:
    TaskStart:         session_start
    TaskResume:        session_start
    TaskComplete:      session_end
    TaskCancel:        stop
    UserPromptSubmit:  user_prompt_submit
    PostToolUse:       post_tool_use
    PreToolUse:        pre_tool_use
    PreCompact:        pre_compact
  # Windsurf (Cascade) — snake_case event names per
  # docs.windsurf.com/windsurf/cascade/hooks. post_cascade_response is
  # async (off the critical path) so the per-turn append safely lands
  # in the `stop` slot rather than `session_end`.
  windsurf:
    pre_user_prompt:        user_prompt_submit
    post_cascade_response:  stop
    post_setup_worktree:    session_start
  # Gemini CLI — PascalCase event names per geminicli.com/docs/hooks/.
  # BeforeAgent fires after the user submits a prompt and before
  # planning (carries the turn-check / append-on-prompt semantics).
  # AfterAgent fires when the agent loop ends — our `stop` slot.
  gemini:
    SessionStart:  session_start
    SessionEnd:    session_end
    BeforeAgent:   user_prompt_submit
    AfterAgent:    stop
    BeforeTool:    pre_tool_use
    AfterTool:     post_tool_use
