# host_lowering — how each host lowers a dispatcher verdict into its own hook
# contract, and what this tree has actually established about that lowering.
#
# WHY THIS FILE EXISTS. Before it, five facts about a host lived in five
# places: `VERIFIED_PLATFORMS` and the block-capable event set in
# `hooks/host_semantics.ts`, five private per-host binding constants in
# `install.ts`, and prose in half a dozen docs. Three rounds of corrections to
# that prose did not stop it drifting, because prose has no single reader. This
# table is the single reader.
#
# WHAT A ROW IS. A row is keyed `(host, surface, slot)`. It describes what this
# package does and what this package has established — never what the host is
# capable of. `verified: null` means nobody established anything; it does NOT
# mean the host cannot enforce.
#
# THE `surface` AXIS IS PRESENT AND DEGENERATE, DELIBERATELY. Every row today
# is `any`, because nothing in this tree has measured an IDE-versus-CLI
# difference in hook lowering on any host. The key carries the dimension so a
# future measurement lands as a new row rather than as a rewrite; inventing
# `ide:`/`cli:` rows nobody measured is the defect this roadmap exists to stop.
#
# CONSUMED BY:
#   - src/scripts/hooks/host_semantics.ts   (VERIFIED_PLATFORMS, isBlockCapable, emission shape)
#   - src/scripts/_lib/host_bindings.ts     (per-host bridge bindings + the install smoke probe)
#   - src/scripts/lint_hook_manifest.ts     (schema + expiry gate)
#   - src/scripts/check_host_docs_digest.ts (docs-drift watcher over `verified.docs_digest`)
#
# COLUMNS
#   block_exit       exit code this host honours as a refusal on that slot;
#                    `null` = this tree has not established that it honours one.
#   answered_at      the date the pair above was last answered — REQUIRED on
#                    every slot. A `block_exit: null` with no date is
#                    indistinguishable from a slot nobody looked at, and that
#                    ambiguity is what this column removes. The citation for the
#                    answer is the row's `verified.docs_url` unless the slot
#                    carries its own `docs_url:`.
#   json_shape       structured-output envelope the dispatcher may emit.
#                    `none` means this package has no native envelope for the
#                    host, so `emitFor` keeps the legacy pass-through even when
#                    the row is verified — see host_semantics.usesNativeEmission.
#   entry_shape      shape of the bridge entry the installer writes.
#   fail_policy      `propagate` = the dispatcher's exit code reaches the host;
#                    `discard`   = the trampoline exits 0 regardless.
#   timeout_unit     unit the host's own hook-timeout setting is expressed in.
#   timeout_default  host default for that timeout. `null` = not established here.
#   verified         provenance of the row, or `null`. `expires` is mandatory
#                    when the block is present — see lint_hook_manifest.
#                    `docs_digest` is the sha256 of the `docs_url` body as last
#                    ESTABLISHED for the row — recorded by a human-run fill,
#                    never silently updated. On drift the watcher leaves it
#                    alone and moves `expires` instead, so the field keeps
#                    naming the body someone actually read. It is NOT paired
#                    with `docs_at`, and the committed rows prove why: all nine
#                    carry `docs_at: 2026-09-29` while the eight digests were
#                    taken 2026-10-01. The two answer different questions —
#                    `docs_at` when a human read the page for the row's ANSWERS,
#                    `docs_digest` which body the watcher is comparing against.
#                    `check_host_docs_digest --fetch` re-reads and flags a
#                    difference.
#   slots            ORDERED. Bridge entries are written in this order, so the
#                    order is part of the generated output and must not be
#                    sorted. `native` may be a list where one slot has two
#                    native events (cline session_start).
#
# THE `expires` POLICY, STATED RATHER THAN IMPLIED. No host this package
# supports publishes a documentation cadence, so no `expires` here is a vendor
# commitment — each one is a review-by date this package chose. Rows established
# by a dated documentation read carry `docs_at` + 1 year. `claude` keeps its
# committed 2027-09-06 because that value predates this policy and nothing in
# this change gives a reason to move it. The real drift signal is
# `docs_digest`: when the watcher sees a changed body it sets `expires` to the
# day BEFORE the detection date, because `lint_hook_manifest` tests `expires <
# today` — "valid through yesterday" is how a row stops being current today.
schema_version: 1

hosts:
  claude:
    surfaces:
      any:
        entry_shape: claude-settings-hooks
        json_shape: hook-specific-output
        fail_policy: propagate
        timeout_unit: seconds
        timeout_default: null
        # Transcribed from the behaviour host_semantics.ts already implements —
        # this row is a description of the status quo, not a new claim.
        # `docs_at` / `host_version` were null until 2026-09-29: the original
        # read was never dated, and the absence was the record. Both are filled
        # now from sources this tree already carries — the 2026-09-06 live probe
        # recorded in `host_semantics.ts` (Claude Code 2.1.263) and a fresh
        # documentation read on 2026-09-29. `expires` is deliberately unchanged.
        #
        # The committed `docs_url` was `https://docs.claude.com/en/docs/claude-code/hooks`,
        # which answers 301 and lands on the URL below. Recording the redirect
        # target is what makes a digest reproducible.
        verified:
          docs_at: 2026-09-29
          docs_url: https://code.claude.com/docs/en/hooks.md
          docs_digest: 9dd68316c1111c118e3ddb82861ac6271a8cd164cee0d371b26165efff35fe88
          probe_at: 2026-09-06
          host_version: 2.1.263
          expires: 2027-09-06
        slots:
          session_start:      { native: SessionStart,      block_exit: null, answered_at: 2026-09-29 }
          session_end:        { native: SessionEnd,        block_exit: null, answered_at: 2026-09-29 }
          stop:               { native: Stop,              block_exit: 2,    answered_at: 2026-09-29 }
          user_prompt_submit: { native: UserPromptSubmit,  block_exit: 2,    answered_at: 2026-09-29 }
          pre_tool_use:       { native: PreToolUse,        block_exit: 2,    answered_at: 2026-09-29 }
          post_tool_use:      { native: PostToolUse,       block_exit: null, answered_at: 2026-09-29 }
          pre_compact:        { native: PreCompact,        block_exit: null, answered_at: 2026-09-29 }
          subagent_start:     { native: SubagentStart,     block_exit: null, answered_at: 2026-09-29 }
          subagent_stop:      { native: SubagentStop,      block_exit: null, answered_at: 2026-09-29 }

  augment:
    surfaces:
      any:
        entry_shape: augment-settings-hooks
        json_shape: none
        # augment-dispatcher.sh exits 0 unconditionally: a verdict reaches the
        # trampoline and stops there.
        fail_policy: discard
        timeout_unit: unknown
        timeout_default: null
        # Established by a documentation read on 2026-09-29, not by a live
        # probe — `probe_at` stays null and says so.
        verified:
          docs_at: 2026-09-29
          docs_url: https://docs.augmentcode.com/cli/hooks.md
          docs_digest: e500823be8303717020c1823f670e06d100108f6e3ac4b8d12a46d91fd1898fa
          probe_at: null
          host_version: null
          expires: 2027-09-29
        # THE FINDING THIS ROW CARRIES. Augment's own documentation states that
        # `PreToolUse` can block tool execution and shows `exit 2` doing it. The
        # `block_exit: null` below is therefore NOT a claim that the host cannot
        # refuse — this file's header says a row never makes that claim. It is a
        # fact about this package: `augment-dispatcher.sh` exits 0
        # unconditionally (`fail_policy: discard`), so no verdict this package
        # produces can reach the host at all. Arming it means changing the
        # trampoline, which is an enforcement expansion and belongs to its own
        # change with its own ratification — not to a dating pass.
        slots:
          session_start:  { native: SessionStart,  block_exit: null, answered_at: 2026-09-29 }
          session_end:    { native: SessionEnd,    block_exit: null, answered_at: 2026-09-29 }
          stop:           { native: Stop,          block_exit: null, answered_at: 2026-09-29 }
          pre_tool_use:   { native: PreToolUse,    block_exit: null, answered_at: 2026-09-29 }
          post_tool_use:  { native: PostToolUse,   block_exit: null, answered_at: 2026-09-29 }

  cursor:
    surfaces:
      any:
        entry_shape: cursor-hooks-json
        json_shape: none
        fail_policy: propagate
        timeout_unit: unknown
        timeout_default: null
        verified:
          docs_at: 2026-09-29
          docs_url: https://cursor.com/docs/hooks.md
          docs_digest: 7294a2d63b19d79a5283c948afe174cba8b06a7585563d34a2c41b90f5df0d39
          probe_at: null
          host_version: null
          expires: 2027-09-29
        slots:
          session_start:      { native: sessionStart,        block_exit: null, answered_at: 2026-09-29 }
          session_end:        { native: sessionEnd,          block_exit: null, answered_at: 2026-09-29 }
          stop:               { native: stop,                block_exit: null, answered_at: 2026-09-29 }
          user_prompt_submit: { native: beforeSubmitPrompt,  block_exit: null, answered_at: 2026-09-29 }
          post_tool_use:      { native: postToolUse,         block_exit: null, answered_at: 2026-09-29 }

  cline:
    surfaces:
      any:
        entry_shape: cline-per-event-script
        json_shape: none
        # The generated per-event script swallows the dispatcher's exit code
        # and prints `{}`.
        fail_policy: discard
        timeout_unit: unknown
        timeout_default: null
        # SECOND FINDING FROM THE 2026-09-29 READ. `docs.cline.bot`'s hooks page
        # is now a one-line pointer to its SDK-plugins page and names none of
        # the `TaskStart` / `TaskResume` / `TaskComplete` / `TaskCancel` events
        # the slots below bind. The row is dated against the page that exists,
        # and the digest watcher is what will surface the next move; re-deriving
        # the event names from a page that no longer lists them is a separate
        # piece of work, and inventing a citation for them here would be the
        # defect this file was built to remove.
        verified:
          docs_at: 2026-09-29
          docs_url: https://docs.cline.bot/customization/hooks.md
          docs_digest: ef87561721f4cb80fe6d682b6866d638a4952dd416d36cd5ab398426ce64084b
          probe_at: null
          host_version: null
          expires: 2027-09-29
        slots:
          session_start:      { native: [TaskStart, TaskResume], block_exit: null, answered_at: 2026-09-29 }
          session_end:        { native: TaskComplete,            block_exit: null, answered_at: 2026-09-29 }
          stop:               { native: TaskCancel,              block_exit: null, answered_at: 2026-09-29 }
          user_prompt_submit: { native: UserPromptSubmit,        block_exit: null, answered_at: 2026-09-29 }
          post_tool_use:      { native: PostToolUse,             block_exit: null, answered_at: 2026-09-29 }

  windsurf:
    surfaces:
      any:
        entry_shape: windsurf-hooks-json
        json_shape: none
        fail_policy: propagate
        timeout_unit: unknown
        timeout_default: null
        # THIRD FINDING FROM THE 2026-09-29 READ. `docs.windsurf.com` now
        # redirects to `docs.devin.ai`; the redirect target is recorded so the
        # digest is reproducible.
        verified:
          docs_at: 2026-09-29
          docs_url: https://docs.devin.ai/desktop/cascade/hooks.md
          docs_digest: 460ffe7aa91998804920f6722c0153b9948eadd5edafa19582298475a19835a2
          probe_at: null
          host_version: null
          expires: 2027-09-29
        slots:
          session_start:      { native: post_setup_worktree,   block_exit: null, answered_at: 2026-09-29 }
          user_prompt_submit: { native: pre_user_prompt,       block_exit: null, answered_at: 2026-09-29 }
          stop:               { native: post_cascade_response, block_exit: null, answered_at: 2026-09-29 }

  gemini:
    surfaces:
      any:
        entry_shape: gemini-settings-hooks
        json_shape: none
        fail_policy: propagate
        timeout_unit: unknown
        timeout_default: null
        # A live deny probe was attempted on 2026-09-06 against Gemini CLI
        # 0.50.0 in an isolated scratch workspace and could not run: the CLI
        # aborts with IneligibleTierError before any turn begins, so no tool
        # call and therefore no BeforeTool hook is reachable. An unrunnable
        # probe establishes nothing, which is why `probe_at` is still null —
        # the block below rests on the 2026-09-29 documentation read alone.
        verified:
          docs_at: 2026-09-29
          docs_url: https://geminicli.com/docs/hooks/reference.md
          docs_digest: 06d37f2f66812ee78bb46c37a112203376f0bae4d3b8b44ac79d0bda4b86a118
          probe_at: null
          host_version: null
          expires: 2027-09-29
        slots:
          session_start:      { native: SessionStart, block_exit: null, answered_at: 2026-09-29, matcher: "" }
          session_end:        { native: SessionEnd,   block_exit: null, answered_at: 2026-09-29, matcher: "" }
          stop:               { native: AfterAgent,   block_exit: null, answered_at: 2026-09-29, matcher: "" }
          user_prompt_submit: { native: BeforeAgent,  block_exit: null, answered_at: 2026-09-29, matcher: "" }
          post_tool_use:      { native: AfterTool,    block_exit: null, answered_at: 2026-09-29, matcher: ".*" }

  cowork:
    surfaces:
      any:
        entry_shape: none
        json_shape: none
        # cowork-dispatcher.sh exits 0 unconditionally, and the host is
        # upstream-blocked from reading any settings source this package writes.
        fail_policy: discard
        timeout_unit: unknown
        timeout_default: null
        # `docs_url` is null and that is the answer, not a gap: the 2026-09-29
        # sweep found no public hook documentation for this host to cite. What
        # the row records is this tree's own finding, restated above the
        # `slots: {}` below — nothing is bound, so there is no pair to date.
        # `docs_digest` is null for the same reason: there is no body to hash.
        verified:
          docs_at: 2026-09-29
          docs_url: null
          docs_digest: null
          probe_at: null
          host_version: null
          expires: 2027-09-29
        slots: {}

  copilot:
    surfaces:
      any:
        entry_shape: none
        json_shape: none
        fail_policy: discard
        timeout_unit: unknown
        timeout_default: null
        # `fallback_only: true` in hook_manifest.yaml. This package binds
        # nothing here and has measured nothing here.
        #
        # THE PHASE-2 FINDING, RECORDED WHERE IT IS READ. The 2026-09-29
        # documentation check found that the host DOES document lifecycle hooks
        # — `sessionStart`, `sessionEnd`, `userPromptSubmitted`, `preToolUse`,
        # `postToolUse`, `agentStop`, `subagentStop`, `errorOccurred` — at
        # `~/.copilot/hooks/*.json`. So the roadmap's dated zero does NOT apply
        # to this host, and the row below is a dated statement about this
        # package, not about the host: nothing is bound, so `slots:` stays
        # empty.
        #
        # CORRECTED 2026-10-01, and the correction is the point of this file.
        # This comment previously ended "...with `preToolUse` fail-closed on
        # exit 2". **The cited page does not say that.** It was re-fetched on
        # 2026-10-01 — hashing byte-identical to the `docs_digest` below, so the
        # body read is provably the body pinned — and it contains NO exit-code
        # semantics at all: no `exit 2`, no non-zero convention, no stderr
        # contract. What it documents is the CAPABILITY — `preToolUse` "can
        # approve or deny tool executions" — and a `version`/`type`/`bash`/
        # `cwd`/`env`/`timeoutSec` config shape. The mechanism is undocumented
        # on that page.
        #
        # A capability is not a contract, and writing the contract in anyway is
        # precisely the "statement about what a host can do that the tree has
        # not established" this file's header forbids. The claim was inherited
        # rather than invented here, and it survived two readings before a
        # review fetched the page and grepped it; that is the whole argument for
        # `docs_digest` existing, so it is recorded rather than quietly deleted.
        #
        # WHY `probe_at` IS STILL NULL ON 2026-10-01, STATED SO IT IS NOT READ
        # AS AN OVERSIGHT. The sibling `codex` row was probed on that date
        # because `codex` is installed on the machine that ran the pass. The
        # Copilot CLI is not installed and `~/.copilot` carries no binary, so
        # there was no host to run a deny against. That is an absence of
        # opportunity, not an absence of effort, and it is the one thing
        # blocking this row from carrying what the codex row now carries.
        #
        # The codex probe is also the reason this row should NOT be armed from
        # its documentation alone — though the argument is WEAKER than it first
        # read, and the weaker version is the true one. On the sibling host a
        # documented exit-2 refusal did not reproduce on the installed build.
        # Here there is no documented exit-2 contract to arm in the first place
        # (see the correction above), so this host is further from a binding
        # than codex, not equally close. Either way the gate is the same: a
        # probe, never a re-read.
        verified:
          docs_at: 2026-09-29
          docs_url: https://docs.github.com/en/copilot/concepts/agents/hooks.md
          docs_digest: bfd40aa93ad62133efc17a50f189034f01594dc89a5d31a13a0c541d691acede
          probe_at: null
          host_version: null
          expires: 2027-09-29
        slots: {}

  codex:
    surfaces:
      any:
        entry_shape: none
        json_shape: none
        fail_policy: discard
        timeout_unit: unknown
        timeout_default: null
        # THE OTHER HALF OF THE PHASE-2 FINDING. Until 2026-09-29 this file had
        # no `codex` row at all, and `docs/enforcement-by-host.md` called that
        # "the third kind of absence" — no row because no `platforms:` key. The
        # documentation check replaced the absence with an answer: Codex
        # documents `SessionStart`, `SessionEnd`, `SubagentStart`,
        # `SubagentStop`, `PreToolUse`, `PermissionRequest`, `PostToolUse`,
        # `PreCompact`, `PostCompact`, `UserPromptSubmit`, `Stop` and
        # `Interrupt` at `~/.codex/hooks.json`, in a config shape and with an
        # `exit 2` + `hookSpecificOutput` contract that match Claude Code's.
        #
        # The row exists so the fact is dated and citable. `slots: {}` is the
        # honest state of THIS package: no `platforms.codex` block, no
        # trampoline, nothing installed. A row with slots the installer does
        # not write would be the claim-without-evidence this file refuses.
        #
        # LIVE PROBE, 2026-10-01 — AND IT DID NOT REPRODUCE THE DOCUMENTED
        # DENY. The paragraph above ends "...a contract that match Claude
        # Code's", which was read off the vendor page and had never been run.
        # It has now been run, against the installed `codex-cli 0.148.0`:
        #
        #   - An isolated `CODEX_HOME` was given a `hooks.json` binding
        #     `PreToolUse` with `matcher: "Bash"` to a script that writes to
        #     stderr and exits 2 — the documented refusal path, verbatim.
        #   - `codex exec --sandbox read-only "Run the shell command: echo …"`
        #     executed the shell call and returned its output. The call was
        #     NOT refused.
        #   - The feature is not switched off: `codex features list` reports
        #     `hooks  stable  true` on this build.
        #
        # WHAT THAT ESTABLISHES, AND WHAT IT EXPLICITLY DOES NOT. It establishes
        # that `block_exit` must stay null: this package has no demonstrated
        # refusal path on this host, which is exactly what a null means here. It
        # does NOT establish that Codex cannot refuse — this file's header
        # forbids that reading, and two unexcluded explanations remain. The
        # installed build is 0.148.0 against a current 0.159.3, and the page
        # that was read describes the current one; and the probe never
        # distinguished "the hook fired and was ignored" from "the matcher never
        # matched", because the instrumented re-run (a hook that records its own
        # input before refusing) was refused by the harness this probe ran
        # under. A marker-file re-run on >= 0.159.3 is the one cheap experiment
        # that would separate them, and it is named here rather than guessed at.
        #
        # The practical consequence is that a docs-only reading would have
        # armed a refusal this tree cannot demonstrate. The row records the
        # negative instead.
        verified:
          docs_at: 2026-09-29
          docs_url: https://developers.openai.com/codex/hooks.md
          docs_digest: 724881d81f1a9fdb35ea42d4851a11b1f6606bbc6e9d2d05c1e8c466fc25c630
          probe_at: 2026-10-01
          host_version: 0.148.0
          expires: 2027-09-29
        slots: {}
