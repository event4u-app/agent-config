# host_docs_pages — vendor pages this tree cites that are NOT a hook contract.
#
# WHY THIS FILE EXISTS. `host_lowering.yaml` records, per host, the page each
# row's answers were read off, and `check_host_docs_digest` watches exactly
# those pages. Every `docs_url` in that table is a HOOKS page, because that is
# what a lowering row is about. So a vendor page this tree reads for something
# else — a listing contract, a catalogue budget — reaches the tree only by
# accident: nothing re-fetches it, nothing notices when it moves, and the
# reading goes stale in silence until somebody happens to look.
#
# This is the sibling list for those pages. Same four provenance fields as a
# lowering row's `verified:` block, same watcher, same discipline.
#
# WHY IT IS A SEPARATE FILE AND NOT A ROW IN host_lowering.yaml. A lowering row
# is keyed `(host, surface, slot)` and answers "what does this host do with a
# dispatcher verdict". A listing page answers nothing of the sort, and a row
# with every hook column null would be a lie shaped like data. The tables also
# carry different edit costs: `host_lowering.yaml` is on the plumbing list, so
# an edit there carries a ratification artifact — correct for a file that
# decides whether a gate can refuse, and wrong for a list of URLs to re-fetch.
#
# WHAT A CHANGED DIGEST MEANS HERE, as in the sibling table: evidence that the
# page MOVED, never a reading of what it now says. The watcher adopts no
# upstream text. A human reads the page and re-establishes the row by hand.
#
# COLUMNS
#   docs_url      the page, as the URL that actually serves the body. Record
#                 the redirect TARGET, never a URL that answers 301 — a digest
#                 over a redirect body is not a digest over the page.
#   docs_at       the day a human last READ this page. Not the day its body was
#                 hashed; those are two events and the sibling table learned
#                 that the hard way.
#   docs_digest   sha256 of the body as fetched by the last digest run, or
#                 `null` when no run has hashed it yet. `null` is an honest
#                 state, not a gap: it is filled by the first
#                 `check_host_docs_digest --fetch --write`.
#   expires       this package's review-by date for the reading. The gate tests
#                 `expires < today`, so a drifted row is pulled back to the day
#                 BEFORE detection — "valid through yesterday".
#   why           one line: what this tree reads off the page, and who reads it.
#                 A page nobody cites does not belong on this list.
#
# CONSUMED BY:
#   - src/scripts/hooks/host_docs_pages.ts   (reader + surgical writer)
#   - src/scripts/check_host_docs_digest.ts  (the docs-drift watcher)

pages:
  claude-code-skills:
    docs_url: https://code.claude.com/docs/en/skills.md
    docs_at: 2026-10-14
    docs_digest: 3f53e70caebac7b7101bd57fd98d487c8be99611682f3f02677c2d2dbbc84764
    expires: 2027-10-14
    why: >-
      The skill LISTING contract — that the host lists every skill name but
      keeps descriptions only up to a fraction of the context window, filling by
      invocation frequency and capping each entry. `src/scripts/_lib/host_listing_model.ts`
      models that mechanism and cites this page for every number in it; nothing
      else in this tree establishes any of them.
