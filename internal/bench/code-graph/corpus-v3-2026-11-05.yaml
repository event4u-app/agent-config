# Code-graph benchmark corpus, v3 -- third-party subjects (suites B, C, D, E).
#
# Registered 2026-11-05 by PREREGISTRATION-v3-2026-11-05.md, BEFORE the code-graph
# engine has seen either subject. Suite A is not in this file: it is the v2 corpus,
# unchanged, bound by path and SHA-256 in the registration document. Suite F lives in
# suite-f-tasks-v3-2026-11-05.yaml.
#
# HOW THIS FILE WAS BUILT. The subjects were cloned at the pins below and read with
# git, grep, find and sed only. No graph build, no `code-graph` verb, no `map`, no
# `ask`, and no `src/scripts/code_graph/*` entry point was run on either clone. Every
# question names a symbol, route, model or file the author verified exists at the pin;
# the `basis` field cites where (paths are relative to the subject root, lines are at
# the pin).
#
# TRUTH IS NOT IN THIS FILE. Every scored question carries `truth: pending-oracle`.
# Truth is produced AFTER registration by the step-2.2 oracle arm (tsserver /
# scip-typescript references for TS and Vue script blocks; Psalm
# `--find-references-to` or a PHP language server for PHP), at symbol level, then
# projected to files. The 20 % human-checked sample is drawn by the rule fixed in the
# registration document. Truth is never derived from the graph under test. A `basis`
# line is the author's evidence that the question is well-formed; it is NOT truth and
# is never scored -- the oracle may find more sites, or fewer.
#
# Conventions, applied to every question, fixed before any run:
#   - `probe` is the bare token (or route) both arms receive verbatim. Path questions
#     carry `probe` (start) and `probe_to` (goal), as in v2.
#   - `declared_in`, where present, names the declaration the question is about. It
#     disambiguates for the ORACLE and the human checker only; neither arm receives it.
#     This is what makes class 1 a precise-semantics class: the token collides, the
#     declaration does not.
#   - A mention inside a comment, docblock or string literal is never an answer, as in
#     v2. Known instances are listed under `distractors`.
#   - Answers are scored at file level after symbol-level oracle truth is projected to
#     files. Paths are relative to the subject root.
#   - Excluded from every root: `vendor/`, `node_modules/`, `public/**/build/`,
#     `storage/`, `bootstrap/cache/`, lockfiles. Tests are IN scope.
#   - `hop_stratum` is the author's estimate of the shortest relation chain from probe
#     to the furthest answer (1, 2, or ">=3"). The oracle re-derives it; when the two
#     disagree the oracle's stratum is reported, and the disagreement count is
#     published.
#   - Class 5 (suite D) questions carry `expected: empty` instead of pending truth. If
#     the oracle finds a non-empty answer for one, that question is VOID -- removed from
#     the clean-rate and listed by id -- never flipped into a positive question.
#
# Classes (numbering fixed here and used by the registration document):
#   1 precise-semantics   (suite B)   scored
#   2 route-trace         (suite C)   scored, reported PER SUBJECT, never pooled
#   3 model-table         (suite C)   scored
#   4 tests-for           (suite C)   scored
#   5 negative-control    (suite D)   clean-rate only, no bar
#   6 change-impact       (suite E)   scored
#   7 change-impact-xplane (suite E)  scored

