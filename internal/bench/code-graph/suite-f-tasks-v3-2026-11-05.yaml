# Suite F -- agentic tasks, v3. Registered 2026-11-05 by
# PREREGISTRATION-v3-2026-11-05.md, BEFORE the code-graph engine has seen either
# subject.
#
# 24 tasks from REAL upstream fixes, 11 on larasend and 13 on unopim. Every fix commit
# and its parent are ancestors of the registered pin in the event4u-app fork
# (`reachable_in: fork`), so a task checkout survives an upstream deletion, rename or
# force-push. Sourced with `gh pr list/view` and `gh issue view` against the upstream
# repositories and `git log` / `git show --name-only` on the forks; no graph tool was
# run on either clone.
#
# Selection rule, fixed here: a merged upstream fix (a PR, or a fix commit inside a
# merged PR when the PR bundles several) that touches at most 15 files, at least one of
# them production code. Excluded: dependency bumps, Docker/CI/nginx configuration only,
# docs/README only, tests only, and fixes whose commit is not an ancestor of the fork pin.
#
# Two kinds:
#   localise-and-fix  -- the agent starts at `parent_sha` with `issue_text` only, and must
#                        localise and fix. Truth source 2 = the production files in
#                        `fix_files` (tests and the files under `excluded_from_truth` are
#                        not localisation targets). A fix is "solved" when the upstream
#                        tests the fix commit added or changed pass on the agent's tree;
#                        an "escaped regression" is any test passing at `parent_sha` that
#                        fails on the agent's tree.
#   pr-review-missed-callers -- the agent starts at `parent_sha` with `issue_text` and the
#                        fix diff MINUS every hunk in `held_out`. It must name the files the
#                        change still needs. Truth = `held_out`, which the upstream fix did
#                        touch (truth source 2). Scored deterministically by file-set
#                        match, never by an LLM judge (K3).
#
# `issue_text` is the author's paraphrase of the upstream issue, PR description or commit
# message: behaviour-level, at most 60 words, never more than 15 consecutive words of the
# original, and with the original's file paths, class names and method names REMOVED, so
# that localisation is measured rather than handed over.
#
# Contamination note: the unopim fixes are from September-October 2026, larasend's from
# July-August 2026. Training-data recall of either cannot be excluded and is not claimed
# to be excluded; both arms face the same exposure.

