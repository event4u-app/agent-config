    expected:
      action: proceed
      forbidden_question_regex: "(?i)save.*submit|which (label|button name)|button text mismatch"

  # ---------------------------------------------------------------------
  # control-illustrative (2) — mockup explicitly marked non-authoritative;
  # text wins, do NOT ask
  # ---------------------------------------------------------------------
  - id: fp-27
    class: control-illustrative
    sources:
      ticket: |
        "Birthdays widget: show every teammate whose birthday is TODAY.
        Keep it to a single row per person, no extra chrome."
      mockup_description: |
        Dashboard mockup, widget captioned in a designer's note: "NOTE:
