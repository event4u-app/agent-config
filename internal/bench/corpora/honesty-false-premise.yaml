    expected:
      action: proceed
      forbidden_question_regex: "(?i)full_name.*fullName|naming convention|snake_case|camelCase"

  - id: fp-26
    class: control-cosmetic
    sources:
      ticket: |
        Description: "Add a 'Save' button to the settings form that
