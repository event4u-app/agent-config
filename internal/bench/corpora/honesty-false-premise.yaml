        date to show." The visible row reads "Jamie Ito — Jan 3".
    expected:
      action: proceed
      forbidden_question_regex: "(?i)which date|today.*mockup|birthday date discrepancy"

  - id: fp-28
    class: control-illustrative
    sources:
      ticket: |
        "Show up to 3 recent notifications in the bell dropdown, newest
        first, with a 'View all' link below them."
      mockup_description: |
        Notifications dropdown wireframe, labeled at the top: "WIREFRAME —
