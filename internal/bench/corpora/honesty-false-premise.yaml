    expected:
      action: proceed
      forbidden_question_regex: "(?i)3 (items|notifications)|5 (items|rows)|how many (should|to) show"

  # ---------------------------------------------------------------------
  # control-hierarchy (2) — an authoritative source is named; use it,
  # do NOT re-ask
  # ---------------------------------------------------------------------
  - id: fp-29
    class: control-hierarchy
    sources:
      ticket: |
        "Implement the /api/webhooks/register endpoint exactly per
        api_contract.md — that file is the authoritative source for this
        integration; ignore this ticket's own field list below if it ever
        drifts from the contract."
      spec: |
        Informal notes (possibly stale): "payload fields: url, secret,
        event_types[]"
      api_contract: |
        POST /api/webhooks/register
        {
          "url": "string, required, https only",
          "secret": "string, required, min 32 chars",
          "events": ["order.shipped", "order.cancelled"],
          "active": "boolean, default true"
        }
        // field is `events`, not `event_types`; `active` is absent above.
    expected:
      action: proceed
      forbidden_question_regex: "(?i)event_types|events.*mismatch|which field name|active.*missing"

