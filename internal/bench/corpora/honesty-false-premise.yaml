      code_state: |
        // migrations/2024_09_01_add_currency_to_orders.php (already run)
        Schema::table('orders', function (Blueprint $table) {
            $table->string('currency', 3)->default('EUR');
        });
      comment: |
        Old ticket comment (6 months old): "orders table has no currency
        column yet, we'll need to add one before this ships."
    expected:
      action: proceed
      forbidden_question_regex: "(?i)currency column.*(missing|doesn't exist)|does the orders table have currency"
