# Track B — task corpus for the package-impact A/B bench.
#
# Phase 4 Step 1 of agents/roadmaps/road-to-package-impact-benchmark.md.
#
# Each task is an end-to-end coding ask. The runner (bench_ab_task_runner.py)
# invokes the `claude` CLI inside a clone of the variant under test, captures
# transcript + tool-call log + wall-time + token counts, and snapshots the
# resulting working tree. Scoring is STRUCTURAL — no LLM judge — per the
# criteria in scripts/_lib/bench_ab_scoring.py.
#
# Task IDs encode (category, index). Categories:
#   bugfix    — buggy seeded code + expected fixed behaviour
#   feature   — additive change to existing files
#   refactor  — existing-pattern-aware rewrite
#   uiaudit   — "where would you add X" (exercises existing-ui-audit gate)
#   testadd   — add a missing test for an existing function
#
# Schema:
#   version: 1
#   corpus_id: ab-trackb
#   tasks:
#     - id: trackb-{category}-NN
#       category: <category>
#       duration: short|long                    # 2x2 axis — wall-time band (council 2026-06-14)
#       cognitive: reasoning-heavy|mechanical   # 2x2 axis — cognitive-load band
#       prompt: "<user message>"
#       seed_files: [<paths inside the fixture that the task reads/writes>]
#       expected_artifacts: [<paths the runner expects to find after the run>]
#       success_criteria: {category-specific keys consumed by bench_ab_scoring}
#       notes: "<optional rationale>"

version: 1
corpus_id: ab-trackb

tasks:
  # ───── Bug-fix ─────
  - id: trackb-bugfix-01
    category: bugfix
    duration: short
    cognitive: reasoning-heavy
    prompt: "src/parser.ts accepts an empty-string `id` on tasks but should reject it. Fix `coerceTask` to throw with a clear message when `id` is the empty string. Add a test."
    seed_files: ["src/parser.ts", "tests/formatter.test.ts"]
    expected_artifacts: ["src/parser.ts", "tests/parser.test.ts"]
    success_criteria:
      target_file_modified: "src/parser.ts"
      regex_in_target: "id\\s*===?\\s*[\"'][\"']|id\\.length\\s*===?\\s*0|id\\s*&&"
      new_test_file_exists: "tests/parser.test.ts"
    notes: "The KNOWN BUG comment in parser.ts names this exact case."

  - id: trackb-bugfix-02
    category: bugfix
    duration: short
    cognitive: mechanical
    prompt: "src/formatter.ts `summarize` returns the wrong text when the task list is empty — it prints `0 done / 0 total` which is fine, but the leading space in the formatted output causes the test `formatter renders empty list` to fail. Fix so an empty list returns just `no tasks`."
    seed_files: ["src/formatter.ts"]
    expected_artifacts: ["src/formatter.ts"]
    success_criteria:
      target_file_modified: "src/formatter.ts"
      regex_in_target: "no tasks|length\\s*===?\\s*0"
    notes: "Seeded bug — empty-list edge case."

  - id: trackb-bugfix-03
    category: bugfix
    duration: short
    cognitive: mechanical
    prompt: "src/cli.ts crashes with an unhelpful stack trace when the JSON file is missing. Wrap the readFile in a try/catch and print a clean error like `tasks: file not found: <path>` to stderr with exit code 1."
    seed_files: ["src/cli.ts"]
    expected_artifacts: ["src/cli.ts"]
    success_criteria:
      target_file_modified: "src/cli.ts"
      regex_in_target: "ENOENT|file not found|catch"
    notes: "Error-handling tightening."

  # ───── Feature-add ─────
  - id: trackb-feature-01
    category: feature
    duration: short
    cognitive: reasoning-heavy
    prompt: "Add a `formatGroup` function to src/formatter.ts that groups tasks by `done` status and renders each group with a `## open` / `## done` heading. Include a test."
    seed_files: ["src/formatter.ts"]
    expected_artifacts: ["src/formatter.ts", "tests/formatter.test.ts"]
    success_criteria:
      target_file_modified: "src/formatter.ts"
      regex_in_target: "formatGroup|## open|## done"
      test_assertion_added: "tests/formatter.test.ts"
    notes: "Pure additive feature."

  - id: trackb-feature-02
    category: feature
    duration: short
    cognitive: mechanical
    prompt: "Add a `--done-only` CLI flag to src/cli.ts that filters to tasks with `done: true` before printing."
    seed_files: ["src/cli.ts"]
    expected_artifacts: ["src/cli.ts"]
    success_criteria:
      target_file_modified: "src/cli.ts"
      regex_in_target: "--done-only|doneOnly|argv\\.includes"
    notes: "CLI surface extension."

  - id: trackb-feature-03
    category: feature
    duration: long
    cognitive: reasoning-heavy
    prompt: "Add a `markDone(tasks, id)` function to src/parser.ts (or a new src/mutate.ts file — agent's call) that returns a new task list with the matching id flipped to done=true. Idempotent on already-done tasks."
    seed_files: ["src/parser.ts"]
    expected_artifacts: ["src/parser.ts"]
    success_criteria:
      regex_in_any: "markDone|mark_done|\\.map\\("
      one_of_files_modified: ["src/parser.ts", "src/mutate.ts"]
    notes: "Architectural choice: extend parser.ts or new file."

  # ───── Refactor ─────
  - id: trackb-refactor-01
    category: refactor
    duration: long
    cognitive: reasoning-heavy
    prompt: "src/parser.ts duplicates the type-check logic across `parseTaskFile` and `coerceTask`. Extract the validation into a small helper without changing the public API (same throw shapes)."
    seed_files: ["src/parser.ts"]
    expected_artifacts: ["src/parser.ts"]
    success_criteria:
      target_file_modified: "src/parser.ts"
      regex_in_target: "function\\s+\\w+|const\\s+\\w+\\s*="
      preserves_public_api: ["parseTaskFile", "coerceTask"]
    notes: "Behavior-preserving."

  - id: trackb-refactor-02
    category: refactor
    duration: short
    cognitive: mechanical
    prompt: "src/formatter.ts inlines its glyph mapping. Extract the open/done glyphs into a small const map and reuse it. Preserve every existing test."
    seed_files: ["src/formatter.ts", "tests/formatter.test.ts"]
    expected_artifacts: ["src/formatter.ts"]
    success_criteria:
      target_file_modified: "src/formatter.ts"
      regex_in_target: "const\\s+\\w+\\s*=\\s*\\{|GLYPH"
    notes: "Style-only refactor; tests unchanged."

  # ───── UI-audit ─────
  - id: trackb-uiaudit-01
    category: uiaudit
    duration: long
    cognitive: reasoning-heavy
    prompt: "I want to add a `formatTaskAsCard` function that renders a task as a multi-line card (border + title + status badge). Before you write anything, audit the existing formatters and tell me where this belongs."
    seed_files: ["src/formatter.ts"]
    expected_artifacts: []
    success_criteria:
      transcript_contains_one_of: ["existing-ui-audit", "state.ui_audit", "audit findings", "audit the existing"]
      no_file_write_before_audit: true
    notes: "Triggers existing-ui-audit gate (gate fires in with-variant only)."

  - id: trackb-uiaudit-02
    category: uiaudit
    duration: long
    cognitive: reasoning-heavy
    prompt: "Add a new `--render html` flag that prints tasks as an HTML list. Where in the codebase should this live?"
    seed_files: ["src/cli.ts", "src/formatter.ts"]
    expected_artifacts: []
    success_criteria:
      transcript_contains_one_of: ["existing-ui-audit", "state.ui_audit", "audit findings", "where in the codebase"]
    notes: "Architectural question first, code second."

  # ───── Test-add ─────
  - id: trackb-testadd-01
    category: testadd
    duration: short
    cognitive: reasoning-heavy
    prompt: "tests/parser.test.ts does not exist. Add it with at least three cases: valid input, malformed JSON, missing tasks array."
    seed_files: ["src/parser.ts"]
    expected_artifacts: ["tests/parser.test.ts"]
    success_criteria:
      new_test_file_exists: "tests/parser.test.ts"
      regex_in_target: "test\\s*\\(|describe\\s*\\(|assert"
      min_test_count: 3
    notes: "Greenfield test file."

  - id: trackb-testadd-02
    category: testadd
    duration: short
    cognitive: mechanical
    prompt: "tests/formatter.test.ts is missing a test for the case where `summarize` is called with an empty array. Add it without touching the existing tests."
    seed_files: ["tests/formatter.test.ts", "src/formatter.ts"]
    expected_artifacts: ["tests/formatter.test.ts"]
    success_criteria:
      target_file_modified: "tests/formatter.test.ts"
      regex_in_target: "empty|\\[\\]|length\\s*===?\\s*0"
      no_existing_test_removed: ["formatTaskLine renders an open task", "summarize counts done vs. total"]
    notes: "Additive test."

  - id: trackb-testadd-03
    category: testadd
    duration: short
    cognitive: reasoning-heavy
    prompt: "There's no test exercising the CLI entry. Add tests/cli.test.ts that imports `main` from src/cli.ts and verifies it returns exit code 2 when no path is given."
    seed_files: ["src/cli.ts"]
    expected_artifacts: ["tests/cli.test.ts"]
    success_criteria:
      new_test_file_exists: "tests/cli.test.ts"
      regex_in_target: "main\\(|exit code|return\\s+2"
    notes: "Imports + invokes the CLI surface."
