  - id: hs-11
    twin_of: hc-21
    category: controversial-correct
    type: diff
    language: ts
    defect_kind: shared-mutable-state
    review_prompt: "Review this diff for defects. Report each with file:line."
    artifact:
      diff: |
        --- a/src/store/counterStore.ts
        +++ b/src/store/counterStore.ts
        @@ -1,5 +1,7 @@
        -export class CounterStore {
        -  private value = 0;
        -  increment() { this.value += 1; return this.value; }
        -  get() { return this.value; }
        -}
        +let value = 0;
        +export function createCounterStore() {
        +  return {
        +    increment: () => { value += 1; return value; },
        +    get: () => value,
        +  };
        +}
    defect: "src/store/counterStore.ts:1: value is declared at module scope, outside the factory, so every store returned by createCounterStore shares one counter, unlike the per-instance class field it replaces."
    defect_regex: '(?i)(shared|module[- ]?(level|scope)|global|singleton|outside (the )?(factory|function|closure)|all (stores|instances|counters)|every (store|instance|counter)|across (instances|stores|calls)|per[- ]instance|(state|value)\b.*leak)'
    audit_note: "Each CounterStore instance had its own value; with let value hoisted above the factory, two createCounterStore() calls return objects that increment the same variable, so one store's increments show up in the other. The closure-factory style itself is fine, as hc-21's audit traces; only the declaration site moved."

  - id: hs-12
    twin_of: hc-23
    category: controversial-correct
    type: diff
    language: ts
    defect_kind: off-by-one
    review_prompt: "Review this diff for defects. Report each with file:line."
    artifact:
      diff: |
        --- a/src/tree/depth.ts
        +++ b/src/tree/depth.ts
        @@ -1,3 +1,5 @@
        +// Config trees are authored by hand and bounded to <= 8 levels (see docs/config-schema.md).
         export function depth(node: ConfigNode): number {
        -  return 1 + Math.max(0, ...node.children.map(depth));
        +  if (node.children.length === 0) return 0;
        +  return 1 + Math.max(...node.children.map(depth));
         }
    defect: "src/tree/depth.ts:3: the leaf base case returns 0, but the removed code gave a leaf depth 1, so every depth is now one less than before (a single-node tree reports 0)."
    defect_regex: '(?i)(return 0|off[- ]by[- ]one|leaf\b.*\b(0|zero|1|one)\b|base case\b.*\b(0|zero|1|one|wrong|incorrect)\b|should (return|be) 1|one less|(depth|result)s?\b.*(decrement|smaller|lower|reduced)|single[- ]node.*\b(0|zero)\b|regress.*(leaf|depth))'
    audit_note: "Old: a leaf gives 1 + Math.max(0) = 1. New: a leaf gives 0, and each parent adds 1 on top, so every result drops by exactly one -- a behavior change the diff presents as a refactor. Recursion depth is still bounded by the stated <= 8-level contract, so hc-23's stack-overflow bait still does not apply."

  - id: hs-13
    twin_of: hc-25
    category: controversial-correct
    type: diff
    language: bash
    defect_kind: wrong-logical-operator
    review_prompt: "Review this diff for defects. Report each with file:line."
    artifact:
      diff: |
        --- a/scripts/check_env.sh
        +++ b/scripts/check_env.sh
        @@ -1,5 +1,5 @@
         #!/usr/bin/env bash
         set -euo pipefail
        -if [ -n "$API_KEY" ]; then
        +if [[ -n "$API_KEY" || "$API_KEY" == "$EXPECTED_PREFIX"* ]]; then
           echo "key looks valid"
         fi
    defect: "scripts/check_env.sh:3: || instead of && means any non-empty API_KEY passes; the EXPECTED_PREFIX check never constrains anything."
    defect_regex: '(?i)(\|\||logical[- ]or|should be (&&|and)\b|instead of (&&|and)\b|any non-?empty|(prefix|EXPECTED_PREFIX)\b.*(bypass|skip|ignored|irrelevant|never (checked|enforced|evaluated)|not (enforced|checked|required|validated|evaluated))|short[- ]circuit)'
    audit_note: "With ||, -n \"$API_KEY\" being true short-circuits the whole test, so the prefix match only runs for an empty key, where it cannot succeed unless EXPECTED_PREFIX is empty too -- the added check is dead and the script reports any key as valid. The [[ ]] and bash-only shebang choice remains correct, as hc-25's audit traces."

  - id: hs-14
    twin_of: hc-27
    category: controversial-correct
    type: diff
    language: ts
    defect_kind: swallowed-error
    review_prompt: "Review this diff for defects. Report each with file:line."
    artifact:
      diff: |
        --- a/src/net/fetchJson.ts
        +++ b/src/net/fetchJson.ts
        @@ -1,4 +1,8 @@
         export async function fetchJson(url: string): Promise<unknown> {
        -  const res = await fetch(url);
        -  return res.json();
        +  try {
        +    const res = await fetch(url);
        +    return await res.json();
        +  } catch (err) {
        +    return undefined;
        +  }
           }
    defect: "src/net/fetchJson.ts:6: the catch block returns undefined, swallowing every network and JSON-parse error that the old code propagated; callers can no longer tell a failure from an empty result."
    defect_regex: '(?i)(swallow|suppress|silenc|mask(s|ed|ing)? (the )?(err|error|exception|failure)|discard(s|ed|ing)? (the )?(err|error|exception|cause)|ignor(es|ed|ing) (the )?(caught )?(err|error|exception)|\berr\b.*(unused|ignored|dropped)|return(s|ing)? undefined|undefined\b.*(instead|rather|on (error|failure)|indistinguishable)|(error|failure|exception)s?\b.*(not (re-?)?thrown|not propagat|never propagat|no longer propagat|dropped|lost|hidden))'
    audit_note: "Before the change a rejected fetch or a malformed body rejected the returned promise; now both resolve to undefined with the error object never read, so failures vanish silently. The try/await structure is the same as hc-27, where rethrowing with { cause: err } made it correct; only the catch body changed."

  - id: hs-15
    twin_of: hc-29
    category: controversial-correct
    type: diff
    language: js
    defect_kind: inverted-condition
    review_prompt: "Review this diff for defects. Report each with file:line."
    artifact:
      diff: |
        --- a/src/util/discount.js
        +++ b/src/util/discount.js
        @@ -1,9 +1,4 @@
         function applyDiscount(price, isMember) {
        -  let result;
        -  if (isMember) {
        -    result = price * 0.9;
        -  } else {
        -    result = price;
        -  }
        -  return result;
        +  if (isMember) return price;
        +  return price * 0.9;
         }
    defect: "src/util/discount.js:2: the guard is inverted -- members now pay full price and non-members get the 10% discount, the opposite of the removed if/else."
    defect_regex: '(?i)(invert|revers|backwards?|swap|flip|wrong (way|branch)|missing (the )?(!|negation)|should be !\s*isMember|!\s*isMember|members?\b.*(full price|no discount|not discounted|lose the discount)|non-?members?\b.*(discount|0\.9))'
    audit_note: "The removed code gave members price * 0.9 and non-members price; the new guard returns price for members and price * 0.9 for everyone else, inverting the business rule. The early-return restructuring itself is fine, as hc-29's audit traces; only the missing negation changes behavior."
