# Telegraph condensation benchmark corpus — step-16 Phase 1 Step 3 deliverable.
#
# Purpose: measure realised vs. condensable token savings of the telegraph-speak
# dialect across the seven carve-out shapes that are byte-preserved by the rule
# (.agent-src.uncondensed/rules/telegraph-speak.md). Pure-prose prompts isolate
# the carve-out-tax-free upper bound; carve-out prompts probe the realistic
# bench cases where preservation eats into condenseibility.
#
# Consumed by: scripts/bench_run.py --telegraph (step-16 Phase 1 Step 4 — not yet
# shipped). Each prompt is executed three times under speak_scope = aggressive
# (condensed), speak_scope = off + system prefix "Answer concisely." (terse
# control), and speak_scope = off (uncondensed). Results are aggregated in
# bench/reports/telegraph-v1.{json,md} against the contract in
# docs/contracts/benchmark-report-schema.md.
#
# expected_carve_out_pct is a hand-annotated estimate of the fraction of the
# expected response that the rule mandates be byte-preserved (triple-backtick
# blocks, numbered-option lines, backtick spans, status markers, mode markers,
# tables, ALL-CAPS Iron-Law fences). The bench computes realised vs. expected
# carve-out share per run so drift is visible.
#
# Schema (provisional — not yet covered by scripts/lint_bench_corpus.py, which
# targets tests/eval/corpus-*.yaml routing corpora):
#   version: 1
#   corpus_id: telegraph
#   prompts:
#     - id: telegraph-NN
#       category: <one of seven carve-out kinds, or pure-prose>
#       language: en | de
#       prompt: "<prompt text>"
#       expected_carve_out_pct: 0.0 .. 1.0
#       expected_carve_out_kinds: [<marker shapes that must round-trip byte-exact>]
#       notes: "<annotation rationale>"
#
# Composition: 10 prompts — 7 carve-out categories (one each) + 3 pure-prose.

version: 1
corpus_id: telegraph

prompts:
  - id: telegraph-01
    category: iron-law-fence
    language: en
    prompt: "Quote the Iron Law of the commit-policy rule verbatim, then explain in one sentence what kind of accidental commit it prevents."
    expected_carve_out_pct: 0.45
    expected_carve_out_kinds: [iron-law-fence]
    notes: "Triple-backtick ALL-CAPS Iron-Law block dominates the reply; the trailing prose sentence is the only condensable surface."

  - id: telegraph-02
    category: numbered-options
    language: en
    prompt: "A production incident hit five minutes ago. Give me four numbered triage options (rollback, hotfix, feature-flag-off, bisect-and-revert) with one trade-off line each, then recommend one."
    expected_carve_out_pct: 0.55
    expected_carve_out_kinds: [numbered-options]
    notes: "Four numbered lines + a `Recommendation:` line — most of the reply is structural carve-out per user-interaction Iron Law."

  - id: telegraph-03
    category: code-heavy
    language: en
    prompt: "Write a Python function `load_yaml_keys(path: pathlib.Path) -> list[str]` that opens a YAML file, validates it is a top-level mapping, and returns the keys as a sorted list. Include a three-line docstring and raise `ValueError` on non-mapping input."
    expected_carve_out_pct: 0.78
    expected_carve_out_kinds: [triple-backtick]
    notes: "Single triple-backtick block plus a one-line intro; code dominates."

  - id: telegraph-04
    category: path-list
    language: en
    prompt: "Enumerate the files I need to touch to add a new rule named `example-foo` to the source tree, scoped to `.agent-src.uncondensed/` only. Cite each path in backticks. Do not generate the rule contents."
    expected_carve_out_pct: 0.50
    expected_carve_out_kinds: [backtick-span]
    notes: "Each path is a backtick-span carve-out; framing prose is ~half."

  - id: telegraph-05
    category: status-marker
    language: en
    prompt: "Summarise the outcome of running `task ci` if it produced three passing checks, one warning, and one hard failure. Use `❌`, `⚠️`, and `✅` lines and group by severity."
    expected_carve_out_pct: 0.40
    expected_carve_out_kinds: [status-marker, backtick-span]
    notes: "Status-marker lines plus backticked check names — both round-trip byte-exact."

  - id: telegraph-06
    category: mode-marker
    language: en
    prompt: "I just invoked `/mode strategist`. Acknowledge the mode change at the top of your reply using the canonical mode-marker block, then list the strategist contract in exactly two short bullets."
    expected_carve_out_pct: 0.25
    expected_carve_out_kinds: [mode-marker, backtick-span]
    notes: "Mode-marker block opens the reply; remainder is two short bullets with backticked symbols."

  - id: telegraph-07
    category: deliverable
    language: en
    prompt: "Compare three memory-condensation approaches (lossless gzip, semantic summarisation, telegraph-speak) in a three-column Markdown table: `approach | strength | weakness`. One row each. Add one sentence framing the trade-off space above the table."
    expected_carve_out_pct: 0.62
    expected_carve_out_kinds: [table, backtick-span]
    notes: "Markdown table is the deliverable carve-out; framing prose is minimal."

  - id: telegraph-08
    category: pure-prose
    language: en
    prompt: "In one paragraph (no lists, no code blocks, no headings, no inline backticks), explain why deterministic carve-outs matter for LLM-assisted condensation of agent context."
    expected_carve_out_pct: 0.00
    expected_carve_out_kinds: []
    notes: "Pure natural-language paragraph; carve-out-tax-free upper bound for the condenseor."

  - id: telegraph-09
    category: pure-prose
    language: en
    prompt: "In two sentences, describe how a senior engineer should think about premature optimisation when reviewing a junior's first refactor. Plain prose only — no code, no lists, no headings."
    expected_carve_out_pct: 0.00
    expected_carve_out_kinds: []
    notes: "Pure prose; two sentences."

  - id: telegraph-10
    category: pure-prose
    language: en
    prompt: "Write three sentences on the trade-off between context-window cost and answer fidelity in long-running agent sessions. Plain prose, no formatting marks."
    expected_carve_out_pct: 0.05
    expected_carve_out_kinds: [backtick-span]
    notes: "Pure prose with an unavoidable inline backtick or two if the model cites a term; ≤5% carve-out share."
