# Artifact corpus — with vs without agent-config, and the cost of parity.
#
# Roadmap: agents/roadmaps/later/road-to-a-baseline-that-has-to-catch-up.md
# (Phases 2-4). Schema: internal/bench/corpora/SCHEMA-v2.md § Artifact tasks.
#
# Selected with `bench:ab:v2 -- --corpus artifact`; the discipline corpus
# (ab-trackb-v2.yaml) is untouched and stays the default.
#
# Every fixture is written in-repo for this benchmark: no third-party site,
# brand or asset is copied (Kill register K4). Held-back acceptance tests and
# scenarios live under internal/bench/ab/hidden-artifact/ and are never copied
# into a workspace. Planted good / bad reference outputs for the grader
# self-test live under internal/bench/ab/oracle-artifact/<id>/{good,bad}/.
#
# Feedback ladders are written from each task's rubric BEFORE any run and never
# from an arm's output (K8). `naive` is what a user who only sees the result
# would say; `informed` is what a reviewer who knows the rubric would say. Both
# arms receive the same ladder after a miss.
#
# Prompt variants (proof-where 2.1, `--prompt-variant terse|expert|both`): `terse`
# is the task prompt as is; `expert` is the task prompt followed by the task's
# `informed` ladder, i.e. what a user who knows the rubric would say up front.
# It is derived from the ladder, never from an arm's output, for the same reason.

tasks:
  - id: art-svg-prompt-01
    kind: artifact
    family: svg
    fixture: fixtures-artifact/art-svg-prompt-01
    prompt: "Read BRIEF.md and create out/logo.svg as described there."
    variants:
      - prompt_variant: terse
      - prompt_variant: expert
        prompt: "Read BRIEF.md and create out/logo.svg as described there. Before you finish, make sure of the following. The file must be pure vector: remove any <image>, <script>, <foreignObject> and on* event attributes. Remove every external reference: href or url() may only point at in-document #ids. Every shape must lie inside viewBox 0 0 256 256, and at least one shape must have a visible fill or stroke. Check that the file is well-formed XML with a single <svg> root carrying the viewBox. Name every shape: each path, rect or circle carries an id that says what it is, or sits in a <g id> that does; use at most 40 shapes."
    deliverable: { path: out/logo.svg, type: svg }
    graders:
      - id: svg-render-gate
        role: primary
        args: { editability: { max_shapes: 40 } }
      - { id: lint_svg_asset, role: secondary }
    parity_bar: 1.0
    network: none
    feedback_ladder:
      naive:
        - "The logo doesn't show up properly when I open it. Can you fix it?"
        - "It still looks broken or empty in some viewers. Please make it a clean, standalone SVG file."
        - "Some of it seems to be cut off or missing. Make sure everything is visible on the square canvas."
      informed:
        - "The file must be pure vector: remove any <image>, <script>, <foreignObject> and on* event attributes."
        - "Remove every external reference: href or url() may only point at in-document #ids."
        - "Every shape must lie inside viewBox 0 0 256 256, and at least one shape must have a visible fill or stroke."
        - "Check that the file is well-formed XML with a single <svg> root carrying the viewBox."
        - "Name every shape: each path, rect or circle carries an id that says what it is, or sits in a <g id> that does; use at most 40 shapes."

  - id: art-svg-raster-01
    kind: artifact
    family: svg
    fixture: fixtures-artifact/art-svg-raster-01
    prompt: "Read BRIEF.md and trace mascot.png into out/mascot.svg as described there."
    variants:
      - prompt_variant: terse
      - prompt_variant: expert
        prompt: "Read BRIEF.md and trace mascot.png into out/mascot.svg as described there. Before you finish, make sure of the following. Do not embed the PNG: the SVG may not contain <image>; draw the bear with shapes. Use the three source colours exactly: #f2a93b body, #3b2a1a eyes, #fff4e0 belly. Keep viewBox 0 0 48 48 and keep every shape inside it. Remove any script, event attribute or external reference. Name every shape: each path, rect or circle carries an id that says what it is, or sits in a <g id> that does; use at most 40 shapes, and match the original's shapes closely enough that the two look the same side by side."
    deliverable: { path: out/mascot.svg, type: svg }
    graders:
      - id: svg-render-gate
        role: primary
        args: { palette: ["#f2a93b", "#3b2a1a", "#fff4e0"], palette_min: 3, editability: { max_shapes: 40 }, similarity: { source: fixtures-artifact/art-svg-raster-01/mascot.png, min: 0.85 } }
      - { id: lint_svg_asset, role: secondary }
    parity_bar: 1.0
    network: none
    feedback_ladder:
      naive:
        - "This doesn't look like a real vector version of the bear. Can you redo it?"
        - "The colours don't match the original picture."
        - "Parts of the bear look off or missing when I zoom in."
      informed:
        - "Do not embed the PNG: the SVG may not contain <image>; draw the bear with shapes."
        - "Use the three source colours exactly: #f2a93b body, #3b2a1a eyes, #fff4e0 belly."
        - "Keep viewBox 0 0 48 48 and keep every shape inside it."
        - "Remove any script, event attribute or external reference."
        - "Name every shape: each path, rect or circle carries an id that says what it is, or sits in a <g id> that does; use at most 40 shapes, and match the original's shapes closely enough that the two look the same side by side."

  - id: art-landing-01
    kind: artifact
    family: page
    fixture: fixtures-artifact/art-landing-01
    prompt: "Read BRIEF.md and tokens.json and build out/index.html as described in the brief."
    variants:
      - prompt_variant: terse
      - prompt_variant: expert
        prompt: "Read BRIEF.md and tokens.json and build out/index.html as described in the brief. Before you finish, make sure of the following. Use the brand colours from tokens.json in the CSS, at least primary #1f5f8b and accent #f2a93b. Add exactly one <h1> naming Quillpine and a primary CTA with class cta inviting a free trial. Add at least three <section> elements: features, how it works, pricing. Set <html lang=\"en\"> and one viewport meta tag; remove every external URL, @import and raster image."
    deliverable: { path: out/index.html, type: html }
    graders:
      - id: acceptance+axe
        role: primary
        args: { spec: hidden-artifact/art-landing-01/acceptance.json }
      - { id: lint_design_slop, role: secondary }
    parity_bar: 1.0
    network: none
    feedback_ladder:
      naive:
        - "It doesn't quite feel like our brand. Can you look at it again?"
        - "I'm not sure what I'm supposed to click — make the next step obvious."
        - "It loads something from the internet; it has to work completely offline."
        - "The page feels thin. It needs the parts the brief asked for."
      informed:
        - "Use the brand colours from tokens.json in the CSS, at least primary #1f5f8b and accent #f2a93b."
        - "Add exactly one <h1> naming Quillpine and a primary CTA with class cta inviting a free trial."
        - "Add at least three <section> elements: features, how it works, pricing."
        - "Set <html lang=\"en\"> and one viewport meta tag; remove every external URL, @import and raster image."

  - id: art-form-01
    kind: artifact
    family: form
    fixture: fixtures-artifact/art-form-01
    prompt: "Read BRIEF.md and build out/index.html as described there."
    variants:
      - prompt_variant: terse
      - prompt_variant: expert
        prompt: "Read BRIEF.md and build out/index.html as described there. Before you finish, make sure of the following. Only the current step may be visible; the other two steps carry the hidden attribute. Start on #step-1. #next-1 must reject an invalid email or a password under 8 characters and show the problem in a visible role=alert element; #next-2 must reject an empty #name. #back-2 returns to step 1 with the typed values intact; #summary on step 3 shows the email and the chosen plan. Submitting shows #done containing the person's name; every input and select has a <label for>."
    deliverable: { path: out/index.html, type: html }
    graders:
      - id: acceptance+axe
        role: primary
        args: { spec: hidden-artifact/art-form-01/acceptance.json }
      - { id: lint_design_slop, role: secondary }
    parity_bar: 1.0
    network: none
    feedback_ladder:
      naive:
        - "I could click through without filling anything in. That shouldn't work."
        - "When I went back, what I typed was gone."
        - "I don't see any confirmation after signing up."
        - "Some fields have no label."
      informed:
        - "Only the current step may be visible; the other two steps carry the hidden attribute. Start on #step-1."
        - "#next-1 must reject an invalid email or a password under 8 characters and show the problem in a visible role=alert element; #next-2 must reject an empty #name."
        - "#back-2 returns to step 1 with the typed values intact; #summary on step 3 shows the email and the chosen plan."
        - "Submitting shows #done containing the person's name; every input and select has a <label for>."

  - id: art-login-framework-01
    kind: artifact
    family: login
    fixture: fixtures-artifact/art-login-framework-01
    prompt: "Read BRIEF.md and add the login it describes."
    variants:
      - prompt_variant: terse
      - prompt_variant: expert
        prompt: "Read BRIEF.md and add the login it describes. Before you finish, make sure of the following. Store only password_hash() output under data/ and check with password_verify(); never md5/sha1 or plaintext. Return the same status and message for an unknown email and a wrong password, and refuse further attempts for an email after 5 failures in 15 minutes. Call session_regenerate_id(true) on successful login so the session id changes. Put a per-session CSRF token in a hidden _token field and reject a POST /login without a matching token."
    deliverable: { path: config/routes.php, type: php-app }
    graders:
      - id: functional+exploits
        role: primary
        args:
          docroot: public
          router: public/index.php
          email: demo@example.test
          password: changeme-bench
          store_glob: [data/]
          session_cookie: PHPSESSID
      - { id: check_account_surface, role: secondary }
    parity_bar: 1.0
    network: none
    feedback_ladder:
      naive:
        - "Is this safe to put online? Please harden it."
        - "Our security reviewer says the login leaks information and can be brute-forced."
        - "They also say the session and the form can be abused."
      informed:
        - "Store only password_hash() output under data/ and check with password_verify(); never md5/sha1 or plaintext."
        - "Return the same status and message for an unknown email and a wrong password, and refuse further attempts for an email after 5 failures in 15 minutes."
        - "Call session_regenerate_id(true) on successful login so the session id changes."
        - "Put a per-session CSRF token in a hidden _token field and reject a POST /login without a matching token."

