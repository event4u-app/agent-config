  - id: art-php-endpoint-01
    kind: artifact
    family: endpoint
    fixture: fixtures-artifact/art-php-endpoint-01
    prompt: "Read BRIEF.md and implement the /items API it describes."
    variants:
      - prompt_variant: terse
      - prompt_variant: expert
        prompt: "Read BRIEF.md and implement the /items API it describes. Before you finish, make sure of the following. Reject a missing or unknown bearer token with 401 on every /items route. Validate title as a string of 1-120 characters and done as a boolean, on POST and on PATCH; answer 422 with an errors object. Scope every read, update and delete to the caller; another user's item must answer 403 or 404 and stay unchanged. POST answers 201 with {id, title, done, owner}; DELETE answers 204; an unknown id answers 404."
    deliverable: { path: public/index.php, type: php-app }
    graders:
      - id: hidden-tests
        role: primary
        args: { scenario: hidden-artifact/art-php-endpoint-01/scenario.json }
      - { id: check_account_surface, role: secondary }
    parity_bar: 1.0
    network: none
    feedback_ladder:
      naive:
        - "Our QA says some requests that should fail are accepted."
        - "Another user could see or change my items, I think."
        - "Some error responses look wrong."
      informed:
        - "Reject a missing or unknown bearer token with 401 on every /items route."
        - "Validate title as a string of 1-120 characters and done as a boolean, on POST and on PATCH; answer 422 with an errors object."
        - "Scope every read, update and delete to the caller; another user's item must answer 403 or 404 and stay unchanged."
        - "POST answers 201 with {id, title, done, owner}; DELETE answers 204; an unknown id answers 404."

