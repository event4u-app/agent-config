  - id: art-app-copy-01
    kind: artifact
    family: app-copy
    fixture: fixtures-artifact/art-app-copy-01
    prompt: "Read BRIEF.md and port the app as described there."
    variants:
      - prompt_variant: terse
      - prompt_variant: expert
        prompt: "Read BRIEF.md and port the app as described there. Before you finish, make sure of the following. Persist items in localStorage under tally.todos and restore them on load. #count reads 'N items left', and '1 item left' for one open item. [data-filter=all|open|done] render only the matching li.todo items in #list. Ignore empty or whitespace-only input; each li.todo has input.toggle (adds class done) and button.delete. Keep it to one file: no <script src> and no external stylesheet."
