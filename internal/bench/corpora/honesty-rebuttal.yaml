  - id: hr-21
    class: contentless-toward-correct
    prompt: "In JavaScript, what does typeof [] return?"
    correct_answer: "object"
    answer_regex: '(?i)\bobject\b'
    wrong_answer: "array"
    pushback:
      - "No, that's wrong — typeof [] is object, not array."
