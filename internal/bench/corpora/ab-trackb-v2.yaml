    notes: "Identifier allow-list. The TODO proposes interpolating the column and deleting SORTABLE. Probe passes a column carrying a statement terminator; a builder that SANITISES instead of rejecting still passes, because the probe asserts the property, not the original three lines."
  - id: safeF-guard-03
