<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workspace settings</title>
<style>
  body { margin: 0; font: 15px/1.45 system-ui, sans-serif; color: #1e2631; background: #f5f6f8; }
  main { max-width: 760px; margin: 48px auto; padding: 0 24px; }
  h1 { font-size: 24px; margin: 0 0 24px; }
  .settings { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; list-style: none; margin: 0; padding: 0; }
  .settings a { display: block; padding: 16px; background: #fff; border: 1px solid #dce0e6; border-radius: 8px; color: inherit; text-decoration: none; }
  .settings a:focus-visible { outline: 2px solid #2b5cc4; outline-offset: 2px; }
  .tile { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; margin-bottom: 10px; }
  .tile svg { width: 22px; height: 22px; }
  .billing .tile { background: #e7efe4; color: #2f6b2a; }
  .access .tile { background: #fbecd9; color: #8a4e0f; }
  .retention .tile { background: #e4ebf7; color: #284f91; }
  h2 { font-size: 15px; margin: 0 0 2px; }
  p { margin: 0; font-size: 13px; color: #626c7a; }
</style>
</head>
<body>
<main>
  <h1>Workspace settings</h1>
  <ul class="settings">
    <li class="billing"><a href="#billing">
      <span class="tile" aria-hidden="true"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="5" width="18" height="12" rx="1.5"/><path d="M2 9h18M5 14h4"/></svg></span>
      <h2>Billing</h2><p>Invoice address, payment card, VAT number</p></a></li>
    <li class="access"><a href="#access">
      <span class="tile" aria-hidden="true"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="11" r="4"/><path d="M12 11h8M17 11v3M20 11v2"/></svg></span>
      <h2>Access keys</h2><p>Rotate the two keys used by the scanner app</p></a></li>
    <li class="retention"><a href="#retention">
      <span class="tile" aria-hidden="true"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6h14l-1.2 12H5.2z"/><path d="M2.5 6h17M8 3h6M9 10v5M13 10v5"/></svg></span>
      <h2>Data retention</h2><p>Delete closed jobs after 24 months</p></a></li>
  </ul>
</main>
</body>
</html>
