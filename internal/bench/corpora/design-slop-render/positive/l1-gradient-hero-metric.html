<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dashboard</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; }
  .hero { padding: 48px; color: #fff; background-image: linear-gradient(135deg, #4f46e5, #9333ea); }
  .big { font-size: 72px; font-weight: 700; margin: 0; }
  .label { font-size: 14px; opacity: 0.8; }
  .stats { display: flex; gap: 48px; margin-top: 32px; }
  .stat { font-size: 28px; font-weight: 600; }
</style>
</head>
<body>
  <section class="hero">
    <p class="big">$48,210</p>
    <span class="label">Monthly recurring revenue</span>
    <div class="stats">
      <div class="stat">1,204</div>
      <div class="stat">98.4%</div>
      <div class="stat">312</div>
    </div>
  </section>
</body>
</html>
