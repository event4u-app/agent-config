# UI-triviality routing golden corpus — pre-registered.
#
# PRE-REGISTERED THRESHOLD (frozen BEFORE any classifier change):
#   trivial-lane recall >= 0.80 — the share of `label: trivial` tasks that the
#   work-engine intent classifier routes to the `ui-trivial` directive set.
#   The eval runner (`src/scripts/eval_ui_triviality.ts`) reads this corpus
#   READ-ONLY and reports the number; it never edits labels and never touches
#   the classifier. Labels are frozen once council-confirmed — the corpus is
#   never tuned to make the classifier pass.
#
# GROUND TRUTH for labels — the ui-trivial lane's own written criteria:
#   - src/agent-src/templates/scripts/work_engine/directives/ui_trivial/apply.ts:
#     MAX_FILES = 1, MAX_LINES_CHANGED = 5, no new component, no new state,
#     no new dependency.
#   - src/rules/ui-audit-gate.md allow-list: directive_set == "ui-trivial" AND
#     <= 1 file, <= 5 changed lines, no new component, no new state.
#   A task is `trivial` iff a competent developer would satisfy it within that
#   envelope AND it is a frontend/UI task at all. Labels reflect the TASK's
#   true triviality per these criteria — never the classifier's own heuristics
#   (several trivial tasks are deliberately longer than the classifier's
#   14-word heuristic window; the label ignores that).
#
# LABEL PROVENANCE (disclosed — integrity note):
#   Labels are COUNCIL-DERIVED, not human-labelled. This amends the roadmap's
#   "human-labelled" wording per the council disposition of this run
#   (Q2 verdict B1 in agents/runtime/council/responses, precedent PR #885 —
#   token-quality-golden), disclosed here and in the PR description. Labels
#   are cheap for a human to re-label: one YAML field per task.
#   - Council members: anthropic/claude-sonnet-4-5 + openai/gpt-4o.
#   - Rule-grounded: each member was given the criteria above verbatim and
#     asked to confirm or override the drafter's proposed label per task,
#     grounding every label in the criteria — never in what the current
#     classifier would say.
#   - Tiebreaker on member disagreement: label `non-trivial` (conservative —
#     routes to the full audit chain).
#   - Date: 2026-08-04.
#   - Parse status and flip count vs the drafter's proposal: recorded below
#     after the council run (PROVENANCE RESULT block).
#
# PROVENANCE RESULT (filled after the council run on 2026-08-04):
#   - anthropic/claude-sonnet-4-5: PARSEABLE — returned the full 40-entry JSON
#     array; adopted as the label + criterion source.
#   - openai/gpt-4o: NOT PARSEABLE as a full array — its final round is a
#     prose peer review without the required JSON. It states explicit
#     positions on two tasks only: uit-006 (non-trivial — agrees with the
#     override) and uit-016 (trivial — agrees). No usable position on the
#     other 38 tasks; per the disclosed fallback, the parseable member's
#     labels stand, corroborated by gpt-4o where it spoke.
#   - Labels flipped vs draft: 1 of 40 — uit-006 trivial -> non-trivial
#     (both members converge on the flip; consistent with the tiebreaker,
#     which would also yield non-trivial).
#   - Council spend: $0.068034 actual (estimate $0.4205), 2 members, 2 rounds.
#   - label_criterion strings: taken from the anthropic member's per-task
#     reasoning, prefixed with the envelope verdict.
#
# COUNCIL INVOCATION PROMPT (verbatim): the full question file lives at
#   agents/runtime/council/questions/ui-triviality-labels.md and was submitted
#   via:
#     npx tsx src/scripts/council_cli.ts run \
#       agents/runtime/council/questions/ui-triviality-labels.md \
#       --input-mode prompt --prompt-mode design --invocation user_explicit \
#       --output agents/runtime/council/responses/ui-triviality-labels.json \
#       --confirm
#
# REDACTION: no real names, customer/product identifiers, or local paths —
# generic app nouns only (dashboard, checkout, profile page). Tasks sourced
# from the repo's own golden recipes cite the recipe id in `source:`.
version: 1
