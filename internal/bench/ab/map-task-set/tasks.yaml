# Map task set T — planted in-repo change tasks with a hidden check each.
#
# Every task is a small fixture repo (repo/) plus a reference change (solution/,
# plus reference_delete). The prompt names one place; the affected set lists
# every place a correct change touches; hidden_check is evaluated from OUTSIDE the
# agent's working copy, so the agent never sees it. `primary` is the place the
# prompt names: applying only its part of the reference change is the naive
# change, and the hidden check must fail on it.
#
# Invariants, asserted by tests/scripts/bench_map_task_set.test.ts:
#   - the hidden check fails on the unmodified fixture,
#   - it fails on the naive change,
#   - it passes on the reference change.
#
# Runner: src/scripts/bench_map_task_set.ts. Change a task here and in its
# directory together.
version: 1
tasks:
  - id: code-rename-function
    area: code
    fixture: map-task-set/code-rename-function/repo
    reference: map-task-set/code-rename-function/solution
    primary:
      - src/billing.js
    prompt: Rename the function `calcTotal` in src/billing.js to `computeInvoiceTotal`. Behaviour stays the same.
    trap: src/dispatch.js reaches the function by a string key, which no import graph sees.
    affected:
      - kind: file
        id: src/billing.js
      - kind: file
        id: src/checkout.js
      - kind: file
        id: src/report.js
      - kind: file
        id: src/dispatch.js
    hidden_check:
      - path: src/billing.js
        match: export function computeInvoiceTotal\(
        protects: src/billing.js
      - path: src/checkout.js
        match: computeInvoiceTotal\(cart\.items\)
        no_match: \bcalcTotal\b
        protects: src/checkout.js
      - path: src/report.js
        match: billing\.computeInvoiceTotal\(
        protects: src/report.js
      - path: src/dispatch.js
        match: "'computeInvoiceTotal'"
        no_match: "'calcTotal'"
        protects: src/dispatch.js
  - id: code-add-parameter
    area: code
    fixture: map-task-set/code-add-parameter/repo
    reference: map-task-set/code-add-parameter/solution
    primary:
      - src/money.ts
    prompt: "Change `formatPrice` in src/money.ts so it takes a required second parameter `currency: string` and returns the amount followed by a space and the currency code, for example `12.50 EUR`."
    trap: src/admin/export.ts calls through a namespace import.
    affected:
      - kind: file
        id: src/money.ts
      - kind: file
        id: src/cart.ts
      - kind: file
        id: src/email.ts
      - kind: file
        id: src/admin/export.ts
    hidden_check:
      - path: src/money.ts
        match: "formatPrice\\(amount: number, currency: string\\)"
        protects: src/money.ts
      - path: src/cart.ts
        match: formatPrice\(\s*[\w.]+\s*,\s*[\w.]+\s*\)
        no_match: formatPrice\(\s*[\w.]+\s*\)
        protects: src/cart.ts
      - path: src/email.ts
        match: formatPrice\(\s*[\w.]+\s*,\s*[\w.]+\s*\)
