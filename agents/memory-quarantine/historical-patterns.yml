    body: "Why `task ci` can't go fully green locally in this repo (tools:[]
      disables .claude/skills that several checks expect). In
      `event4u/agent-config`, `agents/.agent-tools.yml` is set to `tools: []`
      (untracked file) to avoid duplicating the globally installed `~/.claude`.
      Consequence: `task generate-tools` is a local no-op, so `.claude/skills/`
