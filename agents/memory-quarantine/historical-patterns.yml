    key: typecheck use task not bare tsc
    body: 'Verify types with `task typecheck-ts` (npm run typecheck), never bare
      `npx tsc --noEmit` — the latter misses test files. The CI "Static Checks"
      typecheck runs `npm run typecheck` (= `task typecheck-ts`, `tsc --noEmit`
      over the whole-tree `tsconfig.json` which INCLUDES `tests/`). A bare `npx
      tsc --noEmit` in a worktree resolves a different/default config that
      EXCLUDES tests, so it reports clean while CI fails. Combined with
      `noUncheckedIndexedAccess: true`, this bites test files that index
      `Record<string, T>` returns: `obj.field` becomes `T | undefined` and fails
      TS2345 when passed to `.toBeLes'
