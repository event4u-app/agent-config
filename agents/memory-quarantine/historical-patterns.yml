    key: gh pr diff patch per commit series
    body: 'check_no_new_legacy_path (Sync-consistency CI) reads `gh pr diff --patch`
      = per-commit series, so an add-then-fix across two commits still fails —
      needs clean history. The `check-no-new-legacy-path` guard inside the
      **Sync + Generate Tools Consistency** CI workflow pipes `gh pr diff "<n>"
      --patch` into `check_no_new_legacy_path.py --stdin`. `gh pr diff --patch`
      is the **per-commit patch series** (format-patch style), NOT a net tree
      diff. The checker counts every `+` line containing
      `.agent-src.uncondensed/` and does **not** net `+`/`-` pairs. Consequence:
      if you add a forbidden `.agent-src.unc'
