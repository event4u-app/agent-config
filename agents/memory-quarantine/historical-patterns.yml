    key: deleting a command downstream surface
    body: "Full downstream surface when deleting/merging a command in agent-config
      (dist condensation, plugin symlinks, discovery, marketplace). Deleting or
      merging a command in this package (e.g. folding `fix:pr-bot-comments` +
      `fix:pr-developer-comments` into `fix:pr-comments`, 2026-06-13) has a
      **larger downstream surface than `task sync` regenerates**: - **`task
      sync` does NOT re-condense changed commands** — it propagates deletions to
      `dist/agent-src/commands/` but leaves a *modified* command's dist copy
      stale. `condense.sh --changed` only **lists** changed files; condensation
      is the `/condense` age"
