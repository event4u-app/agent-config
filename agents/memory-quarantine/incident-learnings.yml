    key: fresh worktree gate quirks
    body: "agent-config fresh worktrees — which local gates false-fail (pre-commit
      .augment lookup, augment-budget needs --project-augment) and the recurring
      stale-condensation-hash drift on main. Working in fresh `git worktree`s
      off main in the agent-config repo (the standard pattern for parallel issue
      PRs), three environment quirks cost time (learned 2026-06-09, 7-issue PR
      run): 1. **Pre-commit hook false-fails on roadmap touches.** The hook
      shells to `python3 .augment/scripts/update_roadmap_progress.py`, but
      `.augment/` is a gitignored local projection that does not exist in a
      fresh worktree. Fix: reg"
