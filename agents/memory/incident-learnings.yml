    key: py2ts parallel snapshot clobber
    body: "Parallel subagents capturing into the shared parity-snapshot tree clobber
      each other's UNCOMMITTED goldens — commit between batches or capture
      serially. In the py2ts teardown, parity-snapshot goldens live in one
      shared tree `tests/_lib/__parity_snapshots__/`. Running rig-conversion
      subagents **in parallel** (each captures with `PY2TS_CAPTURE=1` and some
      run `git checkout -- tests/_lib/__parity_snapshots__/` or `git rm` to tidy
      orphan buckets) **clobbered the earlier wave's UNCOMMITTED snapshots** —
      the first-wave rigs (budget_guard etc.) went from green to `parity_oracle:
      no snapshot ... Refus"
  - id: roadmap-archival-vs-inbound-refs
    status: active
    confidence: high
    source:
      - maintainer-memory-index
    owner: maintainer
    last_validated: 2026-07-09
    review_after_days: 365
    key: roadmap archival vs inbound refs
    body: "Completing a roadmap to 100% forces archival (pre-commit hook), which
      breaks inbound ADR/report refs — keep it 1 criterion shy until the closing
      PR merges. The pre-commit hook runs `update_roadmap_progress.py --check`,
      which exits **1** when a roadmap reaches `count_open == 0` (100%) but is
      still in `agents/roadmaps/` (not `archive/`). So a 100% roadmap **cannot
      be committed** without `git mv`-ing it to `agents/roadmaps/archive/`. But
      archiving breaks inbound references: ADRs (`docs/decisions/ADR-0xx`),
      reports (`agents/reports/`), and sibling roadmaps all link the roadmap at
      its active path. "
