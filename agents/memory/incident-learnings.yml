    key: commit relocates into per branch worktree
    body: In agent-config, committing a feature branch in the MAIN checkout triggers
      automation that relocates the work into a per-branch worktree and resets
      the main checkout back to main — never --amend in the main checkout. This
      repo runs a commit pipeline that, when an agent commits on a feature
