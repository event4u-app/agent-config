  - id: git-stash-probe-conflict-hazard
    status: active
    confidence: high
    source:
      - maintainer-memory-index
    owner: maintainer
    last_validated: 2026-07-09
    review_after_days: 365
    key: git stash probe conflict hazard
    body: "Never use git stash as a read-only probe in this shared working tree — it
      sweeps up concurrent sessions' dirty files and a suppressed pop-conflict
      leaks markers. Using `git stash -u` + `git stash pop >/dev/null 2>&1` as a
      throwaway \"is this lint failure pre-existing on clean main?\" probe
      caused a silent conflict (2026-06-15, during road-to-competitive-borrow).
      `git stash -u` is whole-working-tree and indiscriminate: it swept up stale
      generated files (5.10.1-era `src/domains/**/pack.yaml`, `README.md`) that
      a concurrent session had left dirty; the `pop` then conflicted against the
      current (6.1."
