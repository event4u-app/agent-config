  - id: adr-number-collision-on-parallel-prs
    status: active
    confidence: high
    source:
      - maintainer-memory-index
    owner: maintainer
    last_validated: 2026-07-09
    review_after_days: 365
    key: adr number collision on parallel prs
    body: "Two open PRs both claim the next ADR-NNN; first merge wins, second must
      renumber — including the adr: frontmatter field, not just the filename.
      When two feature PRs are open at once and each adds the next sequential
      ADR (both grab `ADR-067`, say), the first to merge wins the number. The
      second PR then **conflicts in `docs/decisions/INDEX.md`** and must
      renumber. Renumbering is THREE edits, not one — missing any leaves CI red:
      1. `git mv docs/decisions/ADR-067-foo.md docs/decisions/ADR-068-foo.md` 2.
      **The `adr:` frontmatter field** inside the file (`adr: 067` → `adr:
      068`). `src/scripts/adr/re"
  - id: agent-config-hooks-need-global-binary
    status: active
    confidence: high
    source:
      - maintainer-memory-index
    owner: maintainer
    last_validated: 2026-07-09
    review_after_days: 365
    key: agent config hooks need global binary
    body: agent-config Claude-plugin hooks resolve the GLOBAL agent-config binary on
      PATH; removing the global install silently breaks roadmap-progress + all
      PostToolUse hooks. In `@event4u/agent-config`, the Claude marketplace
      plugin's hooks (`hooks/hooks.json`, all 5 events) resolve
      `$CLAUDE_PROJECT_DIR/agent-config` (in-project wrapper) **then** fall back
      to a bare `agent-config` on PATH (the **global** install). There is **no
      npx fallback** in the hook command. If neither resolves → exit 127 → every
      concern (roadmap-progress dashboard regen, context-hygiene,
      verify-before-complete, …) silently no-op
