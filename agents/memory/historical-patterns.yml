    key: roadmap dashboard phase heading gotcha
    body: "A ready roadmap is invisible on the dashboard if it has no `## Phase N`
      heading — the parser skips it entirely. `update_roadmap_progress.py`
      (`parse_roadmap`) requires at least one `## Phase N — …` heading
      (`PHASE_RE`). If a roadmap's checkbox section is under any other heading
      (e.g. `## Deferred-with-trigger work`), `parse_roadmap` returns `None` and
      the roadmap is **dropped from the dashboard entirely** — even when
      `status: ready` and it has checkboxes. This is distinct from `status:
      draft` exclusion (`is_draft`) and from `archive/`/`skipped/`/`later/` dir
      exclusion. A `ready` roadmap can be"
