# skills-provenance — externally-derived skill index (link-encrypted)
#
# Lists skills in this package whose body wraps, dispatches into, or is
# materially derived from a third-party tool, repository, or methodology.
# Source-identifying fields are ENCRYPTED so the committed tree never reveals
# which external packages were used; only the maintainer holding the key can
# read them.
#
# Schema (per <skill-name>):
#   author_enc:     ENC1 token  → upstream maintainer / org
#   source_enc:     ENC1 token  → canonical repo or product URL
#   pinned_to_enc:  ENC1 token  → upstream tag / sha at last verification
#   notes_enc:      ENC1 token  → free-text context (may name the source)
#   license:        <SPDX identifier>            (plaintext — source-free)
#   license_clean:  <true|false>                 (plaintext)
#   kind:           <wrapper|methodology|fork|inspired_by>  (plaintext)
#   last_verified:  <YYYY-MM-DD>                  (plaintext)
#
# Decrypt a value:
#   python3 src/scripts/_lib/link_crypto.py decrypt --value "ENC1:..."
# Encrypt a new value when adding an entry:
#   python3 src/scripts/_lib/link_crypto.py encrypt --value "https://..."
#
# Key (NEVER committed): secrets.link_encryption_key in .agent-settings.yml.
# Resolution: project .agent-settings.yml first, then user-global
#   ~/.event4u/agent-config/agent-settings.yml. Keep the key in your
# user-global settings so this file stays recoverable across clones.
#
# Add an entry whenever a new skill ships that materially leans on an external
# project; re-verify on upstream breaking minors and bump last_verified +
# pinned_to_enc together. Drop the entry when the skill is removed or rewritten
# from scratch with no upstream lineage.

