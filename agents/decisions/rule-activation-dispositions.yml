# CLOSED (2026-08-10): the migration this file drove is complete — kept as the disposition record, never re-opened for new rows.
# Live consumers: none — grep over src/ and tests/ finds no reader; the only references are roadmap prose (road-to-feedback-9-29 + the archived road-to-rule-delivery-integrity).
# New dispositions belong in the emitting rule's own frontmatter and the rule-migrations ledger, not here.
# Rule activation dispositions — the keyword/phrase-only residue
#
# Produced by P3.2 of `road-to-rule-delivery-integrity`. One recorded
# disposition per non-kernel rule that has NO path-shaped trigger, i.e. every
# rule the Claude Code emitter (P3.1) writes with no `paths:` key and which
# therefore still loads unconditionally at project scope.
#
# The residue is MEASURED, not estimated: it is the set `.claude/rules/*.md`
# emitted with no frontmatter, minus the 9 kernel rules (`type: "always"`).
# Reproduce it with `task generate-tools` and:
#
#   for f in .claude/rules/*.md; do b=$(basename "$f");
#     head -1 "$f" | grep -q '^---$' && continue
#     grep -q '^type: "always"' "src/rules/$b" && continue
#     echo "$b"; done
#
# Measured 2026-08-09: 110 rules emitted · 25 carry `paths:` · 85 unconditional
# · 9 of those are kernel → residue = 76. Every one has a row below.
#
# ── Vocabulary, and one documented deviation ─────────────────────────
#
# The step specifies three dispositions: `digest` (a one-to-three-line
# obligation in a single always-on digest, body demoted to `type: manual`),
# `skill` (body behind a SKILL.md), `drop`. A fourth — `keep` — is recorded
# here, and the reason is a finding rather than a convenience:
#
#   38 of the 76 are classed `stay` by
#   `docs/guidelines/agent-infra/rule-body-migration-inventory.md`, whose
#   criterion is that the non-Iron-Law body IS the enforcement surface — a
#   table, a literal-string marker set, a short numbered check — that does not
#   shrink usefully by relocating. Demoting such a body to `type: manual` would
#   remove the enforcement surface from context, which is the exact defect this
#   roadmap exists to repair. `digest` would be a lie about what happened to
#   them, `skill` is barred (below), and `drop` is false.
#
# `keep` therefore means: stays always-on and monolithic, deliberately, with a
# named reason. It is not a deferral and not a pending item.
#
# ── Why `skill` has zero rows ────────────────────────────────────────
#
# Not an omission — a direct consequence of Phase 2. P2.1 measured that 5 of 8
# sampled catalogue entries reached the model with NO description while 414/414
# installed skills carry one on disk: the loss is host-side
# (`agents/evidence/analysis/skill-catalogue-description-delivery.md`). A
# `skill` disposition therefore risks turning an always-loaded obligation into
# an unreachable one, which is why P2.1's own consequence note reads "`digest`
# becomes the default for anything load-bearing". Assigning `skill` rows to
# satisfy a vocabulary would be Goodharting the table against the evidence that
# produced it.
#
# ── Why `drop` has zero rows ─────────────────────────────────────────
#
# No rule in the residue was found to carry no live obligation. The closest
# candidates are the 7 `tier: "mechanical-already"` rules, where a script
# enforces and the body documents — but ADR-004 already adjudicated those and
# recorded them as `stay`, and a rule whose body is the documentation of a live
# gate is not dead. Zero is the measured answer, reported as such.
#
# ── What this file is NOT ────────────────────────────────────────────
#
# It records dispositions; it does not implement them. No body is demoted to
# `type: manual` by this file, and no digest exists yet. Building the always-on
# digest and demoting the 30 `digest` bodies is downstream work, gated on the
# digest surface existing — which nothing in this roadmap creates.
#
# Fields: `body_class` / `class_source` carry the provenance of the judgement,
# so a reader can tell an inventory classification from one made here.

