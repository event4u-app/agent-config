# Seed preset — fast
# Schema: docs/contracts/config-presets.md
preset:
  id: fast
  autonomy:
    default: on
    trivial_suppress: true
  confidence:
    min_band: low
    require_evidence: false
  risk:
    block_on:
      - security
      - prod_data
    ask_on:
      - bulk_delete
  council:
    auto_consult: false
    cap_per_consult_usd: 0.25
  mcp:
    per_call_max_usd: 0.25
    per_session_max_usd: 5.00
  cost:
    daily_max_usd: 25.00
    weekly_max_usd: 100.00
    monthly_max_usd: 300.00
    enforce: hybrid
  notifications:
    threshold_pct:
      - 75
      - 100
