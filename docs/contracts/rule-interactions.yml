# Rule-Interaction Matrix
# -----------------------
# Machine-readable contract for how the package's rules relate when more
# than one fires on the same turn. Linted by
# `src/scripts/lint_rule_interactions.ts`. Rendered diagram, the coverage
# disclaimer, and the arbitration litmus in
# `docs/contracts/rule-interactions.md`.
#
# THE LITMUS, because it decides `relation` and belongs where rows are added:
#   If one artifact must ARBITRATE between them, they are not complementary.
# A pair needing no arbiter is `complements`, and the row says so. A pair a
# turn cannot satisfy both ways needs a named winner AND a named decision
# domain — which kind of decision it governs, never a global rank.
#
# COVERAGE: this file records arbitration decisions already written down. It
# does NOT claim completeness over undeclared contradictions; a static
# detector for those was measured on this corpus at 67% false positives and
# rejected. The linter enforces one closure property instead: for the rules
# declared below, a precedence claim between two of them must have a row.
#
# Schema:
#   version: integer
#   rules: list of rule slugs that participate in any interaction (each
#     must exist as `src/rules/<slug>.md`). Adding a slug here WIDENS the
#     closure obligation above — that is the intended cost.
#   pairs: list of pairwise interactions
#     - id:        kebab-case stable identifier
#       rules:     [senior, junior] — `senior` wins on conflict
#       relation:  overrides | narrows | defers_to | restates | gates | complements
#       conflict:  one-line trigger that causes both to fire
#       resolution: one paragraph — what the agent does
#       evidence:  list of `file#anchor` citations
#       tests:     optional list of test paths
#
# Anchor pair: `non-destructive-by-default` × five rules per
# `road-to-post-pr29-optimize.md` Phase 2.

version: 1

rules:
  - non-destructive-by-default
  - autonomous-execution
  - scope-control
  - commit-policy
  - ask-when-uncertain
  - verify-before-complete
  - agent-authority
  - language-and-tone
  - direct-answers
  - no-cheap-questions
  - user-interrupt-priority
  - engineering-safety-floor
  - context-hygiene
  - secret-vcs-guard
  - fast-path-marker-visibility
  - role-mode-adherence
  - session-canary
  - token-efficiency
  - downstream-changes
  - minimal-safe-diff
  - active-remediation
  - cross-source-consistency
  - design-fidelity

pairs:

  - id: ndd-x-autonomous-execution
    rules: [non-destructive-by-default, autonomous-execution]
    relation: overrides
    conflict: >-
      Standing autonomy directive ("arbeite selbstständig") is active and
      the next step crosses a Hard-Floor trigger (production-branch merge,
      deploy, push, prod data/infra, whimsical bulk deletion, commit with
      bulk deletion / infra change).
    resolution: >-
      Autonomy never lifts the floor. Stop, surface the action via one
      numbered-options block, wait for explicit user confirmation on
      this turn before proceeding.
    evidence:
      - .agent-src.uncondensed/rules/non-destructive-by-default.md#the-iron-law
      - .agent-src.uncondensed/rules/autonomous-execution.md#hard-floor--see-non-destructive-by-default

  - id: ndd-x-scope-control
    rules: [non-destructive-by-default, scope-control]
    relation: restates
    conflict: >-
      Push, merge, branch creation, PR ops, tag pushes — both rules speak
      to the same git operations.
    resolution: >-
      `scope-control` is the canonical permission gate; the floor restates
      the prod-trunk and deploy-tied subset so the never-overridable layer
      cannot be weakened by future scope-control edits. On any conflict,
      the floor wins.
    evidence:
      - .agent-src.uncondensed/rules/non-destructive-by-default.md#the-iron-law
      - .agent-src.uncondensed/rules/scope-control.md#git-operations--permission-gated
      - .agent-src.uncondensed/rules/scope-control.md#production-infrastructure-bulk-destructive--hard-floor

  - id: ndd-x-commit-policy
    rules: [non-destructive-by-default, commit-policy]
    relation: gates
    conflict: >-
      A commit is otherwise authorized by one of `commit-policy`'s four
      paths (user-this-turn, standing instruction, `/commit*` invocation,
      roadmap pre-scan), but the diff contains bulk deletions or infra
      changes (row 6 of the Hard Floor).
    resolution: >-
      The commit pre-scan triggers regardless of which authorization path
      applies. Surface the diff (paths + counts), confirm this turn,
      then commit. The four exceptions cover *whether* commits happen;
      the floor covers *which diffs* still need a separate confirmation.
    evidence:
      - .agent-src.uncondensed/rules/non-destructive-by-default.md#the-iron-law
      - .agent-src.uncondensed/rules/commit-policy.md#hard-floor-still-applies--bulk-deletions-and-infra-changes

  - id: ndd-x-ask-when-uncertain
    rules: [non-destructive-by-default, ask-when-uncertain]
    relation: complements
    conflict: >-
      A floor trigger fires AND the request is ambiguous (e.g. "delete
      the legacy folder" without a file list).
    resolution: >-
      Both rules require the same response — stop and ask. The floor
      provides the categorical reason (destructive); ask-when-uncertain
      provides the question shape (one numbered-options block, blocking).
      No conflict; both fire harmoniously.
    evidence:
      - .agent-src.uncondensed/rules/non-destructive-by-default.md#failure-modes
      - .agent-src.uncondensed/rules/ask-when-uncertain.md#vague-request-triggers--must-ask

  - id: ndd-x-verify-before-complete
    rules: [non-destructive-by-default, verify-before-complete]
    relation: complements
    conflict: >-
      A floor-crossing action (deploy, prod-data write) was authorized
      and executed; agent is about to claim "done".
    resolution: >-
      Both rules apply independently. Floor is satisfied by user
      confirmation; verify-before-complete is satisfied by fresh
      verification evidence in the same message. Skipping either is a
      rule violation.
    evidence:
      - .agent-src.uncondensed/rules/non-destructive-by-default.md#the-iron-law
      - .agent-src.uncondensed/rules/verify-before-complete.md#the-iron-law

  - id: autonomy-x-scope-control
    rules: [scope-control, autonomous-execution]
    relation: gates
    conflict: >-
      Autonomy is `on` and the next step is a permission-gated git
      operation (push, branch create/delete, PR open, tag push) below
      the floor threshold.
    resolution: >-
      `scope-control`'s permission gate stays in force. Autonomy
      suppresses *trivial* questions only; git-shape decisions are
      blocking. Stop and ask.
    evidence:
      - .agent-src.uncondensed/rules/scope-control.md#git-operations--permission-gated
      - .agent-src.uncondensed/rules/autonomous-execution.md#blocking--still-ask-regardless-of-personalautonomy

  - id: autonomy-x-commit-policy
    rules: [commit-policy, autonomous-execution]
    relation: overrides
    conflict: >-
      Autonomy is `on` and the agent could plausibly "just commit" after
      a green verification step.
    resolution: >-
      `commit-policy` Iron Law forbids both committing AND asking about
      committing unless one of the four exceptions applies. Autonomy
      does not add a fifth exception.
    evidence:
      - .agent-src.uncondensed/rules/commit-policy.md#the-iron-law
      - .agent-src.uncondensed/rules/autonomous-execution.md#commit-policy--see-commit-policy

  - id: authority-x-ndd
    rules: [agent-authority, non-destructive-by-default]
    relation: defers_to
    conflict: >-
      Both rules speak to "may the agent do this autonomously?" — the
      Priority Index points to the Hard Floor as Band 1.
    resolution: >-
      `agent-authority` is a router, never a source of truth. The Hard
      Floor's Iron Law lives verbatim in `non-destructive-by-default`
      and wins every conflict. The index points; it never restates.
    evidence:
      - .agent-src.uncondensed/rules/agent-authority.md#index-rules
      - .agent-src.uncondensed/rules/non-destructive-by-default.md#the-iron-law

  - id: authority-x-scope-control
    rules: [agent-authority, scope-control]
    relation: defers_to
    conflict: >-
      Permission Gate questions (push, branch, PR, architectural change)
      surface during routine work — the index labels Band 2.
    resolution: >-
      The Priority Index routes to `scope-control` for git-shape and
      scope-expansion decisions. Index never narrows or weakens the
      gate; canonical rule wins on any wording divergence.
    evidence:
      - .agent-src.uncondensed/rules/agent-authority.md#index-rules
      - .agent-src.uncondensed/rules/scope-control.md#git-operations--permission-gated

  - id: authority-x-commit-policy
    rules: [agent-authority, commit-policy]
    relation: defers_to
    conflict: >-
      The "about to commit" decision arises — the index labels it Band 3
      (Commit Default = never, with four exceptions).
    resolution: >-
      `commit-policy` Iron Law is canonical. The Priority Index points
      to it; it does not enumerate the four exceptions itself. Future
      edits to commit-policy do not require Index updates unless the
      band ordering changes.
    evidence:
      - .agent-src.uncondensed/rules/agent-authority.md#index-rules
      - .agent-src.uncondensed/rules/commit-policy.md#exceptions--when-committing-is-allowed

  - id: scope-x-commit-policy
    rules: [scope-control, commit-policy]
    relation: narrows
    conflict: >-
      `scope-control` § "Git operations" forbids committing without
      explicit permission as one of several git-op gates; `commit-policy`
      narrows the commit case to a never-ask default with four named
      exceptions.
    resolution: >-
      `commit-policy` is the narrower, canonical rule for the commit
      sub-case. `scope-control` continues to govern push, branch, PR,
      tag operations. On commit specifics, defer to `commit-policy`;
      on other git ops, defer to `scope-control`.
    evidence:
      - .agent-src.uncondensed/rules/scope-control.md#git-operations--permission-gated
      - .agent-src.uncondensed/rules/commit-policy.md#the-iron-law

  - id: ask-x-direct-answers
    rules: [ask-when-uncertain, direct-answers]
    relation: complements
    conflict: >-
      A vague request triggers `ask-when-uncertain` (must ask), but
      `direct-answers` Iron Law 3 (brevity by default) discourages
      overlong replies; could read as tension when the question needs
      framing.
    resolution: >-
      Both rules apply. `ask-when-uncertain` decides *whether* to ask
      and demands one question per turn with numbered options.
      `direct-answers` shapes *how* the question reads — no flattery,
      no padding, shortest form that fully states the choice.
    evidence:
      - .agent-src.uncondensed/rules/ask-when-uncertain.md#iron-law--one-question-per-turn-always
      - .agent-src.uncondensed/rules/direct-answers.md#iron-law-3--brevity-by-default

  - id: scope-x-verify-before-complete
    rules: [verify-before-complete, scope-control]
    relation: complements
    conflict: >-
      Agent has just finished a change that touches user-permission-gated
      operations (push, branch, PR, tag) and is preparing to claim "done"
      in the same turn. Both rules can fire: `verify-before-complete`
      gates the completion claim on fresh evidence; `scope-control`
      gates the git operation on explicit permission this turn.
    resolution: >-
      Both rules apply independently and compose. The
      `verify-before-complete` Iron Law still requires fresh
      verification output in this message before any "done" claim,
      regardless of whether the user has authorised the next git op.
      Conversely, verification passing does not authorise pushing or
      merging — those stay behind the `scope-control` permission gate.
      Skipping either is a rule violation; satisfying one does not
      satisfy the other.
    evidence:
      - .agent-src.uncondensed/rules/verify-before-complete.md#the-iron-law
      - .agent-src.uncondensed/rules/scope-control.md#git-operations--permission-gated

  - id: language-x-direct-answers
    rules: [language-and-tone, direct-answers]
    relation: complements
    conflict: >-
      User writes German; agent must mirror language AND avoid flattery,
      invented facts, padding. Both rules speak to reply shape.
    resolution: >-
      `language-and-tone` decides the language token (mirror user's last
      chat message); `direct-answers` decides content discipline (no
      flattery, verified facts, brevity). They compose: a brief, direct,
      flattery-free reply in the user's language. Neither weakens the
      other.
    evidence:
      - .agent-src.uncondensed/rules/language-and-tone.md#iron-law--mirror-the-users-language-always
      - .agent-src.uncondensed/rules/direct-answers.md#iron-law-1--no-flattery

  - id: ask-x-no-cheap-questions
    rules: [ask-when-uncertain, no-cheap-questions]
    relation: narrows
    conflict: >-
      Two kernel rules with opposite defaults fire on the same moment.
      `ask-when-uncertain` Iron Law: "ONE QUESTION PER TURN. NO
      EXCEPTIONS." plus "When in doubt, ask." `no-cheap-questions` Iron
      Law: "NEVER ASK WHAT CONTEXT ANSWERS", enforced by a 14-point
      pre-send self-check whose every branch ends in "don't ask".
      Undeclared until now, so nothing said which wins.
    resolution: >-
      They compose; they do not compete, once the split is stated.
      `ask-when-uncertain` decides whether a genuine decision point
      exists and owns the shape (one per turn, numbered options).
      `no-cheap-questions` is the narrower filter on that set: it
      removes asks whose answer is already in the stated context, asks
      that offer an Iron-Law-violating option, and asks that differ only
      in sequencing. It never manufactures silence where real ambiguity
      remains — its own closing line is "In doubt → ask: this rule
      narrows asking, never widens silence." So the composed test is
      ask iff (context does not answer it) AND (proceeding on the wrong
      branch is destructive or expensive). When the filter and the
      trigger genuinely disagree, `ask-when-uncertain` wins: a
      suppressed question that was real costs more than one extra turn.
    evidence:
      - .agent-src.uncondensed/rules/ask-when-uncertain.md#iron-law--one-question-per-turn-always
      - .agent-src.uncondensed/rules/no-cheap-questions.md#the-iron-laws

  - id: interrupt-x-no-cheap-questions
    rules: [user-interrupt-priority, no-cheap-questions]
    relation: overrides
    conflict: >-
      The user interrupts with a new task; the agent finishes it and must
      decide whether to resume the interrupted one. `user-interrupt-priority`
      mandates the ask ("THEN ASK BEFORE RESUMING THE OLD TASK") and states it
      holds "regardless of `personal.autonomy`, standing autonomy directives,
      or roadmap authorization". `no-cheap-questions` Iron Law 4 forbids it
      under exactly those conditions ("STANDING AUTONOMOUS MANDATE ACTIVE →
      NEVER ASK 'WEITER? / NEXT STEP? / SHALL I CONTINUE?'"). A
      `/roadmap:process-full` invocation is itself a listed mandate trigger, so
      the contradiction is live in the package's own execution commands.
    resolution: >-
      `user-interrupt-priority` wins: the resume ask survives the mandate. The
      two are only superficially the same question. Iron Law 4 suppresses a
      *continuation prompt* — "a clean edit-batch is not a halt condition", i.e.
      the agent asking permission to keep doing the work it was already told to
      do. The resume ask is a *task-boundary decision the user themselves
      created* by interrupting: which of two deliverables to work on next. The
      agent cannot answer it from context, because the user's interrupt is the
      only evidence of their current priority. Resume-after-interrupt is
      therefore added to Iron Law 4's halt list in
      `contexts/execution/cheap-question-mechanics.md` as a sixth condition.
    evidence:
      - .agent-src.uncondensed/rules/user-interrupt-priority.md#the-iron-law
      - .agent-src.uncondensed/rules/no-cheap-questions.md#iron-law-4--no-continuation-prompts-under-autonomous-mandate
      - src/agent-src/contexts/execution/cheap-question-mechanics.md

  - id: ndd-x-engineering-safety-floor
    rules: [non-destructive-by-default, engineering-safety-floor]
    relation: restates
    conflict: >-
      Both open with an unqualified supremacy claim over the same surface.
      `non-destructive-by-default`: "HARD FLOOR OVERRIDES EVERYTHING."
      `engineering-safety-floor`: "HARD FLOOR OVERRIDES EVERYTHING. DEPLOY,
      MERGE-TO-PROD-TRUNK, PROD DATA / INFRA, BULK DESTRUCTIVE — EXPLICIT
      USER CONFIRMATION ON THIS TURN." Read cold, two rules assert final
      authority over deploys and prod-trunk merges with no stated order.
    resolution: >-
      `non-destructive-by-default` is canonical; `engineering-safety-floor`
      restates its triggers for the engineering surface and adds the
      evidence the user needs to judge the call — blast radius, rollback
      path, pre-flight checks, observability, named risk owner. Its own
      body already says so ("This rule does not lift the Hard Floor — it
      surfaces the engineering-shaped evidence"), which is why this is a
      restatement rather than a contest. Declared so the ordering is
      machine-readable instead of inferable only by reading both bodies.
    evidence:
      - .agent-src.uncondensed/rules/non-destructive-by-default.md#the-iron-law
      - .agent-src.uncondensed/rules/engineering-safety-floor.md#iron-law--production-infra-and-bulk-destructive-moves-are-never-autonomous

  - id: context-hygiene-x-autonomous-execution
    rules: [context-hygiene, autonomous-execution]
    relation: gates
    conflict: >-
      `autonomous-execution` grants a standing mandate to keep working
      without trivial questions. `context-hygiene`'s read-loop abort fires
      at 5 read-only turns and declares itself "Non-bypassable: an
      autonomous mandate does **not** lift the abort". So the mandate says
      continue and the abort says stop, on the same turn, with neither
      naming the other.
    resolution: >-
      `context-hygiene` gates: the abort holds and the mandate does not lift
      it. That is deliberate — the abort is the safety net that keeps
      autonomy from becoming a token sink, so a rule that autonomy could
      switch off would be worthless. What the mandate DOES lift is the
      cheap-question floor around it: the agent stops and states what it
      has, rather than asking permission to continue reading. The declared
      read protocol (goal + expected count + output shape) raises the abort
      to 8 turns for legible analysis work instead of suspending it.
    evidence:
      - .agent-src.uncondensed/rules/context-hygiene.md#read-loop-detection--the-15--25-rule
      - .agent-src.uncondensed/rules/autonomous-execution.md#validation-loop-budget--hard-cap-n3-per-target

  - id: secret-guard-x-commit-policy
    rules: [secret-vcs-guard, commit-policy]
    relation: gates
    conflict: >-
      `commit-policy` names four exceptions under which committing is
      allowed and forbids even asking about it otherwise.
      `secret-vcs-guard` requires a STOP-and-ask on a high-confidence
      credential match at exactly the moment a commit is authorized —
      "NEVER SILENTLY COMMIT A SECRET. NEVER SILENTLY STRIP ONE." One rule
      forbids the commit question; the other mandates one.
    resolution: >-
      `secret-vcs-guard` gates every commit path, including an authorized
      one. `commit-policy`'s "never ask about committing" bans the
      permission question ("should I commit?"), not a safety surface: the
      secret prompt is not asking whether to commit, it is reporting that
      the staged content contains a live credential and that committing it
      is irreversible. Same shape as the `no-pr-progress-comments` safety
      carve-out. The commit proceeds only on an explicit user choice, and
      the agent never auto-strips.
    evidence:
      - .agent-src.uncondensed/rules/secret-vcs-guard.md#the-iron-law
      - .agent-src.uncondensed/rules/commit-policy.md#never-ask-about-committing

  - id: fast-path-marker-x-session-canary
    rules: [fast-path-marker-visibility, session-canary]
    relation: overrides
    conflict: >-
      Both rules claim the reply's FIRST line, literally.
      `fast-path-marker-visibility`: "First non-whitespace line of the reply
      is the marker. No prose, greeting, or restating-the-question above it."
      `session-canary`: the first reply of every new task "opens by addressing
      the user by that name". On a task-start turn that also resolves through
      the low-impact fast path, both cannot be first.
    resolution: >-
      The marker wins the first line; the greeting moves to the first prose
      line directly beneath it. The marker is an audit signal that downstream
      agents and tooling pattern-match on, and its wording is normative — a
      greeting above it breaks the match. The canary is a liveness signal for
      a human reader, and it survives intact one line lower. Neither rule
      loses its function; only the ordering needed stating.
    evidence:
      - .agent-src.uncondensed/rules/fast-path-marker-visibility.md#the-iron-law
      - .agent-src.uncondensed/rules/session-canary.md#the-two-canaries

  - id: direct-answers-x-role-mode-adherence
    rules: [role-mode-adherence, direct-answers]
    relation: overrides
    conflict: >-
      Both rules claim the reply's LAST line. `direct-answers` Iron Law 3
      (restated by `session-canary`): a PR created this turn puts its raw URL
      as "the **literal last line**". `role-mode-adherence`: every closing
      output ends with the structured mode marker
      `<!-- role-mode: … -->`. A turn that creates a PR while a role mode is
      active cannot satisfy both as written.
    resolution: >-
      The mode marker goes last; the PR URL is the last line of PROSE,
      immediately above it. The marker is an HTML comment — invisible in
      rendered output — so a human still reads the URL as the closing line,
      which is the purpose the literal-last-line rule serves (a scannable
      handle, not a byte offset). A visible line below the URL would break
      that purpose; an invisible one does not. Where no role mode is active
      the marker is absent and the URL is last unconditionally.
    evidence:
      - .agent-src.uncondensed/rules/direct-answers.md#iron-law-3--brevity-by-default
      - .agent-src.uncondensed/rules/role-mode-adherence.md

  - id: autonomous-execution-x-user-interrupt-priority
    rules: [user-interrupt-priority, autonomous-execution]
    relation: overrides
    conflict: >-
      A standing autonomy directive is active and the user sends a NEW
      instruction mid-flight. Autonomy says keep working without asking;
      user-interrupt-priority says stop the current task, run the new one, and
      ask before resuming.
    resolution: >-
      The interrupt wins. Autonomy suppresses TRIVIAL workflow questions; it
      never authorizes ignoring a fresh instruction or silently resuming the
      interrupted task afterwards. Both rules already say so in prose — this
      row exists because the register covered both rules while omitting the one
      pair between them, which is the closure gap `lint_rule_interactions`
      now checks for.
    evidence:
      - src/rules/user-interrupt-priority.md#the-iron-law
      - src/rules/autonomous-execution.md#user-interrupts-override-the-current-task

  - id: downstream-changes-x-token-efficiency
    rules: [downstream-changes, token-efficiency]
    relation: narrows
    conflict: >-
      A rename or signature change requires reading every caller, test and
      import. `token-efficiency` forbids calling the same tool more than twice
      in a row with similar parameters, which an N-file sweep exceeds
      immediately.
    resolution: >-
      An enumerated file set is ONE operation, not N repetitions. The ceiling
      counts repetition WITHOUT NEW INFORMATION — the same target re-read
      hoping for a different answer. A declared set whose members were known
      before the first call returns different content every time and is
      exempt. `token-efficiency` names this conflict as "direct" in its own
      body; the register row is what makes the resolution findable from either
      side rather than only from the rule that happened to mention it.
    evidence:
      - src/rules/token-efficiency.md#enumerated-file-sets-are-one-operation-not-n-repetitions
      - src/rules/downstream-changes.md#the-iron-law

  - id: downstream-changes-x-context-hygiene
    rules: [downstream-changes, context-hygiene]
    relation: narrows
    conflict: >-
      Same collision as the `token-efficiency` pair, against a second ceiling:
      `context-hygiene`'s tool-loop detector treats more than two same-tool
      calls in a row as a loop, which a downstream-caller sweep trips.
    resolution: >-
      Identical carve-out, stated independently in both rules: "similar
      parameters" is the load-bearing phrase, and walking N declared distinct
      targets is one operation whose parameters differ every call. Recorded as
      its own row rather than folded into the `token-efficiency` one because
      the two ceilings are separate mechanisms — satisfying one does not
      satisfy the other, and a reader hitting the loop detector will not think
      to look under token efficiency.
    evidence:
      - src/rules/context-hygiene.md#tool-loop-detection
      - src/rules/downstream-changes.md#the-iron-law

  - id: minimal-safe-diff-x-active-remediation
    rules: [minimal-safe-diff, active-remediation]
    relation: gates
    conflict: >-
      The agent passes a real defect — dead code, a missing check, duplication
      — that sits outside the stated task. `active-remediation` says never
      ignore it; `minimal-safe-diff` says every line in the diff must trace to
      the task.
    resolution: >-
      `minimal-safe-diff` bounds the fix, `active-remediation` bounds the
      silence. Small AND task-aligned (all five fix-now conditions) → fix it in
      the same change with its test. Anything wider → note it, finish the task,
      ask afterwards; never a drive-by edit and never a silent drop. The one
      interrupt is a live cross-user or cross-tenant exposure, which is
      surfaced immediately regardless of size.
    evidence:
      - src/rules/active-remediation.md#the-iron-law
      - src/rules/minimal-safe-diff.md#own-orphan-cleanup

  - id: no-cheap-questions-x-active-remediation
    rules: [no-cheap-questions, active-remediation]
    relation: gates
    conflict: >-
      The agent spotted a real defect it may not fix autonomously — a red gate,
      a lint batch, a stale idiom outside the fix-now bar — while a standing
      autonomous mandate is running. `active-remediation` says an undecided
      issue must reach the user; `no-cheap-questions` forbids continuation
      prompts and content-free asks.
    resolution: >-
      `no-cheap-questions` bounds the shape, `active-remediation` bounds the
      silence. The Pre-Send Self-Check runs first: a finding with no nameable
      benefit or no real trade-off is dropped silently and never becomes a
      question. What survives is asked ONCE, batched after delivery, as
      numbered candidate fixes plus an explicit "leave it" and one
      recommendation line — never "shall I continue?", never a bare yes/no
      flag. Suppression is the only outcome the check licenses; a mention in
      the closing summary with no decision attached is neither asking nor
      dropping, and is what both rules reject.
    evidence:
      - src/rules/active-remediation.md#the-ask-carries-fixes-not-a-flag
      - src/rules/no-cheap-questions.md#pre-send-self-check--mandatory-before-every-question

  - id: cross-source-consistency-x-design-fidelity
    rules: [cross-source-consistency, design-fidelity]
    relation: gates
    conflict: >-
      Ticket text and an attached mockup disagree, and the agent is about to
      build UI. `design-fidelity` says the provided artifact is the spec and
      must be built 1:1; `cross-source-consistency` says a contradiction
      between two present sources must be surfaced before proceeding.
    resolution: >-
      They fire in sequence, not in competition. `cross-source-consistency`
      runs FIRST, at decision time — "the text says X, the mockup says Y,
      which wins?" Once the user resolves it, `design-fidelity` governs
      build-time fidelity against whichever source won. Building 1:1 from an
      unresolved contradiction is the failure both rules exist to prevent.
    evidence:
      - src/rules/cross-source-consistency.md#how-to-surface-it-subordinate-to-the-ask-discipline
      - src/rules/design-fidelity.md#the-iron-law

  - id: ask-when-uncertain-x-cross-source-consistency
    rules: [ask-when-uncertain, cross-source-consistency]
    relation: gates
    conflict: >-
      Two present sources disagree AND the turn already owes a clarifying
      question. `cross-source-consistency` requires the discrepancy be
      surfaced; `ask-when-uncertain` allows exactly one question per turn.
    resolution: >-
      The discrepancy folds into the SAME turn's single question. All
      discrepancies for one artefact batch into ONE numbered-options block;
      a second question block is never emitted. One-question-per-turn is the
      canonical constraint and the discrepancy is a payload inside it, not an
      exemption from it.
    evidence:
      - src/rules/cross-source-consistency.md#how-to-surface-it-subordinate-to-the-ask-discipline
      - src/rules/ask-when-uncertain.md#iron-law--one-question-per-turn-always

  - id: scope-control-x-cross-source-consistency
    rules: [scope-control, cross-source-consistency]
    relation: gates
    conflict: >-
      The spec is silent on a behaviour that is clearly required (a holiday
      shift, an empty state). `cross-source-consistency` calls this a
      silent-but-needed discrepancy; whether the agent may simply ADD the
      behaviour is a scope question.
    resolution: >-
      `scope-control` is the permission authority. An inferred-but-unspecified
      behaviour is a scope expansion, so it is asked, never added silently —
      obvious-to-the-agent is not the same as in-scope.
      `cross-source-consistency` decides that the gap must be surfaced;
      `scope-control` decides that it may not be closed unilaterally.
    evidence:
      - src/rules/cross-source-consistency.md#how-to-surface-it-subordinate-to-the-ask-discipline
      - src/rules/scope-control.md

  - id: context-hygiene-x-token-efficiency
    rules: [context-hygiene, token-efficiency]
    relation: restates
    conflict: >-
      Both rules cap consecutive same-tool calls at two, and both must exempt
      an enumerated multi-file sweep. Two ceilings with one carve-out stated
      twice drift apart the moment one side is edited.
    resolution: >-
      The carve-out is identical by intent and each rule says so — the
      discriminator is "did the previous call change what I know", not the
      tool name. Recorded as a `restates` pair so the duplication is declared
      rather than accidental: an edit to either carve-out that is not mirrored
      is now a visible divergence between two rules the register pairs.
    evidence:
      - src/rules/context-hygiene.md#tool-loop-detection
      - src/rules/token-efficiency.md#enumerated-file-sets-are-one-operation-not-n-repetitions
